name: daily-radar

on:
  schedule:
    # 23:30 UTC = 07:30 Asia/Shanghai。GitHub 的 cron 可能延迟数小时或漏触发；后续时段兜底
    - cron: "30 23 * * *"
    # 08:47 / 10:13 Shanghai：已完成则跳过抓取与翻译
    - cron: "47 0 * * *"
    - cron: "13 2 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "回看小时数（留空则用 config.json 里的 lookback_hours）"
        required: false
        default: ""
      backfill:
        description: "补历史：按发表日期而不是今天写入 first_seen"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RADAR_TRANSLATION_CACHE: ${{ github.workspace }}/../radar-translation-models
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Decide whether a scheduled retry is needed
        id: gate
        run: python3 -B scripts/daily_update_needed.py --event "${{ github.event_name }}" --output "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.gate.outputs.needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-translation.txt

      - name: Install CPU translation runtime
        if: steps.gate.outputs.needed == 'true'
        run: python -m pip install --prefer-binary -r requirements-translation.txt

      - name: Restore offline model cache
        if: steps.gate.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.RADAR_TRANSLATION_CACHE }}
          key: qwen3-4b-instruct-q4-v1

      - name: Prepare offline model
        if: steps.gate.outputs.needed == 'true'
        run: python -B -u -m radar.offline_translate prepare

      - name: Check translation regressions
        if: steps.gate.outputs.needed == 'true'
        run: python -B -m unittest discover -s tests

      - name: Fetch, score, render
        if: steps.gate.outputs.needed == 'true'
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOURS: ${{ inputs.hours }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ -n "${HOURS:-}" ]; then ARGS="--hours ${HOURS}"; fi
          if [ "${BACKFILL:-false}" = "true" ]; then ARGS="${ARGS} --backfill"; fi
          python3 -u -B -m radar run ${ARGS}

      - name: Stage changes
        if: steps.gate.outputs.needed == 'true'
        id: stage
        run: |
          git add -A
          git diff --cached --stat | tail -25
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有新条目，跳过提交"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.gate.outputs.needed == 'true' && steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git commit -m "radar: $(date -u +%Y-%m-%d) 自动更新"
          git push

      # Persist completed translations before reporting a missing-translation failure.
      # The next run can continue from this checkpoint instead of starting over.
      - name: Verify title and full abstract translation coverage
        if: steps.gate.outputs.needed == 'true'
        run: python -B -m radar.offline_translate verify

      - name: Summary
        if: always()
        run: |
          TODAY=$(python3 -B scripts/count_today.py || echo "n/a")
          {
            echo "### 科研雷达 $(date -u +%F)"
            echo ""
            echo "- 今日新增条目：${TODAY}"
            echo "- 看板：https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
            echo "- 有提交：${{ steps.stage.outputs.changed }}"
          } >> "$GITHUB_STEP_SUMMARY"
