name: offline-translation-check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RADAR_TRANSLATION_CACHE: ${{ github.workspace }}/../radar-translation-models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-translation.txt
      - name: Install CPU translation runtime
        run: python -m pip install -r requirements-translation.txt
      - name: Prepare public model weights
        run: python -B -u scripts/benchmark_translation.py --prepare --config "$RUNNER_TEMP/translation-trial.json"
      - name: Translate ten public papers with networking disabled
        run: python -B -u scripts/benchmark_translation.py --config "$RUNNER_TEMP/translation-trial.json" --output "$RUNNER_TEMP/translation-benchmark.json"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-translation-samples
          path: |
            ${{ runner.temp }}/translation-benchmark.json
            ${{ runner.temp }}/translation-trial.json
          retention-days: 7
