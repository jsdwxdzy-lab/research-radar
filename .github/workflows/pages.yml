name: publish-radar-pages

on:
  workflow_run:
    workflows: [daily-radar]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: radar-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publish and verify the public board
        env:
          GH_TOKEN: ${{ github.token }}
          RADAR_REPOSITORY: ${{ github.repository }}
        run: |
          python3 -u - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          repo = os.environ['RADAR_REPOSITORY']
          api = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']

          def request(path, method='GET'):
              req = urllib.request.Request(api + path, method=method, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'research-radar-pages',
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  raise SystemExit('Pages API request failed: HTTP ' + str(exc.code))

          expected = request('/git/ref/heads/main')['object']['sha']
          index_sha = request('/contents/index.html?ref=' + expected)['sha']
          request('/pages/builds', 'POST')
          print('Requested Pages build for ' + expected, flush=True)
          deadline = time.monotonic() + 480
          owner, name = repo.split('/')
          public_url = 'https://' + owner.lower() + '.github.io/' + name + '/'
          previous = None
          while time.monotonic() < deadline:
              build = request('/pages/builds/latest')
              state = build.get('status')
              current = (state, build.get('commit'))
              if current != previous:
                  print('Pages build: ' + str(state) + ' ' + str(build.get('commit')), flush=True)
                  previous = current
              if state == 'errored' and build.get('commit') == expected:
                  raise SystemExit('Pages build failed for the expected commit')
              if state == 'built' and build.get('commit') == expected:
                  try:
                      req = urllib.request.Request(public_url, headers={'User-Agent': 'research-radar-pages-verify'})
                      with urllib.request.urlopen(req, timeout=30) as response:
                          raw = response.read()
                      blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                      if blob == index_sha:
                          print('Public board matches published commit: ' + expected, flush=True)
                          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                              summary.write('### 公开看板已更新\n\n- 提交：`' + expected + '`\n- 地址：' + public_url + '\n')
                          break
                  except (OSError, urllib.error.URLError):
                      pass
              time.sleep(10)
          else:
              raise SystemExit('Pages did not publish the expected board before the deadline')
          PY
