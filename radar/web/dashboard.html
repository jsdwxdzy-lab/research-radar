<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研雷达 · Research Radar</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --text:#15181e; --muted:#6b7280;
  --line:#e4e7ec; --line-2:#eef0f4; --accent:#4f46e5; --accent-2:#eef2ff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1014; --panel:#15181e; --panel-2:#1a1e26; --text:#e7e9ee; --muted:#98a1b0;
  --line:#252b35; --line-2:#1e232c; --accent:#8b93ff; --accent-2:#20243a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#0e1014; --panel:#15181e; --panel-2:#1a1e26; --text:#e7e9ee; --muted:#98a1b0;
    --line:#252b35; --line-2:#1e232c; --accent:#8b93ff; --accent-2:#20243a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none !important}
.muted{color:var(--muted)}
.spacer{flex:1}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:.02em;white-space:nowrap}
.brand .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:8px 12px 8px 30px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.search .ico{position:absolute;left:10px;top:8px;color:var(--muted);font-size:13px}
.tops{display:flex;gap:6px;align-items:center}
.tops button{padding:7px 11px;border-radius:8px;border:1px solid transparent;color:var(--muted);font-size:13px}
.tops button:hover{background:var(--panel-2);color:var(--text)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;padding:14px 12px 40px;
  border-right:1px solid var(--line);background:var(--panel)}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:18px 6px 8px;font-weight:600}
.viewlist{display:flex;flex-direction:column;gap:1px}
.view{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--text);font-size:13px;width:100%;text-align:left}
.view:hover{background:var(--panel-2)}
.view.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.view .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.view.on .n{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:5px;padding:0 4px}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.on{background:color-mix(in srgb,hsl(var(--h,220) 65% 55%) 16%,transparent);
  border-color:hsl(var(--h,220) 60% 55%);color:hsl(var(--h,220) 55% 42%)}
html[data-theme="dark"] .fchip.on{color:hsl(var(--h,220) 80% 72%)}
.fchip .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,220) 60% 55%)}
.datelist{display:flex;flex-direction:column;gap:1px;max-height:320px;overflow-y:auto}
.date{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:7px;font-size:12.5px;color:var(--muted);width:100%;text-align:left}
.date:hover{background:var(--panel-2);color:var(--text)}
.date.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.date .n{margin-left:auto;font-family:var(--mono);font-size:11px}
.health{margin-top:22px;padding:10px 8px 0;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.health div{display:flex;gap:6px;align-items:center;padding:2px 0}
.health .ok{color:#16a34a}.health .bad{color:#dc2626}

/* ---------- main ---------- */
.main{padding:18px 22px 80px;max-width:1020px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.crumb{font-size:15px;font-weight:650}
.crumb small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.tool{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);font-size:12.5px;color:var(--muted)}
.tool:hover{border-color:var(--accent);color:var(--accent)}
select.tool{appearance:none;padding-right:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* overview + why */
.overview{margin:0 0 12px;padding:12px 16px;border-left:3px solid var(--accent)}
.overview .ovhead{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
.overview p{margin:0;font-size:13.5px;line-height:1.7}
.cwhy{margin-top:8px;font-size:12.5px;color:color-mix(in srgb,var(--accent) 45%,var(--text));
  background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:7px;padding:6px 9px;line-height:1.6}

/* trend */
.trend{margin:6px 0 14px;padding:12px 14px}
.trend-head{display:flex;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.trend-head .mini{margin-left:auto;color:var(--accent);font-size:12px}
.trend-body{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.trow{display:grid;grid-template-columns:74px 1fr 66px;align-items:center;gap:10px;padding:5px 6px;border-radius:8px;text-align:left}
.trow:hover{background:var(--panel-2)}
.trow.on{background:var(--accent-2)}
.tname{font-size:12px;font-weight:600;color:hsl(var(--h,220) 55% 42%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="dark"] .tname{color:hsl(var(--h,220) 80% 70%)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;border-bottom:1px solid var(--line-2)}
.spark .bar{flex:1;background:hsl(var(--h,220) 60% 78%);border-radius:2px 2px 0 0;min-height:2px}
.spark .bar.now{background:hsl(var(--h,220) 60% 52%)}
.tnum{font-family:var(--mono);font-size:12px;text-align:right}
.tnum i{font-style:normal;font-size:10.5px;margin-left:4px}
.tnum .up{color:#16a34a}.tnum .down{color:#dc2626}
.tnum .new{color:var(--accent)}.tnum .flat{color:var(--muted)}

/* cards */
.daybar{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:13px}
.daybar b{font-family:var(--mono)}
.daybar .wd{color:var(--muted)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid hsl(var(--h,220) 55% 65%);
  border-radius:10px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow);transition:border-color .12s}
.card:hover{border-color:var(--line);border-left-color:hsl(var(--h,220) 55% 55%)}
.card.read{opacity:.62}
.card.read:hover{opacity:1}
.card.focus{outline:2px solid var(--accent);outline-offset:1px}
.chead{display:flex;align-items:flex-start;gap:8px}
.ctitle{flex:1;font-weight:600;font-size:14.5px;line-height:1.42}
.ctitle a:hover{color:var(--accent)}
.zh{margin-top:2px;font-weight:500;font-size:13px;color:var(--text)}
.zhabs{color:var(--text)}
.trust{margin-left:4px;font-size:10.5px;padding:1px 5px;border-radius:999px;border:1px solid var(--line)}
.trust.high{color:#15803d;border-color:#86efac}
.trust.mid{color:var(--muted)}
.trust.low{color:#a16207;border-color:#fcd34d}
.icon{width:24px;height:24px;border-radius:6px;color:var(--muted);line-height:1;display:grid;place-items:center;flex:0 0 auto}
.icon:hover{background:var(--panel-2);color:var(--accent)}
.btn-star.on{color:#f59e0b}
.score{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel-2);
  padding:2px 6px;border-radius:6px;flex:0 0 auto;margin-top:2px}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 0;font-size:11.5px;color:var(--muted)}
.chip{padding:1.5px 7px;border-radius:999px;font-size:11px;
  background:color-mix(in srgb,hsl(var(--h,220) 65% 55%) 14%,transparent);
  color:hsl(var(--h,220) 55% 40%);border:1px solid color-mix(in srgb,hsl(var(--h,220) 65% 55%) 28%,transparent)}
html[data-theme="dark"] .chip{color:hsl(var(--h,220) 80% 74%)}
.chip.kind{--h:0;background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.venue{font-style:italic}
.who{color:#7c3aed}
.multi{background:var(--panel-2);padding:1px 6px;border-radius:999px;border:1px solid var(--line)}
.ckw{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ckw span{font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:5px;padding:1px 6px;
  border:1px solid var(--line-2);font-family:var(--mono)}
.cabs{margin-top:7px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .cabs{-webkit-line-clamp:unset;display:block}
.cfoot{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.link{color:var(--muted)}
.link:hover{color:var(--accent)}
.more{border-top:1px dashed var(--line);margin-top:9px;padding-top:8px;font-size:12px;color:var(--muted)}
.mrow{margin:3px 0}
.mrow b{color:var(--text);font-weight:600;margin-right:6px}
textarea.note{width:100%;margin-top:8px;min-height:46px;resize:vertical;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);padding:7px 9px;font-size:12.5px;font-family:inherit;outline:none}
textarea.note:focus{border-color:var(--accent)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:6px}
.morebtn{width:100%;margin:10px 0 0;padding:10px;border-radius:10px;border:1px dashed var(--line);
  color:var(--muted);font-size:12.5px}
.morebtn:hover{border-color:var(--accent);color:var(--accent)}

/* calendar */
.events{margin-top:18px;padding:12px 14px}
.events h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.ev{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.ev b{font-family:var(--mono);color:var(--accent);min-width:44px}
.ev em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}

/* stats */
.stats{margin-top:18px;padding:12px 14px}
.stats h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.stats .grp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.stats .grp b{font-size:11px;color:var(--muted);font-weight:600;width:100%;margin-bottom:2px}
.stats .kv{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line-2);color:var(--muted)}
.stats .kv:hover{border-color:var(--accent);color:var(--accent)}
.stats .kv i{font-style:normal;font-family:var(--mono);font-size:10.5px;margin-left:4px;opacity:.7}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* toast + help */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#111827;color:#fff;
  padding:9px 14px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.help{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:70}
.help .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:420px;width:92%}
.help h4{margin:0 0 10px}
.help table{width:100%;border-collapse:collapse;font-size:12.5px}
.help td{padding:3px 0;color:var(--muted)}
.help td:first-child{width:96px;color:var(--text);font-family:var(--mono)}
.err{position:fixed;left:12px;bottom:12px;right:12px;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;
  padding:10px;border-radius:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;z-index:99}

@media print{
  .sidebar,.tops,.search .ico,.toolbar,#trend,#events,#stats,.cfoot,.icon,.btn-more,.toast,.help{display:none !important}
  .layout{display:block}
  .main{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd;border-left-width:3px}
  body{background:#fff}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-height:none}
  .sidebar>section:last-of-type,.health{grid-column:1/-1}
  .datelist{flex-direction:row;overflow-x:auto;max-height:none}
  .date{white-space:nowrap}
  .trend-body{grid-template-columns:1fr}
  .main{padding:14px 12px 60px}
  .topbar{gap:8px;padding:9px 12px}
  .brand .sub{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">科研雷达 <span class="sub" id="generated"></span></div>
  <div class="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="搜索标题 / 摘要 / 作者 / 期刊 …  按 / 聚焦" autocomplete="off">
  </div>
  <div class="tops">
    <button id="btnTheme" title="深浅色">◐</button>
    <button id="btnHelp" title="快捷键 (?)">?</button>
    <button id="btnExport" title="导出当前列表">导出</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="viewlist" id="views"></nav>

    <section>
      <h3>主题分区</h3>
      <div class="filters" id="topicFilter"></div>
    </section>

    <section>
      <h3>来源</h3>
      <div class="filters" id="sourceFilter"></div>
    </section>

    <section>
      <h3>历史日报</h3>
      <div class="datelist" id="dateList"></div>
    </section>

    <div class="health" id="health"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <select class="tool" id="sort">
        <option value="score">按相关度</option>
        <option value="date">按时间</option>
        <option value="venue">按期刊</option>
        <option value="topic">按主题分区</option>
      </select>
      <button class="tool" id="btnReadAll" title="把当前列表全部标记已读">全部已读</button>
      <button class="tool" id="btnClear">清除筛选</button>
    </div>

    <div class="panel overview" id="overview"></div>
    <div class="panel trend" id="trend"></div>
    <div id="list"></div>
    <div class="panel stats" id="stats"></div>
    <div class="panel events" id="events"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="helpHost"></div>

<script>
const DATA = /*__DATA__*/null;
(function(){
'use strict';
if(!DATA){ document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">这是模板文件。请先运行 <code>python3 -m radar dashboard</code> 生成 dashboard.html。</p>'; return; }

window.onerror=function(msg,src,line,col){ var d=document.createElement('div'); d.className='err';
  d.textContent='JS 错误：'+msg+' @'+line+':'+col; document.body.appendChild(d); };

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=86400000;
const TODAY=DATA.today;
const TOPICS=DATA.topics||[], TNAME={}, THUE={};
TOPICS.forEach(t=>{TNAME[t.id]=t.short||t.id; THUE[t.id]=t.hue;});
const DATA_ITEMS=DATA.items||[];
const DATA_DAYS=(DATA.days||[]).map(d=>({d:d.d,n:d.n}));
let ITEMS=DATA_ITEMS.slice();
let DAYS=DATA_DAYS.slice();
const EVENTS=DATA.events||[], TREND=DATA.trends||{};
const SRCNAME={arxiv:'arXiv',crossref:'期刊',openalex:'OpenAlex',rss:'新闻',github:'工具'};

const LS='research-radar.v1';
const DEFAULTS={view:'today',topics:[],sources:[],q:'',date:null,sort:'score',
  read:{},star:{},kept:{},note:{},theme:'auto',lastVisit:0,limit:80};
let state=Object.assign({},DEFAULTS);
let view=[], focusIdx=-1, saveTimer=null;
const openSet=new Set();   // expanded cards survive re-renders

function load(){
  try{ const raw=localStorage.getItem(LS); if(raw) state=Object.assign({},DEFAULTS,JSON.parse(raw)); }
  catch(e){ console.warn('localStorage 不可用：阅读状态仅在本次会话有效',e); }
}
function save(){
  try{ localStorage.setItem(LS,JSON.stringify(state)); }
  catch(e){ toast('浏览器存不下更多收藏副本'); }
}
function touch(){ save(); }
function itemCopy(it){
  return {
    k:it.k, t:it.t, tz:it.tz||'', a:it.a||'', az:it.az||'', au:it.au||[], v:it.v||'', u:it.u||'',
    p:it.p||'', d:it.d||'', s:it.s||0, tp:it.tp||[], kw:it.kw||[],
    src:it.src||[], kind:it.kind||'paper', ax:it.ax||'', doi:it.doi||'',
    who:it.who||[], why:it.why||'', rv:it.rv||'', tr:it.tr||'', tw:it.tw||''
  };
}
function applyKept(){
  if(!state.kept || typeof state.kept!=='object') state.kept={};
  const live={};
  DATA_ITEMS.forEach(it=>{ live[it.k]=it; });
  Object.keys(state.star||{}).forEach(k=>{ if(live[k]) state.kept[k]=itemCopy(live[k]); });
  Object.keys(state.kept).forEach(k=>{ if(!state.star[k]) delete state.kept[k]; });
  const extra=[];
  Object.keys(state.kept).forEach(k=>{
    if(!live[k] && state.kept[k]) extra.push(state.kept[k]);
  });
  ITEMS=DATA_ITEMS.concat(extra);
  const counts={};
  DATA_DAYS.forEach(d=>{ counts[d.d]=d.n; });
  extra.forEach(it=>{ if(it.d) counts[it.d]=(counts[it.d]||0)+1; });
  DAYS=Object.keys(counts).sort((a,b)=>b.localeCompare(a)).map(d=>({d:d, n:counts[d]}));
}

function daysAgo(d){ try{ return Math.round((new Date(TODAY+'T00:00:00')-new Date(d+'T00:00:00'))/DAY);}catch(e){ return 999; } }
function weekday(d){ try{ return '日一二三四五六'[new Date(d+'T00:00:00').getDay()]; }catch(e){ return ''; } }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600); }

/* ---------------- filtering ---------------- */
function inView(it){
  const v=state.view;
  if(v==='today') return it.d===TODAY;
  if(v==='unread') return !state.read[it.k];
  if(v==='star') return !!state.star[it.k];
  if(v==='week') return daysAgo(it.d)<=6;
  if(v==='day') return it.d===state.date;
  return true;
}
function base(){ return ITEMS.filter(inView); }
function matches(it){
  if(!inView(it)) return false;
  if(state.topics.length && !it.tp.some(t=>state.topics.includes(t))) return false;
  if(state.sources.length && !it.src.some(s=>state.sources.includes(s))) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const hay=(it.t+' '+(it.tz||'')+' '+(it.a||'')+' '+(it.az||'')+' '+it.au.join(' ')+' '+it.v+' '+it.kw.join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function hl(text){
  const safe=esc(text);
  if(!state.q) return safe;
  try{
    const q=state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return safe.replace(new RegExp(q,'gi'), m=>`<mark>${m}</mark>`);
  }catch(e){ return safe; }
}
function sortItems(list){
  const s=state.sort;
  if(s==='topic'){
    const order={}; TOPICS.forEach((t,i)=>order[t.id]=i);
    return list.sort((a,b)=>{
      const ia=order[a.tp[0]]==null?99:order[a.tp[0]], ib=order[b.tp[0]]==null?99:order[b.tp[0]];
      return ia-ib || b.s-a.s;
    });
  }
  return list.sort((a,b)=>{
    if(s==='date') return (b.p||b.d).localeCompare(a.p||a.d)||b.s-a.s;
    if(s==='venue') return (a.v||'~').localeCompare(b.v||'~')||b.s-a.s;
    return b.s-a.s;
  });
}
function compute(){ view=sortItems(ITEMS.filter(matches)); }
function unreadCount(){ return ITEMS.filter(it=>!state.read[it.k]).length; }
function starCount(){ return ITEMS.filter(it=>state.star[it.k]).length; }

/* ---------------- trend ---------------- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lastDays(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(TODAY+'T00:00:00'); d.setDate(d.getDate()-i); out.push(ymd(d)); } return out; }
function renderTrend(){
  const days=lastDays(14);
  const rows=TOPICS.map(t=>{
    const ser=days.map(d=>(TREND[t.id]||{})[d]||0);
    const max=Math.max(1,...ser);
    const cur=ser.slice(7).reduce((a,b)=>a+b,0), prev=ser.slice(0,7).reduce((a,b)=>a+b,0);
    const dlabel=prev?`${cur>=prev?'+':''}${Math.round((cur-prev)/prev*100)}%`:(cur?'NEW':'–');
    const cls=!prev?(cur?'new':'flat'):(cur>=prev?'up':'down');
    const bars=ser.map((v,i)=>`<span class="bar${i>=7?' now':''}" style="height:${Math.max(2,v/max*26)}px" title="${days[i]} · ${v} 条"></span>`).join('');
    const on=state.topics.includes(t.id);
    return `<button class="trow${on?' on':''}" data-topic="${t.id}" style="--h:${t.hue}">
      <span class="tname">${esc(t.short)}</span>
      <span class="spark">${bars}</span>
      <span class="tnum">${cur}<i class="${cls}">${dlabel}</i></span>
    </button>`;
  }).join('');
  $('#trend').innerHTML=`<div class="trend-head">近 14 天各主题新增（前 7 天 vs 后 7 天，点一行可筛选）<button class="mini" id="toggleTrend">收起</button></div>
    <div class="trend-body" id="trendBody">${rows}</div>`;
  $('#trendBody').classList.toggle('hidden',!!state.trendHidden);
}
function toggleTrend(){ state.trendHidden=!state.trendHidden; touch(); $('#trendBody').classList.toggle('hidden',!!state.trendHidden); $('#toggleTrend').textContent=state.trendHidden?'展开':'收起'; }

/* ---------------- list ---------------- */
function chip(t){ return `<span class="chip" style="--h:${THUE[t]||210}">${esc(TNAME[t]||t)}</span>`; }
function card(it){

      <span class="score" title="相关度 ${it.s}${it.tw?' · '+it.tw:''}">${it.s}${trustLab?`<span class="trust ${esc(it.tr)}">可信${trustLab}</span>`:''}</span>
      <button class="icon btn-star${star?' on':''}" title="收藏 (s)">${star?'★':'☆'}</button>
    </div>
    <div class="cmeta">${it.tp.map(chip).join('')}${kind}
      ${it.v?`<span class="venue">${esc(it.v)}</span>`:''}

    ${it.az?`<div class="cabs zhabs"><strong>中文摘要：</strong>${esc(it.az)}</div>`:(it.a?'<div class="cabs zhabs">中文翻译待补齐</div>':'')}
    <div class="cabs"><strong>原文摘要：</strong>${esc(it.a)||'<i>（来源未提供摘要）</i>'}</div>

      <div class="mrow"><b>来源</b>${esc(it.src.map(s=>SRCNAME[s]||s).join(' / ')||'—')}</div>
      <textarea class="note" rows="2" placeholder="备注：为什么留它 / 和我的课题什么关系…">${esc(state.note[it.k]||'')}</textarea>
    </div>
  </article>`;
}
function renderList(){
  const list=$('#list');
  if(!view.length){
    const scope={today:'今天',week:'近 7 天',unread:'未读',star:'只看收藏',day:'这一天'}[state.view]||'当前视图';

function renderOverview(){

function toggleRead(k){ state.read[k]=!state.read[k]; if(!state.read[k]) delete state.read[k]; touch(); renderAll(); }
function toggleStar(k){
  if(state.star[k]) delete state.star[k];
  else state.star[k]=true;
  applyKept();
  touch();
  renderAll();

function markAllRead(){ view.forEach(it=>state.read[it.k]=true); touch(); renderAll(); toast('已把当前 '+view.length+' 条标记为已读'); }
function clearFilters(){ state.topics=[]; state.sources=[]; state.q=''; state.limit=DEFAULTS.limit; $('#q').value=''; touch(); renderAll(); }
function copyText(text,okMsg){
  const done=()=>toast(okMsg||'已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,()=>fallback()); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择');} ta.remove(); }
}
function bibtex(it){
  const year=(it.p||it.d||'').slice(0,4);
  const first=(it.au[0]||'anon').split(/\s+/).slice(-1)[0].toLowerCase().replace(/[^a-z]/g,'');
  const key=(first||'ref')+year+(it.k||'').replace(/[^a-z0-9]/gi,'').slice(-4);
  const authors=it.au.join(' and ');
  const fields=[`title = {${it.t}}`,authors?`author = {${authors}}`:'',it.v?`journal = {${it.v}}`:'',
    year?`year = {${year}}`:'',it.doi?`doi = {${it.doi}}`:'',it.ax?`eprint = {${it.ax}}`:(it.u?`url = {${it.u}}`:'')].filter(Boolean);
  return `@article{${key},\n  ${fields.join(',\n  ')}\n}`;
}
function mdOf(list){
  const lines=[`# 科研雷达 · ${TODAY} · 导出 ${list.length} 条`,''];
  list.forEach(it=>{
    lines.push(`- **[${it.t}](${it.u})**`);
    const meta=[it.v,it.p,it.tp.map(t=>TNAME[t]||t).join('/'),`相关度 ${it.s}`].filter(Boolean).join(' · ');
    lines.push(`  ${meta}`);
    if(it.a) lines.push(`  > ${it.a}`);
  });
  return lines.join('\n')+'\n';
}
function download(name,text){
  const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function setTheme(t){ state.theme=t; touch(); document.documentElement.dataset.theme=t; toast('主题：'+({auto:'跟随系统',light:'浅色',dark:'深色'}[t])); }

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-topic],[data-source],[data-date],[data-open],.btn-read,.btn-star,.btn-more,.btn-copy');
  if(!t) return;
  if(t.dataset.q!==undefined&&t.classList.contains('who')){ state.q=t.dataset.q; $('#q').value=state.q; state.limit=DEFAULTS.limit; touch(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.view){ state.view=t.dataset.view; state.date=null; state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.topic){ const id=t.dataset.topic; const i=state.topics.indexOf(id);
    if(i>=0) state.topics.splice(i,1); else state.topics.push(id);
    state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.source){ const id=t.dataset.source; const i=state.sources.indexOf(id);
    if(i>=0) state.sources.splice(i,1); else state.sources.push(id);
    state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.date){ state.view='day'; state.date=t.dataset.date; state.limit=DEFAULTS.limit; touch(); renderAll();
    window.scrollTo({top:0,behavior:'smooth'}); return; }
  const cardEl=t.closest('.card'); if(!cardEl) return; const k=cardEl.dataset.k;
  if(t.classList.contains('btn-read')){ toggleRead(k); return; }
  if(t.classList.contains('btn-star')){ toggleStar(k); return; }
  if(t.classList.contains('btn-more')){
    if(openSet.has(k)) openSet.delete(k); else openSet.add(k);
    cardEl.classList.toggle('open'); t.textContent=openSet.has(k)?'收起':'详情'; return; }
  if(t.classList.contains('btn-copy')){ const it=ITEMS.find(x=>x.k===k); if(it) copyText(bibtex(it),'已复制 BibTeX'); return; }
  if(t.dataset.open){ state.read[k]=true; touch(); const dot=cardEl.querySelector('.btn-read'); if(dot) dot.textContent='✓'; cardEl.classList.add('read'); renderViews(); }
});
document.addEventListener('input',e=>{

    saveTimer=setTimeout(()=>{touch(); renderAll();},140); return; }
  if(e.target.classList.contains('note')){

$('#btnTheme').onclick=()=>{ const order=['auto','light','dark']; setTheme(order[(order.indexOf(state.theme)+1)%3]); };
$('#btnHelp').onclick=()=>toggleHelp();
$('#helpHost').addEventListener('click',e=>{ if(e.target.closest('.help')===e.target||e.target.dataset.close!==undefined) toggleHelp(false); });
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') { if(e.key==='Escape') e.target.blur(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key==='?'){ e.preventDefault(); toggleHelp(); return; }
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); moveFocus(1); return; }
  if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); moveFocus(-1); return; }
  if(e.key==='Escape'){ toggleHelp(false); clearFilters(); return; }
  const el=document.querySelector('.card.focus'); if(!el){ if(['o','s','m','e'].includes(e.key)){ moveFocus(1);} else return; }
  const k=el&&el.dataset.k; if(!k) return;
  if(e.key==='o'){ const it=ITEMS.find(x=>x.k===k); if(it&&it.u){ state.read[k]=true; touch(); window.open(it.u,'_blank','noopener'); renderAll(); } }
  if(e.key==='s'){ toggleStar(k); }
  if(e.key==='m'){ toggleRead(k); }
  if(e.key==='e'){ if(openSet.has(k)) openSet.delete(k); else openSet.add(k);
    el.classList.toggle('open'); const b=el.querySelector('.btn-more'); if(b) b.textContent=openSet.has(k)?'收起':'详情'; }
});
function moveFocus(dir){
  const cards=$$('#list .card'); if(!cards.length) return;
  const cur=cards.findIndex(c=>c.classList.contains('focus'));
  focusIdx=cur<0?0:Math.max(0,Math.min(cards.length-1,cur+dir));
  cards.forEach(c=>c.classList.remove('focus'));
  const el=cards[focusIdx]; el.classList.add('focus'); el.scrollIntoView({block:'center',behavior:'smooth'});
}
function toggleHelp(force){

  host.innerHTML=`<div class="help"><div class="box"><h4>快捷键</h4><table>

    <tr><td>/</td><td>搜索</td></tr>
    <tr><td>Esc</td><td>关闭 / 清除筛选</td></tr></table>
    <p class="muted" style="font-size:12px;margin:10px 0 0">阅读状态、收藏、备注存在这台浏览器里，换浏览器不会同步。点星标会留下文章副本：超过 120 天或数据库清理之后，仍可在「只看收藏」和「全部」里看到。取消收藏后，过期文章不再保留。</p>
    </div></div>`;
}

/* ---------------- init ---------------- */
load();
applyKept();
if(state.view==='day'&&!state.date) state.view='today';
if(state.lastVisit){
  const fresh=ITEMS.filter(i=>i.d===TODAY&&!state.read[i.k]).length;
  if(fresh) setTimeout(()=>toast(`今天有 ${fresh} 条未读`),600);
}
state.lastVisit=Date.now(); save();
document.documentElement.dataset.theme=state.theme||'auto';
$('#q').value=state.q||'';
$('#sort').value=state.sort||'score';
$('#generated').textContent=`${DATA.generated} · ${ITEMS.length} 条 · ${DAYS.length} 天`;
renderOverview();
renderAll();
})();
</script>
</body>
</html>
