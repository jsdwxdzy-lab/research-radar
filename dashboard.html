i-Reference Image Generation","a":"Image generation models have rapidly advanced, with many models now supporting generation conditioned on multiple reference images and textual instructions. Such models enable a wide range of applications, including entity fusion and attribute transfer across images. However, existing benchmarks for multi-reference image generation rely on limited evaluation dimensions and fail to capture the diverse challenges of the task. To address this limitation, we propose MDMR-Bench, a Multi-Dimensional benchmark for Multi-Reference image generation. MDMR-Bench is organized around representative capability settings and consists of multiple evaluation subsets spanning diverse dimensions of multi-reference image generation, including (1) common entity fusion and attribute transfer, (2) multi-element extraction from a single image, (3) infographic manipulation, and (4) visual reasoning-intensive generation. This design enables systematic analysis of model capabilities and failure modes across different challenge dimensions. Furthermore, to achieve more reliable and interpretable evaluation, we introduce a checklist-based evaluation protocol that decomposes generation quality into fine-grained evaluation aspects. Instead of relying solely on holistic scoring, our framework uses structured checklists composed of both global-level and atomic-level queries, enabling more diagnostic assessment of model performance. By benchmarking both open-source and proprietary models, we demonstrate that MDMR-Bench provides fine-grained insights into model performance across different dimensions. The dataset and code are publicly available.","au":["Bowen Zheng","Jintao Lin","Changheng Yi","Haoran Yang","Binxiao Huang","Chenyang Lei","Rui Liu","Xihui Liu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32459","p":"2026-10-23","d":"2026-10-26","s":3.1,"tp":["vision-gen"],"kw":["image generation"],"src":["arxiv"],"kind":"preprint","ax":"2610.32459","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32768","t":"SCDM-HTD: Spectral-Wise Conditional Diffusion Model for Hyperspectral Target Detection","a":"Hyperspectral target detection (HTD) aims to locate and recognize objects at a fine-grained scale, playing a pivotal role in remote sensing. Despite significant progress, current HTD methods primarily focus on feature comparison while neglecting distribution learning for background-target separation, which can limit detection robustness in practical applications. This paper addresses this issue by introducing a spectral-wise conditional diffusion model that reformulates HTD as a task of generating a detection map. Specifically, we treat background and target confidence scores as training samples and use the corresponding pixel spectra as guiding conditions to capture the distributional discrepancy between background and target through diffusion and denoising. To enhance practical applicability, we propose a lightweight conditional denoising network based on multilayer perceptron to map noisy confidence scores to their ideal counterparts and adopt a deterministic reverse non-Markov chain to skip sampling steps, thereby accelerating the generation process. Furthermore, we introduce a composite loss to improve background-target separation. This loss integrates constrained energy minimization loss to enhance target saliency and suppress the background by maximizing the target response while minimizing average output energy, alongside binary cross-entropy loss to classify background and target using pixel-wise labels. Experimental results on four benchmark datasets demonstrate the effectiveness of the proposed method, with improvements in both quantitative metrics and qualitative visual effects.","au":["Dunbin Shen","Wenfeng Kong","Jianjun Liu","Xiaorui Ma","Hongyu Wang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32768","p":"2026-10-23","d":"2026-10-26","s":3.0,"tp":["gen-model"],"kw":["diffusion model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32768","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26244","t":"RECAP: Reciprocal Sparse Attention and Hierarchical Caching for Efficient Video Diffusion","a":"Diffusion transformers generate high-quality videos but remain computationally expensive. Sparse attention and temporal caching reduce computation within and across denoising steps, respectively, offering a natural composition. However, predictions produced with sparse attention become sources for temporal reuse, coupling their errors along the sampling trajectory. We observe that improving the accuracy of these sources recovers fidelity without changing the reuse schedule, and that sparsification errors remain directionally aligned across nearby steps, suggesting that correction information can be shared rather than recomputed. These observations motivate RECAP, a training-free method that couples sparse attention with hierarchical caching through reciprocal correction, adaptively coordinated by online error feedback. Cached dense refinement corrects omitted interactions in current sparse estimates, while fresh sparse statistics track input changes and regulate the aging correction. The resulting predictions then renew the sources for whole-step prediction reuse, allowing prediction history to advance between dense refreshes. We evaluate RECAP on multiple video diffusion models against sparse-attention methods, caching methods, and their direct compositions. On HunyuanVideo at 720p 5-second generation, RECAP achieves a 3.05x speedup and outperforms all tested direct compositions in both fidelity and inference speed.","au":["Tiange Xu","Kai Liu","Linghe Kong","Yulun Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26244","p":"2026-10-19","d":"2026-10-26","s":3.0,"tp":["vision-gen"],"kw":["video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26244","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.30775","t":"GWDM: A Guided Wavelet Diffusion Model for Realistic Histopathology Image Generation","a":"Histopathology images are recognized as a reliable and comprehensive modality for Deep Learning (DL) based diagnosis. However, effectiveness is constrained by limited large-scale annotated datasets, as collecting expert-labeled medical data is costly and time-intensive. Recent advances in generative models, particularly diffusion models, demonstrate strong capabilities in synthesizing medically relevant content for dataset augmentation. Existing generative frameworks treat histopathology patches as generic natural images, failing to enforce biological constraints such as histomorphological structures and heterogeneous staining patterns essential for valid synthesis. We propose a guided wavelet diffusion model (GWDM) framework that captures image details at multiple scales using wavelets and leverages controllable conditioning based on domain-specific histopathological features (e.g., tissue patterns and color variations). We further formulate a histomorphological guidance loss applied to real and generated patches. A loss ramping strategy gradually introduces these constraints during training, ensuring stable optimization and robust modeling of tissue architecture. GWDM was evaluated on three benchmark datasets (BCSS, MoNuSeg, and PAIP2019), consistently outperforming state-of-the-art generative methods. Ablation studies confirmed that domain-guided conditioning, perceptual loss, and structural similarity loss each contribute meaningfully to synthesis quality. Downstream nuclei and tissue segmentation experiments further validated the clinical utility of GWDM-generated images, demonstrating consistent performance improvements when synthetic data augments real training sets. This work shows that domain-specific conditioning and dual-loss optimization generate realistic histopathology patches, reducing data scarcity and improving clinical downstream segmentation performance.","au":["Abdullah","Tao Huang","Ickjai Lee","Lei Bi","Euijoon Ahn"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30775","p":"2026-10-22","d":"2026-10-26","s":3.0,"tp":["vision-gen","gen-model"],"kw":["image generation","diffusion model"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30775","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.31981","t":"Compatible Likelihoods for Flow Matching on Manifolds","a":"On the simplest non-Euclidean manifold, the 1D flat torus, we exhibit a distribution where a recently proposed extension of Riemannian flow matching is globally optimized by a velocity field that pushes samples away from the data distribution. We trace this failure mode to a property we call compatibility; a likelihood-based flow matching objective is compatible if its population minimizer recovers the marginal velocity field induced by the data and coupling. We give a general condition for compatibility, apply it to existing methods, and bound the worst-case error in terms of a residual component vanishing under compatibility. Next, we note that existing compatible objectives put density on velocities that are infeasible on compact manifolds. We propose an objective built from an exponential family over endpoints, with the conditional velocity as sufficient statistic, which is both compatible and supported only on feasible velocities. This manifests as a reweighting of the flow matching loss which, on constant-curvature manifolds, treats errors in flow speed and direction differently. Empirically, our method recovers the correct velocity field on the test case, outperforms prior methods on high-dimensional product tori, and obtains substantial NLL improvements over prior work on two of four standard geospatial benchmarks on the sphere at moderate runtime overhead. On a large dataset of high-dimensional human poses, our method outperforms prior work according to sample-based metrics.","au":["Lucas Ng","Georgios Batzolis","Mark Girolami"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31981","p":"2026-10-22","d":"2026-10-26","s":3.0,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.31981","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32512","t":"Fast and Useful: Adapting Distilled Generators for Visual Learning","a":"Distilled text-to-image models generate images quickly, but classifiers trained on those images can perform substantially worse than classifiers trained on images from their slower base models. We adapt released distilled generators to produce better training data while retaining fast generation. We fit a low-rank update to the student's first prediction so that it reaches an intermediate state produced by its unguided base, then disable the update and let the unchanged student finish generation. The base supplies training targets and is absent at inference. Guided targets and shorter jumps give classifiers lower accuracy in our ablations, showing why the state used for supervision matters. Across three generator families, the adapted images train better classifiers than images from the released students. With class-name templates at full ImageNet-1k scale, ResNet-50 top-1 rises from 8.4% to 34.2% for FLUX.2-klein and from 12.7% to 32.1% for SD-Turbo, using two and three denoiser evaluations per image, respectively. Fixed adapters also improve results on additional classes, fine-grained datasets, and other learner architectures and training recipes. Template-based adaptation remains useful against richer-prompt alternatives, while the benefit of combining adaptation with LLM generation prompts depends on the generator. Adapting a single generation step makes fast generators substantially more useful for training visual models.","au":["Patryk Bartkowiak","Dominik Michels","Sören Pirk","Wojciech Pałubicki"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32512","p":"2026-10-23","d":"2026-10-26","s":2.9,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32512","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32390","t":"PASTA: Prompt-Aware Annealed Diffusion Sampling","a":"While Diffusion models produce high-quality images, real-world visual design requires intentionally preserving clean regions for headlines, logos, or UI elements. Existing layout-aware text-to-image methods struggle to strictly preserve reserved regions, often introducing unwanted content that complicates downstream editing. Existing approaches either manipulate attention to displace content or suppress conditioning via noise-level interventions. However, these methods sacrifice visual coherence, producing flat regions or noticeable style inconsistencies between reserved and non-reserved areas. To address this limitation, we propose a Prompt-Aware Shared-Latent Training-Free Annealed Diffusion Sampling (PASTA), a training-free framework that enforces reserved-region constraints by selectively applying semantic guidance to object-allowed regions during sampling. PASTA operates on a shared latent trajectory, where full-prompt and context-prompt guidance are fused through mask-guided sampling. An annealed schedule suppresses semantic leakage during early denoising stages while gradually restoring visual consistency in later stages. Extensive experiments demonstrate that PASTA improves reserved-region fidelity while preserving overall image realism and perceptual consistency.","au":["Ren Ajiki","Ryugo Morita","Stanislav Frolov","Brian Bernhard Moser","Ko Watanabe","Riku Takahashi","Andreas Dengel","Jinjia Zhou"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32390","p":"2026-10-23","d":"2026-10-26","s":2.9,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32390","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1002/ima.70447","t":"DFTA : Dual‐Flow Trajectory Alignment for Medical Pathology Image Synthesis","a":"Generating medical images with complex anatomical structures frequently faces challenges of morphological distortion and limited diversity. We investigate these issues within an established latent generative pipeline by introducing Dual‐Flow Trajectory Alignment (DFTA), a Flow‐Matching formulation with parallel mask‐flow and image‐flow conditioning. Rather than replacing standard latent encoders, UNet backbones, or ControlNet‐style conditioning, DFTA focuses on how the paired conditional trajectories are regularized and sampled. During training, trajectory consistency guidance uses image flow as a geometric reference for the mask flow; an Online Straight Euler Augmentation (OSEA) mechanism generates intermediate pseudo‐samples. At inference, conditional stochastic flow sampling introduces controlled variation into otherwise deterministic integration. Images generated by our model improve downstream task performance, achieving the best generation metrics and competitive results across downstream classification models. In particular, for medical image segmentation tasks, our method improves the mean Dice coefficient (mDice) and mean Intersection over Union (mIoU) of SegFormer by 1.79% and 1.92%, respectively, and increases the mDice and mIoU of UNet by 2.06% and 2.20%, respectively. The code is available at: https://github.com/yanguanyue/DFTA‐ .","au":["Kenan Lai","Muyu Qin","Shanping Yu"],"v":"International Journal of Imaging Systems and Technology","u":"https://doi.org/10.1002/ima.70447","p":"2026-10-19","d":"2026-10-26","s":2.8,"tp":["vision-gen"],"kw":["image synthesis"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1002/ima.70447","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.17605/osf.io/62ty9","t":"Generative AI for Mechanical Systems Design: A Systematic Review of Language-Driven, Diffusion-Based, and Physics-Informed Approaches — Protocol for a Two-Tier Systematic Map and In-Depth Synthesis","a":"Protocol of a systematic review on generative artificial intelligence for the design of mechanical systems, components and structures (2021–2026). The review covers three paradigms: language-driven approaches (large language models, vision-language models, LLM agents, CAD-as-language models), diffusion-based approaches (denoising diffusion, latent diffusion, flow matching) and physics-informed generative approaches. It uses a two-tier design: (1) a systematic map of all eligible studies, coded by paradigm, design task, design stage, design representation and evaluation type; (2) an in-depth critical synthesis of a core set of studies that quantitatively evaluate the physical validity, constraint satisfaction or manufacturability of generated designs, selected with criteria fixed before full-text assessment. Reporting follows PRISMA 2020. Searches were run in Scopus and Web of Science on 20 October 2026; this registration was made after title/abstract screening and before full-text assessment and data extraction.","au":["Alexis Lazanas"],"v":"Open Science Framework","u":"https://doi.org/10.17605/osf.io/62ty9","p":"2026-10-20","d":"2026-10-26","s":2.8,"tp":["gen-model","vision-gen"],"kw":["flow matching","latent diffusion"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.17605/osf.io/62ty9","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.25059","t":"HCFM: Helmholtz Component Flow Matching for Time Series Anomaly Detection","a":"Flow Matching (FM) is an efficient simulation-free approach for training flow-based generative models, making it a promising foundation for scalable time-series anomaly detection (TSAD). However, standard FM learns a monolithic vector field in which nominal transport and local density-changing behavior are entangled. This creates a central challenge for TSAD; local expansion and contraction carry crucial anomaly-sensitive information, yet isolating this signal requires expensive Jacobian-trace estimation over the entire field. We propose \\emph{Helmholtz Component Flow Matching} (HCFM), an unsupervised TSAD framework that parameterizes the vector field prediction network with separate transport, compression, and residual heads. The transport head is constrained to be divergence-free, so divergence estimation is restricted to the compression head, while a lightweight residual head absorbs the remaining mismatch. This structured parameterization improves scalability and detection performance by separating volume-preserving nominal transport from density-changing compression, yielding cleaner anomaly signals from distinct deviations of nominal behavior. Experiments on large-scale univariate and multivariate TSAD benchmarks show that HCFM consistently improves detection accuracy while maintaining efficient inference compared with 16 baselines. The code is available at https://github.com/TrustAIoT/HCFM__time-series-anomaly/","au":["Shyam Sundar Saravanan","Tie Luo","Sanjay Madria"],"v":"arXiv","u":"https://arxiv.org/abs/2610.25059","p":"2026-10-18","d":"2026-10-26","s":2.7,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.25059","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32177","t":"$Ψ$-0.6: Adaptive Streams of Thought in a Unified Vision-Language World Model","a":"Humans reason about the physical world by flexibly combining different forms of inference as a problem unfolds. Achieving this flexibility is a major open challenge in AI: capabilities often remain separated across specialized models, limiting how they can be composed and jointly adapted to a task. We introduce $Ψ$-0.6, a unified vision-language world model that adaptively composes perception, language, geometry, and simulation within a shared reasoning process we call streams of thought. These streams interleave images, text, and explicit representations of geometry and motion, all of which the model can generate and interpret through a shared token interface. $Ψ$-0.6 surpasses leading open-weight models zero-shot on multi-view spatial reasoning, with further gains from reasoning through geometric intermediates. It also supports counterfactual simulation: generating and interpreting imagined scenes to determine, for example, whether moving an object would obstruct a pathway. Reinforcement learning from task feedback jointly optimizes the selection, generation, and use of intermediate representations, improving visual question-answering accuracy with gains that transfer to unseen benchmarks. $Ψ$-0.6 offers a path toward adaptive physical reasoning -- not only predicting the physical world but also choosing the representations through which to reason.","au":["Khai Loong Aw","Klemen Kotar","Baihan Zhang","Yifan Liu","Lilian Chen","Atlas Kazemian","Rahul Venkatesh","Daniel Yamins"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32177","p":"2026-10-23","d":"2026-10-26","s":2.7,"tp":["vision-gen"],"kw":["world model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32177","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32148","t":"Covariance-Informed Ensemble Score Filtering: Embedding Localized Covariance Geometry into Score-Based Transport","a":"Background-error covariance models are central to atmospheric data assimilation because they spread partial observational information across space, variables, and dynamically coupled scales. Ensemble and variational methods exploit this covariance geometry efficiently, but their standard analysis formulations are largely built around Gaussian or locally quadratic approximations. Score-based ensemble filtering provides a framework for nonlinear distributional transport, but existing Ensemble Score Filter (EnSF) formulations lack an intrinsic covariance-mediated pathway for propagating likelihood information from observed to unobserved state components. We introduce a covariance-informed ensemble score filter (CI-EnSF) that embeds localized forecast-error covariance geometry directly into the forward diffusion and reverse transport. The proposed forward diffusion is covariance-shaped in standardized state space and becomes isotropic under the corresponding control-variable transformation. This covariance structure continuously propagates observational information from observed to unobserved state components throughout the reverse transport analysis trajectory. Experiments with Lorenz-96 and surface quasi-geostrophic (SQG) dynamics show a clear regime dependence. For linear observations, a well-tuned LETKF is more accurate, while CI-EnSF maintains stable cycling and effective covariance-mediated information propagation. Under strongly nonlinear observations and under climatological initialization, CI-EnSF achieves lower analysis error and greater cycling robustness than Gaussian ensemble benchmarks such as the LETKF, with improvements extending across spatial scales in the nonlinear SQG experiment. These results suggest that the principal benefit of CI-EnSF arises from combining nonlinear distributional transport with the mature covariance geometry used in conventional data assimilation.","au":["Siming Liang","Peter Jan van Leeuwen","Hristo G. Chipilski","Zezhong Zhang","Feng Bao","Guannan Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32148","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["score-based"],"src":["arxiv"],"kind":"preprint","ax":"2610.32148","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32222","t":"ACWM-RM: A Reference-Free Reward Model from Complementary Mismatch Preferences","a":"Reinforcement learning has gained attention for improving action-conditioned world models (ACWMs), as it enables reward-driven optimization of visual quality (VQ) and action-following fidelity (AF) beyond flow-matching optimization. Realizing this potential requires reward signals that reliably rank videos by both VQ and AF. However, existing rewards capture only one dimension: metric-based rewards assess VQ but require ground-truth videos and do not directly assess AF, while inverse dynamics model (IDM) rewards assess AF without references but do not guarantee VQ. Moreover, IDMs, typically trained on real videos, may provide unreliable rewards for generated videos containing visual artifacts and physical inconsistencies. In this work, we introduce the Action and Video Mismatch Benchmark (AVM-Eval), comprising 67.2k pairs that evaluate how reliably IDMs assess AF on real and generated videos. We then propose ACWM-RM, a reward model that jointly assesses VQ and AF without ground-truth videos during reward computation. To train it, we first construct the Action and Video Mismatch Preference Dataset (AVM-Pref) with 506.3k pairs providing complementary supervision: action-mismatch pairs supervise AF, while video-mismatch pairs supervise VQ and expose the model to generated videos. We then pretrain an action-conditioned predictor on real videos to learn forward dynamics before jointly training it with a patch-weighted score head on AVM-Pref to transfer these dynamics to AF assessment on generated videos. Evaluation on AVM-Eval reveals the limited reliability of IDMs on generated videos, while downstream RL experiments show that ACWM-RM outperforms reward baselines in both criteria.","au":["Shibo Hong","Siyu Ren","FengJiao Chen","Zhongyuan Peng","Wei Shi","Yixin Cao"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32222","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32222","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32485","t":"PCFBench: How Far Can Large Vision-Language Models Go in Physics-aware Photonic Inverse Design?","a":"Photonic crystal fibers (PCFs) underpin critical applications in telecommunications, sensing, and high-power laser delivery, yet their design remains a manual, expert-intensive process that couples geometric intuition with deep waveguide physics. Vision-language models (VLMs) offer a promising path toward automating PCF design, but can they truly reason about photonic physics from microscopy images, or do they merely recognize visual patterns? We introduce PCFBench, the first comprehensive benchmark for evaluating VLMs on the perception, reasoning, and decision steps of the photonic inverse-design loop. PCFBench spans 26 tasks organized into six categories of increasing cognitive demand (Geometry Perception, Physics Understanding, Text Generation, Multi-modal Reasoning, Inverse-Design Decision, and Code Generation), built from over 220K FDTD simulation samples across 18 structurally diverse fiber families. We evaluate both individual VLMs on isolated tasks and multi-agent systems (MAS) on the full sequential pipeline from perception to design. Our results reveal a striking perception-design gap: current models can identify fiber geometry with moderate success, yet consistently fail to translate that visual understanding into physics-aware design actions. Moreover, cascading agents through the pipeline exposes significant error propagation, where upstream perception mistakes compound into downstream design failures. These findings suggest that neither model scaling nor naive agent chaining suffices, and that closing the loop demands explicit physical grounding. PCFBench provides the community with a rigorous, multi-dimensional testbed to measure progress toward AI-assisted photonic engineering. The project is available at https://pcfbench.github.io/.","au":["Shengchao Chen","Ting Shu","Sufen Ren"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32485","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["crystal-gen"],"kw":["inverse design"],"src":["arxiv"],"kind":"preprint","ax":"2610.32485","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32964","t":"Flownomaly: Single-Step Conditional-Mean Recovery for Few-Shot Anomaly Detection","a":"Few-shot industrial anomaly detection requires modeling category-specific normality from only a handful of defect-free images. Common approaches tie inference to stored exemplars, impose rigid linear structure, or risk reproducing anomalous content. Flownomaly instead casts the problem as normal-counterpart recovery in frozen DINOv2 feature space. Given normal supports, a velocity field is learned through conditional flow matching over frozen patch tokens to transport Gaussian noise toward normal features. Along straight paths, a single recovery step using one evaluation of the optimal field yields the posterior mean of the clean normal token without trajectory integration. The operating time governs how strongly recovery modifies a query token. With no anomalous validation samples available for tuning, a normal-only Jacobian gain-to-noise criterion selects this time from the supports alone. Squared residuals between query tokens and their recovered counterparts yield anomaly signals for both dense localization and image-level detection. Across 1-, 2-, and 4-shot benchmarks on MVTec-AD and VisA, together with sample-shot evaluations on Real-IAD, Flownomaly achieves state-of-the-art performance against recent category-specific methods. In the 1-shot setting, image- and pixel-level AUROC reach 97.8% and 98.0% on MVTec-AD and 95.3% and 98.7% on VisA, with a 2.1-point image-level AUROC improvement over the strongest baseline on VisA. Code is available at https://github.com/b-rbmp/Flownomaly.","au":["Bernardo Perrone Ribeiro","Erkut Akdag","Egor Bondarev"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32964","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32964","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1021/acs.cgd.6c00999","t":"Structure and Stability Prediction of Binary and Ternary Molecular Mixed Crystals Using Ensemble Free Energies","a":"Mixed crystals provide a route to tune the properties of molecular solids through continuous changes in composition. However, predicting their stability is challenging because it requires determining both substitution energies and configurational entropy across large configuration spaces. Here, we combine crystal structure prediction, force field lattice energy and lattice dynamics calculations, and Δ-machine-learning energy corrections with a scaled partition-function approach to assess structure prediction and evaluate binary and ternary mixed crystals of anthracene (ANT), acridine (ACR), and phenazine (PNZ). The composition-dependent ensemble free energy (ΔGensemble) was estimated without exhaustive enumeration of all configurations from representative ensembles of substituted supercell models of mixed crystals. Crystal structure prediction reproduces the known polymorphs as the lowest energy structures and the mixed crystal modelling approach reproduces the main experimental binary trends: ACR incorporation into ANT and the α and β polymorphs of PNZ, ANT incorporation into ACR form II, and the formation of a PNZ β-type ternary phase. Furthermore, we predict additional thermodynamically stable compositions, including PNZ incorporation into ACR form IX, and ternary crystals based on ACR forms II, VI and VII. Stable three-component regions arise from binary trends, with ACR mediating between both ANT and PNZ. These results demonstrate a practical framework for predicting the structure, thermodynamic stability and composition limits of molecular mixed crystals. The mixed crystal modelling methods are available within the mol-CSPy crystal structure prediction package.","au":["Anthony J. R. Payne","Sarah Madeira","Graeme Matthew Day"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00999","p":"2026-10-22","d":"2026-10-26","s":10.8,"tp":["csp"],"kw":["crystal structure prediction","crystal structure","lattice energy"],"src":["openalex","crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00999","who":["Graeme M. Day"],"tz":"基于集成自由能的二元和三元分子混合晶体结构与稳定性预测","az":"混合晶体通过连续改变组分来调节分子固体的性质，但预测其稳定性具有挑战性，因为需要确定大构型空间中的取代能和构型熵。本文结合晶体结构预测、力场晶格能和晶格动力学计算、Δ机器学习能量校正以及缩放配分函数方法，评估了蒽（ANT）、吖啶（ACR）和菲啶（PNZ）的二元和三元混合晶体的结构预测。组分依赖的集成自由能（ΔGensemble）的估算无需……（原文截断）","rv":"针对有机分子混合晶体（蒽、吖啶、菲啶）的结构与稳定性预测，将晶体结构预测、力场晶格能、晶格动力学与Δ机器学习能量校正结合，用缩放配分函数方法计算组分依赖的集成自由能。属于有机分子晶体计算预测方向，与生成模型和视觉生成关系较弱。","tr":"high","tw":"作者：Graeme M. Day；期刊在重点名单","why":"用代表性取代超胞系综代替穷举来估算混晶ΔG，CSP复现已知多晶型，直接服务固溶研究。"},{"k":"t:1cb3085840a024","t":"Automatically Building and Updating a Knowledge Graph of MLIP Models","a":"Complementing the many efforts in providing semantic representations of concepts, notions, and entities in materials science, we report and illustrate a process by which we can automatically build a knowledge graph of the fast evolving field of machine learning applied to the prediction of material properties, focusing on MLIP (Machine Learning Interatomic Potential). This LLM-based process relies on multiple steps, from information extraction in documents and articles to a validation loop using SHACL constraints to detect and correct errors. It is carried out on a model-by-model basis, focusing on the consistency of representation, therefore enabling an iterative construction where the addition of new models is facilitated. We illustrate the process by showing a few interesting aspects that can be queried from a knowledge graph built from the models listed in the Matbench Discovery leaderboard.","au":["Alexis Beer","L. Klochko","Mathieu d’Aquin"],"v":"HAL","u":"https://hal.science/hal-05785570","p":"2026-10-25","d":"2026-10-26","s":9.9,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential","mlip"],"src":["openalex"],"kind":"paper","ax":"","doi":"","who":[],"tz":"自动构建和更新MLIP模型知识图谱","az":"作为材料科学中概念、术语和实体语义表示工作的补充，本文报告并展示了一种自动构建机器学习原子间势（MLIP）领域知识图谱的流程。该基于大语言模型（LLM）的流程包含多个步骤，从文档和文章中的信息提取到使用SHACL约束进行验证循环以检测和纠正错误。该流程逐模型进行，关注表示的一致性，从而支持迭代构建，其中添加……（原文截断）","rv":"面向机器学习原子间势（MLIP）领域，利用LLM从文献中自动抽取信息并构建知识图谱，配合SHACL约束做验证纠错，支持逐模型迭代更新。属于材料信息学与知识工程方向，与有机分子晶体、生成模型、视觉生成均无直接关联，关系较弱。","tr":"mid","tw":"正式发表","why":"关联较弱，可作为背景；用LLM加SHACL校验自动构建MLIP知识图谱，便于追踪通用势进展。"},{"k":"doi:10.1002/adma.75492","t":"Machine‐Learning‐Potential‐Driven Volcano Relationship in Grain Boundary Amorphicity and Ionic Transport of Antiperovskite Solid Electrolytes","a":"Ionic transport in solid‐state electrolytes is governed by interfacial disorder and local chemical environments, yet their microscopic design principles remain challenging because large‐scale interfacial kinetics are simulated using molecular dynamics (MD), where predictive design requires quantum‐level accuracy. Here, we use an actively learned machine learning interatomic potential (MLIP) to bridge this scale‐accuracy gap in halide‐tunable antiperovskite solid electrolytes. By varying the local Cl − /Br − ratio and quantifying interfacial amorphicity and ion flux, we identify an MLIP‐driven volcano relationship between structural disorder and ionic transport. Cl‐enriched grain boundaries remain overly ordered, whereas Br − enrichment induces excessive disorder that disrupts migration. Intermediate halide compositions maximize ionic transport through moderately amorphous environments. Guided by this relationship, we design an anion‐engineered grain boundary through selective halide tuning. These results establish controlled anion segregation as a strategy for reducing interfacial resistance and highlight MLIP‐enhanced MD as a predictive framework for transport and disorder engineering in solid‐state materials.","au":["Abdullah Bin Faheem","Haobo Li"],"v":"Advanced Materials","u":"https://doi.org/10.1002/adma.75492","p":"2026-10-23","d":"2026-10-26","s":9.2,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential","mlip"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1002/adma.75492","who":[],"tz":"机器学习势驱动的反钙钛矿固态电解质晶界非晶化与离子传输火山关系","az":"固态电解质中的离子传输受界面无序和局部化学环境控制，但其微观设计原则仍具挑战性，因为大规模界面动力学通常用分子动力学（MD）模拟，而预测性设计需要量子级精度。本文使用主动学习的机器学习原子间势（MLIP）弥合卤化物可调反钙钛矿固态电解质中的尺度-精度差距。通过改变局部Cl⁻/Br⁻比例并量化界面非晶化程度和离子通量，我们识别出MLIP驱动的结构无序与离子传输之间的火山关系。富Cl晶界处……","rv":"本文用主动学习MLIP模拟卤化物反钙钛矿固态电解质晶界处的离子传输，通过调节Cl/Br比例量化界面非晶化程度，发现结构无序与离子电导之间存在火山型关系。方法核心是MLIP驱动的分子动力学，属于计算材料科学中的界面动力学模拟，与有机分子晶体、生成模型及视觉生成均无直接关联，关系较弱。","tr":"mid","tw":"正式发表","why":"关联较弱，可作为背景；用主动学习MLIP揭示卤素比例、晶界无序与离子输运之间的火山关系。"},{"k":"arxiv:2610.30086","t":"Orbitol: Crystal Generation on Wyckoff Orbits","a":"Generative models propose crystalline materials by learning composition and geometry, but unconditional sampling gives no direct control over the space group, which constrains whether responses such as piezoelectricity are symmetry-allowed. We present Orbitol, a crystal generator built on the Crystalite diffusion Transformer that replaces atom tokens with Wyckoff-orbit tokens. Given a space group and a collection of occupied Wyckoff positions, Orbitol generates the atom type and free coordinates of each orbit together with a compatible lattice, so every valid structure is invariant under the operations of the requested group. It generates structures two to three orders of magnitude faster than the symmetry-aware baselines at the evaluated settings. On MP-20, 13.8% of Orbitol's attempts yielded stable or metastable, unique and novel structures that retained the requested space group after relaxation, compared with 10.8% for SGFM, the next best model. We also introduce SPARC, a score that combines retention of the raw detected space group with agreement between the retained-group and training distributions. Finally, we used Orbitol to generate candidates in piezoelectric crystal classes. Of the structures selected by internal screening, 89% passed our density functional theory checks, and 79% also matched no Materials Project or Alexandria entry with the same space group. Their median figure of merit was nine times that of the piezoelectric materials computed in the Materials Project, and 24% of the new candidates ranked in that set's top 10%.","au":["Ivan Žugec","Joshua Rosenthal","Ivor Lončarić","Jan-Willem van de Meent","Tin Hadži Veljković"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30086","p":"2026-10-21","d":"2026-10-26","s":9.2,"tp":["crystal-gen"],"kw":["crystal generation","generative models","symmetry-aware","wyckoff"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30086","who":[],"tz":"Orbitol：基于Wyckoff轨道的晶体生成","az":"生成模型通过学习和几何来提出晶体材料，但无条件采样无法直接控制空间群，而空间群约束了压电等响应是否被对称性允许。我们提出Orbitol，一个基于Crystalite扩散Transformer的晶体生成器，用Wyckoff轨道token替代原子token。给定一个空间群和一组占据的Wyckoff位置，Orbitol同时生成每个轨道的原子类型和自由坐标以及兼容的晶格，使每个有效结构在所请求群的运算下保持不变。其生成速度比……快两到三个数量级。","rv":"Orbitol基于Crystalite扩散Transformer，将原子token替换为Wyckoff轨道token，在指定空间群和Wyckoff位置条件下生成原子类型、自由坐标及兼容晶格，保证结构满足群对称性，生成速度比基线快两至三个数量级。方法属于晶体生成模型，与扩散/视觉生成在架构上同源，与群论数学直接相关，与有机分子晶体关系间接。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":"用Wyckoff轨道token约束空间群，比对称性基线快两到三个数量级，MP-20上13.8%为稳定新结构。"},{"k":"arxiv:2610.26301","t":"Machine Learning-Assisted Discovery of Carbon-Related Defect Formation Mechanisms in Diamond","a":"Diamond is an important host material for functional defects such as solid-state spin qubits. During the defect creation by irradiation and subsequent thermal annealing, carbon-related defects, including vacancies and interstitials, are generated and can migrate to form new defect complexes. To investigate this kinetically driven process and reveal the formation mechanisms of the di-interstitials and di-vacancies in the neutral charge state, we fine-tuned a universal machine learning interatomic potential using a small dataset generated from density functional theory calculations. We obtained a barrier of 1.84 eV for mono-interstitial migration and found that two initially separated mono-interstitials only need to overcome a lower barrier to form di-interstitial configurations. Beyond the training data, the MLIP also identified the formation pathway for an additional di-interstitial configuration and a stepwise divacancy dissociation mechanism. These results reveal migration-assisted defect complex formation mechanisms and demonstrate how targeted MLIP training can identify reaction pathways.","au":["Grace Huang","Christopher Fivecoat","Xun Xu","Mengen Wang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26301","p":"2026-10-19","d":"2026-10-26","s":8.6,"tp":["mlip"],"kw":["machine learning interatomic potential","density functional theory","interatomic potential","mlip"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26301","who":[],"tz":"机器学习辅助发现金刚石中碳相关缺陷形成机制","az":"金刚石是固态自旋量子比特等功能性缺陷的重要宿主材料。在辐照及后续热退火过程中，碳相关缺陷（包括空位和间隙原子）被产生并可迁移形成新的缺陷复合体。为研究这一动力学驱动过程并揭示中性电荷态下双间隙原子和双空位的形成机制，作者基于密度泛函理论计算生成的小数据集微调了一个通用机器学习原子间势。他们得到单间隙原子迁移势垒为 1.84 eV，并发现两个初始分离的单间隙原子……","rv":"方法为基于 DFT 小数据集微调的通用机器学习原子间势（MLIP），对象是金刚石中碳空位与间隙原子的迁移及复合体形成。实际工作是用加速分子动力学模拟揭示双间隙原子、双空位的形成路径，给出单间隙原子迁移势垒 1.84 eV。属于计算材料科学中的缺陷物理模拟，与有机分子晶体、生成模型、视觉生成及本文所列数学方向关系很弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":"用小规模DFT数据微调通用势，研究金刚石间隙与空位的迁移和聚集，微调策略对缺陷建模有参考价值。"},{"k":"arxiv:2610.27762","t":"CrystalAR: Autoregressive Modeling for Symmetric Crystal Generation","a":"Deep generative modeling has achieved remarkable progress in crystal generation. Given the rich symmetries inherent in crystalline structures, recent work has sought to explicitly incorporate space-group symmetry into generative models, enabling more effective exploration of novel symmetry templates. Yet introducing symmetry templates increases the combinatorial complexity of stoichiometric relationships between atomic species and crystallographic sites, while creating a fundamental tension between flexible exploration of discrete crystallographic templates and faithful realization of these templates as continuous three-dimensional structures. To address these challenges, we propose CrystalAR, a unified autoregressive framework that models Wyckoff symmetry templates and complete crystal structures within a single generative sequence. Specifically, CrystalAR reformulates continuous coordinate generation as a symmetry-conditioned hierarchy of discrete spatial localization decisions, autoregressively refining the positions of all symmetry-inequivalent sites across resolution levels while jointly modeling their spatial configuration within each level. This discrete hierarchical formulation further enables constraint-aware search over both crystallographic templates and geometric realizations. As a result, CrystalAR retains strong symmetry-template generation capability while achieving competitive de novo generation performance and template-free crystal structure prediction (CSP) accuracy. These results suggest that symmetry-template generation can be retained alongside broadly competitive de novo generation performance and competitive CSP without reliance on symmetry templates retrieved from prior data, providing a promising alternative paradigm for symmetry-preserving crystal generation.","au":["Ziqiao Meng","Rongsheng Chen","郑直","N. Kazeev","Zhenkun Wang","Andrey Ustyuzhanin","Wee Sun Lee"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27762","p":"2026-10-20","d":"2026-10-26","s":8.6,"tp":["crystal-gen","csp"],"kw":["crystal generation","generative models","de novo","wyckoff","crystal structure prediction (csp)","crystal structure prediction","crystal structure","space group"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27762","who":[],"tz":"CrystalAR：面向对称晶体生成的自回归建模","az":"深度生成建模在晶体生成方面已取得显著进展。鉴于晶体结构固有的丰富对称性，近期工作试图将空间群对称性显式纳入生成模型，从而更有效地探索新型对称模板。然而，引入对称模板会增加原子种类与晶体学位点之间化学计量关系的组合复杂度，同时在灵活探索离散晶体学模板与将这些模板忠实地实现为连续三维结构之间产生了根本性张力。为应对这些挑战，我们提出CrystalA…","rv":"本文提出CrystalAR，用自回归建模处理对称晶体生成。核心思路是将空间群对称性显式嵌入生成过程，以自回归方式逐步生成原子种类与晶体学位点的组合，缓解离散模板探索与连续三维结构实现之间的张力。属于生成模型方向，面向一般晶体结构，与有机分子晶体关联较弱，与视觉生成关系不大，与群论对称性数学有一定交叉。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":"在单一自回归序列中联合建模Wyckoff模板与完整结构，与Orbitol同属对称性生成的对标工作。"},{"k":"doi:10.1021/acs.cgd.6c00526","t":"Slipping into Solvates: Structure-Surface-Solvent Interplay in the Mechanochemical Solvate Formation of Ivacaftor","a":"Solvate formation in molecular crystals remains difficult to predict, particularly under non-equilibrium conditions, where the initial solid state, mechanically generated surfaces, anisotropic surface chemistry, and solvent properties collectively influence solid-solvent interactions. While mechanochemical processing is widely used to access new solid forms, the structural features that control solvent incorporation during mechanical activation are not yet well understood. In this work, we investigate mechanochemically induced solvate formation in ivacaftor as a model molecular crystal, focusing on the effects of solvent nature, liquid-additive volume, milling duration, and starting solid form. Form C transformed selectively to a solvate, in MeOH, THF, and DMSO, whereas the amorphous material exhibited broader solvate-forming behavior, including hydrate and non-polar solvate formation. The observed transformations could not be explained by solvent class or apparent dissolution capacity alone, demonstrating the importance of the starting solid state and specific host-solvent interactions. Crystal structure and surface analyses of form C identified the (200) plane as a plausible mechanically responsive plane whose alternative termination exposes polar groups involved in the resulting solvate structures. Overall, the results support a model in which mechanochemical solvate formation is governed by the interplay among the initial solid state, mechanically generated surfaces, and specific solid-solvent interactions.","au":["Argyro Chatziadi","Adéla Koryt’áková","Eliška Zmeškalová","Jan Rohlíček","Markéta Jarošová","Morgane Poupon","Luděk Ridvan","Miroslav Šoóš"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00526","p":"2026-10-24","d":"2026-10-26","s":8.2,"tp":["csp"],"kw":["molecular crystals","molecular crystal","crystal structure"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00526","who":[],"tz":"滑入溶剂化物：Ivacaftor机械化学溶剂化物形成中结构-表面-溶剂的相互作用","az":"分子晶体中溶剂化物的形成仍然难以预测，尤其是在非平衡条件下，初始固相、机械生成的表面、各向异性表面化学和溶剂性质共同影响固-液相互作用。虽然机械化学加工被广泛用于获取新的固相形式，但机械活化过程中控制溶剂掺入的结构特征尚未得到充分理解。本工作以ivacaftor为模型分子晶体，研究机械化学诱导的溶剂化物形成，重点关注溶剂性质、液体添加剂体积、研磨时间和起始固相形式的影响……","rv":"以ivacaftor为模型分子晶体，研究机械化学研磨条件下溶剂化物形成中结构-表面-溶剂的相互作用机制，考察溶剂种类、添加剂体积、研磨时间等参数对溶剂掺入的影响。属于有机分子晶体/固相化学范畴，与生成模型、视觉生成无直接关联。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.29634","t":"Symmetry-Based Parameter Efficient Low-Rank Fine-Tuning for High-Throughput Calculation of Lattice Thermal Conductivity","a":"Accurate and efficient prediction of lattice thermal conductivity (LTC) is essential for developing materials for thermoelectric, microelectronic, and photovoltaic applications. Here, we present a methodology for high-throughput calculation of LTC across large datasets of compounds sharing a common crystal symmetry. Our approach combines fine-tuning of the MatterSim 1M universal machine-learned interatomic potential with LTC calculations based on the solution of the Boltzmann transport equation. We introduce a symmetry-based few-shot fine-tuning strategy (SBFS-FT) based on low-rank adaptation. In this approach, MatterSim 1M is fine-tuned on a small, carefully selected set of compounds that share a common crystal symmetry. The resulting potential is then applicable for accurate LTC calculations for compounds with this crystal symmetry, even if they were not included in the fine-tuning set. We tested our methodology on datasets of half-Heusler compounds (space group 216), materials with space group 225, and spinels (space group 227). We demonstrated that LTC calculations with MatterSim 1M fine-tuned using SBFS-FT exhibited a mean absolute relative difference from the reference results (obtained using moment tensor potentials and polyMLPs) 2-3 times smaller than that achieved with the non-fine-tuned MatterSim 1M potential. Moreover, the accuracy of LTC calculations with MatterSim 1M after SBFS-FT was comparable to that achieved using the MatterSim 1M potentials individually fine-tuned for each compound. Importantly, SBFS-FT enabled generation of the potential suitable for accurate LTC calculations across large compound datasets substantially faster than fine-tuning of MatterSim 1M for each compound individually, reducing the computational time by approximately a factor of 5-7 for a dataset of 100 compounds.","au":["Rustam Arabov","Konstantin Sozykin","Nikita Rybin","Alexander Shapeev"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29634","p":"2026-10-21","d":"2026-10-26","s":7.7,"tp":["mlip"],"kw":["machine-learned interatomic potential","interatomic potential","fine-tuning","mattersim"],"src":["arxiv"],"kind":"preprint","ax":"2610.29634","doi":"","who":[],"tz":"基于对称性的参数高效低秩微调用于晶格热导率高通量计算","az":"准确高效地预测晶格热导率（LTC）对于开发热电、微电子和光伏应用材料至关重要。本文提出了一种针对具有共同晶体对称性的大规模化合物数据集进行LTC高通量计算的方法。该方法将MatterSim 1M通用机器学习原子间势的微调与基于玻尔兹曼输运方程求解的LTC计算相结合。我们引入了一种基于低秩适配（LoRA）的对称性少样本微调策略（SBFS-FT）。在该方法中，MatterSim 1M在一组精心选择的、共享晶体对称性的少量化合物上进行微调……","rv":"提出SBFS-FT策略，利用晶体对称性对MatterSim 1M原子间势进行低秩适配少样本微调，再结合玻尔兹曼输运方程实现晶格热导率高通量计算。属于材料计算与机器学习势函数范畴，涉及晶体对称性这一数学结构，但与有机分子晶体、视觉生成、生成模型关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.31183","t":"Unconstrained learning of equivariant atomistic properties","a":"Machine-learned interatomic potentials based on graph neural networks (GNNs) have made first-principles accuracy routine for the potential energy surface (PES). Their backbones, often O(3)-equivariant by design, are increasingly used to learn other atomistic properties. Many of these are of high angular order or pseudotensorial character, defined per atom, or expanded on large atom-centered basis sets. Such targets strain equivariant GNNs, whose tensor products grow steeply in cost with angular order and can fail to represent the target if truncated, forcing difficult trade-offs between hyperparameters. Unconstrained models like the Point-Edge Transformer (PET) instead replace explicit O(3) algebra with edge-to-edge attention and learn equivariance from data, so that the same backbone can in principle learn any equivariant property. We demonstrate how to use PET to learn molecular dipoles and polarizabilities, NMR chemical shielding tensors, and auxiliary-basis expansions of the electron density. Increasing the backbone size systematically improves both accuracy and equivariance error, and targeted architectural and training choices reduce the symmetry breaking further. PET matches or improves on the released reference models at lower inference cost and, compared with equivariant models, a smaller memory footprint. The predictions give accurate IR and Raman spectra and isotropic shieldings; the predicted densities accelerate self-consistent field calculations and give one-shot ground-state properties, and pretrained density models transfer to higher levels of theory by fine-tuning on little data. The impact of approximate equivariance is small for most observables, further validating this approach to train fast, accurate, and useful surrogate models for properties beyond the PES.","au":["Joseph W. Abbott","Paolo Pegolo","Pol Febrer","Michelangelo Domina","Sandra Saade","Matthias Kellner","Filippo Bigi","Philip Loche","Michele Ceriotti"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31183","p":"2026-10-22","d":"2026-10-26","s":7.5,"tp":["mlip"],"kw":["potential energy surface","equivariant"],"src":["arxiv"],"kind":"preprint","ax":"2610.31183","doi":"10.48550/arxiv.2610.31183","who":["Michele Ceriotti"],"tz":"等变原子性质的无约束学习","az":"基于图神经网络（GNN）的机器学习原子间势已使第一性原理精度的势能面（PES）计算成为常规。其骨干网络通常在设计上具有O(3)等变性，并越来越多地用于学习其他原子性质。其中许多性质具有高角阶或伪张量特征，按原子定义，或展开在大的原子中心基组上。这类目标对等变GNN构成压力，因为其张量积的代价随角阶急剧增长，且截断时可能无法表示目标，迫使在超参数之间做出困难权衡。无约束模型如Point-Edge Transformer（PET）则用显式O(3)……（原文截断）","rv":"针对等变GNN在学习高角阶原子性质时张量积代价高、截断易失真的问题，提出以Point-Edge Transformer（PET）等无约束模型替代显式O(3)等变结构。属于计算化学与机器学习势函数方向，与有机分子晶体、视觉生成、相关数学关系较弱，核心涉及群论等变表示学习。","tr":"high","tw":"作者：Michele Ceriotti","why":""},{"k":"doi:10.1021/jacs.6c15227","t":"Mechanistic Insights of Jahn–Teller Effect Suppression in High-Entropy Prussian Blue Analogue Cathodes","a":"The Jahn–Teller (J-T) effect, as discovered by Hermann Jahn and Edward Teller in 1937, often causes lattice distortion and structural instability in Mn-based battery materials. Recent studies suggest that high-entropy design may help suppress J-T distortion, yet the underlying mechanism remains largely elusive due to their compositional complexity and structural disorder. Herein, using a Mn-based Prussian blue analogue as a case study, we employed a machine learning interatomic potential combined with synchrotron extended X-ray absorption fine structure spectroscopy (EXAFS) to elucidate the fundamental mechanism of the J-T suppression in high-entropy materials. Unexpectedly, EXAFS spectra reveal the absence of the typical J-T Mn–N bond-length splitting in our high-entropy Prussian blue analogue sample, but instead a broader Mn–N bond-length distribution. Machine learning-assisted calculations demonstrate the [MnN6] octahedra exhibit randomly oriented distortions along x-, y-, and z-axes in high-entropy lattices, resulting in the local distortion averaging out at the macroscopic scale. Further analysis of the local Mn coordination environment reveals that the high-entropy configuration enhances d-electron delocalization and reduces the energy splitting between Mn dx2–y2 and dz2 orbitals. This allows two structurally and electronically distinct distortion modes to coexist within the lattice, which disrupts long-range cooperative J-T order. Strikingly, the ultralong cycling stability of high-entropy K0.46[Mn0.21Co0.19Ni0.21Cu0.20Zn0.19][Fe(CN)6]0.98·1.69H2O is experimentally demonstrated, achieving 91.0% capacity retention over 50,000 cycles for aqueous ammonium-ion storage, which surpasses all of the Mn-based rechargeable batteries to date. Our study uncovers the microscopic mechanism of J-T suppression in high-entropy materials and provides an effective strategy for designing durable high-entropy battery electrodes.","au":["Bangjun Wu","Xiaorui Dong","Hongliang Dong","Shuyang Bian","Qiang Liu","Wenbo Zhai","Yi Yu","Yuanhui Ji","Yuping Wu","Jingyang Wang"],"v":"Journal of the American Chemical Society","u":"https://doi.org/10.1021/jacs.6c15227","p":"2026-10-23","d":"2026-10-26","s":7.1,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex","crossref"],"kind":"paper","ax":"","doi":"10.1021/jacs.6c15227","who":[],"tz":"高熵普鲁士蓝类似物正极材料中Jahn–Teller效应抑制的机理研究","az":"Jahn–Teller（J-T）效应由Hermann Jahn和Edward Teller于1937年发现，常导致锰基电池材料中的晶格畸变和结构不稳定。近期研究表明高熵设计可能有助于抑制J-T畸变，但由于其成分复杂性和结构无序性，内在机制仍 largely 不明。本文以锰基普鲁士蓝类似物为案例，采用机器学习原子间势结合同步辐射扩展X射线吸收精细结构（EXAFS）光谱，阐明了高熵材料中J-T抑制的基本机制。出乎意料的是，EXAFS光谱重新……（原文截断）","rv":"以锰基普鲁士蓝类似物正极材料为对象，结合机器学习原子间势与同步辐射EXAFS光谱，探究高熵设计抑制Jahn–Teller晶格畸变的微观机制。属于无机功能材料与电池正极的机理研究，与有机分子晶体、生成模型、视觉生成均无直接关联，与相关数学也关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1016/j.apsusc.2026.168654","t":"Atomic-scale mechanisms of SiO2 plasma-enhanced chemical vapor deposition revealed by molecular dynamics with a machine-learning interatomic potential","a":"","au":["Jaehoon Kim","Minseok Moon","Hyunsung Cho","Kim Hyeon‐Deuk","Rokyeon Kim","Gyehyun Park","Seungwu Han","Youngho Kang"],"v":"Applied Surface Science","u":"https://doi.org/10.1016/j.apsusc.2026.168654","p":"2026-10-21","d":"2026-10-26","s":6.1,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.apsusc.2026.168654","who":[],"tz":"基于机器学习原子间势的分子动力学揭示SiO2等离子体增强化学气相沉积的原子尺度机制","az":"","rv":"用机器学习原子间势驱动分子动力学模拟，研究SiO2等离子体增强化学气相沉积（PECVD）的原子尺度成膜机制。属于计算表面科学与薄膜沉积领域，与有机分子晶体、生成模型、视觉生成及本文关注的数学方向均无直接关联，关系较弱。","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.32905","t":"Combining Simulations and Spectroscopy to Design Protective Coatings on Sulfide Solid Electrolytes","a":"Sulfide solid electrolytes are attractive for all-solid-state batteries because of their high Li-ion conductivity and favorable processability, but their practical use is limited by electrochemical instability and moisture-induced degradation. Molecular surface coatings offer a scalable strategy to improve humidity tolerance and interfacial stability, yet there is limited understanding of the molecular-level factors governing surface interactions. By combining large-scale atomistic simulations enabled by a machine-learning potential with targeted experiments, we present a comprehensive framework for designing molecular coatings on Li$_6$PS$_5$Cl (LPSCl). Using a PET-MAD interatomic potential fine-tuned on an r$^2$SCAN reference dataset covering LPSCl surfaces, molecular adsorbates, and their interactions, we model surface adsorption of carboxylic (CA), sulfonic (SA), and phosphonic (PA) acids with alkyl chains of varying lengths and the interaction of these coated surfaces with water at finite temperature. The simulations show that lithiated head groups generally exhibit more favorable adsorption energies. Impedance spectroscopy shows that the lithiated coatings maintain 40--55\\% of the initial ionic conductivity after powder processing. While adsorption strength is largely controlled by head-group chemistry and lithiation state, coating morphology depends primarily on alkyl-chain length and surface coverage. In particular, long-chain lithiated carboxylates form dense, brush-like hydrophobic layers that reduce water access to reactive Li surface sites, with protection setting in at a coating thickness of approximately 0.8 nm. Consistent with these predictions, longer carboxylate chains suppress H$_2$S evolution more effectively. Because thicker coatings also hinder Li-ion transport, intermediate chain lengths offer the best balance between moisture protection and ionic conductivity.","au":["Zhiyi Wang","Leonie Braks","Michele Ceriotti","Ali Coskun","Hanna Türk","Davide Tisi"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32905","p":"2026-10-23","d":"2026-10-26","s":5.6,"tp":["mlip"],"kw":["interatomic potential"],"src":["arxiv"],"kind":"preprint","ax":"2610.32905","doi":"","who":["Michele Ceriotti"],"tz":"结合模拟与光谱设计硫化物固态电解质保护涂层","az":"硫化物固态电解质因其高锂离子电导率和良好的可加工性而成为全固态电池的理想选择，但其实际应用受限于电化学不稳定性和水分诱导的降解。分子表面涂层是提高耐湿性和界面稳定性的可扩展策略，但目前对控制表面相互作用的分子层面因素了解有限。通过结合机器学习势能驱动的大规模原子模拟与针对性实验，我们提出了一个设计Li6PS5Cl（LPSCl）分子涂层的综合框架。使用PET-MAD原子间势……","rv":"采用PET-MAD机器学习势进行大规模原子模拟，结合光谱实验，为硫化物固态电解质LPSCl设计分子保护涂层，旨在提升耐湿性与界面稳定性。属于计算材料与电池界面科学，与有机分子晶体、生成模型、视觉生成及本文关注的数学方向关系均较弱。","tr":"high","tw":"作者：Michele Ceriotti","why":""},{"k":"doi:10.26434/chemrxiv.15010773/v1","t":"Mechanical versus thermal amorphization of ZIF-4: from local rearrangements to network disorder","a":"There is mounting evidence that different amorphization routes can produce metalorganic framework (MOF) glasses with distinct structures and properties, yet the microscopic origins of these differences remain difficult to establish experimentally. Focusing on the two main synthesis methods, which are melt-quenching and ball-milling, we use molecular dynamics simulations with a machine-learning interatomic potential to compare different glasses obtained from ZIF-4. While both routes largely preserve tetrahedral zinc coordination, mechanical deformation generally produces more distorted local environments, showing that average coordination numbers alone do not capture the structural differences between these glasses. At smaller applied strain, mechanical glasses retain substantial memory of the crystalline network topology, despite pronounced changes in ring geometry. Larger strains erase this topological memory, yielding ring-size distributions similar to those of melt-quenched glasses, while differences in local geometry and porosity persist. Simulations of larger systems reveal a heterogeneous amorphization mechanism, involving the formation and growth of disordered domains. These findings from in silico amorphization support process-dependent polyamorphism in ZIF glasses and identify local geometry, topological memory, and spatial heterogeneity as complementary features needed to characterize their structure and understand the influence of mechanical processing.","au":["Léna Triestram","François‐Xavier Coudert"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010773/v1","p":"2026-10-21","d":"2026-10-26","s":4.9,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010773/v1","who":[],"tz":"ZIF-4的机械与热致非晶化：从局部重排到网络无序","az":"越来越多的证据表明，不同的非晶化路径可以产生具有不同结构和性质的金属有机框架（MOF）玻璃，但这些差异的微观起源在实验上仍难以确定。本文聚焦于两种主要合成方法——熔体淬火和球磨，使用基于机器学习原子间势的分子动力学模拟，比较了从ZIF-4获得的不同玻璃态。虽然两种路径在很大程度上都保留了四面体锌配位，但机械变形通常产生更畸变的局部环境，表明仅凭平均配位数无法捕捉结构差异……","rv":"研究对象是ZIF-4（一种MOF），方法是用机器学习原子间势驱动的分子动力学模拟，比较球磨（机械）和熔体淬火（热）两种非晶化路径产生的玻璃态结构差异。属于有机分子晶体/多孔材料范畴，与生成模型和视觉生成无直接关系，核心贡献在于揭示非晶化路径对局部配位畸变的影响。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.1063/5.0350682","t":"Microscopic origin of polytype-dependent melting in SiC revealed by machine-learning molecular dynamics","a":"Predicting how crystal structure influences high-temperature stability remains a key challenge in materials modeling and design. Silicon carbide (SiC), one of the most thermally and chemically stable materials known, provides an ideal system for studying this problem because its many polytypes preserve similar local tetrahedral bonding while differing in long-range stacking geometry. To determine the impact of polytype structure on the high-temperature stability of SiC, we combine phase-coexistence machine-learning molecular dynamics with finite-temperature phonon analysis, enabled by a fine-tuned MACE interatomic potential that accurately describes crystalline, high-temperature, and disordered configurations across multiple SiC polytypes. We identify a clear stability ordering, 3C > 2H > 9R, reflected consistently in structural disordering, interlayer sliding, and finite-temperature phonon spectra. Across all polytypes, melting initiates through the formation of short C-C contacts and carbon-rich local regions, followed by a progressive loss of tetrahedral Si-C connectivity. The reduced stability of the long-period 9R polytype is associated with a denser manifold of low-frequency transverse-acoustic modes arising from its stacking periodicity and associated zone folding, which broaden and soften further at high temperature. These modes can provide additional low-energy channels for thermally activated lateral bilayer motion, consistent with the larger sliding amplitudes observed in 9R and their positive correlation with local structural disorder.","au":["Ljiljana Stojanović","S. J. Magorrian","Lara Kabalan","R.N. White","Fabian L. Thiemann","Viktor Zólyomi"],"v":"The Journal of Chemical Physics","u":"https://doi.org/10.1063/5.0350682","p":"2026-10-19","d":"2026-10-26","s":4.8,"tp":["mlip"],"kw":["interatomic potential","mace"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1063/5.0350682","who":[],"tz":"机器学习分子动力学揭示SiC多型体依赖熔化的微观起源","az":"预测晶体结构如何影响高温稳定性仍是材料建模与设计中的关键挑战。碳化硅（SiC）是已知热稳定性和化学稳定性最高的材料之一，是研究该问题的理想体系，因为其众多多型体保留了相似的局部四面体键合，但在长程堆叠几何上有所不同。为确定多型体结构对SiC高温稳定性的影响，我们将相共存机器学习分子动力学与有限温度声子分析相结合，借助精细调优的MACE原子间势，准确描述晶态、高温态和无序态……","rv":"研究对象是SiC（无机共价晶体），方法是用MACE机器学习原子间势进行相共存分子动力学模拟，结合有限温度声子分析，研究不同多型体的熔化行为差异。属于无机晶体/高温材料范畴，与有机分子晶体、生成模型、视觉生成均无直接关联，核心贡献在于揭示长程堆叠几何对熔化温度的微观影响。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.26434/chemrxiv.15010965/v1","t":"Spontaneous defect formation as the origin of superionic transitions in antifluorite-type structures","a":"Solid-state electrolytes offer the possibility of safer and higher energy density batteries, yet only a limited number of materials achieve ionic conductivities suitable for practical applications. Type-II superionic conductors, which undergo continuous temperature-driven transitions between low and high ionic conductivity regimes are strong candidates for high-performance solid state electrolytes, but the transition mechanism is not sufficiently understood. In this study, we investigate the archetypical superionic conductors Li2O and Li2S with the antifluorite structure using long-time-scale molecular dynamics simulations with an Allegro machine-learning force field (MLFF) trained on density functional theory data selected using an on-the-fly active learning procedure. To this end, superionic transitions are identified around 1450 K for Li2O and around 1100 K for Li2S through continuous peaks in the heat capacity. Diffusion coefficients and concentration of Frenkel defects are found to exhibit strong non-Arrhenius behavior coinciding with the superionic transition where both diffusion activation energy and defect formation energy decrease significantly across the transition. This suggests a self-enhanced spontaneous defect formation mechanism, which drives the superionic transition and promotes increased ionic diffusion. These results identifies the microscopic origin of type-II superionic behavior as a result of correlated defect formation and support the design of improved solid-state electrolytes.","au":["Timothée Jamin","Kasper Tolborg"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010965/v1","p":"2026-10-23","d":"2026-10-26","s":4.6,"tp":["mlip"],"kw":["density functional theory","active learning","allegro"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010965/v1","who":[],"tz":"反萤石型结构中自发缺陷形成作为超离子转变的起源","az":"固态电解质有望实现更安全、更高能量密度的电池，但只有少数材料能达到实用所需的离子电导率。II型超离子导体在低、高离子电导率区间之间经历连续的温度驱动转变，是高性能固态电解质的有力候选材料，但其转变机制尚未被充分理解。本研究利用基于Allegro机器学习力场（MLFF）的长时间尺度分子动力学模拟，对具有反萤石结构的典型超离子导体Li2O和Li2S进行了研究，该力场在密度…（原文截断）","rv":"研究反萤石结构Li2O和Li2S的超离子转变机制，采用Allegro机器学习力场进行长时间尺度分子动力学模拟，揭示自发缺陷形成是超离子转变的起源。属于计算材料科学中的离子输运问题，与有机分子晶体、生成模型及视觉生成均无直接关联。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.26434/chemrxiv.15010957/v1","t":"Factorised Cartesian Atomic Cluster Expansion for Low-Cost Machine-Learning Interatomic Potentials","a":"Machine-learning interatomic potentials can reach the accuracy of density functional theory at a fraction of its cost, but the most accurate equivariant models remain expensive, mainly because of the tensor operations they perform for every pair of neighbouring atoms. We present FACE, a factorised Cartesian atomic cluster expansion that removes this bottleneck. Each neighbour contributes only a small set of radial functions and messages, and all mixing of feature channels is done once per atom, so the cost per neighbour no longer grows with the size of the model. Custom GPU kernels evaluate the remaining steps, and long-range electrostatics, dispersion and short-range repulsion attach through a single interface. We show that the training divergences we encountered originate in how the network weights are scaled, and we introduce a distillation scheme in which an ensemble generates additional, uncertainty-checked training data. On five rMD17 molecules, with identical training budgets and hardware, FACE is about as accurate as a 64-channel MACE model (over three seeds: better on one molecule, within the seed spread on two, 7–14% higher force errors on two), while it is 5.7 times faster at inference (4.9 times at the same cutoff) and needs 3.5–3.9 times less GPU memory. Training costs about the same per step. Distillation lowers the energy and force errors of a single aspirin model by 20% at fixed width, to 2.26 meV and 6.74 meV/Å, close to the published MACE values (2.2 and 6.6), and the distilled model runs stably in molecular dynamics.","au":["Albert Linda"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010957/v1","p":"2026-10-23","d":"2026-10-26","s":4.6,"tp":["mlip"],"kw":["density functional theory","equivariant","mace"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010957/v1","who":[],"tz":"面向低成本机器学习原子间势的分解笛卡尔原子簇展开","az":"机器学习原子间势可以以密度泛函理论的一小部分成本达到其精度，但最精确的等变模型仍然昂贵，主要是因为它们对每一对相邻原子都执行张量运算。本文提出FACE，一种分解的笛卡尔原子簇展开，消除了这一瓶颈。每个邻居仅贡献少量径向函数和消息，所有特征通道的混合仅对每个原子执行一次，因此每个邻居的成本不再随模型规模增长。自定义GPU内核评估剩余步骤，长程静电、色散和短程排斥通过…（原文截断）","rv":"提出FACE方法，通过分解笛卡尔原子簇展开将每个邻居的计算成本与模型规模解耦，配合自定义GPU内核加速，使机器学习原子间势在保持等变精度的同时大幅降低开销。属于计算化学中高效力场设计方向，与有机分子晶体、生成模型及视觉生成无直接关联。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01270","t":"Can DFT-Trained Neural Network Potentials Reproduce Structure, Solvation, and Water-Exchange Properties in Aqueous Magnesium Solutions?","a":"Magnesium ions play an essential role in many biological processes but remain challenging to model in biomolecular simulations. Despite considerable scientific effort, classical force fields fail to simultaneously reproduce key structural, thermodynamic, and kinetic solution properties, likely due to their inability to explicitly account for quantum many-body effects. Here, we develop and systematically benchmark MACE neural network potentials (NNPs) for aqueous MgCl2 solutions, trained on revPBE-D3/zd and revPBE0-D3/zd density functional theory reference data, and assess their ability to reproduce a broad range of experimental solution properties including the structure of the first hydration shell, diffusion coefficient, activity derivative, water-exchange rate, and mechanism as well as solvation free energy. Both NNPs accurately reproduce the octahedral structure of the first hydration shell, ion-pairing properties, and diffusion coefficients. Combining the NNPs with transition path sampling and other enhanced sampling techniques allows us to capture the rare event of water exchange in the first hydration shell of Mg2+, revealing a dissociative exchange mechanism. Transition interface sampling yields exchange rates within 1 order of magnitude of experiment, representing a substantial improvement over classical dissociative force fields. In contrast, the NNP-derived solvation free energy significantly underestimates the experimental value, revealing a limitation of the present local NNP architecture for describing ion solvation thermodynamics.","au":["Sebastian Falkner","Pablo Montero de Hijes","Christoph Dellago","Nadine Schwierz"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01270","p":"2026-10-24","d":"2026-10-26","s":4.3,"tp":["mlip"],"kw":["density functional theory","mace"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01270","who":[],"tz":"基于DFT训练的神经网络势函数能否再现水溶液中镁离子的结构、溶剂化及水交换性质？","az":"镁离子在许多生物过程中发挥关键作用，但在生物分子模拟中仍难以建模。尽管已有大量科学研究，经典力场无法同时再现溶液的关键结构、热力学和动力学性质，这很可能是由于其无法显式考虑量子多体效应。本文开发并系统基准测试了用于水溶液MgCl₂的MACE神经网络势函数（NNP），训练数据来自revPBE-D3/zd和revPBE0-D3/zd密度泛函理论参考数据，并评估其再现广泛实验溶液性质的能力，包括第一水合壳层的结构……","rv":"本文针对水溶液中镁离子模拟难题，基于DFT数据训练MACE神经网络势函数，系统评估其对结构、溶剂化和水交换动力学的再现能力。属于计算化学与分子模拟方向，与有机分子晶体关系较弱，与生成模型及视觉生成无直接关联，核心是等变神经网络在分子动力学中的应用。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.29111","t":"SU(2)-Equivariant Spinor Message Passing for Molecular Magnetism","a":"Predicting molecular magnetism often requires electronic-structure calculations with spin-orbit coupling (SOC), which are costly to repeat across many molecules. The underlying electronic states can transform as spinors, yet equivariant surrogates typically use only integer-rank features. Inspired by the spinor nature of these electronic states, we develop eSpinor, an SU(2)-equivariant graph neural network that propagates spinor features. We initialize spinor features from eigenvectors of an approximate SOC Hamiltonian and use gauge-covariant message passing with a gauge-invariant readout to make predictions independent of the arbitrary eigenbasis choice. On cobalt single-molecule magnet candidates, eSpinor improves zero-field-splitting predictions relative to NequIP, including for unseen ligands. For a dysprosium magnetic resonance imaging probe, eSpinor improves real electron-spin correlations over a Hamiltonian-informed baseline despite similar static crystal-field errors and fewer parameters, while accurately predicting low-field nuclear relaxation in water and after transfer to methanol without retraining. Overall, these results demonstrate that SU(2)-equivariant spinor message passing is a useful inductive bias for molecular magnetism. We also find that similar static tensor errors can yield different dynamical errors, motivating model selection based on accuracy for the intended physical observables.","au":["Erh-Wei Sheng","Beom Seok Kang","Yuchao Lin","Danish Khan","Anima Anandkumar"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29111","p":"2026-10-21","d":"2026-10-26","s":3.8,"tp":["mlip"],"kw":["equivariant","nequip"],"src":["arxiv"],"kind":"preprint","ax":"2610.29111","doi":"10.48550/arxiv.2610.29111","who":[],"tz":"面向分子磁性的SU(2)-等变自旋or消息传递","az":"预测分子磁性通常需要含自旋-轨道耦合（SOC）的电子结构计算，对大量分子重复计算代价高昂。底层电子态可以自旋or形式变换，但等变代理模型通常仅使用整数阶特征。受这些电子态的自旋or本质启发，本文开发了eSpinor，一个SU(2)-等变图神经网络，传播自旋or特征。自旋or特征从近似SOC哈密顿量的特征向量初始化，并使用规范协变消息传递和规范不变读出，使预测独立于任意特征基选择。在钴单分子磁体上……","rv":"本文提出eSpinor，一个SU(2)-等变图神经网络，通过传播自旋or特征预测分子磁性，以替代昂贵的SOC电子结构计算。属于等变深度学习与分子性质预测方向，与有机分子晶体、视觉生成关系较弱，核心贡献在于将自旋or表示引入等变消息传递框架。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01498","t":"Δ-HGPR: A Hierarchical Gaussian Process Framework for Active-Learning Δ-Potentials","a":"Δ-learning, which uses machine learning to represent only the difference between a high-accuracy reference and a lower-accuracy base calculator, is a promising route to high-fidelity molecular dynamics (MD) with limited training data, but it has lacked a unified protocol combining hierarchical descriptors with well-defined equilibrium sampling. We propose Δ-HGPR (hierarchical Gaussian process regression for Δ-learning), a framework for learning difference potentials, and its MD instantiation, Δ-HGPR-MD. The framework combines (i) a difference potential written as an additive radial (inverse-distance) term plus a many-body machine-learning correction, determined by a single regularized least-squares fit; (ii) the ensemble force standard deviation as an active-learning indicator with an automatically scaled threshold; and (iii) a difference potential held fixed within each round so that equilibrium NVT sampling is well-defined in both exploration and production. The many-body term of Δ-HGPR-MD uses smooth overlap of atomic positions (SOAP) descriptors with random Fourier features (Δ-HGPR-RFF). On a toy system whose difference potential contains a 1/r contribution beyond the cutoff of the local descriptor, the many-body term alone reproduces none of this force, however many features it is given, whereas the hierarchy recovers 99% of it, with a reach set by the cutoff of its radial term. In MD, the hierarchy reproduces about 80% of the shift of the ion-pair distribution toward the reference, while the many-body term alone leaves it where the base places it.","au":["Takahito Nakajima"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01498","p":"2026-10-24","d":"2026-10-26","s":3.5,"tp":["mlip"],"kw":["active learning"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01498","who":[],"tz":"Δ-HGPR：用于主动学习Δ势的层次高斯过程框架","az":"Δ-learning利用机器学习仅表示高精度参考方法与低精度基础计算器之间的差异，是有限训练数据下实现高保真分子动力学（MD）的有前景途径，但缺乏将层次描述符与明确定义的平衡采样相结合的统一协议。本文提出Δ-HGPR（用于Δ-learning的层次高斯过程回归）框架来学习差异势，及其MD实例化Δ-HGPR-MD。该框架将(i)写为加性径向（逆距离）项加多体机器学习修正的差异势，由单一正则化最小二乘…（原文摘要截断）","rv":"本文提出Δ-HGPR框架，用层次高斯过程回归学习Δ势（高精度与低精度能量之差），结合加性径向项与多体ML修正，并给出MD采样实例。属于计算化学/分子动力学中机器学习力场方向，与有机分子晶体无直接关系，与生成模型、视觉生成及纯数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01251","t":"Microenvironmental pH-Modulated Vitamin B6 Ternary Eutectics for BCS Class IV Drug Delivery","a":"The essence of developing multicomponent solid formulations for drugs with poor physicochemical and pharmacokinetic properties is rapidly evolving to cut short the consumption of resources and time. Quite a few commercially available binary drug formulations in the public domain serve as a prime illustration of the field’s success. However, the design and utilization of ternary or higher-order drug formulations can be more efficacious in terms of enhancing such properties of the drug as well as providing humidity resistance and controlling unexpected phase transitions during drug development. Low-soluble and low-permeable BCS IV class drugs continuously present a barrier by lowering their absorption in the body. Drugs mesalamine (MSA) and acetazolamide (ACZ) from the same BCS class were chosen to enhance properties by introducing the binary and ternary solid formulation approach. Soluble and acceptable co-partners, viz., vitamin B6 (pyridoxine hydrochloride, PRDHCl) and p-Aminobenzoic acid (PABA), were carefully chosen. The grinding of MSA and ACZ with p-aminobenzoic acid (PABA) resulted in a physical mixture (MSA·PABA) and a cocrystal (ACZ·PABA), respectively, due to the mismatch of functional moieties and shape. Interestingly, the addition of PRDHCl to the two binary systems generated two ternary eutectic solids, viz., PRDHCl·MSA·PABA and PRDHCl·ACZ·PABA. The thermal and spectroscopic analyses suggested that PRDHCl·MSA·PABA is a mixture of PRDHCl, MSA and PABA. However, PRDHCl·ACZ·PABA exists as a combination of the cocrystal ACZ·PABA and PRDHCl.","au":["Archita Goswami","Bhargab Patowary","Bipul Sarma"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01251","p":"2026-10-24","d":"2026-10-26","s":3.5,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01251","who":[],"tz":"微环境pH调控的维生素B6三元共熔体用于BCS IV类药物递送","az":"开发针对物理化学和药代动力学性质较差的药物的多组分固体制剂，其核心在于快速缩短资源消耗和时间。市面上已有多款二元药物制剂作为该领域成功的典型例证。然而，三元或更高阶药物制剂的设计与利用在增强药物性质、提供抗湿性以及控制药物开发过程中意外相变方面可能更为有效。低溶解度和低渗透性的BCS IV类药物持续构成障碍，降低了其…（原文摘要截断）","rv":"本文研究以维生素B6为共熔组分的三元共熔体，利用微环境pH调控实现BCS IV类难溶难渗药物的递送。属于药物晶体工程/共熔体设计领域，与有机分子晶体有直接关联（共熔体本质为有机分子晶体混合物），但与生成模型、视觉生成及纯数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.32678","t":"Probing the limits of forward screening and inverse design of crystal materials","a":"Crystal materials are designed either by screening known crystals for a target property or by generating new crystals with that property. Both routes are judged against public databases of known crystals, but these databases name the same crystal differently. Several materials announced as new by recent generative and autonomous discovery campaigns have since proved to be known phases or close variants of them. The limits of both routes remain unmeasured. Here we probe them by matching the crystals of 55 databases by structure into one self-extending database of 14.6 million crystals and 131.8 million property values, each traced to its source. Only 4.5% of its crystal-property pairs carry a value. To fill the empty pairs, we developed CGTNet, an equivariant graph transformer with state-of-the-art accuracy on several tasks of two public benchmarks. Trained on each task, it forms a library of property models whose predictions we release. The reach of forward screening has been underestimated. Known crystals hold tens of thousands of ultra-incompressible candidates without a recorded bulk modulus, and a post hoc audit of synthesis evidence finds among them ReN2, whose bulk modulus was measured at 428 GPa. The novelty claimed for inverse design has been overestimated. At an equal verification budget, a stiffness-conditioned generator returned more stiff hits than screening (100 versus 55), but all contained osmium and 82 repeated recorded compositions. Integrating and completing the databases of known crystals therefore
