moves the limits of both routes: it widens what screening can reach and sets the reference against which generated crystals are judged new.","au":["Zhilong Song","Zijun Pang","Lixue Cheng"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32678","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["crystal-gen","mlip"],"kw":["inverse design","equivariant"],"src":["arxiv"],"kind":"preprint","ax":"2610.32678","doi":"","who":[],"tz":"探测晶体材料正向筛选与逆向设计的极限","az":"晶体材料的设计要么通过筛选已知晶体来寻找目标性质，要么通过生成具有该性质的新晶体。两条路线都以公开已知晶体数据库为评判标准，但这些数据库对同一晶体的命名各不相同。近期若干生成式和自主发现工作宣布的「新材料」后来被证实是已知相态或其近变体。两条路线的极限此前从未被量化。本文通过将55个数据库中的晶体按结构匹配，构建了一个自扩展的包含1460万晶体和1.318亿性质值的统一数据库，每条记录均可追溯来源。其中仅4.5%的晶体-性质对携带了……（原文截断）","rv":"构建统一晶体结构数据库，量化正向筛选与逆向生成设计的边界。将55个数据库按结构匹配为1460万晶体的自扩展库，揭示命名不一致导致的「新晶体」误判问题。与「有机分子晶体」关系较弱，对象为无机及混合晶体；与「生成模型」有一定关联，讨论生成式设计的局限；与「视觉生成」和「相关数学」关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26701","t":"Challenging Atomistic Foundation Models on Disordered Carbons","a":"Foundation machine-learned interatomic potentials (MLIPs) promise broad transferability, yet their out-of-domain reliability is hard to establish. Here, we use pure and O/H-containing disordered carbon spanning multiple phases, competing hybridisations and porous frameworks to stress-test six popular foundation MLIPs. We first screen all six on density functional theory (DFT) energy and force errors and binding curves, then subject four to melt-quench-anneal molecular dynamics and evaluate the resulting structural observables. Binding curves and O/H-containing trajectories reveal unphysical extrapolation and dynamical failures that low DFT energy and force errors fail to reveal. Of the models tested, MACE-MH-1 is the most consistently robust, with low DFT errors and stable MD. Despite differing architectures, OMAT-based models share structural biases, highlighting the importance of training coverage. All four models generate structures of nanoporous carbon that reproduce the principal experimental and specialised carbon potential signatures. Incorporating O/H leaves short-range order largely unchanged but shifts pore-size distributions towards larger pores. These results emphasise the need for application-specific validation and extend molecular dynamics modelling of nanoporous carbon towards experimentally realistic structures.","au":["Joseph Hart","Samuel G. H. Brookes","Fabian L. Thiemann","Christoph Schran"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26701","p":"2026-10-19","d":"2026-10-26","s":2.6,"tp":["mlip"],"kw":["density functional theory","mace"],"src":["arxiv"],"kind":"preprint","ax":"2610.26701","doi":"","who":[],"tz":"在无序碳上挑战原子级基础模型","az":"基础机器学习原子间势（MLIP）承诺了广泛的迁移能力，但其域外可靠性难以确立。本文利用纯碳及含O/H的无序碳体系，涵盖多相态、竞争杂化方式和多孔框架，对六种主流基础MLIP进行压力测试。首先，在密度泛函理论（DFT）能量与力误差及结合曲线上对全部六种模型进行筛选；随后，对其中四种模型执行熔淬退火分子动力学模拟，并评估所得结构可观测量。结合曲线及含O/H轨迹揭示了低DFT能量和力误差所无法暴露的非物理外推和动力学失效。在模型……","rv":"本文以纯碳及含O/H无序碳（多相、竞争杂化、多孔框架）为压力测试集，系统评估六种基础MLIP的域外可靠性，通过DFT误差筛选和熔淬退火MD揭示结合曲线与轨迹中的非物理外推。属于计算材料/分子模拟方向，与有机分子晶体仅共享碳基材料背景，与生成模型、视觉生成及纯数学基本无关，关联较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32341","t":"Flexo-Photoresponses from First Principles","a":"Many functionally important materials, such as silicon, possess high-symmetry crystal structures that forbid even-order nonlinear optical responses, thereby limiting their application in e.g., photonics and optoelectronics. Strain gradients can effectively break symmetries, activating otherwise forbidden optical responses. Although such flexo-photoresponses have attracted considerable interest recently, a comprehensive microscopic theoretical framework is still lacking. Here, we develop a first-principles approach that can systematically evaluate a wide range of flexo-photoresponses in realistic materials. By mapping strain gradients to long-wavelength phonons within the established theory of electron-phonon coupling, our approach captures the nonlocal quantum-mechanical effects of lattice deformations on nonlinear optical responses. Applying the framework to prototypical centrosymmetric materials, including Si, cubic $\\rm SrTiO_3$, and monolayer black phosphorus, we demonstrate that a strain gradients of $10^5\\sim10^6~\\rm m^{-1}$ can induce flexo-second-harmonic generation and flexo-bulk photovoltaic effects comparable to the intrinsic responses of non-centrosymmetric crystals. Our work establishes a rigorous foundation for strain gradient engineering of light-matter interactions, opening new avenues for nanoscale optomechanics, optoelectronics, and beyond.","au":["Zhichao Guo","Hua Wang","Haowei Xu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32341","p":"2026-10-23","d":"2026-10-26","s":0.0,"tp":[],"kw":[],"src":["arxiv"],"kind":"preprint","ax":"2610.32341","doi":"","who":[],"tz":"基于第一性原理的屈光-光响应","az":"许多功能重要材料（如硅）具有高对称性晶体结构，禁止偶数阶非线性光学响应，从而限制了其在光子学和光电子学等领域的应用。应变梯度可以有效打破对称性，激活原本被禁止的光学响应。尽管此类屈光-光响应近年来引起了广泛关注，但全面的微观理论框架仍然缺乏。本文发展了一种第一性原理方法，可以系统评估真实材料中广泛范围的屈光-光响应。通过将应变梯度映射到已建立理论中的长波长声子……","rv":"该工作针对高对称性晶体中偶数阶非线性光学响应被禁的问题，发展了基于第一性原理的屈光-光响应计算方法，将应变梯度映射为长波长声子。属于凝聚态物理与计算材料学范畴，与有机分子晶体关系较弱，与生成模型、视觉生成无直接关联。","tr":"","tw":"","why":""},{"k":"doi:10.1021/acs.cgd.6c01198","t":"A Calix[4]arene Supramolecular Gel for Pharmaceutical Crystal Growth Enabled by Anion-Induced Conformational Modulation","a":"Two novel calix[4]arene derivatives (compounds 1 and 2), incorporating 1,2,3-triazole and d/l-phenylalanine moieties within the linker, have been prepared. Upon the addition of tetrabutylammonium dihydrogen phosphate (TBAHP) followed by sonication at 42−48 °C for 15 min, compound 1 formed a supramolecular gel in n-butanol, whereas 2 did not undergo gelation under identical conditions. Variable-temperature 1H NMR studies suggest that dihydrogen phosphate induces a conformational change in 1, consistent with modulation of the calix[4]arene framework, thereby exposing additional intermolecular interaction sites that promote supramolecular gel assembly. Rheological measurements demonstrated that both the mechanical stability and the storage modulus of the resulting gel increased with increasing concentrations of the Compound 1/TBAHP system in n-butanol. Although the gel exhibited thixotropic behavior, recovery of the gel structure following shear was relatively slow. Notably, a pharmaceutical salt cocrystal comprising furosemide and its tetrabutylammonium salt was successfully grown within the Compound 1/TBAHP/n-butanol supramolecular gel. Although the same salt cocrystal could also be obtained from a TBAHP/n-butanol solution, crystallization required a higher concentration of furosemide than in the gel system.","au":["Xiuqin Cai","Jonathan W. Steed"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01198","p":"2026-10-23","d":"2026-10-23","s":6.5,"tp":["csp"],"kw":["pharmaceutical crystal","cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01198","who":[],"tz":"阴离子诱导构象调控实现的杯[4]芳烃超分子凝胶用于药物晶体生长","az":"制备了两种新型杯[4]芳烃衍生物（化合物1和2），其连接臂中分别引入了1,2,3-三唑和d/l-苯丙氨酸基团。在加入四丁基铵二氢磷酸盐（TBAHP）后于42−48 °C超声处理15分钟，化合物1在正丁醇中形成了超分子凝胶，而化合物2在相同条件下未发生凝胶化。变温1H NMR研究表明，二氢磷酸盐诱导化合物1发生构象变化，与杯[4]芳烃骨架的调控一致，从而暴露出额外的分子间相互作用位点，促进超分子凝胶组装。流变学测量表明……","rv":"该工作设计了两类杯[4]芳烃衍生物，发现二氢磷酸盐阴离子可诱导特定构象变化从而触发超分子凝胶化，为药物晶体生长提供模板环境。属于超分子化学与晶体生长领域，与有机分子晶体有一定关联（涉及晶体生长调控），但与生成模型、视觉生成无直接关系。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jpcc.6c06133","t":"Improving the Temperature Stability of MgZrNb2O8 through the Synergistic Effect of Ta5 + Substitution and High-Entropy Strategy","a":"High-entropy Mg(ZrHfTiSnGe)0.2(Nb1–xTax)2O8 (x = 0–1) microwave dielectric ceramics were successfully synthesized via a solid-state reaction method. The effects of Ta5+ substitution and high entropy on sintering behavior, crystal structure, and microwave dielectric properties were systematically investigated. XRD confirms that Hf4+, Ti4+, Sn4+, Ge4+, and Ta5+ successfully entered the crystal lattice, forming a single-phase solid solution with a wolframite structure (P2/c space group). SEM images show that grains grow well, the grain size is uniform, and there are few pores. HRTEM images show that the sample has both structural long-range order and local lattice distortion. The dielectric constant (εr) increases with Ta5+ substitution, which is primarily attributed to the higher ionic polarizability of Ta5+ and the cation “under-bonding” effect. The continuous decline in the quality factor (Q × f) value is closely related to the reductions in both relative density and lattice energy. This is further supported by the broadening of the Nb/Ta–O symmetric stretching vibration peak in Raman spectra, indicating enhanced phonon interactions. Most importantly, the temperature coefficient of resonant frequency (τf) improves to −10 ppm/°C, benefiting from the increase in bond energy and the weakening of [AO6] (A = Mg, Zr, Hf, Ti, Sn, and Ge) octahedral distortion.","au":["Yao Sun","Xiaokang Wu","Yuanming Lai","Haizhou Ran","Linqiao Zhang","Lin Xu","Qian Liu","Chongsheng Wu","Yuanxun Li","Li Yue"],"v":"The Journal of Physical Chemistry C","u":"https://doi.org/10.1021/acs.jpcc.6c06133","p":"2026-10-23","d":"2026-10-23","s":5.4,"tp":["csp"],"kw":["crystal structure","lattice energy","space group"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jpcc.6c06133","who":[],"tz":"通过Ta5+取代与高熵策略的协同效应提高MgZrNb2O8的温度稳定性","az":"通过固相反应法成功合成了高熵Mg(ZrHfTiSnGe)0.2(Nb1–xTax)2O8（x = 0–1）微波介质陶瓷。系统研究了Ta5+取代和高熵效应对方块行为、晶体结构和微波介质性能的影响。XRD证实Hf4+、Ti4+、Sn4+、Ge4+和Ta5+成功进入晶格，形成了具有钨铁矿结构（P2/c空间群）的单相固溶体。SEM图像显示晶粒生长良好，晶粒尺寸均匀，气孔较少。HRTEM图像显示样品同时具有结构长程有序性和局部晶格畸变。介电常数…","rv":"该工作针对MgZrNb2O8微波介质陶瓷，采用Ta5+取代结合高熵策略（引入Zr、Hf、Ti、Sn、Ge五种阳离子）改善温度稳定性。属于无机功能陶瓷/微波介质材料范畴，与有机分子晶体、生成模型、视觉生成均无直接关联，与相关数学也关系较弱。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.1021/acs.cgd.6c01015","t":"Multimodal Fusion-Based Prediction and Preparation of Cocrystal: A Case Study of Diosmetin","a":"Cocrystals offer promising approaches for the targeted regulation of raw material properties. Nevertheless, the accurate screening of cocrystal co-formers remains a critical bottleneck in the rational preparation of cocrystals. To address this challenge, a cocrystal prediction model based on multimodal fusion was constructed by integrating molecular descriptors, fingerprints, SMILES strings and molecular graphs to screen potential co-formers. The model incorporates a dynamic attention fusion mechanism and a tailored data-balancing strategy to address unimodal limitations and class imbalance, thereby enhancing classification performance under the present evaluation framework. It demonstrated strong classification performance and outperformed the evaluated unimodal models. Diosmetin was selected as the model compound, and systematic virtual screening identified promising co-formers, leading to the successful synthesis of diosmetin-4,4′-bipyridine and diosmetin-isonicotinamide cocrystals. Structural characterization revealed a 2:1 supramolecular network of diosmetin-4,4′-bipyridine stabilized by O−H···N hydrogen bonds. The two cocrystals showed lower moisture uptake than diosmetin under the tested high-humidity conditions of 40 °C/75% RH and 40 °C/95% RH. This study presents a multimodal fusion strategy for cocrystal prediction and highlights its potential in the rational design of solid forms.","au":["Yunxia Li","Di Xu","Xiaoxiao Liang","Zujin Yang","Shiyuan Liu","Yanbin Jiang"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01015","p":"2026-10-23","d":"2026-10-23","s":4.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01015","who":[],"tz":"基于多模态融合的共晶预测与制备：以Diosmetin为例","az":"共晶为靶向调控原料性质提供了有前景的途径。然而，共晶共晶体的准确筛选仍是共晶合理制备的关键瓶颈。为应对这一挑战，通过整合分子描述符、指纹、SMILES字符串和分子图，构建了一个基于多模态融合的共晶预测模型，用于筛选潜在共晶体。该模型 incorporates 动态注意力融合机制和定制的数据平衡策略，以解决单模态局限性和类别不平衡问题，从而在当前评估框架下提升分类性能。它展示了…","rv":"该工作以Diosmetin为案例，构建多模态融合（分子描述符、指纹、SMILES、分子图）共晶预测模型，采用动态注意力融合和数据平衡策略筛选共晶体。属于有机分子晶体/共晶设计领域，与生成模型有一定交叉（多模态分类），但与视觉生成、相关数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/jacs.6c10255","t":"Breaking Symmetry Cancellation: Heterovalent Substitution Unlocks Ultrastrong, Phase-Matchable Nonlinearity in Deep-Ultraviolet Tetrahedral Crystals","a":"Deep-ultraviolet (deep-UV) nonlinear optical (NLO) crystals demand a challenging integration of strong second-harmonic generation (SHG), sufficient birefringence for phase matching (PM), and a wide bandgap (λ < 200 nm). In tetrahedron-based materials, the hyperpolarizabilities of constituent tetrahedra usually nearly cancel due to structural symmetry, resulting in weak SHG and small birefringence─a classic example being α-SiO2. Breaking this symmetry-driven cancellation while retaining deep-UV transparency thus represents a key chemical design challenge. Here, we report a deep-UV transparent NLO crystal BeSO4 derived from α-SiO2 via stepwise heterovalent tetrahedral substitution. This crystal crystallizes in the noncentrosymmetric tetragonal space group, with alternating BeO4 and SO4 tetrahedra forming [Be3S3O18] six-membered rings. By effectively breaking the symmetry cancellation via alternating low-valence (Be2+) and high-valence (S6+) tetrahedra, BeSO4 achieves a deep-UV cutoff at 176 nm, an exceptional SHG response of 5.1 × KDP at 1064 nm─the strongest among all deep-UV sulfates and Be-containing deep-UV crystals, and a birefringence of 0.038 at 590 nm, almost seven times that of the isostructural BPO4. Unlike BPO4 and α-SiO2, BeSO4 exhibits SHG behavior consistent with phase-matchability, and under 532 nm excitation, it produces a detectable second-harmonic signal at 266 nm.","au":["Xia Zhang","Jia-Jun Zhang","Zhi Li","Xiangyu Hao","Xiwei Hu","Yi-Gang Chen","Miriding Mutailipu","Xian-Ming Zhang"],"v":"Journal of the American Chemical Society","u":"https://doi.org/10.1021/jacs.6c10255","p":"2026-10-23","d":"2026-10-23","s":2.7,"tp":["csp"],"kw":["space group"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/jacs.6c10255","who":[],"tz":"打破对称性抵消：异价取代在深紫外四面体晶体中解锁超强、可相位匹配的非线性","az":"深紫外（deep-UV）非线性光学（NLO）晶体需要同时具备强二次谐波产生（SHG）、足够的双折射以实现相位匹配（PM）以及宽带隙（λ < 200 nm）。在基于四面体的材料中，组成四面体的超极化率通常因结构对称性而近乎抵消，导致SHG弱、双折射小——α-SiO2即为经典例子。在保持深紫外透明度的同时打破这种对称性驱动的抵消，是关键的化学设计挑战。本文报道了一种深紫外透明NLO晶体BeSO4，它通过逐步异价四面体取代从α-SiO2衍生而来。该晶体……","rv":"该工作针对深紫外非线性光学晶体设计，通过异价四面体取代（Si→Be/S）打破α-SiO2中四面体超极化率的对称性抵消，获得BeSO4晶体，实现强SHG与可相位匹配双折射。属于无机分子晶体中的非线性光学材料设计，与生成模型、视觉生成无直接关联，与晶体结构对称性分析相关。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01241","t":"From Structurally Related Solvates to Divergent Anhydrous Polymorphs: Desolvation Pathways of Sotorasib","a":"Sotorasib is a covalent KRAS G12C inhibitor with multiple hydrogen-bonding sites and conformationally flexible groups, making it prone to solvate formation. In this work, eight sotorasib solvates were obtained and systematically characterized, and their crystal structures were determined by SCXRD. Among them, SMeOHα, SDCE, and SMIX are previously unreported solvates. Except for SMIX, the other seven solvates crystallize in the same orthorhombic space group with similar unit-cell parameters and a conserved host−host hydrogen-bonding motif, while differences in guest stoichiometry, local interactions, and lattice occupancy generate distinct packing environments. Upon guest removal, these related solvates exhibit divergent post-desolvation evolution, with lattice destabilization followed by thermal-history-dependent structural reorganization toward different anhydrous polymorphs. Under dynamic heating, DSC reveals Form II-related thermal evolution for SACN and SMeOHα, while HSM further identifies melt-mediated recrystallization for SMeOHα. Molecular dynamics simulations and solvent-vapor-induced transformation experiments further indicate lattice adaptability during guest removal and exchange. These results highlight the roles of lattice environment and thermal history in regulating post-desolvation evolution and polymorph formation.","au":["Ruoxi Huang","Yue Xu","Jia Tong","Jie Lu"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01241","p":"2026-10-22","d":"2026-10-22","s":5.0,"tp":["csp"],"kw":["space group","polymorph"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01241","who":[],"tz":"从结构相关的溶剂化物到分化的无溶剂多晶型：Sotorasib的脱溶剂路径","az":"Sotorasib是一种共价KRAS G12C抑制剂，具有多个氢键位点和构象柔性基团，容易形成溶剂化物。本工作中，获得了八个Sotorasib溶剂化物并进行了系统表征，其晶体结构通过单晶X射线衍射（SCXRD）确定。其中，SMeOHα、SDCE和SMIX为先前未报道的溶剂化物。除SMIX外，其余七个溶剂化物结晶于同一正交晶系空间群，具有相似的晶胞参数和保守的主-主氢键基序，而客体化学计量比、局部相互作用和晶格占据率的差异产生了不同的堆积环境。在去除客体后，这些相关的……","rv":"该工作系统表征了KRAS G12C抑制剂Sotorasib的八个溶剂化物晶体结构，并追踪其脱溶剂后向不同无溶剂多晶型的转变路径。属于有机分子晶体中的溶剂化物与多晶型研究，关注氢键基序保守性与堆积差异，与生成模型、视觉生成无直接关联。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01494","t":"DeepHartree: A Poisson-Coupled Neural Field for One-Shot Density Functional Theory","a":"Linear-combination-of-atomic-orbital (LCAO) density functional theory (DFT) incurs steep costs when it constructs Coulomb terms and iterates the self-consistent field (SCF) equations. Matrix-learning approaches can bypass parts of this workflow, but their outputs inherit the dimensions and conventions of a fixed orbital basis. We introduce DeepHartree, a Poisson-coupled neural field that connects continuous real-space prediction to LCAO electronic structure. An E(3)-equivariant network predicts the Hartree potential, and the Poisson equation converts this potential into electron density. Atom-centered Gaussian fields resolve the near-nuclear region, while a molecule-level correction enforces the electron count. Analytical Gaussian integrals and numerical quadrature connect the predicted fields to the Kohn–Sham matrix. One diagonalization provides estimates of frontier orbital energies and the occupied subspace, and yields the density matrix used to evaluate energy components and initialize SCF. Mean molecular weighted normalized mean absolute errors (wNMAEs) are 0.110% for QM9 and 0.199% for VQM24 on PySCF level-0 grids, increasing to 1.366% and 2.218%, respectively, on level-3 grids. Models trained on def2-SVP densities transfer without retraining to def2-TZVP and def2-QZVP, retaining total-energy accuracy and occupied-subspace agreement. The Hybrid method combines finite differences and first-order automatic differentiation with analytical Gaussian integrals and multilevel quadrature to accelerate field-to-matrix conversion.","au":["Jiankun Wu","Jinming Fan","Chao Qian","Shaodong Zhou"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01494","p":"2026-10-22","d":"2026-10-22","s":4.0,"tp":["mlip"],"kw":["density functional theory","equivariant"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01494","who":[],"tz":"DeepHartree：用于一次性密度泛函理论的Poisson耦合神经场","az":"线性组合原子轨道（LCAO）密度泛函理论（DFT）在构建库仑项和迭代自洽场（SCF）方程时计算代价高昂。矩阵学习方法可以绕过部分流程，但其输出继承了固定轨道基组的维度和约定。我们提出DeepHartree，一种Poisson耦合神经场，将连续实空间预测与LCAO电子结构联系起来。一个E(3)-等变网络预测Hartree势，Poisson方程将该势转换为电子密度。原子中心高斯场解析核附近区域，而分子级修正强制……（原文截断）","rv":"该方法用E(3)-等变神经网络直接预测Hartree势，再经Poisson方程反解电子密度，实现一次性绕过SCF迭代。核心对象是分子电子结构，与有机分子晶体、视觉生成关系较弱；与相关数学（Poisson方程、等变表示）有交叉，但本质是量子化学计算加速。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01031","t":"Voxelotor Polymorphs: Crystalline Diversity of a Highly Potent Sickle Cell Anaemia Drug","a":"The solid-state landscape of highly flexible organic molecules often presents profound challenges and opportunities in materials chemistry, critically dictating macroscopic, physicochemical, and biopharmaceutical properties. Herein, we report voxelotor, a BCS Class II drug historically developed for sickle cell disease, as a noteworthy model system to elucidate nucleation pathways and a non-classical structure-performance relationship, with bioavailability that is critically dependent on its solid form. We report the preferential crystallization, multigram scale-up, and comprehensive structural elucidation of seven distinct polymorphic forms (Forms I-VII), including four previously undiscovered solid phases. Single-crystal X-ray diffraction and computational lattice energy calculations, including Hirshfeld surface analysis, show that its rich polymorphic diversity is rooted in extreme torsional adaptability (variations in τ2 from -160.0° to +110.0°), which drives parallel displaced π···π stacking and hydrogen-bonded assemblies. Thermal and humidity stress profiling discloses a complex relationship between thermodynamic stability and kinetic trapping. Notably, we identified paradoxical stability behavior in which seemingly robust, high lattice energy metastable states (e.g., Forms III, IV, V, and VI) undergo temperature- and moisture-promoted structural transformation and solid-state conversion to Form I crystals, which exhibit greater stability under ambient conditions.","au":["Christy P. George","Akram A. Khan","Parth S. Shaligram","Nagabhushan Shet","Tabrez R. Shaikh","Rinu Pandya","Ganesh More","Ziya Tufail","Kumar Vanka","Ajay Kumar"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01031","p":"2026-10-22","d":"2026-10-22","s":3.2,"tp":["csp"],"kw":["lattice energy"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01031","who":[],"tz":"Voxelotor多晶型：一种高效镰状细胞贫血药物的晶体多样性","az":"高度柔性有机分子的固态景观在材料化学中常带来深刻挑战与机遇， critically 决定宏观、理化及生物制药性质。本文报告Voxelotor——一种BCS II类药物，历史上为镰状细胞病开发——作为阐明成核路径和非经典结构-性能关系的显著模型体系，其生物利用度 critically 依赖于其固相形态。我们报告了七种不同多晶型（I–VII型）的优先结晶、多克级放大和全面结构解析，其中包括四种此前未发现的……（原文截断）","rv":"直接研究有机药物Voxelotor的固态多晶型，报告了七种晶型的优先结晶、多克放大及结构解析，其中四种为新发现。属于典型的有机分子晶体/药物多晶型研究，与生成模型、视觉生成无直接关联，数学层面仅涉及晶体学对称性分析。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01588","t":"MARS: Machine-Learned Force Field Framework for Automated Conformational Sampling, Vibrational Spectroscopy, and Microsolvation","a":"We present MARS, an open-source Python package for automated conformational ensemble generation, infrared spectrum prediction, and explicit microsolvation of molecular systems. Built on JAX for GPU acceleration and automatic differentiation, MARS is carried out with machine-learned force fields (MLFFs), including SO3LR and MACE, with a four-phase conformational sampling workflow combining metadynamics, multitemperature molecular dynamics, and genetic algorithms. The package provides automated vibrational mode classification using Wilson B-matrix projections and functional group identification via graph-based pattern matching. We benchmark MARS on chemically diverse systems, including alkanes, halogenated aromatics, amino acids, peptides, drug-like molecules, phosphamides, host–guest complexes, and microsolvated biomolecular models. Semiempirical quantum-chemical methods have until now provided the practical state of the art for automated conformational sampling. Our benchmarks show that modern MLFFs can improve upon this paradigm by combining greater accuracy for high-level relative conformer energies with lower computational cost and more favorable scaling with molecular size. IR benchmarks against experimental gas-phase spectra additionally show performance comparable to quantum-chemical methods, with chemically interpretable mode assignments.","au":["Sergio Suárez-Dou","Miguel Gallegos","Florian N. Brünig","Alexandre Tkatchenko"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01588","p":"2026-10-21","d":"2026-10-21","s":5.9,"tp":["mlip"],"kw":["mace"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01588","who":["Alexandre Tkatchenko"],"tz":"MARS：用于自动构象采样、振动光谱和微溶剂化的机器学习力场框架","az":"我们提出MARS，一个开源Python包，用于分子系统的自动构象系综生成、红外光谱预测和显式微溶剂化。MARS基于JAX实现GPU加速和自动微分，采用机器学习力场（MLFFs），包括SO3LR和MACE，通过四阶段构象采样工作流结合元动力学、多温度分子动力学和遗传算法。该包提供基于Wilson B矩阵投影的自动振动模式分类和基于图模式匹配的功能团识别。我们在化学多样化的体系上对MARS进行了基准测试，包括烷烃……","rv":"MARS是基于JAX和机器学习力场（SO3LR、MACE）的开源Python工具包，实现有机分子构象采样、红外光谱预测和微溶剂化模拟，结合元动力学、多温度MD和遗传算法。属于计算化学/分子模拟工具，与有机分子晶体有间接关联（分子层面），与生成模型、视觉生成无直接关系。","tr":"high","tw":"作者：Alexandre Tkatchenko；期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01209","t":"Chameleonic π-Hole Behavior in Metal−Isocyanide Complexes: N ↔ C Composition-Controlled Migration","a":"Cocrystal architecture reflects the cumulative outcome of competing and cooperating noncovalent interactions (NCIs) within the lattice. Here we demonstrate that the electrophilic π-hole of a coordinated aryl isocyanide is chameleonic: its localization migrates between the nitrogen and carbon termini of the C≡N bond in direct response to crystal composition. X-ray diffraction analysis of trans-[PdI2(CNC6H4Cl-4)2] (1) and its iodine cocrystals 1·I2 and 1·2I2, complemented by the isostructural platinum(II) analogue 2·I2, reveals three distinct binding regimes: Pd-πAr assembly in the parent complex, Pd-π-(CN) assembly at 1:1 stoichiometry, and π-(CN)-hole···I(LP) contacts at 1:2 stoichiometry. Quantum chemical analysis (Molecular Electrostatic Potential, Quantum Theory of Atoms in Molecules, NCIplot, Energy Decomposition Analysis, Natural Bond Orbital) establishes that the short C≡N bond and the small electrostatic differential between the two termini generate a delocalized π-hole that adapts to spatial demands imposed by competing halogen bonds. Energy decomposition further reveals that the N ↔ C migration is accompanied by a fundamental change in the stabilizing forces, from dispersion- and correlation-dominated stacking to orbital- and electrostatic-driven halogen bonding. These findings establish stoichiometry-controlled π-hole directionality as a design principle for engineering cocrystals in which multiple NCI types coexist in spatially optimized arrangements.","au":["Mikhail A. Kinzhalov","Polina V. Komova","Rosa M. Gomila","Antonio Frontera","Vadim Yu Kukushkin","Nadezhda A. Bokach"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01209","p":"2026-10-21","d":"2026-10-21","s":3.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01209","who":[],"tz":"金属-异氰化物配合物中变色龙式π-hole行为：N↔C组成控制迁移","az":"共晶结构反映了晶格内竞争与合作非共价相互作用（NCIs）的累积结果。本文证明配位芳基异氰化物的亲电π-hole具有变色龙特性：其定位在C≡N键的氮端和碳端之间迁移，直接响应于晶体组成的变化。对trans-[PdI2(CNC6H4Cl-4)2]（1）及其碘共晶1·I2和1·2I2的X射线衍射分析，辅以同构铂(II)类似物2·I2，揭示了三种不同的结合模式：母体配合物中的Pd-πAr组装、1:1化学计量比下的Pd-π-(CN)组装，以及1:2化学计量比下的π-(CN)-hole···I(LP)接触。Q……","rv":"研究金属-异氰化物配合物共晶中π-hole的组成依赖性迁移，通过X射线衍射和量子化学分析揭示Pd-πAr、Pd-π-(CN)及π-hole···I(LP)三种非共价结合模式。与有机分子晶体关系较近（共晶结构、非共价相互作用分析），但与生成模型、视觉生成无关联。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1107/s2052252526008912","t":"The overlooked ZIF: reviving [Cu(imidazolato) 2 ] from 1960s literature","a":"Metal–organic frameworks (MOFs), and in particular zeolitic imidazolate frameworks (ZIFs), are amongst the most well studied materials in modern chemistry. MOFs emerged as an explicit subfield of chemistry in the late 1980s and 1990s. However, much foundational work was accomplished in earlier decades. Here, we detail the structural and gas-adsorption characterization of [Cu(im) 2 ] (im = imidazolate), a ZIF that was widely reported in the early 1960s. This compound exists as several polymorphs. We re-prepared the historic blue polymorph [Cu(im) 2 ]-B, which has a sodalite topology, confirmed its identity by single-crystal X-ray diffraction, and measured its gas-adsorption isotherms. We conclude that the true origin of ZIFs lies with a copper(II) framework discovered more than 60 years ago that has been overlooked by recent literature.","au":["Cara Bosman","Shane G. Telfer"],"v":"IUCrJ","u":"https://doi.org/10.1107/s2052252526008912","p":"2026-10-20","d":"2026-10-20","s":3.8,"tp":["csp"],"kw":["polymorph"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1107/s2052252526008912","who":[],"tz":"被忽视的ZIF：从1960年代文献中复兴[Cu(咪唑酸根)₂]","az":"金属有机框架（MOFs），尤其是沸石咪唑酯骨架材料（ZIFs），是现代化学中研究最深入的材料之一。MOFs在20世纪80年代末和90年代才作为一个明确的化学子领域出现，但许多基础性工作早在更早的几十年就已完成。本文详细报道了[Cu(im)₂]（im = 咪唑酸根）的结构与气体吸附表征，这是一种在1960年代初期被广泛报道的ZIF。该化合物存在多种多晶型。我们重新制备了历史上报道的蓝色多晶型[Cu(im)₂]-B，其具有sodalite拓扑结构，通过单晶X射线衍射确认了其身份，并测量了其气体吸附等温线。我们进一步……","rv":"本文重新制备并表征了1960年代文献中报道的ZIF材料[Cu(im)₂]的蓝色多晶型（sodalite拓扑），通过单晶X射线衍射确认结构并测量气体吸附等温线。属于配位化学与有机分子晶体范畴，与生成模型、视觉生成及相关数学关系很弱，本质是材料历史考古与结构表征工作。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1039/d6ce00683c","t":"The Effect of High Pressure on Nanoporous Molecular Crystals of Cofacial Porphyrin/Phthalocyanine Heterodimers","a":"High-pressure single-crystal X-ray diffraction was used to characterize two phthalocyanine nanoporous crystals (PNCs) based on cofacial heterodimers of tetraphenylporphyrin (TPPCo) and octa(2’,6’-di-iso-propylphenoxy)phthalocyanine [(dipPhO)8PcCo], with and without a 4,4’-bipyridine \"wall-tie\" ligand....","au":["Gemma Turner","Nikolaos-Angelos Stamos","Shannah Kerrigan","Rebecca Blake","James Ross Brookes","Aston M Summers","Stephanie Bird","Rosemary Young","Alan Riboldi-Tunnicliffe","Rachel Williamson"],"v":"CrystEngComm","u":"https://doi.org/10.1039/d6ce00683c","p":"2026-10-20","d":"2026-10-20","s":3.7,"tp":["csp"],"kw":["molecular crystals"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1039/d6ce00683c","who":[],"tz":"高压对共面卟啉/酞菁异二聚体纳米多孔分子晶体的影响","az":"利用高压单晶X射线衍射表征了两种基于四苯基卟啉（TPPCo）与八(2',6'-二异丙基苯氧基)酞菁[(dipPhO)8PcCo]共面异二聚体的酞菁纳米多孔晶体（PNCs），分别含有和不含有4,4'-联吡啶「墙链」配体。……（原文截断）","rv":"高压单晶XRD研究共面卟啉/酞菁异二聚体纳米多孔分子晶体。在高压下表征两种PNCs的结构变化，含与不含联吡啶墙链配体。与「有机分子晶体」直接相关，涉及分子堆积与多孔结构；与「生成模型」「视觉生成」「相关数学」关系弱。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.1021/acs.cgd.6c00813","t":"Insights into the Nature and Thermal Phase Behavior of Mechanochemically Prepared Multicomponent Solids of 2-Amino-5-nitropyridine with para -Substituted Benzoic Acids","a":"The thermal phase behavior of binary systems consisting of the supramolecular building block 2-amino-5-nitropyridine (ANP) with five systematically varied series of para-substituted aromatic acids (4XBA), viz, benzoic acid (BA), 4-fluorobenzoic acid (4FBA), 4-chlorobenzoic acid (4CBA), 4-bromobenzoic acid (4BBA), and 4-iodobenzoic acid (4IBA), was investigated separately. While single-crystal structures of 1:1 ANP-4FBA, 1:1 ANP-4CBA, and 1:1 ANP-4BBA in this series are known, their bulk thermodynamic stability and mechanochemical phase behavior have remained unmapped. The bulk binary mixtures of various compositions were prepared by an environmentally friendly mechanochemical neat grinding method. The thermal properties of the ground materials were thoroughly mapped using differential scanning calorimetry (DSC). The solid−liquid thermal binary phase diagrams were systematically constructed using DSC data and validated using Tammann plots and Predictor of Eutectic Mixture (PoEM) analysis. The phase diagram study of all the five systems revealed the distinct thermal phase behavior across the series. The ANP-4FBA system forms a stable congruently melting 1:1 cocrystal characterized by a “W-shaped” phase diagram with two eutectic valleys, while the ANP-BA, ANP-4CBA, and ANP-4BBA systems form an incongruent 1:1 cocrystal characterized by an asymmetrical liquidus curve terminating at a horizontal peritectic isothermal line in their phase diagrams.","au":["K. S. Prabhuswamy","S. Naveen","Y. N. Sudhakar","P. A. Suchetan"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00813","p":"2026-10-20","d":"2026-10-20","s":3.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00813","who":[],"tz":"机械化学制备的2-氨基-5-硝基吡啶与对位取代苯甲酸多组分固体的本征性质与热相行为研究","az":"研究了由超分子构建模块2-氨基-5-硝基吡啶(ANP)与五种系统变化的对位取代芳香酸(4XBA)——即苯甲酸(BA)、4-氟苯甲酸(4FBA)、4-氯苯甲酸(4CBA)、4-溴苯甲酸(4BBA)和4-碘苯甲酸(4IBA)——组成的二元体系的热相行为。虽然该系列中1:1 ANP-4FBA、1:1 ANP-4CBA和1:1 ANP-4BBA的单晶结构已知，但其体相热力学稳定性和机械化学相行为尚未被系统表征。各种组成的体相二元混合物通过环境友好的机械化学干法研磨制备……","rv":"本文研究2-氨基-5-硝基吡啶(ANP)与五种对位取代苯甲酸经机械化学研磨制备的二元多组分固体，系统考察其热相行为与体相热力学稳定性。属于有机分子晶体与超分子化学领域，关注晶体相图与相变，与生成模型、视觉生成及相关数学基本无关。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1039/d6ce00725b","t":"Dual-halogen engineering of chlorothienyl chalcone crystals for tunable noncentrosymmetric packing and enhanced terahertz nonlinear optical response","a":"Fluorine substitution optimizes crystal growth and polar packing in chlorothienyl chalcone crystals, leading to enhanced SHG response and broadband THz emission.","au":["Fanghao Xuan","Yukang Liang","Yanxi Deng","Luyao Jiang","Chuyi Liang","Yurong Ma"],"v":"CrystEngComm","u":"https://doi.org/10.1039/d6ce00725b","p":"2026-10-20","d":"2026-10-20","s":0.0,"tp":[],"kw":[],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1039/d6ce00725b","who":[],"tz":"氯噻吩查尔酮晶体的双卤素工程：可调非中心对称堆积与增强太赫兹非线性光学响应","az":"氟取代优化了氯噻吩查尔酮晶体的晶体生长和极性堆积，从而增强了二次谐波(SHG)响应和宽带太赫兹(THz)发射。","rv":"本文通过双卤素（氟/氯）工程调控氯噻吩查尔酮晶体的非中心对称堆积，优化晶体生长与极性排列，增强二次谐波响应和宽带太赫兹非线性光学发射。属于有机分子晶体与晶体工程领域，聚焦卤素取代对晶体光学性能的影响，与生成模型、视觉生成及相关数学关系很弱。","tr":"","tw":"","why":""}],"trends":{"vision-gen":{"2026-10-22":3,"2026-10-20":4,"2026-10-23":8,"2026-10-19":4,"2026-10-21":1},"gen-model":{"2026-10-24":1,"2026-10-20":4,"2026-10-21":4,"2026-10-26":1,"2026-10-19":3,"2026-10-23":11,"2026-10-22":3,"2026-10-18":1},"gen-math":{"2026-10-26":1,"2026-10-21":4,"2026-10-23":1,"2026-10-20":2},"crystal-gen":{"2026-10-23":2,"2026-10-21":1,"2026-10-20":1},"csp":{"2026-10-22":3,"2026-10-20":4,"2026-10-24":2,"2026-10-23":4,"2026-10-21":1},"mlip":{"2026-10-25":1,"2026-10-23":6,"2026-10-19":3,"2026-10-21":5,"2026-10-22":2,"2026-10-24":2}},"events":[{"n":"MRS Fall Meeting","d":"2026-12-01","in":36,"u":"https://www.mrs.org/fall-meeting","note":"材料计算与 AI 相关 session"},{"n":"NeurIPS + ML4PS / AI4Science workshops","d":"2026-12-08","in":43,"u":"https://neurips.cc/","note":"机器学习与物理科学交叉方法的最新动向"}],"health":[],"run":{"started":"2026-10-26T23:30","status":"running","fetched":null,"new":null,"kept":null}};
(function(){
'use strict';
if(!DATA){ document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">这是模板文件。请先运行 <code>python3 -m radar dashboard</code> 生成 dashboard.html。</p>'; return; }

window.onerror=function(msg,src,line,col){ var d=document.createElement('div'); d.className='err';
  d.textContent='JS 错误：'+msg+' @'+line+':'+col; document.body.appendChild(d); };

const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>Array.from(el.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=86400000;
const TODAY=DATA.today;
const TOPICS=DATA.topics||[], TNAME={}, THUE={};
TOPICS.forEach(t=>{TNAME[t.id]=t.short||t.id; THUE[t.id]=t.hue;});
const DATA_ITEMS=DATA.items||[];
const DATA_DAYS=(DATA.days||[]).map(d=>({d:d.d,n:d.n}));
let ITEMS=DATA_ITEMS.slice();
let DAYS=DATA_DAYS.slice();
const EVENTS=DATA.events||[], TREND=DATA.trends||{};
const SRCNAME={arxiv:'arXiv',crossref:'期刊',openalex:'OpenAlex',rss:'新闻',github:'工具'};

const LS='research-radar.v1';
const DEFAULTS={view:'today',topics:[],sources:[],q:'',date:null,sort:'score',
  read:{},star:{},kept:{},note:{},theme:'auto',lastVisit:0,limit:80};
let state=Object.assign({},DEFAULTS);
let view=[], focusIdx=-1, saveTimer=null;
const openSet=new Set();   // expanded cards survive re-renders

function load(){
  try{ const raw=localStorage.getItem(LS); if(raw) state=Object.assign({},DEFAULTS,JSON.parse(raw)); }
  catch(e){ console.warn('localStorage 不可用：阅读状态仅在本次会话有效',e); }
}
function save(){
  try{ localStorage.setItem(LS,JSON.stringify(state)); }
  catch(e){ toast('浏览器存不下更多收藏副本'); }
}
function touch(){ save(); }
function itemCopy(it){
  return {
    k:it.k, t:it.t, tz:it.tz||'', a:it.a||'', az:it.az||'', au:it.au||[], v:it.v||'', u:it.u||'',
    p:it.p||'', d:it.d||'', s:it.s||0, tp:it.tp||[], kw:it.kw||[],
    src:it.src||[], kind:it.kind||'paper', ax:it.ax||'', doi:it.doi||'',
    who:it.who||[], why:it.why||'', rv:it.rv||'', tr:it.tr||'', tw:it.tw||''
  };
}
function applyKept(){
  if(!state.kept || typeof state.kept!=='object') state.kept={};
  const live={};
  DATA_ITEMS.forEach(it=>{ live[it.k]=it; });
  Object.keys(state.star||{}).forEach(k=>{ if(live[k]) state.kept[k]=itemCopy(live[k]); });
  Object.keys(state.kept).forEach(k=>{ if(!state.star[k]) delete state.kept[k]; });
  const extra=[];
  Object.keys(state.kept).forEach(k=>{
    if(!live[k] && state.kept[k]) extra.push(state.kept[k]);
  });
  ITEMS=DATA_ITEMS.concat(extra);
  const counts={};
  DATA_DAYS.forEach(d=>{ counts[d.d]=d.n; });
  extra.forEach(it=>{ if(it.d) counts[it.d]=(counts[it.d]||0)+1; });
  DAYS=Object.keys(counts).sort((a,b)=>b.localeCompare(a)).map(d=>({d:d, n:counts[d]}));
}

function daysAgo(d){ try{ return Math.round((new Date(TODAY+'T00:00:00')-new Date(d+'T00:00:00'))/DAY);}catch(e){ return 999; } }
function weekday(d){ try{ return '日一二三四五六'[new Date(d+'T00:00:00').getDay()]; }catch(e){ return ''; } }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1600); }

/* ---------------- filtering ---------------- */
function inView(it){
  const v=state.view;
  if(v==='today') return it.d===TODAY;
  if(v==='unread') return !state.read[it.k];
  if(v==='star') return !!state.star[it.k];
  if(v==='week') return daysAgo(it.d)<=6;
  if(v==='day') return it.d===state.date;
  return true;
}
function base(){ return ITEMS.filter(inView); }
function matches(it){
  if(!inView(it)) return false;
  if(state.topics.length && !it.tp.some(t=>state.topics.includes(t))) return false;
  if(state.sources.length && !it.src.some(s=>state.sources.includes(s))) return false;
  if(state.q){
    const q=state.q.toLowerCase();
    const hay=(it.t+' '+(it.tz||'')+' '+(it.a||'')+' '+(it.az||'')+' '+it.au.join(' ')+' '+it.v+' '+it.kw.join(' ')).toLowerCase();
    if(!hay.includes(q)) return false;
  }
  return true;
}
function hl(text){
  const safe=esc(text);
  if(!state.q) return safe;
  try{
    const q=state.q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return safe.replace(new RegExp(q,'gi'), m=>`<mark>${m}</mark>`);
  }catch(e){ return safe; }
}
function sortItems(list){
  const s=state.sort;
  if(s==='topic'){
    const order={}; TOPICS.forEach((t,i)=>order[t.id]=i);
    return list.sort((a,b)=>{
      const ia=order[a.tp[0]]==null?99:order[a.tp[0]], ib=order[b.tp[0]]==null?99:order[b.tp[0]];
      return ia-ib || b.s-a.s;
    });
  }
  return list.sort((a,b)=>{
    if(s==='date') return (b.p||b.d).localeCompare(a.p||a.d)||b.s-a.s;
    if(s==='venue') return (a.v||'~').localeCompare(b.v||'~')||b.s-a.s;
    return b.s-a.s;
  });
}
function compute(){ view=sortItems(ITEMS.filter(matches)); }
function unreadCount(){ return ITEMS.filter(it=>!state.read[it.k]).length; }
function starCount(){ return ITEMS.filter(it=>state.star[it.k]).length; }

/* ---------------- sidebar ---------------- */
function renderViews(){
  const defs=[['today','今天',ITEMS.filter(i=>i.d===TODAY).length],
              ['unread','未读',unreadCount()],
              ['star','只看收藏',starCount()],
              ['week','近 7 天',ITEMS.filter(i=>daysAgo(i.d)<=6).length],
              ['all','全部',ITEMS.length]];
  $('#views').innerHTML=defs.map(([v,label,n])=>
    `<button class="view${state.view===v?' on':''}" data-view="${v}">${label}<span class="n">${n}</span></button>`).join('');
}
function renderFilters(){
  const b=base(), cnt={}, scnt={};
  b.forEach(i=>{ i.tp.forEach(t=>cnt[t]=(cnt[t]||0)+1); i.src.forEach(x=>scnt[x]=(scnt[x]||0)+1); });
  $('#topicFilter').innerHTML=TOPICS.map(t=>{
    const on=state.topics.includes(t.id);

  $('#sourceFilter').innerHTML=Object.keys(SRCNAME).filter(s=>scnt[s]).map(s=>

}
function renderDates(){

    `<button class="date${state.view==='day'&&state.date===d.d?' on':''}" data-date="${d.d}">

function renderHealth(){

  $('#health').innerHTML=['<div style="margin-bottom:4px">本次抓取</div>'].concat(h.map(x=>
    `<div><span class="${x.err?'bad':'ok'}">●</span>${esc(x.src)}<span class="spacer"></span>${x.n}${x.err?' ⚠':''}</div>`)
  ).concat([`<div style="margin-top:6px">生成于 ${esc(DATA.generated)}</div>`]).join('');
}

/* ---------------- trend ---------------- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lastDays(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(TODAY+'T00:00:00'); d.setDate(d.getDate()-i); out.push(ymd(d)); } return out; }
function renderTrend(){
  const days=lastDays(14);
  const rows=TOPICS.map(t=>{
    const ser=days.map(d=>(TREND[t.id]||{})[d]||0);
    const max=Math.max(1,...ser);
    const cur=ser.slice(7).reduce((a,b)=>a+b,0), prev=ser.slice(0,7).reduce((a,b)=>a+b,0);
    const dlabel=prev?`${cur>=prev?'+':''}${Math.round((cur-prev)/prev*100)}%`:(cur?'NEW':'–');
    const cls=!prev?(cur?'new':'flat'):(cur>=prev?'up':'down');
    const bars=ser.map((v,i)=>`<span class="bar${i>=7?' now':''}" style="height:${Math.max(2,v/max*26)}px" title="${days[i]} · ${v} 条"></span>`).join('');
    const on=state.topics.includes(t.id);
    return `<button class="trow${on?' on':''}" data-topic="${t.id}" style="--h:${t.hue}">
      <span class="tname">${esc(t.short)}</span>
      <span class="spark">${bars}</span>
      <span class="tnum">${cur}<i class="${cls}">${dlabel}</i></span>
    </button>`;
  }).join('');
  $('#trend').innerHTML=`<div class="trend-head">近 14 天各主题新增（前 7 天 vs 后 7 天，点一行可筛选）<button class="mini" id="toggleTrend">收起</button></div>
    <div class="trend-body" id="trendBody">${rows}</div>`;
  $('#trendBody').classList.toggle('hidden',!!state.trendHidden);
}
function toggleTrend(){ state.trendHidden=!state.trendHidden; touch(); $('#trendBody').classList.toggle('hidden',!!state.trendHidden); $('#toggleTrend').textContent=state.trendHidden?'展开':'收起'; }

/* ---------------- list ---------------- */
function chip(t){ return `<span class="chip" style="--h:${THUE[t]||210}">${esc(TNAME[t]||t)}</span>`; }
function card(it){
  const read=!!state.read[it.k], star=!!state.star[it.k], h=THUE[it.tp[0]]||210;
  const kind=it.kind==='news'?'<span class="chip kind">新闻</span>':(it.kind==='release'?'<span class="chip kind">工具</span>':'');
  const srcs=it.src.length>1?`<span class="multi">多源×${it.src.length}</span>`:'';
  const who=(it.who||[]).map(w=>`<button class="who" data-q="${esc(w)}" title="按作者搜索">👤 ${esc(w)}</button>`).join('');
  const open=openSet.has(it.k);
  const trustLab={high:'高',mid:'中',low:'低'}[it.tr]||'';
  const comment=it.rv||it.why||'';
  return `<article class="card${read?' read':''}${star?' starred':''}${open?' open':''}" data-k="${esc(it.k)}" style="--h:${h}">
    <div class="chead">
      <button class="icon btn-read" title="标记已读 / 未读 (m)">${read?'✓':'○'}</button>
      <div class="ctitle"><a href="${esc(it.u||'#')}" target="_blank" rel="noopener" data-open="1">${hl(it.t)}</a>${it.tz?`<div class="zh">${esc(it.tz)}</div>`:''}</div>
      <span class="score" title="相关度 ${it.s}${it.tw?' · '+it.tw:''}">${it.s}${trustLab?`<span class="trust ${esc(it.tr)}">可信${trustLab}</span>`:''}</span>
      <button class="icon btn-star${star?' on':''}" title="收藏 (s)">${star?'★':'☆'}</button>
    </div>
    <div class="cmeta">${it.tp.map(chip).join('')}${kind}
      ${it.v?`<span class="venue">${esc(it.v)}</span>`:''}
      <span>${esc(it.p||it.d)}</span>${who}${srcs}</div>
    ${it.kw.length?`<div class="ckw">${it.kw.slice(0,6).map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
    ${comment?`<div class="cwhy">短评 ${esc(comment)}</div>`:''}
    <div class="cabs">${esc(it.a)||'<i>（无摘要）</i>'}</div>
    ${it.az?`<div class="cabs zhabs">${esc(it.az)}</div>`:''}
    <div class="cfoot">
      <button class="link btn-more">${open?'收起':'详情'}</button>
      ${it.ax?`<a class="link" href="https://arxiv.org/pdf/${esc(it.ax)}" target="_blank" rel="noopener">PDF</a>`:''}
      ${it.doi?`<a class="link" href="https://doi.org/${esc(it.doi)}" target="_blank" rel="noopener">DOI</a>`:''}
      <span class="spacer"></span>
      <button class="link btn-copy">复制引用</button>
    </div>
    <div class="more${open?'':' hidden'}">
      <div class="mrow"><b>作者</b>${esc(it.au.join('; ')||'—')}</div>
      <div class="mrow"><b>全部命中</b>${esc(it.kw.join('、')||'—')}</div>
      <div class="mrow"><b>来源</b>${esc(it.src.map(s=>SRCNAME[s]||s).join(' / ')||'—')}</div>
      <textarea class="note" rows="2" placeholder="备注：为什么留它 / 和我的课题什么关系…">${esc(state.note[it.k]||'')}</textarea>
    </div>
  </article>`;
}
function renderList(){
  const list=$('#list');
  if(!view.length){
    const scope={today:'今天',week:'近 7 天',unread:'未读',star:'只看收藏',day:'这一天'}[state.view]||'当前视图';
    const hint=(state.q&&state.view!=='all')
      ? `<button class="tool" id="searchAll" style="margin-top:10px">在全部历史里搜「${esc(state.q)}」</button>`
      : '';
    list.innerHTML=`<div class="empty"><b>${esc(scope)}里没有符合条件的条目</b>
      换个分区、清空搜索，或者等到明天 07:40 的新一轮抓取。${hint}</div>`;
    const b=$('#searchAll'); if(b) b.onclick=()=>{ state.view='all'; state.limit=DEFAULTS.limit; touch(); renderAll(); };
    renderCrumb(); return;
  }
  const shown=view.slice(0,state.limit);
  const byTopic=state.sort==='topic';
  let html='', last=null;
  shown.forEach(it=>{
    const g=byTopic?('tp:'+(it.tp[0]||'other')):it.d;
    if(g!==last){
      last=g;
      if(byTopic){
        const tid=it.tp[0]||'other', n=view.filter(x=>(x.tp[0]||'other')===tid).length;
        html+=`<div class="daybar"><span class="chip" style="--h:${THUE[tid]||210}">${esc(TNAME[tid]||'其他')}</span><span class="muted">${n} 条</span></div>`;
      }else{
        const n=view.filter(x=>x.d===it.d).length;
        html+=`<div class="daybar"><b>${it.d}</b><span class="wd">周${weekday(it.d)}</span><span class="muted">${n} 条</span>${it.d===TODAY?'<span class="chip kind">今天</span>':''}</div>`;
      }
    }
    html+=card(it);
  });
  if(view.length>shown.length) html+=`<button class="morebtn" id="more">继续加载（还有 ${view.length-shown.length} 条）</button>`;
  list.innerHTML=html;
  renderCrumb();
  const m=$('#more'); if(m) m.onclick=()=>{ state.limit+=120; touch(); renderList(); };
}
function renderCrumb(){
  const names={today:'今天',unread:'未读',star:'只看收藏',week:'近 7 天',all:'全部',day:(state.date||'')};
  const label=state.view==='day'?(state.date||''):names[state.view];
  const bits=[];
  if(state.topics.length) bits.push(state.topics.map(t=>TNAME[t]||t).join(' + '));
  if(state.sources.length) bits.push(state.sources.map(s=>SRCNAME[s]||s).join(' + '));
  if(state.q) bits.push('“'+state.q+'”');
  const unread=view.filter(x=>!state.read[x.k]).length;
  $('#crumb').innerHTML=`${esc(label)} <small>${view.length} 条${unread?` · 未读 ${unread}`:''}${bits.length?' · '+esc(bits.join(' · ')):''}</small>`;
}
function renderStats(){
  if(!view.length){ $('#stats').innerHTML=''; return; }
  const vc={}, kc={}, tc={};
  view.forEach(it=>{ if(it.v) vc[it.v]=(vc[it.v]||0)+1; it.kw.forEach(k=>kc[k]=(kc[k]||0)+1); it.tp.forEach(t=>tc[t]=(tc[t]||0)+1); });
  const top=(obj,n)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);
  const kv=(label,arr,kind)=>`<div class="grp"><b>${label}</b>${arr.map(([k,n])=>
    `<button class="kv" data-q="${esc(k)}">${esc(k)}<i>${n}</i></button>`).join('')||'<span class="muted" style="font-size:11.5px">—</span>'}</div>`;
  $('#stats').innerHTML=`<h3>当前筛选的构成（点任意项可直接搜索）</h3>
    ${kv('主题', top(tc,6).map(([t,n])=>[TNAME[t]||t,n]),'t')}
    ${kv('期刊', top(vc,6),'v')}
    ${kv('高频命中词', top(kc,10),'k')}`;
}
function renderEvents(){
  const ev=EVENTS||[];
  renderStats();
  $('#events').innerHTML=`<h3>会议与活动（未来 120 天，日期以官网为准）</h3>`+
    (ev.length?ev.map(e=>`<a class="ev" href="${esc(e.u)}" target="_blank" rel="noopener">
      <b>${e.d.slice(5)}</b><span>${esc(e.n)}</span><em>${e.in} 天后</em></a>`).join('')
    :'<div class="muted">暂无</div>');
}

/* ---------------- actions ---------------- */
function renderOverview(){
  const host=$('#overview'); const o=(DATA.overview||'').trim();
  if(!o){ host.remove(); return; }
  host.innerHTML=`<div class="ovhead">今日点评 · 由配置的 agent 生成</div><p>${esc(o)}</p>`;
}
function renderAll(){ compute(); renderViews(); renderFilters(); renderDates(); renderList(); renderTrend(); renderEvents(); }
function toggleRead(k){ state.read[k]=!state.read[k]; if(!state.read[k]) delete state.read[k]; touch(); renderAll(); }
function toggleStar(k){
  if(state.star[k]) delete state.star[k];
  else state.star[k]=true;
  applyKept();
  touch();
  renderAll();
}
function markAllRead(){ view.forEach(it=>state.read[it.k]=true); touch(); renderAll(); toast('已把当前 '+view.length+' 条标记为已读'); }
function clearFilters(){ state.topics=[]; state.sources=[]; state.q=''; state.limit=DEFAULTS.limit; $('#q').value=''; touch(); renderAll(); }
function copyText(text,okMsg){
  const done=()=>toast(okMsg||'已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,()=>fallback()); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择');} ta.remove(); }
}
function bibtex(it){
  const year=(it.p||it.d||'').slice(0,4);
  const first=(it.au[0]||'anon').split(/\s+/).slice(-1)[0].toLowerCase().replace(/[^a-z]/g,'');
  const key=(first||'ref')+year+(it.k||'').replace(/[^a-z0-9]/gi,'').slice(-4);
  const authors=it.au.join(' and ');
  const fields=[`title = {${it.t}}`,authors?`author = {${authors}}`:'',it.v?`journal = {${it.v}}`:'',
    year?`year = {${year}}`:'',it.doi?`doi = {${it.doi}}`:'',it.ax?`eprint = {${it.ax}}`:(it.u?`url = {${it.u}}`:'')].filter(Boolean);
  return `@article{${key},\n  ${fields.join(',\n  ')}\n}`;
}
function mdOf(list){
  const lines=[`# 科研雷达 · ${TODAY} · 导出 ${list.length} 条`,''];
  list.forEach(it=>{
    lines.push(`- **[${it.t}](${it.u})**`);
    const meta=[it.v,it.p,it.tp.map(t=>TNAME[t]||t).join('/'),`相关度 ${it.s}`].filter(Boolean).join(' · ');
    lines.push(`  ${meta}`);
    if(it.a) lines.push(`  > ${it.a}`);
  });
  return lines.join('\n')+'\n';
}
function download(name,text){
  const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function setTheme(t){ state.theme=t; touch(); document.documentElement.dataset.theme=t; toast('主题：'+({auto:'跟随系统',light:'浅色',dark:'深色'}[t])); }

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-topic],[data-source],[data-date],[data-open],.btn-read,.btn-star,.btn-more,.btn-copy');
  if(!t) return;
  if(t.dataset.q!==undefined&&t.classList.contains('who')){ state.q=t.dataset.q; $('#q').value=state.q; state.limit=DEFAULTS.limit; touch(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.view){ state.view=t.dataset.view; state.date=null; state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.topic){ const id=t.dataset.topic; const i=state.topics.indexOf(id);
    if(i>=0) state.topics.splice(i,1); else state.topics.push(id);
    state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.source){ const id=t.dataset.source; const i=state.sources.indexOf(id);
    if(i>=0) state.sources.splice(i,1); else state.sources.push(id);
    state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.date){ state.view='day'; state.date=t.dataset.date; state.limit=DEFAULTS.limit; touch(); renderAll();
    window.scrollTo({top:0,behavior:'smooth'}); return; }
  const cardEl=t.closest('.card'); if(!cardEl) return; const k=cardEl.dataset.k;
  if(t.classList.contains('btn-read')){ toggleRead(k); return; }
  if(t.classList.contains('btn-star')){ toggleStar(k); return; }
  if(t.classList.contains('btn-more')){
    if(openSet.has(k)) openSet.delete(k); else openSet.add(k);
    cardEl.classList.toggle('open'); t.textContent=openSet.has(k)?'收起':'详情'; return; }
  if(t.classList.contains('btn-copy')){ const it=ITEMS.find(x=>x.k===k); if(it) copyText(bibtex(it),'已复制 BibTeX'); return; }
  if(t.dataset.open){ state.read[k]=true; touch(); const dot=cardEl.querySelector('.btn-read'); if(dot) dot.textContent='✓'; cardEl.classList.add('read'); renderViews(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ state.q=e.target.value.trim(); state.limit=DEFAULTS.limit; clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{touch(); renderAll();},140); return; }
  if(e.target.classList.contains('note')){
    const k=e.target.closest('.card').dataset.k; const v=e.target.value;
    if(v) state.note[k]=v; else delete state.note[k]; touch(); }
});
$('#sort').addEventListener('change',e=>{ state.sort=e.target.value; touch(); compute(); renderList(); });
$('#btnReadAll').addEventListener('click',markAllRead);
$('#btnClear').addEventListener('click',clearFilters);
$('#btnExport').onclick=()=>{ if(!view.length){toast('当前没有可导出的条目');return;} download(`radar-${TODAY}.md`,mdOf(view)); toast('已导出 Markdown'); };
$('#btnTheme').onclick=()=>{ const order=['auto','light','dark']; setTheme(order[(order.indexOf(state.theme)+1)%3]); };
$('#btnHelp').onclick=()=>toggleHelp();
$('#helpHost').addEventListener('click',e=>{ if(e.target.closest('.help')===e.target||e.target.dataset.close!==undefined) toggleHelp(false); });
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') { if(e.key==='Escape') e.target.blur(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key==='?'){ e.preventDefault(); toggleHelp(); return; }
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); moveFocus(1); return; }
  if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); moveFocus(-1); return; }
  if(e.key==='Escape'){ toggleHelp(false); clearFilters(); return; }
  const el=document.querySelector('.card.focus'); if(!el){ if(['o','s','m','e'].includes(e.key)){ moveFocus(1);} else return; }
  const k=el&&el.dataset.k; if(!k) return;
  if(e.key==='o'){ const it=ITEMS.find(x=>x.k===k); if(it&&it.u){ state.read[k]=true; touch(); window.open(it.u,'_blank','noopener'); renderAll(); } }
  if(e.key==='s'){ toggleStar(k); }
  if(e.key==='m'){ toggleRead(k); }
  if(e.key==='e'){ if(openSet.has(k)) openSet.delete(k); else openSet.add(k);
    el.classList.toggle('open'); const b=el.querySelector('.btn-more'); if(b) b.textContent=openSet.has(k)?'收起':'详情'; }
});
function moveFocus(dir){
  const cards=$$('#list .card'); if(!cards.length) return;
  const cur=cards.findIndex(c=>c.classList.contains('focus'));
  focusIdx=cur<0?0:Math.max(0,Math.min(cards.length-1,cur+dir));
  cards.forEach(c=>c.classList.remove('focus'));
  const el=cards[focusIdx]; el.classList.add('focus'); el.scrollIntoView({block:'center',behavior:'smooth'});
}
function toggleHelp(force){
  const host=$('#helpHost');
  if(host.firstChild && force!==true){ host.innerHTML=''; return; }
  if(force===false){ host.innerHTML=''; return; }
  host.innerHTML=`<div class="help"><div class="box"><h4>快捷键</h4><table>
    <tr><td>j / ↓</td><td>下一条</td></tr>
    <tr><td>k / ↑</td><td>上一条</td></tr>
    <tr><td>o</td><td>打开原文（并标记已读）</td></tr>
    <tr><td>s</td><td>收藏，侧栏「只看收藏」只显示这些</td></tr>
    <tr><td>m</td><td>已读 / 未读</td></tr>
    <tr><td>e</td><td>展开详情与备注</td></tr>
    <tr><td>/</td><td>搜索</td></tr>
    <tr><td>Esc</td><td>关闭 / 清除筛选</td></tr></table>
    <p class="muted" style="font-size:12px;margin:10px 0 0">阅读状态、收藏、备注存在这台浏览器里，换浏览器不会同步。点星标会留下文章副本：超过 120 天或数据库清理之后，仍可在「只看收藏」和「全部」里看到。取消收藏后，过期文章不再保留。</p>
    </div></div>`;
}

/* ---------------- init ---------------- */
load();
applyKept();
if(state.view==='day'&&!state.date) state.view='today';
if(state.lastVisit){
  const fresh=ITEMS.filter(i=>i.d===TODAY&&!state.read[i.k]).length;
  if(fresh) setTimeout(()=>toast(`今天有 ${fresh} 条未读`),600);
}
state.lastVisit=Date.now(); save();
document.documentElement.dataset.theme=state.theme||'auto';
$('#q').value=state.q||'';
$('#sort').value=state.sort||'score';
$('#generated').textContent=`${DATA.generated} · ${ITEMS.length} 条 · ${DAYS.length} 天`;
renderOverview();
renderAll();
})();
</script>
</body>
</html>
