<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研雷达 · Research Radar</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --text:#15181e; --muted:#6b7280;
  --line:#e4e7ec; --line-2:#eef0f4; --accent:#4f46e5; --accent-2:#eef2ff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1014; --panel:#15181e; --panel-2:#1a1e26; --text:#e7e9ee; --muted:#98a1b0;
  --line:#252b35; --line-2:#1e232c; --accent:#8b93ff; --accent-2:#20243a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#0e1014; --panel:#15181e; --panel-2:#1a1e26; --text:#e7e9ee; --muted:#98a1b0;
    --line:#252b35; --line-2:#1e232c; --accent:#8b93ff; --accent-2:#20243a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none !important}
.muted{color:var(--muted)}
.spacer{flex:1}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:.02em;white-space:nowrap}
.brand .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:8px 12px 8px 30px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.search .ico{position:absolute;left:10px;top:8px;color:var(--muted);font-size:13px}
.tops{display:flex;gap:6px;align-items:center}
.tops button{padding:7px 11px;border-radius:8px;border:1px solid transparent;color:var(--muted);font-size:13px}
.tops button:hover{background:var(--panel-2);color:var(--text)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;padding:14px 12px 40px;
  border-right:1px solid var(--line);background:var(--panel)}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:18px 6px 8px;font-weight:600}
.viewlist{display:flex;flex-direction:column;gap:1px}
.view{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--text);font-size:13px;width:100%;text-align:left}
.view:hover{background:var(--panel-2)}
.view.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.view .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.view.on .n{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:5px;padding:0 4px}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.on{background:color-mix(in srgb,hsl(var(--h,220) 65% 55%) 16%,transparent);
  border-color:hsl(var(--h,220) 60% 55%);color:hsl(var(--h,220) 55% 42%)}
html[data-theme="dark"] .fchip.on{color:hsl(var(--h,220) 80% 72%)}
.fchip .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,220) 60% 55%)}
.datelist{display:flex;flex-direction:column;gap:1px;max-height:320px;overflow-y:auto}
.date{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:7px;font-size:12.5px;color:var(--muted);width:100%;text-align:left}
.date:hover{background:var(--panel-2);color:var(--text)}
.date.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.date .n{margin-left:auto;font-family:var(--mono);font-size:11px}
.health{margin-top:22px;padding:10px 8px 0;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.health div{display:flex;gap:6px;align-items:center;padding:2px 0}
.health .ok{color:#16a34a}.health .bad{color:#dc2626}

/* ---------- main ---------- */
.main{padding:18px 22px 80px;max-width:1020px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.crumb{font-size:15px;font-weight:650}
.crumb small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.tool{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);font-size:12.5px;color:var(--muted)}
.tool:hover{border-color:var(--accent);color:var(--accent)}
select.tool{appearance:none;padding-right:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* overview + why */
.overview{margin:0 0 12px;padding:12px 16px;border-left:3px solid var(--accent)}
.overview .ovhead{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
.overview p{margin:0;font-size:13.5px;line-height:1.7}
.cwhy{margin-top:8px;font-size:12.5px;color:color-mix(in srgb,var(--accent) 45%,var(--text));
  background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:7px;padding:6px 9px;line-height:1.6}

/* trend */
.trend{margin:6px 0 14px;padding:12px 14px}
.trend-head{display:flex;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.trend-head .mini{margin-left:auto;color:var(--accent);font-size:12px}
.trend-body{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.trow{display:grid;grid-template-columns:74px 1fr 66px;align-items:center;gap:10px;padding:5px 6px;border-radius:8px;text-align:left}
.trow:hover{background:var(--panel-2)}
.trow.on{background:var(--accent-2)}
.tname{font-size:12px;font-weight:600;color:hsl(var(--h,220) 55% 42%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="dark"] .tname{color:hsl(var(--h,220) 80% 70%)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;border-bottom:1px solid var(--line-2)}
.spark .bar{flex:1;background:hsl(var(--h,220) 60% 78%);border-radius:2px 2px 0 0;min-height:2px}
.spark .bar.now{background:hsl(var(--h,220) 60% 52%)}
.tnum{font-family:var(--mono);font-size:12px;text-align:right}
.tnum i{font-style:normal;font-size:10.5px;margin-left:4px}
.tnum .up{color:#16a34a}.tnum .down{color:#dc2626}
.tnum .new{color:var(--accent)}.tnum .flat{color:var(--muted)}

/* cards */
.daybar{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:13px}
.daybar b{font-family:var(--mono)}
.daybar .wd{color:var(--muted)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid hsl(var(--h,220) 55% 65%);
  border-radius:10px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow);transition:border-color .12s}
.card:hover{border-color:var(--line);border-left-color:hsl(var(--h,220) 55% 55%)}
.card.read{opacity:.62}
.card.read:hover{opacity:1}
.card.focus{outline:2px solid var(--accent);outline-offset:1px}
.chead{display:flex;align-items:flex-start;gap:8px}
.ctitle{flex:1;font-weight:600;font-size:14.5px;line-height:1.42}
.ctitle a:hover{color:var(--accent)}
.zh{margin-top:2px;font-weight:500;font-size:13px;color:var(--text)}
.zhabs{color:var(--text)}
.trust{margin-left:4px;font-size:10.5px;padding:1px 5px;border-radius:999px;border:1px solid var(--line)}
.trust.high{color:#15803d;border-color:#86efac}
.trust.mid{color:var(--muted)}
.trust.low{color:#a16207;border-color:#fcd34d}
.icon{width:24px;height:24px;border-radius:6px;color:var(--muted);line-height:1;display:grid;place-items:center;flex:0 0 auto}
.icon:hover{background:var(--panel-2);color:var(--accent)}
.btn-star.on{color:#f59e0b}
.score{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel-2);
  padding:2px 6px;border-radius:6px;flex:0 0 auto;margin-top:2px}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 0;font-size:11.5px;color:var(--muted)}
.chip{padding:1.5px 7px;border-radius:999px;font-size:11px;
  background:color-mix(in srgb,hsl(var(--h,220) 65% 55%) 14%,transparent);
  color:hsl(var(--h,220) 55% 40%);border:1px solid color-mix(in srgb,hsl(var(--h,220) 65% 55%) 28%,transparent)}
html[data-theme="dark"] .chip{color:hsl(var(--h,220) 80% 74%)}
.chip.kind{--h:0;background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.venue{font-style:italic}
.who{color:#7c3aed}
.multi{background:var(--panel-2);padding:1px 6px;border-radius:999px;border:1px solid var(--line)}
.ckw{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ckw span{font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:5px;padding:1px 6px;
  border:1px solid var(--line-2);font-family:var(--mono)}
.cabs{margin-top:7px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .cabs{-webkit-line-clamp:unset;display:block}
.cfoot{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.link{color:var(--muted)}
.link:hover{color:var(--accent)}
.more{border-top:1px dashed var(--line);margin-top:9px;padding-top:8px;font-size:12px;color:var(--muted)}
.mrow{margin:3px 0}
.mrow b{color:var(--text);font-weight:600;margin-right:6px}
textarea.note{width:100%;margin-top:8px;min-height:46px;resize:vertical;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);padding:7px 9px;font-size:12.5px;font-family:inherit;outline:none}
textarea.note:focus{border-color:var(--accent)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:6px}
.morebtn{width:100%;margin:10px 0 0;padding:10px;border-radius:10px;border:1px dashed var(--line);
  color:var(--muted);font-size:12.5px}
.morebtn:hover{border-color:var(--accent);color:var(--accent)}

/* calendar */
.events{margin-top:18px;padding:12px 14px}
.events h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.ev{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.ev b{font-family:var(--mono);color:var(--accent);min-width:44px}
.ev em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}

/* stats */
.stats{margin-top:18px;padding:12px 14px}
.stats h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.stats .grp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.stats .grp b{font-size:11px;color:var(--muted);font-weight:600;width:100%;margin-bottom:2px}
.stats .kv{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line-2);color:var(--muted)}
.stats .kv:hover{border-color:var(--accent);color:var(--accent)}
.stats .kv i{font-style:normal;font-family:var(--mono);font-size:10.5px;margin-left:4px;opacity:.7}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* toast + help */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#111827;color:#fff;
  padding:9px 14px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.help{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:70}
.help .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:420px;width:92%}
.help h4{margin:0 0 10px}
.help table{width:100%;border-collapse:collapse;font-size:12.5px}
.help td{padding:3px 0;color:var(--muted)}
.help td:first-child{width:96px;color:var(--text);font-family:var(--mono)}
.err{position:fixed;left:12px;bottom:12px;right:12px;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;
  padding:10px;border-radius:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;z-index:99}

@media print{
  .sidebar,.tops,.search .ico,.toolbar,#trend,#events,#stats,.cfoot,.icon,.btn-more,.toast,.help{display:none !important}
  .layout{display:block}
  .main{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd;border-left-width:3px}
  body{background:#fff}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-height:none}
  .sidebar>section:last-of-type,.health{grid-column:1/-1}
  .datelist{flex-direction:row;overflow-x:auto;max-height:none}
  .date{white-space:nowrap}
  .trend-body{grid-template-columns:1fr}
  .main{padding:14px 12px 60px}
  .topbar{gap:8px;padding:9px 12px}
  .brand .sub{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">科研雷达 <span class="sub" id="generated"></span></div>
  <div class="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="搜索标题 / 摘要 / 作者 / 期刊 …  按 / 聚焦" autocomplete="off">
  </div>
  <div class="tops">
    <button id="btnTheme" title="深浅色">◐</button>
    <button id="btnHelp" title="快捷键 (?)">?</button>
    <button id="btnExport" title="导出当前列表">导出</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="viewlist" id="views"></nav>

    <section>
      <h3>主题分区</h3>
      <div class="filters" id="topicFilter"></div>
    </section>

    <section>
      <h3>来源</h3>
      <div class="filters" id="sourceFilter"></div>
    </section>

    <section>
      <h3>历史日报</h3>
      <div class="datelist" id="dateList"></div>
    </section>

    <div class="health" id="health"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <select class="tool" id="sort">
        <option value="score">按相关度</option>
        <option value="date">按时间</option>
        <option value="venue">按期刊</option>
        <option value="topic">按主题分区</option>
      </select>
      <button class="tool" id="btnReadAll" title="把当前列表全部标记已读">全部已读</button>
      <button class="tool" id="btnClear">清除筛选</button>
    </div>

    <div class="panel overview" id="overview"></div>
    <div class="panel trend" id="trend"></div>
    <div id="list"></div>
    <div class="panel stats" id="stats"></div>
    <div class="panel events" id="events"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="helpHost"></div>

<script>
const DATA = {"overview":"今天最值得看的是第1条：它结合CSP、力场晶格能与晶格动力学、Δ-ML能量校正和缩放配分函数，用代表性取代超胞系综估算蒽/吖啶/吩嗪二元、三元混晶的组成依赖自由能，直接对应你关注的固溶与能量图景，可借鉴为稳定性评估流程。其次是第2条Orbitol：它以Wyckoff轨道为token，按指定空间群生成晶体，是无机晶体生成方向的对标工作。它的对称性约束思路能否迁移到分子晶体的分子位点，是值得追的线索。","generated":"2026-10-26 23:41","today":"2026-10-26","field":"计算化学 / 有机分子晶体，以及生成模型、视觉生成与相关数学","owner":"zhouy","topics":[{"id":"csp","name":"分子晶体结构预测（CSP）与能量图景","short":"CSP","tier":"core","hue":255},{"id":"crystal-gen","name":"生成模型与逆向设计","short":"生成设计","tier":"core","hue":300},{"id":"gen-model","name":"生成模型、新模型与新架构","short":"生成模型","tier":"core","hue":320},{"id":"vision-gen","name":"视觉生成","short":"视觉生成","tier":"core","hue":280},{"id":"gen-math","name":"生成模型相关数学","short":"生成数学","tier":"core","hue":40},{"id":"mlip","name":"机器学习势与通用势函数（MLIP / UMA）","short":"MLIP","tier":"core","hue":190},{"id":"ai4s","name":"AI for Science 方法与自动化","short":"AI4S","tier":"core","hue":215}],"days":[{"d":"2026-10-26","n":73},{"d":"2026-10-23","n":4},{"d":"2026-10-22","n":3},{"d":"2026-10-21","n":2},{"d":"2026-10-20","n":4}],"items":[{"k":"doi:10.59256/indjcst.20260503043","t":"RANANO-Recreating Nano Banana Using Diffusion Model","a":"RANANO is an integrated artificial intelligence-based multimedia creation platform developed to combine multiple creative functionalities within a single web-based interface. The system addresses the fragmented workflow involved in using separate applications for image generation, image enhancement, video creation, animated text generation, and user guidance. RANANO uses a trained diffusion model for text-to-image generation, where the trained model checkpoint is integrated into the application for inference. The platform also incorporates image enhancement using super-resolution, video generation from selected images, animated text generation, and a voice assistant for interactive guidance. The system follows a modular architecture in which the frontend communicates with backend services responsible for model inference, image processing, multimedia generation, and output management. The diffusion model is trained using a prepared dataset, while the trained checkpoint is subsequently loaded during application execution without repeated training. Functional testing was conducted across the major modules, including checkpoint loading, prompt processing, image generation, image enhancement, video generation, animated text, voice interaction, output display and storage, and frontend-backend integration. All twelve test cases documented in the project were successfully passed. The results demonstrate that RANANO provides a unified and modular approach for AI-assisted multimedia creation while reducing the need to switch between multiple tools. The system also provides scope for future improvements in computational efficiency, processing time, and multimedia generation capabilities.","au":["K R Manjushree","S Sakshi","Prakash Jadamali Sanjana","Udaya Vernekar Shreya","Guttal Vinuthana"],"v":"Indian Journal of Computer Science and Technology","u":"https://doi.org/10.59256/indjcst.20260503043","p":"2026-10-22","d":"2026-10-26","s":8.3,"tp":["vision-gen"],"kw":["image generation","video generation","text-to-image"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.59256/indjcst.20260503043","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.28086","t":"MoDDiT: Simple Token Routing in Diffusion Transformers","a":"Real-time video generation, interactive world models, and on-device image synthesis are almost a reality. Diffusion Transformers (DiT) achieve excellent sample quality, shifting the bottleneck to the throughput of the models themselves. Natural images are inherently sparse, as large portions of an image are often background, contribute little to the scene content, and are easy to denoise. DiTs fail to exploit this sparsity, as they process image tokens statically and uniformly. We propose MoDDiT, a simple architecture modification that learns to route tokens through both MLP and self-attention operations. By routing tokens through both blocks independently, MoDDiT allows for dynamic compute allocation in MLPs that varies across tokens, images, and denoising timesteps. Using MoDDiT to train image generation models from scratch significantly reduces computational costs of training and inference, processing as few as 12.5% of the tokens. By increasing sparsity and model depth, MoDDiT reduces costs and improves generation performance over unrouted baselines. The learned allocation is interpretable, revealing how computation varies with visual content and noise level. We also use MoDDiT to train video generation models, where allocation correlates with motion, and to distill a dense bidirectional video model into a sparse autoregressive student.","au":["Jarek Liesen","Matthew Jackson","Benjamin Ellis","Shimon Azariah Whiteson","Jakob N. Foerster"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28086","p":"2026-10-20","d":"2026-10-26","s":6.9,"tp":["vision-gen"],"kw":["image generation","video generation","image synthesis"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.28086","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"t:a7291beb6f4830","t":"Anomaly Detection using Source-Reversed Flow Matching","a":"Anomaly detection in textual data remains an underexplored problem, hindered by fragmented benchmarks, scarce labeled data, and methods that fail to model the distribution of normal text in a continuous and generative manner. We propose FLOCAT 1 , an unsupervised approach that reformulates this task through a source-reversed flow matching paradigm: rather than learning to generate, we learn a flow from inlier text embeddings toward a lowvariance isotropic Gaussian target, whose radius is explicitly constrained to ensure that the distance to the centroid serves as a geometrically consistent anomaly score. Built on a Diffusion Transformer (DiT) backbone, FLO-CAT operates at both token and sentence level through a level-agnostic interpolation mechanism, enabling fine-grained signal interpretability. We evaluate on 10 datasets spanning text classification, spam detection, sentiment analysis, human-vs. machine-generated text and depression screening, consistently achieving state-of-the-art AUC-ROC across all benchmarks and text representations.","au":["Amine Youcef Khodja","Jérémie Pantin","Gaël Harry Dias","Fabrice Maurel"],"v":"HAL","u":"https://hal.science/hal-05769855v1","p":"2026-10-24","d":"2026-10-26","s":6.5,"tp":["gen-model"],"kw":["diffusion transformer","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.27418","t":"TokenFlow: Latent Token Rectified Flow Matching for 3D Point Cloud Generation","a":"3D point clouds generation requires capturing both part-level layout and surface detail while preserving permutation equivariance. Existing latent generative models often encode an entire shape into a single vector, which limits their ability to retain part-level structure. We propose TokenFlow, a hierarchical flow matching framework that represents each shape as a set of latent tokens and couples a rectified flow over these tokens with a conditional flow over points. A bottleneck of $M \\ll N$ learnable tokens aggregates global context through cross-attention at $O(NM)$ cost. On ShapeNet, TokenFlow achieves the best MMD and coverage across airplane, car, and chair, while obtaining 1-NNA comparable to the strongest baselines. On ModelNet, its learned latent set reaches the best reported linear-evaluation accuracy on ModelNet10. These results show that representing a shape as a set of latent tokens, aggregated at $O(NM)$ cost, provides an effective representation for 3D point cloud generation.","au":["Linhao Wang","Dongjin Huang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27418","p":"2026-10-20","d":"2026-10-26","s":6.3,"tp":["gen-model"],"kw":["rectified flow","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27418","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32120","t":"ImageRSI: Verification-Driven Recursive Self-Improvement for Agentic Image Generation","a":"Complex text-to-image requests remain difficult to satisfy reliably. Verifying and repairing an image can fix an individual output, but a successful repair does not necessarily carry over to other requests. We present ImageRSI, a framework that keeps the image generator frozen and combines three components: five-dimensional verification and repair within each task, an experience library shared across tasks, and offline updating of the judge. Candidate experiences enter the library only after paired A/B validation, and the judge is updated with supervised fine-tuning and GRPO on accumulated image-judgment records and evaluated before reuse. We also introduce ImageReq-Bench, a benchmark of 961 requests built around hard cases in real-world image-generation requests, each paired with an evaluation checklist. ImageRSI achieves a Checklist Strict Accuracy (CSA) of 52.6% on MindBench (with Nano Banana Pro as the generator) and 65.66% on ImageReq-Bench, and we compare system outcomes across judge-training configurations.","au":["Shuo Han","Zhilin Wang","Peng Ling","Wenjia Gong","Yang Liu","Guanjun Jiang","Yukun Cao","Xike Xie"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32120","p":"2026-10-23","d":"2026-10-26","s":6.0,"tp":["vision-gen"],"kw":["image generation","text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32120","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.63929/22020586.2026.1.053","t":"Generative Flow-Matching Priors from Segmentation-Based Inversion for Uncertainty Quantification","a":"A framework that leverages segmentation methods for geophysical inversion to construct geologic priors for probabilistic inversion is presented. These segmentation models, which partition the subsurface into discrete regions of distinct physical properties based on patterns learned from deterministic inversion results, generate expected geological scenarios, or “concepts,” for hypothesis testing. To sample a concept, a generative model is trained to encode the concept and its variations, then used as the informed prior in the probabilistic inversion.","au":["Johnathan C. Kuttai","Lindsey J. Heagy"],"v":"ASEG Extended Abstracts","u":"https://doi.org/10.63929/22020586.2026.1.053","p":"2026-10-21","d":"2026-10-26","s":5.7,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.63929/22020586.2026.1.053","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.57760/sciencedb.016kt","t":"PhysCorr-Dataset","a":"we propose PhysCorr, a unified framework for modeling, evaluating, and optimizing physical consistency in text-to-video generation. Building upon this reward signal, we develop PhyDPO, a physics-specialized direct preference optimization paradigm that leverages contrastive feedback and physics-aware reweighting to guide generation toward physically coherent outputs. Our proposed PhysCorr is model-agnostic and scalable, enabling seamless integration with a wide range of diffusion-based and transformer-based video generation backbones. Extensive experiments across multiple benchmarks demonstrate that PhysCorr substantially improves physical realism while preserving visual fidelity and semantic alignment.","au":["Peiyao Wang"],"v":"ScienceDB","u":"https://doi.org/10.57760/sciencedb.016kt","p":"2026-10-19","d":"2026-10-26","s":5.7,"tp":["vision-gen"],"kw":["video generation","text-to-video"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.57760/sciencedb.016kt","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.17877/tudobooks-11.158","t":"Optimal-transport flow matching for stochastic model ipdating","a":"Deep generative models have attracted considerable attention as inference engines for stochastic model updating. Among these deep generative models, conditional flow matching offers a particularly efficient formulation, in which a continuous transport map from a latent distribution to the posterior is learned by regression against optimal-transport probability paths, avoiding both the invertibility constraints of normalising flows and the iterative denoising of diffusion models. However, its performance in engineering model updating has not been examined against an established baseline such as the Bayesian updating framework under controlled conditions. In this work, conditional flow matching is therefore assessed against the Bayesian model updating approach with transitional Markov chain Monte Carlo, in which the Bhattacharyya distance provides the approximate likelihood for the Bayesian approach. The two methods are assessed with respect to posterior fidelity, evaluated by statistical distances against the known ground truth and computational expenditure in model evaluations, with the offline training budget reported separately from the inference cost of each subsequent conditioning. A 3-DOF spring–mass system with uncertain stiffness parameters serves as the benchmark. Since the calibrated posterior constitutes the input description upon which subsequent reliability assessment depends, the accuracy and the marginal cost of the updating step both bear directly on reliability computations. In addition, the amortised nature of the learned transport map is discussed in this work, as it permits the posterior to be re-evaluated under new observations at negligible cost, which is a property of practical relevance to reliability assessment under sequentially acquired monitoring data.","au":["Tairan Wang","Sifeng Bi"],"v":"Technische Universität Dortmund Eldorado (Technische Universität Dortmund)","u":"https://doi.org/10.17877/tudobooks-11.158","p":"2026-12-01","d":"2026-10-26","s":5.7,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.17877/tudobooks-11.158","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.29475","t":"Density-Level Backward Error for Low-NFE Generative Flows","a":"Low-NFE generative ODE sampling is constrained not only by solver order, but also by how a fixed budget of network evaluations is distributed along the flow. We develop a density-level backward-error framework that identifies the component of a solver's modified-equation defect that changes the evolving marginal, while excluding solenoidal trajectory distortion that is invisible in Wasserstein tangent geometry. The resulting residual induces a solver-order-aware compute-allocation rule and, through gauge freedom, an objective for selecting numerically favorable velocity representatives of the same density path. This separates our approach from schedule search driven by trajectory or endpoint surrogates and from higher-order solver design. Exact Gaussian and mixture models establish the mechanism, including cases where curvature-based allocation fails and continuum-optimal transport is not discretization-optimal. On a pretrained CIFAR-10 EDM probability-flow ODE, density-aware allocation consistently improves fixed-update Euler sampling in the low-NFE regime. Matched-seed convergence to a dense Euler reference confirms that the method accelerates approximation of the same high-NFE flow rather than changing the asymptotic sampler.","au":["Ewsey Obzherin","Valentin Khrulkov"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29475","p":"2026-10-21","d":"2026-10-26","s":5.6,"tp":["gen-math"],"kw":["optimal transport","probability flow","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29475","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26262","t":"Dynamics-Aware Sparse Attention for Efficient Autoregressive Video Diffusion","a":"Autoregressive Diffusion Transformers have emerged as a powerful paradigm for long video generation. However, they are often constrained by prohibitive computational overhead and substantial memory footprints. This inefficiency arises from dense computation mechanisms that allocate uniform processing resources across all spatiotemporal regions, failing to leverage the inherent temporal redundancy of video where motion is typically confined to sparse areas. In this paper, we propose Dynamics-Aware Sparse Attention (DASA), a unified framework that shifts from dense computation to sparse, motion-driven generation to eliminate both storage and computational redundancies. Inspired by video codec principles, our approach explicitly decouples video content into dynamic and static regions. To mitigate memory bottlenecks, we selectively compress the historical KV cache by retaining only dynamic features within the generated chunk. Furthermore, to reduce computational overhead, we employ a region-level computation allocation strategy based on localized dynamics. Additionally, a dynamics-guided distillation method is introduced to enhance performance via a lightweight distillation training process. Experiments on VBench demonstrate that our approach accelerates autoregressive video generation by 2.16x, while preserving high visual fidelity.","au":["Yuanyu He","Zhuokun Chen","Yefei He","Zhiwei Tang","Jiasheng Tang","Yinghao Yu","Jianfei Cai","Bohan Zhuang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26262","p":"2026-10-19","d":"2026-10-26","s":5.4,"tp":["vision-gen"],"kw":["video generation","video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26262","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.30926","t":"Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation","a":"Cinematic video generation requires both temporal inference from limited inputs (i.e., sparse rather than frame-by-frame guidance) and factor-aware control of character, scene, action, and camera. Multimodal large language models (MLLMs) offer useful priors for both capabilities, but their representations are not automatically actionable for video generation: a Video Diffusion Transformer (DiT) may bypass them through native conditioning pathways, and using them does not ensure either factor-aware control or generation-compatible temporal prediction. We propose Factor-Aware Predictive Learning (FAPL), which establishes effective MLLM latent use as a shared prerequisite and then targets the two capabilities with complementary learning signals. First, latent-only generator grounding trains the DiT with a frozen MLLM and connector, strengthening the DiT's use of MLLM latents for generation. Second, for factor-aware control, paired videos specify a target-factor change and non-target preservation, and factor-span replacement trains the DiT to realize this relationship in its output. Third, for temporal inference, text-only and text-plus-complete-video observations share a video target, and the trained DiT is then frozen while the MLLM and connector are optimized through it. This final stage trains limited-input representations for generation while retaining complete-observation reconstruction as a complementary training mode. Extensive experiments demonstrate our consistently better performance on three cinematic video generation tasks (i.e., sparse-to-video, factor-aware editing, and multi-shot generation) over baselines and validate FAPL's contributions to MLLM feature use, temporal control, and factor coordination.","au":["Songlin Yang","Zhe Wang","Xiaotong Zhao","Xi Wang","Ran Zhang","Shuai Li","Taiyi Wu","Songlian Li","Eric Liu","Alan Zhao"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30926","p":"2026-10-22","d":"2026-10-26","s":5.4,"tp":["vision-gen"],"kw":["video generation","video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30926","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26000","t":"PnP-CF: A Consensus Flow-Matching Solver for General Inverse Problems","a":"Plug-and-Play (PnP) methods using continuous-time deep generative models as learned data distribution priors enable synthesizing high-quality solutions of model-based inverse problems. The quality of the solutions depends critically on the interplay and consensus between the inverse problem solver and the generative model sampler. We revisit a recently introduced flow-based PnP framework, which we refer to as PnP-CF (Consensus Flow), and extend its application to nonlinear inverse problems, including those with learned neural-network forward operators. PnP-CF combines a flow-matching denoiser with (i) ADMM-like dual variable updates and (ii) a time-adaptive pullback onto the intermediate flow probability path that combines a stochastic and a deterministic component. We discuss how these two features stabilize the algorithm and promote consensus, and demonstrate on a set of experiments that PnP-CF not only solves standard linear inverse problems with quality at least comparable to state-of-the-art baselines, but also extends gracefully to nonlinear inverse problems, including forward operators realized by pretrained neural networks, for which existing methods produce unsatisfactory results or fail completely.","au":["Dibyanshu Kumar","Magda Gregorová"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26000","p":"2026-10-19","d":"2026-10-26","s":5.3,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26000","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.28801","t":"JUICE: Unified Multimodal Modeling in Pretrained Representation Spaces","a":"Most unified multimodal models treat images and text asymmetrically: a pretrained language model generates text, an attached diffusion head generates images, and outputs that contain both are produced in a fixed order, so the first output cannot adapt to the second. We ask whether both modalities can instead be generated by one process that is trained on them jointly from scratch. Pretrained encoder spaces hold both modalities in one continuous form and carry knowledge learned at scale, and recent work finds them effective as generative targets for vision and language. We therefore model the joint distribution directly in these spaces. We introduce JUICE (Joint Unified multimodal modeling In Continuous Encoder spaces), a single flow matching Transformer over frozen image and text representations, in which each modality has its own noise level. Which modalities are clean and which are generated then decides the task: image generation, captioning, visual question answering, or joint generation. Controlled pretraining runs test each design choice. At equal guidance, generating text as continuous states leaves image generation intact (48.41 GenEval, against 47.86 for a model trained only for text-to-image generation), while captions lose some exact wording. Training on joint and conditional denoising together beats either alone, and semantic encoder spaces beat VAE latents and raw pixels as targets. At 2.1B parameters, with no language model initialization and at 224x224, JUICE reaches up to 0.88 on GenEval and 73.1 on VQAv2. By sampling both modalities from the joint distribution (coupled sampling), it can also draw a route on a map while writing out the matching moves. On mazes with several valid solutions, joint success rises from 54.6% with independent sampling to 93.7%, and no modality has to go first. On visual spatial planning, JUICE solves 99.8% of maps at its training sizes.","au":["Jiahan Li","Huangyuan Su","Shengbang Tong","Shusheng Yang","Ruihan Guo","Suozhi Huang","Hexu Zhao","Pratyusha Sharma","Sherry Yang","Jiatao Gu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28801","p":"2026-10-20","d":"2026-10-26","s":5.2,"tp":["vision-gen"],"kw":["image generation","text-to-image"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.28801","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32381","t":"UniWorld: A Unified World Model for Real-Time Visual World Simulation","a":"Continuous visual world simulation requires coupling evolving scene geometry with temporally persistent appearance. We present UniWorld, a unified framework that integrates depth trajectories and reference appearance within a shared video generation model. The central design maintains visual and geometric histories on a common timeline. Noise-aligned overlapping continuation places generated history at the prescribed sampling noise level and commits only newly generated latents. Rolling depth latent state preserves the corresponding geometric controls, incrementally reads newly available geometry, and keeps the conditioning fixed within each sampling window. Together, these mechanisms ensure exact preservation of latent history while bounding the active depth state by the window size. We evaluate continuous generation, paired history interventions, and long-horizon behavior across diverse scene categories. The same generator supports estimated, native, and on-demand simulator depth, while cached and incremental execution paths produce bitwise-identical outputs. Appearance changes and geometric control branches operate through the same interface without modifying committed history. The measured steady-state DiT execution path achieves real-time generation throughput, demonstrating the efficiency of UniWorld for continuous visual world simulation.","au":["Xin Zhang","Yabo Chen","Shuaiwei Wang","Zixuan Duan","Haibin Huang","Feng Xu","Xuelong Li"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32381","p":"2026-10-23","d":"2026-10-26","s":5.2,"tp":["vision-gen"],"kw":["video generation","world model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32381","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29177","t":"ROCOCO: Robust Outline Completion of Occluded Curvilinear Objects","a":"We propose a learning-based generative model for completing curvilinear features under occlusion by environmental obstacles. To this end, we adopt a flow matching-based approach that supports the inpainting of occluded regions with the appropriate curvilinear features. To eliminate the reliance on privileged information about the occlusion a priori, we also train a UNet-based mask prediction model, which can identify regions for inpainting given only the occluded observation. The components of our approach are validated via experiments using procedurally-generated test cases, and the complete pipeline is validated using large public datasets for curvilinear objects. Against off-the-shelf inpainting baselines, ROCOCO is the strongest method by a wide margin when no occlusion mask is given, and is competitive with mask-supervised inpainting when one is, achieving best on full-image error and second only to LaMa on the occluded region, while using a completer of $7.7$M parameters against LaMa's $51$M and Stable Diffusion's $860$M.","au":["Ken Zheng","Jaimyn Drake"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29177","p":"2026-10-21","d":"2026-10-26","s":4.7,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.29177","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32256","t":"Representation Learning via Composite Subspace Flow Matching","a":"Distilling semantic meaning from raw image data remains a challenge in machine learning. Current self-supervised paradigms face a trade-off: joint-embedding architectures produce relevant features by aggressively discarding intra-class variance, irreversibly spatial and reconstruction. Conversely, generative models preserve spatial details but struggle to isolate semantics, as their optimization is dominated by pixel variations. To bridge this divide, we propose composite subspace flow matching (CSFM). Rather than corrupting data with unstructured isotropic noise, CSFM formulates representation learning as the variance-minimizing inversion of a deterministic degradation curriculum across spectral, color, and illumination subspaces. By bounding trajectory variance with hard temporal style truncation, a capacity-constrained encoder is driven to ignore transient style artifacts and encode persistent content. Empirical evaluations across CIFAR-10, CIFAR-100, and STL-10 show that CSFM yields competitive discriminative transferability while preserving generative synthesis across both convolutional and vision transformer architectures. By avoiding the collapse pathologies of non-generative methods, CSFM forms a smooth latent space that outperforms standard optimal transport flows on linear probing and few-shot classification, while enabling coherent synthesis and trajectory interpolation. These results confirm that steering the physical dynamics of generative flows offers a scalable paradigm for learning representations that are simultaneously linearly separable and generatively invertible.","au":["José Afonso","Mário Figueiredo"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32256","p":"2026-10-23","d":"2026-10-26","s":4.4,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32256","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32941","t":"If at First You Don't Succeed, Backtrack: Lightweight Recovery for Frozen VLAs","a":"Vision-Language-Action (VLA) models perform well on robotic manipulation, yet remain brittle once their own actions carry them into states their training data barely covers. Recovering from such failures usually requires recovery demonstrations, policy retraining, or a separate model at inference time. We introduce Backtrack, a lightweight failure detection and recovery mechanism for frozen VLAs that needs none of these. A small failure prediction head, trained only on outcome-labeled rollouts of the frozen policy, reads the VLA's existing internal representations to estimate whether the current episode will fail. When the predicted failure probability exceeds a threshold, a controller pauses the policy, retraces the arm's recently achieved motion, and hands control back to the unchanged policy so it can retry from an earlier configuration. The head adds only 0.48-0.88% to the policy's parameter count. We evaluate Backtrack on LIBERO with three VLAs spanning two action-generation families: SmolVLA and $π$0.5, which use flow-matching action experts, and the autoregressive $π$0-FAST. On LIBERO-Long, the suite of long-horizon multi-step tasks and the one on which all three policies fail most often, Backtrack reduces each policy's failure rate by 19-48%, raising success by up to 7.4 percentage points; on the three shorter suites, where control success is already 85-99%, its effect is smaller. On MetaWorld, all twelve controller configurations tested with SmolVLA improve on the unassisted policy.","au":["Thomas Landeg","Thierry Tambe"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32941","p":"2026-10-23","d":"2026-10-26","s":4.2,"tp":["gen-model"],"kw":["autoregressive","flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32941","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1088/2632-2153/aeb69d","t":"Disentangling total-variance and signal-to-noise-ratio improves diffusion models","a":"Diffusion models have been widely adopted as a powerful generative framework across numerous scientific domains, yet their inherently iterative sampling process remains a significant computational bottleneck. While this is typically mitigated by reducing the number of reverse diffusion steps, sample quality becomes highly sensitive to the chosen noise schedule, i.e., the manner in which noise is introduced and the signal is reduced at each step. Although prior work has improved on the original variance-preserving and variance-exploding schedules, these approaches passively adjust the total variance, without direct independent control over it. In this work, we propose a novel total-variance/signal-to-noise-ratio disentangled (TV/SNR) framework, where TV and SNR can be controlled independently. Our approach reveals that schedules with exponentially exploding TV can be consistently improved by adopting a constant TV schedule while preserving the underlying SNR schedule. Furthermore, we demonstrate that generalizing the SNR schedule of optimal transport flow matching significantly enhances generation efficiency. Crucially, these gains remain consistent across various reverse diffusion solvers and reduce the search space to two independent and interpretable parameters, enabling fast and robust sampling for complex scientific applications, such as molecular structure generation.","au":["Khaled Kahouli","Winfried Ripken","Stefan Gugler","Oliver T. Unke","Klaus‐Robert Müller","Shinichi Nakajima"],"v":"Machine Learning Science and Technology","u":"https://doi.org/10.1088/2632-2153/aeb69d","p":"2026-10-20","d":"2026-10-26","s":4.1,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1088/2632-2153/aeb69d","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.32966","t":"ViT-H: Generative Video-To-Humanoid Control with Motion Tracking Feedback","a":"Learning humanoid control from monocular human videos offers a scalable way to acquire diverse whole-body behaviors. Yet, existing reconstruction-retargeting-tracking pipelines are limited in system-level scalability by separately optimized intermediate stages and cannot directly optimize reference motion executability using downstream tracking feedback. We present ViT-H, a video-to-humanoid control framework following a generation-and-tracking paradigm. ViT-H directly generates humanoid reference motions from videos with a diffusion model, bypassing human motion reconstruction and retargeting, and uses motion-tracking outcomes to post-train the generator with direct preference optimization. We further introduce an autoregressive variant that enables real-time humanoid video teleoperation with sub-400 ms latency. Extensive experiments on the Unitree G1 demonstrate that ViT-H outperforms state-of-the-art reconstruction-retargeting-tracking pipelines in both motion quality and executability. We further show that ViT-H scales favorably with model size and with both pre-training and post-training data scale, while motion-tracking feedback consistently improves executability across different motion trackers.","au":["Zimo He","Tianyi Bian","Zizhong Yang","Hongjie Li","Nan Jiang","Jieming Cui","Baoxiong Jia","Yizhou Wang","Siyuan Huang","Yixin Zhu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32966","p":"2026-10-23","d":"2026-10-26","s":4.0,"tp":["gen-model"],"kw":["diffusion model","autoregressive"],"src":["arxiv"],"kind":"preprint","ax":"2610.32966","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.27986","t":"Recast the Past: Stable Long Video Generation with Full Context Memory","a":"Long-horizon video generation requires retaining an ever-expanding history, but conditioning on its growing token sequence is costly. Existing methods restrict or compress historical context, potentially losing information needed for future generation. This work proposes ReCam, which groups local spatiotemporal blocks of historical latents into vectors and projects them directly into the high-dimensional hidden space of a Diffusion Transformer. The model learns to use the resulting memory tokens through native self-attention, reducing token count while retaining block-level access to the full history. To mitigate temporal drift during autoregressive rollout, we further introduce dual-pointer denoising with separate noise schedules for recent context and target frames. Among the evaluated methods, ReCam achieves the highest VBench-Long overall score of 80.1 and competitive static-scene revisitation performance on R2M-Bench. It also leads on all four consistency metrics for off-screen subject reappearance, including clothing consistency of 4.09 versus 3.03 for the best baseline.","au":["Yukuo Ma","Cong Liu","Junke Wang","Junqi Liu","Haibin Huang","Zuxuan Wu","Xuelong Li"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27986","p":"2026-10-20","d":"2026-10-26","s":3.9,"tp":["gen-model","vision-gen"],"kw":["diffusion transformer","autoregressive","video generation"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27986","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29679","t":"Lifting PCA in the Wasserstein Space","a":"Principal Component Analysis (PCA) is a fundamental tool for statistical dimension reduction, yet no canonical extension to distribution-valued data has emerged within the framework of optimal transport. While Wasserstein barycenters and Wasserstein least-squares regression provide canonical liftings of Euclidean averaging and linear regression in the Wasserstein space, an analogous principle for PCA has remained unexplored. In this paper, we introduce Lifted PCA, a canonical extension of Euclidean PCA to Wasserstein space, obtained through the framework of lifting functionals in the space of probability measures by convex extension. Starting from the classical variational formulations of PCA on the Stiefel and Grassmann manifolds, we derive two equivalent minimization problems over probability measures supported on these manifolds that correspond to Wasserstein barycenters with generalized costs. We establish an exact analogue of the equivalence between the Stiefel and Grassmann formulations of Euclidean PCA, preserving PCA's original variational structure under lifting. We further derive dual formulations and optimality conditions, and establish equivalences with multimarginal optimal transport and matching-for-teams problems. We also establish statistical consistency for empirical estimators and develop computational algorithms based on the Wasserstein barycenter formulation over the Stiefel manifold. Whereas Euclidean PCA summarizes vectors through projections onto an optimal low-dimensional linear subspace, Lifted PCA summarizes probability distributions through an optimal probability measure supported on multiple low-dimensional subspaces. Numerical experiments on distributional datasets illustrate the practical performance of the proposed methodology and its benefits for distributional data analysis.","au":["Jérémie Bigot","Clément Bonet"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29679","p":"2026-10-21","d":"2026-10-26","s":3.9,"tp":["gen-math"],"kw":["optimal transport","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29679","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.28318","t":"Stabilizing Filters for Graph Signal Generation","a":"Generating graph signals is an important task in machine learning, and incorporating the underlying graph into a generative model enables structurally-informed distribution modeling. However, said graph is often noisy or imperfectly estimated, and structural errors can affect the generative process and the resulting signal distribution. While recent work has established stability guarantees for graph neural ordinary differential equations, the robustness of graph-aware reference dynamics, as used in topological Schrödinger bridge models, remains largely unexplored. Here, we investigate the structural stability of continuous-time generative models whose dynamics combine a graph filter with a learned graph neural network. We first derive a Wasserstein stability bound that quantifies the effect of graph perturbations on the generated signal distributions. Informed by this analysis, we then propose a principled framework for designing graph filters that balance structural stability with induced signal smoothing. We characterize the optimal filter design and provide an explicit family of polynomial filters with provable stability guarantees. Experiments on synthetic graphs and real-world fMRI signals support our theoretical findings, illustrating the enhanced structural stability of the proposed filters while preserving generative performance.","au":["Martin Schmidt","Gonzalo Mateos"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28318","p":"2026-10-20","d":"2026-10-26","s":3.7,"tp":["gen-math"],"kw":["schrödinger bridge","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.28318","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29476","t":"Generative Modeling via Nonlinear Schrödinger Bridges and Branching Diffusions","a":"We propose a new generative modeling framework grounded in forward-backward partial differential equations (PDEs). These equations arise naturally in mean-field game (MFG) theory, and are closely related to nonlinear Schrödinger systems. Our main contribution is to reinterpret this connection within the setting of generative modeling and to develop an efficient numerical methodology for its practical implementation. Specifically, we derive and characterize a nonlinear extension of the classical Schrödinger bridge problem through a coupled system of PDEs, yielding a model we call SBNL (Schrödinger Bridge NonLinear). To compute its solution, we design a simulation algorithm based on branching diffusions and the probabilistic representation of semilinear PDEs. The resulting method is embarrassingly parallel, scalable to high dimensions, and applicable to a broad class of nonlinear interaction functionals. We validate the approach through numerical experiments, including recovery of the classical Schrödinger bridge, nonlinear extensions with convex penalties (Gross-Pitaevskii) as well as potential interaction terms, and high-dimensional generative tasks such as image synthesis on the MNIST and FFHQ human face dataset. Furthermore, the same framework embeds score-based generative modeling, diffusion models, and tractable gaussian Schrödinger bridges.","au":["Mathias Grau","Pierre Henry-Labordère"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29476","p":"2026-10-21","d":"2026-10-26","s":3.7,"tp":["gen-math"],"kw":["schrödinger bridge","score-based"],"src":["arxiv"],"kind":"preprint","ax":"2610.29476","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.60882/cispa.34759659","t":"SplineFlow: Flow Matching for Dynamical Systems with B-Spline Interpolants","a":"Flow matching is an emerging, scalable generative framework for characterizing continuous normalizing flows with wide-range applications. However, state-of-the-art methods are not well-suited for modeling dynamical systems, as they construct conditional paths that are restricted to linear interpolants, a suboptimal supervision signal, which may not capture the system's underlying state evolution. Moreover, constructing unified paths to satisfy multi-marginal constraints across observations is challenging, since naïve higher-order polynomials tend to be unstable and oscillatory. To address these limitations, we introduce SplineFlow, a theoretically grounded flow matching algorithm that jointly models conditional paths across observations via B-spline interpolation. Specifically, SplineFlow exploits the smoothness and stability of B-spline bases to learn the complex underlying dynamics in a structured manner while ensuring the multi-marginal requirements are met. Comprehensive experiments across deterministic and stochastic dynamical systems under various configurations, as well as cellular trajectory inference tasks, demonstrate that SplineFlow outperforms existing baselines, especially when the underlying dynamics are of higher degree or in irregular sampling regimes.","au":["Santanu Rathod","Pietro Liò","Xiao Zhang"],"v":"CISPA Helmholtz Center","u":"https://doi.org/10.60882/cispa.34759659","p":"2026-10-23","d":"2026-10-26","s":3.7,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.60882/cispa.34759659","who":[],"tz":"","az":"","rv":"","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.32159","t":"Playing Bias: Epistemic Games for Interpreting Text-to-Image Models","a":"Text-to-image (T2I) systems do not merely render prompts; they circulate defaults for \"what X looks like,\" shaping recognition through pose, camera, costume, props, and setting. While technical audits quantify disparities, they rarely cultivate the literacy needed to argue how images assemble stereotypes and confer authority. This paper translates a three-stage, humanities-informed framework into a set of epistemic games that make this cultural work visible and debatable: Interpret (art-historical close looking with AI outputs), Interrogate (counter-intent prompting as artistic exploration), and Expose (creative misuse through paired prompts with a constant motif and a BiasSlot rule, in which only the bias cue varies). In a pilot with undergraduate fine-arts students, the games shifted discussion from impressionistic reactions to concise, warranted hypotheses grounded in visual evidence, supported by lightweight classroom instruments that enabled reproducibility and structured collaboration. We argue that such game-based approaches foster critical literacy across educational contexts, equipping learners to recognize, discuss, and contest how T2I models encode bias.","au":["Amalia Foka"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32159","p":"2026-10-23","d":"2026-10-26","s":3.5,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32159","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32407","t":"TIE: Training-free CLIP Embedding Guidance for Compositional Text-to-Image Alignment","a":"Text-to-image (T2I) diffusion models have advanced notably, but still fail to satisfy prompt conditions, resulting in attribute mismatches and missing objects. These errors normally fall into two categories: concept loss, when an object or attribute (i.e., concept) goes missing, and concept confusion, when an attribute is assigned to the wrong object or multiple objects blend together. Recent studies suggest that these challenges are caused by the limited capacity of CLIP text encoder to capture fine-grained semantic details. Although several methods have been proposed, concept loss and concept confusion persist in recent T2I models when handling multi-object, multi-attribute prompts. In this paper, we conduct an embedding-level analysis to develop a training-free, inference-time solution for concept loss and concept confusion across CLIP-based T2I models. We find that (1) concepts mentioned later exhibit higher embedding entropy, reflecting less concentrated representations that are more often associated with concept loss, and (2) the first CLIP attention layer captures the strength of binding between each object and its attribute. Guided by our findings, we introduce TIE, a method that improves semantic alignment through a single text-embedding update. TIE addresses concept loss via entropy-aware singular value amplification and resolves concept confusion through interpolation-extrapolation binding based on CLIP attention scores, all in a training-free manner. Extensive experiments demonstrate that TIE enhances semantic fidelity in multi-concept scenarios with minimal sampling overhead. The project page is available at https://hong-sujung.github.io/TIE/.","au":["Sujung Hong","Tae Eun Choi","Youngjun Jun","Chanyong Yoon","Seong Jae Hwang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32407","p":"2026-10-23","d":"2026-10-26","s":3.5,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32407","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29227","t":"Schrödinger-Bass Bridge Barycenter Models for Measure-Valued Data","a":"Barycenter models, based on stochastic and deterministic optimal transport bridges between probability measures, have proven to be useful for supervised and unsupervised learning for (probability) measure-valued data. In this paper, we utilize the directional asymmetry and dual drift-diffusion control arising in the recently proposed Schrödinger-Bass Bridge (SBB) between two measures, and propose \\textit{SBB-encoder}, \\textit{SBB-decoder}, \\textit{SBB-symmetric}, and \\textit{SBB-Markovian} barycenter models. For each of these novel models, our first theoretical result establishes the existence of the SBB-barycenter under mild assumptions. Our second theoretical result characterizes the decoder SBB-barycenter of Gaussians where we show that for Gaussian input measures, the decoder formulation admits a Gaussian minimizer, reducing barycenter computation to a finite-dimensional optimization and yielding a compact algorithm. For general input measures, we derive a hybrid Wasserstein gradient particle descent scheme for all four formulations using the SBB dual representation. Finally, we utilize these algorithms for solving distributional-inverse/interpolation problems arising in the context of spatial images and single-cell RNA sequencing data, where we show that the SBB-decoder and Markovian barycenter allow us to interpolate between successive time points. Results show that our method outperforms existing barycenter models for measure interpolation and inference.","au":["Ngoc-Hai Nguyen","Thuan Nguyen","Prakash Ishwar","Shuchin Aeron"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29227","p":"2026-10-21","d":"2026-10-26","s":3.4,"tp":["gen-math"],"kw":["optimal transport","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29227","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32373","t":"Past as State, Present as Attention: Persistent-State Blockwise Flow Matching for Long-Horizon Co-Speech Motion Generation","a":"Co-speech motion generation remains challenging over long horizons due to the need for temporal coherence and consistent style. Existing methods typically generate long motions segment by segment, either conditioning on a short seed of recent frames, which gradually drifts, or retaining ever-longer explicit histories, which are costly to maintain and hard to learn from limited data. We trace these limitations to a key asymmetry between past and present: past motion carries slowly varying style that should be compactly summarized, whereas the current segment exhibits fast-changing local dynamics that require fine-grained modeling. This asymmetry motivates a simple Past-As-State, Present-as-Attention principle for long-horizon co-speech motion generation. Following this principle, we propose PASPA, which summarizes past history with an inter-block persistent state and models the current segment with intra-block bidirectional self-attention. We instantiate PASPA within a blockwise flow matching framework, with multi-block supervision for effective training over variable histories, prefill-decode state caching for efficient rollout, and hybrid classifier-free guidance for enhanced history and speech conditioning. Extensive public-benchmark experiments show that PASPA achieves state-of-the-art FGD performance and preserves motion style across long-sequence generation.","au":["Yi Liu","Xiangyue Zhang","Jianfang Li","Jia Ma","Yisheng He","Jianqiang Ren"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32373","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32373","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32602","t":"Trajectory Matching: Discrete Flow Matching with Structured Actions","a":"The natural units of structured discrete generation are often not independent single-component edits but richer actions: attaching a fragment to a molecule, inserting a node together with an incident edge, or growing a hierarchy by adding a child. Yet most existing discrete flow matching methods (DFM) are restricted to independent component-wise edits over fixed-size states. This restriction stems from endpoint conditioning: endpoints fix the source and target during training but not the action sequence between them, making tractable conditional rates hard to define for complex actions that cannot be factorized component-wise. We propose trajectory matching, which conditions the flow on a full sequence of actions connecting the endpoints. This yields principled, simulation-free training targets for user-defined action spaces, including actions that change state size, modify multiple components, or depend on earlier actions. We prove that the resulting objective recovers the marginal flow and that trajectory matching strictly subsumes factorized DFM, while additionally capturing actions with prerequisite structure such as hierarchy growth or fragment-based molecule generation. Empirically, on tree and molecular graph generation, trajectory matching with domain-aligned actions matches or surpasses factorized DFM baselines (lifting MOSES validity from 92.8% to 99.2%) and transfers without retraining to substructure extension and linking. Trajectory matching enlarges the design space of discrete flow matching by turning the action vocabulary into a modeling choice. An interactive explanation of trajectory matching is available at https://niklaskemper.com/blog/trajectory-matching/.","au":["Niklas Kemper","Marten Lienen","David Lüdke","Stephan Günnemann"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32602","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32602","doi":"","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1016/j.aei.2026.105389","t":"FrameDiT: A dual-stream conditional diffusion Transformer for component layout design of steel braced frame structures","a":"","au":["Jiang Li","Wei Wang","Yuqing Gao"],"v":"Advanced Engineering Informatics","u":"https://doi.org/10.1016/j.aei.2026.105389","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["diffusion transformer"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.aei.2026.105389","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.27068","t":"ASTROLABE: A 3D Particle-Level Surrogate for Cosmology Simulation with Physical Flow Matching","a":"The microphysics of dark matter (DM) is imprinted on cosmological structure across an enormous dynamic range. Nonlinear cosmological observables are most reliably modeled with N-body and hydrodynamic simulations. However, systematic N-body scans over DM theory space are prohibitively expensive. Machine learning emulators provide a possible solution, but are currently limited by either low resolution or only the ability to emulate specific observables. We introduce Astrolabe, a flow-matching-based generative emulator designed to be free of both constraints. Astrolabe acts directly on the 6N phase-space coordinates of N individual particles. With no voxel grid in the output, there is no voxel-resolution ceiling, and in principle any observable can be measured from inference. Astrolabe is computationally tractable via a field-particle hybrid transformer in which every particle cross-attends to multiscale field tokens, so compute and memory are linear in N. Astrolabe incorporates physical flow matching by taking the prior distribution for the flow to be approximate COmoving Lagrangian Acceleration (COLA)-based coordinates rather than unphysical noise, with momentum and mass conservation enforced at all points along flow time. In the Lambda-CDM cases we test, Astrolabe produces realistic fields with accurate power spectra, halo mass functions, velocity profiles, and halo density profiles. We also observe out-of-distribution generalization, with accurate emulation of dark-acoustic oscillation initial conditions. Astrolabe is also capable of being fine-tuned to simulate very large N and we demonstrate this by emulating a TNG50-3-dark simulation at a fraction of the cost.This method represents a first step toward a general and powerful cosmology simulation surrogate, which may eventually permit the inclusion of baryonic physics and a systematic exploration of richer dark sector interactions.","au":["Ibrahim Elsharkawy","David Y. Curtin","Yonatan F. Kahn","Neal Weiner"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27068","p":"2026-10-19","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27068","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26183","t":"HP-PnP-Flow: Hybrid Time Scheduling and Projection for Plug-and-Play Image Restoration via Flow Matching","a":"Image restoration is a fundamental inverse problem that seeks to recover high-quality images from degraded observations. Plug-and-Play (PnP) methods provide a flexible framework for integrating pretrained denoisers into iterative reconstruction, whereas flow matching offers an efficient generative modeling approach based on continuous-time ODE dynamics. Very recently, Martin et al.\\ (ICLR, 2025) developed a PnP-Flow method, which integrates the PnP framework with flow matching through a time-dependent denoiser constructed from a pretrained flow matching model.By incorporating a different time schedule and an additional pixel-space projection operator, this paper proposes a novel efficient PnP-Flow algorithm (HP-PnP-Flow) that enjoys rigorous convergence guarantees under mild assumptions, without imposing restrictive conditions on iterates required by the aforementioned work. Numerical experiments on CelebA and AFHQ-Cat demonstrate that the newly proposed HP-PnP-Flow algorithm significantly outperforms PnP-Flow on several restoration tasks such as denoising, deblurring, super-resolution, random inpainting, and box inpainting. Notably, our algorithm achieves comparable or better reconstruction quality with substantially fewer iterations, reducing the iteration count from $500$ to $100$ for deblurring and super-resolution on AFHQ-Cat.","au":["Yong Li","Xiaojie Wang","Xiaoyan Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26183","p":"2026-10-19","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26183","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29581","t":"Unlocking Spatial Grounding in Flow-Matching Models via SNR Tuning","a":"Despite the success of foundation models in image synthesis, achieving fine-grained spatial control remains a significant challenge, typically requiring auxiliary structural adapters or complex inference-time steering. While modern vision-language (VLM) text encoders possess the latent capacity to represent spatial coordinates, generative models often fail to leverage this information. We demonstrate that the signal-to-noise ratio (SNR) distribution is a critical determinant of spatial grounding in flow-matching models. Using a novel synthetic benchmark of geometric primitives, we isolate structural mechanics from textural complexity inherent in natural imagery and introduce a rigorous color-aware layout metric to quantify spatial fidelity. We show that training on a centered SNR distribution results in poor layout adherence (25.9%). Instead, we identify high-noise regimes as a \"critical learning phase\" for spatial grounding. Shifting the training focus toward these stages increases layout adherence to 80.8%, effectively reaching the 83.6% reconstruction ceiling of the underlying variational autoencoder. We find that the necessity for this shift scales with resolution and aspect ratio variance, and that the conservative noise schedules employed by models like FLUX.1 are insufficient for precise layout adherence. Finally, we show that these findings translate to real-world imagery via the COCO dataset (1.0 vs. 57.3 Average Precision), where state-of-the-art layout adherence is unlocked through distribution tuning alone, without architectural modifications.","au":["Martin Thißen","Elke Hergenröther"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29581","p":"2026-10-21","d":"2026-10-26","s":3.1,"tp":["gen-model","vision-gen"],"kw":["flow matching","image synthesis"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.29581","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1016/j.aei.2026.105393","t":"Intelligent design of shear wall layout based on conditional flow matching","a":"","au":["Hongmei Zhang","Jiacheng Guo","Jixing Cao","Ahmed Sharhan"],"v":"Advanced Engineering Informatics","u":"https://doi.org/10.1016/j.aei.2026.105393","p":"2026-10-21","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.aei.2026.105393","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.31222","t":"GLOW-FM: Efficient Generative Low-Light Image Enhancement with One-Step Latent Flow Matching","a":"Low-light image enhancement (LLIE) aims to recover well-exposed and perceptually faithful images from severely degraded observations. Recent diffusion-based generative methods achieve strong perceptual quality by leveraging powerful image priors, but their iterative sampling incurs substantial computational cost, limiting practical deployment. Despite recent efficiency gains in generative LLIE, high-quality enhancement with a single function evaluation and low overall computation remains challenging, particularly under diverse real-world low-light conditions. We introduce GLOW-FM, a one-step latent flow-matching framework for efficient generative LLIE. GLOW-FM performs conditional transport in the latent space of a frozen Tiny-VAE and leverages Terminal Velocity Matching (TVM) to enable enhancement with a single function evaluation. Matched comparisons with alternative one-step objectives support TVM as an effective design choice, and, to the best of our knowledge, this is its first adaptation to image restoration and specifically to LLIE. Extensive experiments on challenging real-world benchmarks demonstrate that GLOW-FM achieves competitive image quality and state-of-the-art cross-dataset generalization while requiring only a single function evaluation and 34 GFLOPs for the small variant. These findings highlight the potential of GLOW-FM to bring generative LLIE closer to practical deployment through single-step inference and compact latent modeling. Code will be made publicly available upon publication.","au":["Ariel Lapid","Yuval Haitman","Reuven Peretz","Arnon Netzer","Idit Diamant"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31222","p":"2026-10-22","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.31222","who":[],"tz":"","az":"","rv":"","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32459","t":"MDMR-Bench: A Multi-Dimensional Benchmark for Mult
