c covariance-mediated pathway for propagating likelihood information from observed to unobserved state components. We introduce a covariance-informed ensemble score filter (CI-EnSF) that embeds localized forecast-error covariance geometry directly into the forward diffusion and reverse transport. The proposed forward diffusion is covariance-shaped in standardized state space and becomes isotropic under the corresponding control-variable transformation. This covariance structure continuously propagates observational information from observed to unobserved state components throughout the reverse transport analysis trajectory. Experiments with Lorenz-96 and surface quasi-geostrophic (SQG) dynamics show a clear regime dependence. For linear observations, a well-tuned LETKF is more accurate, while CI-EnSF maintains stable cycling and effective covariance-mediated information propagation. Under strongly nonlinear observations and under climatological initialization, CI-EnSF achieves lower analysis error and greater cycling robustness than Gaussian ensemble benchmarks such as the LETKF, with improvements extending across spatial scales in the nonlinear SQG experiment. These results suggest that the principal benefit of CI-EnSF arises from combining nonlinear distributional transport with the mature covariance geometry used in conventional data assimilation.","au":["Siming Liang","Peter Jan van Leeuwen","Hristo G. Chipilski","Zezhong Zhang","Feng Bao","Guannan Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32148","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["score-based"],"src":["arxiv"],"kind":"preprint","ax":"2610.32148","doi":"","who":[],"tz":"协方差信息集合分数滤波：将局部协方差几何嵌入基于分数的传输","az":"背景误差协方差模型是大气数据同化的核心，因为它们将部分观测信息在空间、变量和动力学耦合尺度上扩散。集合方法和变分方法高效地利用了这种协方差几何结构，但它们的标准分析公式主要围绕高斯或局部二次近似构建。基于分数的集合滤波为非线性分布传输提供了框架，但现有的集合分数滤波（EnSF）公式缺乏一种内在的协方差介导路径，用于将似然信息从观测状态分量传播到未观测状态分量。我们提出了一种协方差信息集合分数滤波（CI-EnSF），将局部预报误差协方差几何结构直接嵌入前向扩散和反向传输中。所提出的前向扩散在标准化状态空间中呈协方差形状，在对应的控制变量变换下变为各向同性。这种协方差结构在反向传输分析轨迹中持续地将观测信息从观测状态分量传播到未观测状态分量。基于Lorenz-96和表面准地转（SQG）动力学的实验显示出明显的机制依赖性。对于线性观测，经过良好调优的LETKF更为准确，而CI-EnSF保持了稳定的循环和有效的协方差介导信息传播。在强非线性观测和气候学初始化条件下，CI-EnSF比LETKF等高斯集合基准方法实现了更低的分析误差和更强的循环鲁棒性，在非线性SQG实验中，改进跨越了多个空间尺度。这些结果表明，CI-EnSF的主要优势来自于将非线性分布传输与传统数据同化中成熟的协方差几何结构相结合。","rv":"本文面向大气数据同化，提出CI-EnSF方法，将局部预报误差协方差几何嵌入score-based集合滤波的前向扩散与反向传输，使观测信息沿协方差结构持续传播至未观测分量。在Lorenz-96和SQG实验中，强非线性观测下优于LETKF等高斯基准。与生成模型中的score-based扩散有方法学关联，但核心对象是大气状态估计，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32222","t":"ACWM-RM: A Reference-Free Reward Model from Complementary Mismatch Preferences","a":"Reinforcement learning has gained attention for improving action-conditioned world models (ACWMs), as it enables reward-driven optimization of visual quality (VQ) and action-following fidelity (AF) beyond flow-matching optimization. Realizing this potential requires reward signals that reliably rank videos by both VQ and AF. However, existing rewards capture only one dimension: metric-based rewards assess VQ but require ground-truth videos and do not directly assess AF, while inverse dynamics model (IDM) rewards assess AF without references but do not guarantee VQ. Moreover, IDMs, typically trained on real videos, may provide unreliable rewards for generated videos containing visual artifacts and physical inconsistencies. In this work, we introduce the Action and Video Mismatch Benchmark (AVM-Eval), comprising 67.2k pairs that evaluate how reliably IDMs assess AF on real and generated videos. We then propose ACWM-RM, a reward model that jointly assesses VQ and AF without ground-truth videos during reward computation. To train it, we first construct the Action and Video Mismatch Preference Dataset (AVM-Pref) with 506.3k pairs providing complementary supervision: action-mismatch pairs supervise AF, while video-mismatch pairs supervise VQ and expose the model to generated videos. We then pretrain an action-conditioned predictor on real videos to learn forward dynamics before jointly training it with a patch-weighted score head on AVM-Pref to transfer these dynamics to AF assessment on generated videos. Evaluation on AVM-Eval reveals the limited reliability of IDMs on generated videos, while downstream RL experiments show that ACWM-RM outperforms reward baselines in both criteria.","au":["Shibo Hong","Siyu Ren","FengJiao Chen","Zhongyuan Peng","Wei Shi","Yixin Cao"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32222","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32222","doi":"","who":[],"tz":"ACWM-RM：基于互补失配偏好的无参考奖励模型","az":"强化学习因能在流匹配优化之外实现视觉质量（VQ）与动作跟随保真度（AF）的奖励驱动优化，而受到改善动作条件世界模型（ACWM）方面的关注。实现这一潜力需要能同时按 VQ 和 AF 可靠排序视频的奖励信号。然而，现有奖励仅覆盖单一维度：基于指标的奖励评估 VQ 但需要真值视频且不直接评估 AF，而逆动力学模型（IDM）奖励无需参考即可评估 AF 却不保证 VQ。此外，IDM 通常在真实视频上训练，对包含视觉伪影和物理不一致的生成视频可能给出不可靠的奖励。本文引入动作与视频失配基准（AVM-Eval），包含 67.2k 对样本，用于评估 IDM 在真实视频和生成视频上评估 AF 的可靠性。随后提出 ACWM-RM，一个在奖励计算时无需真值视频即可联合评估 VQ 和 AF 的奖励模型。为训练该模型，首先构建动作与视频失配偏好数据集（AVM-Pref），包含 506.3k 对样本，提供互补监督：动作失配对监督 AF，视频失配对监督 VQ 并使模型接触生成视频。然后在真实视频上预训练一个动作条件预测器以学习前向动力学，再将其与一个块加权评分头在 AVM-Pref 上联合训练，将这些动力学迁移到对生成视频的 AF 评估上。在 AVM-Eval 上的评估揭示了 IDM 对生成视频可靠性有限，而下游强化学习实验表明 ACWM-RM 在两项指标上均优于奖励基线。","rv":"针对动作条件世界模型的强化学习训练，本文提出无参考奖励模型ACWM-RM，利用互补失配偏好数据同时评估视觉质量与动作跟随保真度。方法通过构建失配偏好数据集并预训练动作条件预测器实现，属于视频生成与世界模型领域的奖励建模，与有机分子晶体、文本生成模型关系较弱，与视觉生成（视频）更近。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32485","t":"PCFBench: How Far Can Large Vision-Language Models Go in Physics-aware Photonic Inverse Design?","a":"Photonic crystal fibers (PCFs) underpin critical applications in telecommunications, sensing, and high-power laser delivery, yet their design remains a manual, expert-intensive process that couples geometric intuition with deep waveguide physics. Vision-language models (VLMs) offer a promising path toward automating PCF design, but can they truly reason about photonic physics from microscopy images, or do they merely recognize visual patterns? We introduce PCFBench, the first comprehensive benchmark for evaluating VLMs on the perception, reasoning, and decision steps of the photonic inverse-design loop. PCFBench spans 26 tasks organized into six categories of increasing cognitive demand (Geometry Perception, Physics Understanding, Text Generation, Multi-modal Reasoning, Inverse-Design Decision, and Code Generation), built from over 220K FDTD simulation samples across 18 structurally diverse fiber families. We evaluate both individual VLMs on isolated tasks and multi-agent systems (MAS) on the full sequential pipeline from perception to design. Our results reveal a striking perception-design gap: current models can identify fiber geometry with moderate success, yet consistently fail to translate that visual understanding into physics-aware design actions. Moreover, cascading agents through the pipeline exposes significant error propagation, where upstream perception mistakes compound into downstream design failures. These findings suggest that neither model scaling nor naive agent chaining suffices, and that closing the loop demands explicit physical grounding. PCFBench provides the community with a rigorous, multi-dimensional testbed to measure progress toward AI-assisted photonic engineering. The project is available at https://pcfbench.github.io/.","au":["Shengchao Chen","Ting Shu","Sufen Ren"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32485","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["crystal-gen"],"kw":["inverse design"],"src":["arxiv"],"kind":"preprint","ax":"2610.32485","doi":"","who":[],"tz":"PCFBench：大型视觉语言模型在物理感知光子逆向设计中能走多远？","az":"光子晶体光纤（PCF）支撑着电信、传感和高功率激光传输等关键应用，但其设计仍然是一个依赖人工、需要大量专家经验的过程，将几何直觉与深层波导物理耦合在一起。视觉语言模型（VLM）为自动化PCF设计提供了一条有前景的路径，但它们能否真正从显微镜图像中推理光子物理，还是仅仅识别视觉模式？我们提出PCFBench，这是首个全面评估VLM在光子逆向设计循环中感知、推理和决策步骤的基准。PCFBench涵盖26个任务，按认知需求递增组织为六个类别（几何感知、物理理解、文本生成、多模态推理、逆向设计决策和代码生成），基于18个结构多样的光纤家族中超过22万个FDTD仿真样本构建。我们既评估了单个VLM在孤立任务上的表现，也评估了多智能体系统（MAS）在从感知到设计的完整顺序流水线上的表现。我们的结果揭示了一个显著的感知-设计鸿沟：当前模型能以中等成功率识别光纤几何结构，但始终无法将这种视觉理解转化为具有物理感知的设计动作。此外，将智能体级联到流水线中暴露了显著的误差传播问题，上游感知错误会累积为下游设计失败。这些发现表明，无论是模型扩展还是简单的智能体级联都不够，要闭合循环需要显式的物理基础。PCFBench为社区提供了一个严格的、多维度的测试平台，用于衡量向AI辅助光子工程迈进的进展。项目可在 https://pcfbench.github.io/ 获取。","rv":"提出PCFBench基准，评估视觉语言模型在光子晶体光纤逆向设计中的感知、推理与决策能力，涵盖26个任务、22万FDTD仿真样本。实际工作是构建评测框架并测试VLM及多智能体系统，发现感知-设计鸿沟与误差传播。与「视觉生成」有弱关联（涉及显微镜图像理解），但核心是光子物理逆向设计评测，与有机分子晶体、生成模型、相关数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32964","t":"Flownomaly: Single-Step Conditional-Mean Recovery for Few-Shot Anomaly Detection","a":"Few-shot industrial anomaly detection requires modeling category-specific normality from only a handful of defect-free images. Common approaches tie inference to stored exemplars, impose rigid linear structure, or risk reproducing anomalous content. Flownomaly instead casts the problem as normal-counterpart recovery in frozen DINOv2 feature space. Given normal supports, a velocity field is learned through conditional flow matching over frozen patch tokens to transport Gaussian noise toward normal features. Along straight paths, a single recovery step using one evaluation of the optimal field yields the posterior mean of the clean normal token without trajectory integration. The operating time governs how strongly recovery modifies a query token. With no anomalous validation samples available for tuning, a normal-only Jacobian gain-to-noise criterion selects this time from the supports alone. Squared residuals between query tokens and their recovered counterparts yield anomaly signals for both dense localization and image-level detection. Across 1-, 2-, and 4-shot benchmarks on MVTec-AD and VisA, together with sample-shot evaluations on Real-IAD, Flownomaly achieves state-of-the-art performance against recent category-specific methods. In the 1-shot setting, image- and pixel-level AUROC reach 97.8% and 98.0% on MVTec-AD and 95.3% and 98.7% on VisA, with a 2.1-point image-level AUROC improvement over the strongest baseline on VisA. Code is available at https://github.com/b-rbmp/Flownomaly.","au":["Bernardo Perrone Ribeiro","Erkut Akdag","Egor Bondarev"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32964","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32964","doi":"","who":[],"tz":"Flownomaly：面向少样本异常检测的单步条件均值恢复","az":"少样本工业异常检测需要仅从少量无缺陷图像中建模类别特定的正常性。常见方法将推理绑定到存储的样本上、施加刚性的线性结构、或存在复现异常内容的风险。Flownomaly 则将问题转化为在冻结的 DINOv2 特征空间中进行正常对应物恢复。给定正常支持集，通过对冻结的 patch token 进行条件流匹配来学习速度场，将高斯噪声传输至正常特征。沿直线路径，使用最优场的一次评估进行单步恢复即可得到干净正常 token 的后验均值，无需轨迹积分。操作时间控制恢复对查询 token 的修改强度。在没有异常验证样本可供调优的情况下，仅使用正常样本的雅可比增益-噪声准则从支持集中选择该时间。查询 token 与其恢复对应物之间的平方残差产生异常信号，用于密集定位和图像级检测。在 MVTec-AD 和 VisA 上的 1 样本、2 样本和 4 样本基准测试中，以及在 Real-IAD 上的样本级评估中，Flownomaly 相较于近期的类别特定方法达到了最先进的性能。在 1 样本设置下，MVTec-AD 上的图像级和像素级 AUROC 分别达到 97.8% 和 98.0%，VisA 上分别达到 95.3% 和 98.7%，在 VisA 上图像级 AUROC 比最强基线提升 2.1 个百分点。代码可在 https://github.com/b-rbmp/Flownomaly 获取。","rv":"Flownomaly 面向少样本工业异常检测，在冻结 DINOv2 特征空间中以条件流匹配学习速度场，对高斯噪声做单步恢复得到正常 token 后验均值，再以查询与恢复 token 的平方残差输出异常信号。方法核心是流匹配的单步条件均值恢复，与「视觉生成」中的生成模型思路较近，但应用对象为工业缺陷图像，与有机分子晶体无直接关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1021/acs.cgd.6c00999","t":"Structure and Stability Prediction of Binary and Ternary Molecular Mixed Crystals Using Ensemble Free Energies","a":"Mixed crystals provide a route to tune the properties of molecular solids through continuous changes in composition. However, predicting their stability is challenging because it requires determining both substitution energies and configurational entropy across large configuration spaces. Here, we combine crystal structure prediction, force field lattice energy and lattice dynamics calculations, and Δ-machine-learning energy corrections with a scaled partition-function approach to assess structure prediction and evaluate binary and ternary mixed crystals of anthracene (ANT), acridine (ACR), and phenazine (PNZ). The composition-dependent ensemble free energy (ΔGensemble) was estimated without exhaustive enumeration of all configurations from representative ensembles of substituted supercell models of mixed crystals. Crystal structure prediction reproduces the known polymorphs as the lowest energy structures and the mixed crystal modelling approach reproduces the main experimental binary trends: ACR incorporation into ANT and the α and β polymorphs of PNZ, ANT incorporation into ACR form II, and the formation of a PNZ β-type ternary phase. Furthermore, we predict additional thermodynamically stable compositions, including PNZ incorporation into ACR form IX, and ternary crystals based on ACR forms II, VI and VII. Stable three-component regions arise from binary trends, with ACR mediating between both ANT and PNZ. These results demonstrate a practical framework for predicting the structure, thermodynamic stability and composition limits of molecular mixed crystals. The mixed crystal modelling methods are available within the mol-CSPy crystal structure prediction package.","au":["Anthony J. R. Payne","Sarah Madeira","Graeme Matthew Day"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00999","p":"2026-10-22","d":"2026-10-26","s":10.8,"tp":["csp"],"kw":["crystal structure prediction","crystal structure","lattice energy"],"src":["openalex","crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00999","who":["Graeme M. Day"],"tz":"使用系综自由能预测二元和三元分子混合晶体的结构与稳定性","az":"混合晶体为通过组成的连续变化来调节分子固体性质提供了一条途径。然而，预测其稳定性具有挑战性，因为它需要在大构型空间中同时确定取代能和构型熵。在此，我们将晶体结构预测、力场晶格能和晶格动力学计算以及Δ机器学习能量校正与缩放配分函数方法相结合，以评估结构预测并评价蒽（ANT）、吖啶（ACR）和菲嗪（PNZ）的二元和三元混合晶体。组成依赖的系综自由能（ΔGensemble）通过混合晶体取代超胞模型的代表性系综进行估算，而无需对所有构型进行穷举枚举。晶体结构预测将已知多晶型复现为最低能量结构，混合晶体建模方法复现了主要的实验二元趋势：ACR掺入ANT以及PNZ的α和β多晶型、ANT掺入ACR II型，以及PNZ β型三元相的形成。此外，我们预测了额外的热力学稳定组成，包括PNZ掺入ACR IX型，以及基于ACR II型、VI型和VII型的三元晶体。稳定的三组分区域源于二元趋势，其中ACR在ANT和PNZ之间起中介作用。这些结果展示了一个预测分子混合晶体结构、热力学稳定性和组成极限的实用框架。混合晶体建模方法可在mol-CSPy晶体结构预测软件包中使用。","rv":"针对蒽、吖啶、菲嗪的二元与三元分子混合晶体，结合晶体结构预测、力场晶格能、晶格动力学、Δ机器学习能量校正与缩放配分函数，估算组成依赖的系综自由能，无需穷举构型。复现了已知多晶型及实验二元趋势，并预测了新的热力学稳定组成。与「有机分子晶体」直接相关，属结构预测与热力学评估，与生成模型、视觉生成关系弱。","tr":"high","tw":"作者：Graeme M. Day；期刊在重点名单","why":""},{"k":"t:1cb3085840a024","t":"Automatically Building and Updating a Knowledge Graph of MLIP Models","a":"Complementing the many efforts in providing semantic representations of concepts, notions, and entities in materials science, we report and illustrate a process by which we can automatically build a knowledge graph of the fast evolving field of machine learning applied to the prediction of material properties, focusing on MLIP (Machine Learning Interatomic Potential). This LLM-based process relies on multiple steps, from information extraction in documents and articles to a validation loop using SHACL constraints to detect and correct errors. It is carried out on a model-by-model basis, focusing on the consistency of representation, therefore enabling an iterative construction where the addition of new models is facilitated. We illustrate the process by showing a few interesting aspects that can be queried from a knowledge graph built from the models listed in the Matbench Discovery leaderboard.","au":["Alexis Beer","L. Klochko","Mathieu d’Aquin"],"v":"HAL","u":"https://hal.science/hal-05785570","p":"2026-10-25","d":"2026-10-26","s":9.9,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential","mlip"],"src":["openalex"],"kind":"paper","ax":"","doi":"","who":[],"tz":"自动构建和更新 MLIP 模型知识图谱","az":"作为材料科学中为概念、观念和实体提供语义表示的众多工作的补充，我们报告并展示了一个流程，通过该流程可以自动构建一个知识图谱，覆盖机器学习应用于材料性质预测这一快速演进的领域，重点聚焦于 MLIP（机器学习原子间势）。这一基于大语言模型（LLM）的流程依赖多个步骤，从文档和文章中的信息提取，到使用 SHACL 约束进行验证循环以检测和纠正错误。该流程以逐模型为基础进行，关注表示的一致性，从而实现了迭代式构建，使得新模型的添加更加便捷。我们通过展示从基于 Matbench Discovery 排行榜中所列模型构建的知识图谱中可以查询到的若干有趣方面来说明该流程。","rv":"该工作利用 LLM 结合 SHACL 约束，逐模型自动构建并迭代更新 MLIP（机器学习原子间势）领域的知识图谱，核心贡献在于语义表示的一致性与可查询性。属于材料信息学与知识工程交叉方向，与「有机分子晶体」「生成模型」「视觉生成」「相关数学」均无实质关联，关系较弱。","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.1002/adma.75492","t":"Machine‐Learning‐Potential‐Driven Volcano Relationship in Grain Boundary Amorphicity and Ionic Transport of Antiperovskite Solid Electrolytes","a":"Ionic transport in solid‐state electrolytes is governed by interfacial disorder and local chemical environments, yet their microscopic design principles remain challenging because large‐scale interfacial kinetics are simulated using molecular dynamics (MD), where predictive design requires quantum‐level accuracy. Here, we use an actively learned machine learning interatomic potential (MLIP) to bridge this scale‐accuracy gap in halide‐tunable antiperovskite solid electrolytes. By varying the local Cl − /Br − ratio and quantifying interfacial amorphicity and ion flux, we identify an MLIP‐driven volcano relationship between structural disorder and ionic transport. Cl‐enriched grain boundaries remain overly ordered, whereas Br − enrichment induces excessive disorder that disrupts migration. Intermediate halide compositions maximize ionic transport through moderately amorphous environments. Guided by this relationship, we design an anion‐engineered grain boundary through selective halide tuning. These results establish controlled anion segregation as a strategy for reducing interfacial resistance and highlight MLIP‐enhanced MD as a predictive framework for transport and disorder engineering in solid‐state materials.","au":["Abdullah Bin Faheem","Haobo Li"],"v":"Advanced Materials","u":"https://doi.org/10.1002/adma.75492","p":"2026-10-23","d":"2026-10-26","s":9.2,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential","mlip"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1002/adma.75492","who":[],"tz":"机器学习势驱动的反钙钛矿固体电解质晶界非晶化与离子传输中的火山关系","az":"固态电解质中的离子传输受界面无序度和局部化学环境控制，但其微观设计原则仍具挑战性，因为大规模界面动力学需借助分子动力学（MD）模拟，而预测性设计需要量子级别的精度。在此，我们使用主动学习的机器学习原子间势（MLIP）来弥合卤化物可调反钙钛矿固体电解质中这一尺度-精度差距。通过改变局部 Cl−/Br− 比例并量化界面非晶化程度和离子通量，我们识别出结构无序度与离子传输之间由 MLIP 驱动的火山关系。富 Cl 晶界仍过于有序，而富 Br 则诱导过度无序从而破坏迁移。中间卤化物组成通过适度非晶化环境实现离子传输最大化。在该关系指导下，我们通过选择性卤化物调控设计了阴离子工程化晶界。这些结果确立了受控阴离子偏析作为降低界面电阻的策略，并突出了 MLIP 增强 MD 作为固态材料中传输与无序工程预测性框架的价值。","rv":"用主动学习 MLIP 做反钙钛矿固体电解质晶界分子动力学模拟，发现卤化物比例与离子传输间的火山关系，据此设计阴离子工程化晶界。属计算材料与分子动力学范畴，与有机分子晶体、生成模型、视觉生成均无直接关联，与相关数学也关系较弱，更接近统计物理与计算化学。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.30086","t":"Orbitol: Crystal Generation on Wyckoff Orbits","a":"Generative models propose crystalline materials by learning composition and geometry, but unconditional sampling gives no direct control over the space group, which constrains whether responses such as piezoelectricity are symmetry-allowed. We present Orbitol, a crystal generator built on the Crystalite diffusion Transformer that replaces atom tokens with Wyckoff-orbit tokens. Given a space group and a collection of occupied Wyckoff positions, Orbitol generates the atom type and free coordinates of each orbit together with a compatible lattice, so every valid structure is invariant under the operations of the requested group. It generates structures two to three orders of magnitude faster than the symmetry-aware baselines at the evaluated settings. On MP-20, 13.8% of Orbitol's attempts yielded stable or metastable, unique and novel structures that retained the requested space group after relaxation, compared with 10.8% for SGFM, the next best model. We also introduce SPARC, a score that combines retention of the raw detected space group with agreement between the retained-group and training distributions. Finally, we used Orbitol to generate candidates in piezoelectric crystal classes. Of the structures selected by internal screening, 89% passed our density functional theory checks, and 79% also matched no Materials Project or Alexandria entry with the same space group. Their median figure of merit was nine times that of the piezoelectric materials computed in the Materials Project, and 24% of the new candidates ranked in that set's top 10%.","au":["Ivan Žugec","Joshua Rosenthal","Ivor Lončarić","Jan-Willem van de Meent","Tin Hadži Veljković"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30086","p":"2026-10-21","d":"2026-10-26","s":9.2,"tp":["crystal-gen"],"kw":["crystal generation","generative models","symmetry-aware","wyckoff"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30086","who":[],"tz":"Orbitol：基于 Wyckoff 轨道的晶体生成","az":"生成模型通过学习成分和几何结构来提出晶体材料，但无条件采样无法直接控制空间群，而空间群决定了压电性等响应是否在对称性上被允许。我们提出 Orbitol，一个基于 Crystalite 扩散 Transformer 的晶体生成器，用 Wyckoff 轨道 token 替代原子 token。给定一个空间群和一组被占据的 Wyckoff 位置，Orbitol 生成每个轨道的原子类型和自由坐标以及一个兼容的晶格，使得每个有效结构在所请求群的对称操作下保持不变。在评估的设置下，它比对称性感知基线快两到三个数量级地生成结构。在 MP-20 上，Orbitol 13.8% 的尝试产生了稳定或亚稳的、独特且新颖的结构，且在弛豫后保留了所请求的空间群，而次优模型 SGFM 为 10.8%。我们还引入了 SPARC，一个将原始检测空间群的保留率与保留群分布和训练分布之间的一致性相结合的评分。最后，我们使用 Orbitol 在压电晶体类中生成候选结构。在内部筛选选出的结构中，89% 通过了我们的密度泛函理论检验，79% 也未与 Materials Project 或 Alexandria 中具有相同空间群的条目匹配。它们的中位数品质因数是 Materials Project 中计算的压电材料的九倍，24% 的新候选结构排在该集合的前 10%。","rv":"Orbitol 是基于扩散 Transformer 的晶体生成器，用 Wyckoff 轨道 token 替代原子 token，在生成时直接约束空间群对称性，比对称性感知基线快两到三个数量级。属于晶体结构生成与生成模型方向，与有机分子晶体关系较弱，但条件生成与对称性约束的方法论对分子晶体生成有参考意义。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26301","t":"Machine Learning-Assisted Discovery of Carbon-Related Defect Formation Mechanisms in Diamond","a":"Diamond is an important host material for functional defects such as solid-state spin qubits. During the defect creation by irradiation and subsequent thermal annealing, carbon-related defects, including vacancies and interstitials, are generated and can migrate to form new defect complexes. To investigate this kinetically driven process and reveal the formation mechanisms of the di-interstitials and di-vacancies in the neutral charge state, we fine-tuned a universal machine learning interatomic potential using a small dataset generated from density functional theory calculations. We obtained a barrier of 1.84 eV for mono-interstitial migration and found that two initially separated mono-interstitials only need to overcome a lower barrier to form di-interstitial configurations. Beyond the training data, the MLIP also identified the formation pathway for an additional di-interstitial configuration and a stepwise divacancy dissociation mechanism. These results reveal migration-assisted defect complex formation mechanisms and demonstrate how targeted MLIP training can identify reaction pathways.","au":["Grace Huang","Christopher Fivecoat","Xun Xu","Mengen Wang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26301","p":"2026-10-19","d":"2026-10-26","s":8.6,"tp":["mlip"],"kw":["machine learning interatomic potential","density functional theory","interatomic potential","mlip"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26301","who":[],"tz":"机器学习辅助发现金刚石中碳相关缺陷形成机制","az":"金刚石是固态自旋量子比特等功能缺陷的重要宿主材料。在辐照产生缺陷及随后的热退火过程中，会产生包括空位和间隙原子在内的碳相关缺陷，这些缺陷可以迁移并形成新的缺陷复合体。为了研究这一动力学驱动过程并揭示中性电荷态下双间隙原子和双空位的形成机制，我们使用由密度泛函理论计算生成的小数据集对一个通用机器学习原子间势进行了微调。我们得到单间隙原子迁移势垒为1.84 eV，并发现两个初始分离的单间隙原子只需克服更低的势垒即可形成双间隙原子构型。在训练数据之外，该机器学习原子间势还识别出另一种双间隙原子构型的形成路径以及逐步双空位解离机制。这些结果揭示了迁移辅助的缺陷复合体形成机制，并展示了如何通过针对性的机器学习原子间势训练来识别反应路径。","rv":"本文用微调的机器学习原子间势（MLIP）研究金刚石中碳相关缺陷（空位、间隙原子）的迁移与复合形成机制，属于计算材料与缺陷物理范畴。与「有机分子晶体 / 生成模型 / 视觉生成 / 相关数学」四类均关系较弱，最接近的或许是「相关数学」中势函数与能量面搜索，但本质仍是凝聚态物理问题。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.27762","t":"CrystalAR: Autoregressive Modeling for Symmetric Crystal Generation","a":"Deep generative modeling has achieved remarkable progress in crystal generation. Given the rich symmetries inherent in crystalline structures, recent work has sought to explicitly incorporate space-group symmetry into generative models, enabling more effective exploration of novel symmetry templates. Yet introducing symmetry templates increases the combinatorial complexity of stoichiometric relationships between atomic species and crystallographic sites, while creating a fundamental tension between flexible exploration of discrete crystallographic templates and faithful realization of these templates as continuous three-dimensional structures. To address these challenges, we propose CrystalAR, a unified autoregressive framework that models Wyckoff symmetry templates and complete crystal structures within a single generative sequence. Specifically, CrystalAR reformulates continuous coordinate generation as a symmetry-conditioned hierarchy of discrete spatial localization decisions, autoregressively refining the positions of all symmetry-inequivalent sites across resolution levels while jointly modeling their spatial configuration within each level. This discrete hierarchical formulation further enables constraint-aware search over both crystallographic templates and geometric realizations. As a result, CrystalAR retains strong symmetry-template generation capability while achieving competitive de novo generation performance and template-free crystal structure prediction (CSP) accuracy. These results suggest that symmetry-template generation can be retained alongside broadly competitive de novo generation performance and competitive CSP without reliance on symmetry templates retrieved from prior data, providing a promising alternative paradigm for symmetry-preserving crystal generation.","au":["Ziqiao Meng","Rongsheng Chen","郑直","N. Kazeev","Zhenkun Wang","Andrey Ustyuzhanin","Wee Sun Lee"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27762","p":"2026-10-20","d":"2026-10-26","s":8.6,"tp":["crystal-gen","csp"],"kw":["crystal generation","generative models","de novo","wyckoff","crystal structure prediction (csp)","crystal structure prediction","crystal structure","space group"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27762","who":[],"tz":"CrystalAR：面向对称晶体生成的自回归建模","az":"深度生成建模在晶体生成方面取得了显著进展。鉴于晶体结构中固有的丰富对称性，近期工作试图将空间群对称性显式地纳入生成模型，从而更有效地探索新型对称模板。然而，引入对称模板会增加原子种类与晶体学位点之间化学计量关系的组合复杂度，同时在灵活探索离散晶体学模板与将这些模板忠实地实现为连续三维结构之间产生了根本性张力。为应对这些挑战，我们提出 CrystalAR，一个统一的自回归框架，在单一生成序列中对 Wyckoff 对称模板和完整晶体结构进行建模。具体而言，CrystalAR 将连续坐标生成重新表述为对称性条件下的离散空间定位决策层级，自回归地跨分辨率层级细化所有对称不等价位点的位置，同时在每个层级内联合建模其空间构型。这种离散层级化表述进一步支持了对晶体学模板和几何实现的约束感知搜索。因此，CrystalAR 在保持强大的对称模板生成能力的同时，实现了具有竞争力的从头生成性能和无模板晶体结构预测（CSP）精度。这些结果表明，对称模板生成可以与广泛具有竞争力的从头生成性能和具有竞争力的 CSP 精度并存，且无需依赖从先前数据中检索的对称模板，为保持对称性的晶体生成提供了一种有前景的替代范式。","rv":"CrystalAR 将 Wyckoff 对称模板与完整晶体结构统一于单一自回归序列，把连续坐标生成重构为对称性条件下的离散空间定位决策层级，实现约束感知的模板与几何联合搜索。属生成模型在晶体结构预测中的应用，与「生成模型」关系最近，与「有机分子晶体」关系较弱，主要面向无机晶体。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1021/acs.cgd.6c00526","t":"Slipping into Solvates: Structure-Surface-Solvent Interplay in the Mechanochemical Solvate Formation of Ivacaftor","a":"Solvate formation in molecular crystals remains difficult to predict, particularly under non-equilibrium conditions, where the initial solid state, mechanically generated surfaces, anisotropic surface chemistry, and solvent properties collectively influence solid-solvent interactions. While mechanochemical processing is widely used to access new solid forms, the structural features that control solvent incorporation during mechanical activation are not yet well understood. In this work, we investigate mechanochemically induced solvate formation in ivacaftor as a model molecular crystal, focusing on the effects of solvent nature, liquid-additive volume, milling duration, and starting solid form. Form C transformed selectively to a solvate, in MeOH, THF, and DMSO, whereas the amorphous material exhibited broader solvate-forming behavior, including hydrate and non-polar solvate formation. The observed transformations could not be explained by solvent class or apparent dissolution capacity alone, demonstrating the importance of the starting solid state and specific host-solvent interactions. Crystal structure and surface analyses of form C identified the (200) plane as a plausible mechanically responsive plane whose alternative termination exposes polar groups involved in the resulting solvate structures. Overall, the results support a model in which mechanochemical solvate formation is governed by the interplay among the initial solid state, mechanically generated surfaces, and specific solid-solvent interactions.","au":["Argyro Chatziadi","Adéla Koryt’áková","Eliška Zmeškalová","Jan Rohlíček","Markéta Jarošová","Morgane Poupon","Luděk Ridvan","Miroslav Šoóš"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00526","p":"2026-10-24","d":"2026-10-26","s":8.2,"tp":["csp"],"kw":["molecular crystals","molecular crystal","crystal structure"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00526","who":[],"tz":"滑入溶剂化物：Ivacaftor 机械化学溶剂化物形成中结构-表面-溶剂的相互作用","az":"分子晶体中溶剂化物的形成仍然难以预测，特别是在非平衡条件下，初始固相状态、机械生成的表面、各向异性表面化学和溶剂性质共同影响固-溶剂相互作用。虽然机械化学加工被广泛用于获取新的固相形态，但在机械活化过程中控制溶剂纳入的结构特征尚未得到充分理解。在本工作中，我们以 ivacaftor 作为模型分子晶体，研究机械化学诱导的溶剂化物形成，重点关注溶剂性质、液体添加剂体积、研磨时间和起始固相形态的影响。C 型选择性地转化为溶剂化物，在 MeOH、THF 和 DMSO 中均如此，而无定形材料则表现出更广泛的溶剂化物形成行为，包括水合物和非极性溶剂化物的形成。观察到的转化不能仅用溶剂类别或表观溶解能力来解释，这表明起始固相状态和特定的主-溶剂相互作用的重要性。对 C 型的晶体结构和表面分析确定了 (200) 面作为一个可能的机械响应面，其替代终止面暴露出参与所形成溶剂化物结构的极性基团。总体而言，结果支持这样一个模型：机械化学溶剂化物形成受初始固相状态、机械生成的表面和特定固-溶剂相互作用之间相互作用的支配。","rv":"以 ivacaftor 为模型分子晶体，通过机械化学研磨探究溶剂化物形成机制，发现 C 型晶体 (200) 面在机械活化后暴露极性基团，是溶剂纳入的关键结构特征。工作聚焦有机分子晶体的固相转化与表面化学，与「有机分子晶体」直接相关，与生成模型、视觉生成及数学基本无关。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.29634","t":"Symmetry-Based Parameter Efficient Low-Rank Fine-Tuning for High-Throughput Calculation of Lattice Thermal Conductivity","a":"Accurate and efficient prediction of lattice thermal conductivity (LTC) is essential for developing materials for thermoelectric, microelectronic, and photovoltaic applications. Here, we present a methodology for high-throughput calculation of LTC across large datasets of compounds sharing a common crystal symmetry. Our approach combines fine-tuning of the MatterSim 1M universal machine-learned interatomic potential with LTC calculations based on the solution of the Boltzmann transport equation. We introduce a symmetry-based few-shot fine-tuning strategy (SBFS-FT) based on low-rank adaptation. In this approach, MatterSim 1M is fine-tuned on a small, carefully selected set of compounds that share a common crystal symmetry. The resulting potential is then applicable for accurate LTC calculations for compounds with this crystal symmetry, even if they were not included in the fine-tuning set. We tested our methodology on datasets of half-Heusler compounds (space group 216), materials with space group 225, and spinels (space group 227). We demonstrated that LTC calculations with MatterSim 1M fine-tuned using SBFS-FT exhibited a mean absolute relative difference from the reference results (obtained using moment tensor potentials and polyMLPs) 2-3 times smaller than that achieved with the non-fine-tuned MatterSim 1M potential. Moreover, the accuracy of LTC calculations with MatterSim 1M after SBFS-FT was comparable to that achieved using the MatterSim 1M potentials individually fine-tuned for each compound. Importantly, SBFS-FT enabled generation of the potential suitable for accurate LTC calculations across large compound datasets substantially faster than fine-tuning of MatterSim 1M for each compound individually, reducing the computational time by approximately a factor of 5-7 for a dataset of 100 compounds.","au":["Rustam Arabov","Konstantin Sozykin","Nikita Rybin","Alexander Shapeev"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29634","p":"2026-10-21","d":"2026-10-26","s":7.7,"tp":["mlip"],"kw":["machine-learned interatomic potential","interatomic potential","fine-tuning","mattersim"],"src":["arxiv"],"kind":"preprint","ax":"2610.29634","doi":"","who":[],"tz":"基于对称性的参数高效低秩微调用于晶格热导率高通量计算","az":"准确且高效地预测晶格热导率（LTC）对于开发热电、微电子和光伏应用材料至关重要。在此，我们提出了一种方法，用于对共享共同晶体对称性的大规模化合物数据集进行晶格热导率的高通量计算。我们的方法将 MatterSim 1M 通用机器学习原子间势的微调与基于玻尔兹曼输运方程求解的晶格热导率计算相结合。我们提出了一种基于低秩适配的对称性少样本微调策略（SBFS-FT）。在该方法中，MatterSim 1M 在一组经过精心挑选的、共享共同晶体对称性的少量化合物上进行微调。所得到的势函数可应用于具有该晶体对称性的化合物的精确晶格热导率计算，即使这些化合物未包含在微调集中。我们在半赫斯勒化合物（空间群 216）、空间群 225 的材料以及尖晶石（空间群 227）的数据集上测试了该方法。我们证明，使用 SBFS-FT 微调后的 MatterSim 1M 进行晶格热导率计算，其相对于参考结果（使用矩张量势和 polyMLP 获得）的平均绝对相对偏差比未微调的 MatterSim 1M 势小 2 至 3 倍。此外，SBFS-FT 微调后 MatterSim 1M 的晶格热导率计算精度与对每个化合物单独微调 MatterSim 1M 势所达到的精度相当。重要的是，与对每个化合物单独微调 MatterSim 1M 相比，SBFS-FT 能够显著更快地生成适用于大规模化合物数据集精确晶格热导率计算的势函数，对于 100 个化合物的数据集，计算时间减少了约 5 至 7 倍。","rv":"SBFS-FT 基于对称性对 MatterSim 1M 原子间势做低秩适配少样本微调，用共享对称性的少量化合物微调通用势，实现晶格热导率高通量计算，精度接近逐化合物微调，计算时间减少约 5 至 7 倍。属材料计算与机器学习势领域，与「有机分子晶体/生成模型/视觉生成」关系弱，最接近「相关数学」中低秩适配，核心为凝聚态热输运。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.31183","t":"Unconstrained learning of equivariant atomistic properties","a":"Machine-learned interatomic potentials based on graph neural networks (GNNs) have made first-principles accuracy routine for the potential energy surface (PES). Their backbones, often O(3)-equivariant by design, are increasingly used to learn other atomistic properties. Many of these are of high angular order or pseudotensorial character, defined per atom, or expanded on large atom-centered basis sets. Such targets strain equivariant GNNs, whose tensor products grow steeply in cost with angular order and can fail to represent the target if truncated, forcing difficult trade-offs between hyperparameters. Unconstrained models like the Point-Edge Transformer (PET) instead replace explicit O(3) algebra with edge-to-edge attention and learn equivariance from data, so that the same backbone can in principle learn any equivariant property. We demonstrate how to use PET to learn molecular dipoles and polarizabilities, NMR chemical shielding tensors, and auxiliary-basis expansions of the electron density. Increasing the backbone size systematically improves both accuracy and equivariance error, and targeted architectural and training choices reduce the symmetry breaking further. PET matches or improves on the released reference models at lower inference cost and, compared with equivariant models, a smaller memory footprint. The predictions give accurate IR and Raman spectra and isotropic shieldings; the predicted densities accelerate self-consistent field calculations and give one-shot ground-state properties, and pretrained density models transfer to higher levels of theory by fine-tuning on little data. The impact of approximate equivariance is small for most observables, further validating this approach to train fast, accurate, and useful surrogate models for properties beyond the PES.","au":["Joseph W. Abbott","Paolo Pegolo","Pol Febrer","Michelangelo Domina","Sandra Saade","Matthias Kellner","Filippo Bigi","Philip Loche","Michele Ceriotti"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31183","p":"2026-10-22","d":"2026-10-26","s":7.5,"tp":["mlip"],"kw":["potential energy surface","equivariant"],"src":["arxiv"],"kind":"preprint","ax":"2610.31183","doi":"10.48550/arxiv.2610.31183","who":["Michele Ceriotti"],"tz":"无约束学习等变原子性质","az":"基于图神经网络（GNN）的机器学习原子间势已使势能面（PES）达到第一性原理精度成为常规操作。其骨干网络通常在设计上具有O(3)等变性，正被越来越多地用于学习其他原子性质。其中许多性质具有高角阶或伪张量特征，按原子定义，或在大型原子中心基组上展开。这类目标对等变GNN构成压力，因为其张量积的计算成本随角阶急剧增长，且截断后可能无法表示目标，迫使在超参数之间做出艰难的权衡。以Point-Edge Transformer（PET）为代表的无约束模型则用边到边注意力替代显式O(3)代数，从数据中学习等变性，使得同一骨干网络原则上可以学习任何等变性质。我们展示了如何用PET学习分子偶极矩和极化率、NMR化学屏蔽张量以及电子密度的辅助基展开。增大骨干网络规模可系统性地同时提升精度和降低等变误差，针对性的架构与训练选择可进一步减少对称性破缺。PET在更低的推理成本下匹配或超越了已发布的参考模型，且与等变模型相比内存占用更小。预测结果可给出精确的红外和拉曼光谱及各向同性屏蔽值；预测密度可加速自洽场计算并一次性给出基态性质，预训练密度模型通过少量数据微调即可迁移到更高理论水平。近似等变对大多数可观测量的影响很小，进一步验证了该方法在训练快速、精确且实用的PES以外性质代理模型方面的有效性。","rv":"本文以Point-Edge Transformer（PET）替代显式O(3)等变代数，用边到边注意力从数据学习等变性，预测分子偶极矩、极化率、NMR屏蔽张量及电子密度展开。推理成本与内存占用低于等变模型，预测密度可加速自洽场计算。与「相关数学」中群表示、等变张量积有交叉，主体属计算化学分子性质代理模型，与有机分子晶体、生成模型、视觉生成关系较弱。","tr":"high","tw":"作者：Michele Ceriotti","why":""},{"k":"doi:10.1021/jacs.6c15227","t":"Mechanistic Insights of Jahn–Teller Effect Suppression in High-Entropy Prussian Blue Analogue Cathodes","a":"The Jahn–Teller (J-T) effect, as discovered by Hermann Jahn and Edward Teller in 1937, often causes lattice distortion and structural instability in Mn-based battery materials. Recent studies suggest that high-entropy design may help suppress J-T distortion, yet the underlying mechanism remains largely elusive due to their compositional complexity and structural disorder. Herein, using a Mn-based Prussian blue analogue as a case study, we employed a machine learning interatomic potential combined with synchrotron extended X-ray absorption fine structure spectroscopy (EXAFS) to elucidate the fundamental mechanism of the J-T suppression in high-entropy materials. Unexpectedly, EXAFS spectra reveal the absence of the typical J-T Mn–N bond-length splitting in our high-entropy Prussian blue analogue sample, but instead a broader Mn–N bond-length distribution. Machine learning-assisted calculations demonstrate the [MnN6] octahedra exhibit randomly oriented distortions along x-, y-, and z-axes in high-entropy lattices, resulting in the local distortion averaging out at the macroscopic scale. Further analysis of the local Mn coordination environment reveals that the high-entropy configuration enhances d-electron delocalization and reduces the energy splitting between Mn dx2–y2 and dz2 orbitals. This allows two structurally and electronically distinct distortion modes to coexist within the lattice, which disrupts long-range cooperative J-T order. Strikingly, the ultralong cycling stability of high-entropy K0.46[Mn0.21Co0.19Ni0.21Cu0.20Zn0.19][Fe(CN)6]0.98·1.69H2O is experimentally demonstrated, achieving 91.0% capacity retention over 50,000 cycles for aqueous ammonium-ion storage, which surpasses all of the Mn-based rechargeable batteries to date. Our study uncovers the microscopic mechanism of J-T suppression in high-entropy materials and provides an effective strategy for designing durable high-entropy battery electrodes.","au":["Bangjun Wu","Xiaorui Dong","Hongliang Dong","Shuyang Bian","Qiang Liu","Wenbo Zhai","Yi Yu","Yuanhui Ji","Yuping Wu","Jingyang Wang"],"v":"Journal of the American Chemical Society","u":"https://doi.org/10.1021/jacs.6c15227","p":"2026-10-23","d":"2026-10-26","s":7.1,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex","crossref"],"kind":"paper","ax":"","doi":"10.1021/jacs.6c15227","who":[],"tz":"高熵普鲁士蓝类似物正极中Jahn–Teller效应抑制的机理研究","az":"Jahn–Teller（J-T）效应由Hermann Jahn和Edward Teller于1937年发现，常在锰基电池材料中引起晶格畸变和结构不稳定性。近期研究表明高熵设计可能有助于抑制J-T畸变，但由于其成分复杂性和结构无序性，其内在机理在很大程度上仍不清楚。本文以锰基普鲁士蓝类似物为案例，采用机器学习原子间势结合同步辐射扩展X射线吸收精细结构光谱（EXAFS），阐明了高熵材料中J-T抑制的基本机理。出乎意料的是，EXAFS光谱显示我们的高熵普鲁士蓝类似物样品中不存在典型的J-T Mn–N键长分裂，而是呈现出更宽的Mn–N键长分布。机器学习辅助计算表明，[MnN6]八面体在高熵晶格中沿x、y、z轴呈现随机取向的畸变，导致局部畸变在宏观尺度上相互抵消。对Mn局部配位环境的进一步分析揭示，高熵构型增强了d电子离域化，并减小了Mn dx2–y2和dz2轨道之间的能量分裂。这使得两种在结构和电子上截然不同的畸变模式能够在晶格中共存，从而破坏了长程协同J-T有序。引人注目的是，高熵K0.46[Mn0.21Co0.19Ni0.21Cu0.20Zn0.19][Fe(CN)6]0.98·1.69H2O的超长循环稳定性得到了实验验证，在水性铵离子存储中实现了50,000次循环后91.0%的容量保持率，超越了迄今为止所有锰基可充电电池。本研究揭示了高熵材料中J-T抑制的微观机理，并为设计耐用的高熵电池电极提供了有效策略。","rv":"本文以锰基高熵普鲁士蓝类似物为对象，结合机器学习原子间势与同步辐射EXAFS光谱，揭示Jahn–Teller效应在高熵晶格中被抑制的微观机理：局部八面体畸变随机取向、d电子离域增强、长程协同有序被破坏。属无机电池材料研究，与「有机分子晶体/生成模型/视觉生成/相关数学」四类均关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1016/j.apsusc.2026.168654","t":"Atomic-scale mechanisms of SiO2 plasma-enhanced chemical vapor deposition revealed by molecular dynamics with a machine-learning interatomic potential","a":"","au":["Jaehoon Kim","Minseok Moon","Hyunsung Cho","Kim Hyeon‐Deuk","Rokyeon Kim","Gyehyun Park","Seungwu Han","Youngho Kang"],"v":"Applied Surface Science","u":"https://doi.org/10.1016/j.apsusc.2026.168654","p":"2026-10-21","d":"2026-10-26","s":6.1,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.apsusc.2026.168654","who":[],"tz":"基于机器学习原子间势的分子动力学揭示SiO2等离子体增强化学气相沉积的原子尺度机制","az":"","rv":"本文以SiO2等离子体增强化学气相沉积（PECVD）为对象，采用机器学习原子间势（ML-IAP）驱动的分子动力学模拟，揭示沉积过程的原子尺度机制。研究属于计算材料科学与表面物理范畴，与「有机分子晶体」「生成模型」「视觉生成」「相关数学」均无直接关联，关系较弱。","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.32905","t":"Combining Simulations and Spectroscopy to Design Protective Coatings on Sulfide Solid Electrolytes","a":"Sulfide solid electrolytes are attractive for all-solid-state batteries because of their high Li-ion conductivity and favorable processability, but their practical use is limited by electrochemical instability and moisture-induced degradation. Molecular surface coatings offer a scalable strategy to improve humidity tolerance and interfacial stability, yet there is limited understanding of the molecular-level factors governing surface interactions. By combining large-scale atomistic simulations enabled by a machine-learning potential with targeted experiments, we present a comprehensive framework for designing molecular coatings on Li$_6$PS$_5$Cl (LPSCl). Using a PET-MAD interatomic potential fine-tuned on an r$^2$SCAN reference dataset covering LPSCl surfaces, molecular adsorbates, and their interactions, we model surface adsorption of carboxylic (CA), sulfonic (SA), and phosphonic (PA) acids with alkyl chains of varying lengths and the interaction of these coated surfaces with water at finite temperature. The simulations show that lithiated head groups generally exhibit more favorable adsorption energies. Impedance spectroscopy shows that the lithiated coatings maintain 40--55\\% of the initial ionic conductivity after powder processing. While adsorption strength is largely controlled by head-group chemistry and lithiation state, coating morphology depends primarily on alkyl-chain length and surface coverage. In particular, long-chain lithiated carboxylates form dense, brush-like hydrophobic layers that reduce water access to reactive Li surface sites, with protection setting in at a coating thickness of approximately 0.8 nm. Consistent with these predictions, longer carboxylate chains suppress H$_2$S evolution more effectively. Because thicker coatings also hinder Li-ion transport, intermediate chain lengths offer the best balance between moisture protection and ionic conductivity.","au":["Zhiyi Wang","Leonie Braks","Michele Ceriotti","Ali Coskun","Hanna Türk","Davide Tisi"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32905","p":"2026-10-23","d":"2026-10-26","s":5.6,"tp":["mlip"],"kw":["interatomic potential"],"src":["arxiv"],"kind":"preprint","ax":"2610.32905","doi":"","who":["Michele Ceriotti"],"tz":"结合模拟与光谱设计硫化物固体电解质保护涂层","az":"硫化物固体电解质因其高锂离子电导率和良好的可加工性而在全固态电池中颇具吸引力，但其实际应用受到电化学不稳定性和水分诱导降解的限制。分子表面涂层为提高耐湿性和界面稳定性提供了一种可扩展的策略，但对控制表面相互作用的分子层面因素的理解仍然有限。通过将机器学习势函数驱动的大规模原子模拟与针对性实验相结合，我们提出了一个在 Li$_6$PS$_5$Cl（LPSCl）上设计分子涂层的综合框架。利用在覆盖 LPSCl 表面、分子吸附质及其相互作用的 r$^2$SCAN 参考数据集上微调的 PET-MAD 原子间势函数，我们模拟了具有不同长度烷基链的羧酸（CA）、磺酸（SA）和膦酸（PA）的表面吸附，以及这些涂层表面在有限温度下与水的相互作用。模拟表明，锂化头基通常表现出更有利的吸附能。阻抗谱显示，锂化涂层在粉末加工后保持了初始离子电导率的 40–55%。虽然吸附强度主要受头基化学和锂化状态控制，但涂层形貌主要取决于烷基链长度和表面覆盖率。特别是，长链锂化羧酸盐形成致密的刷状疏水层，减少了水对活性锂表面位点的接触，保护效应在涂层厚度约为 0.8 nm 时开始显现。与这些预测一致，更长的羧酸盐链能更有效地抑制 H$_2$S 的释放。由于较厚的涂层也会阻碍锂离子传输，中等链长在耐湿保护和离子电导率之间提供了最佳平衡。","rv":"用机器学习势（PET-MAD）驱动的大规模原子模拟结合阻抗谱实验，研究硫化物固体电解质 LPSCl 表面分子涂层的设计。对象是有机小分子（羧酸、磺酸、膦酸）在无机晶体表面的吸附与成膜，与「有机分子晶体」有弱关联（涉及有机分子在晶体表面吸附），但核心是电池界面工程，与生成模型、视觉生成、相关数学关系较弱。","tr":"high","tw":"作者：Michele Ceriotti","why":""},{"k":"doi:10.26434/chemrxiv.15010773/v1","t":"Mechanical versus thermal amorphization of ZIF-4: from local rearrangements to network disorder","a":"There is mounting evidence that different amorphization routes can produce metalorganic framework (MOF) glasses with distinct structures and properties, yet the microscopic origins of these differences remain difficult to establish experimentally. Focusing on the two main synthesis methods, which are melt-quenching and ball-milling, we use molecular dynamics simulations with a machine-learning interatomic potential to compare different glasses obtained from ZIF-4. While both routes largely preserve tetrahedral zinc coordination, mechanical deformation generally produces more distorted local environments, showing that average coordination numbers alone do not capture the structural differences between these glasses. At smaller applied strain, mechanical glasses retain substantial memory of the crystalline network topology, despite pronounced changes in ring geometry. Larger strains erase this topological memory, yielding ring-size distributions similar to those of melt-quenched glasses, while differences in local geometry and porosity persist. Simulations of larger systems reveal a heterogeneous amorphization mechanism, involving the formation and growth of disordered domains. These findings from in silico amorphization support process-dependent polyamorphism in ZIF glasses and identify local geometry, topological memory, and spatial heterogeneity as complementary features needed to characterize their structure and understand the influence of mechanical processing.","au":["Léna Triestram","François‐Xavier Coudert"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010773/v1","p":"2026-10-21","d":"2026-10-26","s":4.9,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010773/v1","who":[],"tz":"ZIF-4 的机械非晶化与热非晶化：从局部重排到网络无序","az":"越来越多的证据表明，不同的非晶化途径可以产生具有不同结构和性质的金属有机框架（MOF）玻璃，但这些差异的微观起源在实验上仍难以确定。聚焦于两种主要合成方法——熔体急冷和球磨，我们使用基于机器学习原子间势的分子动力学模拟来比较从 ZIF-4 获得的不同玻璃。虽然两种途径在很大程度上都保留了四面体锌配位，但机械变形通常产生更扭曲的局部环境，表明仅凭平均配位数无法捕捉这些玻璃之间的结构差异。在较小的施加应变下，机械玻璃尽管环几何发生了显著变化，但仍保留了对晶体网络拓扑的大量记忆。较大的应变会抹去这种拓扑记忆，产生与熔体急冷玻璃相似的环尺寸分布，而局部几何和孔隙率的差异仍然存在。更大体系的模拟揭示了一种非均匀的非晶化机制，涉及无序畴的形成和生长。这些来自计算机模拟非晶化的发现支持了 ZIF 玻璃中依赖于工艺的多非晶态现象，并指出局部几何、拓扑记忆和空间异质性是表征其结构和理解机械加工影响所需的互补特征。","rv":"对象为 ZIF-4 金属有机框架玻璃，采用机器学习原子间势驱动分子动力学模拟，对比熔体急冷与球磨两条非晶化路径下局部配位、环拓扑与孔隙率的差异。与「有机分子晶体」有一定关联（涉及晶态到非晶态转变），但核心是 MOF 玻璃结构表征，与生成模型、视觉生成及相关数学关系较弱。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.1063/5.0350682","t":"Microscopic origin of polytype-dependent melting in SiC revealed by machine-learning molecular dynamics","a":"Predicting how crystal structure influences high-temperature stability remains a key challenge in materials modeling and design. Silicon carbide (SiC), one of the most thermally and chemically stable materials known, provides an ideal system for studying this problem because its many polytypes preserve similar local tetrahedral bonding while differing in long-range stacking geometry. To determine the impact of polytype structure on the high-temperature stability of SiC, we combine phase-coexistence machine-learning molecular dynamics with finite-temperature phonon analysis, enabled by a fine-tuned MACE interatomic potential that accurately describes crystalline, high-temperature, and disordered configurations across multiple SiC polytypes. We identify a clear stability ordering, 3C > 2H > 9R, reflected consistently in structural disordering, interlayer sliding, and finite-temperature phonon spectra. Across all polytypes, melting initiates through the formation of short C-C contacts and carbon-rich local regions, followed by a progressive loss of tetrahedral Si-C connectivity. The reduced stability of the long-period 9R polytype is associated with a denser manifold of low-frequency transverse-acoustic modes arising from its stacking periodicity and associated zone folding, which broaden and soften further at high temperature. These modes can provide additional low-energy channels for thermally activated lateral bilayer motion, consistent with the larger sliding amplitudes observed in 9R and their positive correlation with local structural disorder.","au":["Ljiljana Stojanović","S. J. Magorrian","Lara Kabalan","R.N. White","Fabian L. Thiemann","Viktor Zólyomi"],"v":"The Journal of Chemical Physics","u":"https://doi.org/10.1063/5.0350682","p":"2026-10-19","d":"2026-10-26","s":4.8,"tp":["mlip"],"kw":["interatomic potential","mace"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1063/5.0350682","who":[],"tz":"机器学习分子动力学揭示碳化硅多型依赖熔化的微观起源","az":"预测晶体结构如何影响高温稳定性仍然是材料建模与设计中的关键挑战。碳化硅（SiC）是已知热稳定性和化学稳定性最高的材料之一，为研究这一问题提供了理想体系，因为其众多多型体保持了相似的局部四面体键合，但在长程堆垛几何上存在差异。为确定多型结构对碳化硅高温稳定性的影响，我们将相共存机器学习分子动力学与有限温度声子分析相结合，借助一个经过微调的 MACE 原子间势，该势能够准确描述多种碳化硅多型体中晶态、高温及无序构型。我们识别出明确的稳定性排序 3C > 2H > 9R，该排序在结构无序化、层间滑移和有限温度声子谱中均得到一致反映。在所有多型体中，熔化均始于短 C-C 接触和富碳局部区域的形成，随后是四面体 Si-C 连接性的逐步丧失。长周期 9R 多型体稳定性的降低与其堆垛周期性及相关布里渊区折叠所产生的一组更密集的低温横声学模有关，这些模在高温下进一步展宽和软化。这些模可以为热激活的横向双层运动提供额外的低能通道，这与在 9R 中观察到的更大滑移幅度及其与局部结构无序的正相关性一致。","rv":"采用微调 MACE 势的相共存机器学习分子动力学，结合有限温度声子分析，揭示碳化硅 3C、2H、9R 多型体的高温熔化微观机制与稳定性排序。对象为无机半导体晶体，方法属机器学习力场原子模拟，与「有机分子晶体」在晶体多型与熔化行为上有一定关联，但与「生成模型」「视觉生成」「相关数学」关系较弱。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.26434/chemrxiv.15010965/v1","t":"Spontaneous defect formation as the origin of superionic transitions in antifluorite-type structures","a":"Solid-state electrolytes offer the possibility of safer and higher energy density batteries, yet only a limited number of materials achieve ionic conductivities suitable for practical applications. Type-II superionic conductors, which undergo continuous temperature-driven transitions between low and high ionic conductivity regimes are strong candidates for high-performance solid state electrolytes, but the transition mechanism is not sufficiently understood. In this study, we investigate the archetypical superionic conductors Li2O and Li2S with the antifluorite structure using long-time-scale molecular dynamics simulations with an Allegro machine-learning force field (MLFF) trained on density functional theory data selected using an on-the-fly active learning procedure. To this end, superionic transitions are identified around 1450 K for Li2O and around 1100 K for Li2S through continuous peaks in the heat capacity. Diffusion coefficients and concentration of Frenkel defects are found to exhibit strong non-Arrhenius behavior coinciding with the superionic transition where both diffusion activation energy and defect formation energy decrease significantly across the transition. This suggests a self-enhanced spontaneous defect formation mechanism, which drives the superionic transition and promotes increased ionic diffusion. These results identifies the microscopic origin of type-II superionic behavior as a result of correlated defect formation and support the design of improved solid-state electrolytes.","au":["Timothée Jamin","Kasper Tolborg"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010965/v1","p":"2026-10-23","d":"2026-10-26","s":4.6,"tp":["mlip"],"kw":["density functional theory","active learning","allegro"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010965/v1","who":[],"tz":"反萤石型结构中自发缺陷形成作为超离子转变的起源","az":"固态电解质为更安全、更高能量密度的电池提供了可能，但只有少数材料能达到适用于实际应用的离子电导率。II型超离子导体在低离子电导率区和高离子电导率区之间经历连续的、由温度驱动的相变，是高性能固态电解质的有力候选材料，但其转变机制尚未得到充分理解。在本研究中，我们使用基于密度泛函理论数据训练的Allegro机器学习力场（MLFF）进行长时间尺度分子动力学模拟，该数据通过在线主动学习程序选取，研究了具有反萤石结构的典型超离子导体Li2O和Li2S。为此，通过热容中的连续峰，确定了Li2O在约1450 K、Li2S在约1100 K附近的超离子转变。发现扩散系数和Frenkel缺陷浓度表现出强烈的非Arrhenius行为，与超离子转变相吻合，在转变过程中扩散激活能和缺陷形成能均显著降低。这表明存在一种自增强的自发缺陷形成机制，该机制驱动超离子转变并促进离子扩散的增加。这些结果将II型超离子行为的微观起源确定为关联缺陷形成的结果，并支持改进型固态电解质的设计。","rv":"用Allegro机器学习力场做长时间尺度分子动力学模拟，研究反萤石结构Li2O和Li2S的超离子转变。核心发现是自发Frenkel缺陷形成具有自增强效应，驱动超离子相变。与有机分子晶体关系较弱，与生成模型、视觉生成无直接关联，属于固态离子导体与缺陷物理范畴，数学上涉及非Arrhenius扩散和热容分析。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.26434/chemrxiv.15010957/v1","t":"Factorised Cartesian Atomic Cluster Expansion for Low-Cost Machine-Learning Interatomic Potentials","a":"Machine-learning interatomic potentials can reach the accuracy of density functional theory at a fraction of its cost, but the most accurate equivariant models remain expensive, mainly because of the tensor operations they perform for every pair of neighbouring atoms. We present FACE, a factorised Cartesian atomic cluster expansion that removes this bottleneck. Each neighbour contributes only a small set of radial functions and messages, and all mixing of feature channels is done once per atom, so the cost per neighbour no longer grows with the size of the model. Custom GPU kernels evaluate the remaining steps, and long-range electrostatics, dispersion and short-range repulsion attach through a single interface. We show that the training divergences we encountered originate in how the network weights are scaled, and we introduce a distillation scheme in which an ensemble generates additional, uncertainty-checked training data. On five rMD17 molecules, with identical training budgets and hardware, FACE is about as accurate as a 64-channel MACE model (over three seeds: better on one molecule, within the seed spread on two, 7–14% higher force errors on two), while it is 5.7 times faster at inference (4.9 times at the same cutoff) and needs 3.5–3.9 times less GPU memory. Training costs about the same per step. Distillation lowers the energy and force errors of a single aspirin model by 20% at fixed width, to 2.26 meV and 6.74 meV/Å, close to the published MACE values (2.2 and 6.6), and the distilled model runs stably in molecular dynamics.","au":["Albert Linda"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010957/v1","p":"2026-10-23","d":"2026-10-26","s":4.6,"tp":["mlip"],"kw":["density functional theory","equivariant","mace"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010957/v1","who":[],"tz":"分解笛卡尔原子簇展开用于低成本机器学习原子间势能","az":"机器学习原子间势能以密度泛函理论一小部分的成本达到其精度，但最精确的等变模型仍然昂贵，主要因为它们对每一对邻近原子都执行张量运算。我们提出 FACE，一种分解的笛卡尔原子簇展开，消除了这一瓶颈。每个邻居仅贡献一小组径向函数和消息，所有特征通道的混合每原子仅执行一次，因此每个邻居的成本不再随模型规模增长。自定义 GPU 内核评估剩余步骤，长程静电、色散和短程排斥通过单一接口接入。我们表明所遇到的训练发散源于网络权重的缩放方式，并引入一种蒸馏方案，其中集成模型生成额外的、经不确定性检验的训练数据。在五个 rMD17 分子上，在相同的训练预算和硬件条件下，FACE 的精度与 64 通道 MACE 模型相当（三个随机种子：一个分子上更优，两个分子上在种子波动范围内，两个分子上力误差高 7–14%），同时推理速度快 5.7 倍（相同截断距离下为 4.9 倍），GPU 内存需求减少 3.5–3.9 倍。每步训练成本大致相同。蒸馏在固定宽度下将单个阿司匹林模型的能量和力误差降低 20%，分别降至 2.26 meV 和 6.74 meV/Å，接近已发表的 MACE 数值（2.2 和 6.6），且蒸馏后的模型在分子动力学中运行稳定。","rv":"FACE 是分解的笛卡尔原子簇展开，用于低成本机器学习原子间势能。核心将特征通道混合从每对邻居降为每原子一次，使单邻居成本不再随模型规模增长，并引入集成蒸馏改善训练稳定性。rMD17 分子上精度接近 MACE，推理快约 5.7 倍。与「有机分子晶体」有弱关联（涉及小分子势能），核心属等变原子簇展开的效率优化，与生成模型、视觉生成关系弱。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01270","t":"Can DFT-Trained Neural Network Potentials Reproduce Structure, Solvation, and Water-Exchange Properties in Aqueous Magnesium Solutions?","a":"Magnesium ions play an essential role in many biological processes but remain challenging to model in biomolecular simulations. Despite considerable scientific effort, classical force fields fail to simultaneously reproduce key structural, thermodynamic, and kinetic solution properties, likely due to their inability to explicitly account for quantum many-body effects. Here, we develop and systematically benchmark MACE neural network potentials (NNPs) for aqueous MgCl2 solutions, trained on revPBE-D3/zd and revPBE0-D3/zd density functional theory reference data, and assess their ability to reproduce a broad range of experimental solution properties including the structure of the first hydration shell, diffusion coefficient, activity derivative, water-exchange rate, and mechanism as well as solvation free energy. Both NNPs accurately reproduce the octahedral structure of the first hydration shell, ion-pairing properties, and diffusion coefficients. Combining the NNPs with transition path sampling and other enhanced sampling techniques allows us to capture the rare event of water exchange in the first hydration shell of Mg2+, revealing a dissociative exchange mechanism. Transition interface sampling yields exchange rates within 1 order of magnitude of experiment, representing a substantial improvement over classical dissociative force fields. In contrast, the NNP-derived solvation free energy significantly underestimates the experimental value, revealing a limitation of the present local NNP architecture for describing ion solvation thermodynamics.","au":["Sebastian Falkner","Pablo Montero de Hijes","Christoph Dellago","Nadine Schwierz"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01270","p":"2026-10-24","d":"2026-10-26","s":4.3,"tp":["mlip"],"kw":["density functional theory","mace"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01270","who":[],"tz":"基于DFT训练的神经网络势函数能否再现水溶液中镁离子的结构、溶剂化和水交换性质？","az":"镁离子在许多生物过程中发挥关键作用，但在生物分子模拟中仍难以建模。尽管已有大量科学研究，经典力场仍无法同时再现关键的溶液结构、热力学和动力学性质，这很可能是由于其无法显式考虑量子多体效应。本文开发并系统基准测试了用于水溶液MgCl2的MACE神经网络势函数（NNP），其训练数据来自revPBE-D3/zd和revPBE0-D3/zd密度泛函理论参考数据，并评估了它们再现广泛实验溶液性质的能力，包括第一水合壳层结构、扩散系数、活度导数、水交换速率及机制以及溶剂化自由能。两种NNP均能准确再现第一水合壳层的八面体结构、离子对性质和扩散系数。将NNP与过渡路径采样及其他增强采样技术相结合，使我们能够捕捉Mg2+第一水合壳层中水交换这一稀有事件，揭示了解离型交换机制。过渡界面采样得到的交换速率与实验值相差在1个数量级以内，相较于经典解离型力场是实质性改进。相比之下，NNP推导的溶剂化自由能显著低估了实验值，揭示了当前局部NNP架构在描述离子溶剂化热力学方面的局限性。","rv":"本文用MACE神经网络势函数（基于DFT数据训练）模拟水溶液中Mg2+的结构、扩散和水交换动力学，结合过渡路径采样捕捉稀有交换事件。属于计算化学与分子模拟方向，与「有机分子晶体/生成模型/视觉生成/相关数学」四类均关系较弱，最接近「相关数学」中的统计力学与增强采样方法，但本质是离子溶液模拟。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.29111","t":"SU(2)-Equivariant Spinor Message Passing for Molecular Magnetism","a":"Predicting molecular magnetism often requires electronic-structure calculations with spin-orbit coupling (SOC), which are costly to repeat across many molecules. The underlying electronic states can transform as spinors, yet equivariant surrogates typically use only integer-rank features. Inspired by the spinor nature of these electronic states, we develop eSpinor, an SU(2)-equivariant graph neural network that propagates spinor features. We initialize spinor features from eigenvectors of an approximate SOC Hamiltonian and use gauge-covariant message passing with a gauge-invariant readout to make predictions independent of the arbitrary eigenbasis choice. On cobalt single-molecule magnet candidates, eSpinor improves zero-field-splitting predictions relative to NequIP, including for unseen ligands. For a dysprosium magnetic resonance imaging probe, eSpinor improves real electron-spin correlations over a Hamiltonian-informed baseline despite similar static crystal-field errors and fewer parameters, while accurately predicting low-field nuclear relaxation in water and after transfer to methanol without retraining. Overall, these results demonstrate that SU(2)-equivariant spinor message passing is a useful inductive bias for molecular magnetism. We also find that similar static tensor errors can yield different dynamical errors, motivating model selection based on accuracy for the intended physical observables.","au":["Erh-Wei Sheng","Beom Seok Kang","Yuchao Lin","Danish Khan","Anima Anandkumar"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29111","p":"2026-10-21","d":"2026-10-26","s":3.8,"tp":["mlip"],"kw":["equivariant","nequip"],"src":["arxiv"],"kind":"preprint","ax":"2610.29111","doi":"10.48550/arxiv.2610.29111","who":[],"tz":"用于分子磁性的 SU(2) 等变旋量消息传递","az":"预测分子磁性通常需要包含自旋-轨道耦合（SOC）的电子结构计算，而这些计算在大量分子上重复进行代价高昂。其底层电子态可以按旋量变换，然而等变代理模型通常仅使用整数阶特征。受这些电子态的旋量性质启发，我们开发了 eSpinor，一个传播旋量特征的 SU(2) 等变图神经网络。我们从近似 SOC 哈密顿量的特征向量初始化旋量特征，并使用规范协变消息传递配合规范不变读出，使预测不依赖于任意特征基的选择。在钴单分子磁体候选物上，eSpinor 相较于 NequIP 改进了零场分裂预测，包括对未见配体的预测。对于镝磁共振成像探针，eSpinor 在静态晶体场误差相近且参数更少的情况下，相较于哈密顿量引导的基线改进了真实电子自旋关联，同时准确预测了水中低场核弛豫以及迁移至甲醇后无需重新训练的核弛豫。总体而言，这些结果表明 SU(2) 等变旋量消息传递是分子磁性中一种有用的归纳偏置。我们还发现，相似的静态张量误差可能产生不同的动力学误差，这促使我们基于目标物理观测量上的精度来进行模型选择。","rv":"eSpinor 是 SU(2) 等变图神经网络，以近似自旋-轨道耦合哈密顿量特征向量初始化旋量特征，通过规范协变消息传递与规范不变读出预测零场分裂及电子自旋关联。对象为钴单分子磁体与镝 MRI 探针，属分子磁性与电子结构计算范畴，与有机分子晶体、生成模型、视觉生成关系弱，与群表示论及规范理论有直接关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01498","t":"Δ-HGPR: A Hierarchical Gaussian Process Framework for Active-Learning Δ-Potentials","a":"Δ-learning, which uses machine learning to represent only the difference between a high-accuracy reference and a lower-accuracy base calculator, is a promising route to high-fidelity molecular dynamics (MD) with limited training data, but it has lacked a unified protocol combining hierarchical descriptors with well-defined equilibrium sampling. We propose Δ-HGPR (hierarchical Gaussian process regression for Δ-learning), a framework for learning difference potentials, and its MD instantiation, Δ-HGPR-MD. The framework combines (i) a difference potential written as an additive radial (inverse-distance) term plus a many-body machine-learning correction, determined by a single regularized least-squares fit; (ii) the ensemble force standard deviation as an active-learning indicator with an automatically scaled threshold; and (iii) a difference potential held fixed within each round so that equilibrium NVT sampling is well-defined in both exploration and production. The many-body term of Δ-HGPR-MD uses smooth overlap of atomic positions (SOAP) descriptors with random Fourier features (Δ-HGPR-RFF). On a toy system whose difference potential contains a 1/r contribution beyond the cutoff of the local descriptor, the many-body term alone reproduces none of this force, however many features it is given, whereas the hierarchy recovers 99% of it, with a reach set by the cutoff of its radial term. In MD, the hierarchy reproduces about 80% of the shift of the ion-pair distribution toward the reference, while the many-body term alone leaves it where the base places it.","au":["Takahito Nakajima"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01498","p":"2026-10-24","d":"2026-10-26","s":3.5,"tp":["mlip"],"kw":["active learning"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01498","who":[],"tz":"Δ-HGPR：用于主动学习Δ势的层次化高斯过程框架","az":"Δ-learning，即使用机器学习仅表示高精度参考计算与低精度基础计算器之间的差异，是有限训练数据下实现高保真分子动力学（MD）的一条有前途的路线，但它缺乏一个将层次化描述符与明确定义的平衡采样相结合的统一协议。我们提出了Δ-HGPR（用于Δ学习的层次化高斯过程回归），一个学习差异势的框架，以及其在MD中的实例化Δ-HGPR-MD。该框架结合了：（i）一个差异势，写为加性径向（逆距离）项加上多体机器学习修正，由单次正则化最小二乘拟合确定；（ii）系综力标准差作为主动学习指标，带有自动缩放的阈值；（iii）每轮中保持固定的差异势，使得在探索和生产中平衡NVT采样都是明确定义的。Δ-HGPR-MD的多体项使用平滑原子位置重叠（SOAP）描述符与随机傅里叶特征（Δ-HGPR-RFF）。在一个其差异势包含超出局部描述符截断范围的1/r贡献的玩具系统中，无论给予多少特征，仅多体项都无法再现这些力，而层次结构恢复了其中99%，其作用范围由其径向项的截断决定。在MD中，层次结构再现了离子对分布向参考方向偏移的约80%，而仅多体项则将其留在基础计算器放置的位置。","rv":"Δ-HGPR用层次化高斯过程回归学习Δ-learning差异势，将势分解为径向逆距离项加多体ML修正，以系综力标准差做主动学习，每轮固定势保证NVT采样明确。属计算化学力场学习，与有机分子晶体有一定关联（涉及离子对分布），与生成模型、视觉生成关系弱，与高斯过程回归等数学工具有直接联系。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01251","t":"Microenvironmental pH-Modulated Vitamin B6 Ternary Eutectics for BCS Class IV Drug Delivery","a":"The essence of developing multicomponent solid formulations for drugs with poor physicochemical and pharmacokinetic properties is rapidly evolving to cut short the consumption of resources and time. Quite a few commercially available binary drug formulations in the public domain serve as a prime illustration of the field’s success. However, the design and utilization of ternary or higher-order drug formulations can be more efficacious in terms of enhancing such properties of the drug as well as providing humidity resistance and controlling unexpected phase transitions during drug development. Low-soluble and low-permeable BCS IV class drugs continuously present a barrier by lowering their absorption in the body. Drugs mesalamine (MSA) and acetazolamide (ACZ) from the same BCS class were chosen to enhance properties by introducing the binary and ternary solid formulation approach. Soluble and acceptable co-partners, viz., vitamin B6 (pyridoxine hydrochloride, PRDHCl) and p-Aminobenzoic acid (PABA), were carefully chosen. The grinding of MSA and ACZ with p-aminobenzoic acid (PABA) resulted in a physical mixture (MSA·PABA) and a cocrystal (ACZ·PABA), respectively, due to the mismatch of functional moieties and shape. Interestingly, the addition of PRDHCl to the two binary systems generated two ternary eutectic solids, viz., PRDHCl·MSA·PABA and PRDHCl·ACZ·PABA. The thermal and spectroscopic analyses suggested that PRDHCl·MSA·PABA is a mixture of PRDHCl, MSA and PABA. However, PRDHCl·ACZ·PABA exists as a combination of the cocrystal ACZ·PABA and PRDHCl.","au":["Archita Goswami","Bhargab Patowary","Bipul Sarma"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01251","p":"2026-10-24","d":"2026-10-26","s":3.5,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01251","who":[],"tz":"微环境pH调控的维生素B6三元共晶用于BCS IV类药物递送","az":"开发多组分固体制剂以改善理化性质和药代动力学性质较差的药物的本质正在快速演变，以缩短资源和时间的消耗。公共领域中相当多的市售二元药物制剂是该领域成功的主要例证。然而，三元或更高阶药物制剂的设计和利用在增强药物性质、提供抗湿性以及控制药物开发过程中意外相变方面可能更为有效。低溶解度和低渗透性的BCS IV类药物通过降低其在体内的吸收而持续构成障碍。选择同一BCS类别的药物美沙拉秦（MSA）和乙酰唑胺（ACZ），通过引入二元和三元固体制剂方法来增强其性质。精心选择了可溶且可接受的共组分，即维生素B6（盐酸吡哆醇，PRDHCl）和对氨基苯甲酸（PABA）。由于官能团和形状的不匹配，MSA和ACZ分别与对氨基苯甲酸（PABA）研磨后，分别形成了物理混合物（MSA·PABA）和共晶（ACZ·PABA）。有趣的是，将PRDHCl添加到两个二元体系中，生成了两种三元共晶固体，即PRDHCl·MSA·PABA和PRDHCl·ACZ·PABA。热分析和光谱分析表明，PRDHCl·MSA·PABA是PRDHCl、MSA和PABA的混合物。然而，PRDHCl·ACZ·PABA以共晶ACZ·PABA和PRDHCl的组合形式存在。","rv":"本文针对BCS IV类药物美沙拉秦和乙酰唑胺，引入盐酸吡哆醇与对氨基苯甲酸，通过研磨法构建二元及三元共晶体系，并用热分析和光谱手段表征其组成。属于有机分子晶体与共晶药物递送方向，与生成模型、视觉生成及相关数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.32678","t":"Probing the limits of forward screening and inverse design of crystal materials","a":"Crystal materials are designed either by screening known crystals for a target property or by generating new crystals with that property. Both routes are judged against public databases of known crystals, but these databases name the same crystal differently. Several materials announced as new by recent generative and autonomous discovery campaigns have since proved to be known phases or close variants of them. The limits of both routes remain unmeasured. Here we probe them by matching the crystals of 55 databases by structure into one self-extending database of 14.6 million crystals and 131.8 million property values, each traced to its source. Only 4.5% of its crystal-property pairs carry a value. To fill the empty pairs, we developed CGTNet, an equivariant graph transformer with state-of-the-art accuracy on several tasks of two public benchmarks. Trained on each task, it forms a library of property models whose predictions we release. The reach of forward screening has been underestimated. Known crystals hold tens of thousands of ultra-incompressible candidates without a recorded bulk modulus, and a post hoc audit of synthesis evidence finds among them ReN2, whose bulk modulus was measured at 428 GPa. The novelty claimed for inverse design has been overestimated. At an equal verification budget, a stiffness-conditioned generator returned more stiff hits than screening (100 versus 55), but all contained osmium and 82 repeated recorded compositions. Integrating and completing the databases of known crystals therefore moves the limits of both routes: it widens what screening can reach and sets the reference against which generated crystals are judged new.","au":["Zhilong Song","Zijun Pang","Lixue Cheng"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32678","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["crystal-gen","mlip"],"kw":["inverse design","equivariant"],"src":["arxiv"],"kind":"preprint","ax":"2610.32678","doi":"","who":[],"tz":"探测晶体材料正向筛选与逆向设计的极限","az":"晶体材料的设计要么通过对已知晶体进行目标性质筛选，要么通过生成具有该性质的新晶体来实现。这两条路线都以已知晶体的公开数据库为评判标准，但这些数据库对同一晶体的命名各不相同。近期生成式与自主发现项目所宣布的若干新材料，后来被证明是已知相态或其近变体。这两条路线的极限至今未被测量。本文通过将55个数据库中的晶体按结构匹配，构建了一个包含1460万个晶体和1.318亿个性质值的自扩展数据库，每个条目均可追溯至其来源，以此探测上述极限。其中仅有4.5%的晶体-性质对具有数值。为填补空缺对，我们开发了CGTNet，一种等变图变换器，在两个公开基准的若干任务上达到了最先进的精度。针对每个任务进行训练后，它构成一个性质模型库，我们发布了其预测结果。正向筛选的覆盖范围被低估了。已知晶体中包含数万个未记录体模量的超不可压缩候选材料，事后对合成证据的审计在其中发现了ReN2，其体模量被测量为428 GPa。逆向设计所声称的新颖性被高估了。在相同的验证预算下，刚度条件生成器返回的刚性命中数多于筛选（100对55），但所有结果均含锇，且82个为已记录的重复组成。因此，整合并补全已知晶体数据库能够推动两条路线的极限：它拓宽了筛选所能触及的范围，并确立了用以判定生成晶体是否新颖的参照标准。","rv":"本文整合55个晶体数据库为1460万条结构匹配库，用等变图变换器CGTNet补全缺失性质，进而量化正向筛选与逆向设计的实际边界。核心贡献在晶体材料信息学与性质预测，与「生成模型」有交叉（评估生成器新颖性），但主体是数据库工程与无机晶体筛选，与「有机分子晶体」「视觉生成」「相关数学」关系均较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26701","t":"Challenging Atomistic Foundation Models on Disordered Carbons","a":"Foundation machine-learned interatomic potentials (MLIPs) promise broad transferability, yet their out-of-domain reliability is hard to establish. Here, we use pure and O/H-containing disordered carbon spanning multiple phases, competing hybridisations and porous frameworks to stress-test six popular foundation MLIPs. We first screen all six on density functional theory (DFT) energy and force errors and binding curves, then subject four to melt-quench-anneal molecular dynamics and evaluate the resulting structural observables. Binding curves and O/H-containing trajectories reveal unphysical extrapolation and dynamical failures that low DFT energy and force errors fail to reveal. Of the models tested, MACE-MH-1 is the most consistently robust, with low DFT errors and stable MD. Despite differing architectures, OMAT-based models share structural biases, highlighting the importance of training coverage. All four models generate structures of nanoporous carbon that reproduce the principal experimental and specialised carbon potential signatures. Incorporating O/H leaves short-range order largely unchanged but shifts pore-size distributions towards larger pores. These results emphasise the need for application-specific validation and extend molecular dynamics modelling of nanoporous carbon towards experimentally realistic structures.","au":["Joseph Hart","Samuel G. H. Brookes","Fabian L. Thiemann","Christoph Schran"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26701","p":"2026-10-19","d":"2026-10-26","s":2.6,"tp":["mlip"],"kw":["density functional theory","mace"],"src":["arxiv"],"kind":"preprint","ax":"2610.26701","doi":"","who":[],"tz":"在无序碳上挑战原子级基础模型","az":"基础机器学习原子间势（MLIP）承诺了广泛的迁移能力，但其域外可靠性难以确立。在此，我们使用跨越多个相、竞争性杂化方式和多孔框架的纯碳及含 O/H 无序碳，对六种流行的基础 MLIP 进行压力测试。我们首先基于密度泛函理论（DFT）能量和力误差以及结合曲线对全部六种模型进行筛选，然后对其中四种进行熔体-淬火-退火分子动力学模拟，并评估所得结构可观测量。结合曲线和含 O/H 的轨迹揭示了低 DFT 能量和力误差所无法发现的非物理外推和动力学失效。在所测试的模型中，MACE-MH-1 表现最为一致地稳健，具有低 DFT 误差和稳定的分子动力学模拟。尽管架构不同，基于 OMAT 的模型共享结构偏差，凸显了训练覆盖范围的重要性。所有四种模型生成的纳米多孔碳结构均能再现主要实验特征和专用碳势特征。引入 O/H 后短程有序基本不变，但孔径分布向更大孔径方向偏移。这些结果强调了应用特定验证的必要性，并将纳米多孔碳的分子动力学模拟拓展至实验上更真实的结构。","rv":"用无序碳（多相、竞争杂化、多孔框架）压力测试六种基础 MLIP，先以 DFT 误差和结合曲线筛选，再做熔体-淬火-退火 MD 评估结构可观测量，发现低 DFT 误差掩盖了非物理外推与动力学失效，MACE-MH-1 最稳健。对象为原子间势与分子动力学，与「有机分子晶体」关系弱，与生成模型、视觉生成无关，属计算材料势函数评估。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32341","t":"Flexo-Photoresponses from First Principles","a":"Many functionally important materials, such as silicon, possess high-symmetry crystal structures that forbid even-order nonlinear optical responses, thereby limiting their application in e.g., photonics and optoelectronics. Strain gradients can effectively break symmetries, activating otherwise forbidden optical responses. Although such flexo-photoresponses have attracted considerable interest recently, a comprehensive microscopic theoretical framework is still lacking. Here, we develop a first-principles approach that can systematically evaluate a wide range of flexo-photoresponses in realistic materials. By mapping strain gradients to long-wavelength phonons within the established theory of electron-phonon coupling, our approach captures the nonlocal quantum-mechanical effects of lattice deformations on nonlinear optical responses. Applying the framework to prototypical centrosymmetric materials, including Si, cubic $\\rm SrTiO_3$, and monolayer black phosphorus, we demonstrate that a strain gradients of $10^5\\sim10^6~\\rm m^{-1}$ can induce flexo-second-harmonic generation and flexo-bulk photovoltaic effects comparable to the intrinsic responses of non-centrosymmetric crystals. Our work establishes a rigorous foundation for strain gradient engineering of light-matter interactions, opening new avenues for nanoscale optomechanics, optoelectronics, and beyond.","au":["Zhichao Guo","Hua Wang","Haowei Xu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32341","p":"2026-10-23","d":"2026-10-26","s":0.0,"tp":[],"kw":[],"src":["arxiv"],"kind":"preprint","ax":"2610.32341","doi":"","who":[],"tz":"基于第一性原理的屈光响应","az":"许多具有重要功能特性的材料，如硅，具有高度对称的晶体结构，这些结构禁止偶次非线性光学响应，从而限制了它们在光子学和光电子学等领域的应用。应变梯度可以有效地打破对称性，激活原本被禁止的光学响应。尽管此类屈光响应近年来引起了相当大的关注，但一个全面的微观理论框架仍然缺乏。在此，我们发展了一种第一性原理方法，能够系统地评估真实材料中广泛范围的屈光响应。通过在已建立的电子-声子耦合理论框架内将应变梯度映射为长波长声子，我们的方法捕捉了晶格形变对非线性光学响应的非局域量子力学效应。将该框架应用于典型的中心对称材料，包括硅、立方 SrTiO_3 和单层黑磷，我们证明 10^5 至 10^6 m^{-1} 的应变梯度可以诱导出与中心对称晶体本征响应相当的屈光二次谐波产生和屈光体光伏效应。我们的工作为应变梯度工程化光-物质相互作用建立了严格的基础，为纳米尺度光力学、光电子学及更广泛领域开辟了新途径。","rv":"用第一性原理方法研究应变梯度诱导的屈光响应，将应变梯度映射为长波长声子，在电子-声子耦合框架下计算非线性光学效应。对象为硅、立方 SrTiO_3、单层黑磷等中心对称晶体。与「有机分子晶体」关系弱，与「生成模型」「视觉生成」无关，更偏凝聚态物理中的非线性光学与晶格动力学。","tr":"","tw":"","why":""},{"k":"doi:10.1021/acs.cgd.6c01198","t":"A Calix[4]arene Supramolecular Gel for Pharmaceutical Crystal Growth Enabled by Anion-Induced Conformational Modulation","a":"Two novel calix[4]arene derivatives (compounds 1 and 2), incorporating 1,2,3-triazole and d/l-phenylalanine moieties within the linker, have been prepared. Upon the addition of tetrabutylammonium dihydrogen phosphate (TBAHP) followed by sonication at 42−48 °C for 15 min, compound 1 formed a supramolecular gel in n-butanol, whereas 2 did not undergo gelation under identical conditions. Variable-temperature 1H NMR studies suggest that dihydrogen phosphate induces a conformational change in 1, consistent with modulation of the calix[4]arene framework, thereby exposing additional intermolecular interaction sites that promote supramolecular gel assembly. Rheological measurements demonstrated that both the mechanical stability and the storage modulus of the resulting gel increased with increasing concentrations of the Compound 1/TBAHP system in n-butanol. Although the gel exhibited thixotropic behavior, recovery of the gel structure following shear was relatively slow. Notably, a pharmaceutical salt cocrystal comprising furosemide and its tetrabutylammonium salt was successfully grown within the Compound 1/TBAHP/n-butanol supramolecular gel. Although the same salt cocrystal could also be obtained from a TBAHP/n-butanol solution, crystallization required a higher concentration of furosemide than in the gel system.","au":["Xiuqin Cai","Jonathan W. Steed"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01198","p":"2026-10-23","d":"2026-10-23","s":6.5,"tp":["csp"],"kw":["pharmaceutical crystal","cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01198","who":[],"tz":"阴离子诱导构象调制赋能杯[4]芳烃超分子凝胶用于药物晶体生长","az":"制备了两种新型杯[4]芳烃衍生物（化合物1和2），其连接臂中引入了1,2,3-三唑和d/l-苯丙氨酸基团。在加入四丁基铵二氢磷酸盐（TBAHP）后于42−48 °C超声处理15分钟，化合物1在正丁醇中形成了超分子凝胶，而化合物2在相同条件下未发生凝胶化。变温1H NMR研究表明，二氢磷酸盐诱导化合物1发生构象变化，与杯[4]芳烃骨架的调制一致，从而暴露出额外的分子间相互作用位点，促进超分子凝胶的组装。流变学测量表明，所得凝胶的机械稳定性和储能模量均随正丁醇中化合物1/TBAHP体系浓度的增加而增大。尽管该凝胶表现出触变性，但剪切后凝胶结构的恢复相对较慢。值得注意的是，由呋塞米及其四丁基铵盐组成的药物盐共晶在化合物1/TBAHP/正丁醇超分子凝胶中成功生长。尽管相同的盐共晶也可从TBAHP/正丁醇溶液中获得，但结晶所需的呋塞米浓度高于凝胶体系。","rv":"本文利用阴离子诱导杯[4]芳烃构象变化构建超分子凝胶，并在其中生长呋塞米盐共晶，展示了凝胶作为晶体生长微环境的功能。方法核心是阴离子调控分子构象以暴露相互作用位点，属于超分子化学与晶体生长的交叉。与「有机分子晶体」关系较近，与「生成模型」「视觉生成」「相关数学」关系弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jpcc.6c06133","t":"Improving the Temperature Stability of MgZrNb2O8 through the Synergistic Effect of Ta5 + Substitution and High-Entropy Strategy","a":"High-entropy Mg(ZrHfTiSnGe)0.2(Nb1–xTax)2O8 (x = 0–1) microwave dielectric ceramics were successfully synthesized via a solid-state reaction method. The effects of Ta5+ substitution and high entropy on sintering behavior, crystal structure, and microwave dielectric properties were systematically investigated. XRD confirms that Hf4+, Ti4+, Sn4+, Ge4+, and Ta5+ successfully entered the crystal lattice, forming a single-phase solid solution with a wolframite structure (P2/c space group). SEM images show that grains grow well, the grain size is uniform, and there are few pores. HRTEM images show that the sample has both structural long-range order and local lattice distortion. The dielectric constant (εr) increases with Ta5+ substitution, which is primarily attributed to the higher ionic polarizability of Ta5+ and the cation “under-bonding” effect. The continuous decline in the quality factor (Q × f) value is closely related to the reductions in both relative density and lattice energy. This is further supported by the broadening of the Nb/Ta–O symmetric stretching vibration peak in Raman spectra, indicating enhanced phonon interactions. Most importantly, the temperature coefficient of resonant frequency (τf) improves to −10 ppm/°C, benefiting from the increase in bond energy and the weakening of [AO6] (A = Mg, Zr, Hf, Ti, Sn, and Ge) octahedral distortion.","au":["Yao Sun","Xiaokang Wu","Yuanming Lai","Haizhou Ran","Linqiao Zhang","Lin Xu","Qian Liu","Chongsheng Wu","Yuanxun Li","Li Yue"],"v":"The Journal of Physical Chemistry C","u":"https://doi.org/10.1021/acs.jpcc.6c06133","p":"2026-10-23","d":"2026-10-23","s":5.4,"tp":["csp"],"kw":["crystal structure","lattice energy","space group"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jpcc.6c06133","who":[],"tz":"通过Ta5+取代与高熵策略协同效应提升MgZrNb2O8的温度稳定性","az":"通过固相反应法成功合成了高熵Mg(ZrHfTiSnGe)0.2(Nb1–xTax)2O8（x = 0–1）微波介质陶瓷。系统研究了Ta5+取代和高熵策略对烧结行为、晶体结构及微波介质性能的影响。XRD证实Hf4+、Ti4+、Sn4+、Ge4+和Ta5+成功进入晶格，形成了具有钨锰矿结构（P2/c空间群）的单相固溶体。SEM图像显示晶粒生长良好，晶粒尺寸均匀，气孔较少。HRTEM图像显示样品同时具有结构长程有序性和局部晶格畸变。介电常数（εr）随Ta5+取代而增大，这主要归因于Ta5+较高的离子极化率和阳离子「欠键合」效应。品质因数（Q × f）值的持续下降与相对密度和晶格能量的降低密切相关。拉曼光谱中Nb/Ta–O对称伸缩振动峰的展宽进一步证实了这一点，表明声子相互作用增强。最重要的是，谐振频率温度系数（τf）改善至−10 ppm/°C，这得益于键能的增加以及[AO6]（A = Mg、Zr、Hf、Ti、Sn和Ge）八面体畸变的减弱。","rv":"本文研究高熵钨锰矿结构Mg(ZrHfTiSnGe)0.2(Nb1–xTax)2O8微波介质陶瓷，利用Ta5+取代与高熵策略协同提升谐振频率温度稳定性。属无机功能材料与固体化学领域，与「有机分子晶体 / 生成模型 / 视觉生成 / 相关数学」均无直接关联。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.1021/acs.cgd.6c01015","t":"Multimodal Fusion-Based Prediction and Preparation of Cocrystal: A Case Study of Diosmetin","a":"Cocrystals offer promising approaches for the targeted regulation of raw material properties. Nevertheless, the accurate screening of cocrystal co-formers remains a critical bottleneck in the rational preparation of cocrystals. To address this challenge, a cocrystal prediction model based on multimodal fusion was constructed by integrating molecular descriptors, fingerprints, SMILES strings and molecular graphs to screen potential co-formers. The model incorporates a dynamic attention fusion mechanism and a tailored data-balancing strategy to address unimodal limitations and class imbalance, thereby enhancing classification performance under the present evaluation framework. It demonstrated strong classification performance and outperformed the evaluated unimodal models. Diosmetin was selected as the model compound, and systematic virtual screening identified promising co-formers, leading to the successful synthesis of diosmetin-4,4′-bipyridine and diosmetin-isonicotinamide cocrystals. Structural characterization revealed a 2:1 supramolecular network of diosmetin-4,4′-bipyridine stabilized by O−H···N hydrogen bonds. The two cocrystals showed lower moisture uptake than diosmetin under the tested high-humidity conditions of 40 °C/75% RH and 40 °C/95% RH. This study presents a multimodal fusion strategy for cocrystal prediction and highlights its potential in the rational design of solid forms.","au":["Yunxia Li","Di Xu","Xiaoxiao Liang","Zujin Yang","Shiyuan Liu","Yanbin Jiang"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01015","p":"2026-10-23","d":"2026-10-23","s":4.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01015","who":[],"tz":"基于多模态融合的共晶体预测与制备：以柚皮素为例","az":"共晶体为靶向调控原料性质提供了有前景的途径。然而，共晶共晶组分的准确筛选仍然是共晶体理性制备中的关键瓶颈。为应对这一挑战，研究构建了基于多模态融合的共晶体预测模型，通过整合分子描述符、指纹、SMILES字符串和分子图来筛选潜在共晶组分。该模型引入了动态注意力融合机制和定制的数据平衡策略，以解决单模态局限性和类别不平衡问题，从而在当前评估框架下提升分类性能。该模型展现出强大的分类性能，优于所评估的单模态模型。以柚皮素（Diosmetin）为模型化合物，通过系统性虚拟筛选识别出有前景的共晶组分，并成功合成了柚皮素-4,4′-联吡啶和柚皮素-异烟酰胺共晶体。结构表征揭示柚皮素-4,4′-联吡啶形成由O−H···N氢键稳定的2:1超分子网络。在40 °C/75% RH和40 °C/95% RH的高湿测试条件下，两种共晶体的吸湿量均低于柚皮素。本研究提出了一种用于共晶体预测的多模态融合策略，并凸显了其在固体形态理性设计中的潜力。","rv":"本文以多模态融合（分子描述符、指纹、SMILES、分子图）构建共晶组分筛选分类模型，引入动态注意力融合与数据平衡策略，以柚皮素为案例成功合成两种共晶体并验证吸湿改善。属于有机分子晶体方向，与生成模型、视觉生成及纯数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/jacs.6c10255","t":"Breaking Symmetry Cancellation: Heterovalent Substitution Unlocks Ultrastrong, Phase-Matchable Nonlinearity in Deep-Ultraviolet Tetrahedral Crystals","a":"Deep-ultraviolet (deep-UV) nonlinear optical (NLO) crystals demand a challenging integration of strong second
