<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研雷达 · Research Radar</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --text:#15181e; --muted:#6b7280;
  --line:#e4e7ec; --line-2:#eef0f4; --accent:#4f46e5; --accent-2:#eef2ff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1014; --panel:#15181e; --panel-2:#1a1e26; --text:#e7e9ee; --muted:#98a1b0;
  --line:#252b35; --line-2:#1e232c; --accent:#8b93ff; --accent-2:#20243a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#0e1014; --panel:#15181e; --panel-2:#1a1e26; --text:#e7e9ee; --muted:#98a1b0;
    --line:#252b35; --line-2:#1e232c; --accent:#8b93ff; --accent-2:#20243a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none !important}
.muted{color:var(--muted)}
.spacer{flex:1}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:.02em;white-space:nowrap}
.brand .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:8px 12px 8px 30px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.search .ico{position:absolute;left:10px;top:8px;color:var(--muted);font-size:13px}
.tops{display:flex;gap:6px;align-items:center}
.tops button{padding:7px 11px;border-radius:8px;border:1px solid transparent;color:var(--muted);font-size:13px}
.tops button:hover{background:var(--panel-2);color:var(--text)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;padding:14px 12px 40px;
  border-right:1px solid var(--line);background:var(--panel)}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:18px 6px 8px;font-weight:600}
.viewlist{display:flex;flex-direction:column;gap:1px}
.view{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--text);font-size:13px;width:100%;text-align:left}
.view:hover{background:var(--panel-2)}
.view.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.view .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.view.on .n{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:5px;padding:0 4px}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.on{background:color-mix(in srgb,hsl(var(--h,220) 65% 55%) 16%,transparent);
  border-color:hsl(var(--h,220) 60% 55%);color:hsl(var(--h,220) 55% 42%)}
html[data-theme="dark"] .fchip.on{color:hsl(var(--h,220) 80% 72%)}
.fchip .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,220) 60% 55%)}
.datelist{display:flex;flex-direction:column;gap:1px;max-height:320px;overflow-y:auto}
.date{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:7px;font-size:12.5px;color:var(--muted);width:100%;text-align:left}
.date:hover{background:var(--panel-2);color:var(--text)}
.date.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.date .n{margin-left:auto;font-family:var(--mono);font-size:11px}
.health{margin-top:22px;padding:10px 8px 0;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.health div{display:flex;gap:6px;align-items:center;padding:2px 0}
.health .ok{color:#16a34a}.health .bad{color:#dc2626}

/* ---------- main ---------- */
.main{padding:18px 22px 80px;max-width:1020px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.crumb{font-size:15px;font-weight:650}
.crumb small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.tool{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);font-size:12.5px;color:var(--muted)}
.tool:hover{border-color:var(--accent);color:var(--accent)}
select.tool{appearance:none;padding-right:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* overview + why */
.overview{margin:0 0 12px;padding:12px 16px;border-left:3px solid var(--accent)}
.overview .ovhead{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
.overview p{margin:0;font-size:13.5px;line-height:1.7}
.cwhy{margin-top:8px;font-size:12.5px;color:color-mix(in srgb,var(--accent) 45%,var(--text));
  background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:7px;padding:6px 9px;line-height:1.6}

/* trend */
.trend{margin:6px 0 14px;padding:12px 14px}
.trend-head{display:flex;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.trend-head .mini{margin-left:auto;color:var(--accent);font-size:12px}
.trend-body{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.trow{display:grid;grid-template-columns:74px 1fr 66px;align-items:center;gap:10px;padding:5px 6px;border-radius:8px;text-align:left}
.trow:hover{background:var(--panel-2)}
.trow.on{background:var(--accent-2)}
.tname{font-size:12px;font-weight:600;color:hsl(var(--h,220) 55% 42%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="dark"] .tname{color:hsl(var(--h,220) 80% 70%)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;border-bottom:1px solid var(--line-2)}
.spark .bar{flex:1;background:hsl(var(--h,220) 60% 78%);border-radius:2px 2px 0 0;min-height:2px}
.spark .bar.now{background:hsl(var(--h,220) 60% 52%)}
.tnum{font-family:var(--mono);font-size:12px;text-align:right}
.tnum i{font-style:normal;font-size:10.5px;margin-left:4px}
.tnum .up{color:#16a34a}.tnum .down{color:#dc2626}
.tnum .new{color:var(--accent)}.tnum .flat{color:var(--muted)}

/* cards */
.daybar{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:13px}
.daybar b{font-family:var(--mono)}
.daybar .wd{color:var(--muted)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid hsl(var(--h,220) 55% 65%);
  border-radius:10px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow);transition:border-color .12s}
.card:hover{border-color:var(--line);border-left-color:hsl(var(--h,220) 55% 55%)}
.card.read{opacity:.62}
.card.read:hover{opacity:1}
.card.focus{outline:2px solid var(--accent);outline-offset:1px}
.chead{display:flex;align-items:flex-start;gap:8px}
.ctitle{flex:1;font-weight:600;font-size:14.5px;line-height:1.42}
.ctitle a:hover{color:var(--accent)}
.zh{margin-top:2px;font-weight:500;font-size:13px;color:var(--text)}
.zhabs{color:var(--text)}
.trust{margin-left:4px;font-size:10.5px;padding:1px 5px;border-radius:999px;border:1px solid var(--line)}
.trust.high{color:#15803d;border-color:#86efac}
.trust.mid{color:var(--muted)}
.trust.low{color:#a16207;border-color:#fcd34d}
.icon{width:24px;height:24px;border-radius:6px;color:var(--muted);line-height:1;display:grid;place-items:center;flex:0 0 auto}
.icon:hover{background:var(--panel-2);color:var(--accent)}
.btn-star.on{color:#f59e0b}
.score{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel-2);
  padding:2px 6px;border-radius:6px;flex:0 0 auto;margin-top:2px}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 0;font-size:11.5px;color:var(--muted)}
.chip{padding:1.5px 7px;border-radius:999px;font-size:11px;
  background:color-mix(in srgb,hsl(var(--h,220) 65% 55%) 14%,transparent);
  color:hsl(var(--h,220) 55% 40%);border:1px solid color-mix(in srgb,hsl(var(--h,220) 65% 55%) 28%,transparent)}
html[data-theme="dark"] .chip{color:hsl(var(--h,220) 80% 74%)}
.chip.kind{--h:0;background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.venue{font-style:italic}
.who{color:#7c3aed}
.multi{background:var(--panel-2);padding:1px 6px;border-radius:999px;border:1px solid var(--line)}
.ckw{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ckw span{font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:5px;padding:1px 6px;
  border:1px solid var(--line-2);font-family:var(--mono)}
.cabs{margin-top:7px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .cabs{-webkit-line-clamp:unset;display:block}
.cfoot{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.link{color:var(--muted)}
.link:hover{color:var(--accent)}
.more{border-top:1px dashed var(--line);margin-top:9px;padding-top:8px;font-size:12px;color:var(--muted)}
.mrow{margin:3px 0}
.mrow b{color:var(--text);font-weight:600;margin-right:6px}
textarea.note{width:100%;margin-top:8px;min-height:46px;resize:vertical;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);padding:7px 9px;font-size:12.5px;font-family:inherit;outline:none}
textarea.note:focus{border-color:var(--accent)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:6px}
.morebtn{width:100%;margin:10px 0 0;padding:10px;border-radius:10px;border:1px dashed var(--line);
  color:var(--muted);font-size:12.5px}
.morebtn:hover{border-color:var(--accent);color:var(--accent)}

/* calendar */
.events{margin-top:18px;padding:12px 14px}
.events h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.ev{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.ev b{font-family:var(--mono);color:var(--accent);min-width:44px}
.ev em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}

/* stats */
.stats{margin-top:18px;padding:12px 14px}
.stats h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.stats .grp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.stats .grp b{font-size:11px;color:var(--muted);font-weight:600;width:100%;margin-bottom:2px}
.stats .kv{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line-2);color:var(--muted)}
.stats .kv:hover{border-color:var(--accent);color:var(--accent)}
.stats .kv i{font-style:normal;font-family:var(--mono);font-size:10.5px;margin-left:4px;opacity:.7}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* toast + help */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#111827;color:#fff;
  padding:9px 14px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.help{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:70}
.help .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:420px;width:92%}
.help h4{margin:0 0 10px}
.help table{width:100%;border-collapse:collapse;font-size:12.5px}
.help td{padding:3px 0;color:var(--muted)}
.help td:first-child{width:96px;color:var(--text);font-family:var(--mono)}
.err{position:fixed;left:12px;bottom:12px;right:12px;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;
  padding:10px;border-radius:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;z-index:99}

@media print{
  .sidebar,.tops,.search .ico,.toolbar,#trend,#events,#stats,.cfoot,.icon,.btn-more,.toast,.help{display:none !important}
  .layout{display:block}
  .main{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd;border-left-width:3px}
  body{background:#fff}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-height:none}
  .sidebar>section:last-of-type,.health{grid-column:1/-1}
  .datelist{flex-direction:row;overflow-x:auto;max-height:none}
  .date{white-space:nowrap}
  .trend-body{grid-template-columns:1fr}
  .main{padding:14px 12px 60px}
  .topbar{gap:8px;padding:9px 12px}
  .brand .sub{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">科研雷达 <span class="sub" id="generated"></span></div>
  <div class="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="搜索标题 / 摘要 / 作者 / 期刊 …  按 / 聚焦" autocomplete="off">
  </div>
  <div class="tops">
    <button id="btnTheme" title="深浅色">◐</button>
    <button id="btnHelp" title="快捷键 (?)">?</button>
    <button id="btnExport" title="导出当前列表">导出</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="viewlist" id="views"></nav>

    <section>
      <h3>主题分区</h3>
      <div class="filters" id="topicFilter"></div>
    </section>

    <section>
      <h3>来源</h3>
      <div class="filters" id="sourceFilter"></div>
    </section>

    <section>
      <h3>历史日报</h3>
      <div class="datelist" id="dateList"></div>
    </section>

    <div class="health" id="health"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <select class="tool" id="sort">
        <option value="score">按相关度</option>
        <option value="date">按时间</option>
        <option value="venue">按期刊</option>
        <option value="topic">按主题分区</option>
      </select>
      <button class="tool" id="btnReadAll" title="把当前列表全部标记已读">全部已读</button>
      <button class="tool" id="btnClear">清除筛选</button>
    </div>

    <div class="panel overview" id="overview"></div>
    <div class="panel trend" id="trend"></div>
    <div id="list"></div>
    <div class="panel stats" id="stats"></div>
    <div class="panel events" id="events"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="helpHost"></div>

<script>
const DATA = {"overview":"","generated":"2026-10-27 12:31","today":"2026-10-27","field":"计算化学 / 有机分子晶体，以及生成模型、视觉生成与相关数学","owner":"zhouy","topics":[{"id":"csp","name":"分子晶体结构预测（CSP）与能量图景","short":"CSP","tier":"core","hue":255},{"id":"crystal-gen","name":"生成模型与逆向设计","short":"生成设计","tier":"core","hue":300},{"id":"gen-model","name":"生成模型、新模型与新架构","short":"生成模型","tier":"core","hue":320},{"id":"vision-gen","name":"视觉生成","short":"视觉生成","tier":"core","hue":280},{"id":"gen-math","name":"生成模型相关数学","short":"生成数学","tier":"core","hue":40},{"id":"mlip","name":"机器学习势与通用势函数（MLIP / UMA）","short":"MLIP","tier":"core","hue":190},{"id":"ai4s","name":"AI for Science 方法与自动化","short":"AI4S","tier":"core","hue":215}],"days":[{"d":"2026-10-27","n":12},{"d":"2026-10-26","n":73},{"d":"2026-10-23","n":4},{"d":"2026-10-22","n":3},{"d":"2026-10-21","n":2},{"d":"2026-10-20","n":4}],"items":[{"k":"arxiv:2610.34029","t":"TCSP3.0: Template-Based Crystal Structure Prediction with Coefficient-Preserving Element Substitution and Structural Diversity","a":"Template-based crystal structure prediction (CSP) transfers a known crystal structure to a new composition by element substitution, so its accuracy depends on retrieving suitable templates, mapping elements and ranking the resulting candidates correctly. Auditing the original TCSP2.0 implementation on the T180 benchmark, we found that 469 of its 2,347 selected structures (20%) have the wrong composition, caused by element mappings that ignore stoichiometric coefficients and by sequential text substitution that cascades or corrupts element symbols. We propose TCSP3.0, which enforces coefficient-preserving mappings, substitutes species simultaneously on parsed structures and validates every candidate's composition and cell. It further adds periodic-number retrieval, soft oxidation-state evidence, radius-compatibility scoring, structural deduplication, and ORB-v3 machine-learning-potential relaxation and energy ranking of its candidates, as used by deep generative CSP baselines. TCSP3.0 achieves Top-1 and Top-20 match rates of 72.2% and 90.6% on T180, compared with 28.3% and 45.6% for TCSP2.0, and a Top-20 match rate of 74.0% on a new 800-target benchmark (T800). On T180 it also outperforms PNcsp+ and deep generative models CrystalFlow and MaskGXT (Top-1 72.2% versus at most 63.9%). Even without relaxation, TCSP3.0 reaches 67.8% at Top-1 and 90.6% at Top-20 in a median of 28 s per target on two CPU cores, about ten times faster than CrystalFlow. Paired ten-arm ablations on T180 and T800 show that most of the improvement comes from the correctness fixes; structural deduplication significantly improves the Top-5 match rate, embedding-based retrieval is required for coverage, and the remaining scoring features have small or null effects.","au":["Ying Feng","Jeffrey Hu","Lai Wei","Liang Tao","Madeline Miklos","Dipannoy Das Gupta","Hossein Erfanshekooh","Jianjun Hu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.34029","p":"2026-10-25","d":"2026-10-27","s":8.8,"tp":["csp"],"kw":["crystal structure prediction (csp)","crystal structure prediction","crystal structure"],"src":["arxiv"],"kind":"preprint","ax":"2610.34029","doi":"","who":[],"tz":"TCSP3.0：基于模板的晶体结构预测——保持系数的元素替换与结构多样性","az":"基于模板的晶体结构预测（CSP）通过元素替换将已知晶体结构迁移到新组成，因此其准确性取决于检索合适的模板、正确映射元素以及对生成的候选结构进行正确排序。在 T180 基准上审计原始 TCSP2.0 实现时，我们发现其 2,347 个选定结构中有 469 个（20%）组成错误，原因是元素映射忽略了化学计量系数，以及顺序文本替换会导致元素符号级联或损坏。我们提出 TCSP3.0，该方法强制实施保持系数的映射，在解析后的结构上同时替换物种，并验证每个候选结构的组成和晶胞。它还进一步添加了原子序数检索、软氧化态证据、半径兼容性评分、结构去重，以及 ORB-v3 机器学习势弛豫和能量排序（与深度生成式 CSP 基线方法所用相同）。TCSP3.0 在 T180 上达到 72.2% 和 90.6% 的 Top-1 和 Top-20 匹配率，而 TCSP2.0 仅为 28.3% 和 45.6%，在新的 800 目标基准（T800）上 Top-20 匹配率为 74.0%。在 T180 上，它还优于 PNcsp+ 以及深度生成模型 CrystalFlow 和 MaskGXT（Top-1 为 72.2%，而后者最高为 63.9%）。即使不进行弛豫，TCSP3.0 在两个 CPU 核心上每个目标的中位时间为 28 秒，Top-1 达到 67.8%，Top-20 达到 90.6%，速度约为 CrystalFlow 的十倍。在 T180 和 T800 上进行的配对十臂消融实验表明，大部分改进来自正确性修复；结构去重显著提高了 Top-5 匹配率，基于嵌入的检索对于覆盖率是必需的，而其余评分特征的效果较小或为零。","rv":"针对基于模板的无机晶体结构预测方法 TCSP，修复了元素替换中忽略化学计量系数及文本替换级联损坏的问题，并加入原子序数检索、氧化态证据、半径评分、结构去重和 ORB-v3 机器学习势弛豫。与「生成模型」有间接关联（对比了 CrystalFlow、MaskGXT 等深度生成基线），但本质是模板检索与组合化学修正，与有机分子晶体、视觉生成、相关数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33482","t":"Climate downscaling with likelihood functional flow matching","a":"Decisions about heat, frost and flooding are made locally, yet reanalyses and climate models resolve tens of kilometres. Generative downscalers add kilometre-scale detail with uncertainty, but are tied to a grid, costly to sample and lack a tractable likelihood. Here we introduce CD-FFM, a functional flow-matching model that treats the high-resolution field as a continuous random field that one model can query at any location and resolution. Its velocity acts pointwise, so spatial variability comes from a noise prior fitted to the observed spectrum and every observation has an exact likelihood. Downscaling ERA5 to 1 km daily temperature over Fennoscandia, CD-FFM lowers the continuous ranked probability score by 27-31% against regression and 12-18% against a forty-times larger neural operator in each of three test years, and outperforms a CorrDiff-style diffusion model while sampling about fifty times faster. The same model transfers to precipitation and makes large kilometre-scale ensembles affordable.","au":["Zhi-Song Liu","Helmi Toropainen","Michael Boy"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33482","p":"2026-10-24","d":"2026-10-27","s":5.7,"tp":["gen-model"],"kw":["diffusion model","flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.33482","doi":"","who":[],"tz":"基于似然函数式流匹配的气候降尺度","az":"关于热浪、霜冻和洪水的决策是在地方层面做出的，但再分析数据和气候模型的分辨率仅为数十公里。生成式降尺度方法可以添加带有不确定性的公里级细节，但它们绑定在网格上、采样代价高昂且缺乏可处理的似然函数。本文提出 CD-FFM，一种函数式流匹配模型，将高分辨率场视为连续随机场，单一模型可在任意位置和分辨率处进行查询。其速度场逐点作用，因此空间变异性来自拟合于观测谱的噪声先验，且每个观测值都有精确的似然。将 ERA5 降尺度至芬诺斯坎迪亚地区 1 公里日温度时，CD-FFM 在三个测试年份中，连续排序概率得分较回归方法降低 27-31%，较大四倍的神经算子降低 12-18%，并且在采样速度约为五十倍的情况下优于 CorrDiff 风格的扩散模型。同一模型可迁移至降水降尺度，并使大规模公里级集合预报变得经济可行。","rv":"本文提出 CD-FFM，一种函数式流匹配模型，用于气候场降尺度。它将高分辨率场建模为连续随机场，速度场逐点作用，噪声先验拟合观测谱，从而获得精确似然。方法上属于生成模型（流匹配），对象是气候场降尺度，与「生成模型」类别较近，与有机分子晶体、视觉生成、相关数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33731","t":"How Geometry Shapes Generative Model Evaluation on Riemannian Manifolds","a":"On Riemannian manifolds, generative-model evaluation is geometry-dependent since curvature and dimension jointly determine distances and volume growth. Our framework systematically compares geodesic, ambient, and tangent-space versions of Wasserstein and MMD across different geometries. Using controlled-noise perturbations and Riemannian Flow Matching samples, we study metric agreement, noise sensitivity, and their relation to geometry-induced volume scaling. We find that no metric is uniformly reliable: evaluation distance can affect both measured discrepancies and noise sensitivity, varying across curvature and dimension. Our analysis leads to practical recommendations for reporting evaluation distances, comparing metric types, and calibrating metrics to the geometry of the samples.","au":["Misha Oberski","Valentijn Oldenburg","Xanthos Kekkos","Soham Chaudhuri","Emma Oosterhuis","Floris de Kam","Sagi Schwartz","Alison Pouplin","Federica Valeau"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33731","p":"2026-10-24","d":"2026-10-27","s":5.5,"tp":["gen-model","gen-math"],"kw":["generative model","flow matching","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.33731","doi":"","who":[],"tz":"黎曼流形上几何结构如何塑造生成模型评估","az":"在黎曼流形上，生成模型的评估依赖于几何结构，因为曲率和维度共同决定了距离和体积增长。我们的框架系统地比较了不同几何下 Wasserstein 和 MMD 的测地线版本、环境版本和切空间版本。利用受控噪声扰动和黎曼流形流匹配样本，我们研究了度量一致性、噪声敏感性及其与几何诱导的体积缩放之间的关系。我们发现没有度量是统一可靠的：评估距离可以同时影响所测量的差异和噪声敏感性，且随曲率和维度而变化。我们的分析得出了关于报告评估距离、比较度量类型以及将度量校准到样本几何结构的实用建议。","rv":"本文研究黎曼流形上生成模型评估的几何依赖性，系统比较 Wasserstein 与 MMD 的测地线、环境及切空间版本在曲率和维度变化下的一致性、噪声敏感性与体积缩放关系。方法核心是受控噪声扰动加黎曼流形流匹配样本。与「相关数学」最接近，属黎曼几何与度量空间理论在评估指标校准中的应用，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33460","t":"Semantic-First MixGRPO: Reliable Emotional Image Generation via Temporal Decoupling","a":"Controllable image synthesis should modify visual affect without replacing the objects, layout, or relations specified by a prompt. Existing methods address this tension through conditioning architectures or auxiliary losses, while mixed ordinary differential equation (ODE) and stochastic differential equation (SDE) sampling has mainly been used to accelerate group relative policy optimization (GRPO). We instead study stochastic-window position as an attribute-control variable for flow-based image generation. Using FLUX.1-dev with EmotiCrafter-style valence-arousal conditioning, we compare fixed early, middle, and late four-transition SDE windows, progressive MixGRPO, and full-path Flow-GRPO under matched settings. Because step 0 has the highest noise, our semantic-first schedule uses deterministic ODE sampling at steps 0-19 to establish content, then confines stochastic exploration and policy updates to steps 20-23. Across three seeds, it achieves a CLIPScore of $29.662\\pm0.276$, cross-affect DINO consistency of $80.1\\pm0.9$, and semantic drift of 2.9%, while reducing training cost by 33.5% relative to full-path Flow-GRPO. Full-path stochastic training remains more accurate on valence-arousal targets, revealing a genuine trade-off. Semantic-first nevertheless improves both affect and semantic metrics over progressive scheduling, preserves the principal subject in 95.98% of images at five extreme or neutral targets, and receives the highest semantic-preservation and overall-preference ratings in a 30-participant study. These results identify probability-flow time as a practical graphics control dimension for reliable affective appearance manipulation.","au":["Zhenxuan Wang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33460","p":"2026-10-24","d":"2026-10-27","s":5.2,"tp":["vision-gen","gen-math"],"kw":["image generation","image synthesis","stochastic differential","probability flow"],"src":["arxiv"],"kind":"preprint","ax":"2610.33460","doi":"","who":[],"tz":"语义优先 MixGRPO：通过时间解耦实现可靠的情感图像生成","az":"可控图像合成应在不替换提示词所指定的对象、布局或关系的前提下修改视觉情感。现有方法通过条件架构或辅助损失来解决这一矛盾，而混合常微分方程（ODE）与随机微分方程（SDE）采样则主要用于加速组相对策略优化（GRPO）。我们转而研究随机窗口位置作为基于流的图像生成中的属性控制变量。使用 FLUX.1-dev 配合 EmotiCrafter 风格的效价-唤醒度条件，我们在匹配设置下比较了固定的早期、中期和晚期四过渡 SDE 窗口、渐进式 MixGRPO 以及全路径 Flow-GRPO。由于第 0 步噪声最高，我们的语义优先调度在第 0-19 步使用确定性 ODE 采样以建立内容，然后将随机探索与策略更新限制在第 20-23 步。在三个随机种子下，该方法取得了 29.662±0.276 的 CLIPScore、80.1±0.9 的跨情感 DINO 一致性以及 2.9% 的语义漂移，同时相比全路径 Flow-GRPO 将训练成本降低了 33.5%。全路径随机训练在效价-唤醒度目标上仍然更准确，揭示了一种真实的权衡。尽管如此，语义优先方法在情感指标和语义指标上均优于渐进式调度，在五个极端或中性目标下于 95.98% 的图像中保留了主要主体，并在 30 名参与者的研究中获得了最高的语义保持和整体偏好评分。这些结果将概率流时间确定为可靠情感外观操控的一个实用图形控制维度。","rv":"语义优先 MixGRPO 在基于流的图像生成中将随机窗口位置作为属性控制变量，用早期 ODE 确定性采样建立语义内容、后期 SDE 随机探索操控情感，在 FLUX.1-dev 上实现效价-唤醒度可控的情感图像生成。与「视觉生成」最接近，涉及生成模型采样策略设计，与有机分子晶体及相关数学关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33922","t":"Learning Population Dynamics with Variational Doob-Wasserstein Flow","a":"This paper introduces a novel simulation-free framework for learning unbalanced population dynamics on the Riemannian Wasserstein-Fisher-Rao (WFR) manifold, termed Variational Doob-Wasserstein Flow (VDWF), built upon the theory of the unbalanced mean-field Schrödinger bridge (MFSB). First, by independently learning a geometry model equipped with a data-dependent metric, our model captures the intrinsic geometric structure of population dynamics. Furthermore, leveraging Doob's h-transform, the proposed method incorporates boundary information to improve flow-based trajectory inference. For unbalanced transport, a growth model is employed to learn the dynamics while constructing intermediate mass samples in the WFR space without simulation. Additionally, we analyze the convergence rate of the proposed framework using a uniform Log-Sobolev inequality (LSI). Finally, we validate the proposed approach on multiple real-world datasets, demonstrating competitive performance in learning both balanced and unbalanced population dynamics compared with state-of-the-art methods.","au":["Weizhu Qian"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33922","p":"2026-10-24","d":"2026-10-27","s":4.6,"tp":["gen-math"],"kw":["schrödinger bridge","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.33922","doi":"","who":[],"tz":"基于变分 Doob-Wasserstein 流学习种群动力学","az":"本文提出了一种新颖的无仿真框架，用于在黎曼 Wasserstein-Fisher-Rao（WFR）流形上学习非平衡种群动力学，称为变分 Doob-Wasserstein 流（VDWF），其建立在非平衡平均场 Schrödinger 桥（MFSB）理论之上。首先，通过独立学习一个配备数据依赖度量的几何模型，我们的模型捕捉了种群动力学的内在几何结构。此外，利用 Doob 的 h 变换，所提方法引入边界信息以改进基于流的轨迹推断。对于非平衡传输，采用一个增长模型来学习动力学，同时在 WFR 空间中无需仿真地构造中间质量样本。此外，我们利用一致 Log-Sobolev 不等式（LSI）分析了所提框架的收敛速率。最后，我们在多个真实数据集上验证了所提方法，展示了与最先进方法相比，在学习平衡和非平衡种群动力学方面具有竞争力的性能。","rv":"本文在黎曼 WFR 流形上提出变分 Doob-Wasserstein 流（VDWF），基于非平衡平均场 Schrödinger 桥理论，结合数据依赖几何模型与 Doob h 变换，无需仿真即可学习平衡与非平衡种群动力学，并用一致 Log-Sobolev 不等式分析收敛速率。方法核心为 Wasserstein 几何与最优传输，与「相关数学」最为接近，亦涉及生成模型中的流式轨迹推断，与有机分子晶体及视觉生成无直接关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33811","t":"Rectified Language Flow","a":"Continuous-state flow and diffusion models offer a promising approach to fast, parallel language generation, but matching the generation quality of autoregressive models remains challenging. We present Rectified Language Flow (ReLF), a language model that generates text by transporting noise to token embeddings using rectified flow. ReLF combines several complementary design choices: fixed token embeddings constructed with Hellinger-SVD, self-conditioning guidance trained with cross-entropy, and regularized reflow for few-step generation. We further introduce singular logits, which combine an analytically computed term that drives commitment to a valid token embedding as noise vanishes with a bounded neural residual that learns contextual token preferences. With 64 function evaluations on OpenWebText, ReLF achieves lower generative perplexity than autoregressive baselines at matched diversity across all three model sizes tested, while also outperforming prior continuous flow methods in this setting. After two reflow rounds, ReLF still outperforms autoregressive baselines with 16 function evaluations while generating 1,024-token sequences 15-19 times faster at batch size 1.","au":["Baiyu Su","Runlong Liao","Lizhang Chen","Qiang Liu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33811","p":"2026-10-24","d":"2026-10-27","s":4.2,"tp":["gen-model"],"kw":["rectified flow","autoregressive"],"src":["arxiv"],"kind":"preprint","ax":"2610.33811","doi":"","who":[],"tz":"Rectified Language Flow（整流语言流）","az":"连续状态流模型和扩散模型为快速、并行的语言生成提供了一种有前景的方法，但达到自回归模型的生成质量仍然具有挑战性。我们提出 Rectified Language Flow（ReLF），一种通过整流流将噪声传输到词元嵌入来生成文本的语言模型。ReLF 结合了若干互补的设计选择：使用 Hellinger-SVD 构建的固定词元嵌入、以交叉熵训练的自条件引导，以及用于少步生成的正则化回流。我们进一步引入奇异 logits，它将一个解析计算的项（在噪声消失时驱动模型承诺到有效词元嵌入）与一个有界的神经残差（学习上下文词元偏好）相结合。在 OpenWebText 上以 64 次函数评估，ReLF 在匹配多样性条件下，在所有三个测试模型规模上均实现了比自回归基线更低的生成困惑度，同时在该设定下也优于先前的连续流方法。经过两轮回流后，ReLF 以 16 次函数评估仍优于自回归基线，同时在批大小为 1 时生成 1,024 个词元的序列速度快 15 至 19 倍。","rv":"ReLF 将整流流引入离散语言生成，用连续噪声到词元嵌入的传输替代自回归逐词预测，配合 Hellinger-SVD 固定嵌入、自条件引导与奇异 logits 实现少步采样。方法本质是 flow matching 在语言任务上的移植，与视觉生成中的连续流范式同源，与有机分子晶体或相关数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33589","t":"Mix Forcing: Causal Pre-Training via Mixture Attention for Interactive World Models","a":"While interactive video world models require autoregressive generation, directly adapting pretrained bidirectional video diffusion models into autoregressive ones with teacher forcing can disrupt their visual priors and degrade autoregressive generation quality. In this paper, we introduce Mix Forcing, a causal pre-training paradigm for interactive video world models, implemented with the Mixture-of-Bidirectional-and-Autoregressive (MoBA) attention. Mix Forcing jointly trains a video diffusion model with both teacher forcing and bidirectional training, yielding a strong causal initialization for few-step post-training. In self-attention, Mix Forcing leverages teacher forcing to learn causal next-chunk prediction for autoregressive rollout, while using bidirectional attention to preserve pretrained visual priors. To support online text interaction, Mix Forcing further adopts a chunk-wise cross-attention design that conditions each video chunk on a shared environment prompt and its own local prompt, without exposing future instructions to the current chunk. Following causal pre-training on a 14B image-to-video model, we apply consistency and distribution matching distillation to obtain a four-step autoregressive generator. Experiments on our internal benchmark and public benchmarks, including WBench and SANA-WM-Bench, show that our model achieves state-of-the-art visual quality and timely event following with precise camera control. Notably, our model supports high-fidelity long-horizon generation without quality degradation even over one-hour rollouts. Project page is here: https://zelingao98.github.io/mixforcing","au":["Zelin Gao","Hao Ouyang","Jiapeng Zhu","Qiuyu Wang","Jingye Chen","Zichen Liu","Xing Zhu","Yujun Shen","Yinghao Xu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33589","p":"2026-10-24","d":"2026-10-27","s":4.0,"tp":["gen-model","vision-gen"],"kw":["diffusion model","autoregressive","video diffusion"],"src":["arxiv"],"kind":"preprint","ax":"2610.33589","doi":"","who":[],"tz":"Mix Forcing：面向交互式世界模型的混合注意力因果预训练","az":"交互式视频世界模型需要自回归生成，但直接将预训练的双向视频扩散模型通过教师强制适配为自回归模型，会破坏其视觉先验并降低自回归生成质量。本文提出 Mix Forcing，一种面向交互式视频世界模型的因果预训练范式，采用双向与自回归混合（MoBA）注意力实现。Mix Forcing 同时使用教师强制和双向训练来联合训练视频扩散模型，为少步后训练提供强因果初始化。在自注意力中，Mix Forcing 利用教师强制学习因果的下一块预测以支持自回归展开，同时使用双向注意力保留预训练的视觉先验。为支持在线文本交互，Mix Forcing 进一步采用逐块交叉注意力设计，使每个视频块以共享环境提示词和自身局部提示词为条件，同时不向当前块暴露未来指令。在 14B 图像到视频模型上完成因果预训练后，我们应用一致性蒸馏和分布匹配蒸馏，获得四步自回归生成器。在内部基准和公开基准（包括 WBench 和 SANA-WM-Bench）上的实验表明，该模型实现了最先进的视觉质量、及时的事件跟随以及精确的相机控制。值得注意的是，该模型支持高保真长时程生成，即使在一小时以上的展开中也不出现质量退化。项目页面见：https://zelingao98.github.io/mixforcing","rv":"方法为 Mix Forcing，以 MoBA 注意力混合教师强制与双向训练，对视频扩散模型进行因果预训练，再经一致性蒸馏与分布匹配蒸馏获得四步自回归生成器，实现交互式视频世界模型的长时程高保真生成。与「视觉生成」最接近，属视频扩散及自回归生成方向，与有机分子晶体、分子层面生成模型关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33472","t":"Qwen-Image-PE: Learning Visual Design for Text-to-Image Prompt Enhancement","a":"Learning visual design is essential for prompt enhancement (PE) to turn underspecified user requests into coherent visual specifications for text-to-image (T2I) generation. Existing methods preserve user intent and improve overall visual appeal, with less explicit emphasis on fine-grained design dimensions. To address this gap, we introduce Qwen-Image-PE, which learns visual design through two-stage training. Supervised fine-tuning with Caption-Based Reverse Distillation (CRD) uses dense captions of well-designed images as design supervision. Reinforcement learning with Groupwise Design Reward (GDR) jointly compares all candidate images for the same request to refine lighting, composition, layout, and detail. On Qwen-Image-Bench with Qwen-Image-2.1, Qwen-Image-PE-397B improves over original requests by 7.81 points, while Qwen-Image-PE-9B outperforms all evaluated PE baselines. Further evaluations show gains in visual design, aesthetics, image quality, and human preference. We find that PE scales along three axes: training data, model size, and information density, with sufficient information density as a prerequisite for effective enhancement. Moreover, we demonstrate that Qwen-Image-PE generalizes to four additional T2I backbones, even surpassing native prompt enhancers on HunyuanImage-2.1 and FLUX 3 Image Klein. We release Qwen-Image-PE-9B at https://huggingface.co/Qwen/Qwen-Image-2.1-PE-T2I.","au":["Zekai Zhang","Yanran Zhang","Shengming Yin","Yan Shu","Zhening Liu","Bingxuan Zhao","Chenyang Zhu","Donghao Zhou","Jiahao Li","Jiahao Wang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33472","p":"2026-10-24","d":"2026-10-27","s":3.5,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.33472","doi":"","who":[],"tz":"Qwen-Image-PE：面向文本到图像提示增强的视觉设计学习","az":"学习视觉设计对于提示增强（PE）至关重要，它能够将用户未充分指定的请求转化为用于文本到图像（T2I）生成的连贯视觉规范。现有方法保留了用户意图并提升了整体视觉吸引力，但对细粒度设计维度的强调不够明确。为弥补这一不足，我们提出 Qwen-Image-PE，通过两阶段训练来学习视觉设计。基于密集描述反向蒸馏（CRD）的监督微调利用设计精良图像的密集描述作为设计监督信号。基于分组设计奖励（GDR）的强化学习对同一请求的所有候选图像进行联合比较，以优化光照、构图、布局和细节。在 Qwen-Image-Bench 上使用 Qwen-Image-2.1，Qwen-Image-PE-397B 相比原始请求提升了 7.81 分，而 Qwen-Image-PE-9B 超越了所有已评估的 PE 基线方法。进一步评估表明在视觉设计、美学、图像质量和人类偏好方面均有提升。我们发现 PE 沿三个维度扩展：训练数据、模型规模和信息密度，其中足够的信息密度是有效增强的前提条件。此外，我们证明 Qwen-Image-PE 可泛化到另外四个 T2I 骨干模型，甚至在 HunyuanImage-2.1 和 FLUX 3 Image Klein 上超越了原生提示增强器。我们在 https://huggingface.co/Qwen/Qwen-Image-2.1-PE-T2I 发布了 Qwen-Image-PE-9B。","rv":"本文针对文本到图像生成中的提示增强问题，提出 Qwen-Image-PE，通过 CRD 监督微调与 GDR 强化学习两阶段训练，使模型显式学习光照、构图、布局、细节等细粒度视觉设计维度。属于视觉生成与生成模型方向，与有机分子晶体无直接关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33557","t":"Nowcasting aerosol particle size distributions from PM2.5 with physics-regularized flow matching","a":"The mass concentration of particles smaller than 2.5um (PM2.5) is cheap to measure and widely monitored, whereas the particle number size distribution (PSD) requires costly instruments and is measured at only a few research stations. Yet many aerosol effects, such as vapor uptake, cloud droplet formation and deposition in the human respiratory tract, depend on the PSD rather than on mass. We explore whether recent generative deep learning models can nowcast the PSD: from the PM2.5 record and eight meteorological parameters over a 24h window, a model generates an ensemble of plausible hourly size distributions for the same window, reflecting that one mass can arise from many size distributions. Rather than proposing a single best model, we use two contrasting Finnish stations, the boreal forest site Hyytiälä and the urban site Kumpula, as a controlled testbed. On it, we benchmark six generative models against deterministic and climatological baselines, locally and after transfer between sites, and test physical constraints for neural network training. Flow matching performs best overall; its guided variant has the lowest continuous ranked probability score (CRPS) at both sites. A constraint based on a reduced aerosol general dynamic equation (GDE) lowers the CRPS by 5.5-11.5% at the training site and reduces errors after transfer between sites. Transfer remains harder than local estimation, identifying training on large multi-station data sets as the next step towards PSD estimates at unmonitored locations. This benchmark establishes physics-informed generative models as a promising route from routine air-quality monitoring to size-resolved aerosol information.","au":["Zhi-Song Liu","Jenni Köykkä","Wenqing Peng","Ammar Kheder","Petri Clusius","Michael Boy"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33557","p":"2026-10-24","d":"2026-10-27","s":3.2,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.33557","doi":"","who":[],"tz":"基于物理正则化流匹配的PM2.5气溶胶粒子粒径分布即时预报","az":"粒径小于2.5微米（PM2.5）的粒子质量浓度测量成本低且被广泛监测，而粒子数粒径分布（PSD）需要昂贵仪器，仅在少数研究站进行测量。然而，许多气溶胶效应，如蒸气吸收、云滴形成以及在人体呼吸道的沉积，取决于PSD而非质量。我们探索近期的生成式深度学习模型能否即时预报PSD：基于24小时窗口内的PM2.5记录和八个气象参数，模型为同一窗口生成一组合理的小时级粒径分布集合，反映同一质量可由多种粒径分布产生这一事实。我们并非提出单一最优模型，而是使用两个对比鲜明的芬兰站点——北方针叶林站点Hyytiälä和城市站点Kumpula——作为受控测试平台。在该平台上，我们将六个生成模型与确定性基线和气候学基线进行对比，分别在本地和站点间迁移后评估，并测试用于神经网络训练的物理约束。流匹配（flow matching）整体表现最佳；其引导变体在两个站点均具有最低的连续排序概率得分（CRPS）。基于简化气溶胶一般动力学方程（GDE）的约束在训练站点将CRPS降低5.5%至11.5%，并在站点间迁移后减少误差。迁移仍比本地估计更困难，这指明了在大型多站点数据集上训练是迈向未监测地点PSD估计的下一步。该基准测试确立了物理信息生成模型作为从常规空气质量监测到粒径分辨气溶胶信息的有前景途径。","rv":"用物理正则化流匹配从PM2.5和气象参数即时预报气溶胶粒子数粒径分布，在芬兰两个站点上对比六个生成模型并加入简化GDE约束。属于条件概率生成模型，核心是流匹配框架加物理正则项，与「生成模型」最近，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33599","t":"H-GLow: Accelerating Graph Generation via Hazard-Guided Discrete Flow Matching","a":"Discrete flow matching (DFM) offers a promising approach to graph generation; however, generating high-quality graphs with few steps remains challenging due to the strong dependencies between nodes and edges. Although DFM decouples training from sampling, enabling flexible sampling strategies without retraining, existing graph DFM samplers often rely on task-specific heuristics, substantially expanding the hyperparameter space. Moreover, graph DFM models still require sampling budgets comparable to those of diffusion-based approaches, leaving their potential for accelerating graph generation only partially realized. In this work, we introduce H-Glow, a hazard-guided framework for accelerating graph generation built on the decomposition of Continuous-Time Markov chain (CTMC) generators into hazards and conditional jump distributions. H-Glow leverages these quantities to plan graph edits and dynamically adjust the sampling time to graph activity. H-Glow can be adapted to pretrained graph DFM models, substantially improving the generation quality with fewer steps. We further introduce a novel graph DFM model based on the conditional generator matching framework, which directly predicts hazards and conditional jumps, and show that its training objective decomposes exactly into hazard matching and hazard-weighted jump prediction. Experiments on molecular and synthetic graph benchmarks demonstrate improved generation quality with substantially fewer sampling steps.","au":["Sirine Ayadi","Stephan Günnemann"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33599","p":"2026-10-24","d":"2026-10-27","s":3.2,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.33599","doi":"","who":[],"tz":"H-Glow：基于风险引导离散流匹配的图生成加速","az":"离散流匹配（DFM）为图生成提供了一种有前景的方法；然而，由于节点与边之间存在强依赖关系，用少量步数生成高质量图仍然具有挑战性。尽管 DFM 将训练与采样解耦，使得无需重新训练即可采用灵活的采样策略，但现有的图 DFM 采样器往往依赖任务特定的启发式方法，大幅扩展了超参数空间。此外，图 DFM 模型仍然需要与基于扩散的方法相当的采样预算，使其在加速图生成方面的潜力仅得到部分实现。在本工作中，我们提出了 H-Glow，一个基于连续时间马尔可夫链（CTMC）生成元分解为风险函数和条件跳跃分布的、用于加速图生成的风险引导框架。H-Glow 利用这些量来规划图编辑，并根据图的活动动态调整采样时间。H-Glow 可以适配到预训练的图 DFM 模型上，用更少的步数显著提升生成质量。我们进一步提出了一种基于条件生成元匹配框架的新型图 DFM 模型，该模型直接预测风险函数和条件跳跃，并证明其训练目标可以精确分解为风险匹配和风险加权跳跃预测。在分子和合成图基准上的实验表明，用大幅减少的采样步数实现了更好的生成质量。","rv":"H-Glow 将连续时间马尔可夫链生成元分解为风险函数与条件跳跃分布，据此规划图编辑并动态调整采样时间，适配预训练离散流匹配模型以减少采样步数。属于图生成模型方向，实验涉及分子基准但与有机分子晶体无直接关联，与视觉生成关系弱，与 CTMC 数学结构有一定联系。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.34203","t":"MatOS: An Agent Operating System for Materials Research","a":"Materials research relies on scattered and growing data, knowledge, and simulation tools, and a single study often spans multi-day workflows across literature analysis, computation, and experiment. Large language model agents can now retrieve materials data, operate simulation codes, and close design-synthesis-characterization loops with autonomous laboratories. However, extending these agents with new capabilities, keeping long-running tasks on track, and letting them learn from past tasks and user feedback remain difficult. Here we present MatOS, an agent operating system for materials research with three core components: (1) a layered scientific asset graph that organizes data, knowledge, tools, skills, roles, and workflows as reusable assets; (2) a stateful adaptive workflow that runs tasks as explicit execution graphs with scientific checks, so that they can be resumed and traced; and (3) evidence-driven asset evolution, which revises these assets from execution records and user feedback. On ResearchClawBench, MatOS improves on the previously best-performing agent by 11.15% with the same base model and extends the cost-score Pareto frontier. With a common base model, it outperforms Codex CLI and Claude Code, exceeding Codex CLI by 2.13% on MatTools and 4.17% on SciAgentGym. In eight research cases, MatOS narrowed more than 30 million candidate structures to 97 solid-electrolyte candidates, identified 89 halide variants with higher computed conductivity than their parent structures, linked the force errors of 11 pretrained interatomic potentials to local atomic environments, and supported two new methods that reduce errors by 3.1% and 13.6% relative to their baselines. These results show that organizing research capabilities as reusable, evolving assets enables agents to carry out long, multistage materials studies. Code is available at https://github.com/DingyangLyu/MatOS.","au":["Dingyang Lyu","Jing Gao","Zhonghao Chang","Jingjie Huang","Xiangran Cheng","Xin He","Yongda Huang","Zefeng Li","Jiahui Liu","Jian Wen"],"v":"arXiv","u":"https://arxiv.org/abs/2610.34203","p":"2026-10-25","d":"2026-10-27","s":3.0,"tp":["ai4s"],"kw":["large language model","autonomous","agent"],"src":["arxiv"],"kind":"preprint","ax":"2610.34203","doi":"","who":[],"tz":"MatOS：面向材料研究的智能体操作系统","az":"材料研究依赖于分散且不断增长的数据、知识和模拟工具，且单项研究往往跨越文献分析、计算和实验的多日工作流。大语言模型智能体如今能够检索材料数据、操作模拟代码，并通过自主实验室闭合设计-合成-表征循环。然而，为这些智能体扩展新能力、保持长时间运行任务的轨道、以及让它们从过往任务和用户反馈中学习仍然困难。在此我们提出 MatOS，一个面向材料研究的智能体操作系统，包含三个核心组件：（1）分层科学资产图，将数据、知识、工具、技能、角色和工作流组织为可复用资产；（2）有状态自适应工作流，将任务作为带有科学检查的显式执行图来运行，使其可恢复和可追溯；（3）证据驱动的资产演化，从执行记录和用户反馈中修订这些资产。在 ResearchClawBench 上，MatOS 使用相同基础模型比此前表现最佳的智能体提升 11.15%，并扩展了成本-分数帕累托前沿。使用相同基础模型，它优于 Codex CLI 和 Claude Code，在 MatTools 上超过 Codex CLI 2.13%，在 SciAgentGym 上超过 4.17%。在八个研究案例中，MatOS 将超过 3000 万个候选结构缩小至 97 个固体电解质候选，识别出 89 种计算电导率高于其母体结构的卤化物变体，将 11 个预训练原子间势的力误差与局部原子环境关联，并支持两种新方法，使其误差相对于基线分别降低 3.1% 和 13.6%。这些结果表明，将研究能力组织为可复用、可演化的资产，使智能体能够执行长周期、多阶段的材料研究。代码可在 https://github.com/DingyangLyu/MatOS 获取。","rv":"这篇提出 MatOS，一个面向材料研究的智能体操作系统，核心是分层科学资产图、有状态自适应工作流和证据驱动资产演化。它实际做的是为 LLM 智能体提供可复用、可追溯、可演化的研究能力管理框架，在多个基准上超越现有智能体。与「有机分子晶体/生成模型/视觉生成/相关数学」四类均关系较弱，更偏向材料信息学与智能体系统工程。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.33798","t":"Whispers from the Neighbors: Rethinking Caption Consensus as Inference-Time Evidence for Vision-Language Retrieval","a":"An image is rarely described only once. Retrieval benchmarks and many collections attach several captions to each picture, yet dual encoders still judge every image-caption pair in isolation. We ask what these neighboring captions contribute when a frozen encoder consults them at inference time. Fusing image similarity with similarity to an image's own captions improves text-to-image R@1 by 3.4 to 16.8 points across nine frozen encoders when the captions come from the same annotators as the queries. The gain falls to 1.9 to 7.2 points when an off-the-shelf captioner writes them, and to at most one point when they come from a different annotation source; a paraphrase-trained text encoder strengthens the text side further. A natural refinement, scoring the part of the image that the captions leave unexplained, appears to add much more under a leave-one-out evaluation. We show that this advantage arises because the correct candidate's supports are built differently from those of the negative candidates, with set size and query removal each contributing about half, and that under a fixed support index the residual reduces to a reweighting of what the captions already provide. On compositional benchmarks, the captions help by matching candidates to human descriptions of the image, without improving image-text grounding. The code is available at: https://github.com/nhatkhangcs/clip_consensus","au":["Khang Nhat Hoang Vo","Belal Shoer","Abhirama Subramanyam Penamakuri"],"v":"arXiv","u":"https://arxiv.org/abs/2610.33798","p":"2026-10-24","d":"2026-10-27","s":2.9,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.33798","doi":"","who":[],"tz":"来自邻近者的低语：重新思考描述共识作为视觉-语言检索的推理时证据","az":"一张图片很少只被描述一次。检索基准和许多数据集为每张图片附加多条描述，但双编码器仍然孤立地判断每个图像-描述对。我们探究当冻结编码器在推理时参考这些邻近描述时，它们贡献了什么。当描述来自与查询相同的标注者时，将图像相似度与图像自身描述的相似度融合，在九个冻结编码器上将文到图R@1提高了3.4至16.8个点。当使用现成描述器生成描述时，增益降至1.9至7.2个点；当描述来自不同标注来源时，增益至多一个点；经过释义训练的文编码器进一步增强了文本端。一个自然的改进——对描述未解释的图像部分进行评分——在留一法评估下似乎带来了更多增益。我们表明这种优势源于正确候选的支持集与负候选的支持集构建方式不同，集合大小和查询移除各贡献约一半，并且在固定支持索引下，残差简化为对描述已提供内容的重新加权。在组合性基准上，描述通过匹配候选与人类对图像的描述来提供帮助，而未改善图像-文本对齐。代码可用：https://github.com/nhatkhangcs/clip_consensus","rv":"利用同一图像的多条描述在推理时作为额外证据，将图像相似度与描述相似度融合以改进文到图检索。在九个冻结双编码器上验证，同标注者描述带来3.4至16.8点R@1提升，并分析残差评分优势源于正负候选支持集构建差异。与「视觉生成」中的图文对齐有一定关联，但核心是检索匹配而非生成，关系中等偏弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.59256/indjcst.20260503043","t":"RANANO-Recreating Nano Banana Using Diffusion Model","a":"RANANO is an integrated artificial intelligence-based multimedia creation platform developed to combine multiple creative functionalities within a single web-based interface. The system addresses the fragmented workflow involved in using separate applications for image generation, image enhancement, video creation, animated text generation, and user guidance. RANANO uses a trained diffusion model for text-to-image generation, where the trained model checkpoint is integrated into the application for inference. The platform also incorporates image enhancement using super-resolution, video generation from selected images, animated text generation, and a voice assistant for interactive guidance. The system follows a modular architecture in which the frontend communicates with backend services responsible for model inference, image processing, multimedia generation, and output management. The diffusion model is trained using a prepared dataset, while the trained checkpoint is subsequently loaded during application execution without repeated training. Functional testing was conducted across the major modules, including checkpoint loading, prompt processing, image generation, image enhancement, video generation, animated text, voice interaction, output display and storage, and frontend-backend integration. All twelve test cases documented in the project were successfully passed. The results demonstrate that RANANO provides a unified and modular approach for AI-assisted multimedia creation while reducing the need to switch between multiple tools. The system also provides scope for future improvements in computational efficiency, processing time, and multimedia generation capabilities.","au":["K R Manjushree","S Sakshi","Prakash Jadamali Sanjana","Udaya Vernekar Shreya","Guttal Vinuthana"],"v":"Indian Journal of Computer Science and Technology","u":"https://doi.org/10.59256/indjcst.20260503043","p":"2026-10-22","d":"2026-10-26","s":8.3,"tp":["vision-gen"],"kw":["image generation","video generation","text-to-image"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.59256/indjcst.20260503043","who":[],"tz":"RANANO——使用扩散模型重建 Nano Banana","az":"RANANO 是一个集成的基于人工智能的多媒体创作平台，旨在将多种创意功能整合在单一的基于 Web 的界面中。该系统解决了使用独立应用程序进行图像生成、图像增强、视频创作、动画文本生成和用户引导所带来的碎片化工作流程问题。RANANO 使用一个经过训练的扩散模型进行文本到图像的生成，其中训练好的模型检查点被集成到应用程序中用于推理。该平台还集成了使用超分辨率的图像增强、从选定图像生成视频、动画文本生成以及用于交互式引导的语音助手。系统采用模块化架构，前端与负责模型推理、图像处理、多媒体生成和输出管理的后端服务进行通信。扩散模型使用准备好的数据集进行训练，而训练好的检查点随后在应用程序执行期间加载，无需重复训练。对主要模块进行了功能测试，包括检查点加载、提示词处理、图像生成、图像增强、视频生成、动画文本、语音交互、输出显示与存储以及前后端集成。项目中记录的所有十二个测试用例均成功通过。结果表明，RANANO 为人工智能辅助的多媒体创作提供了一种统一且模块化的方法，同时减少了对多个工具之间切换的需求。该系统还为未来在计算效率、处理时间和多媒体生成能力方面的改进提供了空间。","rv":"这篇文献描述了一个基于扩散模型的 Web 多媒体创作平台 RANANO，整合文生图、超分辨率、视频生成、动画文本和语音助手。本质是工程集成项目，核心为加载预训练扩散模型检查点做推理，无模型训练方法创新。与「视觉生成」有弱关联（文生图），与有机分子晶体、生成模型理论研究关系很弱，属应用层工具整合。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.28086","t":"MoDDiT: Simple Token Routing in Diffusion Transformers","a":"Real-time video generation, interactive world models, and on-device image synthesis are almost a reality. Diffusion Transformers (DiT) achieve excellent sample quality, shifting the bottleneck to the throughput of the models themselves. Natural images are inherently sparse, as large portions of an image are often background, contribute little to the scene content, and are easy to denoise. DiTs fail to exploit this sparsity, as they process image tokens statically and uniformly. We propose MoDDiT, a simple architecture modification that learns to route tokens through both MLP and self-attention operations. By routing tokens through both blocks independently, MoDDiT allows for dynamic compute allocation in MLPs that varies across tokens, images, and denoising timesteps. Using MoDDiT to train image generation models from scratch significantly reduces computational costs of training and inference, processing as few as 12.5% of the tokens. By increasing sparsity and model depth, MoDDiT reduces costs and improves generation performance over unrouted baselines. The learned allocation is interpretable, revealing how computation varies with visual content and noise level. We also use MoDDiT to train video generation models, where allocation correlates with motion, and to distill a dense bidirectional video model into a sparse autoregressive student.","au":["Jarek Liesen","Matthew Jackson","Benjamin Ellis","Shimon Azariah Whiteson","Jakob N. Foerster"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28086","p":"2026-10-20","d":"2026-10-26","s":6.9,"tp":["vision-gen"],"kw":["image generation","video generation","image synthesis"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.28086","who":[],"tz":"MoDDiT：扩散 Transformer 中的简单 Token 路由","az":"实时视频生成、交互式世界模型和端侧图像合成已接近现实。扩散 Transformer（DiT）实现了优异的样本质量，将瓶颈转移到了模型本身的吞吐量上。自然图像本质上是稀疏的，因为图像的大部分区域通常是背景，对场景内容的贡献很小，且易于去噪。DiT 未能利用这种稀疏性，因为它们以静态且均匀的方式处理图像 token。我们提出 MoDDiT，一种简单的架构修改，学习将 token 路由通过 MLP 和自注意力操作。通过独立地将 token 路由通过两个模块，MoDDiT 允许在 MLP 中进行动态计算分配，该分配随 token、图像和去噪时间步而变化。使用 MoDDiT 从头训练图像生成模型显著降低了训练和推理的计算成本，仅处理少至 12.5% 的 token。通过增加稀疏性和模型深度，MoDDiT 相比未路由的基线降低了成本并提升了生成性能。学习到的分配具有可解释性，揭示了计算量如何随视觉内容和噪声水平变化。我们还使用 MoDDiT 训练视频生成模型，其中分配与运动相关，并将稠密的双向视频模型蒸馏为稀疏的自回归学生模型。","rv":"MoDDiT 针对扩散 Transformer 中图像 token 静态均匀处理的问题，提出在 MLP 与自注意力模块中独立路由 token 的轻量架构修改，实现按 token、图像及去噪时间步动态分配计算量。该方法属于视觉生成中的稀疏化推理加速，与「视觉生成」「生成模型」直接相关，与有机分子晶体无关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"t:a7291beb6f4830","t":"Anomaly Detection using Source-Reversed Flow Matching","a":"Anomaly detection in textual data remains an underexplored problem, hindered by fragmented benchmarks, scarce labeled data, and methods that fail to model the distribution of normal text in a continuous and generative manner. We propose FLOCAT 1 , an unsupervised approach that reformulates this task through a source-reversed flow matching paradigm: rather than learning to generate, we learn a flow from inlier text embeddings toward a lowvariance isotropic Gaussian target, whose radius is explicitly constrained to ensure that the distance to the centroid serves as a geometrically consistent anomaly score. Built on a Diffusion Transformer (DiT) backbone, FLO-CAT operates at both token and sentence level through a level-agnostic interpolation mechanism, enabling fine-grained signal interpretability. We evaluate on 10 datasets spanning text classification, spam detection, sentiment analysis, human-vs. machine-generated text and depression screening, consistently achieving state-of-the-art AUC-ROC across all benchmarks and text representations.","au":["Amine Youcef Khodja","Jérémie Pantin","Gaël Harry Dias","Fabrice Maurel"],"v":"HAL","u":"https://hal.science/hal-05769855v1","p":"2026-10-24","d":"2026-10-26","s":6.5,"tp":["gen-model"],"kw":["diffusion transformer","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"","who":[],"tz":"基于源反转流匹配的异常检测","az":"文本数据中的异常检测仍是一个未被充分探索的问题，其进展受到碎片化的基准测试、标注数据稀缺以及现有方法无法以连续且生成式的方式对正常文本分布进行建模的阻碍。我们提出 FLOCAT 1，一种无监督方法，通过源反转流匹配范式重新表述该任务：我们不是学习生成，而是学习一个从内点文本嵌入流向低方差各向同性高斯目标的流，该目标的半径被显式约束，以确保到质心的距离可作为几何一致的异常分数。FLOCAT 基于扩散 Transformer（DiT）骨干网络构建，通过一种层级无关的插值机制在词元和句子两个层级上运行，从而实现细粒度的信号可解释性。我们在涵盖文本分类、垃圾信息检测、情感分析、人类与机器生成文本判别以及抑郁筛查的 10 个数据集上进行评估，在所有基准测试和文本表示上一致取得了最先进的 AUC-ROC 表现。","rv":"FLOCAT 基于源反转流匹配与 DiT 骨干，将文本异常检测重构为从内点嵌入流向低方差各向同性高斯目标的流学习，以质心距离作异常分数，在词元与句子层级运行。方法本质属于生成模型框架（流匹配）的判别式反转应用，与「生成模型」最接近，与有机分子晶体、视觉生成关系弱，与流匹配及高斯约束等数学工具有一定关联。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.27418","t":"TokenFlow: Latent Token Rectified Flow Matching for 3D Point Cloud Generation","a":"3D point clouds generation requires capturing both part-level layout and surface detail while preserving permutation equivariance. Existing latent generative models often encode an entire shape into a single vector, which limits their ability to retain part-level structure. We propose TokenFlow, a hierarchical flow matching framework that represents each shape as a set of latent tokens and couples a rectified flow over these tokens with a conditional flow over points. A bottleneck of $M \\ll N$ learnable tokens aggregates global context through cross-attention at $O(NM)$ cost. On ShapeNet, TokenFlow achieves the best MMD and coverage across airplane, car, and chair, while obtaining 1-NNA comparable to the strongest baselines. On ModelNet, its learned latent set reaches the best reported linear-evaluation accuracy on ModelNet10. These results show that representing a shape as a set of latent tokens, aggregated at $O(NM)$ cost, provides an effective representation for 3D point cloud generation.","au":["Linhao Wang","Dongjin Huang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27418","p":"2026-10-20","d":"2026-10-26","s":6.3,"tp":["gen-model"],"kw":["rectified flow","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27418","who":[],"tz":"TokenFlow：用于3D点云生成的潜在Token整流流匹配","az":"3D点云生成需要同时捕捉部件级布局和表面细节，同时保持置换等变性。现有的潜在生成模型通常将整个形状编码为单个向量，这限制了其保留部件级结构的能力。我们提出TokenFlow，一个层次化流匹配框架，将每个形状表示为一组潜在token，并将这些token上的整流流与点上的条件流耦合。一个由远小于N的M个可学习token组成的瓶颈，通过交叉注意力以O(NM)的代价聚合全局上下文。在ShapeNet上，TokenFlow在飞机、汽车和椅子类别上取得了最佳的MMD和覆盖率，同时获得了与最强基线相当的1-NNA。在ModelNet上，其学习的潜在集在ModelNet10上达到了已报道的最佳线性评估准确率。这些结果表明，将形状表示为一组潜在token并以O(NM)的代价进行聚合，为3D点云生成提供了一种有效的表示。","rv":"TokenFlow是一种层次化整流流匹配框架，将3D形状编码为少量可学习潜在token，通过交叉注意力聚合全局上下文，再耦合token级整流流与点级条件流来生成点云。属于生成模型（流匹配）范畴，与视觉生成（3D几何）较近，与有机分子晶体关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32120","t":"ImageRSI: Verification-Driven Recursive Self-Improvement for Agentic Image Generation","a":"Complex text-to-image requests remain difficult to satisfy reliably. Verifying and repairing an image can fix an individual output, but a successful repair does not necessarily carry over to other requests. We present ImageRSI, a framework that keeps the image generator frozen and combines three components: five-dimensional verification and repair within each task, an experience library shared across tasks, and offline updating of the judge. Candidate experiences enter the library only after paired A/B validation, and the judge is updated with supervised fine-tuning and GRPO on accumulated image-judgment records and evaluated before reuse. We also introduce ImageReq-Bench, a benchmark of 961 requests built around hard cases in real-world image-generation requests, each paired with an evaluation checklist. ImageRSI achieves a Checklist Strict Accuracy (CSA) of 52.6% on MindBench (with Nano Banana Pro as the generator) and 65.66% on ImageReq-Bench, and we compare system outcomes across judge-training configurations.","au":["Shuo Han","Zhilin Wang","Peng Ling","Wenjia Gong","Yang Liu","Guanjun Jiang","Yukun Cao","Xike Xie"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32120","p":"2026-10-23","d":"2026-10-26","s":6.0,"tp":["vision-gen"],"kw":["image generation","text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32120","doi":"","who":[],"tz":"ImageRSI：面向智能体式图像生成的验证驱动递归自我改进","az":"复杂的文本到图像请求仍然难以可靠地满足。对图像进行验证和修复可以修正单个输出，但一次成功的修复不一定能迁移到其他请求。我们提出 ImageRSI，一个保持图像生成器冻结的框架，结合三个组件：每个任务内的五维验证与修复、跨任务共享的经验库、以及评判器的离线更新。候选经验仅在通过配对 A/B 验证后进入经验库，评判器则基于累积的图像评判记录，通过监督微调和 GRPO 进行更新，并在复用前进行评估。我们还引入 ImageReq-Bench，一个围绕真实世界图像生成请求中的困难案例构建的基准，包含 961 个请求，每个请求均配有评估清单。ImageRSI 在 MindBench 上（以 Nano Banana Pro 作为生成器）达到 52.6% 的清单严格准确率（CSA），在 ImageReq-Bench 上达到 65.66%，我们比较了不同评判器训练配置下的系统表现。","rv":"ImageRSI 面向智能体式文本到图像生成，冻结生成器，通过任务内五维验证修复、跨任务经验库和评判器离线更新（SFT+GRPO）实现递归自我改进，并配套 961 条请求的 ImageReq-Bench 基准。属于视觉生成方向，与有机分子晶体、分子生成模型及扩散模型训练无直接关联，核心贡献在生成后验证与经验积累机制。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.63929/22020586.2026.1.053","t":"Generative Flow-Matching Priors from Segmentation-Based Inversion for Uncertainty Quantification","a":"A framework that leverages segmentation methods for geophysical inversion to construct geologic priors for probabilistic inversion is presented. These segmentation models, which partition the subsurface into discrete regions of distinct physical properties based on patterns learned from deterministic inversion results, generate expected geological scenarios, or “concepts,” for hypothesis testing. To sample a concept, a generative model is trained to encode the concept and its variations, then used as the informed prior in the probabilistic inversion.","au":["Johnathan C. Kuttai","Lindsey J. Heagy"],"v":"ASEG Extended Abstracts","u":"https://doi.org/10.63929/22020586.2026.1.053","p":"2026-10-21","d":"2026-10-26","s":5.7,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.63929/22020586.2026.1.053","who":[],"tz":"基于分割反演的生成流匹配先验用于不确定性量化","az":"本文提出了一种利用分割方法进行地球物理反演以构建概率反演中地质先验的框架。这些分割模型基于从确定性反演结果中学到的模式，将地下划分为具有不同物理属性的离散区域，从而生成用于假设检验的预期地质场景，即「概念」。为了对某一概念进行采样，训练一个生成模型来编码该概念及其变体，然后将其作为概率反演中的信息先验使用。","rv":"本文针对地球物理概率反演中的不确定性量化问题，利用分割方法将地下划分为不同物理属性的离散区域，生成地质「概念」，再训练生成模型编码该概念及其变体作为信息先验。方法核心是生成模型在地质反演中的应用，与「生成模型」类别有一定关联，但应用场景为地球物理，与有机分子晶体、视觉生成关系较弱。","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.57760/sciencedb.016kt","t":"PhysCorr-Dataset","a":"we propose PhysCorr, a unified framework for modeling, evaluating, and optimizing physical consistency in text-to-video generation. Building upon this reward signal, we develop PhyDPO, a physics-specialized direct preference optimization paradigm that leverages contrastive feedback and physics-aware reweighting to guide generation toward physically coherent outputs. Our proposed PhysCorr is model-agnostic and scalable, enabling seamless integration with a wide range of diffusion-based and transformer-based video generation backbones. Extensive experiments across multiple benchmarks demonstrate that PhysCorr substantially improves physical realism while preserving visual fidelity and semantic alignment.","au":["Peiyao Wang"],"v":"ScienceDB","u":"https://doi.org/10.57760/sciencedb.016kt","p":"2026-10-19","d":"2026-10-26","s":5.7,"tp":["vision-gen"],"kw":["video generation","text-to-video"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.57760/sciencedb.016kt","who":[],"tz":"PhysCorr-Dataset","az":"我们提出PhysCorr，一个用于建模、评估和优化文本到视频生成中物理一致性的统一框架。基于该奖励信号，我们开发了PhyDPO，一种物理专用的直接偏好优化范式，利用对比反馈和物理感知重加权来引导生成趋向物理连贯的输出。我们提出的PhysCorr是模型无关且可扩展的，能够与广泛的基于扩散模型和基于Transformer的视频生成骨干无缝集成。在多个基准上的大量实验表明，PhysCorr在保持视觉保真度和语义对齐的同时，显著提升了物理真实感。","rv":"该工作针对文本到视频生成中的物理一致性问题，提出PhysCorr统一框架与PhyDPO偏好优化方法，核心是构建物理一致性奖励信号，再以对比反馈和物理感知重加权引导扩散或Transformer视频生成模型。与「视觉生成」关系最近，属视频生成中物理约束优化方向，与有机分子晶体、生成模型、相关数学关系较弱。","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.17877/tudobooks-11.158","t":"Optimal-transport flow matching for stochastic model ipdating","a":"Deep generative models have attracted considerable attention as inference engines for stochastic model updating. Among these deep generative models, conditional flow matching offers a particularly efficient formulation, in which a continuous transport map from a latent distribution to the posterior is learned by regression against optimal-transport probability paths, avoiding both the invertibility constraints of normalising flows and the iterative denoising of diffusion models. However, its performance in engineering model updating has not been examined against an established baseline such as the Bayesian updating framework under controlled conditions. In this work, conditional flow matching is therefore assessed against the Bayesian model updating approach with transitional Markov chain Monte Carlo, in which the Bhattacharyya distance provides the approximate likelihood for the Bayesian approach. The two methods are assessed with respect to posterior fidelity, evaluated by statistical distances against the known ground truth and computational expenditure in model evaluations, with the offline training budget reported separately from the inference cost of each subsequent conditioning. A 3-DOF spring–mass system with uncertain stiffness parameters serves as the benchmark. Since the calibrated posterior constitutes the input description upon which subsequent reliability assessment depends, the accuracy and the marginal cost of the updating step both bear directly on reliability computations. In addition, the amortised nature of the learned transport map is discussed in this work, as it permits the posterior to be re-evaluated under new observations at negligible cost, which is a property of practical relevance to reliability assessment under sequentially acquired monitoring data.","au":["Tairan Wang","Sifeng Bi"],"v":"Technische Universität Dortmund Eldorado (Technische Universität Dortmund)","u":"https://doi.org/10.17877/tudobooks-11.158","p":"2026-12-01","d":"2026-10-26","s":5.7,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.17877/tudobooks-11.158","who":[],"tz":"最优传输流匹配用于随机模型更新","az":"深度生成模型作为随机模型更新的推理引擎已引起广泛关注。在这些深度生成模型中，条件流匹配提供了一种特别高效的表述形式，其中通过针对最优传输概率路径进行回归来学习从隐分布到后验的连续传输映射，从而避免了归一化流的逆约束和扩散模型的迭代去噪。然而，其在工程模型更新中的性能尚未在受控条件下与贝叶斯更新框架等已确立的基线进行过对比检验。因此，本工作将条件流匹配与采用过渡马尔可夫链蒙特卡洛的贝叶斯模型更新方法进行评估对比，其中Bhattacharyya距离为贝叶斯方法提供近似似然。两种方法从后验保真度（通过与已知真值之间的统计距离评估）和模型评估中的计算开销两方面进行评估，离线训练预算与每次后续条件化的推理成本分别报告。一个具有不确定刚度参数的三自由度弹簧-质量系统作为基准。由于校准后的后验构成后续可靠性评估所依赖的输入描述，更新步骤的精度和边际成本都直接影响可靠性计算。此外，本工作还讨论了所学习传输映射的摊销性质，因为它允许在新观测下以极低的成本重新评估后验，这一特性对于顺序获取监测数据条件下的可靠性评估具有实际意义。","rv":"条件流匹配（沿最优传输路径回归）用于工程结构随机模型更新，与贝叶斯MCMC在3-DOF弹簧-质量系统上对比后验保真度与计算成本，并讨论摊销推理。属生成模型（流匹配/最优传输）在贝叶斯推断中的应用，与生成模型类较近，与有机分子晶体、视觉生成关系弱。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.29475","t":"Density-Level Backward Error for Low-NFE Generative Flows","a":"Low-NFE generative ODE sampling is constrained not only by solver order, but also by how a fixed budget of network evaluations is distributed along the flow. We develop a density-level backward-error framework that identifies the component of a solver's modified-equation defect that changes the evolving marginal, while excluding solenoidal trajectory distortion that is invisible in Wasserstein tangent geometry. The resulting residual induces a solver-order-aware compute-allocation rule and, through gauge freedom, an objective for selecting numerically favorable velocity representatives of the same density path. This separates our approach from schedule search driven by trajectory or endpoint surrogates and from higher-order solver design. Exact Gaussian and mixture models establish the mechanism, including cases where curvature-based allocation fails and continuum-optimal transport is not discretization-optimal. On a pretrained CIFAR-10 EDM probability-flow ODE, density-aware allocation consistently improves fixed-update Euler sampling in the low-NFE regime. Matched-seed convergence to a dense Euler reference confirms that the method accelerates approximation of the same high-NFE flow rather than changing the asymptotic sampler.","au":["Ewsey Obzherin","Valentin Khrulkov"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29475","p":"2026-10-21","d":"2026-10-26","s":5.6,"tp":["gen-math"],"kw":["optimal transport","probability flow","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29475","doi":"","who":[],"tz":"低NFE生成流中的密度层面后向误差","az":"低NFE（网络函数评估次数）生成式ODE采样不仅受求解器阶数的限制，还受固定网络评估预算沿流分布方式的影响。我们发展了一个密度层面的后向误差框架，该框架识别求解器修正方程缺陷中改变演化边缘分布的组分，同时排除在Wasserstein切几何中不可见的无散度轨迹畸变。由此产生的残差诱导了一个感知求解器阶数的计算分配规则，并通过规范自由度，为选择同一密度路径上数值上有利的速度代表提供了目标函数。这使我们的方法与由轨迹或端点代理驱动的调度搜索以及高阶求解器设计区分开来。精确的高斯模型和混合模型建立了该机制，包括基于曲率的分配失效以及连续最优传输并非离散化最优的情况。在预训练的CIFAR-10 EDM概率流ODE上，密度感知分配在低NFE区间内一致地改善了固定步长Euler采样。与密集Euler参考的匹配种子收敛性确认，该方法加速了对同一高NFE流的近似，而非改变渐近采样器。","rv":"本文针对生成式ODE采样中低NFE条件下的计算分配问题，提出密度层面后向误差分析框架，用以指导固定预算下沿流的计算分配策略。属于「生成模型」与数值ODE求解的交叉方向，涉及Wasserstein几何、最优传输等数学工具，与有机分子晶体、视觉生成无直接关系。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26262","t":"Dynamics-Aware Sparse Attention for Efficient Autoregressive Video Diffusion","a":"Autoregressive Diffusion Transformers have emerged as a powerful paradigm for long video generation. However, they are often constrained by prohibitive computational overhead and substantial memory footprints. This inefficiency arises from dense computation mechanisms that allocate uniform processing resources across all spatiotemporal regions, failing to leverage the inherent temporal redundancy of video where motion is typically confined to sparse areas. In this paper, we propose Dynamics-Aware Sparse Attention (DASA), a unified framework that shifts from dense computation to sparse, motion-driven generation to eliminate both storage and computational redundancies. Inspired by video codec principles, our approach explicitly decouples video content into dynamic and static regions. To mitigate memory bottlenecks, we selectively compress the historical KV cache by retaining only dynamic features within the generated chunk. Furthermore, to reduce computational overhead, we employ a region-level computation allocation strategy based on localized dynamics. Additionally, a dynamics-guided distillation method is introduced to enhance performance via a lightweight distillation training process. Experiments on VBench demonstrate that our approach accelerates autoregressive video generation by 2.16x, while preserving high visual fidelity.","au":["Yuanyu He","Zhuokun Chen","Yefei He","Zhiwei Tang","Jiasheng Tang","Yinghao Yu","Jianfei Cai","Bohan Zhuang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26262","p":"2026-10-19","d":"2026-10-26","s":5.4,"tp":["vision-gen"],"kw":["video generation","video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26262","who":[],"tz":"动态感知稀疏注意力用于高效自回归视频扩散","az":"自回归扩散Transformer已成为长视频生成的强大范式。然而，它们通常受到高昂计算开销和大量内存占用的限制。这种低效源于稠密计算机制在所有时空区域上均匀分配处理资源，未能利用视频固有的时间冗余性——运动通常局限于稀疏区域。本文提出动态感知稀疏注意力（DASA），一个统一框架，将稠密计算转变为稀疏的、运动驱动的生成，以消除存储和计算冗余。受视频编解码原理启发，我们的方法将视频内容显式解耦为动态区域和静态区域。为缓解内存瓶颈，我们通过仅保留生成块内的动态特征来选择性压缩历史KV缓存。此外，为降低计算开销，我们采用基于局部动态的区域级计算分配策略。另外，引入了一种动态引导的蒸馏方法，通过轻量级蒸馏训练过程来提升性能。在VBench上的实验表明，我们的方法将自回归视频生成加速了2.16倍，同时保持了高视觉保真度。","rv":"本文针对自回归视频扩散模型的计算与内存瓶颈，提出DASA框架，将视频显式分为动态与静态区域，通过稀疏KV缓存压缩和区域级计算分配加速生成。属于视觉生成（视频生成）方向，核心是注意力稀疏化与运动感知计算调度，与有机分子晶体、文本或分子生成模型、相关数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.30926","t":"Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation","a":"Cinematic video generation requires both temporal inference from limited inputs (i.e., sparse rather than frame-by-frame guidance) and factor-aware control of character, scene, action, and camera. Multimodal large language models (MLLMs) offer useful priors for both capabilities, but their representations are not automatically actionable for video generation: a Video Diffusion Transformer (DiT) may bypass them through native conditioning pathways, and using them does not ensure either factor-aware control or generation-compatible temporal prediction. We propose Factor-Aware Predictive Learning (FAPL), which establishes effective MLLM latent use as a shared prerequisite and then targets the two capabilities with complementary learning signals. First, latent-only generator grounding trains the DiT with a frozen MLLM and connector, strengthening the DiT's use of MLLM latents for generation. Second, for factor-aware control, paired videos specify a target-factor change and non-target preservation, and factor-span replacement trains the DiT to realize this relationship in its output. Third, for temporal inference, text-only and text-plus-complete-video observations share a video target, and the trained DiT is then frozen while the MLLM and connector are optimized through it. This final stage trains limited-input representations for generation while retaining complete-observation reconstruction as a complementary training mode. Extensive experiments demonstrate our consistently better performance on three cinematic video generation tasks (i.e., sparse-to-video, factor-aware editing, and multi-shot generation) over baselines and validate FAPL's contributions to MLLM feature use, temporal control, and factor coordination.","au":["Songlin Yang","Zhe Wang","Xiaotong Zhao","Xi Wang","Ran Zhang","Shuai Li","Taiyi Wu","Songlian Li","Eric Liu","Alan Zhao"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30926","p":"2026-10-22","d":"2026-10-26","s":5.4,"tp":["vision-gen"],"kw":["video generation","video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30926","who":[],"tz":"让MLLM隐变量发挥作用：面向电影级视频生成的因子感知预测学习","az":"电影级视频生成既需要从有限输入（即稀疏而非逐帧引导）中进行时间推理，又需要对角色、场景、动作和镜头进行因子感知控制。多模态大语言模型（MLLMs）为这两种能力提供了有用的先验，但其表示并不能自动用于视频生成：视频扩散Transformer（DiT）可能通过原生条件路径绕过它们，而使用它们并不能保证因子感知控制或生成兼容的时间预测。我们提出因子感知预测学习（FAPL），将有效的MLLM隐变量利用作为共享前提，然后用互补的学习信号针对两种能力。首先，仅隐变量生成器接地训练DiT，使用冻结的MLLM和连接器，增强DiT在生成中对MLLM隐变量的利用。其次，对于因子感知控制，成对视频指定目标因子的变化和非目标因子的保持，因子跨度替换训练DiT在其输出中实现这种关系。第三，对于时间推理，仅文本和文本加完整视频的观测共享一个视频目标，然后训练好的DiT被冻结，而MLLM和连接器通过它进行优化。这一最终阶段训练有限输入的表示用于生成，同时保留完整观测重建作为互补训练模式。大量实验表明，在三个电影级视频生成任务（即稀疏到视频、因子感知编辑和多镜头生成）上，我们的方法相比基线方法始终表现更优，并验证了FAPL对MLLM特征利用、时间控制和因子协调的贡献。","rv":"FAPL面向电影级视频生成，通过隐变量接地、因子跨度替换和时间推理优化三阶段训练，使视频扩散Transformer有效利用MLLM隐变量，实现稀疏输入下的时间推理及角色、场景、动作、镜头的因子感知控制。与「视觉生成」和「生成模型」最为接近，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26000","t":"PnP-CF: A Consensus Flow-Matching Solver for General Inverse Problems","a":"Plug-and-Play (PnP) methods using continuous-time deep generative models as learned data distribution priors enable synthesizing high-quality solutions of model-based inverse problems. The quality of the solutions depends critically on the interplay and consensus between the inverse problem solver and the generative model sampler. We revisit a recently introduced flow-based PnP framework, which we refer to as PnP-CF (Consensus Flow), and extend its application to nonlinear inverse problems, including those with learned neural-network forward operators. PnP-CF combines a flow-matching denoiser with (i) ADMM-like dual variable updates and (ii) a time-adaptive pullback onto the intermediate flow probability path that combines a stochastic and a deterministic component. We discuss how these two features stabilize the algorithm and promote consensus, and demonstrate on a set of experiments that PnP-CF not only solves standard linear inverse problems with quality at least comparable to state-of-the-art baselines, but also extends gracefully to nonlinear inverse problems, including forward operators realized by pretrained neural networks, for which existing methods produce unsatisfactory results or fail completely.","au":["Dibyanshu Kumar","Magda Gregorová"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26000","p":"2026-10-19","d":"2026-10-26","s":5.3,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26000","who":[],"tz":"PnP-CF：面向一般逆问题的一致性流匹配求解器","az":"使用连续时间深度生成模型作为学习数据分布先验的即插即用（PnP）方法能够合成基于模型的逆问题的高质量解。解的质量关键取决于逆问题求解器与生成模型采样器之间的相互作用与一致性。我们重新审视了一个近期提出的基于流的 PnP 框架，将其称为 PnP-CF（一致性流），并将其应用扩展到非线性逆问题，包括那些具有学习得到的神经网络前向算子的问题。PnP-CF 将流匹配去噪器与（i）类 ADMM 对偶变量更新以及（ii）一种时间自适应的拉回机制相结合，该拉回机制作用于中间流概率路径，并融合了随机与确定性两个分量。我们讨论了这两个特征如何稳定算法并促进一致性，并通过一组实验证明 PnP-CF 不仅能以至少与最先进基线相当的质量求解标准线性逆问题，还能优雅地扩展到非线性逆问题，包括由预训练神经网络实现的前向算子，而现有方法对此类问题往往产生不令人满意的结果或完全失败。","rv":"本文属于逆问题求解与生成模型的交叉方向。PnP-CF 将流匹配去噪器与 ADMM 对偶更新及时间自适应拉回机制结合，用于求解线性及非线性逆问题。与「生成模型」关系较近，具体是流匹配生成模型作为先验嵌入逆问题求解流程；与「有机分子晶体」和「视觉生成」关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.28801","t":"JUICE: Unified Multimodal Modeling in Pretrained Representation Spaces","a":"Most unified multimodal models treat images and text asymmetrically: a pretrained language model generates text, an attached diffusion head generates images, and outputs that contain both are produced in a fixed order, so the first output cannot adapt to the second. We ask whether both modalities can instead be generated by one process that is trained on them jointly from scratch. Pretrained encoder spaces hold both modalities in one continuous form and carry knowledge learned at scale, and recent work finds them effective as generative targets for vision and language. We therefore model the joint distribution directly in these spaces. We introduce JUICE (Joint Unified multimodal modeling In Continuous Encoder spaces), a single flow matching Transformer over frozen image and text representations, in which each modality has its own noise level. Which modalities are clean and which are generated then decides the task: image generation, captioning, visual question answering, or joint generation. Controlled pretraining runs test each design choice. At equal guidance, generating text as continuous states leaves image generation intact (48.41 GenEval, against 47.86 for a model trained only for text-to-image generation), while captions lose some exact wording. Training on joint and conditional denoising together beats either alone, and semantic encoder spaces beat VAE latents and raw pixels as targets. At 2.1B parameters, with no language model initialization and at 224x224, JUICE reaches up to 0.88 on GenEval and 73.1 on VQAv2. By sampling both modalities from the joint distribution (coupled sampling), it can also draw a route on a map while writing out the matching moves. On mazes with several valid solutions, joint success rises from 54.6% with independent sampling to 93.7%, and no modality has to go first. On visual spatial planning, JUICE solves 99.8% of maps at its training sizes.","au":["Jiahan Li","Huangyuan Su","Shengbang Tong","Shusheng Yang","Ruihan Guo","Suozhi Huang","Hexu Zhao","Pratyusha Sharma","Sherry Yang","Jiatao Gu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28801","p":"2026-10-20","d":"2026-10-26","s":5.2,"tp":["vision-gen"],"kw":["image generation","text-to-image"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.28801","who":[],"tz":"JUICE：预训练表示空间中的统一多模态建模","az":"大多数统一多模态模型对图像和文本的处理是不对称的：一个预训练语言模型生成文本，一个附加的扩散头生成图像，同时包含两者的输出以固定顺序产生，因此第一个输出无法适应第二个输出。我们提出一个问题：是否可以用一个从头开始联合训练的过程来同时生成两种模态。预训练编码器空间将两种模态以统一的连续形式容纳其中，并携带大规模学习获得的知识，近期工作发现它们作为视觉和语言的生成目标是有效的。因此，我们直接在这些空间中建模联合分布。我们提出 JUICE（Joint Unified multimodal modeling In Continuous Encoder spaces，连续编码器空间中的联合统一多模态建模），一个在冻结的图像和文本表示上的单一流匹配 Transformer，其中每种模态拥有各自的噪声水平。哪些模态是干净的、哪些是生成的，由此决定任务：图像生成、图像描述、视觉问答或联合生成。受控的预训练实验检验了每个设计选择。在相同引导强度下，将文本作为连续状态生成不会损害图像生成（GenEval 48.41，而仅针对文本到图像生成训练的模型为 47.86），但描述会失去一些精确措辞。联合去噪和条件去噪一起训练优于单独使用其中任何一种，语义编码器空间作为目标优于 VAE 潜变量和原始像素。在 21 亿参数、不使用语言模型初始化、分辨率 224×224 的条件下，JUICE 在 GenEval 上达到 0.88，在 VQAv2 上达到 73.1。通过从联合分布中同时采样两种模态（耦合采样），它还可以在地图上绘制路线的同时写出对应的移动步骤。在存在多个有效解的迷宫上，联合成功率从独立采样的 54.6% 提升至 93.7%，且无需任何模态先行。在视觉空间规划任务上，JUICE 在其训练尺寸下解决了 99.8% 的地图。","rv":"JUICE 在冻结的预训练图像与文本编码器空间中，用单一流匹配 Transformer 联合建模两种模态分布，通过设定各模态噪声水平切换任务。实际实现了图像生成、描述、视觉问答及联合生成，并在耦合采样下完成地图路径规划。与「生成模型」和「视觉生成」最为接近，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32381","t":"UniWorld: A Unified World Model for Real-Time Visual World Simulation","a":"Continuous visual world simulation requires coupling evolving scene geometry with temporally persistent appearance. We present UniWorld, a unified framework that integrates depth trajectories and reference appearance within a shared video generation model. The central design maintains visual and geometric histories on a common timeline. Noise-aligned overlapping continuation places generated history at the prescribed sampling noise level and commits only newly generated latents. Rolling depth latent state preserves the corresponding geometric controls, incrementally reads newly available geometry, and keeps the conditioning fixed within each sampling window. Together, these mechanisms ensure exact preservation of latent history while bounding the active depth state by the window size. We evaluate continuous generation, paired history interventions, and long-horizon behavior across diverse scene categories. The same generator supports estimated, native, and on-demand simulator depth, while cached and incremental execution paths produce bitwise-identical outp
