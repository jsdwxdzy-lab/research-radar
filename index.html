<!doctype html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科研雷达 · Research Radar</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --text:#15181e; --muted:#6b7280;
  --line:#e4e7ec; --line-2:#eef0f4; --accent:#4f46e5; --accent-2:#eef2ff;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1014; --panel:#15181e; --panel-2:#1a1e26; --text:#e7e9ee; --muted:#98a1b0;
  --line:#252b35; --line-2:#1e232c; --accent:#8b93ff; --accent-2:#20243a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  html[data-theme="auto"]{
    --bg:#0e1014; --panel:#15181e; --panel-2:#1a1e26; --text:#e7e9ee; --muted:#98a1b0;
    --line:#252b35; --line-2:#1e232c; --accent:#8b93ff; --accent-2:#20243a;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hidden{display:none !important}
.muted{color:var(--muted)}
.spacer{flex:1}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:color-mix(in srgb,var(--panel) 88%,transparent);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.brand{font-weight:650;letter-spacing:.02em;white-space:nowrap}
.brand .sub{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.search{flex:1;max-width:520px;position:relative}
.search input{width:100%;padding:8px 12px 8px 30px;border-radius:9px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);font-size:13px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}
.search .ico{position:absolute;left:10px;top:8px;color:var(--muted);font-size:13px}
.tops{display:flex;gap:6px;align-items:center}
.tops button{padding:7px 11px;border-radius:8px;border:1px solid transparent;color:var(--muted);font-size:13px}
.tops button:hover{background:var(--panel-2);color:var(--text)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:264px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;padding:14px 12px 40px;
  border-right:1px solid var(--line);background:var(--panel)}
.sidebar h3{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  margin:18px 6px 8px;font-weight:600}
.viewlist{display:flex;flex-direction:column;gap:1px}
.view{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--text);font-size:13px;width:100%;text-align:left}
.view:hover{background:var(--panel-2)}
.view.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.view .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)}
.view.on .n{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:5px;padding:0 4px}
.fchip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:11.5px;
  border:1px solid var(--line);color:var(--muted);background:var(--panel-2)}
.fchip:hover{border-color:var(--accent);color:var(--accent)}
.fchip.on{background:color-mix(in srgb,hsl(var(--h,220) 65% 55%) 16%,transparent);
  border-color:hsl(var(--h,220) 60% 55%);color:hsl(var(--h,220) 55% 42%)}
html[data-theme="dark"] .fchip.on{color:hsl(var(--h,220) 80% 72%)}
.fchip .dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,220) 60% 55%)}
.datelist{display:flex;flex-direction:column;gap:1px;max-height:320px;overflow-y:auto}
.date{display:flex;align-items:center;gap:8px;padding:5px 9px;border-radius:7px;font-size:12.5px;color:var(--muted);width:100%;text-align:left}
.date:hover{background:var(--panel-2);color:var(--text)}
.date.on{background:var(--accent-2);color:var(--accent);font-weight:600}
.date .n{margin-left:auto;font-family:var(--mono);font-size:11px}
.health{margin-top:22px;padding:10px 8px 0;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.health div{display:flex;gap:6px;align-items:center;padding:2px 0}
.health .ok{color:#16a34a}.health .bad{color:#dc2626}

/* ---------- main ---------- */
.main{padding:18px 22px 80px;max-width:1020px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.crumb{font-size:15px;font-weight:650}
.crumb small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.tool{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);font-size:12.5px;color:var(--muted)}
.tool:hover{border-color:var(--accent);color:var(--accent)}
select.tool{appearance:none;padding-right:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

/* overview + why */
.overview{margin:0 0 12px;padding:12px 16px;border-left:3px solid var(--accent)}
.overview .ovhead{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px}
.overview p{margin:0;font-size:13.5px;line-height:1.7}
.cwhy{margin-top:8px;font-size:12.5px;color:color-mix(in srgb,var(--accent) 45%,var(--text));
  background:color-mix(in srgb,var(--accent) 7%,transparent);border-radius:7px;padding:6px 9px;line-height:1.6}

/* trend */
.trend{margin:6px 0 14px;padding:12px 14px}
.trend-head{display:flex;align-items:center;font-size:12px;color:var(--muted);margin-bottom:8px}
.trend-head .mini{margin-left:auto;color:var(--accent);font-size:12px}
.trend-body{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.trow{display:grid;grid-template-columns:74px 1fr 66px;align-items:center;gap:10px;padding:5px 6px;border-radius:8px;text-align:left}
.trow:hover{background:var(--panel-2)}
.trow.on{background:var(--accent-2)}
.tname{font-size:12px;font-weight:600;color:hsl(var(--h,220) 55% 42%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="dark"] .tname{color:hsl(var(--h,220) 80% 70%)}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;border-bottom:1px solid var(--line-2)}
.spark .bar{flex:1;background:hsl(var(--h,220) 60% 78%);border-radius:2px 2px 0 0;min-height:2px}
.spark .bar.now{background:hsl(var(--h,220) 60% 52%)}
.tnum{font-family:var(--mono);font-size:12px;text-align:right}
.tnum i{font-style:normal;font-size:10.5px;margin-left:4px}
.tnum .up{color:#16a34a}.tnum .down{color:#dc2626}
.tnum .new{color:var(--accent)}.tnum .flat{color:var(--muted)}

/* cards */
.daybar{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font-size:13px}
.daybar b{font-family:var(--mono)}
.daybar .wd{color:var(--muted)}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid hsl(var(--h,220) 55% 65%);
  border-radius:10px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--shadow);transition:border-color .12s}
.card:hover{border-color:var(--line);border-left-color:hsl(var(--h,220) 55% 55%)}
.card.read{opacity:.62}
.card.read:hover{opacity:1}
.card.focus{outline:2px solid var(--accent);outline-offset:1px}
.chead{display:flex;align-items:flex-start;gap:8px}
.ctitle{flex:1;font-weight:600;font-size:14.5px;line-height:1.42}
.ctitle a:hover{color:var(--accent)}
.zh{margin-top:2px;font-weight:500;font-size:13px;color:var(--text)}
.zhabs{color:var(--text)}
.trust{margin-left:4px;font-size:10.5px;padding:1px 5px;border-radius:999px;border:1px solid var(--line)}
.trust.high{color:#15803d;border-color:#86efac}
.trust.mid{color:var(--muted)}
.trust.low{color:#a16207;border-color:#fcd34d}
.icon{width:24px;height:24px;border-radius:6px;color:var(--muted);line-height:1;display:grid;place-items:center;flex:0 0 auto}
.icon:hover{background:var(--panel-2);color:var(--accent)}
.btn-star.on{color:#f59e0b}
.score{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--panel-2);
  padding:2px 6px;border-radius:6px;flex:0 0 auto;margin-top:2px}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:7px 0 0;font-size:11.5px;color:var(--muted)}
.chip{padding:1.5px 7px;border-radius:999px;font-size:11px;
  background:color-mix(in srgb,hsl(var(--h,220) 65% 55%) 14%,transparent);
  color:hsl(var(--h,220) 55% 40%);border:1px solid color-mix(in srgb,hsl(var(--h,220) 65% 55%) 28%,transparent)}
html[data-theme="dark"] .chip{color:hsl(var(--h,220) 80% 74%)}
.chip.kind{--h:0;background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.venue{font-style:italic}
.who{color:#7c3aed}
.multi{background:var(--panel-2);padding:1px 6px;border-radius:999px;border:1px solid var(--line)}
.ckw{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ckw span{font-size:11px;color:var(--muted);background:var(--panel-2);border-radius:5px;padding:1px 6px;
  border:1px solid var(--line-2);font-family:var(--mono)}
.cabs{margin-top:7px;font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.open .cabs{-webkit-line-clamp:unset;display:block}
.cfoot{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.link{color:var(--muted)}
.link:hover{color:var(--accent)}
.more{border-top:1px dashed var(--line);margin-top:9px;padding-top:8px;font-size:12px;color:var(--muted)}
.mrow{margin:3px 0}
.mrow b{color:var(--text);font-weight:600;margin-right:6px}
textarea.note{width:100%;margin-top:8px;min-height:46px;resize:vertical;border-radius:8px;border:1px solid var(--line);
  background:var(--panel-2);color:var(--text);padding:7px 9px;font-size:12.5px;font-family:inherit;outline:none}
textarea.note:focus{border-color:var(--accent)}
.empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--text);font-size:14px;margin-bottom:6px}
.morebtn{width:100%;margin:10px 0 0;padding:10px;border-radius:10px;border:1px dashed var(--line);
  color:var(--muted);font-size:12.5px}
.morebtn:hover{border-color:var(--accent);color:var(--accent)}

/* calendar */
.events{margin-top:18px;padding:12px 14px}
.events h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.ev{display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line-2);font-size:12.5px}
.ev b{font-family:var(--mono);color:var(--accent);min-width:44px}
.ev em{margin-left:auto;font-style:normal;color:var(--muted);font-size:11px}

/* stats */
.stats{margin-top:18px;padding:12px 14px}
.stats h3{font-size:12px;color:var(--muted);margin:0 0 8px;font-weight:600}
.stats .grp{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
.stats .grp b{font-size:11px;color:var(--muted);font-weight:600;width:100%;margin-bottom:2px}
.stats .kv{font-size:11.5px;padding:2px 7px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--line-2);color:var(--muted)}
.stats .kv:hover{border-color:var(--accent);color:var(--accent)}
.stats .kv i{font-style:normal;font-family:var(--mono);font-size:10.5px;margin-left:4px;opacity:.7}
mark{background:color-mix(in srgb,var(--accent) 28%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* toast + help */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#111827;color:#fff;
  padding:9px 14px;border-radius:9px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.help{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:70}
.help .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:420px;width:92%}
.help h4{margin:0 0 10px}
.help table{width:100%;border-collapse:collapse;font-size:12.5px}
.help td{padding:3px 0;color:var(--muted)}
.help td:first-child{width:96px;color:var(--text);font-family:var(--mono)}
.err{position:fixed;left:12px;bottom:12px;right:12px;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;
  padding:10px;border-radius:8px;font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;z-index:99}

@media print{
  .sidebar,.tops,.search .ico,.toolbar,#trend,#events,#stats,.cfoot,.icon,.btn-more,.toast,.help{display:none !important}
  .layout{display:block}
  .main{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #ddd;border-left-width:3px}
  body{background:#fff}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr 1fr;gap:0 16px;max-height:none}
  .sidebar>section:last-of-type,.health{grid-column:1/-1}
  .datelist{flex-direction:row;overflow-x:auto;max-height:none}
  .date{white-space:nowrap}
  .trend-body{grid-template-columns:1fr}
  .main{padding:14px 12px 60px}
  .topbar{gap:8px;padding:9px 12px}
  .brand .sub{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">科研雷达 <span class="sub" id="generated"></span></div>
  <div class="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="搜索标题 / 摘要 / 作者 / 期刊 …  按 / 聚焦" autocomplete="off">
  </div>
  <div class="tops">
    <button id="btnTheme" title="深浅色">◐</button>
    <button id="btnHelp" title="快捷键 (?)">?</button>
    <button id="btnExport" title="导出当前列表">导出</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <nav class="viewlist" id="views"></nav>

    <section>
      <h3>主题分区</h3>
      <div class="filters" id="topicFilter"></div>
    </section>

    <section>
      <h3>来源</h3>
      <div class="filters" id="sourceFilter"></div>
    </section>

    <section>
      <h3>历史日报</h3>
      <div class="datelist" id="dateList"></div>
    </section>

    <div class="health" id="health"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <select class="tool" id="sort">
        <option value="score">按相关度</option>
        <option value="date">按时间</option>
        <option value="venue">按期刊</option>
        <option value="topic">按主题分区</option>
      </select>
      <button class="tool" id="btnReadAll" title="把当前列表全部标记已读">全部已读</button>
      <button class="tool" id="btnClear">清除筛选</button>
    </div>

    <div class="panel overview" id="overview"></div>
    <div class="panel trend" id="trend"></div>
    <div id="list"></div>
    <div class="panel stats" id="stats"></div>
    <div class="panel events" id="events"></div>
  </main>
</div>

<div class="toast" id="toast"></div>
<div id="helpHost"></div>

<script>
const DATA = {"overview":"","generated":"2026-10-27 00:13","today":"2026-10-27","field":"计算化学 / 有机分子晶体，以及生成模型、视觉生成与相关数学","owner":"zhouy","topics":[{"id":"csp","name":"分子晶体结构预测（CSP）与能量图景","short":"CSP","tier":"core","hue":255},{"id":"crystal-gen","name":"生成模型与逆向设计","short":"生成设计","tier":"core","hue":300},{"id":"gen-model","name":"生成模型、新模型与新架构","short":"生成模型","tier":"core","hue":320},{"id":"vision-gen","name":"视觉生成","short":"视觉生成","tier":"core","hue":280},{"id":"gen-math","name":"生成模型相关数学","short":"生成数学","tier":"core","hue":40},{"id":"mlip","name":"机器学习势与通用势函数（MLIP / UMA）","short":"MLIP","tier":"core","hue":190},{"id":"ai4s","name":"AI for Science 方法与自动化","short":"AI4S","tier":"core","hue":215}],"days":[{"d":"2026-10-26","n":73},{"d":"2026-10-23","n":4},{"d":"2026-10-22","n":3},{"d":"2026-10-21","n":2},{"d":"2026-10-20","n":4}],"items":[{"k":"doi:10.59256/indjcst.20260503043","t":"RANANO-Recreating Nano Banana Using Diffusion Model","a":"RANANO is an integrated artificial intelligence-based multimedia creation platform developed to combine multiple creative functionalities within a single web-based interface. The system addresses the fragmented workflow involved in using separate applications for image generation, image enhancement, video creation, animated text generation, and user guidance. RANANO uses a trained diffusion model for text-to-image generation, where the trained model checkpoint is integrated into the application for inference. The platform also incorporates image enhancement using super-resolution, video generation from selected images, animated text generation, and a voice assistant for interactive guidance. The system follows a modular architecture in which the frontend communicates with backend services responsible for model inference, image processing, multimedia generation, and output management. The diffusion model is trained using a prepared dataset, while the trained checkpoint is subsequently loaded during application execution without repeated training. Functional testing was conducted across the major modules, including checkpoint loading, prompt processing, image generation, image enhancement, video generation, animated text, voice interaction, output display and storage, and frontend-backend integration. All twelve test cases documented in the project were successfully passed. The results demonstrate that RANANO provides a unified and modular approach for AI-assisted multimedia creation while reducing the need to switch between multiple tools. The system also provides scope for future improvements in computational efficiency, processing time, and multimedia generation capabilities.","au":["K R Manjushree","S Sakshi","Prakash Jadamali Sanjana","Udaya Vernekar Shreya","Guttal Vinuthana"],"v":"Indian Journal of Computer Science and Technology","u":"https://doi.org/10.59256/indjcst.20260503043","p":"2026-10-22","d":"2026-10-26","s":8.3,"tp":["vision-gen"],"kw":["image generation","video generation","text-to-image"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.59256/indjcst.20260503043","who":[],"tz":"RANANO——使用扩散模型重建 Nano Banana","az":"RANANO 是一个集成的基于人工智能的多媒体创作平台，旨在将多种创意功能整合在单一的基于 Web 的界面中。该系统解决了使用独立应用程序进行图像生成、图像增强、视频创作、动画文本生成和用户引导所带来的碎片化工作流程问题。RANANO 使用一个经过训练的扩散模型进行文本到图像的生成，其中训练好的模型检查点被集成到应用程序中用于推理。该平台还集成了使用超分辨率的图像增强、从选定图像生成视频、动画文本生成以及用于交互式引导的语音助手。系统采用模块化架构，前端与负责模型推理、图像处理、多媒体生成和输出管理的后端服务进行通信。扩散模型使用准备好的数据集进行训练，而训练好的检查点随后在应用程序执行期间加载，无需重复训练。对主要模块进行了功能测试，包括检查点加载、提示词处理、图像生成、图像增强、视频生成、动画文本、语音交互、输出显示与存储以及前后端集成。项目中记录的所有十二个测试用例均成功通过。结果表明，RANANO 为人工智能辅助的多媒体创作提供了一种统一且模块化的方法，同时减少了对多个工具之间切换的需求。该系统还为未来在计算效率、处理时间和多媒体生成能力方面的改进提供了空间。","rv":"这篇文献描述了一个基于扩散模型的 Web 多媒体创作平台 RANANO，整合文生图、超分辨率、视频生成、动画文本和语音助手。本质是工程集成项目，核心为加载预训练扩散模型检查点做推理，无模型训练方法创新。与「视觉生成」有弱关联（文生图），与有机分子晶体、生成模型理论研究关系很弱，属应用层工具整合。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.28086","t":"MoDDiT: Simple Token Routing in Diffusion Transformers","a":"Real-time video generation, interactive world models, and on-device image synthesis are almost a reality. Diffusion Transformers (DiT) achieve excellent sample quality, shifting the bottleneck to the throughput of the models themselves. Natural images are inherently sparse, as large portions of an image are often background, contribute little to the scene content, and are easy to denoise. DiTs fail to exploit this sparsity, as they process image tokens statically and uniformly. We propose MoDDiT, a simple architecture modification that learns to route tokens through both MLP and self-attention operations. By routing tokens through both blocks independently, MoDDiT allows for dynamic compute allocation in MLPs that varies across tokens, images, and denoising timesteps. Using MoDDiT to train image generation models from scratch significantly reduces computational costs of training and inference, processing as few as 12.5% of the tokens. By increasing sparsity and model depth, MoDDiT reduces costs and improves generation performance over unrouted baselines. The learned allocation is interpretable, revealing how computation varies with visual content and noise level. We also use MoDDiT to train video generation models, where allocation correlates with motion, and to distill a dense bidirectional video model into a sparse autoregressive student.","au":["Jarek Liesen","Matthew Jackson","Benjamin Ellis","Shimon Azariah Whiteson","Jakob N. Foerster"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28086","p":"2026-10-20","d":"2026-10-26","s":6.9,"tp":["vision-gen"],"kw":["image generation","video generation","image synthesis"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.28086","who":[],"tz":"MoDDiT：扩散 Transformer 中的简单 Token 路由","az":"实时视频生成、交互式世界模型和端侧图像合成已接近现实。扩散 Transformer（DiT）实现了优异的样本质量，将瓶颈转移到了模型本身的吞吐量上。自然图像本质上是稀疏的，因为图像的大部分区域通常是背景，对场景内容的贡献很小，且易于去噪。DiT 未能利用这种稀疏性，因为它们以静态且均匀的方式处理图像 token。我们提出 MoDDiT，一种简单的架构修改，学习将 token 路由通过 MLP 和自注意力操作。通过独立地将 token 路由通过两个模块，MoDDiT 允许在 MLP 中进行动态计算分配，该分配随 token、图像和去噪时间步而变化。使用 MoDDiT 从头训练图像生成模型显著降低了训练和推理的计算成本，仅处理少至 12.5% 的 token。通过增加稀疏性和模型深度，MoDDiT 相比未路由的基线降低了成本并提升了生成性能。学习到的分配具有可解释性，揭示了计算量如何随视觉内容和噪声水平变化。我们还使用 MoDDiT 训练视频生成模型，其中分配与运动相关，并将稠密的双向视频模型蒸馏为稀疏的自回归学生模型。","rv":"MoDDiT 针对扩散 Transformer 中图像 token 静态均匀处理的问题，提出在 MLP 与自注意力模块中独立路由 token 的轻量架构修改，实现按 token、图像及去噪时间步动态分配计算量。该方法属于视觉生成中的稀疏化推理加速，与「视觉生成」「生成模型」直接相关，与有机分子晶体无关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"t:a7291beb6f4830","t":"Anomaly Detection using Source-Reversed Flow Matching","a":"Anomaly detection in textual data remains an underexplored problem, hindered by fragmented benchmarks, scarce labeled data, and methods that fail to model the distribution of normal text in a continuous and generative manner. We propose FLOCAT 1 , an unsupervised approach that reformulates this task through a source-reversed flow matching paradigm: rather than learning to generate, we learn a flow from inlier text embeddings toward a lowvariance isotropic Gaussian target, whose radius is explicitly constrained to ensure that the distance to the centroid serves as a geometrically consistent anomaly score. Built on a Diffusion Transformer (DiT) backbone, FLO-CAT operates at both token and sentence level through a level-agnostic interpolation mechanism, enabling fine-grained signal interpretability. We evaluate on 10 datasets spanning text classification, spam detection, sentiment analysis, human-vs. machine-generated text and depression screening, consistently achieving state-of-the-art AUC-ROC across all benchmarks and text representations.","au":["Amine Youcef Khodja","Jérémie Pantin","Gaël Harry Dias","Fabrice Maurel"],"v":"HAL","u":"https://hal.science/hal-05769855v1","p":"2026-10-24","d":"2026-10-26","s":6.5,"tp":["gen-model"],"kw":["diffusion transformer","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"","who":[],"tz":"基于源反转流匹配的异常检测","az":"文本数据中的异常检测仍是一个未被充分探索的问题，其进展受到碎片化的基准测试、标注数据稀缺以及现有方法无法以连续且生成式的方式对正常文本分布进行建模的阻碍。我们提出 FLOCAT 1，一种无监督方法，通过源反转流匹配范式重新表述该任务：我们不是学习生成，而是学习一个从内点文本嵌入流向低方差各向同性高斯目标的流，该目标的半径被显式约束，以确保到质心的距离可作为几何一致的异常分数。FLOCAT 基于扩散 Transformer（DiT）骨干网络构建，通过一种层级无关的插值机制在词元和句子两个层级上运行，从而实现细粒度的信号可解释性。我们在涵盖文本分类、垃圾信息检测、情感分析、人类与机器生成文本判别以及抑郁筛查的 10 个数据集上进行评估，在所有基准测试和文本表示上一致取得了最先进的 AUC-ROC 表现。","rv":"FLOCAT 基于源反转流匹配与 DiT 骨干，将文本异常检测重构为从内点嵌入流向低方差各向同性高斯目标的流学习，以质心距离作异常分数，在词元与句子层级运行。方法本质属于生成模型框架（流匹配）的判别式反转应用，与「生成模型」最接近，与有机分子晶体、视觉生成关系弱，与流匹配及高斯约束等数学工具有一定关联。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.27418","t":"TokenFlow: Latent Token Rectified Flow Matching for 3D Point Cloud Generation","a":"3D point clouds generation requires capturing both part-level layout and surface detail while preserving permutation equivariance. Existing latent generative models often encode an entire shape into a single vector, which limits their ability to retain part-level structure. We propose TokenFlow, a hierarchical flow matching framework that represents each shape as a set of latent tokens and couples a rectified flow over these tokens with a conditional flow over points. A bottleneck of $M \\ll N$ learnable tokens aggregates global context through cross-attention at $O(NM)$ cost. On ShapeNet, TokenFlow achieves the best MMD and coverage across airplane, car, and chair, while obtaining 1-NNA comparable to the strongest baselines. On ModelNet, its learned latent set reaches the best reported linear-evaluation accuracy on ModelNet10. These results show that representing a shape as a set of latent tokens, aggregated at $O(NM)$ cost, provides an effective representation for 3D point cloud generation.","au":["Linhao Wang","Dongjin Huang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27418","p":"2026-10-20","d":"2026-10-26","s":6.3,"tp":["gen-model"],"kw":["rectified flow","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27418","who":[],"tz":"TokenFlow：用于3D点云生成的潜在Token整流流匹配","az":"3D点云生成需要同时捕捉部件级布局和表面细节，同时保持置换等变性。现有的潜在生成模型通常将整个形状编码为单个向量，这限制了其保留部件级结构的能力。我们提出TokenFlow，一个层次化流匹配框架，将每个形状表示为一组潜在token，并将这些token上的整流流与点上的条件流耦合。一个由远小于N的M个可学习token组成的瓶颈，通过交叉注意力以O(NM)的代价聚合全局上下文。在ShapeNet上，TokenFlow在飞机、汽车和椅子类别上取得了最佳的MMD和覆盖率，同时获得了与最强基线相当的1-NNA。在ModelNet上，其学习的潜在集在ModelNet10上达到了已报道的最佳线性评估准确率。这些结果表明，将形状表示为一组潜在token并以O(NM)的代价进行聚合，为3D点云生成提供了一种有效的表示。","rv":"TokenFlow是一种层次化整流流匹配框架，将3D形状编码为少量可学习潜在token，通过交叉注意力聚合全局上下文，再耦合token级整流流与点级条件流来生成点云。属于生成模型（流匹配）范畴，与视觉生成（3D几何）较近，与有机分子晶体关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32120","t":"ImageRSI: Verification-Driven Recursive Self-Improvement for Agentic Image Generation","a":"Complex text-to-image requests remain difficult to satisfy reliably. Verifying and repairing an image can fix an individual output, but a successful repair does not necessarily carry over to other requests. We present ImageRSI, a framework that keeps the image generator frozen and combines three components: five-dimensional verification and repair within each task, an experience library shared across tasks, and offline updating of the judge. Candidate experiences enter the library only after paired A/B validation, and the judge is updated with supervised fine-tuning and GRPO on accumulated image-judgment records and evaluated before reuse. We also introduce ImageReq-Bench, a benchmark of 961 requests built around hard cases in real-world image-generation requests, each paired with an evaluation checklist. ImageRSI achieves a Checklist Strict Accuracy (CSA) of 52.6% on MindBench (with Nano Banana Pro as the generator) and 65.66% on ImageReq-Bench, and we compare system outcomes across judge-training configurations.","au":["Shuo Han","Zhilin Wang","Peng Ling","Wenjia Gong","Yang Liu","Guanjun Jiang","Yukun Cao","Xike Xie"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32120","p":"2026-10-23","d":"2026-10-26","s":6.0,"tp":["vision-gen"],"kw":["image generation","text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32120","doi":"","who":[],"tz":"ImageRSI：面向智能体式图像生成的验证驱动递归自我改进","az":"复杂的文本到图像请求仍然难以可靠地满足。对图像进行验证和修复可以修正单个输出，但一次成功的修复不一定能迁移到其他请求。我们提出 ImageRSI，一个保持图像生成器冻结的框架，结合三个组件：每个任务内的五维验证与修复、跨任务共享的经验库、以及评判器的离线更新。候选经验仅在通过配对 A/B 验证后进入经验库，评判器则基于累积的图像评判记录，通过监督微调和 GRPO 进行更新，并在复用前进行评估。我们还引入 ImageReq-Bench，一个围绕真实世界图像生成请求中的困难案例构建的基准，包含 961 个请求，每个请求均配有评估清单。ImageRSI 在 MindBench 上（以 Nano Banana Pro 作为生成器）达到 52.6% 的清单严格准确率（CSA），在 ImageReq-Bench 上达到 65.66%，我们比较了不同评判器训练配置下的系统表现。","rv":"ImageRSI 面向智能体式文本到图像生成，冻结生成器，通过任务内五维验证修复、跨任务经验库和评判器离线更新（SFT+GRPO）实现递归自我改进，并配套 961 条请求的 ImageReq-Bench 基准。属于视觉生成方向，与有机分子晶体、分子生成模型及扩散模型训练无直接关联，核心贡献在生成后验证与经验积累机制。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.63929/22020586.2026.1.053","t":"Generative Flow-Matching Priors from Segmentation-Based Inversion for Uncertainty Quantification","a":"A framework that leverages segmentation methods for geophysical inversion to construct geologic priors for probabilistic inversion is presented. These segmentation models, which partition the subsurface into discrete regions of distinct physical properties based on patterns learned from deterministic inversion results, generate expected geological scenarios, or “concepts,” for hypothesis testing. To sample a concept, a generative model is trained to encode the concept and its variations, then used as the informed prior in the probabilistic inversion.","au":["Johnathan C. Kuttai","Lindsey J. Heagy"],"v":"ASEG Extended Abstracts","u":"https://doi.org/10.63929/22020586.2026.1.053","p":"2026-10-21","d":"2026-10-26","s":5.7,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.63929/22020586.2026.1.053","who":[],"tz":"基于分割反演的生成流匹配先验用于不确定性量化","az":"本文提出了一种利用分割方法进行地球物理反演以构建概率反演中地质先验的框架。这些分割模型基于从确定性反演结果中学到的模式，将地下划分为具有不同物理属性的离散区域，从而生成用于假设检验的预期地质场景，即「概念」。为了对某一概念进行采样，训练一个生成模型来编码该概念及其变体，然后将其作为概率反演中的信息先验使用。","rv":"本文针对地球物理概率反演中的不确定性量化问题，利用分割方法将地下划分为不同物理属性的离散区域，生成地质「概念」，再训练生成模型编码该概念及其变体作为信息先验。方法核心是生成模型在地质反演中的应用，与「生成模型」类别有一定关联，但应用场景为地球物理，与有机分子晶体、视觉生成关系较弱。","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.57760/sciencedb.016kt","t":"PhysCorr-Dataset","a":"we propose PhysCorr, a unified framework for modeling, evaluating, and optimizing physical consistency in text-to-video generation. Building upon this reward signal, we develop PhyDPO, a physics-specialized direct preference optimization paradigm that leverages contrastive feedback and physics-aware reweighting to guide generation toward physically coherent outputs. Our proposed PhysCorr is model-agnostic and scalable, enabling seamless integration with a wide range of diffusion-based and transformer-based video generation backbones. Extensive experiments across multiple benchmarks demonstrate that PhysCorr substantially improves physical realism while preserving visual fidelity and semantic alignment.","au":["Peiyao Wang"],"v":"ScienceDB","u":"https://doi.org/10.57760/sciencedb.016kt","p":"2026-10-19","d":"2026-10-26","s":5.7,"tp":["vision-gen"],"kw":["video generation","text-to-video"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.57760/sciencedb.016kt","who":[],"tz":"PhysCorr-Dataset","az":"我们提出PhysCorr，一个用于建模、评估和优化文本到视频生成中物理一致性的统一框架。基于该奖励信号，我们开发了PhyDPO，一种物理专用的直接偏好优化范式，利用对比反馈和物理感知重加权来引导生成趋向物理连贯的输出。我们提出的PhysCorr是模型无关且可扩展的，能够与广泛的基于扩散模型和基于Transformer的视频生成骨干无缝集成。在多个基准上的大量实验表明，PhysCorr在保持视觉保真度和语义对齐的同时，显著提升了物理真实感。","rv":"该工作针对文本到视频生成中的物理一致性问题，提出PhysCorr统一框架与PhyDPO偏好优化方法，核心是构建物理一致性奖励信号，再以对比反馈和物理感知重加权引导扩散或Transformer视频生成模型。与「视觉生成」关系最近，属视频生成中物理约束优化方向，与有机分子晶体、生成模型、相关数学关系较弱。","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.17877/tudobooks-11.158","t":"Optimal-transport flow matching for stochastic model ipdating","a":"Deep generative models have attracted considerable attention as inference engines for stochastic model updating. Among these deep generative models, conditional flow matching offers a particularly efficient formulation, in which a continuous transport map from a latent distribution to the posterior is learned by regression against optimal-transport probability paths, avoiding both the invertibility constraints of normalising flows and the iterative denoising of diffusion models. However, its performance in engineering model updating has not been examined against an established baseline such as the Bayesian updating framework under controlled conditions. In this work, conditional flow matching is therefore assessed against the Bayesian model updating approach with transitional Markov chain Monte Carlo, in which the Bhattacharyya distance provides the approximate likelihood for the Bayesian approach. The two methods are assessed with respect to posterior fidelity, evaluated by statistical distances against the known ground truth and computational expenditure in model evaluations, with the offline training budget reported separately from the inference cost of each subsequent conditioning. A 3-DOF spring–mass system with uncertain stiffness parameters serves as the benchmark. Since the calibrated posterior constitutes the input description upon which subsequent reliability assessment depends, the accuracy and the marginal cost of the updating step both bear directly on reliability computations. In addition, the amortised nature of the learned transport map is discussed in this work, as it permits the posterior to be re-evaluated under new observations at negligible cost, which is a property of practical relevance to reliability assessment under sequentially acquired monitoring data.","au":["Tairan Wang","Sifeng Bi"],"v":"Technische Universität Dortmund Eldorado (Technische Universität Dortmund)","u":"https://doi.org/10.17877/tudobooks-11.158","p":"2026-12-01","d":"2026-10-26","s":5.7,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.17877/tudobooks-11.158","who":[],"tz":"最优传输流匹配用于随机模型更新","az":"深度生成模型作为随机模型更新的推理引擎已引起广泛关注。在这些深度生成模型中，条件流匹配提供了一种特别高效的表述形式，其中通过针对最优传输概率路径进行回归来学习从隐分布到后验的连续传输映射，从而避免了归一化流的逆约束和扩散模型的迭代去噪。然而，其在工程模型更新中的性能尚未在受控条件下与贝叶斯更新框架等已确立的基线进行过对比检验。因此，本工作将条件流匹配与采用过渡马尔可夫链蒙特卡洛的贝叶斯模型更新方法进行评估对比，其中Bhattacharyya距离为贝叶斯方法提供近似似然。两种方法从后验保真度（通过与已知真值之间的统计距离评估）和模型评估中的计算开销两方面进行评估，离线训练预算与每次后续条件化的推理成本分别报告。一个具有不确定刚度参数的三自由度弹簧-质量系统作为基准。由于校准后的后验构成后续可靠性评估所依赖的输入描述，更新步骤的精度和边际成本都直接影响可靠性计算。此外，本工作还讨论了所学习传输映射的摊销性质，因为它允许在新观测下以极低的成本重新评估后验，这一特性对于顺序获取监测数据条件下的可靠性评估具有实际意义。","rv":"条件流匹配（沿最优传输路径回归）用于工程结构随机模型更新，与贝叶斯MCMC在3-DOF弹簧-质量系统上对比后验保真度与计算成本，并讨论摊销推理。属生成模型（流匹配/最优传输）在贝叶斯推断中的应用，与生成模型类较近，与有机分子晶体、视觉生成关系弱。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.29475","t":"Density-Level Backward Error for Low-NFE Generative Flows","a":"Low-NFE generative ODE sampling is constrained not only by solver order, but also by how a fixed budget of network evaluations is distributed along the flow. We develop a density-level backward-error framework that identifies the component of a solver's modified-equation defect that changes the evolving marginal, while excluding solenoidal trajectory distortion that is invisible in Wasserstein tangent geometry. The resulting residual induces a solver-order-aware compute-allocation rule and, through gauge freedom, an objective for selecting numerically favorable velocity representatives of the same density path. This separates our approach from schedule search driven by trajectory or endpoint surrogates and from higher-order solver design. Exact Gaussian and mixture models establish the mechanism, including cases where curvature-based allocation fails and continuum-optimal transport is not discretization-optimal. On a pretrained CIFAR-10 EDM probability-flow ODE, density-aware allocation consistently improves fixed-update Euler sampling in the low-NFE regime. Matched-seed convergence to a dense Euler reference confirms that the method accelerates approximation of the same high-NFE flow rather than changing the asymptotic sampler.","au":["Ewsey Obzherin","Valentin Khrulkov"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29475","p":"2026-10-21","d":"2026-10-26","s":5.6,"tp":["gen-math"],"kw":["optimal transport","probability flow","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29475","doi":"","who":[],"tz":"低NFE生成流中的密度层面后向误差","az":"低NFE（网络函数评估次数）生成式ODE采样不仅受求解器阶数的限制，还受固定网络评估预算沿流分布方式的影响。我们发展了一个密度层面的后向误差框架，该框架识别求解器修正方程缺陷中改变演化边缘分布的组分，同时排除在Wasserstein切几何中不可见的无散度轨迹畸变。由此产生的残差诱导了一个感知求解器阶数的计算分配规则，并通过规范自由度，为选择同一密度路径上数值上有利的速度代表提供了目标函数。这使我们的方法与由轨迹或端点代理驱动的调度搜索以及高阶求解器设计区分开来。精确的高斯模型和混合模型建立了该机制，包括基于曲率的分配失效以及连续最优传输并非离散化最优的情况。在预训练的CIFAR-10 EDM概率流ODE上，密度感知分配在低NFE区间内一致地改善了固定步长Euler采样。与密集Euler参考的匹配种子收敛性确认，该方法加速了对同一高NFE流的近似，而非改变渐近采样器。","rv":"本文针对生成式ODE采样中低NFE条件下的计算分配问题，提出密度层面后向误差分析框架，用以指导固定预算下沿流的计算分配策略。属于「生成模型」与数值ODE求解的交叉方向，涉及Wasserstein几何、最优传输等数学工具，与有机分子晶体、视觉生成无直接关系。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26262","t":"Dynamics-Aware Sparse Attention for Efficient Autoregressive Video Diffusion","a":"Autoregressive Diffusion Transformers have emerged as a powerful paradigm for long video generation. However, they are often constrained by prohibitive computational overhead and substantial memory footprints. This inefficiency arises from dense computation mechanisms that allocate uniform processing resources across all spatiotemporal regions, failing to leverage the inherent temporal redundancy of video where motion is typically confined to sparse areas. In this paper, we propose Dynamics-Aware Sparse Attention (DASA), a unified framework that shifts from dense computation to sparse, motion-driven generation to eliminate both storage and computational redundancies. Inspired by video codec principles, our approach explicitly decouples video content into dynamic and static regions. To mitigate memory bottlenecks, we selectively compress the historical KV cache by retaining only dynamic features within the generated chunk. Furthermore, to reduce computational overhead, we employ a region-level computation allocation strategy based on localized dynamics. Additionally, a dynamics-guided distillation method is introduced to enhance performance via a lightweight distillation training process. Experiments on VBench demonstrate that our approach accelerates autoregressive video generation by 2.16x, while preserving high visual fidelity.","au":["Yuanyu He","Zhuokun Chen","Yefei He","Zhiwei Tang","Jiasheng Tang","Yinghao Yu","Jianfei Cai","Bohan Zhuang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26262","p":"2026-10-19","d":"2026-10-26","s":5.4,"tp":["vision-gen"],"kw":["video generation","video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26262","who":[],"tz":"动态感知稀疏注意力用于高效自回归视频扩散","az":"自回归扩散Transformer已成为长视频生成的强大范式。然而，它们通常受到高昂计算开销和大量内存占用的限制。这种低效源于稠密计算机制在所有时空区域上均匀分配处理资源，未能利用视频固有的时间冗余性——运动通常局限于稀疏区域。本文提出动态感知稀疏注意力（DASA），一个统一框架，将稠密计算转变为稀疏的、运动驱动的生成，以消除存储和计算冗余。受视频编解码原理启发，我们的方法将视频内容显式解耦为动态区域和静态区域。为缓解内存瓶颈，我们通过仅保留生成块内的动态特征来选择性压缩历史KV缓存。此外，为降低计算开销，我们采用基于局部动态的区域级计算分配策略。另外，引入了一种动态引导的蒸馏方法，通过轻量级蒸馏训练过程来提升性能。在VBench上的实验表明，我们的方法将自回归视频生成加速了2.16倍，同时保持了高视觉保真度。","rv":"本文针对自回归视频扩散模型的计算与内存瓶颈，提出DASA框架，将视频显式分为动态与静态区域，通过稀疏KV缓存压缩和区域级计算分配加速生成。属于视觉生成（视频生成）方向，核心是注意力稀疏化与运动感知计算调度，与有机分子晶体、文本或分子生成模型、相关数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.30926","t":"Making MLLM Latents Matter: Factor-Aware Predictive Learning for Cinematic Video Generation","a":"Cinematic video generation requires both temporal inference from limited inputs (i.e., sparse rather than frame-by-frame guidance) and factor-aware control of character, scene, action, and camera. Multimodal large language models (MLLMs) offer useful priors for both capabilities, but their representations are not automatically actionable for video generation: a Video Diffusion Transformer (DiT) may bypass them through native conditioning pathways, and using them does not ensure either factor-aware control or generation-compatible temporal prediction. We propose Factor-Aware Predictive Learning (FAPL), which establishes effective MLLM latent use as a shared prerequisite and then targets the two capabilities with complementary learning signals. First, latent-only generator grounding trains the DiT with a frozen MLLM and connector, strengthening the DiT's use of MLLM latents for generation. Second, for factor-aware control, paired videos specify a target-factor change and non-target preservation, and factor-span replacement trains the DiT to realize this relationship in its output. Third, for temporal inference, text-only and text-plus-complete-video observations share a video target, and the trained DiT is then frozen while the MLLM and connector are optimized through it. This final stage trains limited-input representations for generation while retaining complete-observation reconstruction as a complementary training mode. Extensive experiments demonstrate our consistently better performance on three cinematic video generation tasks (i.e., sparse-to-video, factor-aware editing, and multi-shot generation) over baselines and validate FAPL's contributions to MLLM feature use, temporal control, and factor coordination.","au":["Songlin Yang","Zhe Wang","Xiaotong Zhao","Xi Wang","Ran Zhang","Shuai Li","Taiyi Wu","Songlian Li","Eric Liu","Alan Zhao"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30926","p":"2026-10-22","d":"2026-10-26","s":5.4,"tp":["vision-gen"],"kw":["video generation","video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30926","who":[],"tz":"让MLLM隐变量发挥作用：面向电影级视频生成的因子感知预测学习","az":"电影级视频生成既需要从有限输入（即稀疏而非逐帧引导）中进行时间推理，又需要对角色、场景、动作和镜头进行因子感知控制。多模态大语言模型（MLLMs）为这两种能力提供了有用的先验，但其表示并不能自动用于视频生成：视频扩散Transformer（DiT）可能通过原生条件路径绕过它们，而使用它们并不能保证因子感知控制或生成兼容的时间预测。我们提出因子感知预测学习（FAPL），将有效的MLLM隐变量利用作为共享前提，然后用互补的学习信号针对两种能力。首先，仅隐变量生成器接地训练DiT，使用冻结的MLLM和连接器，增强DiT在生成中对MLLM隐变量的利用。其次，对于因子感知控制，成对视频指定目标因子的变化和非目标因子的保持，因子跨度替换训练DiT在其输出中实现这种关系。第三，对于时间推理，仅文本和文本加完整视频的观测共享一个视频目标，然后训练好的DiT被冻结，而MLLM和连接器通过它进行优化。这一最终阶段训练有限输入的表示用于生成，同时保留完整观测重建作为互补训练模式。大量实验表明，在三个电影级视频生成任务（即稀疏到视频、因子感知编辑和多镜头生成）上，我们的方法相比基线方法始终表现更优，并验证了FAPL对MLLM特征利用、时间控制和因子协调的贡献。","rv":"FAPL面向电影级视频生成，通过隐变量接地、因子跨度替换和时间推理优化三阶段训练，使视频扩散Transformer有效利用MLLM隐变量，实现稀疏输入下的时间推理及角色、场景、动作、镜头的因子感知控制。与「视觉生成」和「生成模型」最为接近，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26000","t":"PnP-CF: A Consensus Flow-Matching Solver for General Inverse Problems","a":"Plug-and-Play (PnP) methods using continuous-time deep generative models as learned data distribution priors enable synthesizing high-quality solutions of model-based inverse problems. The quality of the solutions depends critically on the interplay and consensus between the inverse problem solver and the generative model sampler. We revisit a recently introduced flow-based PnP framework, which we refer to as PnP-CF (Consensus Flow), and extend its application to nonlinear inverse problems, including those with learned neural-network forward operators. PnP-CF combines a flow-matching denoiser with (i) ADMM-like dual variable updates and (ii) a time-adaptive pullback onto the intermediate flow probability path that combines a stochastic and a deterministic component. We discuss how these two features stabilize the algorithm and promote consensus, and demonstrate on a set of experiments that PnP-CF not only solves standard linear inverse problems with quality at least comparable to state-of-the-art baselines, but also extends gracefully to nonlinear inverse problems, including forward operators realized by pretrained neural networks, for which existing methods produce unsatisfactory results or fail completely.","au":["Dibyanshu Kumar","Magda Gregorová"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26000","p":"2026-10-19","d":"2026-10-26","s":5.3,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26000","who":[],"tz":"PnP-CF：面向一般逆问题的一致性流匹配求解器","az":"使用连续时间深度生成模型作为学习数据分布先验的即插即用（PnP）方法能够合成基于模型的逆问题的高质量解。解的质量关键取决于逆问题求解器与生成模型采样器之间的相互作用与一致性。我们重新审视了一个近期提出的基于流的 PnP 框架，将其称为 PnP-CF（一致性流），并将其应用扩展到非线性逆问题，包括那些具有学习得到的神经网络前向算子的问题。PnP-CF 将流匹配去噪器与（i）类 ADMM 对偶变量更新以及（ii）一种时间自适应的拉回机制相结合，该拉回机制作用于中间流概率路径，并融合了随机与确定性两个分量。我们讨论了这两个特征如何稳定算法并促进一致性，并通过一组实验证明 PnP-CF 不仅能以至少与最先进基线相当的质量求解标准线性逆问题，还能优雅地扩展到非线性逆问题，包括由预训练神经网络实现的前向算子，而现有方法对此类问题往往产生不令人满意的结果或完全失败。","rv":"本文属于逆问题求解与生成模型的交叉方向。PnP-CF 将流匹配去噪器与 ADMM 对偶更新及时间自适应拉回机制结合，用于求解线性及非线性逆问题。与「生成模型」关系较近，具体是流匹配生成模型作为先验嵌入逆问题求解流程；与「有机分子晶体」和「视觉生成」关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.28801","t":"JUICE: Unified Multimodal Modeling in Pretrained Representation Spaces","a":"Most unified multimodal models treat images and text asymmetrically: a pretrained language model generates text, an attached diffusion head generates images, and outputs that contain both are produced in a fixed order, so the first output cannot adapt to the second. We ask whether both modalities can instead be generated by one process that is trained on them jointly from scratch. Pretrained encoder spaces hold both modalities in one continuous form and carry knowledge learned at scale, and recent work finds them effective as generative targets for vision and language. We therefore model the joint distribution directly in these spaces. We introduce JUICE (Joint Unified multimodal modeling In Continuous Encoder spaces), a single flow matching Transformer over frozen image and text representations, in which each modality has its own noise level. Which modalities are clean and which are generated then decides the task: image generation, captioning, visual question answering, or joint generation. Controlled pretraining runs test each design choice. At equal guidance, generating text as continuous states leaves image generation intact (48.41 GenEval, against 47.86 for a model trained only for text-to-image generation), while captions lose some exact wording. Training on joint and conditional denoising together beats either alone, and semantic encoder spaces beat VAE latents and raw pixels as targets. At 2.1B parameters, with no language model initialization and at 224x224, JUICE reaches up to 0.88 on GenEval and 73.1 on VQAv2. By sampling both modalities from the joint distribution (coupled sampling), it can also draw a route on a map while writing out the matching moves. On mazes with several valid solutions, joint success rises from 54.6% with independent sampling to 93.7%, and no modality has to go first. On visual spatial planning, JUICE solves 99.8% of maps at its training sizes.","au":["Jiahan Li","Huangyuan Su","Shengbang Tong","Shusheng Yang","Ruihan Guo","Suozhi Huang","Hexu Zhao","Pratyusha Sharma","Sherry Yang","Jiatao Gu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28801","p":"2026-10-20","d":"2026-10-26","s":5.2,"tp":["vision-gen"],"kw":["image generation","text-to-image"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.28801","who":[],"tz":"JUICE：预训练表示空间中的统一多模态建模","az":"大多数统一多模态模型对图像和文本的处理是不对称的：一个预训练语言模型生成文本，一个附加的扩散头生成图像，同时包含两者的输出以固定顺序产生，因此第一个输出无法适应第二个输出。我们提出一个问题：是否可以用一个从头开始联合训练的过程来同时生成两种模态。预训练编码器空间将两种模态以统一的连续形式容纳其中，并携带大规模学习获得的知识，近期工作发现它们作为视觉和语言的生成目标是有效的。因此，我们直接在这些空间中建模联合分布。我们提出 JUICE（Joint Unified multimodal modeling In Continuous Encoder spaces，连续编码器空间中的联合统一多模态建模），一个在冻结的图像和文本表示上的单一流匹配 Transformer，其中每种模态拥有各自的噪声水平。哪些模态是干净的、哪些是生成的，由此决定任务：图像生成、图像描述、视觉问答或联合生成。受控的预训练实验检验了每个设计选择。在相同引导强度下，将文本作为连续状态生成不会损害图像生成（GenEval 48.41，而仅针对文本到图像生成训练的模型为 47.86），但描述会失去一些精确措辞。联合去噪和条件去噪一起训练优于单独使用其中任何一种，语义编码器空间作为目标优于 VAE 潜变量和原始像素。在 21 亿参数、不使用语言模型初始化、分辨率 224×224 的条件下，JUICE 在 GenEval 上达到 0.88，在 VQAv2 上达到 73.1。通过从联合分布中同时采样两种模态（耦合采样），它还可以在地图上绘制路线的同时写出对应的移动步骤。在存在多个有效解的迷宫上，联合成功率从独立采样的 54.6% 提升至 93.7%，且无需任何模态先行。在视觉空间规划任务上，JUICE 在其训练尺寸下解决了 99.8% 的地图。","rv":"JUICE 在冻结的预训练图像与文本编码器空间中，用单一流匹配 Transformer 联合建模两种模态分布，通过设定各模态噪声水平切换任务。实际实现了图像生成、描述、视觉问答及联合生成，并在耦合采样下完成地图路径规划。与「生成模型」和「视觉生成」最为接近，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32381","t":"UniWorld: A Unified World Model for Real-Time Visual World Simulation","a":"Continuous visual world simulation requires coupling evolving scene geometry with temporally persistent appearance. We present UniWorld, a unified framework that integrates depth trajectories and reference appearance within a shared video generation model. The central design maintains visual and geometric histories on a common timeline. Noise-aligned overlapping continuation places generated history at the prescribed sampling noise level and commits only newly generated latents. Rolling depth latent state preserves the corresponding geometric controls, incrementally reads newly available geometry, and keeps the conditioning fixed within each sampling window. Together, these mechanisms ensure exact preservation of latent history while bounding the active depth state by the window size. We evaluate continuous generation, paired history interventions, and long-horizon behavior across diverse scene categories. The same generator supports estimated, native, and on-demand simulator depth, while cached and incremental execution paths produce bitwise-identical outputs. Appearance changes and geometric control branches operate through the same interface without modifying committed history. The measured steady-state DiT execution path achieves real-time generation throughput, demonstrating the efficiency of UniWorld for continuous visual world simulation.","au":["Xin Zhang","Yabo Chen","Shuaiwei Wang","Zixuan Duan","Haibin Huang","Feng Xu","Xuelong Li"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32381","p":"2026-10-23","d":"2026-10-26","s":5.2,"tp":["vision-gen"],"kw":["video generation","world model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32381","doi":"","who":[],"tz":"UniWorld：面向实时视觉世界模拟的统一世界模型","az":"连续视觉世界模拟需要将不断演化的场景几何与时间上持续的外观耦合起来。我们提出 UniWorld，一个统一框架，在共享的视频生成模型中整合深度轨迹与参考外观。其核心设计在统一的时间轴上维护视觉与几何历史。噪声对齐的重叠续延将已生成的历史置于规定的采样噪声水平，并仅提交新生成的潜变量。滚动深度潜状态保留对应的几何控制，增量读取新可用的几何信息，并在每个采样窗口内保持条件不变。这些机制共同确保潜历史的精确保留，同时将活跃深度状态限制在窗口大小之内。我们在多种场景类别上评估了连续生成、成对历史干预以及长时程行为。同一生成器支持估计深度、原生深度和按需模拟器深度，而缓存执行路径与增量执行路径产生逐位相同的输出。外观变化与几何控制分支通过同一接口操作，且不修改已提交的历史。实测的稳态 DiT 执行路径实现了实时生成吞吐量，展示了 UniWorld 在连续视觉世界模拟中的效率。","rv":"该工作提出 UniWorld，将深度轨迹与参考外观统一嵌入共享视频生成模型，用于连续视觉世界模拟。核心机制为噪声对齐的重叠续延与滚动深度潜状态，保证潜历史精确保留且活跃状态有界。属于视觉生成与视频生成方向，和生成模型关系密切，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29177","t":"ROCOCO: Robust Outline Completion of Occluded Curvilinear Objects","a":"We propose a learning-based generative model for completing curvilinear features under occlusion by environmental obstacles. To this end, we adopt a flow matching-based approach that supports the inpainting of occluded regions with the appropriate curvilinear features. To eliminate the reliance on privileged information about the occlusion a priori, we also train a UNet-based mask prediction model, which can identify regions for inpainting given only the occluded observation. The components of our approach are validated via experiments using procedurally-generated test cases, and the complete pipeline is validated using large public datasets for curvilinear objects. Against off-the-shelf inpainting baselines, ROCOCO is the strongest method by a wide margin when no occlusion mask is given, and is competitive with mask-supervised inpainting when one is, achieving best on full-image error and second only to LaMa on the occluded region, while using a completer of $7.7$M parameters against LaMa's $51$M and Stable Diffusion's $860$M.","au":["Ken Zheng","Jaimyn Drake"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29177","p":"2026-10-21","d":"2026-10-26","s":4.7,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.29177","who":[],"tz":"ROCOCO：被遮挡曲线物体的鲁棒轮廓补全","az":"我们提出了一种基于学习的生成模型，用于在环境障碍物遮挡下补全曲线特征。为此，我们采用了一种基于流匹配的方法，该方法支持用适当的曲线特征对遮挡区域进行修复。为了消除对遮挡先验特权信息的依赖，我们还训练了一个基于 UNet 的掩码预测模型，该模型仅凭被遮挡的观测即可识别需要修复的区域。我们方法中的各组件通过程序化生成的测试用例实验进行了验证，完整流程则使用曲线对象的大型公开数据集进行了验证。与现成的修复基线相比，在未提供遮挡掩码时，ROCOCO 以较大优势成为最强方法；在提供掩码时，它与掩码监督修复方法具有竞争力，在全图误差上取得最佳，在遮挡区域上仅次于 LaMa，同时其补全器仅使用 770 万参数，而 LaMa 为 5100 万，Stable Diffusion 为 8.6 亿。","rv":"基于流匹配的曲线特征补全模型，针对环境遮挡下的曲线轮廓修复。用 flow matching 做遮挡区域 inpainting，另训 UNet 掩码预测器免去先验遮挡信息。属视觉生成中的图像修复方向，与有机分子晶体、生成模型及纯数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32256","t":"Representation Learning via Composite Subspace Flow Matching","a":"Distilling semantic meaning from raw image data remains a challenge in machine learning. Current self-supervised paradigms face a trade-off: joint-embedding architectures produce relevant features by aggressively discarding intra-class variance, irreversibly spatial and reconstruction. Conversely, generative models preserve spatial details but struggle to isolate semantics, as their optimization is dominated by pixel variations. To bridge this divide, we propose composite subspace flow matching (CSFM). Rather than corrupting data with unstructured isotropic noise, CSFM formulates representation learning as the variance-minimizing inversion of a deterministic degradation curriculum across spectral, color, and illumination subspaces. By bounding trajectory variance with hard temporal style truncation, a capacity-constrained encoder is driven to ignore transient style artifacts and encode persistent content. Empirical evaluations across CIFAR-10, CIFAR-100, and STL-10 show that CSFM yields competitive discriminative transferability while preserving generative synthesis across both convolutional and vision transformer architectures. By avoiding the collapse pathologies of non-generative methods, CSFM forms a smooth latent space that outperforms standard optimal transport flows on linear probing and few-shot classification, while enabling coherent synthesis and trajectory interpolation. These results confirm that steering the physical dynamics of generative flows offers a scalable paradigm for learning representations that are simultaneously linearly separable and generatively invertible.","au":["José Afonso","Mário Figueiredo"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32256","p":"2026-10-23","d":"2026-10-26","s":4.4,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32256","doi":"","who":[],"tz":"基于复合子空间流匹配的表示学习","az":"从原始图像数据中提炼语义信息仍然是机器学习领域的一项挑战。当前自监督范式面临一个权衡：联合嵌入架构通过激进地丢弃类内方差来产生相关特征，但不可逆地丧失了空间信息和重建能力。相反，生成模型保留了空间细节，但难以分离语义，因为其优化过程被像素变化所主导。为了弥合这一鸿沟，我们提出了复合子空间流匹配（CSFM）。CSFM 不使用无结构的各向同性噪声来破坏数据，而是将表示学习表述为在光谱、颜色和光照子空间上对确定性退化课程进行方差最小化逆过程。通过硬性时间风格截断来约束轨迹方差，容量受限的编码器被驱动去忽略瞬态风格伪影并编码持久内容。在 CIFAR-10、CIFAR-100 和 STL-10 上的实证评估表明，CSFM 在卷积和视觉 Transformer 架构上均能产生有竞争力的判别性迁移能力，同时保留生成式合成能力。通过避免非生成方法的坍缩病理，CSFM 形成了一个平滑的潜空间，在线性探测和少样本分类上优于标准最优传输流，同时支持连贯合成和轨迹插值。这些结果证实，引导生成流的物理动力学为学习同时具有线性可分性和生成可逆性的表示提供了一个可扩展的范式。","rv":"CSFM 将自监督表示学习建模为在光谱、颜色、光照子空间上对确定性退化课程的方差最小化逆过程，以硬性时间风格截断约束轨迹方差，驱动容量受限编码器忽略瞬态风格、编码持久内容。在 CIFAR 系列和 STL-10 上验证了判别迁移与生成合成的兼顾。与「视觉生成」和「生成模型」关系较近，核心工具是流匹配与最优传输，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32941","t":"If at First You Don't Succeed, Backtrack: Lightweight Recovery for Frozen VLAs","a":"Vision-Language-Action (VLA) models perform well on robotic manipulation, yet remain brittle once their own actions carry them into states their training data barely covers. Recovering from such failures usually requires recovery demonstrations, policy retraining, or a separate model at inference time. We introduce Backtrack, a lightweight failure detection and recovery mechanism for frozen VLAs that needs none of these. A small failure prediction head, trained only on outcome-labeled rollouts of the frozen policy, reads the VLA's existing internal representations to estimate whether the current episode will fail. When the predicted failure probability exceeds a threshold, a controller pauses the policy, retraces the arm's recently achieved motion, and hands control back to the unchanged policy so it can retry from an earlier configuration. The head adds only 0.48-0.88% to the policy's parameter count. We evaluate Backtrack on LIBERO with three VLAs spanning two action-generation families: SmolVLA and $π$0.5, which use flow-matching action experts, and the autoregressive $π$0-FAST. On LIBERO-Long, the suite of long-horizon multi-step tasks and the one on which all three policies fail most often, Backtrack reduces each policy's failure rate by 19-48%, raising success by up to 7.4 percentage points; on the three shorter suites, where control success is already 85-99%, its effect is smaller. On MetaWorld, all twelve controller configurations tested with SmolVLA improve on the unassisted policy.","au":["Thomas Landeg","Thierry Tambe"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32941","p":"2026-10-23","d":"2026-10-26","s":4.2,"tp":["gen-model"],"kw":["autoregressive","flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32941","doi":"","who":[],"tz":"若首次未成功，则回溯：面向冻结VLA的轻量级恢复机制","az":"视觉-语言-动作（VLA）模型在机器人操作上表现良好，但一旦其自身动作将系统带入训练数据几乎未覆盖的状态，便变得脆弱。从此类失败中恢复通常需要恢复演示、策略重训练，或在推理时使用一个独立模型。我们提出Backtrack，一种面向冻结VLA的轻量级失败检测与恢复机制，无需上述任何一项。一个小型失败预测头，仅在冻结策略的结果标注轨迹上训练，读取VLA已有的内部表征来估计当前回合是否会失败。当预测的失败概率超过阈值时，一个控制器暂停策略，回溯机械臂近期已完成的运动，并将控制权交还给未修改的策略，使其能从较早的构型重试。该预测头仅增加策略参数量的0.48%至0.88%。我们在LIBERO上用三个VLA评估Backtrack，涵盖两种动作生成家族：使用流匹配动作专家的SmolVLA和π0.5，以及自回归的π0-FAST。在LIBERO-Long（长时程多步任务套件，也是三个策略失败最频繁的套件）上，Backtrack将每个策略的失败率降低19%至48%，成功率最高提升7.4个百分点；在三个较短的套件上，控制成功率已达85%至99%，其效果较小。在MetaWorld上，与SmolVLA测试的所有十二种控制器配置均优于无辅助策略。","rv":"针对冻结VLA模型，提出Backtrack轻量失败恢复机制：训练极小预测头读取VLA内部表征判断回合是否将失败，超阈值后暂停策略、回溯机械臂近期运动、交还控制从较早构型重试。与「有机分子晶体 / 生成模型 / 视觉生成 / 相关数学」四类关系均弱，属机器人策略恢复问题，仅与生成模型在流匹配动作专家处有微弱关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1088/2632-2153/aeb69d","t":"Disentangling total-variance and signal-to-noise-ratio improves diffusion models","a":"Diffusion models have been widely adopted as a powerful generative framework across numerous scientific domains, yet their inherently iterative sampling process remains a significant computational bottleneck. While this is typically mitigated by reducing the number of reverse diffusion steps, sample quality becomes highly sensitive to the chosen noise schedule, i.e., the manner in which noise is introduced and the signal is reduced at each step. Although prior work has improved on the original variance-preserving and variance-exploding schedules, these approaches passively adjust the total variance, without direct independent control over it. In this work, we propose a novel total-variance/signal-to-noise-ratio disentangled (TV/SNR) framework, where TV and SNR can be controlled independently. Our approach reveals that schedules with exponentially exploding TV can be consistently improved by adopting a constant TV schedule while preserving the underlying SNR schedule. Furthermore, we demonstrate that generalizing the SNR schedule of optimal transport flow matching significantly enhances generation efficiency. Crucially, these gains remain consistent across various reverse diffusion solvers and reduce the search space to two independent and interpretable parameters, enabling fast and robust sampling for complex scientific applications, such as molecular structure generation.","au":["Khaled Kahouli","Winfried Ripken","Stefan Gugler","Oliver T. Unke","Klaus‐Robert Müller","Shinichi Nakajima"],"v":"Machine Learning Science and Technology","u":"https://doi.org/10.1088/2632-2153/aeb69d","p":"2026-10-20","d":"2026-10-26","s":4.1,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1088/2632-2153/aeb69d","who":[],"tz":"解耦总方差与信噪比改进扩散模型","az":"扩散模型已被广泛采用为众多科学领域中强大的生成框架，但其固有的迭代采样过程仍然是显著的计算瓶颈。虽然这通常通过减少反向扩散步数来缓解，但样本质量对所选择的噪声调度（即噪声引入和信号衰减的方式）变得高度敏感。尽管先前工作改进了原始的方差保持和方差爆炸调度，但这些方法只是被动地调整总方差，而无法对其进行直接的独立控制。在本工作中，我们提出了一种新颖的总方差/信噪比解耦（TV/SNR）框架，其中总方差和信噪比可以被独立控制。我们的方法揭示，具有指数爆炸总方差的调度可以通过采用恒定总方差调度来一致地改进，同时保留底层的信噪比调度。此外，我们证明泛化最优传输流匹配的信噪比调度能显著提升生成效率。关键的是，这些增益在各种反向扩散求解器中保持一致，并将搜索空间缩减为两个独立且可解释的参数，从而为复杂科学应用（如分子结构生成）实现快速且鲁棒的采样。","rv":"本文针对扩散模型噪声调度问题，提出TV/SNR解耦框架，将总方差与信噪比拆为两个独立可控参数，发现恒定TV调度可一致优于指数爆炸TV调度，并泛化了最优传输流匹配的SNR调度以提升采样效率。属于生成模型方向，核心贡献在扩散采样调度的数学结构上，与视觉生成和分子结构生成均有应用关联，与有机分子晶体无直接关系。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.32966","t":"ViT-H: Generative Video-To-Humanoid Control with Motion Tracking Feedback","a":"Learning humanoid control from monocular human videos offers a scalable way to acquire diverse whole-body behaviors. Yet, existing reconstruction-retargeting-tracking pipelines are limited in system-level scalability by separately optimized intermediate stages and cannot directly optimize reference motion executability using downstream tracking feedback. We present ViT-H, a video-to-humanoid control framework following a generation-and-tracking paradigm. ViT-H directly generates humanoid reference motions from videos with a diffusion model, bypassing human motion reconstruction and retargeting, and uses motion-tracking outcomes to post-train the generator with direct preference optimization. We further introduce an autoregressive variant that enables real-time humanoid video teleoperation with sub-400 ms latency. Extensive experiments on the Unitree G1 demonstrate that ViT-H outperforms state-of-the-art reconstruction-retargeting-tracking pipelines in both motion quality and executability. We further show that ViT-H scales favorably with model size and with both pre-training and post-training data scale, while motion-tracking feedback consistently improves executability across different motion trackers.","au":["Zimo He","Tianyi Bian","Zizhong Yang","Hongjie Li","Nan Jiang","Jieming Cui","Baoxiong Jia","Yizhou Wang","Siyuan Huang","Yixin Zhu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32966","p":"2026-10-23","d":"2026-10-26","s":4.0,"tp":["gen-model"],"kw":["diffusion model","autoregressive"],"src":["arxiv"],"kind":"preprint","ax":"2610.32966","doi":"","who":[],"tz":"ViT-H：基于运动跟踪反馈的生成式视频到人形机器人控制","az":"从单目人类视频中学习人形机器人控制提供了一种可扩展地获取多样化全身行为的方式。然而，现有的重建-重定向-跟踪流水线由于中间阶段各自独立优化而在系统级可扩展性上受到限制，且无法利用下游跟踪反馈直接优化参考动作的可执行性。我们提出 ViT-H，一个遵循生成与跟踪范式的视频到人形机器人控制框架。ViT-H 使用扩散模型直接从视频中生成人形机器人参考动作，绕过人类动作重建和重定向，并利用运动跟踪结果通过直接偏好优化对生成器进行后训练。我们进一步引入一个自回归变体，实现低于 400 毫秒延迟的实时人形机器人视频遥操作。在 Unitree G1 上的大量实验表明，ViT-H 在动作质量和可执行性两方面均优于最先进的重建-重定向-跟踪流水线。我们进一步表明，ViT-H 随模型规模以及预训练和后训练数据规模的增大而良好扩展，同时运动跟踪反馈在不同运动跟踪器上均能一致地提升可执行性。","rv":"ViT-H 用扩散模型从单目视频直接生成人形机器人参考动作，再以跟踪反馈做 DPO 后训练，将多阶段流水线压缩为生成加跟踪两步，并引入自回归变体实现实时遥操作。方法核心是扩散生成加偏好优化，与「生成模型」较近，输入端涉及视频理解故与「视觉生成」有交叉，与「有机分子晶体」无关，与「相关数学」关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.27986","t":"Recast the Past: Stable Long Video Generation with Full Context Memory","a":"Long-horizon video generation requires retaining an ever-expanding history, but conditioning on its growing token sequence is costly. Existing methods restrict or compress historical context, potentially losing information needed for future generation. This work proposes ReCam, which groups local spatiotemporal blocks of historical latents into vectors and projects them directly into the high-dimensional hidden space of a Diffusion Transformer. The model learns to use the resulting memory tokens through native self-attention, reducing token count while retaining block-level access to the full history. To mitigate temporal drift during autoregressive rollout, we further introduce dual-pointer denoising with separate noise schedules for recent context and target frames. Among the evaluated methods, ReCam achieves the highest VBench-Long overall score of 80.1 and competitive static-scene revisitation performance on R2M-Bench. It also leads on all four consistency metrics for off-screen subject reappearance, including clothing consistency of 4.09 versus 3.03 for the best baseline.","au":["Yukuo Ma","Cong Liu","Junke Wang","Junqi Liu","Haibin Huang","Zuxuan Wu","Xuelong Li"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27986","p":"2026-10-20","d":"2026-10-26","s":3.9,"tp":["gen-model","vision-gen"],"kw":["diffusion transformer","autoregressive","video generation"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27986","who":[],"tz":"重塑过去：基于全上下文记忆的稳定长视频生成","az":"长时程视频生成需要保留不断扩展的历史，但以其不断增长的 token 序列作为条件代价高昂。现有方法限制或压缩历史上下文，可能丢失未来生成所需的信息。本文提出 ReCam，将历史潜变量中的局部时空块分组为向量，并直接投影到扩散 Transformer 的高维隐空间中。模型通过原生自注意力学习使用由此产生的记忆 token，在减少 token 数量的同时保留对完整历史的块级访问。为缓解自回归展开过程中的时间漂移，我们进一步引入双指针去噪，为近期上下文和目标帧设置独立的噪声调度。在评估的方法中，ReCam 取得了最高的 VBench-Long 综合得分 80.1，并在 R2M-Bench 上具有竞争力的静态场景重访性能。它还在所有四个画外主体重新出现的一致性指标上领先，包括服装一致性为 4.09，而最佳基线为 3.03。","rv":"本文提出 ReCam，将历史潜变量的时空块投影为记忆 token 注入扩散 Transformer 隐空间，并以双指针去噪缓解自回归时间漂移，面向长视频生成。属于视觉生成（视频扩散模型）方向，与有机分子晶体、分子生成模型关系较弱，核心是扩散模型在时序记忆建模上的架构改进。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29679","t":"Lifting PCA in the Wasserstein Space","a":"Principal Component Analysis (PCA) is a fundamental tool for statistical dimension reduction, yet no canonical extension to distribution-valued data has emerged within the framework of optimal transport. While Wasserstein barycenters and Wasserstein least-squares regression provide canonical liftings of Euclidean averaging and linear regression in the Wasserstein space, an analogous principle for PCA has remained unexplored. In this paper, we introduce Lifted PCA, a canonical extension of Euclidean PCA to Wasserstein space, obtained through the framework of lifting functionals in the space of probability measures by convex extension. Starting from the classical variational formulations of PCA on the Stiefel and Grassmann manifolds, we derive two equivalent minimization problems over probability measures supported on these manifolds that correspond to Wasserstein barycenters with generalized costs. We establish an exact analogue of the equivalence between the Stiefel and Grassmann formulations of Euclidean PCA, preserving PCA's original variational structure under lifting. We further derive dual formulations and optimality conditions, and establish equivalences with multimarginal optimal transport and matching-for-teams problems. We also establish statistical consistency for empirical estimators and develop computational algorithms based on the Wasserstein barycenter formulation over the Stiefel manifold. Whereas Euclidean PCA summarizes vectors through projections onto an optimal low-dimensional linear subspace, Lifted PCA summarizes probability distributions through an optimal probability measure supported on multiple low-dimensional subspaces. Numerical experiments on distributional datasets illustrate the practical performance of the proposed methodology and its benefits for distributional data analysis.","au":["Jérémie Bigot","Clément Bonet"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29679","p":"2026-10-21","d":"2026-10-26","s":3.9,"tp":["gen-math"],"kw":["optimal transport","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29679","doi":"","who":[],"tz":"在 Wasserstein 空间中提升 PCA","az":"主成分分析（PCA）是统计降维的基本工具，然而在最优化传输框架内，尚未出现面向分布值数据的规范推广。尽管 Wasserstein 质心和 Wasserstein 最小二乘回归分别为 Wasserstein 空间中欧氏平均和线性回归提供了规范提升，但 PCA 的类似原理一直未被探索。本文引入 Lifted PCA，即欧氏 PCA 到 Wasserstein 空间的规范推广，通过概率测度空间中泛函提升的凸延拓框架获得。从 PCA 在 Stiefel 流形和 Grassmann 流形上的经典变分表述出发，我们推导出关于支撑在这些流形上的概率测度的两个等价极小化问题，它们对应于具有广义代价的 Wasserstein 质心。我们建立了欧氏 PCA 的 Stiefel 表述与 Grassmann 表述之间等价性的精确等价性的类比，在提升下保持了 PCA 原有的变分结构。我们进一步推导了对偶表述和最优性条件，并建立了与多边缘最优传输及团队匹配问题的等价性。我们还建立了经验估计量的统计一致性，并开发了基于 Stiefel 流形上 Wasserstein 质心表述的计算算法。欧氏 PCA 通过向最优低维线性子空间的投影来概括向量，而 Lifted PCA 则通过支撑在多个低维子空间上的最优概率测度来概括概率分布。在分布数据集上的数值实验展示了所提方法的实际性能及其对分布数据分析的优势。","rv":"本文将欧氏 PCA 经凸延拓提升到 Wasserstein 空间，得到 Lifted PCA，核心是在 Stiefel 与 Grassmann 流形上求广义代价的 Wasserstein 质心，并给出对偶、最优性条件及算法。方法属最优传输与流形变分分析交叉，与有机分子晶体、生成模型、视觉生成均无直接关联，与「相关数学」最为接近。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.28318","t":"Stabilizing Filters for Graph Signal Generation","a":"Generating graph signals is an important task in machine learning, and incorporating the underlying graph into a generative model enables structurally-informed distribution modeling. However, said graph is often noisy or imperfectly estimated, and structural errors can affect the generative process and the resulting signal distribution. While recent work has established stability guarantees for graph neural ordinary differential equations, the robustness of graph-aware reference dynamics, as used in topological Schrödinger bridge models, remains largely unexplored. Here, we investigate the structural stability of continuous-time generative models whose dynamics combine a graph filter with a learned graph neural network. We first derive a Wasserstein stability bound that quantifies the effect of graph perturbations on the generated signal distributions. Informed by this analysis, we then propose a principled framework for designing graph filters that balance structural stability with induced signal smoothing. We characterize the optimal filter design and provide an explicit family of polynomial filters with provable stability guarantees. Experiments on synthetic graphs and real-world fMRI signals support our theoretical findings, illustrating the enhanced structural stability of the proposed filters while preserving generative performance.","au":["Martin Schmidt","Gonzalo Mateos"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28318","p":"2026-10-20","d":"2026-10-26","s":3.7,"tp":["gen-math"],"kw":["schrödinger bridge","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.28318","doi":"","who":[],"tz":"图信号生成的稳定化滤波器","az":"生成图信号是机器学习中的重要任务，将底层图结构纳入生成模型可以实现结构感知的分布建模。然而，该图往往存在噪声或估计不完美，结构误差可能影响生成过程及所得信号分布。尽管近期工作已为图神经常微分方程建立了稳定性保证，但拓扑薛定谔桥模型中所使用的图感知参考动力学的鲁棒性仍 largely 未被探索。本文研究一类连续时间生成模型的结构稳定性，其动力学由图滤波器与学习得到的图神经网络组合而成。我们首先推导了一个 Wasserstein 稳定性界，用以量化图扰动对生成信号分布的影响。基于该分析，我们进一步提出了一个有原则的框架，用于设计在结构稳定性与所诱导的信号平滑之间取得平衡的图滤波器。我们刻画了最优滤波器设计，并给出了一族具有可证明稳定性保证的显式多项式滤波器。在合成图和真实 fMRI 信号上的实验支持了我们的理论发现，表明所提滤波器在保持生成性能的同时增强了结构稳定性。","rv":"本文针对连续时间图信号生成模型，研究图滤波器在底层图存在结构扰动时的稳定性。核心工作是推导 Wasserstein 稳定性界，并据此设计一族具有可证明稳定性保证的多项式图滤波器，在合成图与 fMRI 数据上验证。与「生成模型」及「相关数学」（Wasserstein 几何、图信号处理）关系较近，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29476","t":"Generative Modeling via Nonlinear Schrödinger Bridges and Branching Diffusions","a":"We propose a new generative modeling framework grounded in forward-backward partial differential equations (PDEs). These equations arise naturally in mean-field game (MFG) theory, and are closely related to nonlinear Schrödinger systems. Our main contribution is to reinterpret this connection within the setting of generative modeling and to develop an efficient numerical methodology for its practical implementation. Specifically, we derive and characterize a nonlinear extension of the classical Schrödinger bridge problem through a coupled system of PDEs, yielding a model we call SBNL (Schrödinger Bridge NonLinear). To compute its solution, we design a simulation algorithm based on branching diffusions and the probabilistic representation of semilinear PDEs. The resulting method is embarrassingly parallel, scalable to high dimensions, and applicable to a broad class of nonlinear interaction functionals. We validate the approach through numerical experiments, including recovery of the classical Schrödinger bridge, nonlinear extensions with convex penalties (Gross-Pitaevskii) as well as potential interaction terms, and high-dimensional generative tasks such as image synthesis on the MNIST and FFHQ human face dataset. Furthermore, the same framework embeds score-based generative modeling, diffusion models, and tractable gaussian Schrödinger bridges.","au":["Mathias Grau","Pierre Henry-Labordère"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29476","p":"2026-10-21","d":"2026-10-26","s":3.7,"tp":["gen-math"],"kw":["schrödinger bridge","score-based"],"src":["arxiv"],"kind":"preprint","ax":"2610.29476","doi":"","who":[],"tz":"基于非线性薛定谔桥与分支扩散的生成建模","az":"我们提出了一种基于前向-后向偏微分方程（PDE）的新型生成建模框架。这些方程自然地出现在平均场博弈（MFG）理论中，并与非线性薛定谔系统密切相关。我们的主要贡献是在生成建模的语境下重新诠释这一联系，并开发一种高效的数值方法以实现其实际应用。具体而言，我们通过一个耦合的PDE系统推导并刻画了经典薛定谔桥问题的非线性扩展，得到了我们称为SBNL（薛定谔桥非线性）的模型。为计算其解，我们设计了一种基于分支扩散和半线性PDE概率表示的模拟算法。所得方法具有天然的并行性，可扩展到高维空间，并适用于广泛的非线性交互泛函。我们通过数值实验验证了该方法，包括恢复经典薛定谔桥、带有凸惩罚项（Gross-Pitaevskii）以及势交互项的非线性扩展，以及高维生成任务，如在MNIST和FFHQ人脸数据集上的图像合成。此外，同一框架还嵌入了基于分数的生成建模、扩散模型以及可处理的gaussian薛定谔桥。","rv":"提出SBNL模型，将平均场博弈中的前向-后向PDE与薛定谔桥问题结合，用分支扩散算法求解非线性扩展，在MNIST和FFHQ上完成图像合成。方法本质是扩散生成模型的PDE化表述，与「生成模型」最接近，数学工具涉及半线性PDE的概率表示，与「相关数学」也有交叉。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.60882/cispa.34759659","t":"SplineFlow: Flow Matching for Dynamical Systems with B-Spline Interpolants","a":"Flow matching is an emerging, scalable generative framework for characterizing continuous normalizing flows with wide-range applications. However, state-of-the-art methods are not well-suited for modeling dynamical systems, as they construct conditional paths that are restricted to linear interpolants, a suboptimal supervision signal, which may not capture the system's underlying state evolution. Moreover, constructing unified paths to satisfy multi-marginal constraints across observations is challenging, since naïve higher-order polynomials tend to be unstable and oscillatory. To address these limitations, we introduce SplineFlow, a theoretically grounded flow matching algorithm that jointly models conditional paths across observations via B-spline interpolation. Specifically, SplineFlow exploits the smoothness and stability of B-spline bases to learn the complex underlying dynamics in a structured manner while ensuring the multi-marginal requirements are met. Comprehensive experiments across deterministic and stochastic dynamical systems under various configurations, as well as cellular trajectory inference tasks, demonstrate that SplineFlow outperforms existing baselines, especially when the underlying dynamics are of higher degree or in irregular sampling regimes.","au":["Santanu Rathod","Pietro Liò","Xiao Zhang"],"v":"CISPA Helmholtz Center","u":"https://doi.org/10.60882/cispa.34759659","p":"2026-10-23","d":"2026-10-26","s":3.7,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.60882/cispa.34759659","who":[],"tz":"SplineFlow：基于 B 样条插值的动力系统流匹配","az":"流匹配是一种新兴的、可扩展的生成框架，用于表征连续归一化流，具有广泛的应用。然而，现有最先进的方法并不适合建模动力系统，因为它们构建的条件路径被限制为线性插值，这是一种次优的监督信号，可能无法捕捉系统底层的状态演化。此外，构建满足跨观测多边缘约束的统一路径具有挑战性，因为朴素的高阶多项式往往不稳定且呈振荡性。为了解决这些局限性，我们提出了 SplineFlow，一个有理论基础的流匹配算法，通过 B 样条插值联合建模跨观测的条件路径。具体而言，SplineFlow 利用 B 样条基的平滑性和稳定性，以结构化方式学习复杂的底层动力学，同时确保满足多边缘约束要求。在确定性动力系统和随机动力系统各种配置下的全面实验，以及细胞轨迹推断任务，表明 SplineFlow 优于现有基线方法，尤其是在底层动力学为高阶或采样不规则的情况下。","rv":"SplineFlow 是流匹配生成模型的变体，用 B 样条插值替代线性插值来建模动力系统，解决多边缘约束下路径构造不稳定的问题。它属于生成模型范畴，核心贡献在条件路径的构造方式上，与有机分子晶体和视觉生成关系较弱，与生成模型及样条插值数学更近。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.32159","t":"Playing Bias: Epistemic Games for Interpreting Text-to-Image Models","a":"Text-to-image (T2I) systems do not merely render prompts; they circulate defaults for \"what X looks like,\" shaping recognition through pose, camera, costume, props, and setting. While technical audits quantify disparities, they rarely cultivate the literacy needed to argue how images assemble stereotypes and confer authority. This paper translates a three-stage, humanities-informed framework into a set of epistemic games that make this cultural work visible and debatable: Interpret (art-historical close looking with AI outputs), Interrogate (counter-intent prompting as artistic exploration), and Expose (creative misuse through paired prompts with a constant motif and a BiasSlot rule, in which only the bias cue varies). In a pilot with undergraduate fine-arts students, the games shifted discussion from impressionistic reactions to concise, warranted hypotheses grounded in visual evidence, supported by lightweight classroom instruments that enabled reproducibility and structured collaboration. We argue that such game-based approaches foster critical literacy across educational contexts, equipping learners to recognize, discuss, and contest how T2I models encode bias.","au":["Amalia Foka"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32159","p":"2026-10-23","d":"2026-10-26","s":3.5,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32159","doi":"","who":[],"tz":"偏见游戏：用于解读文本到图像模型的认识论游戏","az":"文本到图像（T2I）系统不仅仅是对提示词进行渲染；它们传播着关于「X 看起来是什么样」的默认设定，通过姿态、镜头、服装、道具和场景来塑造认知。虽然技术审计可以量化差异，但它们很少培养论证图像如何组装刻板印象并赋予权威所需的素养。本文将一个三阶段的、受人文科学启发的框架转化为一组认识论游戏，使这种文化运作变得可见且可辩论：解读（对 AI 输出进行艺术史式的细读）、追问（以反意图提示作为艺术探索）、揭露（通过成对提示进行创造性误用，其中包含一个恒定母题和一条 BiasSlot 规则，在该规则中只有偏见线索发生变化）。在一项面向本科美术学生的试点中，这些游戏将讨论从印象式反应转变为基于视觉证据的简洁且有据可依的假设，并辅以轻量级课堂工具，使可重复性和结构化协作成为可能。我们认为，此类基于游戏的方法能在各种教育情境中培养批判性素养，使学习者能够识别、讨论并质疑 T2I 模型如何编码偏见。","rv":"本文针对文本到图像生成模型的文化偏见，将人文框架转化为三阶段认识论游戏（解读、追问、揭露），在美术本科课堂做试点，引导学生从印象式反应转向基于视觉证据的假设。与「视觉生成」最接近，关注 T2I 输出的偏见编码与批判性素养培养，不涉及模型架构或数学推导。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32407","t":"TIE: Training-free CLIP Embedding Guidance for Compositional Text-to-Image Alignment","a":"Text-to-image (T2I) diffusion models have advanced notably, but still fail to satisfy prompt conditions, resulting in attribute mismatches and missing objects. These errors normally fall into two categories: concept loss, when an object or attribute (i.e., concept) goes missing, and concept confusion, when an attribute is assigned to the wrong object or multiple objects blend together. Recent studies suggest that these challenges are caused by the limited capacity of CLIP text encoder to capture fine-grained semantic details. Although several methods have been proposed, concept loss and concept confusion persist in recent T2I models when handling multi-object, multi-attribute prompts. In this paper, we conduct an embedding-level analysis to develop a training-free, inference-time solution for concept loss and concept confusion across CLIP-based T2I models. We find that (1) concepts mentioned later exhibit higher embedding entropy, reflecting less concentrated representations that are more often associated with concept loss, and (2) the first CLIP attention layer captures the strength of binding between each object and its attribute. Guided by our findings, we introduce TIE, a method that improves semantic alignment through a single text-embedding update. TIE addresses concept loss via entropy-aware singular value amplification and resolves concept confusion through interpolation-extrapolation binding based on CLIP attention scores, all in a training-free manner. Extensive experiments demonstrate that TIE enhances semantic fidelity in multi-concept scenarios with minimal sampling overhead. The project page is available at https://hong-sujung.github.io/TIE/.","au":["Sujung Hong","Tae Eun Choi","Youngjun Jun","Chanyong Yoon","Seong Jae Hwang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32407","p":"2026-10-23","d":"2026-10-26","s":3.5,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32407","doi":"","who":[],"tz":"TIE：免训练 CLIP 嵌入引导用于组合式文本到图像对齐","az":"文本到图像（T2I）扩散模型已取得显著进展，但仍无法充分满足提示词条件，导致属性错配和物体缺失。这些错误通常分为两类：概念丢失，即某个物体或属性（即概念）缺失；以及概念混淆，即属性被分配到错误的物体上，或多个物体融合在一起。近期研究表明，这些挑战源于 CLIP 文本编码器在捕捉细粒度语义细节方面的有限能力。尽管已提出若干方法，但在处理多物体、多属性提示词时，概念丢失和概念混淆在近期 T2I 模型中仍然存在。本文在嵌入层面进行分析，开发了一种免训练、推理时即可应用的解决方案，以解决基于 CLIP 的 T2I 模型中的概念丢失和概念混淆问题。我们发现：（1）后提及的概念表现出更高的嵌入熵，反映出表征不够集中，且更常与概念丢失相关联；（2）CLIP 的第一层注意力层捕捉了每个物体与其属性之间绑定的强度。基于上述发现，我们提出 TIE，一种通过单次文本嵌入更新来改善语义对齐的方法。TIE 通过熵感知的奇异值放大来解决概念丢失，通过基于 CLIP 注意力分数的插值-外推绑定来解决概念混淆，整个过程均为免训练。大量实验表明，TIE 在多概念场景中以极小的采样开销提升了语义保真度。项目页面见 https://hong-sujung.github.io/TIE/。","rv":"TIE 是免训练的推理时方法，针对 CLIP 基 T2I 扩散模型中多概念提示词的概念丢失与混淆。核心是对文本嵌入做单次更新：熵感知奇异值放大恢复缺失概念，第一层 CLIP 注意力分数做插值-外推绑定纠正属性错配。与视觉生成（T2I 扩散）直接相关，与生成模型有交叉，与有机分子晶体无关，与相关数学（SVD、注意力）弱关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29227","t":"Schrödinger-Bass Bridge Barycenter Models for Measure-Valued Data","a":"Barycenter models, based on stochastic and deterministic optimal transport bridges between probability measures, have proven to be useful for supervised and unsupervised learning for (probability) measure-valued data. In this paper, we utilize the directional asymmetry and dual drift-diffusion control arising in the recently proposed Schrödinger-Bass Bridge (SBB) between two measures, and propose \\textit{SBB-encoder}, \\textit{SBB-decoder}, \\textit{SBB-symmetric}, and \\textit{SBB-Markovian} barycenter
