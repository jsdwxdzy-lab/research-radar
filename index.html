 models. For each of these novel models, our first theoretical result establishes the existence of the SBB-barycenter under mild assumptions. Our second theoretical result characterizes the decoder SBB-barycenter of Gaussians where we show that for Gaussian input measures, the decoder formulation admits a Gaussian minimizer, reducing barycenter computation to a finite-dimensional optimization and yielding a compact algorithm. For general input measures, we derive a hybrid Wasserstein gradient particle descent scheme for all four formulations using the SBB dual representation. Finally, we utilize these algorithms for solving distributional-inverse/interpolation problems arising in the context of spatial images and single-cell RNA sequencing data, where we show that the SBB-decoder and Markovian barycenter allow us to interpolate between successive time points. Results show that our method outperforms existing barycenter models for measure interpolation and inference.","au":["Ngoc-Hai Nguyen","Thuan Nguyen","Prakash Ishwar","Shuchin Aeron"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29227","p":"2026-10-21","d":"2026-10-26","s":3.4,"tp":["gen-math"],"kw":["optimal transport","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29227","doi":"","who":[],"tz":"基于 Schrödinger-Bass 桥的测度值数据重心模型","az":"基于概率测度之间随机与确定性最优传输桥的重心模型，已被证明对（概率）测度值数据的有监督和无监督学习非常有用。在本文中，我们利用最近在两个测度之间提出的 Schrödinger-Bass 桥（SBB）中出现的方向不对称性和对偶漂移-扩散控制，提出了 SBB-encoder、SBB-decoder、SBB-symmetric 和 SBB-Markovian 重心模型。对于每个新型模型，我们的第一个理论结果在温和假设下建立了 SBB 重心的存在性。我们的第二个理论结果刻画了高斯分布的解码器 SBB 重心，我们证明对于高斯输入测度，解码器形式存在高斯极小化器，将重心计算归约为有限维优化问题，并给出一个紧凑算法。对于一般输入测度，我们利用 SBB 对偶表示为所有四种形式推导了一种混合 Wasserstein 梯度粒子下降方案。最后，我们利用这些算法解决空间图像和单细胞 RNA 测序数据中出现的分布逆问题与插值问题，其中我们表明 SBB-decoder 和 Markovian 重心允许我们在连续时间点之间进行插值。结果表明，我们的方法在测度插值和推断方面优于现有的重心模型。","rv":"基于 Schrödinger-Bass 桥的方向不对称性与对偶漂移-扩散控制，提出 encoder、decoder、symmetric、Markovian 四种测度重心模型，证明存在性，给出高斯情形有限维优化与一般情形混合 Wasserstein 梯度粒子下降算法，应用于空间图像及单细胞 RNA 测序的分布插值。与「相关数学」（最优传输、Schrödinger 桥、Wasserstein 几何）最接近，与生成模型有弱关联，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32373","t":"Past as State, Present as Attention: Persistent-State Blockwise Flow Matching for Long-Horizon Co-Speech Motion Generation","a":"Co-speech motion generation remains challenging over long horizons due to the need for temporal coherence and consistent style. Existing methods typically generate long motions segment by segment, either conditioning on a short seed of recent frames, which gradually drifts, or retaining ever-longer explicit histories, which are costly to maintain and hard to learn from limited data. We trace these limitations to a key asymmetry between past and present: past motion carries slowly varying style that should be compactly summarized, whereas the current segment exhibits fast-changing local dynamics that require fine-grained modeling. This asymmetry motivates a simple Past-As-State, Present-as-Attention principle for long-horizon co-speech motion generation. Following this principle, we propose PASPA, which summarizes past history with an inter-block persistent state and models the current segment with intra-block bidirectional self-attention. We instantiate PASPA within a blockwise flow matching framework, with multi-block supervision for effective training over variable histories, prefill-decode state caching for efficient rollout, and hybrid classifier-free guidance for enhanced history and speech conditioning. Extensive public-benchmark experiments show that PASPA achieves state-of-the-art FGD performance and preserves motion style across long-sequence generation.","au":["Yi Liu","Xiangyue Zhang","Jianfang Li","Jia Ma","Yisheng He","Jianqiang Ren"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32373","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32373","doi":"","who":[],"tz":"过去即状态、现在即注意力：面向长时间跨度语音伴随动作生成的持久状态块级流匹配","az":"语音伴随动作生成在长时间跨度上仍然具有挑战性，因为需要时间连贯性和风格一致性。现有方法通常逐段生成长动作，要么以最近帧的短种子为条件（会逐渐漂移），要么保留越来越长的显式历史（维护成本高，且难以从有限数据中学习）。我们将这些局限性归结为过去与现在之间的一个关键不对称性：过去的动作携带缓慢变化的风格，应当被紧凑地总结；而当前片段表现出快速变化的局部动态，需要细粒度建模。这种不对称性启发了一个简洁的「过去即状态、现在即注意力」原则，用于长时间跨度的语音伴随动作生成。遵循这一原则，我们提出PASPA，它通过块间持久状态总结过去历史，并通过块内双向自注意力建模当前片段。我们在块级流匹配框架中实现PASPA，采用多块监督以在可变历史上有效训练，采用预填充-解码状态缓存以实现高效展开，以及混合无分类器引导以增强历史和语音条件。大量公开基准实验表明，PASPA达到了最先进的FGD性能，并在长序列生成中保持了动作风格。","rv":"本文针对长时间跨度语音伴随动作生成中的风格漂移问题，提出PASPA框架：以块间持久状态紧凑总结过去风格，以块内双向自注意力精细建模当前局部动态，并在块级流匹配中结合多块监督与混合无分类器引导。属于生成模型与动作/视觉生成方向，与有机分子晶体关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32602","t":"Trajectory Matching: Discrete Flow Matching with Structured Actions","a":"The natural units of structured discrete generation are often not independent single-component edits but richer actions: attaching a fragment to a molecule, inserting a node together with an incident edge, or growing a hierarchy by adding a child. Yet most existing discrete flow matching methods (DFM) are restricted to independent component-wise edits over fixed-size states. This restriction stems from endpoint conditioning: endpoints fix the source and target during training but not the action sequence between them, making tractable conditional rates hard to define for complex actions that cannot be factorized component-wise. We propose trajectory matching, which conditions the flow on a full sequence of actions connecting the endpoints. This yields principled, simulation-free training targets for user-defined action spaces, including actions that change state size, modify multiple components, or depend on earlier actions. We prove that the resulting objective recovers the marginal flow and that trajectory matching strictly subsumes factorized DFM, while additionally capturing actions with prerequisite structure such as hierarchy growth or fragment-based molecule generation. Empirically, on tree and molecular graph generation, trajectory matching with domain-aligned actions matches or surpasses factorized DFM baselines (lifting MOSES validity from 92.8% to 99.2%) and transfers without retraining to substructure extension and linking. Trajectory matching enlarges the design space of discrete flow matching by turning the action vocabulary into a modeling choice. An interactive explanation of trajectory matching is available at https://niklaskemper.com/blog/trajectory-matching/.","au":["Niklas Kemper","Marten Lienen","David Lüdke","Stephan Günnemann"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32602","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32602","doi":"","who":[],"tz":"轨迹匹配：基于结构化动作的离散流匹配","az":"结构化离散生成的自然单元往往不是独立的单分量编辑，而是更丰富的动作：将片段连接到分子上、插入一个节点及其关联边、或通过添加子节点来扩展层级结构。然而，大多数现有的离散流匹配方法（DFM）仅限于对固定大小状态进行独立的逐分量编辑。这一限制源于端点条件化：端点在训练时固定了源和目标，但未固定它们之间的动作序列，使得对于无法逐分量分解的复杂动作，难以定义可处理的条件速率。我们提出轨迹匹配（trajectory matching），将流条件化于连接端点的完整动作序列上。这为用户自定义的动作空间提供了有原则的、无需仿真的训练目标，包括改变状态大小、修改多个分量或依赖于先前动作的动作。我们证明了所得目标函数能恢复边缘流，且轨迹匹配严格包含因子化DFM，同时还能捕获具有前置结构的动作，如层级扩展或基于片段的分子生成。在实验上，在树和分子图生成任务中，使用领域对齐动作的轨迹匹配达到或超越了因子化DFM基线（将MOSES有效性从92.8%提升至99.2%），并且无需重新训练即可迁移到子结构扩展和连接任务。轨迹匹配通过将动作词汇表转化为建模选择，扩大了离散流匹配的设计空间。轨迹匹配的交互式解释可在 https://niklaskemper.com/blog/trajectory-matching/ 获取。","rv":"提出轨迹匹配方法，将离散流匹配的条件从端点扩展为完整动作序列，支持改变状态大小、多分量修改等结构化动作。在分子图生成上MOSES有效性达99.2%，无需重训即可迁移至子结构扩展。与「生成模型」最接近，属离散分子生成方向；与有机分子晶体、视觉生成关系弱；数学上涉及边缘流恢复的严格证明。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1016/j.aei.2026.105389","t":"FrameDiT: A dual-stream conditional diffusion Transformer for component layout design of steel braced frame structures","a":"","au":["Jiang Li","Wei Wang","Yuqing Gao"],"v":"Advanced Engineering Informatics","u":"https://doi.org/10.1016/j.aei.2026.105389","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["diffusion transformer"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.aei.2026.105389","who":[],"tz":"FrameDiT：用于钢支撑框架结构构件布局设计的双流条件扩散Transformer","az":"","rv":"FrameDiT 是一种双流条件扩散 Transformer，面向钢支撑框架结构的构件布局设计。其核心思路是将条件扩散生成模型引入结构工程，以生成满足约束的构件布置方案。与「生成模型」类别最为接近，属于扩散模型在工程布局问题上的应用，与视觉生成或有机分子晶体关系较弱。","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.27068","t":"ASTROLABE: A 3D Particle-Level Surrogate for Cosmology Simulation with Physical Flow Matching","a":"The microphysics of dark matter (DM) is imprinted on cosmological structure across an enormous dynamic range. Nonlinear cosmological observables are most reliably modeled with N-body and hydrodynamic simulations. However, systematic N-body scans over DM theory space are prohibitively expensive. Machine learning emulators provide a possible solution, but are currently limited by either low resolution or only the ability to emulate specific observables. We introduce Astrolabe, a flow-matching-based generative emulator designed to be free of both constraints. Astrolabe acts directly on the 6N phase-space coordinates of N individual particles. With no voxel grid in the output, there is no voxel-resolution ceiling, and in principle any observable can be measured from inference. Astrolabe is computationally tractable via a field-particle hybrid transformer in which every particle cross-attends to multiscale field tokens, so compute and memory are linear in N. Astrolabe incorporates physical flow matching by taking the prior distribution for the flow to be approximate COmoving Lagrangian Acceleration (COLA)-based coordinates rather than unphysical noise, with momentum and mass conservation enforced at all points along flow time. In the Lambda-CDM cases we test, Astrolabe produces realistic fields with accurate power spectra, halo mass functions, velocity profiles, and halo density profiles. We also observe out-of-distribution generalization, with accurate emulation of dark-acoustic oscillation initial conditions. Astrolabe is also capable of being fine-tuned to simulate very large N and we demonstrate this by emulating a TNG50-3-dark simulation at a fraction of the cost.This method represents a first step toward a general and powerful cosmology simulation surrogate, which may eventually permit the inclusion of baryonic physics and a systematic exploration of richer dark sector interactions.","au":["Ibrahim Elsharkawy","David Y. Curtin","Yonatan F. Kahn","Neal Weiner"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27068","p":"2026-10-19","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27068","who":[],"tz":"ASTROLABE：基于物理流匹配的三维粒子级宇宙学模拟替代模型","az":"暗物质（DM）的微观物理特性在巨大的动态范围内印刻于宇宙学结构之上。非线性宇宙学观测量最可靠的建模方式是N体模拟和流体动力学模拟。然而，在暗物质理论空间上进行系统性N体扫描的代价高得令人望而却步。机器学习模拟器提供了一种可能的解决方案，但目前要么受限于低分辨率，要么只能模拟特定观测量。我们提出Astrolabe，一种基于流匹配的生成式模拟器，旨在摆脱上述两种限制。Astrolabe直接作用于N个独立粒子的6N维相空间坐标。由于输出中不包含体素网格，因此不存在体素分辨率上限，原则上可以从推理结果中测量任何观测量。Astrolabe通过一种场-粒子混合Transformer实现计算上的可行性，其中每个粒子对多尺度场标记进行交叉注意力，因此计算量和内存均与N呈线性关系。Astrolabe通过物理流匹配实现，将流的先验分布取为基于近似共动拉格朗日加速度（COLA）的坐标而非非物理噪声，并在流时间的所有点上强制满足动量守恒和质量守恒。在我们测试的Lambda-CDM情形中，Astrolabe生成了逼真的场，具有精确的功率谱、晕质量函数、速度剖面和晕密度剖面。我们还观察到分布外泛化能力，能够精确模拟暗声学振荡初始条件。Astrolabe还能够通过微调来模拟非常大的N，我们通过以极小的代价模拟TNG50-3-dark模拟来展示了这一点。该方法代表了迈向通用且强大的宇宙学模拟替代模型的第一步，最终可能允许纳入重子物理并系统探索更丰富的暗扇区相互作用。","rv":"基于物理流匹配的生成式模拟器Astrolabe，直接操作N个粒子的6N维相空间坐标，通过场-粒子混合Transformer让每个粒子对多尺度场标记做交叉注意力，计算与内存均与N线性。先验取COLA近似坐标而非非物理噪声，流时间全程强制动量与质量守恒。本质是流匹配生成模型应用于宇宙学N体模拟替代，与生成模型最相关，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26183","t":"HP-PnP-Flow: Hybrid Time Scheduling and Projection for Plug-and-Play Image Restoration via Flow Matching","a":"Image restoration is a fundamental inverse problem that seeks to recover high-quality images from degraded observations. Plug-and-Play (PnP) methods provide a flexible framework for integrating pretrained denoisers into iterative reconstruction, whereas flow matching offers an efficient generative modeling approach based on continuous-time ODE dynamics. Very recently, Martin et al.\\ (ICLR, 2025) developed a PnP-Flow method, which integrates the PnP framework with flow matching through a time-dependent denoiser constructed from a pretrained flow matching model.By incorporating a different time schedule and an additional pixel-space projection operator, this paper proposes a novel efficient PnP-Flow algorithm (HP-PnP-Flow) that enjoys rigorous convergence guarantees under mild assumptions, without imposing restrictive conditions on iterates required by the aforementioned work. Numerical experiments on CelebA and AFHQ-Cat demonstrate that the newly proposed HP-PnP-Flow algorithm significantly outperforms PnP-Flow on several restoration tasks such as denoising, deblurring, super-resolution, random inpainting, and box inpainting. Notably, our algorithm achieves comparable or better reconstruction quality with substantially fewer iterations, reducing the iteration count from $500$ to $100$ for deblurring and super-resolution on AFHQ-Cat.","au":["Yong Li","Xiaojie Wang","Xiaoyan Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26183","p":"2026-10-19","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26183","who":[],"tz":"HP-PnP-Flow：基于流匹配的混合时间调度与投影的即插即用图像恢复","az":"图像恢复是一个基本的逆问题，旨在从退化观测中恢复高质量图像。即插即用（PnP）方法为将预训练去噪器集成到迭代重建中提供了灵活框架，而流匹配则提供了一种基于连续时间常微分方程动力学的高效生成建模方法。最近，Martin 等人（ICLR, 2025）开发了一种 PnP-Flow 方法，通过从预训练流匹配模型构建的时间依赖去噪器将 PnP 框架与流匹配相结合。通过引入不同的时间调度和额外的像素空间投影算子，本文提出了一种新颖高效的 PnP-Flow 算法（HP-PnP-Flow），在温和假设下具有严格的收敛保证，且无需像前述工作那样对迭代序列施加限制性条件。在 CelebA 和 AFHQ-Cat 上的数值实验表明，新提出的 HP-PnP-Flow 算法在去噪、去模糊、超分辨率、随机修复和框修复等多种恢复任务上显著优于 PnP-Flow。值得注意的是，我们的算法以大幅减少的迭代次数实现了相当或更好的重建质量，将 AFHQ-Cat 上去模糊和超分辨率的迭代次数从 500 次减少到 100 次。","rv":"HP-PnP-Flow 将流匹配与即插即用框架结合，引入混合时间调度和像素空间投影算子，在温和假设下给出严格收敛保证，无需对迭代序列施加额外限制。实验在 CelebA 和 AFHQ-Cat 上验证了去噪、去模糊、超分辨率等任务的性能提升。与视觉生成和逆问题最接近，同时涉及 ODE 动力学与收敛性分析等数学工具。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29581","t":"Unlocking Spatial Grounding in Flow-Matching Models via SNR Tuning","a":"Despite the success of foundation models in image synthesis, achieving fine-grained spatial control remains a significant challenge, typically requiring auxiliary structural adapters or complex inference-time steering. While modern vision-language (VLM) text encoders possess the latent capacity to represent spatial coordinates, generative models often fail to leverage this information. We demonstrate that the signal-to-noise ratio (SNR) distribution is a critical determinant of spatial grounding in flow-matching models. Using a novel synthetic benchmark of geometric primitives, we isolate structural mechanics from textural complexity inherent in natural imagery and introduce a rigorous color-aware layout metric to quantify spatial fidelity. We show that training on a centered SNR distribution results in poor layout adherence (25.9%). Instead, we identify high-noise regimes as a \"critical learning phase\" for spatial grounding. Shifting the training focus toward these stages increases layout adherence to 80.8%, effectively reaching the 83.6% reconstruction ceiling of the underlying variational autoencoder. We find that the necessity for this shift scales with resolution and aspect ratio variance, and that the conservative noise schedules employed by models like FLUX.1 are insufficient for precise layout adherence. Finally, we show that these findings translate to real-world imagery via the COCO dataset (1.0 vs. 57.3 Average Precision), where state-of-the-art layout adherence is unlocked through distribution tuning alone, without architectural modifications.","au":["Martin Thißen","Elke Hergenröther"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29581","p":"2026-10-21","d":"2026-10-26","s":3.1,"tp":["gen-model","vision-gen"],"kw":["flow matching","image synthesis"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.29581","who":[],"tz":"通过信噪比调优解锁流匹配模型的空间定位能力","az":"尽管基础模型在图像合成方面取得了成功，实现细粒度的空间控制仍然是一个重大挑战，通常需要辅助结构适配器或复杂的推理时引导。虽然现代视觉-语言（VLM）文本编码器具有表示空间坐标的潜在能力，但生成模型往往未能利用这一信息。我们证明了信噪比（SNR）分布是流匹配模型中空间定位的关键决定因素。利用一个新颖的几何基元合成基准，我们将结构机制与自然图像固有的纹理复杂性分离开来，并引入了一种严格的颜色感知布局度量来量化空间保真度。我们表明，在居中的 SNR 分布上进行训练会导致较差的布局遵循率（25.9%）。相反，我们识别出高噪声区间是空间定位的「关键学习阶段」。将训练重点转向这些阶段可将布局遵循率提升至 80.8%，有效达到了底层变分自编码器 83.6% 的重建上限。我们发现，这种转变的必要性随分辨率和宽高比方差而增大，且 FLUX.1 等模型所采用的保守噪声调度不足以实现精确的布局遵循。最后，我们通过 COCO 数据集（平均精度 1.0 对 57.3）表明，这些发现可以推广到真实图像，仅通过分布调优即可解锁最先进的布局遵循能力，无需架构修改。","rv":"这篇工作研究流匹配生成模型中的空间定位问题。方法核心是调整训练时的信噪比分布，将训练重心移向高噪声区间，从而提升布局遵循率。对象是视觉生成中的空间控制，与「视觉生成」类别最接近，与有机分子晶体、分子层面生成模型关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1016/j.aei.2026.105393","t":"Intelligent design of shear wall layout based on conditional flow matching","a":"","au":["Hongmei Zhang","Jiacheng Guo","Jixing Cao","Ahmed Sharhan"],"v":"Advanced Engineering Informatics","u":"https://doi.org/10.1016/j.aei.2026.105393","p":"2026-10-21","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.aei.2026.105393","who":[],"tz":"基于条件流匹配的剪力墙布局智能设计","az":"","rv":"本文以建筑结构剪力墙布局为对象，采用条件流匹配（conditional flow matching）方法实现智能设计。条件流匹配属流匹配生成模型框架，与生成模型大类有直接关联，但应用域为工程结构，与有机分子晶体、视觉生成关系较弱。因无摘要，具体建模细节与实验结论无法判断。","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.31222","t":"GLOW-FM: Efficient Generative Low-Light Image Enhancement with One-Step Latent Flow Matching","a":"Low-light image enhancement (LLIE) aims to recover well-exposed and perceptually faithful images from severely degraded observations. Recent diffusion-based generative methods achieve strong perceptual quality by leveraging powerful image priors, but their iterative sampling incurs substantial computational cost, limiting practical deployment. Despite recent efficiency gains in generative LLIE, high-quality enhancement with a single function evaluation and low overall computation remains challenging, particularly under diverse real-world low-light conditions. We introduce GLOW-FM, a one-step latent flow-matching framework for efficient generative LLIE. GLOW-FM performs conditional transport in the latent space of a frozen Tiny-VAE and leverages Terminal Velocity Matching (TVM) to enable enhancement with a single function evaluation. Matched comparisons with alternative one-step objectives support TVM as an effective design choice, and, to the best of our knowledge, this is its first adaptation to image restoration and specifically to LLIE. Extensive experiments on challenging real-world benchmarks demonstrate that GLOW-FM achieves competitive image quality and state-of-the-art cross-dataset generalization while requiring only a single function evaluation and 34 GFLOPs for the small variant. These findings highlight the potential of GLOW-FM to bring generative LLIE closer to practical deployment through single-step inference and compact latent modeling. Code will be made publicly available upon publication.","au":["Ariel Lapid","Yuval Haitman","Reuven Peretz","Arnon Netzer","Idit Diamant"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31222","p":"2026-10-22","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.31222","who":[],"tz":"GLOW-FM：基于单步潜空间流匹配的高效生成式低光照图像增强","az":"低光照图像增强（LLIE）旨在从严重退化的观测中恢复曝光良好且感知上忠实的图像。近期基于扩散的生成方法通过利用强大的图像先验实现了较强的感知质量，但其迭代采样带来了巨大的计算开销，限制了实际部署。尽管生成式LLIE在效率方面取得了近期进展，但在单次函数评估下实现高质量增强且保持低总体计算量仍然具有挑战性，尤其是在多样化的真实世界低光照条件下。我们提出了GLOW-FM，一个用于高效生成式LLIE的单步潜空间流匹配框架。GLOW-FM在冻结的Tiny-VAE的潜空间中执行条件传输，并利用终端速度匹配（TVM）实现单次函数评估的增强。与替代单步目标的匹配比较支持TVM作为有效的设计选择，并且据我们所知，这是其首次被应用于图像修复，特别是LLIE。在具有挑战性的真实世界基准上的大量实验表明，GLOW-FM仅需单次函数评估且小模型变体仅需34 GFLOPs，即可实现有竞争力的图像质量和最先进的跨数据集泛化能力。这些发现凸显了GLOW-FM通过单步推理和紧凑潜空间建模将生成式LLIE推向实际部署的潜力。代码将在发表后公开。","rv":"本文提出GLOW-FM，在冻结Tiny-VAE潜空间中用终端速度匹配（TVM）实现单步低光照图像增强，属于生成模型用于图像修复。与视觉生成（图像修复）方向较近，核心贡献是流匹配的单步化与TVM在修复任务的首次应用；与有机分子晶体、相关数学关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32459","t":"MDMR-Bench: A Multi-Dimensional Benchmark for Multi-Reference Image Generation","a":"Image generation models have rapidly advanced, with many models now supporting generation conditioned on multiple reference images and textual instructions. Such models enable a wide range of applications, including entity fusion and attribute transfer across images. However, existing benchmarks for multi-reference image generation rely on limited evaluation dimensions and fail to capture the diverse challenges of the task. To address this limitation, we propose MDMR-Bench, a Multi-Dimensional benchmark for Multi-Reference image generation. MDMR-Bench is organized around representative capability settings and consists of multiple evaluation subsets spanning diverse dimensions of multi-reference image generation, including (1) common entity fusion and attribute transfer, (2) multi-element extraction from a single image, (3) infographic manipulation, and (4) visual reasoning-intensive generation. This design enables systematic analysis of model capabilities and failure modes across different challenge dimensions. Furthermore, to achieve more reliable and interpretable evaluation, we introduce a checklist-based evaluation protocol that decomposes generation quality into fine-grained evaluation aspects. Instead of relying solely on holistic scoring, our framework uses structured checklists composed of both global-level and atomic-level queries, enabling more diagnostic assessment of model performance. By benchmarking both open-source and proprietary models, we demonstrate that MDMR-Bench provides fine-grained insights into model performance across different dimensions. The dataset and code are publicly available.","au":["Bowen Zheng","Jintao Lin","Changheng Yi","Haoran Yang","Binxiao Huang","Chenyang Lei","Rui Liu","Xihui Liu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32459","p":"2026-10-23","d":"2026-10-26","s":3.1,"tp":["vision-gen"],"kw":["image generation"],"src":["arxiv"],"kind":"preprint","ax":"2610.32459","doi":"","who":[],"tz":"MDMR-Bench：面向多参考图像生成的多维基准","az":"图像生成模型发展迅速，许多模型现已支持以多张参考图像和文本指令为条件的生成。此类模型支持广泛的应用，包括跨图像的实体融合和属性迁移。然而，现有的多参考图像生成基准依赖有限的评估维度，未能捕捉该任务的多样化挑战。为克服这一局限，我们提出 MDMR-Bench，一个面向多参考图像生成的多维基准。MDMR-Bench 围绕代表性能力设置进行组织，由多个评估子集组成，涵盖多参考图像生成的多个维度，包括（1）常见的实体融合与属性迁移，（2）从单张图像中提取多元素，（3）信息图操作，以及（4）视觉推理密集型生成。该设计使得能够跨不同挑战维度对模型能力和失败模式进行系统性分析。此外，为实现更可靠、更可解释的评估，我们引入了一种基于检查清单的评估协议，将生成质量分解为细粒度的评估方面。我们的框架不再仅依赖整体评分，而是使用由全局级和原子级查询组成的结构化检查清单，从而实现对模型性能更具诊断性的评估。通过对开源模型和专有模型进行基准测试，我们证明 MDMR-Bench 能够跨不同维度提供关于模型性能的细粒度洞察。数据集和代码已公开可用。","rv":"该工作提出 MDMR-Bench，一个面向多参考图像生成的多维评测基准，涵盖实体融合、属性迁移、多元素提取、信息图操作和视觉推理生成等维度，并引入基于检查清单的细粒度评估协议。属于视觉生成方向，与有机分子晶体、生成模型及数学关系较弱，核心贡献在图像生成评测体系。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32768","t":"SCDM-HTD: Spectral-Wise Conditional Diffusion Model for Hyperspectral Target Detection","a":"Hyperspectral target detection (HTD) aims to locate and recognize objects at a fine-grained scale, playing a pivotal role in remote sensing. Despite significant progress, current HTD methods primarily focus on feature comparison while neglecting distribution learning for background-target separation, which can limit detection robustness in practical applications. This paper addresses this issue by introducing a spectral-wise conditional diffusion model that reformulates HTD as a task of generating a detection map. Specifically, we treat background and target confidence scores as training samples and use the corresponding pixel spectra as guiding conditions to capture the distributional discrepancy between background and target through diffusion and denoising. To enhance practical applicability, we propose a lightweight conditional denoising network based on multilayer perceptron to map noisy confidence scores to their ideal counterparts and adopt a deterministic reverse non-Markov chain to skip sampling steps, thereby accelerating the generation process. Furthermore, we introduce a composite loss to improve background-target separation. This loss integrates constrained energy minimization loss to enhance target saliency and suppress the background by maximizing the target response while minimizing average output energy, alongside binary cross-entropy loss to classify background and target using pixel-wise labels. Experimental results on four benchmark datasets demonstrate the effectiveness of the proposed method, with improvements in both quantitative metrics and qualitative visual effects.","au":["Dunbin Shen","Wenfeng Kong","Jianjun Liu","Xiaorui Ma","Hongyu Wang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32768","p":"2026-10-23","d":"2026-10-26","s":3.0,"tp":["gen-model"],"kw":["diffusion model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32768","doi":"","who":[],"tz":"SCDM-HTD：面向高光谱目标检测的逐光谱条件扩散模型","az":"高光谱目标检测（HTD）旨在以细粒度尺度定位和识别目标，在遥感中发挥着关键作用。尽管已有显著进展，当前HTD方法主要关注特征比较，而忽视了用于背景-目标分离的分布学习，这可能限制了实际应用中的检测鲁棒性。本文通过引入一个逐光谱条件扩散模型来解决这一问题，该模型将HTD重新表述为生成检测图的任务。具体而言，我们将背景和目标置信度分数作为训练样本，并使用对应的像素光谱作为引导条件，通过扩散和去噪来捕捉背景与目标之间的分布差异。为增强实际适用性，我们提出了一种基于多层感知机的轻量级条件去噪网络，将含噪置信度分数映射到其理想对应值，并采用确定性反向非马尔可夫链来跳过采样步骤，从而加速生成过程。此外，我们引入了一种复合损失函数以改善背景-目标分离。该损失函数整合了约束能量最小化损失，通过最大化目标响应同时最小化平均输出能量来增强目标显著性并抑制背景，并结合二元交叉熵损失，利用逐像素标签对背景和目标进行分类。在四个基准数据集上的实验结果证明了所提方法的有效性，在定量指标和定性视觉效果方面均有提升。","rv":"将高光谱目标检测重构为条件扩散生成任务，以像素光谱为条件、置信度分数为样本，通过扩散去噪捕捉背景与目标的分布差异。采用轻量MLP去噪网络和确定性反向非马尔可夫链加速采样，并设计复合损失增强分离效果。方法本质是生成模型在遥感检测中的应用，与视觉生成（生成检测图）关系较近，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26244","t":"RECAP: Reciprocal Sparse Attention and Hierarchical Caching for Efficient Video Diffusion","a":"Diffusion transformers generate high-quality videos but remain computationally expensive. Sparse attention and temporal caching reduce computation within and across denoising steps, respectively, offering a natural composition. However, predictions produced with sparse attention become sources for temporal reuse, coupling their errors along the sampling trajectory. We observe that improving the accuracy of these sources recovers fidelity without changing the reuse schedule, and that sparsification errors remain directionally aligned across nearby steps, suggesting that correction information can be shared rather than recomputed. These observations motivate RECAP, a training-free method that couples sparse attention with hierarchical caching through reciprocal correction, adaptively coordinated by online error feedback. Cached dense refinement corrects omitted interactions in current sparse estimates, while fresh sparse statistics track input changes and regulate the aging correction. The resulting predictions then renew the sources for whole-step prediction reuse, allowing prediction history to advance between dense refreshes. We evaluate RECAP on multiple video diffusion models against sparse-attention methods, caching methods, and their direct compositions. On HunyuanVideo at 720p 5-second generation, RECAP achieves a 3.05x speedup and outperforms all tested direct compositions in both fidelity and inference speed.","au":["Tiange Xu","Kai Liu","Linghe Kong","Yulun Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26244","p":"2026-10-19","d":"2026-10-26","s":3.0,"tp":["vision-gen"],"kw":["video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26244","who":[],"tz":"RECAP：面向高效视频扩散的互校正稀疏注意力与分层缓存","az":"扩散Transformer能生成高质量视频，但计算开销仍然很大。稀疏注意力和时间缓存分别在去噪步骤内部和步骤之间降低计算量，二者天然可以组合。然而，用稀疏注意力产生的预测会成为时间复用的来源，使其误差沿采样轨迹耦合。我们观察到，提高这些来源的精度可以在不改变复用调度的情况下恢复保真度，并且稀疏化误差在相邻步骤之间保持方向一致，这意味着校正信息可以共享而非重新计算。这些观察启发了RECAP，一种无需训练的方法，通过互校正将稀疏注意力与分层缓存耦合，并由在线误差反馈自适应协调。缓存的稠密精化校正当前稀疏估计中被遗漏的交互，而新鲜的稀疏统计量跟踪输入变化并调节老化校正。由此产生的预测随后更新整步预测复用的来源，使预测历史能够在稠密刷新之间推进。我们在多个视频扩散模型上评估RECAP，与稀疏注意力方法、缓存方法及其直接组合进行对比。在HunyuanVideo的720p 5秒生成任务上，RECAP实现了3.05倍加速，并在保真度和推理速度上均优于所有测试的直接组合方法。","rv":"针对视频扩散Transformer推理加速，RECAP将稀疏注意力与分层时间缓存通过互校正耦合，由在线误差反馈自适应协调，无需训练。属于视觉生成（视频扩散）的推理效率优化，与有机分子晶体、文本/分子生成模型关系较弱，核心在注意力稀疏化与缓存策略的协同设计。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.30775","t":"GWDM: A Guided Wavelet Diffusion Model for Realistic Histopathology Image Generation","a":"Histopathology images are recognized as a reliable and comprehensive modality for Deep Learning (DL) based diagnosis. However, effectiveness is constrained by limited large-scale annotated datasets, as collecting expert-labeled medical data is costly and time-intensive. Recent advances in generative models, particularly diffusion models, demonstrate strong capabilities in synthesizing medically relevant content for dataset augmentation. Existing generative frameworks treat histopathology patches as generic natural images, failing to enforce biological constraints such as histomorphological structures and heterogeneous staining patterns essential for valid synthesis. We propose a guided wavelet diffusion model (GWDM) framework that captures image details at multiple scales using wavelets and leverages controllable conditioning based on domain-specific histopathological features (e.g., tissue patterns and color variations). We further formulate a histomorphological guidance loss applied to real and generated patches. A loss ramping strategy gradually introduces these constraints during training, ensuring stable optimization and robust modeling of tissue architecture. GWDM was evaluated on three benchmark datasets (BCSS, MoNuSeg, and PAIP2019), consistently outperforming state-of-the-art generative methods. Ablation studies confirmed that domain-guided conditioning, perceptual loss, and structural similarity loss each contribute meaningfully to synthesis quality. Downstream nuclei and tissue segmentation experiments further validated the clinical utility of GWDM-generated images, demonstrating consistent performance improvements when synthetic data augments real training sets. This work shows that domain-specific conditioning and dual-loss optimization generate realistic histopathology patches, reducing data scarcity and improving clinical downstream segmentation performance.","au":["Abdullah","Tao Huang","Ickjai Lee","Lei Bi","Euijoon Ahn"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30775","p":"2026-10-22","d":"2026-10-26","s":3.0,"tp":["vision-gen","gen-model"],"kw":["image generation","diffusion model"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30775","who":[],"tz":"GWDM：用于逼真组织病理学图像生成的引导小波扩散模型","az":"组织病理学图像被认为是基于深度学习（DL）诊断的一种可靠且全面的模态。然而，其有效性受到大规模标注数据集有限的制约，因为收集专家标注的医疗数据成本高昂且耗时。生成模型的最新进展，尤其是扩散模型，在合成医学相关内容以进行数据集增强方面展现出强大能力。现有生成框架将组织病理学图像块视为通用自然图像，未能施加对有效合成至关重要的生物学约束，如组织形态学结构和异质性染色模式。我们提出一个引导小波扩散模型（GWDM）框架，利用小波在多尺度上捕获图像细节，并基于领域特定的组织病理学特征（如组织模式和颜色变化）利用可控条件。我们进一步构建了一个组织形态学引导损失，应用于真实和生成的图像块。一种损失渐增策略在训练过程中逐步引入这些约束，确保稳定的优化和对组织结构的鲁棒建模。GWDM在三个基准数据集（BCSS、MoNuSeg和PAIP2019）上进行了评估，持续优于最先进的生成方法。消融实验证实，领域引导条件、感知损失和结构相似性损失各自对合成质量有显著贡献。下游细胞核和组织分割实验进一步验证了GWDM生成图像的临床效用，表明当合成数据增强真实训练集时，性能有一致的提升。本工作表明，领域特定条件和双损失优化能够生成逼真的组织病理学图像块，减少数据稀缺性并改善临床下游分割性能。","rv":"提出引导小波扩散模型GWDM，用小波多尺度捕获病理图像细节，结合组织模式与颜色变化等领域条件及组织形态学引导损失，在三个基准数据集上生成组织病理学图像块，用于下游细胞核与组织分割的数据增强。属于视觉生成与生成模型交叉方向，与有机分子晶体无直接关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.31981","t":"Compatible Likelihoods for Flow Matching on Manifolds","a":"On the simplest non-Euclidean manifold, the 1D flat torus, we exhibit a distribution where a recently proposed extension of Riemannian flow matching is globally optimized by a velocity field that pushes samples away from the data distribution. We trace this failure mode to a property we call compatibility; a likelihood-based flow matching objective is compatible if its population minimizer recovers the marginal velocity field induced by the data and coupling. We give a general condition for compatibility, apply it to existing methods, and bound the worst-case error in terms of a residual component vanishing under compatibility. Next, we note that existing compatible objectives put density on velocities that are infeasible on compact manifolds. We propose an objective built from an exponential family over endpoints, with the conditional velocity as sufficient statistic, which is both compatible and supported only on feasible velocities. This manifests as a reweighting of the flow matching loss which, on constant-curvature manifolds, treats errors in flow speed and direction differently. Empirically, our method recovers the correct velocity field on the test case, outperforms prior methods on high-dimensional product tori, and obtains substantial NLL improvements over prior work on two of four standard geospatial benchmarks on the sphere at moderate runtime overhead. On a large dataset of high-dimensional human poses, our method outperforms prior work according to sample-based metrics.","au":["Lucas Ng","Georgios Batzolis","Mark Girolami"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31981","p":"2026-10-22","d":"2026-10-26","s":3.0,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.31981","doi":"","who":[],"tz":"流形上流匹配的兼容似然","az":"在最简单的非欧几里得流形——一维平坦环面——上，我们展示了一个分布，其中最近提出的黎曼流匹配扩展被一个将样本推离数据分布的速度场全局优化。我们将这一失效模式归因于我们称为「兼容性」的性质；基于似然的流匹配目标函数是兼容的，如果其总体最小化器能恢复由数据和耦合诱导的边缘速度场。我们给出了兼容性的一个一般条件，将其应用于现有方法，并用一个在兼容性下消失的残差分量来界定最坏情况误差。接下来，我们注意到现有的兼容目标函数在紧致流形上对不可行的速度赋予了密度。我们提出了一个基于端点上的指数族构建的目标函数，以条件速度为充分统计量，该目标函数既兼容又仅支撑在可行速度上。这表现为对流匹配损失的重加权，在常曲率流形上，对流速误差和方向误差的对待方式不同。在实验上，我们的方法在测试用例上恢复了正确的速度场，在高维乘积环面上优于先前方法，并在球面上四个标准地理空间基准中的两个上以适中的运行时开销获得了相比先前工作的显著负对数似然改进。在一个高维人体姿态的大型数据集上，我们的方法根据基于样本的指标优于先前工作。","rv":"本文研究黎曼流形上的流匹配生成模型，提出「兼容性」概念并构造仅支撑在可行速度上的指数族目标函数，修正了紧致流形上速度不可行的问题。属于生成模型与微分几何的交叉方向，与「相关数学」最接近，核心涉及流形上的概率建模与速度场优化。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32512","t":"Fast and Useful: Adapting Distilled Generators for Visual Learning","a":"Distilled text-to-image models generate images quickly, but classifiers trained on those images can perform substantially worse than classifiers trained on images from their slower base models. We adapt released distilled generators to produce better training data while retaining fast generation. We fit a low-rank update to the student's first prediction so that it reaches an intermediate state produced by its unguided base, then disable the update and let the unchanged student finish generation. The base supplies training targets and is absent at inference. Guided targets and shorter jumps give classifiers lower accuracy in our ablations, showing why the state used for supervision matters. Across three generator families, the adapted images train better classifiers than images from the released students. With class-name templates at full ImageNet-1k scale, ResNet-50 top-1 rises from 8.4% to 34.2% for FLUX.2-klein and from 12.7% to 32.1% for SD-Turbo, using two and three denoiser evaluations per image, respectively. Fixed adapters also improve results on additional classes, fine-grained datasets, and other learner architectures and training recipes. Template-based adaptation remains useful against richer-prompt alternatives, while the benefit of combining adaptation with LLM generation prompts depends on the generator. Adapting a single generation step makes fast generators substantially more useful for training visual models.","au":["Patryk Bartkowiak","Dominik Michels","Sören Pirk","Wojciech Pałubicki"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32512","p":"2026-10-23","d":"2026-10-26","s":2.9,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32512","doi":"","who":[],"tz":"快速且有用：适配蒸馏生成器用于视觉学习","az":"蒸馏文生图模型能快速生成图像，但用这些图像训练的分类器性能可能远逊于用其较慢基模型图像训练的分类器。我们对已发布的蒸馏生成器进行适配，使其在保留快速生成的同时产出更优的训练数据。具体做法是：对学生模型的第一步预测拟合一个低秩更新，使其到达无引导基模型所产生的中间状态，随后关闭该更新，让未修改的学生模型完成剩余生成。基模型提供训练目标，推理时不存在。消融实验表明，使用引导目标或更短的跳跃步长会使分类器精度下降，说明用于监督的状态选择至关重要。在三个生成器家族上，适配后的图像训练出的分类器优于已发布学生模型的图像。在完整 ImageNet-1k 规模、使用类别名模板的条件下，ResNet-50 的 top-1 准确率对 FLUX.2-klein 从 8.4% 提升至 34.2%，对 SD-Turbo 从 12.7% 提升至 32.1%，分别使用每张图像两次和三次去噪器评估。固定适配器在额外类别、细粒度数据集以及其他学习器架构和训练方案上同样带来提升。基于模板的适配相较于更丰富的提示词替代方案仍然有效，而将适配与 LLM 生成提示词结合所带来的收益则取决于具体生成器。适配单步生成即可让快速生成器在训练视觉模型方面变得显著更有用。","rv":"对蒸馏文生图模型首步预测施加低秩更新，使其对齐无引导基模型的中间状态，再关闭更新让学生完成生成，推理时不依赖基模型。实际用基模型提供监督目标，让快速生成器产出更优分类器训练数据。与视觉生成直接相关，与有机分子晶体或分子生成模型关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32390","t":"PASTA: Prompt-Aware Annealed Diffusion Sampling","a":"While Diffusion models produce high-quality images, real-world visual design requires intentionally preserving clean regions for headlines, logos, or UI elements. Existing layout-aware text-to-image methods struggle to strictly preserve reserved regions, often introducing unwanted content that complicates downstream editing. Existing approaches either manipulate attention to displace content or suppress conditioning via noise-level interventions. However, these methods sacrifice visual coherence, producing flat regions or noticeable style inconsistencies between reserved and non-reserved areas. To address this limitation, we propose a Prompt-Aware Shared-Latent Training-Free Annealed Diffusion Sampling (PASTA), a training-free framework that enforces reserved-region constraints by selectively applying semantic guidance to object-allowed regions during sampling. PASTA operates on a shared latent trajectory, where full-prompt and context-prompt guidance are fused through mask-guided sampling. An annealed schedule suppresses semantic leakage during early denoising stages while gradually restoring visual consistency in later stages. Extensive experiments demonstrate that PASTA improves reserved-region fidelity while preserving overall image realism and perceptual consistency.","au":["Ren Ajiki","Ryugo Morita","Stanislav Frolov","Brian Bernhard Moser","Ko Watanabe","Riku Takahashi","Andreas Dengel","Jinjia Zhou"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32390","p":"2026-10-23","d":"2026-10-26","s":2.9,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32390","doi":"","who":[],"tz":"PASTA：提示感知的退火扩散采样","az":"扩散模型虽然能生成高质量图像，但现实中的视觉设计需要有意保留干净区域用于标题、标志或界面元素。现有的布局感知文生图方法难以严格保留预留区域，常常引入不需要的内容，使下游编辑变得复杂。现有方法要么通过操纵注意力来位移内容，要么通过噪声水平干预来抑制条件信息。然而，这些方法牺牲了视觉连贯性，在预留区域与非预留区域之间产生平坦区域或明显的风格不一致。为解决这一局限，我们提出了一种提示感知的共享潜变量免训练退火扩散采样（PASTA），这是一个免训练框架，通过在采样过程中选择性地将语义引导施加于允许放置物体的区域来强制执行预留区域约束。PASTA 在共享潜变量轨迹上运行，其中完整提示与上下文提示的引导通过掩码引导采样进行融合。退火调度在早期去噪阶段抑制语义泄漏，同时在后期阶段逐步恢复视觉一致性。大量实验表明，PASTA 在保持整体图像真实感和感知一致性的同时，提升了预留区域的保真度。","rv":"PASTA 是免训练扩散采样框架，解决文生图中保留区域（标题、logo 等）的严格约束问题。在共享潜变量轨迹上，通过掩码引导将完整提示与上下文提示的语义引导选择性施加于允许区域，并用退火调度在早期去噪阶段抑制语义泄漏、后期恢复视觉一致性。属视觉生成与生成模型方向，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1002/ima.70447","t":"DFTA : Dual‐Flow Trajectory Alignment for Medical Pathology Image Synthesis","a":"Generating medical images with complex anatomical structures frequently faces challenges of morphological distortion and limited diversity. We investigate these issues within an established latent generative pipeline by introducing Dual‐Flow Trajectory Alignment (DFTA), a Flow‐Matching formulation with parallel mask‐flow and image‐flow conditioning. Rather than replacing standard latent encoders, UNet backbones, or ControlNet‐style conditioning, DFTA focuses on how the paired conditional trajectories are regularized and sampled. During training, trajectory consistency guidance uses image flow as a geometric reference for the mask flow; an Online Straight Euler Augmentation (OSEA) mechanism generates intermediate pseudo‐samples. At inference, conditional stochastic flow sampling introduces controlled variation into otherwise deterministic integration. Images generated by our model improve downstream task performance, achieving the best generation metrics and competitive results across downstream classification models. In particular, for medical image segmentation tasks, our method improves the mean Dice coefficient (mDice) and mean Intersection over Union (mIoU) of SegFormer by 1.79% and 1.92%, respectively, and increases the mDice and mIoU of UNet by 2.06% and 2.20%, respectively. The code is available at: https://github.com/yanguanyue/DFTA‐ .","au":["Kenan Lai","Muyu Qin","Shanping Yu"],"v":"International Journal of Imaging Systems and Technology","u":"https://doi.org/10.1002/ima.70447","p":"2026-10-19","d":"2026-10-26","s":2.8,"tp":["vision-gen"],"kw":["image synthesis"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1002/ima.70447","who":[],"tz":"DFTA：面向医学病理图像合成的双流轨迹对齐","az":"生成具有复杂解剖结构的医学图像经常面临形态畸变和多样性有限的挑战。我们在一个既有的潜在生成管线中研究这些问题，引入了双流轨迹对齐（DFTA），这是一种具有并行掩码流和图像流条件化的流匹配（Flow-Matching）公式。DFTA 并非替换标准的潜在编码器、UNet 骨干网络或 ControlNet 风格的条件化，而是关注成对条件轨迹如何被正则化和采样。在训练期间，轨迹一致性引导使用图像流作为掩码流的几何参考；在线直线欧拉增强（OSEA）机制生成中间伪样本。在推理阶段，条件随机流采样向原本确定性的积分过程引入受控的变异。我们模型生成的图像提升了下游任务性能，在生成指标上取得最佳表现，并在下游分类模型中取得有竞争力的结果。特别是对于医学图像分割任务，我们的方法将 SegFormer 的平均 Dice 系数（mDice）和平均交并比（mIoU）分别提升了 1.79% 和 1.92%，将 UNet 的 mDice 和 mIoU 分别提升了 2.06% 和 2.20%。代码可在以下地址获取：https://github.com/yanguanyue/DFTA‐ 。","rv":"这篇论文针对医学病理图像合成中的形态畸变和多样性不足问题，提出 DFTA 方法，在流匹配框架下并行使用掩码流和图像流条件化，通过轨迹一致性引导和在线直线欧拉增强改善训练，推理时用条件随机流采样引入受控变异。属于视觉生成与生成模型方向，与有机分子晶体无直接关联。","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.17605/osf.io/62ty9","t":"Generative AI for Mechanical Systems Design: A Systematic Review of Language-Driven, Diffusion-Based, and Physics-Informed Approaches — Protocol for a Two-Tier Systematic Map and In-Depth Synthesis","a":"Protocol of a systematic review on generative artificial intelligence for the design of mechanical systems, components and structures (2021–2026). The review covers three paradigms: language-driven approaches (large language models, vision-language models, LLM agents, CAD-as-language models), diffusion-based approaches (denoising diffusion, latent diffusion, flow matching) and physics-informed generative approaches. It uses a two-tier design: (1) a systematic map of all eligible studies, coded by paradigm, design task, design stage, design representation and evaluation type; (2) an in-depth critical synthesis of a core set of studies that quantitatively evaluate the physical validity, constraint satisfaction or manufacturability of generated designs, selected with criteria fixed before full-text assessment. Reporting follows PRISMA 2020. Searches were run in Scopus and Web of Science on 20 October 2026; this registration was made after title/abstract screening and before full-text assessment and data extraction.","au":["Alexis Lazanas"],"v":"Open Science Framework","u":"https://doi.org/10.17605/osf.io/62ty9","p":"2026-10-20","d":"2026-10-26","s":2.8,"tp":["gen-model","vision-gen"],"kw":["flow matching","latent diffusion"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.17605/osf.io/62ty9","who":[],"tz":"面向机械系统设计的生成式人工智能：语言驱动、基于扩散与物理信息方法的系统性综述——双层系统图谱与深入综合方案","az":"这是一项关于生成式人工智能在机械系统、零部件和结构设计中的应用（2021–2026 年）的系统性综述方案。该综述涵盖三种范式：语言驱动方法（大语言模型、视觉-语言模型、LLM 智能体、将 CAD 视为语言模型）、基于扩散的方法（去噪扩散、潜在扩散、流匹配）以及物理信息驱动的生成方法。采用双层设计：（1）对所有符合条件的研究进行系统图谱绘制，按范式、设计任务、设计阶段、设计表示和评估类型进行编码；（2）对一组核心研究进行深入批判性综合，这些研究定量评估了生成设计的物理有效性、约束满足度或可制造性，其筛选标准在全文评估之前已预先确定。报告遵循 PRISMA 2020 规范。检索于 2026 年 10 月 20 日在 Scopus 和 Web of Science 中执行；本注册在标题/摘要筛选之后、全文评估和数据提取之前完成。","rv":"本条是一项系统性综述的注册方案，对象为生成式 AI 在机械系统设计中的应用，涵盖语言驱动、扩散模型与物理信息生成三种范式。实际工作为制定双层检索与综合流程，尚未产出具体结论。与「生成模型」类别关系较近，涉及扩散模型和流匹配等生成方法，但应用场景为机械 CAD 设计，与有机分子晶体、视觉生成或纯数学关系较弱。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.25059","t":"HCFM: Helmholtz Component Flow Matching for Time Series Anomaly Detection","a":"Flow Matching (FM) is an efficient simulation-free approach for training flow-based generative models, making it a promising foundation for scalable time-series anomaly detection (TSAD). However, standard FM learns a monolithic vector field in which nominal transport and local density-changing behavior are entangled. This creates a central challenge for TSAD; local expansion and contraction carry crucial anomaly-sensitive information, yet isolating this signal requires expensive Jacobian-trace estimation over the entire field. We propose \\emph{Helmholtz Component Flow Matching} (HCFM), an unsupervised TSAD framework that parameterizes the vector field prediction network with separate transport, compression, and residual heads. The transport head is constrained to be divergence-free, so divergence estimation is restricted to the compression head, while a lightweight residual head absorbs the remaining mismatch. This structured parameterization improves scalability and detection performance by separating volume-preserving nominal transport from density-changing compression, yielding cleaner anomaly signals from distinct deviations of nominal behavior. Experiments on large-scale univariate and multivariate TSAD benchmarks show that HCFM consistently improves detection accuracy while maintaining efficient inference compared with 16 baselines. The code is available at https://github.com/TrustAIoT/HCFM__time-series-anomaly/","au":["Shyam Sundar Saravanan","Tie Luo","Sanjay Madria"],"v":"arXiv","u":"https://arxiv.org/abs/2610.25059","p":"2026-10-18","d":"2026-10-26","s":2.7,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.25059","who":[],"tz":"HCFM：面向时间序列异常检测的亥姆霍兹分量流匹配","az":"流匹配（FM）是一种高效的无模拟方法，用于训练基于流的生成模型，使其成为可扩展时间序列异常检测（TSAD）的有前景基础。然而，标准FM学习的是一个整体向量场，其中正常传输行为与局部密度变化行为相互纠缠。这为TSAD带来了核心挑战：局部膨胀和收缩携带着关键的异常敏感信息，但分离该信号需要对整个场进行昂贵的雅可比迹估计。我们提出「亥姆霍兹分量流匹配」（HCFM），一个无监督TSAD框架，用独立的传输头、压缩头和残差头来参数化向量场预测网络。传输头被约束为无散度的，因此散度估计仅限于压缩头，而一个轻量级残差头吸收剩余的失配。这种结构化参数化通过将保持体积的正常传输与改变密度的压缩分离开来，提高了可扩展性和检测性能，从而从正常行为的明显偏差中产生更干净的异常信号。在大规模单变量和多变量TSAD基准上的实验表明，与16个基线相比，HCFM在保持高效推理的同时一致地提高了检测精度。代码可在 https://github.com/TrustAIoT/HCFM__time-series-anomaly/ 获取。","rv":"这篇论文针对时间序列异常检测，提出HCFM方法，将流匹配的向量场分解为无散度传输、压缩和残差三个分量头，利用亥姆霍兹分解思想分离体积保持传输与密度变化，从而更干净地提取异常信号。属于生成模型（流匹配）在时序异常检测中的应用，与有机分子晶体、视觉生成关系较弱，与生成模型和流匹配数学工具更近。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32177","t":"$Ψ$-0.6: Adaptive Streams of Thought in a Unified Vision-Language World Model","a":"Humans reason about the physical world by flexibly combining different forms of inference as a problem unfolds. Achieving this flexibility is a major open challenge in AI: capabilities often remain separated across specialized models, limiting how they can be composed and jointly adapted to a task. We introduce $Ψ$-0.6, a unified vision-language world model that adaptively composes perception, language, geometry, and simulation within a shared reasoning process we call streams of thought. These streams interleave images, text, and explicit representations of geometry and motion, all of which the model can generate and interpret through a shared token interface. $Ψ$-0.6 surpasses leading open-weight models zero-shot on multi-view spatial reasoning, with further gains from reasoning through geometric intermediates. It also supports counterfactual simulation: generating and interpreting imagined scenes to determine, for example, whether moving an object would obstruct a pathway. Reinforcement learning from task feedback jointly optimizes the selection, generation, and use of intermediate representations, improving visual question-answering accuracy with gains that transfer to unseen benchmarks. $Ψ$-0.6 offers a path toward adaptive physical reasoning -- not only predicting the physical world but also choosing the representations through which to reason.","au":["Khai Loong Aw","Klemen Kotar","Baihan Zhang","Yifan Liu","Lilian Chen","Atlas Kazemian","Rahul Venkatesh","Daniel Yamins"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32177","p":"2026-10-23","d":"2026-10-26","s":2.7,"tp":["vision-gen"],"kw":["world model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32177","doi":"","who":[],"tz":"$Ψ$-0.6：统一视觉-语言世界模型中的自适应思维流","az":"人类在问题展开的过程中，通过灵活组合不同形式的推理来理解物理世界。实现这种灵活性是人工智能领域的一个重大开放挑战：各项能力往往分散在不同的专用模型中，限制了它们如何被组合并共同适应某一任务。我们提出了 $Ψ$-0.6，一个统一的视觉-语言世界模型，它在一个我们称为「思维流」的共享推理过程中，自适应地组合感知、语言、几何和仿真。这些思维流交替包含图像、文本以及几何和运动的显式表示，模型可以通过共享的 token 接口生成和解读所有这些内容。$Ψ$-0.6 在多视角空间推理的零样本测试中超越了领先的开源权重模型，通过几何中间表示进行推理还能带来进一步提升。它还支持反事实仿真：生成并解读想象场景，以判断例如移动某个物体是否会遮挡一条路径。基于任务反馈的强化学习联合优化中间表示的选择、生成和使用，提升了视觉问答的准确率，且提升效果可迁移到未见过的基准测试上。$Ψ$-0.6 为自适应物理推理提供了一条路径——不仅预测物理世界，还能选择用于推理的表示方式。","rv":"$Ψ$-0.6 是统一视觉-语言世界模型，在「思维流」框架下自适应组合感知、语言、几何与仿真，支持多视角空间推理和反事实场景生成，并用任务反馈强化学习优化中间表示的选择与使用。与视觉生成最为接近，涉及视觉-语言联合建模和空间推理，与有机分子晶体、文本/图像扩散类生成模型及纯数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32148","t":"Covariance-Informed Ensemble Score Filtering: Embedding Localized Covariance Geometry into Score-Based Transport","a":"Background-error covariance models are central to atmospheric data assimilation because they spread partial observational information across space, variables, and dynamically coupled scales. Ensemble and variational methods exploit this covariance geometry efficiently, but their standard analysis formulations are largely built around Gaussian or locally quadratic approximations. Score-based ensemble filtering provides a framework for nonlinear distributional transport, but existing Ensemble Score Filter (EnSF) formulations lack an intrinsic covariance-mediated pathway for propagating likelihood information from observed to unobserved state components. We introduce a covariance-informed ensemble score filter (CI-EnSF) that embeds localized forecast-error covariance geometry directly into the forward diffusion and reverse transport. The proposed forward diffusion is covariance-shaped in standardized state space and becomes isotropic under the corresponding control-variable transformation. This covariance structure continuously propagates observational information from observed to unobserved state components throughout the reverse transport analysis trajectory. Experiments with Lorenz-96 and surface quasi-geostrophic (SQG) dynamics show a clear regime dependence. For linear observations, a well-tuned LETKF is more accurate, while CI-EnSF maintains stable cycling and effective covariance-mediated information propagation. Under strongly nonlinear observations and under climatological initialization, CI-EnSF achieves lower analysis error and greater cycling robustness than Gaussian ensemble benchmarks such as the LETKF, with improvements extending across spatial scales in the nonlinear SQG experiment. These results suggest that the principal benefit of CI-EnSF arises from combining nonlinear distributional transport with the mature covariance geometry used in conventional data assimilation.","au":["Siming Liang","Peter Jan van Leeuwen","Hristo G. Chipilski","Zezhong Zhang","Feng Bao","Guannan Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32148","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["score-based"],"src":["arxiv"],"kind":"preprint","ax":"2610.32148","doi":"","who":[],"tz":"协方差信息集合分数滤波：将局部协方差几何嵌入基于分数的传输","az":"背景误差协方差模型是大气数据同化的核心，因为它们将部分观测信息在空间、变量和动力学耦合尺度上扩散。集合方法和变分方法高效地利用了这种协方差几何结构，但它们的标准分析公式主要围绕高斯或局部二次近似构建。基于分数的集合滤波为非线性分布传输提供了框架，但现有的集合分数滤波（EnSF）公式缺乏一种内在的协方差介导路径，用于将似然信息从观测状态分量传播到未观测状态分量。我们提出了一种协方差信息集合分数滤波（CI-EnSF），将局部预报误差协方差几何结构直接嵌入前向扩散和反向传输中。所提出的前向扩散在标准化状态空间中呈协方差形状，在对应的控制变量变换下变为各向同性。这种协方差结构在反向传输分析轨迹中持续地将观测信息从观测状态分量传播到未观测状态分量。基于Lorenz-96和表面准地转（SQG）动力学的实验显示出明显的机制依赖性。对于线性观测，经过良好调优的LETKF更为准确，而CI-EnSF保持了稳定的循环和有效的协方差介导信息传播。在强非线性观测和气候学初始化条件下，CI-EnSF比LETKF等高斯集合基准方法实现了更低的分析误差和更强的循环鲁棒性，在非线性SQG实验中，改进跨越了多个空间尺度。这些结果表明，CI-EnSF的主要优势来自于将非线性分布传输与传统数据同化中成熟的协方差几何结构相结合。","rv":"本文面向大气数据同化，提出CI-EnSF方法，将局部预报误差协方差几何嵌入score-based集合滤波的前向扩散与反向传输，使观测信息沿协方差结构持续传播至未观测分量。在Lorenz-96和SQG实验中，强非线性观测下优于LETKF等高斯基准。与生成模型中的score-based扩散有方法学关联，但核心对象是大气状态估计，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32222","t":"ACWM-RM: A Reference-Free Reward Model from Complementary Mismatch Preferences","a":"Reinforcement learning has gained attention for improving action-conditioned world models (ACWMs), as it enables reward-driven optimization of visual quality (VQ) and action-following fidelity (AF) beyond flow-matching optimization. Realizing this potential requires reward signals that reliably rank videos by both VQ and AF. However, existing rewards capture only one dimension: metric-based rewards assess VQ but require ground-truth videos and do not directly assess AF, while inverse dynamics model (IDM) rewards assess AF without references but do not guarantee VQ. Moreover, IDMs, typically trained on real videos, may provide unreliable rewards for generated videos containing visual artifacts and physical inconsistencies. In this work, we introduce the Action and Video Mismatch Benchmark (AVM-Eval), comprising 67.2k pairs that evaluate how reliably IDMs assess AF on real and generated videos. We then propose ACWM-RM, a reward model that jointly assesses VQ and AF without ground-truth videos during reward computation. To train it, we first construct the Action and Video Mismatch Preference Dataset (AVM-Pref) with 506.3k pairs providing complementary supervision: action-mismatch pairs supervise AF, while video-mismatch pairs supervise VQ and expose the model to generated videos. We then pretrain an action-conditioned predictor on real videos to learn forward dynamics before jointly training it with a patch-weighted score head on AVM-Pref to transfer these dynamics to AF assessment on generated videos. Evaluation on AVM-Eval reveals the limited reliability of IDMs on generated videos, while downstream RL experiments show that ACWM-RM outperforms reward baselines in both criteria.","au":["Shibo Hong","Siyu Ren","FengJiao Chen","Zhongyuan Peng","Wei Shi","Yixin Cao"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32222","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32222","doi":"","who":[],"tz":"ACWM-RM：基于互补失配偏好的无参考奖励模型","az":"强化学习因能在流匹配优化之外实现视觉质量（VQ）与动作跟随保真度（AF）的奖励驱动优化，而受到改善动作条件世界模型（ACWM）方面的关注。实现这一潜力需要能同时按 VQ 和 AF 可靠排序视频的奖励信号。然而，现有奖励仅覆盖单一维度：基于指标的奖励评估 VQ 但需要真值视频且不直接评估 AF，而逆动力学模型（IDM）奖励无需参考即可评估 AF 却不保证 VQ。此外，IDM 通常在真实视频上训练，对包含视觉伪影和物理不一致的生成视频可能给出不可靠的奖励。本文引入动作与视频失配基准（AVM-Eval），包含 67.2k 对样本，用于评估 IDM 在真实视频和生成视频上评估 AF 的可靠性。随后提出 ACWM-RM，一个在奖励计算时无需真值视频即可联合评估 VQ 和 AF 的奖励模型。为训练该模型，首先构建动作与视频失配偏好数据集（AVM-Pref），包含 506.3k 对样本，提供互补监督：动作失配对监督 AF，视频失配对监督 VQ 并使模型接触生成视频。然后在真实视频上预训练一个动作条件预测器以学习前向动力学，再将其与一个块加权评分头在 AVM-Pref 上联合训练，将这些动力学迁移到对生成视频的 AF 评估上。在 AVM-Eval 上的评估揭示了 IDM 对生成视频可靠性有限，而下游强化学习实验表明 ACWM-RM 在两项指标上均优于奖励基线。","rv":"针对动作条件世界模型的强化学习训练，本文提出无参考奖励模型ACWM-RM，利用互补失配偏好数据同时评估视觉质量与动作跟随保真度。方法通过构建失配偏好数据集并预训练动作条件预测器实现，属于视频生成与世界模型领域的奖励建模，与有机分子晶体、文本生成模型关系较弱，与视觉生成（视频）更近。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32485","t":"PCFBench: How Far Can Large Vision-Language Models Go in Physics-aware Photonic Inverse Design?","a":"Photonic crystal fibers (PCFs) underpin critical applications in telecommunications, sensing, and high-power laser delivery, yet their design remains a manual, expert-intensive process that couples geometric intuition with deep waveguide physics. Vision-language models (VLMs) offer a promising path toward automating PCF design, but can they truly reason about photonic physics from microscopy images, or do they merely recognize visual patterns? We introduce PCFBench, the first comprehensive benchmark for evaluating VLMs on the perception, reasoning, and decision steps of the photonic inverse-design loop. PCFBench spans 26 tasks organized into six categories of increasing cognitive demand (Geometry Perception, Physics Understanding, Text Generation, Multi-modal Reasoning, Inverse-Design Decision, and Code Generation), built from over 220K FDTD simulation samples across 18 structurally diverse fiber families. We evaluate both individual VLMs on isolated tasks and multi-agent systems (MAS) on the full sequential pipeline from perception to design. Our results reveal a striking perception-design gap: current models can identify fiber geometry with moderate success, yet consistently fail to translate that visual understanding into physics-aware design actions. Moreover, cascading agents through the pipeline exposes significant error propagation, where upstream perception mistakes compound into downstream design failures. These findings suggest that neither model scaling nor naive agent chaining suffices, and that closing the loop demands explicit physical grounding. PCFBench provides the community with a rigorous, multi-dimensional testbed to measure progress toward AI-assisted photonic engineering. The project is available at https://pcfbench.github.io/.","au":["Shengchao Chen","Ting Shu","Sufen Ren"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32485","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["crystal-gen"],"kw":["inverse design"],"src":["arxiv"],"kind":"preprint","ax":"2610.32485","doi":"","who":[],"tz":"PCFBench：大型视觉语言模型在物理感知光子逆向设计中能走多远？","az":"光子晶体光纤（PCF）支撑着电信、传感和高功率激光传输等关键应用，但其设计仍然是一个依赖人工、需要大量专家经验的过程，将几何直觉与深层波导物理耦合在一起。视觉语言模型（VLM）为自动化PCF设计提供了一条有前景的路径，但它们能否真正从显微镜图像中推理光子物理，还是仅仅识别视觉模式？我们提出PCFBench，这是首个全面评估VLM在光子逆向设计循环中感知、推理和决策步骤的基准。PCFBench涵盖26个任务，按认知需求递增组织为六个类别（几何感知、物理理解、文本生成、多模态推理、逆向设计决策和代码生成），基于18个结构多样的光纤家族中超过22万个FDTD仿真样本构建。我们既评估了单个VLM在孤立任务上的表现，也评估了多智能体系统（MAS）在从感知到设计的完整顺序流水线上的表现。我们的结果揭示了一个显著的感知-设计鸿沟：当前模型能以中等成功率识别光纤几何结构，但始终无法将这种视觉理解转化为具有物理感知的设计动作。此外，将智能体级联到流水线中暴露了显著的误差传播问题，上游感知错误会累积为下游设计失败。这些发现表明，无论是模型扩展还是简单的智能体级联都不够，要闭合循环需要显式的物理基础。PCFBench为社区提供了一个严格的、多维度的测试平台，用于衡量向AI辅助光子工程迈进的进展。项目可在 https://pcfbench.github.io/ 获取。","rv":"提出PCFBench基准，评估视觉语言模型在光子晶体光纤逆向设计中的感知、推理与决策能力，涵盖26个任务、22万FDTD仿真样本。实际工作是构建评测框架并测试VLM及多智能体系统，发现感知-设计鸿沟与误差传播。与「视觉生成」有弱关联（涉及显微镜图像理解），但核心是光子物理逆向设计评测，与有机分子晶体、生成模型、相关数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32964","t":"Flownomaly: Single-Step Conditional-Mean Recovery for Few-Shot Anomaly Detection","a":"Few-shot industrial anomaly detection requires modeling category-specific normality from only a handful of defect-free images. Common approaches tie inference to stored exemplars, impose rigid linear structure, or risk reproducing anomalous content. Flownomaly instead casts the problem as normal-counterpart recovery in frozen DINOv2 feature space. Given normal supports, a velocity field is learned through conditional flow matching over frozen patch tokens to transport Gaussian noise toward normal features. Along straight paths, a single recovery step using one evaluation of the optimal field yields the posterior mean of the clean normal token without trajectory integration. The operating time governs how strongly recovery modifies a query token. With no anomalous validation samples available for tuning, a normal-only Jacobian gain-to-noise criterion selects this time from the supports alone. Squared residuals between query tokens and their recovered counterparts yield anomaly signals for both dense localization and image-level detection. Across 1-, 2-, and 4-shot benchmarks on MVTec-AD and VisA, together with sample-shot evaluations on Real-IAD, Flownomaly achieves state-of-the-art performance against recent category-specific methods. In the 1-shot setting, image- and pixel-level AUROC reach 97.8% and 98.0% on MVTec-AD and 95.3% and 98.7% on VisA, with a 2.1-point image-level AUROC improvement over the strongest baseline on VisA. Code is available at https://github.com/b-rbmp/Flownomaly.","au":["Bernardo Perrone Ribeiro","Erkut Akdag","Egor Bondarev"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32964","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32964","doi":"","who":[],"tz":"Flownomaly：面向少样本异常检测的单步条件均值恢复","az":"少样本工业异常检测需要仅从少量无缺陷图像中建模类别特定的正常性。常见方法将推理绑定到存储的样本上、施加刚性的线性结构、或存在复现异常内容的风险。Flownomaly 则将问题转化为在冻结的 DINOv2 特征空间中进行正常对应物恢复。给定正常支持集，通过对冻结的 patch token 进行条件流匹配来学习速度场，将高斯噪声传输至正常特征。沿直线路径，使用最优场的一次评估进行单步恢复即可得到干净正常 token 的后验均值，无需轨迹积分。操作时间控制恢复对查询 token 的修改强度。在没有异常验证样本可供调优的情况下，仅使用正常样本的雅可比增益-噪声准则从支持集中选择该时间。查询 token 与其恢复对应物之间的平方残差产生异常信号，用于密集定位和图像级检测。在 MVTec-AD 和 VisA 上的 1 样本、2 样本和 4 样本基准测试中，以及在 Real-IAD 上的样本级评估中，Flownomaly 相较于近期的类别特定方法达到了最先进的性能。在 1 样本设置下，MVTec-AD 上的图像级和像素级 AUROC 分别达到 97.8% 和 98.0%，VisA 上分别达到 95.3% 和 98.7%，在 VisA 上图像级 AUROC 比最强基线提升 2.1 个百分点。代码可在 https://github.com/b-rbmp/Flownomaly 获取。","rv":"Flownomaly 面向少样本工业异常检测，在冻结 DINOv2 特征空间中以条件流匹配学习速度场，对高斯噪声做单步恢复得到正常 token 后验均值，再以查询与恢复 token 的平方残差输出异常信号。方法核心是流匹配的单步条件均值恢复，与「视觉生成」中的生成模型思路较近，但应用对象为工业缺陷图像，与有机分子晶体无直接关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1021/acs.cgd.6c00999","t":"Structure and Stability Prediction of Binary and Ternary Molecular Mixed Crystals Using Ensemble Free Energies","a":"Mixed crystals provide a route to tune the properties of molecular solids through continuous changes in composition. However, predicting their stability is challenging because it requires determining both substitution energies and configurational entropy across large configuration spaces. Here, we combine crystal structure prediction, force field lattice energy and lattice dynamics calculations, and Δ-machine-learning energy corrections with a scaled partition-function approach to assess structure prediction and evaluate binary and ternary mixed crystals of anthracene (ANT), acridine (ACR), and phenazine (PNZ). The composition-dependent ensemble free energy (ΔGensemble) was estimated without exhaustive enumeration of all configurations from representative ensembles of substituted supercell models of mixed crystals. Crystal structure prediction reproduces the known polymorphs as the lowest energy structures and the mixed crystal modelling approach reproduces the main experimental binary trends: ACR incorporation into ANT and the α and β polymorphs of PNZ, ANT incorporation into ACR form II, and the formation of a PNZ β-type ternary phase. Furthermore, we predict additional thermodynamically stable compositions, including PNZ incorporation into ACR form IX, and ternary crystals based on ACR forms II, VI and VII. Stable three-component regions arise from binary trends, with ACR mediating between both ANT and PNZ. These results demonstrate a practical framework for predicting the structure, thermodynamic stability and composition limits of molecular mixed crystals. The mixed crystal modelling methods are available within the mol-CSPy crystal structure prediction package.","au":["Anthony J. R. Payne","Sarah Madeira","Graeme Matthew Day"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00999","p":"2026-10-22","d":"2026-10-26","s":10.8,"tp":["csp"],"kw":["crystal structure prediction","crystal structure","lattice energy"],"src":["openalex","crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00999","who":["Graeme M. Day"],"tz":"使用系综自由能预测二元和三元分子混合晶体的结构与稳定性","az":"混合晶体为通过组成的连续变化来调节分子固体性质提供了一条途径。然而，预测其稳定性具有挑战性，因为它需要在大构型空间中同时确定取代能和构型熵。在此，我们将晶体结构预测、力场晶格能和晶格动力学计算以及Δ机器学习能量校正与缩放配分函数方法相结合，以评估结构预测并评价蒽（ANT）、吖啶（ACR）和菲嗪（PNZ）的二元和三元混合晶体。组成依赖的系综自由能（ΔGensemble）通过混合晶体取代超胞模型的代表性系综进行估算，而无需对所有构型进行穷举枚举。晶体结构预测将已知多晶型复现为最低能量结构，混合晶体建模方法复现了主要的实验二元趋势：ACR掺入ANT以及PNZ的α和β多晶型、ANT掺入ACR II型，以及PNZ β型三元相的形成。此外，我们预测了额外的热力学稳定组成，包括PNZ掺入ACR IX型，以及基于ACR II型、VI型和VII型的三元晶体。稳定的三组分区域源于二元趋势，其中ACR在ANT和PNZ之间起中介作用。这些结果展示了一个预测分子混合晶体结构、热力学稳定性和组成极限的实用框架。混合晶体建模方法可在mol-CSPy晶体结构预测软件包中使用。","rv":"针对蒽、吖啶、菲嗪的二元与三元分子混合晶体，结合晶体结构预测、力场晶格能、晶格动力学、Δ机器学习能量校正与缩放配分函数，估算组成依赖的系综自由能，无需穷举构型。复现了已知多晶型及实验二元趋势，并预测了新的热力学稳定组成。与「有机分子晶体」直接相关，属结构预测与热力学评估，与生成模型、视觉生成关系弱。","tr":"high","tw":"作者：Graeme M. Day；期刊在重点名单","why":""},{"k":"t:1cb3085840a024","t":"Automatically Building and Updating a Knowledge Graph of MLIP Models","a":"Complementing the many efforts in providing semantic representations of concepts, notions, and entities in materials science, we report and illustrate a process by which we can automatically build a knowledge graph of the fast evolving field of machine learning applied to the prediction of material properties, focusing on MLIP (Machine Learning Interatomic Potential). This LLM-based process relies on multiple steps, from information extraction in documents and articles to a validation loop using SHACL constraints to detect and correct errors. It is carried out on a model-by-model basis, focusing on the consistency of representation, therefore enabling an iterative construction where the addition of new models is facilitated. We illustrate the process by showing a few interesting aspects that can be queried from a knowledge graph built from the models listed in the Matbench Discovery leaderboard.","au":["Alexis Beer","L. Klochko","Mathieu d’Aquin"],"v":"HAL","u":"https://hal.science/hal-05785570","p":"2026-10-25","d":"2026-10-26","s":9.9,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential","mlip"],"src":["openalex"],"kind":"paper","ax":"","doi":"","who":[],"tz":"自动构建和更新 MLIP 模型知识图谱","az":"作为材料科学中为概念、观念和实体提供语义表示的众多工作的补充，我们报告并展示了一个流程，通过该流程可以自动构建一个知识图谱，覆盖机器学习应用于材料性质预测这一快速演进的领域，重点聚焦于 MLIP（机器学习原子间势）。这一基于大语言模型（LLM）的流程依赖多个步骤，从文档和文章中的信息提取，到使用 SHACL 约束进行验证循环以检测和纠正错误。该流程以逐模型为基础进行，关注表示的一致性，从而实现了迭代式构建，使得新模型的添加更加便捷。我们通过展示从基于 Matbench Discovery 排行榜中所列模型构建的知识图谱中可以查询到的若干有趣方面来说明该流程。","rv":"该工作利用 LLM 结合 SHACL 约束，逐模型自动构建并迭代更新 MLIP（机器学习原子间势）领域的知识图谱，核心贡献在于语义表示的一致性与可查询性。属于材料信息学与知识工程交叉方向，与「有机分子晶体」「生成模型」「视觉生成」「相关数学」均无实质关联，关系较弱。","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.1002/adma.75492","t":"Machine‐Learning‐Potential‐Driven Volcano Relationship in Grain Boundary Amorphicity and Ionic Transport of Antiperovskite Solid Electrolytes","a":"Ionic transport in solid‐state electrolytes is governed by interfacial disorder and local chemical environments, yet their microscopic design principles remain challenging because large‐scale interfacial kinetics are simulated using molecular dynamics (MD), where predictive design requires quantum‐level accuracy. Here, we use an actively learned machine learning interatomic potential (MLIP) to bridge this scale‐accuracy gap in halide‐tunable antiperovskite solid electrolytes. By varying the local Cl − /Br − ratio and quantifying interfacial amorphicity and ion flux, we identify an MLIP‐driven volcano relationship between structural disorder and ionic transport. Cl‐enriched grain boundaries remain overly ordered, whereas Br − enrichment induces excessive disorder that disrupts migration. Intermediate halide compositions maximize ionic transport through moderately amorphous environments. Guided by this relationship, we design an anion‐engineered grain boundary through selective halide tuning. These results establish controlled anion segregation as a strategy for reducing interfacial resistance and highlight MLIP‐enhanced MD as a predictive framework for transport and disorder engineering in solid‐state materials.","au":["Abdullah Bin Faheem","Haobo Li"],"v":"Advanced Materials","u":"https://doi.org/10.1002/adma.75492","p":"2026-10-23","d":"2026-10-26","s":9.2,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential","mlip"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1002/adma.75492","who":[],"tz":"机器学习势驱动的反钙钛矿固体电解质晶界非晶化与离子传输中的火山关系","az":"固态电解质中的离子传输受界面无序度和局部化学环境控制，但其微观设计原则仍具挑战性，因为大规模界面动力学需借助分子动力学（MD）模拟，而预测性设计需要量子级别的精度。在此，我们使用主动学习的机器学习原子间势（MLIP）来弥合卤化物可调反钙钛矿固体电解质中这一尺度-精度差距。通过改变局部 Cl−/Br− 比例并量化界面非晶化程度和离子通量，我们识别出结构无序度与离子传输之间由 MLIP 驱动的火山关系。富 Cl 晶界仍过于有序，而富 Br 则诱导过度无序从而破坏迁移。中间卤化物组成通过适度非晶化环境实现离子传输最大化。在该关系指导下，我们通过选择性卤化物调控设计了阴离子工程化晶界。这些结果确立了受控阴离子偏析作为降低界面电阻的策略，并突出了 MLIP 增强 MD 作为固态材料中传输与无序工程预测性框架的价值。","rv":"用主动学习 MLIP 做反钙钛矿固体电解质晶界分子动力学模拟，发现卤化物比例与离子传输间的火山关系，据此设计阴离子工程化晶界。属计算材料与分子动力学范畴，与有机分子晶体、生成模型、视觉生成均无直接关联，与相关数学也关系较弱，更接近统计物理与计算化学。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.30086","t":"Orbitol: Crystal Generation on Wyckoff Orbits","a":"Generative models propose crystalline materials by learning composition and geometry, but unconditional sampling gives no direct control over the space group, which constrains whether responses such as piezoelectricity are symmetry-allowed. We present Orbitol, a crystal generator built on the Crystalite diffusion Transformer that replaces atom tokens with Wyckoff-orbit tokens. Given a space group and a collection of occupied Wyckoff positions, Orbitol generates the atom type and free coordinates of each orbit together with a compatible lattice, so every valid structure is invariant under the operations of the requested group. It generates structures two to three orders of magnitude faster than the symmetry-aware baselines at the evaluated settings. On MP-20, 13.8% of Orbitol's attempts yielded stable or metastable, unique and novel structures that retained the requested space group after relaxation, compared with 10.8% for SGFM, the next best model. We also introduce SPARC, a score that combines retention of the raw detected space group with agreement between the retained-group and training distributions. Finally, we used Orbitol to generate candidates in piezoelectric crystal classes. Of the structures selected by internal screening, 89% passed our density functional theory checks, and 79% also matched no Materials Project or Alexandria entry with the same space group. Their median figure of merit was nine times that of the piezoelectric materials computed in the Materials Project, and 24% of the new candidates ranked in that set's top 10%.","au":["Ivan Žugec","Joshua Rosenthal","Ivor Lončarić","Jan-Willem van de Meent","Tin Hadži Veljković"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30086","p":"2026-10-21","d":"2026-10-26","s":9.2,"tp":["crystal-gen"],"kw":["crystal generation","generative models","symmetry-aware","wyckoff"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30086","who":[],"tz":"Orbitol：基于 Wyckoff 轨道的晶体生成","az":"生成模型通过学习成分和几何结构来提出晶体材料，但无条件采样无法直接控制空间群，而空间群决定了压电性等响应是否在对称性上被允许。我们提出 Orbitol，一个基于 Crystalite 扩散 Transformer 的晶体生成器，用 Wyckoff 轨道 token 替代原子 token。给定一个空间群和一组被占据的 Wyckoff 位置，Orbitol 生成每个轨道的原子类型和自由坐标以及一个兼容的晶格，使得每个有效结构在所请求群的对称操作下保持不变。在评估的设置下，它比对称性感知基线快两到三个数量级地生成结构。在 MP-20 上，Orbitol 13.8% 的尝试产生了稳定或亚稳的、独特且新颖的结构，且在弛豫后保留了所请求的空间群，而次优模型 SGFM 为 10.8%。我们还引入了 SPARC，一个将原始检测空间群的保留率与保留群分布和训练分布之间的一致性相结合的评分。最后，我们使用 Orbitol 在压电晶体类中生成候选结构。在内部筛选选出的结构中，89% 通过了我们的密度泛函理论检验，79% 也未与 Materials Project 或 Alexandria 中具有相同空间群的条目匹配。它们的中位数品质因数是 Materials Project 中计算的压电材料的九倍，24% 的新候选结构排在该集合的前 10%。","rv":"Orbitol 是基于扩散 Transformer 的晶体生成器，用 Wyckoff 轨道 token 替代原子 token，在生成时直接约束空间群对称性，比对称性感知基线快两到三个数量级。属于晶体结构生成与生成模型方向，与有机分子晶体关系较弱，但条件生成与对称性约束的方法论对分子晶体生成有参考意义。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26301","t":"Machine Learning-Assisted Discovery of Carbon-Related Defect Formation Mechanisms in Diamond","a":"Diamond is an important host material for functional defects such as solid-state spin qubits. During the defect creation by irradiation and subsequent thermal annealing, carbon-related defects, including vacancies and interstitials, are generated and can migrate to form new defect complexes. To investigate this kinetically driven process and reveal the formation mechanisms of the di-interstitials and di-vacancies in the neutral charge state, we fine-tuned a universal machine learning interatomic potential using a small dataset generated from density functional theory calculations. We obtained a barrier of 1.84 eV for mono-interstitial migration and found that two initially separated mono-interstitials only need to overcome a lower barrier to form di-interstitial configurations. Beyond the training data, the MLIP also identified the formation pathway for an additional di-interstitial configuration and a stepwise divacancy dissociation mechanism. These results reveal migration-assisted defect complex formation mechanisms and demonstrate how targeted MLIP training can identify reaction pathways.","au":["Grace Huang","Christopher Fivecoat","Xun Xu","Mengen Wang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26301","p":"2026-10-19","d":"2026-10-26","s":8.6,"tp":["mlip"],"kw":["machine learning interatomic potential","density functional theory","interatomic potential","mlip"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26301","who":[],"tz":"机器学习辅助发现金刚石中碳相关缺陷形成机制","az":"金刚石是固态自旋量子比特等功能缺陷的重要宿主材料。在辐照产生缺陷及随后的热退火过程中，会产生包括空位和间隙原子在内的碳相关缺陷，这些缺陷可以迁移并形成新的缺陷复合体。为了研究这一动力学驱动过程并揭示中性电荷态下双间隙原子和双空位的形成机制，我们使用由密度泛函理论计算生成的小数据集对一个通用机器学习原子间势进行了微调。我们得到单间隙原子迁移势垒为1.84 eV，并发现两个初始分离的单间隙原子只需克服更低的势垒即可形成双间隙原子构型。在训练数据之外，该机器学习原子间势还识别出另一种双间隙原子构型的形成路径以及逐步双空位解离机制。这些结果揭示了迁移辅助的缺陷复合体形成机制，并展示了如何通过针对性的机器学习原子间势训练来识别反应路径。","rv":"本文用微调的机器学习原子间势（MLIP）研究金刚石中碳相关缺陷（空位、间隙原子）的迁移与复合形成机制，属于计算材料与缺陷物理范畴。与「有机分子晶体 / 生成模型 / 视觉生成 / 相关数学」四类均关系较弱，最接近的或许是「相关数学」中势函数与能量面搜索，但本质仍是凝聚态物理问题。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.27762","t":"CrystalAR: Autoregressive Modeling for Symmetric Crystal Generation","a":"Deep generative modeling has achieved remarkable progress in crystal generation. Given the rich symmetries inherent in crystalline structures, recent work has sought to explicitly incorporate space-group symmetry into generative models, enabling more effective exploration of novel symmetry templates. Yet introducing symmetry templates increases the combinatorial complexity of stoichiometric relationships between atomic species and crystallographic sites, while creating a fundamental tension between flexible exploration of discrete crystallographic templates and faithful realization of these templates as continuous three-dimensional structures. To address these challenges, we propose CrystalAR, a unified autoregressive framework that models Wyckoff symmetry templates and complete crystal structures within a single generative sequence. Specifically, CrystalAR reformulates continuous coordinate generation as a symmetry-conditioned hierarchy of discrete spatial localization decisions, autoregressively refining the positions of all symmetry-inequivalent sites across resolution levels while jointly modeling their spatial configuration within each level. This discrete hierarchical formulation further enables constraint-aware search over both crystallographic templates and geometric realizations. As a result, CrystalAR retains strong symmetry-template generation capability while achieving competitive de novo generation performance and template-free crystal structure prediction (CSP) accuracy. These results suggest that symmetry-template generation can be retained alongside broadly competitive de novo generation performance and competitive CSP without reliance on symmetry templates retrieved from prior data, providing a promising alternative paradigm for symmetry-preserving crystal generation.","au":["Ziqiao Meng","Rongsheng Chen","郑直","N. Kazeev","Zhenkun Wang","Andrey Ustyuzhanin","Wee Sun Lee"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27762","p":"2026-10-20","d":"2026-10-26","s":8.6,"tp":["crystal-gen","csp"],"kw":["crystal generation","generative models","de novo","wyckoff","crystal structure prediction (csp)","crystal structure prediction","crystal structure","space group"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27762","who":[],"tz":"CrystalAR：面向对称晶体生成的自回归建模","az":"深度生成建模在晶体生成方面取得了显著进展。鉴于晶体结构中固有的丰富对称性，近期工作试图将空间群对称性显式地纳入生成模型，从而更有效地探索新型对称模板。然而，引入对称模板会增加原子种类与晶体学位点之间化学计量关系的组合复杂度，同时在灵活探索离散晶体学模板与将这些模板忠实地实现为连续三维结构之间产生了根本性张力。为应对这些挑战，我们提出 CrystalAR，一个统一的自回归框架，在单一生成序列中对 Wyckoff 对称模板和完整晶体结构进行建模。具体而言，CrystalAR 将连续坐标生成重新表述为对称性条件下的离散空间定位决策层级，自回归地跨分辨率层级细化所有对称不等价位点的位置，同时在每个层级内联合建模其空间构型。这种离散层级化表述进一步支持了对晶体学模板和几何实现的约束感知搜索。因此，CrystalAR 在保持强大的对称模板生成能力的同时，实现了具有竞争力的从头生成性能和无模板晶体结构预测（CSP）精度。这些结果表明，对称模板生成可以与广泛具有竞争力的从头生成性能和具有竞争力的 CSP 精度并存，且无需依赖从先前数据中检索的对称模板，为保持对称性的晶体生成提供了一种有前景的替代范式。","rv":"CrystalAR 将 Wyckoff 对称模板与完整晶体结构统一于单一自回归序列，把连续坐标生成重构为对称性条件下的离散空间定位决策层级，实现约束感知的模板与几何联合搜索。属生成模型在晶体结构预测中的应用，与「生成模型」关系最近，与「有机分子晶体」关系较弱，主要面向无机晶体。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1021/acs.cgd.6c00526","t":"Slipping into Solvates: Structure-Surface-Solvent Interplay in the Mechanochemical Solvate Formation of Ivacaftor","a":"Solvate formation in molecular crystals remains difficult to predict, particularly under non-equilibrium conditions, where the initial solid state, mechanically generated surfaces, anisotropic surface chemistry, and solvent properties collectively influence solid-solvent interactions. While mechanochemical processing is widely used to access new solid forms, the structural features that control solvent incorporation during mechanical activation are not yet well understood. In this work, we investigate mechanochemically induced solvate formation in ivacaftor as a model molecular crystal, focusing on the effects of solvent nature, liquid-additive volume, milling duration, and starting solid form. Form C transformed selectively to a solvate, in MeOH, THF, and DMSO, whereas the amorphous material exhibited broader solvate-forming behavior, including hydrate and non-polar solvate formation. The observed transformations could not be explained by solvent class or apparent dissolution capacity alone, demonstrating the importance of the starting solid state and specific host-solvent interactions. Crystal structure and surface analyses of form C identified the (200) plane as a plausible mechanically responsive plane whose alternative termination exposes polar groups involved in the resulting solvate structures. Overall, the results support a model in which mechanochemical solvate formation is governed by the interplay among the initial solid state, mechanically generated surfaces, and specific solid-solvent interactions.","au":["Argyro Chatziadi","Adéla Koryt’áková","Eliška Zmeškalová","Jan Rohlíček","Markéta Jarošová","Morgane Poupon","Luděk Ridvan","Miroslav Šoóš"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00526","p":"2026-10-24","d":"2026-10-26","s":8.2,"tp":["csp"],"kw":["molecular crystals","molecular crystal","crystal structure"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00526","who":[],"tz":"滑入溶剂化物：Ivacaftor 机械化学溶剂化物形成中结构-表面-溶剂的相互作用","az":"分子晶体中溶剂化物的形成仍然难以预测，特别是在非平衡条件下，初始固相状态、机械生成的表面、各向异性表面化学和溶剂性质共同影响固-溶剂相互作用。虽然机械化学加工被广泛用于获取新的固相形态，但在机械活化过程中控制溶剂纳入的结构特征尚未得到充分理解。在本工作中，我们以 ivacaftor 作为模型分子晶体，研究机械化学诱导的溶剂化物形成，重点关注溶剂性质、液体添加剂体积、研磨时间和起始固相形态的影响。C 型选择性地转化为溶剂化物，在 MeOH、THF 和 DMSO 中均如此，而无定形材料则表现出更广泛的溶剂化物形成行为，包括水合物和非极性溶剂化物的形成。观察到的转化不能仅用溶剂类别或表观溶解能力来解释，这表明起始固相状态和特定的主-溶剂相互作用的重要性。对 C 型的晶体结构和表面分析确定了 (200) 面作为一个可能的机械响应面，其替代终止面暴露出参与所形成溶剂化物结构的极性基团。总体而言，结果支持这样一个模型：机械化学溶剂化物形成受初始固相状态、机械生成的表面和特定固-溶剂相互作用之间相互作用的支配。","rv":"以 ivacaftor 为模型分子晶体，通过机械化学研磨探究溶剂化物形成机制，发现 C 型晶体 (200) 面在机械活化后暴露极性基团，是溶剂纳入的关键结构特征。工作聚焦有机分子晶体的固相转化与表面化学，与「有机分子晶体」直接相关，与生成模型、视觉生成及数学基本无关。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.29634","t":"Symmetry-Based Parameter Efficient Low-Rank Fine-Tuning for High-Throughput Calculation of Lattice Thermal Conductivity","a":"Accurate and efficient prediction of lattice thermal conductivity (LTC) is essential for developing materials for thermoelectric, microelectronic, and photovoltaic applications. Here, we present a methodology for high-throughput calculation of LTC across large datasets of compounds sharing a common crystal symmetry. Our approach combines fine-tuning of the MatterSim 1M universal machine-learned interatomic potential with LTC calculations based on the solution of the Boltzmann transport equation. We introduce a symmetry-based few-shot fine-tuning strategy (SBFS-FT) based on low-rank adaptation. In this approach, MatterSim 1M is fine-tuned on a small, carefully selected set of compounds that share a common crystal symmetry. The resulting potential is then applicable for accurate LTC calculations for compounds with this crystal symmetry, even if they were not included in the fine-tuning set. We tested our methodology on datasets of half-Heusler compounds (space group 216), materials with space group 225, and spinels (space group 227). We demonstrated that LTC calculations with MatterSim 1M fine-tuned using SBFS-FT exhibited a mean absolute relative difference from the reference results (obtained using moment tensor potentials and polyMLPs) 2-3 times smaller than that achieved with the non-fine-tuned MatterSim 1M potential. Moreover, the accuracy of LTC calculations with MatterSim 1M after SBFS-FT was comparable to that achieved using the MatterSim 1M potentials individually fine-tuned for each compound. Importantly, SBFS-FT enabled generation of the potential suitable for accurate LTC calculations across large compound datasets substantially faster than fine-tuning of MatterSim 1M for each compound individually, reducing the computational time by approximately a factor of 5-7 for a dataset o
