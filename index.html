uts. Appearance changes and geometric control branches operate through the same interface without modifying committed history. The measured steady-state DiT execution path achieves real-time generation throughput, demonstrating the efficiency of UniWorld for continuous visual world simulation.","au":["Xin Zhang","Yabo Chen","Shuaiwei Wang","Zixuan Duan","Haibin Huang","Feng Xu","Xuelong Li"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32381","p":"2026-10-23","d":"2026-10-26","s":5.2,"tp":["vision-gen"],"kw":["video generation","world model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32381","doi":"","who":[],"tz":"UniWorld：面向实时视觉世界模拟的统一世界模型","az":"连续视觉世界模拟需要将不断演化的场景几何与时间上持续的外观耦合起来。我们提出 UniWorld，一个统一框架，在共享的视频生成模型中整合深度轨迹与参考外观。其核心设计在统一的时间轴上维护视觉与几何历史。噪声对齐的重叠续延将已生成的历史置于规定的采样噪声水平，并仅提交新生成的潜变量。滚动深度潜状态保留对应的几何控制，增量读取新可用的几何信息，并在每个采样窗口内保持条件不变。这些机制共同确保潜历史的精确保留，同时将活跃深度状态限制在窗口大小之内。我们在多种场景类别上评估了连续生成、成对历史干预以及长时程行为。同一生成器支持估计深度、原生深度和按需模拟器深度，而缓存执行路径与增量执行路径产生逐位相同的输出。外观变化与几何控制分支通过同一接口操作，且不修改已提交的历史。实测的稳态 DiT 执行路径实现了实时生成吞吐量，展示了 UniWorld 在连续视觉世界模拟中的效率。","rv":"该工作提出 UniWorld，将深度轨迹与参考外观统一嵌入共享视频生成模型，用于连续视觉世界模拟。核心机制为噪声对齐的重叠续延与滚动深度潜状态，保证潜历史精确保留且活跃状态有界。属于视觉生成与视频生成方向，和生成模型关系密切，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29177","t":"ROCOCO: Robust Outline Completion of Occluded Curvilinear Objects","a":"We propose a learning-based generative model for completing curvilinear features under occlusion by environmental obstacles. To this end, we adopt a flow matching-based approach that supports the inpainting of occluded regions with the appropriate curvilinear features. To eliminate the reliance on privileged information about the occlusion a priori, we also train a UNet-based mask prediction model, which can identify regions for inpainting given only the occluded observation. The components of our approach are validated via experiments using procedurally-generated test cases, and the complete pipeline is validated using large public datasets for curvilinear objects. Against off-the-shelf inpainting baselines, ROCOCO is the strongest method by a wide margin when no occlusion mask is given, and is competitive with mask-supervised inpainting when one is, achieving best on full-image error and second only to LaMa on the occluded region, while using a completer of $7.7$M parameters against LaMa's $51$M and Stable Diffusion's $860$M.","au":["Ken Zheng","Jaimyn Drake"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29177","p":"2026-10-21","d":"2026-10-26","s":4.7,"tp":["gen-model"],"kw":["generative model","flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.29177","who":[],"tz":"ROCOCO：被遮挡曲线物体的鲁棒轮廓补全","az":"我们提出了一种基于学习的生成模型，用于在环境障碍物遮挡下补全曲线特征。为此，我们采用了一种基于流匹配的方法，该方法支持用适当的曲线特征对遮挡区域进行修复。为了消除对遮挡先验特权信息的依赖，我们还训练了一个基于 UNet 的掩码预测模型，该模型仅凭被遮挡的观测即可识别需要修复的区域。我们方法中的各组件通过程序化生成的测试用例实验进行了验证，完整流程则使用曲线对象的大型公开数据集进行了验证。与现成的修复基线相比，在未提供遮挡掩码时，ROCOCO 以较大优势成为最强方法；在提供掩码时，它与掩码监督修复方法具有竞争力，在全图误差上取得最佳，在遮挡区域上仅次于 LaMa，同时其补全器仅使用 770 万参数，而 LaMa 为 5100 万，Stable Diffusion 为 8.6 亿。","rv":"基于流匹配的曲线特征补全模型，针对环境遮挡下的曲线轮廓修复。用 flow matching 做遮挡区域 inpainting，另训 UNet 掩码预测器免去先验遮挡信息。属视觉生成中的图像修复方向，与有机分子晶体、生成模型及纯数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32256","t":"Representation Learning via Composite Subspace Flow Matching","a":"Distilling semantic meaning from raw image data remains a challenge in machine learning. Current self-supervised paradigms face a trade-off: joint-embedding architectures produce relevant features by aggressively discarding intra-class variance, irreversibly spatial and reconstruction. Conversely, generative models preserve spatial details but struggle to isolate semantics, as their optimization is dominated by pixel variations. To bridge this divide, we propose composite subspace flow matching (CSFM). Rather than corrupting data with unstructured isotropic noise, CSFM formulates representation learning as the variance-minimizing inversion of a deterministic degradation curriculum across spectral, color, and illumination subspaces. By bounding trajectory variance with hard temporal style truncation, a capacity-constrained encoder is driven to ignore transient style artifacts and encode persistent content. Empirical evaluations across CIFAR-10, CIFAR-100, and STL-10 show that CSFM yields competitive discriminative transferability while preserving generative synthesis across both convolutional and vision transformer architectures. By avoiding the collapse pathologies of non-generative methods, CSFM forms a smooth latent space that outperforms standard optimal transport flows on linear probing and few-shot classification, while enabling coherent synthesis and trajectory interpolation. These results confirm that steering the physical dynamics of generative flows offers a scalable paradigm for learning representations that are simultaneously linearly separable and generatively invertible.","au":["José Afonso","Mário Figueiredo"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32256","p":"2026-10-23","d":"2026-10-26","s":4.4,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32256","doi":"","who":[],"tz":"基于复合子空间流匹配的表示学习","az":"从原始图像数据中提炼语义信息仍然是机器学习领域的一项挑战。当前自监督范式面临一个权衡：联合嵌入架构通过激进地丢弃类内方差来产生相关特征，但不可逆地丧失了空间信息和重建能力。相反，生成模型保留了空间细节，但难以分离语义，因为其优化过程被像素变化所主导。为了弥合这一鸿沟，我们提出了复合子空间流匹配（CSFM）。CSFM 不使用无结构的各向同性噪声来破坏数据，而是将表示学习表述为在光谱、颜色和光照子空间上对确定性退化课程进行方差最小化逆过程。通过硬性时间风格截断来约束轨迹方差，容量受限的编码器被驱动去忽略瞬态风格伪影并编码持久内容。在 CIFAR-10、CIFAR-100 和 STL-10 上的实证评估表明，CSFM 在卷积和视觉 Transformer 架构上均能产生有竞争力的判别性迁移能力，同时保留生成式合成能力。通过避免非生成方法的坍缩病理，CSFM 形成了一个平滑的潜空间，在线性探测和少样本分类上优于标准最优传输流，同时支持连贯合成和轨迹插值。这些结果证实，引导生成流的物理动力学为学习同时具有线性可分性和生成可逆性的表示提供了一个可扩展的范式。","rv":"CSFM 将自监督表示学习建模为在光谱、颜色、光照子空间上对确定性退化课程的方差最小化逆过程，以硬性时间风格截断约束轨迹方差，驱动容量受限编码器忽略瞬态风格、编码持久内容。在 CIFAR 系列和 STL-10 上验证了判别迁移与生成合成的兼顾。与「视觉生成」和「生成模型」关系较近，核心工具是流匹配与最优传输，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32941","t":"If at First You Don't Succeed, Backtrack: Lightweight Recovery for Frozen VLAs","a":"Vision-Language-Action (VLA) models perform well on robotic manipulation, yet remain brittle once their own actions carry them into states their training data barely covers. Recovering from such failures usually requires recovery demonstrations, policy retraining, or a separate model at inference time. We introduce Backtrack, a lightweight failure detection and recovery mechanism for frozen VLAs that needs none of these. A small failure prediction head, trained only on outcome-labeled rollouts of the frozen policy, reads the VLA's existing internal representations to estimate whether the current episode will fail. When the predicted failure probability exceeds a threshold, a controller pauses the policy, retraces the arm's recently achieved motion, and hands control back to the unchanged policy so it can retry from an earlier configuration. The head adds only 0.48-0.88% to the policy's parameter count. We evaluate Backtrack on LIBERO with three VLAs spanning two action-generation families: SmolVLA and $π$0.5, which use flow-matching action experts, and the autoregressive $π$0-FAST. On LIBERO-Long, the suite of long-horizon multi-step tasks and the one on which all three policies fail most often, Backtrack reduces each policy's failure rate by 19-48%, raising success by up to 7.4 percentage points; on the three shorter suites, where control success is already 85-99%, its effect is smaller. On MetaWorld, all twelve controller configurations tested with SmolVLA improve on the unassisted policy.","au":["Thomas Landeg","Thierry Tambe"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32941","p":"2026-10-23","d":"2026-10-26","s":4.2,"tp":["gen-model"],"kw":["autoregressive","flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32941","doi":"","who":[],"tz":"若首次未成功，则回溯：面向冻结VLA的轻量级恢复机制","az":"视觉-语言-动作（VLA）模型在机器人操作上表现良好，但一旦其自身动作将系统带入训练数据几乎未覆盖的状态，便变得脆弱。从此类失败中恢复通常需要恢复演示、策略重训练，或在推理时使用一个独立模型。我们提出Backtrack，一种面向冻结VLA的轻量级失败检测与恢复机制，无需上述任何一项。一个小型失败预测头，仅在冻结策略的结果标注轨迹上训练，读取VLA已有的内部表征来估计当前回合是否会失败。当预测的失败概率超过阈值时，一个控制器暂停策略，回溯机械臂近期已完成的运动，并将控制权交还给未修改的策略，使其能从较早的构型重试。该预测头仅增加策略参数量的0.48%至0.88%。我们在LIBERO上用三个VLA评估Backtrack，涵盖两种动作生成家族：使用流匹配动作专家的SmolVLA和π0.5，以及自回归的π0-FAST。在LIBERO-Long（长时程多步任务套件，也是三个策略失败最频繁的套件）上，Backtrack将每个策略的失败率降低19%至48%，成功率最高提升7.4个百分点；在三个较短的套件上，控制成功率已达85%至99%，其效果较小。在MetaWorld上，与SmolVLA测试的所有十二种控制器配置均优于无辅助策略。","rv":"针对冻结VLA模型，提出Backtrack轻量失败恢复机制：训练极小预测头读取VLA内部表征判断回合是否将失败，超阈值后暂停策略、回溯机械臂近期运动、交还控制从较早构型重试。与「有机分子晶体 / 生成模型 / 视觉生成 / 相关数学」四类关系均弱，属机器人策略恢复问题，仅与生成模型在流匹配动作专家处有微弱关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1088/2632-2153/aeb69d","t":"Disentangling total-variance and signal-to-noise-ratio improves diffusion models","a":"Diffusion models have been widely adopted as a powerful generative framework across numerous scientific domains, yet their inherently iterative sampling process remains a significant computational bottleneck. While this is typically mitigated by reducing the number of reverse diffusion steps, sample quality becomes highly sensitive to the chosen noise schedule, i.e., the manner in which noise is introduced and the signal is reduced at each step. Although prior work has improved on the original variance-preserving and variance-exploding schedules, these approaches passively adjust the total variance, without direct independent control over it. In this work, we propose a novel total-variance/signal-to-noise-ratio disentangled (TV/SNR) framework, where TV and SNR can be controlled independently. Our approach reveals that schedules with exponentially exploding TV can be consistently improved by adopting a constant TV schedule while preserving the underlying SNR schedule. Furthermore, we demonstrate that generalizing the SNR schedule of optimal transport flow matching significantly enhances generation efficiency. Crucially, these gains remain consistent across various reverse diffusion solvers and reduce the search space to two independent and interpretable parameters, enabling fast and robust sampling for complex scientific applications, such as molecular structure generation.","au":["Khaled Kahouli","Winfried Ripken","Stefan Gugler","Oliver T. Unke","Klaus‐Robert Müller","Shinichi Nakajima"],"v":"Machine Learning Science and Technology","u":"https://doi.org/10.1088/2632-2153/aeb69d","p":"2026-10-20","d":"2026-10-26","s":4.1,"tp":["gen-math","gen-model"],"kw":["optimal transport","flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1088/2632-2153/aeb69d","who":[],"tz":"解耦总方差与信噪比改进扩散模型","az":"扩散模型已被广泛采用为众多科学领域中强大的生成框架，但其固有的迭代采样过程仍然是显著的计算瓶颈。虽然这通常通过减少反向扩散步数来缓解，但样本质量对所选择的噪声调度（即噪声引入和信号衰减的方式）变得高度敏感。尽管先前工作改进了原始的方差保持和方差爆炸调度，但这些方法只是被动地调整总方差，而无法对其进行直接的独立控制。在本工作中，我们提出了一种新颖的总方差/信噪比解耦（TV/SNR）框架，其中总方差和信噪比可以被独立控制。我们的方法揭示，具有指数爆炸总方差的调度可以通过采用恒定总方差调度来一致地改进，同时保留底层的信噪比调度。此外，我们证明泛化最优传输流匹配的信噪比调度能显著提升生成效率。关键的是，这些增益在各种反向扩散求解器中保持一致，并将搜索空间缩减为两个独立且可解释的参数，从而为复杂科学应用（如分子结构生成）实现快速且鲁棒的采样。","rv":"本文针对扩散模型噪声调度问题，提出TV/SNR解耦框架，将总方差与信噪比拆为两个独立可控参数，发现恒定TV调度可一致优于指数爆炸TV调度，并泛化了最优传输流匹配的SNR调度以提升采样效率。属于生成模型方向，核心贡献在扩散采样调度的数学结构上，与视觉生成和分子结构生成均有应用关联，与有机分子晶体无直接关系。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.32966","t":"ViT-H: Generative Video-To-Humanoid Control with Motion Tracking Feedback","a":"Learning humanoid control from monocular human videos offers a scalable way to acquire diverse whole-body behaviors. Yet, existing reconstruction-retargeting-tracking pipelines are limited in system-level scalability by separately optimized intermediate stages and cannot directly optimize reference motion executability using downstream tracking feedback. We present ViT-H, a video-to-humanoid control framework following a generation-and-tracking paradigm. ViT-H directly generates humanoid reference motions from videos with a diffusion model, bypassing human motion reconstruction and retargeting, and uses motion-tracking outcomes to post-train the generator with direct preference optimization. We further introduce an autoregressive variant that enables real-time humanoid video teleoperation with sub-400 ms latency. Extensive experiments on the Unitree G1 demonstrate that ViT-H outperforms state-of-the-art reconstruction-retargeting-tracking pipelines in both motion quality and executability. We further show that ViT-H scales favorably with model size and with both pre-training and post-training data scale, while motion-tracking feedback consistently improves executability across different motion trackers.","au":["Zimo He","Tianyi Bian","Zizhong Yang","Hongjie Li","Nan Jiang","Jieming Cui","Baoxiong Jia","Yizhou Wang","Siyuan Huang","Yixin Zhu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32966","p":"2026-10-23","d":"2026-10-26","s":4.0,"tp":["gen-model"],"kw":["diffusion model","autoregressive"],"src":["arxiv"],"kind":"preprint","ax":"2610.32966","doi":"","who":[],"tz":"ViT-H：基于运动跟踪反馈的生成式视频到人形机器人控制","az":"从单目人类视频中学习人形机器人控制提供了一种可扩展地获取多样化全身行为的方式。然而，现有的重建-重定向-跟踪流水线由于中间阶段各自独立优化而在系统级可扩展性上受到限制，且无法利用下游跟踪反馈直接优化参考动作的可执行性。我们提出 ViT-H，一个遵循生成与跟踪范式的视频到人形机器人控制框架。ViT-H 使用扩散模型直接从视频中生成人形机器人参考动作，绕过人类动作重建和重定向，并利用运动跟踪结果通过直接偏好优化对生成器进行后训练。我们进一步引入一个自回归变体，实现低于 400 毫秒延迟的实时人形机器人视频遥操作。在 Unitree G1 上的大量实验表明，ViT-H 在动作质量和可执行性两方面均优于最先进的重建-重定向-跟踪流水线。我们进一步表明，ViT-H 随模型规模以及预训练和后训练数据规模的增大而良好扩展，同时运动跟踪反馈在不同运动跟踪器上均能一致地提升可执行性。","rv":"ViT-H 用扩散模型从单目视频直接生成人形机器人参考动作，再以跟踪反馈做 DPO 后训练，将多阶段流水线压缩为生成加跟踪两步，并引入自回归变体实现实时遥操作。方法核心是扩散生成加偏好优化，与「生成模型」较近，输入端涉及视频理解故与「视觉生成」有交叉，与「有机分子晶体」无关，与「相关数学」关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.27986","t":"Recast the Past: Stable Long Video Generation with Full Context Memory","a":"Long-horizon video generation requires retaining an ever-expanding history, but conditioning on its growing token sequence is costly. Existing methods restrict or compress historical context, potentially losing information needed for future generation. This work proposes ReCam, which groups local spatiotemporal blocks of historical latents into vectors and projects them directly into the high-dimensional hidden space of a Diffusion Transformer. The model learns to use the resulting memory tokens through native self-attention, reducing token count while retaining block-level access to the full history. To mitigate temporal drift during autoregressive rollout, we further introduce dual-pointer denoising with separate noise schedules for recent context and target frames. Among the evaluated methods, ReCam achieves the highest VBench-Long overall score of 80.1 and competitive static-scene revisitation performance on R2M-Bench. It also leads on all four consistency metrics for off-screen subject reappearance, including clothing consistency of 4.09 versus 3.03 for the best baseline.","au":["Yukuo Ma","Cong Liu","Junke Wang","Junqi Liu","Haibin Huang","Zuxuan Wu","Xuelong Li"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27986","p":"2026-10-20","d":"2026-10-26","s":3.9,"tp":["gen-model","vision-gen"],"kw":["diffusion transformer","autoregressive","video generation"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27986","who":[],"tz":"重塑过去：基于全上下文记忆的稳定长视频生成","az":"长时程视频生成需要保留不断扩展的历史，但以其不断增长的 token 序列作为条件代价高昂。现有方法限制或压缩历史上下文，可能丢失未来生成所需的信息。本文提出 ReCam，将历史潜变量中的局部时空块分组为向量，并直接投影到扩散 Transformer 的高维隐空间中。模型通过原生自注意力学习使用由此产生的记忆 token，在减少 token 数量的同时保留对完整历史的块级访问。为缓解自回归展开过程中的时间漂移，我们进一步引入双指针去噪，为近期上下文和目标帧设置独立的噪声调度。在评估的方法中，ReCam 取得了最高的 VBench-Long 综合得分 80.1，并在 R2M-Bench 上具有竞争力的静态场景重访性能。它还在所有四个画外主体重新出现的一致性指标上领先，包括服装一致性为 4.09，而最佳基线为 3.03。","rv":"本文提出 ReCam，将历史潜变量的时空块投影为记忆 token 注入扩散 Transformer 隐空间，并以双指针去噪缓解自回归时间漂移，面向长视频生成。属于视觉生成（视频扩散模型）方向，与有机分子晶体、分子生成模型关系较弱，核心是扩散模型在时序记忆建模上的架构改进。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29679","t":"Lifting PCA in the Wasserstein Space","a":"Principal Component Analysis (PCA) is a fundamental tool for statistical dimension reduction, yet no canonical extension to distribution-valued data has emerged within the framework of optimal transport. While Wasserstein barycenters and Wasserstein least-squares regression provide canonical liftings of Euclidean averaging and linear regression in the Wasserstein space, an analogous principle for PCA has remained unexplored. In this paper, we introduce Lifted PCA, a canonical extension of Euclidean PCA to Wasserstein space, obtained through the framework of lifting functionals in the space of probability measures by convex extension. Starting from the classical variational formulations of PCA on the Stiefel and Grassmann manifolds, we derive two equivalent minimization problems over probability measures supported on these manifolds that correspond to Wasserstein barycenters with generalized costs. We establish an exact analogue of the equivalence between the Stiefel and Grassmann formulations of Euclidean PCA, preserving PCA's original variational structure under lifting. We further derive dual formulations and optimality conditions, and establish equivalences with multimarginal optimal transport and matching-for-teams problems. We also establish statistical consistency for empirical estimators and develop computational algorithms based on the Wasserstein barycenter formulation over the Stiefel manifold. Whereas Euclidean PCA summarizes vectors through projections onto an optimal low-dimensional linear subspace, Lifted PCA summarizes probability distributions through an optimal probability measure supported on multiple low-dimensional subspaces. Numerical experiments on distributional datasets illustrate the practical performance of the proposed methodology and its benefits for distributional data analysis.","au":["Jérémie Bigot","Clément Bonet"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29679","p":"2026-10-21","d":"2026-10-26","s":3.9,"tp":["gen-math"],"kw":["optimal transport","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29679","doi":"","who":[],"tz":"在 Wasserstein 空间中提升 PCA","az":"主成分分析（PCA）是统计降维的基本工具，然而在最优化传输框架内，尚未出现面向分布值数据的规范推广。尽管 Wasserstein 质心和 Wasserstein 最小二乘回归分别为 Wasserstein 空间中欧氏平均和线性回归提供了规范提升，但 PCA 的类似原理一直未被探索。本文引入 Lifted PCA，即欧氏 PCA 到 Wasserstein 空间的规范推广，通过概率测度空间中泛函提升的凸延拓框架获得。从 PCA 在 Stiefel 流形和 Grassmann 流形上的经典变分表述出发，我们推导出关于支撑在这些流形上的概率测度的两个等价极小化问题，它们对应于具有广义代价的 Wasserstein 质心。我们建立了欧氏 PCA 的 Stiefel 表述与 Grassmann 表述之间等价性的精确等价性的类比，在提升下保持了 PCA 原有的变分结构。我们进一步推导了对偶表述和最优性条件，并建立了与多边缘最优传输及团队匹配问题的等价性。我们还建立了经验估计量的统计一致性，并开发了基于 Stiefel 流形上 Wasserstein 质心表述的计算算法。欧氏 PCA 通过向最优低维线性子空间的投影来概括向量，而 Lifted PCA 则通过支撑在多个低维子空间上的最优概率测度来概括概率分布。在分布数据集上的数值实验展示了所提方法的实际性能及其对分布数据分析的优势。","rv":"本文将欧氏 PCA 经凸延拓提升到 Wasserstein 空间，得到 Lifted PCA，核心是在 Stiefel 与 Grassmann 流形上求广义代价的 Wasserstein 质心，并给出对偶、最优性条件及算法。方法属最优传输与流形变分分析交叉，与有机分子晶体、生成模型、视觉生成均无直接关联，与「相关数学」最为接近。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.28318","t":"Stabilizing Filters for Graph Signal Generation","a":"Generating graph signals is an important task in machine learning, and incorporating the underlying graph into a generative model enables structurally-informed distribution modeling. However, said graph is often noisy or imperfectly estimated, and structural errors can affect the generative process and the resulting signal distribution. While recent work has established stability guarantees for graph neural ordinary differential equations, the robustness of graph-aware reference dynamics, as used in topological Schrödinger bridge models, remains largely unexplored. Here, we investigate the structural stability of continuous-time generative models whose dynamics combine a graph filter with a learned graph neural network. We first derive a Wasserstein stability bound that quantifies the effect of graph perturbations on the generated signal distributions. Informed by this analysis, we then propose a principled framework for designing graph filters that balance structural stability with induced signal smoothing. We characterize the optimal filter design and provide an explicit family of polynomial filters with provable stability guarantees. Experiments on synthetic graphs and real-world fMRI signals support our theoretical findings, illustrating the enhanced structural stability of the proposed filters while preserving generative performance.","au":["Martin Schmidt","Gonzalo Mateos"],"v":"arXiv","u":"https://arxiv.org/abs/2610.28318","p":"2026-10-20","d":"2026-10-26","s":3.7,"tp":["gen-math"],"kw":["schrödinger bridge","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.28318","doi":"","who":[],"tz":"图信号生成的稳定化滤波器","az":"生成图信号是机器学习中的重要任务，将底层图结构纳入生成模型可以实现结构感知的分布建模。然而，该图往往存在噪声或估计不完美，结构误差可能影响生成过程及所得信号分布。尽管近期工作已为图神经常微分方程建立了稳定性保证，但拓扑薛定谔桥模型中所使用的图感知参考动力学的鲁棒性仍 largely 未被探索。本文研究一类连续时间生成模型的结构稳定性，其动力学由图滤波器与学习得到的图神经网络组合而成。我们首先推导了一个 Wasserstein 稳定性界，用以量化图扰动对生成信号分布的影响。基于该分析，我们进一步提出了一个有原则的框架，用于设计在结构稳定性与所诱导的信号平滑之间取得平衡的图滤波器。我们刻画了最优滤波器设计，并给出了一族具有可证明稳定性保证的显式多项式滤波器。在合成图和真实 fMRI 信号上的实验支持了我们的理论发现，表明所提滤波器在保持生成性能的同时增强了结构稳定性。","rv":"本文针对连续时间图信号生成模型，研究图滤波器在底层图存在结构扰动时的稳定性。核心工作是推导 Wasserstein 稳定性界，并据此设计一族具有可证明稳定性保证的多项式图滤波器，在合成图与 fMRI 数据上验证。与「生成模型」及「相关数学」（Wasserstein 几何、图信号处理）关系较近，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29476","t":"Generative Modeling via Nonlinear Schrödinger Bridges and Branching Diffusions","a":"We propose a new generative modeling framework grounded in forward-backward partial differential equations (PDEs). These equations arise naturally in mean-field game (MFG) theory, and are closely related to nonlinear Schrödinger systems. Our main contribution is to reinterpret this connection within the setting of generative modeling and to develop an efficient numerical methodology for its practical implementation. Specifically, we derive and characterize a nonlinear extension of the classical Schrödinger bridge problem through a coupled system of PDEs, yielding a model we call SBNL (Schrödinger Bridge NonLinear). To compute its solution, we design a simulation algorithm based on branching diffusions and the probabilistic representation of semilinear PDEs. The resulting method is embarrassingly parallel, scalable to high dimensions, and applicable to a broad class of nonlinear interaction functionals. We validate the approach through numerical experiments, including recovery of the classical Schrödinger bridge, nonlinear extensions with convex penalties (Gross-Pitaevskii) as well as potential interaction terms, and high-dimensional generative tasks such as image synthesis on the MNIST and FFHQ human face dataset. Furthermore, the same framework embeds score-based generative modeling, diffusion models, and tractable gaussian Schrödinger bridges.","au":["Mathias Grau","Pierre Henry-Labordère"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29476","p":"2026-10-21","d":"2026-10-26","s":3.7,"tp":["gen-math"],"kw":["schrödinger bridge","score-based"],"src":["arxiv"],"kind":"preprint","ax":"2610.29476","doi":"","who":[],"tz":"基于非线性薛定谔桥与分支扩散的生成建模","az":"我们提出了一种基于前向-后向偏微分方程（PDE）的新型生成建模框架。这些方程自然地出现在平均场博弈（MFG）理论中，并与非线性薛定谔系统密切相关。我们的主要贡献是在生成建模的语境下重新诠释这一联系，并开发一种高效的数值方法以实现其实际应用。具体而言，我们通过一个耦合的PDE系统推导并刻画了经典薛定谔桥问题的非线性扩展，得到了我们称为SBNL（薛定谔桥非线性）的模型。为计算其解，我们设计了一种基于分支扩散和半线性PDE概率表示的模拟算法。所得方法具有天然的并行性，可扩展到高维空间，并适用于广泛的非线性交互泛函。我们通过数值实验验证了该方法，包括恢复经典薛定谔桥、带有凸惩罚项（Gross-Pitaevskii）以及势交互项的非线性扩展，以及高维生成任务，如在MNIST和FFHQ人脸数据集上的图像合成。此外，同一框架还嵌入了基于分数的生成建模、扩散模型以及可处理的gaussian薛定谔桥。","rv":"提出SBNL模型，将平均场博弈中的前向-后向PDE与薛定谔桥问题结合，用分支扩散算法求解非线性扩展，在MNIST和FFHQ上完成图像合成。方法本质是扩散生成模型的PDE化表述，与「生成模型」最接近，数学工具涉及半线性PDE的概率表示，与「相关数学」也有交叉。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.60882/cispa.34759659","t":"SplineFlow: Flow Matching for Dynamical Systems with B-Spline Interpolants","a":"Flow matching is an emerging, scalable generative framework for characterizing continuous normalizing flows with wide-range applications. However, state-of-the-art methods are not well-suited for modeling dynamical systems, as they construct conditional paths that are restricted to linear interpolants, a suboptimal supervision signal, which may not capture the system's underlying state evolution. Moreover, constructing unified paths to satisfy multi-marginal constraints across observations is challenging, since naïve higher-order polynomials tend to be unstable and oscillatory. To address these limitations, we introduce SplineFlow, a theoretically grounded flow matching algorithm that jointly models conditional paths across observations via B-spline interpolation. Specifically, SplineFlow exploits the smoothness and stability of B-spline bases to learn the complex underlying dynamics in a structured manner while ensuring the multi-marginal requirements are met. Comprehensive experiments across deterministic and stochastic dynamical systems under various configurations, as well as cellular trajectory inference tasks, demonstrate that SplineFlow outperforms existing baselines, especially when the underlying dynamics are of higher degree or in irregular sampling regimes.","au":["Santanu Rathod","Pietro Liò","Xiao Zhang"],"v":"CISPA Helmholtz Center","u":"https://doi.org/10.60882/cispa.34759659","p":"2026-10-23","d":"2026-10-26","s":3.7,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.60882/cispa.34759659","who":[],"tz":"SplineFlow：基于 B 样条插值的动力系统流匹配","az":"流匹配是一种新兴的、可扩展的生成框架，用于表征连续归一化流，具有广泛的应用。然而，现有最先进的方法并不适合建模动力系统，因为它们构建的条件路径被限制为线性插值，这是一种次优的监督信号，可能无法捕捉系统底层的状态演化。此外，构建满足跨观测多边缘约束的统一路径具有挑战性，因为朴素的高阶多项式往往不稳定且呈振荡性。为了解决这些局限性，我们提出了 SplineFlow，一个有理论基础的流匹配算法，通过 B 样条插值联合建模跨观测的条件路径。具体而言，SplineFlow 利用 B 样条基的平滑性和稳定性，以结构化方式学习复杂的底层动力学，同时确保满足多边缘约束要求。在确定性动力系统和随机动力系统各种配置下的全面实验，以及细胞轨迹推断任务，表明 SplineFlow 优于现有基线方法，尤其是在底层动力学为高阶或采样不规则的情况下。","rv":"SplineFlow 是流匹配生成模型的变体，用 B 样条插值替代线性插值来建模动力系统，解决多边缘约束下路径构造不稳定的问题。它属于生成模型范畴，核心贡献在条件路径的构造方式上，与有机分子晶体和视觉生成关系较弱，与生成模型及样条插值数学更近。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.32159","t":"Playing Bias: Epistemic Games for Interpreting Text-to-Image Models","a":"Text-to-image (T2I) systems do not merely render prompts; they circulate defaults for \"what X looks like,\" shaping recognition through pose, camera, costume, props, and setting. While technical audits quantify disparities, they rarely cultivate the literacy needed to argue how images assemble stereotypes and confer authority. This paper translates a three-stage, humanities-informed framework into a set of epistemic games that make this cultural work visible and debatable: Interpret (art-historical close looking with AI outputs), Interrogate (counter-intent prompting as artistic exploration), and Expose (creative misuse through paired prompts with a constant motif and a BiasSlot rule, in which only the bias cue varies). In a pilot with undergraduate fine-arts students, the games shifted discussion from impressionistic reactions to concise, warranted hypotheses grounded in visual evidence, supported by lightweight classroom instruments that enabled reproducibility and structured collaboration. We argue that such game-based approaches foster critical literacy across educational contexts, equipping learners to recognize, discuss, and contest how T2I models encode bias.","au":["Amalia Foka"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32159","p":"2026-10-23","d":"2026-10-26","s":3.5,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32159","doi":"","who":[],"tz":"偏见游戏：用于解读文本到图像模型的认识论游戏","az":"文本到图像（T2I）系统不仅仅是对提示词进行渲染；它们传播着关于「X 看起来是什么样」的默认设定，通过姿态、镜头、服装、道具和场景来塑造认知。虽然技术审计可以量化差异，但它们很少培养论证图像如何组装刻板印象并赋予权威所需的素养。本文将一个三阶段的、受人文科学启发的框架转化为一组认识论游戏，使这种文化运作变得可见且可辩论：解读（对 AI 输出进行艺术史式的细读）、追问（以反意图提示作为艺术探索）、揭露（通过成对提示进行创造性误用，其中包含一个恒定母题和一条 BiasSlot 规则，在该规则中只有偏见线索发生变化）。在一项面向本科美术学生的试点中，这些游戏将讨论从印象式反应转变为基于视觉证据的简洁且有据可依的假设，并辅以轻量级课堂工具，使可重复性和结构化协作成为可能。我们认为，此类基于游戏的方法能在各种教育情境中培养批判性素养，使学习者能够识别、讨论并质疑 T2I 模型如何编码偏见。","rv":"本文针对文本到图像生成模型的文化偏见，将人文框架转化为三阶段认识论游戏（解读、追问、揭露），在美术本科课堂做试点，引导学生从印象式反应转向基于视觉证据的假设。与「视觉生成」最接近，关注 T2I 输出的偏见编码与批判性素养培养，不涉及模型架构或数学推导。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32407","t":"TIE: Training-free CLIP Embedding Guidance for Compositional Text-to-Image Alignment","a":"Text-to-image (T2I) diffusion models have advanced notably, but still fail to satisfy prompt conditions, resulting in attribute mismatches and missing objects. These errors normally fall into two categories: concept loss, when an object or attribute (i.e., concept) goes missing, and concept confusion, when an attribute is assigned to the wrong object or multiple objects blend together. Recent studies suggest that these challenges are caused by the limited capacity of CLIP text encoder to capture fine-grained semantic details. Although several methods have been proposed, concept loss and concept confusion persist in recent T2I models when handling multi-object, multi-attribute prompts. In this paper, we conduct an embedding-level analysis to develop a training-free, inference-time solution for concept loss and concept confusion across CLIP-based T2I models. We find that (1) concepts mentioned later exhibit higher embedding entropy, reflecting less concentrated representations that are more often associated with concept loss, and (2) the first CLIP attention layer captures the strength of binding between each object and its attribute. Guided by our findings, we introduce TIE, a method that improves semantic alignment through a single text-embedding update. TIE addresses concept loss via entropy-aware singular value amplification and resolves concept confusion through interpolation-extrapolation binding based on CLIP attention scores, all in a training-free manner. Extensive experiments demonstrate that TIE enhances semantic fidelity in multi-concept scenarios with minimal sampling overhead. The project page is available at https://hong-sujung.github.io/TIE/.","au":["Sujung Hong","Tae Eun Choi","Youngjun Jun","Chanyong Yoon","Seong Jae Hwang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32407","p":"2026-10-23","d":"2026-10-26","s":3.5,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32407","doi":"","who":[],"tz":"TIE：免训练 CLIP 嵌入引导用于组合式文本到图像对齐","az":"文本到图像（T2I）扩散模型已取得显著进展，但仍无法充分满足提示词条件，导致属性错配和物体缺失。这些错误通常分为两类：概念丢失，即某个物体或属性（即概念）缺失；以及概念混淆，即属性被分配到错误的物体上，或多个物体融合在一起。近期研究表明，这些挑战源于 CLIP 文本编码器在捕捉细粒度语义细节方面的有限能力。尽管已提出若干方法，但在处理多物体、多属性提示词时，概念丢失和概念混淆在近期 T2I 模型中仍然存在。本文在嵌入层面进行分析，开发了一种免训练、推理时即可应用的解决方案，以解决基于 CLIP 的 T2I 模型中的概念丢失和概念混淆问题。我们发现：（1）后提及的概念表现出更高的嵌入熵，反映出表征不够集中，且更常与概念丢失相关联；（2）CLIP 的第一层注意力层捕捉了每个物体与其属性之间绑定的强度。基于上述发现，我们提出 TIE，一种通过单次文本嵌入更新来改善语义对齐的方法。TIE 通过熵感知的奇异值放大来解决概念丢失，通过基于 CLIP 注意力分数的插值-外推绑定来解决概念混淆，整个过程均为免训练。大量实验表明，TIE 在多概念场景中以极小的采样开销提升了语义保真度。项目页面见 https://hong-sujung.github.io/TIE/。","rv":"TIE 是免训练的推理时方法，针对 CLIP 基 T2I 扩散模型中多概念提示词的概念丢失与混淆。核心是对文本嵌入做单次更新：熵感知奇异值放大恢复缺失概念，第一层 CLIP 注意力分数做插值-外推绑定纠正属性错配。与视觉生成（T2I 扩散）直接相关，与生成模型有交叉，与有机分子晶体无关，与相关数学（SVD、注意力）弱关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29227","t":"Schrödinger-Bass Bridge Barycenter Models for Measure-Valued Data","a":"Barycenter models, based on stochastic and deterministic optimal transport bridges between probability measures, have proven to be useful for supervised and unsupervised learning for (probability) measure-valued data. In this paper, we utilize the directional asymmetry and dual drift-diffusion control arising in the recently proposed Schrödinger-Bass Bridge (SBB) between two measures, and propose \\textit{SBB-encoder}, \\textit{SBB-decoder}, \\textit{SBB-symmetric}, and \\textit{SBB-Markovian} barycenter models. For each of these novel models, our first theoretical result establishes the existence of the SBB-barycenter under mild assumptions. Our second theoretical result characterizes the decoder SBB-barycenter of Gaussians where we show that for Gaussian input measures, the decoder formulation admits a Gaussian minimizer, reducing barycenter computation to a finite-dimensional optimization and yielding a compact algorithm. For general input measures, we derive a hybrid Wasserstein gradient particle descent scheme for all four formulations using the SBB dual representation. Finally, we utilize these algorithms for solving distributional-inverse/interpolation problems arising in the context of spatial images and single-cell RNA sequencing data, where we show that the SBB-decoder and Markovian barycenter allow us to interpolate between successive time points. Results show that our method outperforms existing barycenter models for measure interpolation and inference.","au":["Ngoc-Hai Nguyen","Thuan Nguyen","Prakash Ishwar","Shuchin Aeron"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29227","p":"2026-10-21","d":"2026-10-26","s":3.4,"tp":["gen-math"],"kw":["optimal transport","wasserstein"],"src":["arxiv"],"kind":"preprint","ax":"2610.29227","doi":"","who":[],"tz":"基于 Schrödinger-Bass 桥的测度值数据重心模型","az":"基于概率测度之间随机与确定性最优传输桥的重心模型，已被证明对（概率）测度值数据的有监督和无监督学习非常有用。在本文中，我们利用最近在两个测度之间提出的 Schrödinger-Bass 桥（SBB）中出现的方向不对称性和对偶漂移-扩散控制，提出了 SBB-encoder、SBB-decoder、SBB-symmetric 和 SBB-Markovian 重心模型。对于每个新型模型，我们的第一个理论结果在温和假设下建立了 SBB 重心的存在性。我们的第二个理论结果刻画了高斯分布的解码器 SBB 重心，我们证明对于高斯输入测度，解码器形式存在高斯极小化器，将重心计算归约为有限维优化问题，并给出一个紧凑算法。对于一般输入测度，我们利用 SBB 对偶表示为所有四种形式推导了一种混合 Wasserstein 梯度粒子下降方案。最后，我们利用这些算法解决空间图像和单细胞 RNA 测序数据中出现的分布逆问题与插值问题，其中我们表明 SBB-decoder 和 Markovian 重心允许我们在连续时间点之间进行插值。结果表明，我们的方法在测度插值和推断方面优于现有的重心模型。","rv":"基于 Schrödinger-Bass 桥的方向不对称性与对偶漂移-扩散控制，提出 encoder、decoder、symmetric、Markovian 四种测度重心模型，证明存在性，给出高斯情形有限维优化与一般情形混合 Wasserstein 梯度粒子下降算法，应用于空间图像及单细胞 RNA 测序的分布插值。与「相关数学」（最优传输、Schrödinger 桥、Wasserstein 几何）最接近，与生成模型有弱关联，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32373","t":"Past as State, Present as Attention: Persistent-State Blockwise Flow Matching for Long-Horizon Co-Speech Motion Generation","a":"Co-speech motion generation remains challenging over long horizons due to the need for temporal coherence and consistent style. Existing methods typically generate long motions segment by segment, either conditioning on a short seed of recent frames, which gradually drifts, or retaining ever-longer explicit histories, which are costly to maintain and hard to learn from limited data. We trace these limitations to a key asymmetry between past and present: past motion carries slowly varying style that should be compactly summarized, whereas the current segment exhibits fast-changing local dynamics that require fine-grained modeling. This asymmetry motivates a simple Past-As-State, Present-as-Attention principle for long-horizon co-speech motion generation. Following this principle, we propose PASPA, which summarizes past history with an inter-block persistent state and models the current segment with intra-block bidirectional self-attention. We instantiate PASPA within a blockwise flow matching framework, with multi-block supervision for effective training over variable histories, prefill-decode state caching for efficient rollout, and hybrid classifier-free guidance for enhanced history and speech conditioning. Extensive public-benchmark experiments show that PASPA achieves state-of-the-art FGD performance and preserves motion style across long-sequence generation.","au":["Yi Liu","Xiangyue Zhang","Jianfang Li","Jia Ma","Yisheng He","Jianqiang Ren"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32373","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32373","doi":"","who":[],"tz":"过去即状态、现在即注意力：面向长时间跨度语音伴随动作生成的持久状态块级流匹配","az":"语音伴随动作生成在长时间跨度上仍然具有挑战性，因为需要时间连贯性和风格一致性。现有方法通常逐段生成长动作，要么以最近帧的短种子为条件（会逐渐漂移），要么保留越来越长的显式历史（维护成本高，且难以从有限数据中学习）。我们将这些局限性归结为过去与现在之间的一个关键不对称性：过去的动作携带缓慢变化的风格，应当被紧凑地总结；而当前片段表现出快速变化的局部动态，需要细粒度建模。这种不对称性启发了一个简洁的「过去即状态、现在即注意力」原则，用于长时间跨度的语音伴随动作生成。遵循这一原则，我们提出PASPA，它通过块间持久状态总结过去历史，并通过块内双向自注意力建模当前片段。我们在块级流匹配框架中实现PASPA，采用多块监督以在可变历史上有效训练，采用预填充-解码状态缓存以实现高效展开，以及混合无分类器引导以增强历史和语音条件。大量公开基准实验表明，PASPA达到了最先进的FGD性能，并在长序列生成中保持了动作风格。","rv":"本文针对长时间跨度语音伴随动作生成中的风格漂移问题，提出PASPA框架：以块间持久状态紧凑总结过去风格，以块内双向自注意力精细建模当前局部动态，并在块级流匹配中结合多块监督与混合无分类器引导。属于生成模型与动作/视觉生成方向，与有机分子晶体关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32602","t":"Trajectory Matching: Discrete Flow Matching with Structured Actions","a":"The natural units of structured discrete generation are often not independent single-component edits but richer actions: attaching a fragment to a molecule, inserting a node together with an incident edge, or growing a hierarchy by adding a child. Yet most existing discrete flow matching methods (DFM) are restricted to independent component-wise edits over fixed-size states. This restriction stems from endpoint conditioning: endpoints fix the source and target during training but not the action sequence between them, making tractable conditional rates hard to define for complex actions that cannot be factorized component-wise. We propose trajectory matching, which conditions the flow on a full sequence of actions connecting the endpoints. This yields principled, simulation-free training targets for user-defined action spaces, including actions that change state size, modify multiple components, or depend on earlier actions. We prove that the resulting objective recovers the marginal flow and that trajectory matching strictly subsumes factorized DFM, while additionally capturing actions with prerequisite structure such as hierarchy growth or fragment-based molecule generation. Empirically, on tree and molecular graph generation, trajectory matching with domain-aligned actions matches or surpasses factorized DFM baselines (lifting MOSES validity from 92.8% to 99.2%) and transfers without retraining to substructure extension and linking. Trajectory matching enlarges the design space of discrete flow matching by turning the action vocabulary into a modeling choice. An interactive explanation of trajectory matching is available at https://niklaskemper.com/blog/trajectory-matching/.","au":["Niklas Kemper","Marten Lienen","David Lüdke","Stephan Günnemann"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32602","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.32602","doi":"","who":[],"tz":"轨迹匹配：基于结构化动作的离散流匹配","az":"结构化离散生成的自然单元往往不是独立的单分量编辑，而是更丰富的动作：将片段连接到分子上、插入一个节点及其关联边、或通过添加子节点来扩展层级结构。然而，大多数现有的离散流匹配方法（DFM）仅限于对固定大小状态进行独立的逐分量编辑。这一限制源于端点条件化：端点在训练时固定了源和目标，但未固定它们之间的动作序列，使得对于无法逐分量分解的复杂动作，难以定义可处理的条件速率。我们提出轨迹匹配（trajectory matching），将流条件化于连接端点的完整动作序列上。这为用户自定义的动作空间提供了有原则的、无需仿真的训练目标，包括改变状态大小、修改多个分量或依赖于先前动作的动作。我们证明了所得目标函数能恢复边缘流，且轨迹匹配严格包含因子化DFM，同时还能捕获具有前置结构的动作，如层级扩展或基于片段的分子生成。在实验上，在树和分子图生成任务中，使用领域对齐动作的轨迹匹配达到或超越了因子化DFM基线（将MOSES有效性从92.8%提升至99.2%），并且无需重新训练即可迁移到子结构扩展和连接任务。轨迹匹配通过将动作词汇表转化为建模选择，扩大了离散流匹配的设计空间。轨迹匹配的交互式解释可在 https://niklaskemper.com/blog/trajectory-matching/ 获取。","rv":"提出轨迹匹配方法，将离散流匹配的条件从端点扩展为完整动作序列，支持改变状态大小、多分量修改等结构化动作。在分子图生成上MOSES有效性达99.2%，无需重训即可迁移至子结构扩展。与「生成模型」最接近，属离散分子生成方向；与有机分子晶体、视觉生成关系弱；数学上涉及边缘流恢复的严格证明。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1016/j.aei.2026.105389","t":"FrameDiT: A dual-stream conditional diffusion Transformer for component layout design of steel braced frame structures","a":"","au":["Jiang Li","Wei Wang","Yuqing Gao"],"v":"Advanced Engineering Informatics","u":"https://doi.org/10.1016/j.aei.2026.105389","p":"2026-10-23","d":"2026-10-26","s":3.2,"tp":["gen-model"],"kw":["diffusion transformer"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.aei.2026.105389","who":[],"tz":"FrameDiT：用于钢支撑框架结构构件布局设计的双流条件扩散Transformer","az":"","rv":"FrameDiT 是一种双流条件扩散 Transformer，面向钢支撑框架结构的构件布局设计。其核心思路是将条件扩散生成模型引入结构工程，以生成满足约束的构件布置方案。与「生成模型」类别最为接近，属于扩散模型在工程布局问题上的应用，与视觉生成或有机分子晶体关系较弱。","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.27068","t":"ASTROLABE: A 3D Particle-Level Surrogate for Cosmology Simulation with Physical Flow Matching","a":"The microphysics of dark matter (DM) is imprinted on cosmological structure across an enormous dynamic range. Nonlinear cosmological observables are most reliably modeled with N-body and hydrodynamic simulations. However, systematic N-body scans over DM theory space are prohibitively expensive. Machine learning emulators provide a possible solution, but are currently limited by either low resolution or only the ability to emulate specific observables. We introduce Astrolabe, a flow-matching-based generative emulator designed to be free of both constraints. Astrolabe acts directly on the 6N phase-space coordinates of N individual particles. With no voxel grid in the output, there is no voxel-resolution ceiling, and in principle any observable can be measured from inference. Astrolabe is computationally tractable via a field-particle hybrid transformer in which every particle cross-attends to multiscale field tokens, so compute and memory are linear in N. Astrolabe incorporates physical flow matching by taking the prior distribution for the flow to be approximate COmoving Lagrangian Acceleration (COLA)-based coordinates rather than unphysical noise, with momentum and mass conservation enforced at all points along flow time. In the Lambda-CDM cases we test, Astrolabe produces realistic fields with accurate power spectra, halo mass functions, velocity profiles, and halo density profiles. We also observe out-of-distribution generalization, with accurate emulation of dark-acoustic oscillation initial conditions. Astrolabe is also capable of being fine-tuned to simulate very large N and we demonstrate this by emulating a TNG50-3-dark simulation at a fraction of the cost.This method represents a first step toward a general and powerful cosmology simulation surrogate, which may eventually permit the inclusion of baryonic physics and a systematic exploration of richer dark sector interactions.","au":["Ibrahim Elsharkawy","David Y. Curtin","Yonatan F. Kahn","Neal Weiner"],"v":"arXiv","u":"https://arxiv.org/abs/2610.27068","p":"2026-10-19","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.27068","who":[],"tz":"ASTROLABE：基于物理流匹配的三维粒子级宇宙学模拟替代模型","az":"暗物质（DM）的微观物理特性在巨大的动态范围内印刻于宇宙学结构之上。非线性宇宙学观测量最可靠的建模方式是N体模拟和流体动力学模拟。然而，在暗物质理论空间上进行系统性N体扫描的代价高得令人望而却步。机器学习模拟器提供了一种可能的解决方案，但目前要么受限于低分辨率，要么只能模拟特定观测量。我们提出Astrolabe，一种基于流匹配的生成式模拟器，旨在摆脱上述两种限制。Astrolabe直接作用于N个独立粒子的6N维相空间坐标。由于输出中不包含体素网格，因此不存在体素分辨率上限，原则上可以从推理结果中测量任何观测量。Astrolabe通过一种场-粒子混合Transformer实现计算上的可行性，其中每个粒子对多尺度场标记进行交叉注意力，因此计算量和内存均与N呈线性关系。Astrolabe通过物理流匹配实现，将流的先验分布取为基于近似共动拉格朗日加速度（COLA）的坐标而非非物理噪声，并在流时间的所有点上强制满足动量守恒和质量守恒。在我们测试的Lambda-CDM情形中，Astrolabe生成了逼真的场，具有精确的功率谱、晕质量函数、速度剖面和晕密度剖面。我们还观察到分布外泛化能力，能够精确模拟暗声学振荡初始条件。Astrolabe还能够通过微调来模拟非常大的N，我们通过以极小的代价模拟TNG50-3-dark模拟来展示了这一点。该方法代表了迈向通用且强大的宇宙学模拟替代模型的第一步，最终可能允许纳入重子物理并系统探索更丰富的暗扇区相互作用。","rv":"基于物理流匹配的生成式模拟器Astrolabe，直接操作N个粒子的6N维相空间坐标，通过场-粒子混合Transformer让每个粒子对多尺度场标记做交叉注意力，计算与内存均与N线性。先验取COLA近似坐标而非非物理噪声，流时间全程强制动量与质量守恒。本质是流匹配生成模型应用于宇宙学N体模拟替代，与生成模型最相关，与有机分子晶体、视觉生成关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26183","t":"HP-PnP-Flow: Hybrid Time Scheduling and Projection for Plug-and-Play Image Restoration via Flow Matching","a":"Image restoration is a fundamental inverse problem that seeks to recover high-quality images from degraded observations. Plug-and-Play (PnP) methods provide a flexible framework for integrating pretrained denoisers into iterative reconstruction, whereas flow matching offers an efficient generative modeling approach based on continuous-time ODE dynamics. Very recently, Martin et al.\\ (ICLR, 2025) developed a PnP-Flow method, which integrates the PnP framework with flow matching through a time-dependent denoiser constructed from a pretrained flow matching model.By incorporating a different time schedule and an additional pixel-space projection operator, this paper proposes a novel efficient PnP-Flow algorithm (HP-PnP-Flow) that enjoys rigorous convergence guarantees under mild assumptions, without imposing restrictive conditions on iterates required by the aforementioned work. Numerical experiments on CelebA and AFHQ-Cat demonstrate that the newly proposed HP-PnP-Flow algorithm significantly outperforms PnP-Flow on several restoration tasks such as denoising, deblurring, super-resolution, random inpainting, and box inpainting. Notably, our algorithm achieves comparable or better reconstruction quality with substantially fewer iterations, reducing the iteration count from $500$ to $100$ for deblurring and super-resolution on AFHQ-Cat.","au":["Yong Li","Xiaojie Wang","Xiaoyan Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26183","p":"2026-10-19","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26183","who":[],"tz":"HP-PnP-Flow：基于流匹配的混合时间调度与投影的即插即用图像恢复","az":"图像恢复是一个基本的逆问题，旨在从退化观测中恢复高质量图像。即插即用（PnP）方法为将预训练去噪器集成到迭代重建中提供了灵活框架，而流匹配则提供了一种基于连续时间常微分方程动力学的高效生成建模方法。最近，Martin 等人（ICLR, 2025）开发了一种 PnP-Flow 方法，通过从预训练流匹配模型构建的时间依赖去噪器将 PnP 框架与流匹配相结合。通过引入不同的时间调度和额外的像素空间投影算子，本文提出了一种新颖高效的 PnP-Flow 算法（HP-PnP-Flow），在温和假设下具有严格的收敛保证，且无需像前述工作那样对迭代序列施加限制性条件。在 CelebA 和 AFHQ-Cat 上的数值实验表明，新提出的 HP-PnP-Flow 算法在去噪、去模糊、超分辨率、随机修复和框修复等多种恢复任务上显著优于 PnP-Flow。值得注意的是，我们的算法以大幅减少的迭代次数实现了相当或更好的重建质量，将 AFHQ-Cat 上去模糊和超分辨率的迭代次数从 500 次减少到 100 次。","rv":"HP-PnP-Flow 将流匹配与即插即用框架结合，引入混合时间调度和像素空间投影算子，在温和假设下给出严格收敛保证，无需对迭代序列施加额外限制。实验在 CelebA 和 AFHQ-Cat 上验证了去噪、去模糊、超分辨率等任务的性能提升。与视觉生成和逆问题最接近，同时涉及 ODE 动力学与收敛性分析等数学工具。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.29581","t":"Unlocking Spatial Grounding in Flow-Matching Models via SNR Tuning","a":"Despite the success of foundation models in image synthesis, achieving fine-grained spatial control remains a significant challenge, typically requiring auxiliary structural adapters or complex inference-time steering. While modern vision-language (VLM) text encoders possess the latent capacity to represent spatial coordinates, generative models often fail to leverage this information. We demonstrate that the signal-to-noise ratio (SNR) distribution is a critical determinant of spatial grounding in flow-matching models. Using a novel synthetic benchmark of geometric primitives, we isolate structural mechanics from textural complexity inherent in natural imagery and introduce a rigorous color-aware layout metric to quantify spatial fidelity. We show that training on a centered SNR distribution results in poor layout adherence (25.9%). Instead, we identify high-noise regimes as a \"critical learning phase\" for spatial grounding. Shifting the training focus toward these stages increases layout adherence to 80.8%, effectively reaching the 83.6% reconstruction ceiling of the underlying variational autoencoder. We find that the necessity for this shift scales with resolution and aspect ratio variance, and that the conservative noise schedules employed by models like FLUX.1 are insufficient for precise layout adherence. Finally, we show that these findings translate to real-world imagery via the COCO dataset (1.0 vs. 57.3 Average Precision), where state-of-the-art layout adherence is unlocked through distribution tuning alone, without architectural modifications.","au":["Martin Thißen","Elke Hergenröther"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29581","p":"2026-10-21","d":"2026-10-26","s":3.1,"tp":["gen-model","vision-gen"],"kw":["flow matching","image synthesis"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.29581","who":[],"tz":"通过信噪比调优解锁流匹配模型的空间定位能力","az":"尽管基础模型在图像合成方面取得了成功，实现细粒度的空间控制仍然是一个重大挑战，通常需要辅助结构适配器或复杂的推理时引导。虽然现代视觉-语言（VLM）文本编码器具有表示空间坐标的潜在能力，但生成模型往往未能利用这一信息。我们证明了信噪比（SNR）分布是流匹配模型中空间定位的关键决定因素。利用一个新颖的几何基元合成基准，我们将结构机制与自然图像固有的纹理复杂性分离开来，并引入了一种严格的颜色感知布局度量来量化空间保真度。我们表明，在居中的 SNR 分布上进行训练会导致较差的布局遵循率（25.9%）。相反，我们识别出高噪声区间是空间定位的「关键学习阶段」。将训练重点转向这些阶段可将布局遵循率提升至 80.8%，有效达到了底层变分自编码器 83.6% 的重建上限。我们发现，这种转变的必要性随分辨率和宽高比方差而增大，且 FLUX.1 等模型所采用的保守噪声调度不足以实现精确的布局遵循。最后，我们通过 COCO 数据集（平均精度 1.0 对 57.3）表明，这些发现可以推广到真实图像，仅通过分布调优即可解锁最先进的布局遵循能力，无需架构修改。","rv":"这篇工作研究流匹配生成模型中的空间定位问题。方法核心是调整训练时的信噪比分布，将训练重心移向高噪声区间，从而提升布局遵循率。对象是视觉生成中的空间控制，与「视觉生成」类别最接近，与有机分子晶体、分子层面生成模型关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1016/j.aei.2026.105393","t":"Intelligent design of shear wall layout based on conditional flow matching","a":"","au":["Hongmei Zhang","Jiacheng Guo","Jixing Cao","Ahmed Sharhan"],"v":"Advanced Engineering Informatics","u":"https://doi.org/10.1016/j.aei.2026.105393","p":"2026-10-21","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.aei.2026.105393","who":[],"tz":"基于条件流匹配的剪力墙布局智能设计","az":"","rv":"本文以建筑结构剪力墙布局为对象，采用条件流匹配（conditional flow matching）方法实现智能设计。条件流匹配属流匹配生成模型框架，与生成模型大类有直接关联，但应用域为工程结构，与有机分子晶体、视觉生成关系较弱。因无摘要，具体建模细节与实验结论无法判断。","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.31222","t":"GLOW-FM: Efficient Generative Low-Light Image Enhancement with One-Step Latent Flow Matching","a":"Low-light image enhancement (LLIE) aims to recover well-exposed and perceptually faithful images from severely degraded observations. Recent diffusion-based generative methods achieve strong perceptual quality by leveraging powerful image priors, but their iterative sampling incurs substantial computational cost, limiting practical deployment. Despite recent efficiency gains in generative LLIE, high-quality enhancement with a single function evaluation and low overall computation remains challenging, particularly under diverse real-world low-light conditions. We introduce GLOW-FM, a one-step latent flow-matching framework for efficient generative LLIE. GLOW-FM performs conditional transport in the latent space of a frozen Tiny-VAE and leverages Terminal Velocity Matching (TVM) to enable enhancement with a single function evaluation. Matched comparisons with alternative one-step objectives support TVM as an effective design choice, and, to the best of our knowledge, this is its first adaptation to image restoration and specifically to LLIE. Extensive experiments on challenging real-world benchmarks demonstrate that GLOW-FM achieves competitive image quality and state-of-the-art cross-dataset generalization while requiring only a single function evaluation and 34 GFLOPs for the small variant. These findings highlight the potential of GLOW-FM to bring generative LLIE closer to practical deployment through single-step inference and compact latent modeling. Code will be made publicly available upon publication.","au":["Ariel Lapid","Yuval Haitman","Reuven Peretz","Arnon Netzer","Idit Diamant"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31222","p":"2026-10-22","d":"2026-10-26","s":3.1,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.31222","who":[],"tz":"GLOW-FM：基于单步潜空间流匹配的高效生成式低光照图像增强","az":"低光照图像增强（LLIE）旨在从严重退化的观测中恢复曝光良好且感知上忠实的图像。近期基于扩散的生成方法通过利用强大的图像先验实现了较强的感知质量，但其迭代采样带来了巨大的计算开销，限制了实际部署。尽管生成式LLIE在效率方面取得了近期进展，但在单次函数评估下实现高质量增强且保持低总体计算量仍然具有挑战性，尤其是在多样化的真实世界低光照条件下。我们提出了GLOW-FM，一个用于高效生成式LLIE的单步潜空间流匹配框架。GLOW-FM在冻结的Tiny-VAE的潜空间中执行条件传输，并利用终端速度匹配（TVM）实现单次函数评估的增强。与替代单步目标的匹配比较支持TVM作为有效的设计选择，并且据我们所知，这是其首次被应用于图像修复，特别是LLIE。在具有挑战性的真实世界基准上的大量实验表明，GLOW-FM仅需单次函数评估且小模型变体仅需34 GFLOPs，即可实现有竞争力的图像质量和最先进的跨数据集泛化能力。这些发现凸显了GLOW-FM通过单步推理和紧凑潜空间建模将生成式LLIE推向实际部署的潜力。代码将在发表后公开。","rv":"本文提出GLOW-FM，在冻结Tiny-VAE潜空间中用终端速度匹配（TVM）实现单步低光照图像增强，属于生成模型用于图像修复。与视觉生成（图像修复）方向较近，核心贡献是流匹配的单步化与TVM在修复任务的首次应用；与有机分子晶体、相关数学关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32459","t":"MDMR-Bench: A Multi-Dimensional Benchmark for Multi-Reference Image Generation","a":"Image generation models have rapidly advanced, with many models now supporting generation conditioned on multiple reference images and textual instructions. Such models enable a wide range of applications, including entity fusion and attribute transfer across images. However, existing benchmarks for multi-reference image generation rely on limited evaluation dimensions and fail to capture the diverse challenges of the task. To address this limitation, we propose MDMR-Bench, a Multi-Dimensional benchmark for Multi-Reference image generation. MDMR-Bench is organized around representative capability settings and consists of multiple evaluation subsets spanning diverse dimensions of multi-reference image generation, including (1) common entity fusion and attribute transfer, (2) multi-element extraction from a single image, (3) infographic manipulation, and (4) visual reasoning-intensive generation. This design enables systematic analysis of model capabilities and failure modes across different challenge dimensions. Furthermore, to achieve more reliable and interpretable evaluation, we introduce a checklist-based evaluation protocol that decomposes generation quality into fine-grained evaluation aspects. Instead of relying solely on holistic scoring, our framework uses structured checklists composed of both global-level and atomic-level queries, enabling more diagnostic assessment of model performance. By benchmarking both open-source and proprietary models, we demonstrate that MDMR-Bench provides fine-grained insights into model performance across different dimensions. The dataset and code are publicly available.","au":["Bowen Zheng","Jintao Lin","Changheng Yi","Haoran Yang","Binxiao Huang","Chenyang Lei","Rui Liu","Xihui Liu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32459","p":"2026-10-23","d":"2026-10-26","s":3.1,"tp":["vision-gen"],"kw":["image generation"],"src":["arxiv"],"kind":"preprint","ax":"2610.32459","doi":"","who":[],"tz":"MDMR-Bench：面向多参考图像生成的多维基准","az":"图像生成模型发展迅速，许多模型现已支持以多张参考图像和文本指令为条件的生成。此类模型支持广泛的应用，包括跨图像的实体融合和属性迁移。然而，现有的多参考图像生成基准依赖有限的评估维度，未能捕捉该任务的多样化挑战。为克服这一局限，我们提出 MDMR-Bench，一个面向多参考图像生成的多维基准。MDMR-Bench 围绕代表性能力设置进行组织，由多个评估子集组成，涵盖多参考图像生成的多个维度，包括（1）常见的实体融合与属性迁移，（2）从单张图像中提取多元素，（3）信息图操作，以及（4）视觉推理密集型生成。该设计使得能够跨不同挑战维度对模型能力和失败模式进行系统性分析。此外，为实现更可靠、更可解释的评估，我们引入了一种基于检查清单的评估协议，将生成质量分解为细粒度的评估方面。我们的框架不再仅依赖整体评分，而是使用由全局级和原子级查询组成的结构化检查清单，从而实现对模型性能更具诊断性的评估。通过对开源模型和专有模型进行基准测试，我们证明 MDMR-Bench 能够跨不同维度提供关于模型性能的细粒度洞察。数据集和代码已公开可用。","rv":"该工作提出 MDMR-Bench，一个面向多参考图像生成的多维评测基准，涵盖实体融合、属性迁移、多元素提取、信息图操作和视觉推理生成等维度，并引入基于检查清单的细粒度评估协议。属于视觉生成方向，与有机分子晶体、生成模型及数学关系较弱，核心贡献在图像生成评测体系。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32768","t":"SCDM-HTD: Spectral-Wise Conditional Diffusion Model for Hyperspectral Target Detection","a":"Hyperspectral target detection (HTD) aims to locate and recognize objects at a fine-grained scale, playing a pivotal role in remote sensing. Despite significant progress, current HTD methods primarily focus on feature comparison while neglecting distribution learning for background-target separation, which can limit detection robustness in practical applications. This paper addresses this issue by introducing a spectral-wise conditional diffusion model that reformulates HTD as a task of generating a detection map. Specifically, we treat background and target confidence scores as training samples and use the corresponding pixel spectra as guiding conditions to capture the distributional discrepancy between background and target through diffusion and denoising. To enhance practical applicability, we propose a lightweight conditional denoising network based on multilayer perceptron to map noisy confidence scores to their ideal counterparts and adopt a deterministic reverse non-Markov chain to skip sampling steps, thereby accelerating the generation process. Furthermore, we introduce a composite loss to improve background-target separation. This loss integrates constrained energy minimization loss to enhance target saliency and suppress the background by maximizing the target response while minimizing average output energy, alongside binary cross-entropy loss to classify background and target using pixel-wise labels. Experimental results on four benchmark datasets demonstrate the effectiveness of the proposed method, with improvements in both quantitative metrics and qualitative visual effects.","au":["Dunbin Shen","Wenfeng Kong","Jianjun Liu","Xiaorui Ma","Hongyu Wang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32768","p":"2026-10-23","d":"2026-10-26","s":3.0,"tp":["gen-model"],"kw":["diffusion model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32768","doi":"","who":[],"tz":"SCDM-HTD：面向高光谱目标检测的逐光谱条件扩散模型","az":"高光谱目标检测（HTD）旨在以细粒度尺度定位和识别目标，在遥感中发挥着关键作用。尽管已有显著进展，当前HTD方法主要关注特征比较，而忽视了用于背景-目标分离的分布学习，这可能限制了实际应用中的检测鲁棒性。本文通过引入一个逐光谱条件扩散模型来解决这一问题，该模型将HTD重新表述为生成检测图的任务。具体而言，我们将背景和目标置信度分数作为训练样本，并使用对应的像素光谱作为引导条件，通过扩散和去噪来捕捉背景与目标之间的分布差异。为增强实际适用性，我们提出了一种基于多层感知机的轻量级条件去噪网络，将含噪置信度分数映射到其理想对应值，并采用确定性反向非马尔可夫链来跳过采样步骤，从而加速生成过程。此外，我们引入了一种复合损失函数以改善背景-目标分离。该损失函数整合了约束能量最小化损失，通过最大化目标响应同时最小化平均输出能量来增强目标显著性并抑制背景，并结合二元交叉熵损失，利用逐像素标签对背景和目标进行分类。在四个基准数据集上的实验结果证明了所提方法的有效性，在定量指标和定性视觉效果方面均有提升。","rv":"将高光谱目标检测重构为条件扩散生成任务，以像素光谱为条件、置信度分数为样本，通过扩散去噪捕捉背景与目标的分布差异。采用轻量MLP去噪网络和确定性反向非马尔可夫链加速采样，并设计复合损失增强分离效果。方法本质是生成模型在遥感检测中的应用，与视觉生成（生成检测图）关系较近，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26244","t":"RECAP: Reciprocal Sparse Attention and Hierarchical Caching for Efficient Video Diffusion","a":"Diffusion transformers generate high-quality videos but remain computationally expensive. Sparse attention and temporal caching reduce computation within and across denoising steps, respectively, offering a natural composition. However, predictions produced with sparse attention become sources for temporal reuse, coupling their errors along the sampling trajectory. We observe that improving the accuracy of these sources recovers fidelity without changing the reuse schedule, and that sparsification errors remain directionally aligned across nearby steps, suggesting that correction information can be shared rather than recomputed. These observations motivate RECAP, a training-free method that couples sparse attention with hierarchical caching through reciprocal correction, adaptively coordinated by online error feedback. Cached dense refinement corrects omitted interactions in current sparse estimates, while fresh sparse statistics track input changes and regulate the aging correction. The resulting predictions then renew the sources for whole-step prediction reuse, allowing prediction history to advance between dense refreshes. We evaluate RECAP on multiple video diffusion models against sparse-attention methods, caching methods, and their direct compositions. On HunyuanVideo at 720p 5-second generation, RECAP achieves a 3.05x speedup and outperforms all tested direct compositions in both fidelity and inference speed.","au":["Tiange Xu","Kai Liu","Linghe Kong","Yulun Zhang"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26244","p":"2026-10-19","d":"2026-10-26","s":3.0,"tp":["vision-gen"],"kw":["video diffusion"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.26244","who":[],"tz":"RECAP：面向高效视频扩散的互校正稀疏注意力与分层缓存","az":"扩散Transformer能生成高质量视频，但计算开销仍然很大。稀疏注意力和时间缓存分别在去噪步骤内部和步骤之间降低计算量，二者天然可以组合。然而，用稀疏注意力产生的预测会成为时间复用的来源，使其误差沿采样轨迹耦合。我们观察到，提高这些来源的精度可以在不改变复用调度的情况下恢复保真度，并且稀疏化误差在相邻步骤之间保持方向一致，这意味着校正信息可以共享而非重新计算。这些观察启发了RECAP，一种无需训练的方法，通过互校正将稀疏注意力与分层缓存耦合，并由在线误差反馈自适应协调。缓存的稠密精化校正当前稀疏估计中被遗漏的交互，而新鲜的稀疏统计量跟踪输入变化并调节老化校正。由此产生的预测随后更新整步预测复用的来源，使预测历史能够在稠密刷新之间推进。我们在多个视频扩散模型上评估RECAP，与稀疏注意力方法、缓存方法及其直接组合进行对比。在HunyuanVideo的720p 5秒生成任务上，RECAP实现了3.05倍加速，并在保真度和推理速度上均优于所有测试的直接组合方法。","rv":"针对视频扩散Transformer推理加速，RECAP将稀疏注意力与分层时间缓存通过互校正耦合，由在线误差反馈自适应协调，无需训练。属于视觉生成（视频扩散）的推理效率优化，与有机分子晶体、文本/分子生成模型关系较弱，核心在注意力稀疏化与缓存策略的协同设计。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.30775","t":"GWDM: A Guided Wavelet Diffusion Model for Realistic Histopathology Image Generation","a":"Histopathology images are recognized as a reliable and comprehensive modality for Deep Learning (DL) based diagnosis. However, effectiveness is constrained by limited large-scale annotated datasets, as collecting expert-labeled medical data is costly and time-intensive. Recent advances in generative models, particularly diffusion models, demonstrate strong capabilities in synthesizing medically relevant content for dataset augmentation. Existing generative frameworks treat histopathology patches as generic natural images, failing to enforce biological constraints such as histomorphological structures and heterogeneous staining patterns essential for valid synthesis. We propose a guided wavelet diffusion model (GWDM) framework that captures image details at multiple scales using wavelets and leverages controllable conditioning based on domain-specific histopathological features (e.g., tissue patterns and color variations). We further formulate a histomorphological guidance loss applied to real and generated patches. A loss ramping strategy gradually introduces these constraints during training, ensuring stable optimization and robust modeling of tissue architecture. GWDM was evaluated on three benchmark datasets (BCSS, MoNuSeg, and PAIP2019), consistently outperforming state-of-the-art generative methods. Ablation studies confirmed that domain-guided conditioning, perceptual loss, and structural similarity loss each contribute meaningfully to synthesis quality. Downstream nuclei and tissue segmentation experiments further validated the clinical utility of GWDM-generated images, demonstrating consistent performance improvements when synthetic data augments real training sets. This work shows that domain-specific conditioning and dual-loss optimization generate realistic histopathology patches, reducing data scarcity and improving clinical downstream segmentation performance.","au":["Abdullah","Tao Huang","Ickjai Lee","Lei Bi","Euijoon Ahn"],"v":"arXiv","u":"https://arxiv.org/abs/2610.30775","p":"2026-10-22","d":"2026-10-26","s":3.0,"tp":["vision-gen","gen-model"],"kw":["image generation","diffusion model"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.30775","who":[],"tz":"GWDM：用于逼真组织病理学图像生成的引导小波扩散模型","az":"组织病理学图像被认为是基于深度学习（DL）诊断的一种可靠且全面的模态。然而，其有效性受到大规模标注数据集有限的制约，因为收集专家标注的医疗数据成本高昂且耗时。生成模型的最新进展，尤其是扩散模型，在合成医学相关内容以进行数据集增强方面展现出强大能力。现有生成框架将组织病理学图像块视为通用自然图像，未能施加对有效合成至关重要的生物学约束，如组织形态学结构和异质性染色模式。我们提出一个引导小波扩散模型（GWDM）框架，利用小波在多尺度上捕获图像细节，并基于领域特定的组织病理学特征（如组织模式和颜色变化）利用可控条件。我们进一步构建了一个组织形态学引导损失，应用于真实和生成的图像块。一种损失渐增策略在训练过程中逐步引入这些约束，确保稳定的优化和对组织结构的鲁棒建模。GWDM在三个基准数据集（BCSS、MoNuSeg和PAIP2019）上进行了评估，持续优于最先进的生成方法。消融实验证实，领域引导条件、感知损失和结构相似性损失各自对合成质量有显著贡献。下游细胞核和组织分割实验进一步验证了GWDM生成图像的临床效用，表明当合成数据增强真实训练集时，性能有一致的提升。本工作表明，领域特定条件和双损失优化能够生成逼真的组织病理学图像块，减少数据稀缺性并改善临床下游分割性能。","rv":"提出引导小波扩散模型GWDM，用小波多尺度捕获病理图像细节，结合组织模式与颜色变化等领域条件及组织形态学引导损失，在三个基准数据集上生成组织病理学图像块，用于下游细胞核与组织分割的数据增强。属于视觉生成与生成模型交叉方向，与有机分子晶体无直接关联。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.31981","t":"Compatible Likelihoods for Flow Matching on Manifolds","a":"On the simplest non-Euclidean manifold, the 1D flat torus, we exhibit a distribution where a recently proposed extension of Riemannian flow matching is globally optimized by a velocity field that pushes samples away from the data distribution. We trace this failure mode to a property we call compatibility; a likelihood-based flow matching objective is compatible if its population minimizer recovers the marginal velocity field induced by the data and coupling. We give a general condition for compatibility, apply it to existing methods, and bound the worst-case error in terms of a residual component vanishing under compatibility. Next, we note that existing compatible objectives put density on velocities that are infeasible on compact manifolds. We propose an objective built from an exponential family over endpoints, with the conditional velocity as sufficient statistic, which is both compatible and supported only on feasible velocities. This manifests as a reweighting of the flow matching loss which, on constant-curvature manifolds, treats errors in flow speed and direction differently. Empirically, our method recovers the correct velocity field on the test case, outperforms prior methods on high-dimensional product tori, and obtains substantial NLL improvements over prior work on two of four standard geospatial benchmarks on the sphere at moderate runtime overhead. On a large dataset of high-dimensional human poses, our method outperforms prior work according to sample-based metrics.","au":["Lucas Ng","Georgios Batzolis","Mark Girolami"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31981","p":"2026-10-22","d":"2026-10-26","s":3.0,"tp":["gen-model"],"kw":["flow matching"],"src":["arxiv"],"kind":"preprint","ax":"2610.31981","doi":"","who":[],"tz":"流形上流匹配的兼容似然","az":"在最简单的非欧几里得流形——一维平坦环面——上，我们展示了一个分布，其中最近提出的黎曼流匹配扩展被一个将样本推离数据分布的速度场全局优化。我们将这一失效模式归因于我们称为「兼容性」的性质；基于似然的流匹配目标函数是兼容的，如果其总体最小化器能恢复由数据和耦合诱导的边缘速度场。我们给出了兼容性的一个一般条件，将其应用于现有方法，并用一个在兼容性下消失的残差分量来界定最坏情况误差。接下来，我们注意到现有的兼容目标函数在紧致流形上对不可行的速度赋予了密度。我们提出了一个基于端点上的指数族构建的目标函数，以条件速度为充分统计量，该目标函数既兼容又仅支撑在可行速度上。这表现为对流匹配损失的重加权，在常曲率流形上，对流速误差和方向误差的对待方式不同。在实验上，我们的方法在测试用例上恢复了正确的速度场，在高维乘积环面上优于先前方法，并在球面上四个标准地理空间基准中的两个上以适中的运行时开销获得了相比先前工作的显著负对数似然改进。在一个高维人体姿态的大型数据集上，我们的方法根据基于样本的指标优于先前工作。","rv":"本文研究黎曼流形上的流匹配生成模型，提出「兼容性」概念并构造仅支撑在可行速度上的指数族目标函数，修正了紧致流形上速度不可行的问题。属于生成模型与微分几何的交叉方向，与「相关数学」最接近，核心涉及流形上的概率建模与速度场优化。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32512","t":"Fast and Useful: Adapting Distilled Generators for Visual Learning","a":"Distilled text-to-image models generate images quickly, but classifiers trained on those images can perform substantially worse than classifiers trained on images from their slower base models. We adapt released distilled generators to produce better training data while retaining fast generation. We fit a low-rank update to the student's first prediction so that it reaches an intermediate state produced by its unguided base, then disable the update and let the unchanged student finish generation. The base supplies training targets and is absent at inference. Guided targets and shorter jumps give classifiers lower accuracy in our ablations, showing why the state used for supervision matters. Across three generator families, the adapted images train better classifiers than images from the released students. With class-name templates at full ImageNet-1k scale, ResNet-50 top-1 rises from 8.4% to 34.2% for FLUX.2-klein and from 12.7% to 32.1% for SD-Turbo, using two and three denoiser evaluations per image, respectively. Fixed adapters also improve results on additional classes, fine-grained datasets, and other learner architectures and training recipes. Template-based adaptation remains useful against richer-prompt alternatives, while the benefit of combining adaptation with LLM generation prompts depends on the generator. Adapting a single generation step makes fast generators substantially more useful for training visual models.","au":["Patryk Bartkowiak","Dominik Michels","Sören Pirk","Wojciech Pałubicki"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32512","p":"2026-10-23","d":"2026-10-26","s":2.9,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32512","doi":"","who":[],"tz":"快速且有用：适配蒸馏生成器用于视觉学习","az":"蒸馏文生图模型能快速生成图像，但用这些图像训练的分类器性能可能远逊于用其较慢基模型图像训练的分类器。我们对已发布的蒸馏生成器进行适配，使其在保留快速生成的同时产出更优的训练数据。具体做法是：对学生模型的第一步预测拟合一个低秩更新，使其到达无引导基模型所产生的中间状态，随后关闭该更新，让未修改的学生模型完成剩余生成。基模型提供训练目标，推理时不存在。消融实验表明，使用引导目标或更短的跳跃步长会使分类器精度下降，说明用于监督的状态选择至关重要。在三个生成器家族上，适配后的图像训练出的分类器优于已发布学生模型的图像。在完整 ImageNet-1k 规模、使用类别名模板的条件下，ResNet-50 的 top-1 准确率对 FLUX.2-klein 从 8.4% 提升至 34.2%，对 SD-Turbo 从 12.7% 提升至 32.1%，分别使用每张图像两次和三次去噪器评估。固定适配器在额外类别、细粒度数据集以及其他学习器架构和训练方案上同样带来提升。基于模板的适配相较于更丰富的提示词替代方案仍然有效，而将适配与 LLM 生成提示词结合所带来的收益则取决于具体生成器。适配单步生成即可让快速生成器在训练视觉模型方面变得显著更有用。","rv":"对蒸馏文生图模型首步预测施加低秩更新，使其对齐无引导基模型的中间状态，再关闭更新让学生完成生成，推理时不依赖基模型。实际用基模型提供监督目标，让快速生成器产出更优分类器训练数据。与视觉生成直接相关，与有机分子晶体或分子生成模型关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32390","t":"PASTA: Prompt-Aware Annealed Diffusion Sampling","a":"While Diffusion models produce high-quality images, real-world visual design requires intentionally preserving clean regions for headlines, logos, or UI elements. Existing layout-aware text-to-image methods struggle to strictly preserve reserved regions, often introducing unwanted content that complicates downstream editing. Existing approaches either manipulate attention to displace content or suppress conditioning via noise-level interventions. However, these methods sacrifice visual coherence, producing flat regions or noticeable style inconsistencies between reserved and non-reserved areas. To address this limitation, we propose a Prompt-Aware Shared-Latent Training-Free Annealed Diffusion Sampling (PASTA), a training-free framework that enforces reserved-region constraints by selectively applying semantic guidance to object-allowed regions during sampling. PASTA operates on a shared latent trajectory, where full-prompt and context-prompt guidance are fused through mask-guided sampling. An annealed schedule suppresses semantic leakage during early denoising stages while gradually restoring visual consistency in later stages. Extensive experiments demonstrate that PASTA improves reserved-region fidelity while preserving overall image realism and perceptual consistency.","au":["Ren Ajiki","Ryugo Morita","Stanislav Frolov","Brian Bernhard Moser","Ko Watanabe","Riku Takahashi","Andreas Dengel","Jinjia Zhou"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32390","p":"2026-10-23","d":"2026-10-26","s":2.9,"tp":["vision-gen"],"kw":["text-to-image"],"src":["arxiv"],"kind":"preprint","ax":"2610.32390","doi":"","who":[],"tz":"PASTA：提示感知的退火扩散采样","az":"扩散模型虽然能生成高质量图像，但现实中的视觉设计需要有意保留干净区域用于标题、标志或界面元素。现有的布局感知文生图方法难以严格保留预留区域，常常引入不需要的内容，使下游编辑变得复杂。现有方法要么通过操纵注意力来位移内容，要么通过噪声水平干预来抑制条件信息。然而，这些方法牺牲了视觉连贯性，在预留区域与非预留区域之间产生平坦区域或明显的风格不一致。为解决这一局限，我们提出了一种提示感知的共享潜变量免训练退火扩散采样（PASTA），这是一个免训练框架，通过在采样过程中选择性地将语义引导施加于允许放置物体的区域来强制执行预留区域约束。PASTA 在共享潜变量轨迹上运行，其中完整提示与上下文提示的引导通过掩码引导采样进行融合。退火调度在早期去噪阶段抑制语义泄漏，同时在后期阶段逐步恢复视觉一致性。大量实验表明，PASTA 在保持整体图像真实感和感知一致性的同时，提升了预留区域的保真度。","rv":"PASTA 是免训练扩散采样框架，解决文生图中保留区域（标题、logo 等）的严格约束问题。在共享潜变量轨迹上，通过掩码引导将完整提示与上下文提示的语义引导选择性施加于允许区域，并用退火调度在早期去噪阶段抑制语义泄漏、后期恢复视觉一致性。属视觉生成与生成模型方向，与有机分子晶体无关。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1002/ima.70447","t":"DFTA : Dual‐Flow Trajectory Alignment for Medical Pathology Image Synthesis","a":"Generating medical images with complex anatomical structures frequently faces challenges of morphological distortion and limited diversity. We investigate these issues within an established latent generative pipeline by introducing Dual‐Flow Trajectory Alignment (DFTA), a Flow‐Matching formulation with parallel mask‐flow and image‐flow conditioning. Rather than replacing standard latent encoders, UNet backbones, or ControlNet‐style conditioning, DFTA focuses on how the paired conditional trajectories are regularized and sampled. During training, trajectory consistency guidance uses image flow as a geometric reference for the mask flow; an Online Straight Euler Augmentation (OSEA) mechanism generates intermediate pseudo‐samples. At inference, conditional stochastic flow sampling introduces controlled variation into otherwise deterministic integration. Images generated by our model improve downstream task performance, achieving the best generation metrics and competitive results across downstream classification models. In particular, for medical image segmentation tasks, our method improves the mean Dice coefficient (mDice) and mean Intersection over Union (mIoU) of SegFormer by 1.79% and 1.92%, respectively, and increases the mDice and mIoU of UNet by 2.06% and 2.20%, respectively. The code is available at: https://github.com/yanguanyue/DFTA‐ .","au":["Kenan Lai","Muyu Qin","Shanping Yu"],"v":"International Journal of Imaging Systems and Technology","u":"https://doi.org/10.1002/ima.70447","p":"2026-10-19","d":"2026-10-26","s":2.8,"tp":["vision-gen"],"kw":["image synthesis"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1002/ima.70447","who":[],"tz":"DFTA：面向医学病理图像合成的双流轨迹对齐","az":"生成具有复杂解剖结构的医学图像经常面临形态畸变和多样性有限的挑战。我们在一个既有的潜在生成管线中研究这些问题，引入了双流轨迹对齐（DFTA），这是一种具有并行掩码流和图像流条件化的流匹配（Flow-Matching）公式。DFTA 并非替换标准的潜在编码器、UNet 骨干网络或 ControlNet 风格的条件化，而是关注成对条件轨迹如何被正则化和采样。在训练期间，轨迹一致性引导使用图像流作为掩码流的几何参考；在线直线欧拉增强（OSEA）机制生成中间伪样本。在推理阶段，条件随机流采样向原本确定性的积分过程引入受控的变异。我们模型生成的图像提升了下游任务性能，在生成指标上取得最佳表现，并在下游分类模型中取得有竞争力的结果。特别是对于医学图像分割任务，我们的方法将 SegFormer 的平均 Dice 系数（mDice）和平均交并比（mIoU）分别提升了 1.79% 和 1.92%，将 UNet 的 mDice 和 mIoU 分别提升了 2.06% 和 2.20%。代码可在以下地址获取：https://github.com/yanguanyue/DFTA‐ 。","rv":"这篇论文针对医学病理图像合成中的形态畸变和多样性不足问题，提出 DFTA 方法，在流匹配框架下并行使用掩码流和图像流条件化，通过轨迹一致性引导和在线直线欧拉增强改善训练，推理时用条件随机流采样引入受控变异。属于视觉生成与生成模型方向，与有机分子晶体无直接关联。","tr":"mid","tw":"正式发表","why":""},{"k":"doi:10.17605/osf.io/62ty9","t":"Generative AI for Mechanical Systems Design: A Systematic Review of Language-Driven, Diffusion-Based, and Physics-Informed Approaches — Protocol for a Two-Tier Systematic Map and In-Depth Synthesis","a":"Protocol of a systematic review on generative artificial intelligence for the design of mechanical systems, components and structures (2021–2026). The review covers three paradigms: language-driven approaches (large language models, vision-language models, LLM agents, CAD-as-language models), diffusion-based approaches (denoising diffusion, latent diffusion, flow matching) and physics-informed generative approaches. It uses a two-tier design: (1) a systematic map of all eligible studies, coded by paradigm, design task, design stage, design representation and evaluation type; (2) an in-depth critical synthesis of a core set of studies that quantitatively evaluate the physical validity, constraint satisfaction or manufacturability of generated designs, selected with criteria fixed before full-text assessment. Reporting follows PRISMA 2020. Searches were run in Scopus and Web of Science on 20 October 2026; this registration was made after title/abstract screening and before full-text assessment and data extraction.","au":["Alexis Lazanas"],"v":"Open Science Framework","u":"https://doi.org/10.17605/osf.io/62ty9","p":"2026-10-20","d":"2026-10-26","s":2.8,"tp":["gen-model","vision-gen"],"kw":["flow matching","latent diffusion"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.17605/osf.io/62ty9","who":[],"tz":"面向机械系统设计的生成式人工智能：语言驱动、基于扩散与物理信息方法的系统性综述——双层系统图谱与深入综合方案","az":"这是一项关于生成式人工智能在机械系统、零部件和结构设计中的应用（2021–2026 年）的系统性综述方案。该综述涵盖三种范式：语言驱动方法（大语言模型、视觉-语言模型、LLM 智能体、将 CAD 视为语言模型）、基于扩散的方法（去噪扩散、潜在扩散、流匹配）以及物理信息驱动的生成方法。采用双层设计：（1）对所有符合条件的研究进行系统图谱绘制，按范式、设计任务、设计阶段、设计表示和评估类型进行编码；（2）对一组核心研究进行深入批判性综合，这些研究定量评估了生成设计的物理有效性、约束满足度或可制造性，其筛选标准在全文评估之前已预先确定。报告遵循 PRISMA 2020 规范。检索于 2026 年 10 月 20 日在 Scopus 和 Web of Science 中执行；本注册在标题/摘要筛选之后、全文评估和数据提取之前完成。","rv":"本条是一项系统性综述的注册方案，对象为生成式 AI 在机械系统设计中的应用，涵盖语言驱动、扩散模型与物理信息生成三种范式。实际工作为制定双层检索与综合流程，尚未产出具体结论。与「生成模型」类别关系较近，涉及扩散模型和流匹配等生成方法，但应用场景为机械 CAD 设计，与有机分子晶体、视觉生成或纯数学关系较弱。","tr":"mid","tw":"正式发表","why":""},{"k":"arxiv:2610.25059","t":"HCFM: Helmholtz Component Flow Matching for Time Series Anomaly Detection","a":"Flow Matching (FM) is an efficient simulation-free approach for training flow-based generative models, making it a promising foundation for scalable time-series anomaly detection (TSAD). However, standard FM learns a monolithic vector field in which nominal transport and local density-changing behavior are entangled. This creates a central challenge for TSAD; local expansion and contraction carry crucial anomaly-sensitive information, yet isolating this signal requires expensive Jacobian-trace estimation over the entire field. We propose \\emph{Helmholtz Component Flow Matching} (HCFM), an unsupervised TSAD framework that parameterizes the vector field prediction network with separate transport, compression, and residual heads. The transport head is constrained to be divergence-free, so divergence estimation is restricted to the compression head, while a lightweight residual head absorbs the remaining mismatch. This structured parameterization improves scalability and detection performance by separating volume-preserving nominal transport from density-changing compression, yielding cleaner anomaly signals from distinct deviations of nominal behavior. Experiments on large-scale univariate and multivariate TSAD benchmarks show that HCFM consistently improves detection accuracy while maintaining efficient inference compared with 16 baselines. The code is available at https://github.com/TrustAIoT/HCFM__time-series-anomaly/","au":["Shyam Sundar Saravanan","Tie Luo","Sanjay Madria"],"v":"arXiv","u":"https://arxiv.org/abs/2610.25059","p":"2026-10-18","d":"2026-10-26","s":2.7,"tp":["gen-model"],"kw":["flow matching"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.48550/arxiv.2610.25059","who":[],"tz":"HCFM：面向时间序列异常检测的亥姆霍兹分量流匹配","az":"流匹配（FM）是一种高效的无模拟方法，用于训练基于流的生成模型，使其成为可扩展时间序列异常检测（TSAD）的有前景基础。然而，标准FM学习的是一个整体向量场，其中正常传输行为与局部密度变化行为相互纠缠。这为TSAD带来了核心挑战：局部膨胀和收缩携带着关键的异常敏感信息，但分离该信号需要对整个场进行昂贵的雅可比迹估计。我们提出「亥姆霍兹分量流匹配」（HCFM），一个无监督TSAD框架，用独立的传输头、压缩头和残差头来参数化向量场预测网络。传输头被约束为无散度的，因此散度估计仅限于压缩头，而一个轻量级残差头吸收剩余的失配。这种结构化参数化通过将保持体积的正常传输与改变密度的压缩分离开来，提高了可扩展性和检测性能，从而从正常行为的明显偏差中产生更干净的异常信号。在大规模单变量和多变量TSAD基准上的实验表明，与16个基线相比，HCFM在保持高效推理的同时一致地提高了检测精度。代码可在 https://github.com/TrustAIoT/HCFM__time-series-anomaly/ 获取。","rv":"这篇论文针对时间序列异常检测，提出HCFM方法，将流匹配的向量场分解为无散度传输、压缩和残差三个分量头，利用亥姆霍兹分解思想分离体积保持传输与密度变化，从而更干净地提取异常信号。属于生成模型（流匹配）在时序异常检测中的应用，与有机分子晶体、视觉生成关系较弱，与生成模型和流匹配数学工具更近。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32177","t":"$Ψ$-0.6: Adaptive Streams of Thought in a Unified Vision-Language World Model","a":"Humans reason about the physical world by flexibly combining different forms of inference as a problem unfolds. Achieving this flexibility is a major open challenge in AI: capabilities often remain separated across specialized models, limiting how they can be composed and jointly adapted to a task. We introduce $Ψ$-0.6, a unified vision-language world model that adaptively composes perception, language, geometry, and simulation within a shared reasoning process we call streams of thought. These streams interleave images, text, and explicit representations of geometry and motion, all of which the model can generate and interpret through a shared token interface. $Ψ$-0.6 surpasses leading open-weight models zero-shot on multi-view spatial reasoning, with further gains from reasoning through geometric intermediates. It also supports counterfactual simulation: generating and interpreting imagined scenes to determine, for example, whether moving an object would obstruct a pathway. Reinforcement learning from task feedback jointly optimizes the selection, generation, and use of intermediate representations, improving visual question-answering accuracy with gains that transfer to unseen benchmarks. $Ψ$-0.6 offers a path toward adaptive physical reasoning -- not only predicting the physical world but also choosing the representations through which to reason.","au":["Khai Loong Aw","Klemen Kotar","Baihan Zhang","Yifan Liu","Lilian Chen","Atlas Kazemian","Rahul Venkatesh","Daniel Yamins"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32177","p":"2026-10-23","d":"2026-10-26","s":2.7,"tp":["vision-gen"],"kw":["world model"],"src":["arxiv"],"kind":"preprint","ax":"2610.32177","doi":"","who":[],"tz":"$Ψ$-0.6：统一视觉-语言世界模型中的自适应思维流","az":"人类在问题展开的过程中，通过灵活组合不同形式的推理来理解物理世界。实现这种灵活性是人工智能领域的一个重大开放挑战：各项能力往往分散在不同的专用模型中，限制了它们如何被组合并共同适应某一任务。我们提出了 $Ψ$-0.6，一个统一的视觉-语言世界模型，它在一个我们称为「思维流」的共享推理过程中，自适应地组合感知、语言、几何和仿真。这些思维流交替包含图像、文本以及几何和运动的显式表示，模型可以通过共享的 token 接口生成和解读所有这些内容。$Ψ$-0.6 在多视角空间推理的零样本测试中超越了领先的开源权重模型，通过几何中间表示进行推理还能带来进一步提升。它还支持反事实仿真：生成并解读想象场景，以判断例如移动某个物体是否会遮挡一条路径。基于任务反馈的强化学习联合优化中间表示的选择、生成和使用，提升了视觉问答的准确率，且提升效果可迁移到未见过的基准测试上。$Ψ$-0.6 为自适应物理推理提供了一条路径——不仅预测物理世界，还能选择用于推理的表示方式。","rv":"$Ψ$-0.6 是统一视觉-语言世界模型，在「思维流」框架下自适应组合感知、语言、几何与仿真，支持多视角空间推理和反事实场景生成，并用任务反馈强化学习优化中间表示的选择与使用。与视觉生成最为接近，涉及视觉-语言联合建模和空间推理，与有机分子晶体、文本/图像扩散类生成模型及纯数学关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32148","t":"Covariance-Informed Ensemble Score Filtering: Embedding Localized Covariance Geometry into Score-Based Transport","a":"Background-error covariance models are central to atmospheric data assimilation because they spread partial observational information across space, variables, and dynamically coupled scales. Ensemble and variational methods exploit this covariance geometry efficiently, but their standard analysis formulations are largely built around Gaussian or locally quadratic approximations. Score-based ensemble filtering provides a framework for nonlinear distributional transport, but existing Ensemble Score Filter (EnSF) formulations lack an intrinsi
