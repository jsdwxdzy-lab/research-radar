f 100 compounds.","au":["Rustam Arabov","Konstantin Sozykin","Nikita Rybin","Alexander Shapeev"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29634","p":"2026-10-21","d":"2026-10-26","s":7.7,"tp":["mlip"],"kw":["machine-learned interatomic potential","interatomic potential","fine-tuning","mattersim"],"src":["arxiv"],"kind":"preprint","ax":"2610.29634","doi":"","who":[],"tz":"基于对称性的参数高效低秩微调用于晶格热导率高通量计算","az":"准确高效地预测晶格热导率（LTC）对于开发热电、微电子和光伏应用材料至关重要。本文提出了一种针对具有共同晶体对称性的大规模化合物数据集进行LTC高通量计算的方法。该方法将MatterSim 1M通用机器学习原子间势的微调与基于玻尔兹曼输运方程求解的LTC计算相结合。我们引入了一种基于低秩适配（LoRA）的对称性少样本微调策略（SBFS-FT）。在该方法中，MatterSim 1M在一组精心选择的、共享晶体对称性的少量化合物上进行微调……","rv":"提出SBFS-FT策略，利用晶体对称性对MatterSim 1M原子间势进行低秩适配少样本微调，再结合玻尔兹曼输运方程实现晶格热导率高通量计算。属于材料计算与机器学习势函数范畴，涉及晶体对称性这一数学结构，但与有机分子晶体、视觉生成、生成模型关系较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.31183","t":"Unconstrained learning of equivariant atomistic properties","a":"Machine-learned interatomic potentials based on graph neural networks (GNNs) have made first-principles accuracy routine for the potential energy surface (PES). Their backbones, often O(3)-equivariant by design, are increasingly used to learn other atomistic properties. Many of these are of high angular order or pseudotensorial character, defined per atom, or expanded on large atom-centered basis sets. Such targets strain equivariant GNNs, whose tensor products grow steeply in cost with angular order and can fail to represent the target if truncated, forcing difficult trade-offs between hyperparameters. Unconstrained models like the Point-Edge Transformer (PET) instead replace explicit O(3) algebra with edge-to-edge attention and learn equivariance from data, so that the same backbone can in principle learn any equivariant property. We demonstrate how to use PET to learn molecular dipoles and polarizabilities, NMR chemical shielding tensors, and auxiliary-basis expansions of the electron density. Increasing the backbone size systematically improves both accuracy and equivariance error, and targeted architectural and training choices reduce the symmetry breaking further. PET matches or improves on the released reference models at lower inference cost and, compared with equivariant models, a smaller memory footprint. The predictions give accurate IR and Raman spectra and isotropic shieldings; the predicted densities accelerate self-consistent field calculations and give one-shot ground-state properties, and pretrained density models transfer to higher levels of theory by fine-tuning on little data. The impact of approximate equivariance is small for most observables, further validating this approach to train fast, accurate, and useful surrogate models for properties beyond the PES.","au":["Joseph W. Abbott","Paolo Pegolo","Pol Febrer","Michelangelo Domina","Sandra Saade","Matthias Kellner","Filippo Bigi","Philip Loche","Michele Ceriotti"],"v":"arXiv","u":"https://arxiv.org/abs/2610.31183","p":"2026-10-22","d":"2026-10-26","s":7.5,"tp":["mlip"],"kw":["potential energy surface","equivariant"],"src":["arxiv"],"kind":"preprint","ax":"2610.31183","doi":"10.48550/arxiv.2610.31183","who":["Michele Ceriotti"],"tz":"等变原子性质的无约束学习","az":"基于图神经网络（GNN）的机器学习原子间势已使第一性原理精度的势能面（PES）计算成为常规。其骨干网络通常在设计上具有O(3)等变性，并越来越多地用于学习其他原子性质。其中许多性质具有高角阶或伪张量特征，按原子定义，或展开在大的原子中心基组上。这类目标对等变GNN构成压力，因为其张量积的代价随角阶急剧增长，且截断时可能无法表示目标，迫使在超参数之间做出困难权衡。无约束模型如Point-Edge Transformer（PET）则用显式O(3)……（原文截断）","rv":"针对等变GNN在学习高角阶原子性质时张量积代价高、截断易失真的问题，提出以Point-Edge Transformer（PET）等无约束模型替代显式O(3)等变结构。属于计算化学与机器学习势函数方向，与有机分子晶体、视觉生成、相关数学关系较弱，核心涉及群论等变表示学习。","tr":"high","tw":"作者：Michele Ceriotti","why":""},{"k":"doi:10.1021/jacs.6c15227","t":"Mechanistic Insights of Jahn–Teller Effect Suppression in High-Entropy Prussian Blue Analogue Cathodes","a":"The Jahn–Teller (J-T) effect, as discovered by Hermann Jahn and Edward Teller in 1937, often causes lattice distortion and structural instability in Mn-based battery materials. Recent studies suggest that high-entropy design may help suppress J-T distortion, yet the underlying mechanism remains largely elusive due to their compositional complexity and structural disorder. Herein, using a Mn-based Prussian blue analogue as a case study, we employed a machine learning interatomic potential combined with synchrotron extended X-ray absorption fine structure spectroscopy (EXAFS) to elucidate the fundamental mechanism of the J-T suppression in high-entropy materials. Unexpectedly, EXAFS spectra reveal the absence of the typical J-T Mn–N bond-length splitting in our high-entropy Prussian blue analogue sample, but instead a broader Mn–N bond-length distribution. Machine learning-assisted calculations demonstrate the [MnN6] octahedra exhibit randomly oriented distortions along x-, y-, and z-axes in high-entropy lattices, resulting in the local distortion averaging out at the macroscopic scale. Further analysis of the local Mn coordination environment reveals that the high-entropy configuration enhances d-electron delocalization and reduces the energy splitting between Mn dx2–y2 and dz2 orbitals. This allows two structurally and electronically distinct distortion modes to coexist within the lattice, which disrupts long-range cooperative J-T order. Strikingly, the ultralong cycling stability of high-entropy K0.46[Mn0.21Co0.19Ni0.21Cu0.20Zn0.19][Fe(CN)6]0.98·1.69H2O is experimentally demonstrated, achieving 91.0% capacity retention over 50,000 cycles for aqueous ammonium-ion storage, which surpasses all of the Mn-based rechargeable batteries to date. Our study uncovers the microscopic mechanism of J-T suppression in high-entropy materials and provides an effective strategy for designing durable high-entropy battery electrodes.","au":["Bangjun Wu","Xiaorui Dong","Hongliang Dong","Shuyang Bian","Qiang Liu","Wenbo Zhai","Yi Yu","Yuanhui Ji","Yuping Wu","Jingyang Wang"],"v":"Journal of the American Chemical Society","u":"https://doi.org/10.1021/jacs.6c15227","p":"2026-10-23","d":"2026-10-26","s":7.1,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex","crossref"],"kind":"paper","ax":"","doi":"10.1021/jacs.6c15227","who":[],"tz":"高熵普鲁士蓝类似物正极材料中Jahn–Teller效应抑制的机理研究","az":"Jahn–Teller（J-T）效应由Hermann Jahn和Edward Teller于1937年发现，常导致锰基电池材料中的晶格畸变和结构不稳定。近期研究表明高熵设计可能有助于抑制J-T畸变，但由于其成分复杂性和结构无序性，内在机制仍 largely 不明。本文以锰基普鲁士蓝类似物为案例，采用机器学习原子间势结合同步辐射扩展X射线吸收精细结构（EXAFS）光谱，阐明了高熵材料中J-T抑制的基本机制。出乎意料的是，EXAFS光谱重新……（原文截断）","rv":"以锰基普鲁士蓝类似物正极材料为对象，结合机器学习原子间势与同步辐射EXAFS光谱，探究高熵设计抑制Jahn–Teller晶格畸变的微观机制。属于无机功能材料与电池正极的机理研究，与有机分子晶体、生成模型、视觉生成均无直接关联，与相关数学也关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1016/j.apsusc.2026.168654","t":"Atomic-scale mechanisms of SiO2 plasma-enhanced chemical vapor deposition revealed by molecular dynamics with a machine-learning interatomic potential","a":"","au":["Jaehoon Kim","Minseok Moon","Hyunsung Cho","Kim Hyeon‐Deuk","Rokyeon Kim","Gyehyun Park","Seungwu Han","Youngho Kang"],"v":"Applied Surface Science","u":"https://doi.org/10.1016/j.apsusc.2026.168654","p":"2026-10-21","d":"2026-10-26","s":6.1,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1016/j.apsusc.2026.168654","who":[],"tz":"基于机器学习原子间势的分子动力学揭示SiO2等离子体增强化学气相沉积的原子尺度机制","az":"","rv":"用机器学习原子间势驱动分子动力学模拟，研究SiO2等离子体增强化学气相沉积（PECVD）的原子尺度成膜机制。属于计算表面科学与薄膜沉积领域，与有机分子晶体、生成模型、视觉生成及本文关注的数学方向均无直接关联，关系较弱。","tr":"low","tw":"正式发表；没有摘要","why":""},{"k":"arxiv:2610.32905","t":"Combining Simulations and Spectroscopy to Design Protective Coatings on Sulfide Solid Electrolytes","a":"Sulfide solid electrolytes are attractive for all-solid-state batteries because of their high Li-ion conductivity and favorable processability, but their practical use is limited by electrochemical instability and moisture-induced degradation. Molecular surface coatings offer a scalable strategy to improve humidity tolerance and interfacial stability, yet there is limited understanding of the molecular-level factors governing surface interactions. By combining large-scale atomistic simulations enabled by a machine-learning potential with targeted experiments, we present a comprehensive framework for designing molecular coatings on Li$_6$PS$_5$Cl (LPSCl). Using a PET-MAD interatomic potential fine-tuned on an r$^2$SCAN reference dataset covering LPSCl surfaces, molecular adsorbates, and their interactions, we model surface adsorption of carboxylic (CA), sulfonic (SA), and phosphonic (PA) acids with alkyl chains of varying lengths and the interaction of these coated surfaces with water at finite temperature. The simulations show that lithiated head groups generally exhibit more favorable adsorption energies. Impedance spectroscopy shows that the lithiated coatings maintain 40--55\\% of the initial ionic conductivity after powder processing. While adsorption strength is largely controlled by head-group chemistry and lithiation state, coating morphology depends primarily on alkyl-chain length and surface coverage. In particular, long-chain lithiated carboxylates form dense, brush-like hydrophobic layers that reduce water access to reactive Li surface sites, with protection setting in at a coating thickness of approximately 0.8 nm. Consistent with these predictions, longer carboxylate chains suppress H$_2$S evolution more effectively. Because thicker coatings also hinder Li-ion transport, intermediate chain lengths offer the best balance between moisture protection and ionic conductivity.","au":["Zhiyi Wang","Leonie Braks","Michele Ceriotti","Ali Coskun","Hanna Türk","Davide Tisi"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32905","p":"2026-10-23","d":"2026-10-26","s":5.6,"tp":["mlip"],"kw":["interatomic potential"],"src":["arxiv"],"kind":"preprint","ax":"2610.32905","doi":"","who":["Michele Ceriotti"],"tz":"结合模拟与光谱设计硫化物固态电解质保护涂层","az":"硫化物固态电解质因其高锂离子电导率和良好的可加工性而成为全固态电池的理想选择，但其实际应用受限于电化学不稳定性和水分诱导的降解。分子表面涂层是提高耐湿性和界面稳定性的可扩展策略，但目前对控制表面相互作用的分子层面因素了解有限。通过结合机器学习势能驱动的大规模原子模拟与针对性实验，我们提出了一个设计Li6PS5Cl（LPSCl）分子涂层的综合框架。使用PET-MAD原子间势……","rv":"采用PET-MAD机器学习势进行大规模原子模拟，结合光谱实验，为硫化物固态电解质LPSCl设计分子保护涂层，旨在提升耐湿性与界面稳定性。属于计算材料与电池界面科学，与有机分子晶体、生成模型、视觉生成及本文关注的数学方向关系均较弱。","tr":"high","tw":"作者：Michele Ceriotti","why":""},{"k":"doi:10.26434/chemrxiv.15010773/v1","t":"Mechanical versus thermal amorphization of ZIF-4: from local rearrangements to network disorder","a":"There is mounting evidence that different amorphization routes can produce metalorganic framework (MOF) glasses with distinct structures and properties, yet the microscopic origins of these differences remain difficult to establish experimentally. Focusing on the two main synthesis methods, which are melt-quenching and ball-milling, we use molecular dynamics simulations with a machine-learning interatomic potential to compare different glasses obtained from ZIF-4. While both routes largely preserve tetrahedral zinc coordination, mechanical deformation generally produces more distorted local environments, showing that average coordination numbers alone do not capture the structural differences between these glasses. At smaller applied strain, mechanical glasses retain substantial memory of the crystalline network topology, despite pronounced changes in ring geometry. Larger strains erase this topological memory, yielding ring-size distributions similar to those of melt-quenched glasses, while differences in local geometry and porosity persist. Simulations of larger systems reveal a heterogeneous amorphization mechanism, involving the formation and growth of disordered domains. These findings from in silico amorphization support process-dependent polyamorphism in ZIF glasses and identify local geometry, topological memory, and spatial heterogeneity as complementary features needed to characterize their structure and understand the influence of mechanical processing.","au":["Léna Triestram","François‐Xavier Coudert"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010773/v1","p":"2026-10-21","d":"2026-10-26","s":4.9,"tp":["mlip"],"kw":["machine learning interatomic potential","interatomic potential"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010773/v1","who":[],"tz":"ZIF-4的机械与热致非晶化：从局部重排到网络无序","az":"越来越多的证据表明，不同的非晶化路径可以产生具有不同结构和性质的金属有机框架（MOF）玻璃，但这些差异的微观起源在实验上仍难以确定。本文聚焦于两种主要合成方法——熔体淬火和球磨，使用基于机器学习原子间势的分子动力学模拟，比较了从ZIF-4获得的不同玻璃态。虽然两种路径在很大程度上都保留了四面体锌配位，但机械变形通常产生更畸变的局部环境，表明仅凭平均配位数无法捕捉结构差异……","rv":"研究对象是ZIF-4（一种MOF），方法是用机器学习原子间势驱动的分子动力学模拟，比较球磨（机械）和熔体淬火（热）两种非晶化路径产生的玻璃态结构差异。属于有机分子晶体/多孔材料范畴，与生成模型和视觉生成无直接关系，核心贡献在于揭示非晶化路径对局部配位畸变的影响。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.1063/5.0350682","t":"Microscopic origin of polytype-dependent melting in SiC revealed by machine-learning molecular dynamics","a":"Predicting how crystal structure influences high-temperature stability remains a key challenge in materials modeling and design. Silicon carbide (SiC), one of the most thermally and chemically stable materials known, provides an ideal system for studying this problem because its many polytypes preserve similar local tetrahedral bonding while differing in long-range stacking geometry. To determine the impact of polytype structure on the high-temperature stability of SiC, we combine phase-coexistence machine-learning molecular dynamics with finite-temperature phonon analysis, enabled by a fine-tuned MACE interatomic potential that accurately describes crystalline, high-temperature, and disordered configurations across multiple SiC polytypes. We identify a clear stability ordering, 3C > 2H > 9R, reflected consistently in structural disordering, interlayer sliding, and finite-temperature phonon spectra. Across all polytypes, melting initiates through the formation of short C-C contacts and carbon-rich local regions, followed by a progressive loss of tetrahedral Si-C connectivity. The reduced stability of the long-period 9R polytype is associated with a denser manifold of low-frequency transverse-acoustic modes arising from its stacking periodicity and associated zone folding, which broaden and soften further at high temperature. These modes can provide additional low-energy channels for thermally activated lateral bilayer motion, consistent with the larger sliding amplitudes observed in 9R and their positive correlation with local structural disorder.","au":["Ljiljana Stojanović","S. J. Magorrian","Lara Kabalan","R.N. White","Fabian L. Thiemann","Viktor Zólyomi"],"v":"The Journal of Chemical Physics","u":"https://doi.org/10.1063/5.0350682","p":"2026-10-19","d":"2026-10-26","s":4.8,"tp":["mlip"],"kw":["interatomic potential","mace"],"src":["openalex"],"kind":"paper","ax":"","doi":"10.1063/5.0350682","who":[],"tz":"机器学习分子动力学揭示SiC多型体依赖熔化的微观起源","az":"预测晶体结构如何影响高温稳定性仍是材料建模与设计中的关键挑战。碳化硅（SiC）是已知热稳定性和化学稳定性最高的材料之一，是研究该问题的理想体系，因为其众多多型体保留了相似的局部四面体键合，但在长程堆叠几何上有所不同。为确定多型体结构对SiC高温稳定性的影响，我们将相共存机器学习分子动力学与有限温度声子分析相结合，借助精细调优的MACE原子间势，准确描述晶态、高温态和无序态……","rv":"研究对象是SiC（无机共价晶体），方法是用MACE机器学习原子间势进行相共存分子动力学模拟，结合有限温度声子分析，研究不同多型体的熔化行为差异。属于无机晶体/高温材料范畴，与有机分子晶体、生成模型、视觉生成均无直接关联，核心贡献在于揭示长程堆叠几何对熔化温度的微观影响。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.26434/chemrxiv.15010965/v1","t":"Spontaneous defect formation as the origin of superionic transitions in antifluorite-type structures","a":"Solid-state electrolytes offer the possibility of safer and higher energy density batteries, yet only a limited number of materials achieve ionic conductivities suitable for practical applications. Type-II superionic conductors, which undergo continuous temperature-driven transitions between low and high ionic conductivity regimes are strong candidates for high-performance solid state electrolytes, but the transition mechanism is not sufficiently understood. In this study, we investigate the archetypical superionic conductors Li2O and Li2S with the antifluorite structure using long-time-scale molecular dynamics simulations with an Allegro machine-learning force field (MLFF) trained on density functional theory data selected using an on-the-fly active learning procedure. To this end, superionic transitions are identified around 1450 K for Li2O and around 1100 K for Li2S through continuous peaks in the heat capacity. Diffusion coefficients and concentration of Frenkel defects are found to exhibit strong non-Arrhenius behavior coinciding with the superionic transition where both diffusion activation energy and defect formation energy decrease significantly across the transition. This suggests a self-enhanced spontaneous defect formation mechanism, which drives the superionic transition and promotes increased ionic diffusion. These results identifies the microscopic origin of type-II superionic behavior as a result of correlated defect formation and support the design of improved solid-state electrolytes.","au":["Timothée Jamin","Kasper Tolborg"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010965/v1","p":"2026-10-23","d":"2026-10-26","s":4.6,"tp":["mlip"],"kw":["density functional theory","active learning","allegro"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010965/v1","who":[],"tz":"反萤石型结构中自发缺陷形成作为超离子转变的起源","az":"固态电解质有望实现更安全、更高能量密度的电池，但只有少数材料能达到实用所需的离子电导率。II型超离子导体在低、高离子电导率区间之间经历连续的温度驱动转变，是高性能固态电解质的有力候选材料，但其转变机制尚未被充分理解。本研究利用基于Allegro机器学习力场（MLFF）的长时间尺度分子动力学模拟，对具有反萤石结构的典型超离子导体Li2O和Li2S进行了研究，该力场在密度…（原文截断）","rv":"研究反萤石结构Li2O和Li2S的超离子转变机制，采用Allegro机器学习力场进行长时间尺度分子动力学模拟，揭示自发缺陷形成是超离子转变的起源。属于计算材料科学中的离子输运问题，与有机分子晶体、生成模型及视觉生成均无直接关联。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.26434/chemrxiv.15010957/v1","t":"Factorised Cartesian Atomic Cluster Expansion for Low-Cost Machine-Learning Interatomic Potentials","a":"Machine-learning interatomic potentials can reach the accuracy of density functional theory at a fraction of its cost, but the most accurate equivariant models remain expensive, mainly because of the tensor operations they perform for every pair of neighbouring atoms. We present FACE, a factorised Cartesian atomic cluster expansion that removes this bottleneck. Each neighbour contributes only a small set of radial functions and messages, and all mixing of feature channels is done once per atom, so the cost per neighbour no longer grows with the size of the model. Custom GPU kernels evaluate the remaining steps, and long-range electrostatics, dispersion and short-range repulsion attach through a single interface. We show that the training divergences we encountered originate in how the network weights are scaled, and we introduce a distillation scheme in which an ensemble generates additional, uncertainty-checked training data. On five rMD17 molecules, with identical training budgets and hardware, FACE is about as accurate as a 64-channel MACE model (over three seeds: better on one molecule, within the seed spread on two, 7–14% higher force errors on two), while it is 5.7 times faster at inference (4.9 times at the same cutoff) and needs 3.5–3.9 times less GPU memory. Training costs about the same per step. Distillation lowers the energy and force errors of a single aspirin model by 20% at fixed width, to 2.26 meV and 6.74 meV/Å, close to the published MACE values (2.2 and 6.6), and the distilled model runs stably in molecular dynamics.","au":["Albert Linda"],"v":"ChemRxiv","u":"https://doi.org/10.26434/chemrxiv.15010957/v1","p":"2026-10-23","d":"2026-10-26","s":4.6,"tp":["mlip"],"kw":["density functional theory","equivariant","mace"],"src":["openalex"],"kind":"preprint","ax":"","doi":"10.26434/chemrxiv.15010957/v1","who":[],"tz":"面向低成本机器学习原子间势的分解笛卡尔原子簇展开","az":"机器学习原子间势可以以密度泛函理论的一小部分成本达到其精度，但最精确的等变模型仍然昂贵，主要是因为它们对每一对相邻原子都执行张量运算。本文提出FACE，一种分解的笛卡尔原子簇展开，消除了这一瓶颈。每个邻居仅贡献少量径向函数和消息，所有特征通道的混合仅对每个原子执行一次，因此每个邻居的成本不再随模型规模增长。自定义GPU内核评估剩余步骤，长程静电、色散和短程排斥通过…（原文截断）","rv":"提出FACE方法，通过分解笛卡尔原子簇展开将每个邻居的计算成本与模型规模解耦，配合自定义GPU内核加速，使机器学习原子间势在保持等变精度的同时大幅降低开销。属于计算化学中高效力场设计方向，与有机分子晶体、生成模型及视觉生成无直接关联。","tr":"low","tw":"作者不在关注名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01270","t":"Can DFT-Trained Neural Network Potentials Reproduce Structure, Solvation, and Water-Exchange Properties in Aqueous Magnesium Solutions?","a":"Magnesium ions play an essential role in many biological processes but remain challenging to model in biomolecular simulations. Despite considerable scientific effort, classical force fields fail to simultaneously reproduce key structural, thermodynamic, and kinetic solution properties, likely due to their inability to explicitly account for quantum many-body effects. Here, we develop and systematically benchmark MACE neural network potentials (NNPs) for aqueous MgCl2 solutions, trained on revPBE-D3/zd and revPBE0-D3/zd density functional theory reference data, and assess their ability to reproduce a broad range of experimental solution properties including the structure of the first hydration shell, diffusion coefficient, activity derivative, water-exchange rate, and mechanism as well as solvation free energy. Both NNPs accurately reproduce the octahedral structure of the first hydration shell, ion-pairing properties, and diffusion coefficients. Combining the NNPs with transition path sampling and other enhanced sampling techniques allows us to capture the rare event of water exchange in the first hydration shell of Mg2+, revealing a dissociative exchange mechanism. Transition interface sampling yields exchange rates within 1 order of magnitude of experiment, representing a substantial improvement over classical dissociative force fields. In contrast, the NNP-derived solvation free energy significantly underestimates the experimental value, revealing a limitation of the present local NNP architecture for describing ion solvation thermodynamics.","au":["Sebastian Falkner","Pablo Montero de Hijes","Christoph Dellago","Nadine Schwierz"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01270","p":"2026-10-24","d":"2026-10-26","s":4.3,"tp":["mlip"],"kw":["density functional theory","mace"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01270","who":[],"tz":"基于DFT训练的神经网络势函数能否再现水溶液中镁离子的结构、溶剂化及水交换性质？","az":"镁离子在许多生物过程中发挥关键作用，但在生物分子模拟中仍难以建模。尽管已有大量科学研究，经典力场无法同时再现溶液的关键结构、热力学和动力学性质，这很可能是由于其无法显式考虑量子多体效应。本文开发并系统基准测试了用于水溶液MgCl₂的MACE神经网络势函数（NNP），训练数据来自revPBE-D3/zd和revPBE0-D3/zd密度泛函理论参考数据，并评估其再现广泛实验溶液性质的能力，包括第一水合壳层的结构……","rv":"本文针对水溶液中镁离子模拟难题，基于DFT数据训练MACE神经网络势函数，系统评估其对结构、溶剂化和水交换动力学的再现能力。属于计算化学与分子模拟方向，与有机分子晶体关系较弱，与生成模型及视觉生成无直接关联，核心是等变神经网络在分子动力学中的应用。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.29111","t":"SU(2)-Equivariant Spinor Message Passing for Molecular Magnetism","a":"Predicting molecular magnetism often requires electronic-structure calculations with spin-orbit coupling (SOC), which are costly to repeat across many molecules. The underlying electronic states can transform as spinors, yet equivariant surrogates typically use only integer-rank features. Inspired by the spinor nature of these electronic states, we develop eSpinor, an SU(2)-equivariant graph neural network that propagates spinor features. We initialize spinor features from eigenvectors of an approximate SOC Hamiltonian and use gauge-covariant message passing with a gauge-invariant readout to make predictions independent of the arbitrary eigenbasis choice. On cobalt single-molecule magnet candidates, eSpinor improves zero-field-splitting predictions relative to NequIP, including for unseen ligands. For a dysprosium magnetic resonance imaging probe, eSpinor improves real electron-spin correlations over a Hamiltonian-informed baseline despite similar static crystal-field errors and fewer parameters, while accurately predicting low-field nuclear relaxation in water and after transfer to methanol without retraining. Overall, these results demonstrate that SU(2)-equivariant spinor message passing is a useful inductive bias for molecular magnetism. We also find that similar static tensor errors can yield different dynamical errors, motivating model selection based on accuracy for the intended physical observables.","au":["Erh-Wei Sheng","Beom Seok Kang","Yuchao Lin","Danish Khan","Anima Anandkumar"],"v":"arXiv","u":"https://arxiv.org/abs/2610.29111","p":"2026-10-21","d":"2026-10-26","s":3.8,"tp":["mlip"],"kw":["equivariant","nequip"],"src":["arxiv"],"kind":"preprint","ax":"2610.29111","doi":"10.48550/arxiv.2610.29111","who":[],"tz":"面向分子磁性的SU(2)-等变自旋or消息传递","az":"预测分子磁性通常需要含自旋-轨道耦合（SOC）的电子结构计算，对大量分子重复计算代价高昂。底层电子态可以自旋or形式变换，但等变代理模型通常仅使用整数阶特征。受这些电子态的自旋or本质启发，本文开发了eSpinor，一个SU(2)-等变图神经网络，传播自旋or特征。自旋or特征从近似SOC哈密顿量的特征向量初始化，并使用规范协变消息传递和规范不变读出，使预测独立于任意特征基选择。在钴单分子磁体上……","rv":"本文提出eSpinor，一个SU(2)-等变图神经网络，通过传播自旋or特征预测分子磁性，以替代昂贵的SOC电子结构计算。属于等变深度学习与分子性质预测方向，与有机分子晶体、视觉生成关系较弱，核心贡献在于将自旋or表示引入等变消息传递框架。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01498","t":"Δ-HGPR: A Hierarchical Gaussian Process Framework for Active-Learning Δ-Potentials","a":"Δ-learning, which uses machine learning to represent only the difference between a high-accuracy reference and a lower-accuracy base calculator, is a promising route to high-fidelity molecular dynamics (MD) with limited training data, but it has lacked a unified protocol combining hierarchical descriptors with well-defined equilibrium sampling. We propose Δ-HGPR (hierarchical Gaussian process regression for Δ-learning), a framework for learning difference potentials, and its MD instantiation, Δ-HGPR-MD. The framework combines (i) a difference potential written as an additive radial (inverse-distance) term plus a many-body machine-learning correction, determined by a single regularized least-squares fit; (ii) the ensemble force standard deviation as an active-learning indicator with an automatically scaled threshold; and (iii) a difference potential held fixed within each round so that equilibrium NVT sampling is well-defined in both exploration and production. The many-body term of Δ-HGPR-MD uses smooth overlap of atomic positions (SOAP) descriptors with random Fourier features (Δ-HGPR-RFF). On a toy system whose difference potential contains a 1/r contribution beyond the cutoff of the local descriptor, the many-body term alone reproduces none of this force, however many features it is given, whereas the hierarchy recovers 99% of it, with a reach set by the cutoff of its radial term. In MD, the hierarchy reproduces about 80% of the shift of the ion-pair distribution toward the reference, while the many-body term alone leaves it where the base places it.","au":["Takahito Nakajima"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01498","p":"2026-10-24","d":"2026-10-26","s":3.5,"tp":["mlip"],"kw":["active learning"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01498","who":[],"tz":"Δ-HGPR：用于主动学习Δ势的层次高斯过程框架","az":"Δ-learning利用机器学习仅表示高精度参考方法与低精度基础计算器之间的差异，是有限训练数据下实现高保真分子动力学（MD）的有前景途径，但缺乏将层次描述符与明确定义的平衡采样相结合的统一协议。本文提出Δ-HGPR（用于Δ-learning的层次高斯过程回归）框架来学习差异势，及其MD实例化Δ-HGPR-MD。该框架将(i)写为加性径向（逆距离）项加多体机器学习修正的差异势，由单一正则化最小二乘…（原文摘要截断）","rv":"本文提出Δ-HGPR框架，用层次高斯过程回归学习Δ势（高精度与低精度能量之差），结合加性径向项与多体ML修正，并给出MD采样实例。属于计算化学/分子动力学中机器学习力场方向，与有机分子晶体无直接关系，与生成模型、视觉生成及纯数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01251","t":"Microenvironmental pH-Modulated Vitamin B6 Ternary Eutectics for BCS Class IV Drug Delivery","a":"The essence of developing multicomponent solid formulations for drugs with poor physicochemical and pharmacokinetic properties is rapidly evolving to cut short the consumption of resources and time. Quite a few commercially available binary drug formulations in the public domain serve as a prime illustration of the field’s success. However, the design and utilization of ternary or higher-order drug formulations can be more efficacious in terms of enhancing such properties of the drug as well as providing humidity resistance and controlling unexpected phase transitions during drug development. Low-soluble and low-permeable BCS IV class drugs continuously present a barrier by lowering their absorption in the body. Drugs mesalamine (MSA) and acetazolamide (ACZ) from the same BCS class were chosen to enhance properties by introducing the binary and ternary solid formulation approach. Soluble and acceptable co-partners, viz., vitamin B6 (pyridoxine hydrochloride, PRDHCl) and p-Aminobenzoic acid (PABA), were carefully chosen. The grinding of MSA and ACZ with p-aminobenzoic acid (PABA) resulted in a physical mixture (MSA·PABA) and a cocrystal (ACZ·PABA), respectively, due to the mismatch of functional moieties and shape. Interestingly, the addition of PRDHCl to the two binary systems generated two ternary eutectic solids, viz., PRDHCl·MSA·PABA and PRDHCl·ACZ·PABA. The thermal and spectroscopic analyses suggested that PRDHCl·MSA·PABA is a mixture of PRDHCl, MSA and PABA. However, PRDHCl·ACZ·PABA exists as a combination of the cocrystal ACZ·PABA and PRDHCl.","au":["Archita Goswami","Bhargab Patowary","Bipul Sarma"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01251","p":"2026-10-24","d":"2026-10-26","s":3.5,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01251","who":[],"tz":"微环境pH调控的维生素B6三元共熔体用于BCS IV类药物递送","az":"开发针对物理化学和药代动力学性质较差的药物的多组分固体制剂，其核心在于快速缩短资源消耗和时间。市面上已有多款二元药物制剂作为该领域成功的典型例证。然而，三元或更高阶药物制剂的设计与利用在增强药物性质、提供抗湿性以及控制药物开发过程中意外相变方面可能更为有效。低溶解度和低渗透性的BCS IV类药物持续构成障碍，降低了其…（原文摘要截断）","rv":"本文研究以维生素B6为共熔组分的三元共熔体，利用微环境pH调控实现BCS IV类难溶难渗药物的递送。属于药物晶体工程/共熔体设计领域，与有机分子晶体有直接关联（共熔体本质为有机分子晶体混合物），但与生成模型、视觉生成及纯数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"arxiv:2610.32678","t":"Probing the limits of forward screening and inverse design of crystal materials","a":"Crystal materials are designed either by screening known crystals for a target property or by generating new crystals with that property. Both routes are judged against public databases of known crystals, but these databases name the same crystal differently. Several materials announced as new by recent generative and autonomous discovery campaigns have since proved to be known phases or close variants of them. The limits of both routes remain unmeasured. Here we probe them by matching the crystals of 55 databases by structure into one self-extending database of 14.6 million crystals and 131.8 million property values, each traced to its source. Only 4.5% of its crystal-property pairs carry a value. To fill the empty pairs, we developed CGTNet, an equivariant graph transformer with state-of-the-art accuracy on several tasks of two public benchmarks. Trained on each task, it forms a library of property models whose predictions we release. The reach of forward screening has been underestimated. Known crystals hold tens of thousands of ultra-incompressible candidates without a recorded bulk modulus, and a post hoc audit of synthesis evidence finds among them ReN2, whose bulk modulus was measured at 428 GPa. The novelty claimed for inverse design has been overestimated. At an equal verification budget, a stiffness-conditioned generator returned more stiff hits than screening (100 versus 55), but all contained osmium and 82 repeated recorded compositions. Integrating and completing the databases of known crystals therefore moves the limits of both routes: it widens what screening can reach and sets the reference against which generated crystals are judged new.","au":["Zhilong Song","Zijun Pang","Lixue Cheng"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32678","p":"2026-10-23","d":"2026-10-26","s":2.6,"tp":["crystal-gen","mlip"],"kw":["inverse design","equivariant"],"src":["arxiv"],"kind":"preprint","ax":"2610.32678","doi":"","who":[],"tz":"探测晶体材料正向筛选与逆向设计的极限","az":"晶体材料的设计要么通过筛选已知晶体来寻找目标性质，要么通过生成具有该性质的新晶体。两条路线都以公开已知晶体数据库为评判标准，但这些数据库对同一晶体的命名各不相同。近期若干生成式和自主发现工作宣布的「新材料」后来被证实是已知相态或其近变体。两条路线的极限此前从未被量化。本文通过将55个数据库中的晶体按结构匹配，构建了一个自扩展的包含1460万晶体和1.318亿性质值的统一数据库，每条记录均可追溯来源。其中仅4.5%的晶体-性质对携带了……（原文截断）","rv":"构建统一晶体结构数据库，量化正向筛选与逆向生成设计的边界。将55个数据库按结构匹配为1460万晶体的自扩展库，揭示命名不一致导致的「新晶体」误判问题。与「有机分子晶体」关系较弱，对象为无机及混合晶体；与「生成模型」有一定关联，讨论生成式设计的局限；与「视觉生成」和「相关数学」关系弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.26701","t":"Challenging Atomistic Foundation Models on Disordered Carbons","a":"Foundation machine-learned interatomic potentials (MLIPs) promise broad transferability, yet their out-of-domain reliability is hard to establish. Here, we use pure and O/H-containing disordered carbon spanning multiple phases, competing hybridisations and porous frameworks to stress-test six popular foundation MLIPs. We first screen all six on density functional theory (DFT) energy and force errors and binding curves, then subject four to melt-quench-anneal molecular dynamics and evaluate the resulting structural observables. Binding curves and O/H-containing trajectories reveal unphysical extrapolation and dynamical failures that low DFT energy and force errors fail to reveal. Of the models tested, MACE-MH-1 is the most consistently robust, with low DFT errors and stable MD. Despite differing architectures, OMAT-based models share structural biases, highlighting the importance of training coverage. All four models generate structures of nanoporous carbon that reproduce the principal experimental and specialised carbon potential signatures. Incorporating O/H leaves short-range order largely unchanged but shifts pore-size distributions towards larger pores. These results emphasise the need for application-specific validation and extend molecular dynamics modelling of nanoporous carbon towards experimentally realistic structures.","au":["Joseph Hart","Samuel G. H. Brookes","Fabian L. Thiemann","Christoph Schran"],"v":"arXiv","u":"https://arxiv.org/abs/2610.26701","p":"2026-10-19","d":"2026-10-26","s":2.6,"tp":["mlip"],"kw":["density functional theory","mace"],"src":["arxiv"],"kind":"preprint","ax":"2610.26701","doi":"","who":[],"tz":"在无序碳上挑战原子级基础模型","az":"基础机器学习原子间势（MLIP）承诺了广泛的迁移能力，但其域外可靠性难以确立。本文利用纯碳及含O/H的无序碳体系，涵盖多相态、竞争杂化方式和多孔框架，对六种主流基础MLIP进行压力测试。首先，在密度泛函理论（DFT）能量与力误差及结合曲线上对全部六种模型进行筛选；随后，对其中四种模型执行熔淬退火分子动力学模拟，并评估所得结构可观测量。结合曲线及含O/H轨迹揭示了低DFT能量和力误差所无法暴露的非物理外推和动力学失效。在模型……","rv":"本文以纯碳及含O/H无序碳（多相、竞争杂化、多孔框架）为压力测试集，系统评估六种基础MLIP的域外可靠性，通过DFT误差筛选和熔淬退火MD揭示结合曲线与轨迹中的非物理外推。属于计算材料/分子模拟方向，与有机分子晶体仅共享碳基材料背景，与生成模型、视觉生成及纯数学基本无关，关联较弱。","tr":"low","tw":"预印本或来源不明；作者不在关注名单","why":""},{"k":"arxiv:2610.32341","t":"Flexo-Photoresponses from First Principles","a":"Many functionally important materials, such as silicon, possess high-symmetry crystal structures that forbid even-order nonlinear optical responses, thereby limiting their application in e.g., photonics and optoelectronics. Strain gradients can effectively break symmetries, activating otherwise forbidden optical responses. Although such flexo-photoresponses have attracted considerable interest recently, a comprehensive microscopic theoretical framework is still lacking. Here, we develop a first-principles approach that can systematically evaluate a wide range of flexo-photoresponses in realistic materials. By mapping strain gradients to long-wavelength phonons within the established theory of electron-phonon coupling, our approach captures the nonlocal quantum-mechanical effects of lattice deformations on nonlinear optical responses. Applying the framework to prototypical centrosymmetric materials, including Si, cubic $\\rm SrTiO_3$, and monolayer black phosphorus, we demonstrate that a strain gradients of $10^5\\sim10^6~\\rm m^{-1}$ can induce flexo-second-harmonic generation and flexo-bulk photovoltaic effects comparable to the intrinsic responses of non-centrosymmetric crystals. Our work establishes a rigorous foundation for strain gradient engineering of light-matter interactions, opening new avenues for nanoscale optomechanics, optoelectronics, and beyond.","au":["Zhichao Guo","Hua Wang","Haowei Xu"],"v":"arXiv","u":"https://arxiv.org/abs/2610.32341","p":"2026-10-23","d":"2026-10-26","s":0.0,"tp":[],"kw":[],"src":["arxiv"],"kind":"preprint","ax":"2610.32341","doi":"","who":[],"tz":"基于第一性原理的屈光-光响应","az":"许多功能重要材料（如硅）具有高对称性晶体结构，禁止偶数阶非线性光学响应，从而限制了其在光子学和光电子学等领域的应用。应变梯度可以有效打破对称性，激活原本被禁止的光学响应。尽管此类屈光-光响应近年来引起了广泛关注，但全面的微观理论框架仍然缺乏。本文发展了一种第一性原理方法，可以系统评估真实材料中广泛范围的屈光-光响应。通过将应变梯度映射到已建立理论中的长波长声子……","rv":"该工作针对高对称性晶体中偶数阶非线性光学响应被禁的问题，发展了基于第一性原理的屈光-光响应计算方法，将应变梯度映射为长波长声子。属于凝聚态物理与计算材料学范畴，与有机分子晶体关系较弱，与生成模型、视觉生成无直接关联。","tr":"","tw":"","why":""},{"k":"doi:10.1021/acs.cgd.6c01198","t":"A Calix[4]arene Supramolecular Gel for Pharmaceutical Crystal Growth Enabled by Anion-Induced Conformational Modulation","a":"Two novel calix[4]arene derivatives (compounds 1 and 2), incorporating 1,2,3-triazole and d/l-phenylalanine moieties within the linker, have been prepared. Upon the addition of tetrabutylammonium dihydrogen phosphate (TBAHP) followed by sonication at 42−48 °C for 15 min, compound 1 formed a supramolecular gel in n-butanol, whereas 2 did not undergo gelation under identical conditions. Variable-temperature 1H NMR studies suggest that dihydrogen phosphate induces a conformational change in 1, consistent with modulation of the calix[4]arene framework, thereby exposing additional intermolecular interaction sites that promote supramolecular gel assembly. Rheological measurements demonstrated that both the mechanical stability and the storage modulus of the resulting gel increased with increasing concentrations of the Compound 1/TBAHP system in n-butanol. Although the gel exhibited thixotropic behavior, recovery of the gel structure following shear was relatively slow. Notably, a pharmaceutical salt cocrystal comprising furosemide and its tetrabutylammonium salt was successfully grown within the Compound 1/TBAHP/n-butanol supramolecular gel. Although the same salt cocrystal could also be obtained from a TBAHP/n-butanol solution, crystallization required a higher concentration of furosemide than in the gel system.","au":["Xiuqin Cai","Jonathan W. Steed"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01198","p":"2026-10-23","d":"2026-10-23","s":6.5,"tp":["csp"],"kw":["pharmaceutical crystal","cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01198","who":[],"tz":"阴离子诱导构象调控实现的杯[4]芳烃超分子凝胶用于药物晶体生长","az":"制备了两种新型杯[4]芳烃衍生物（化合物1和2），其连接臂中分别引入了1,2,3-三唑和d/l-苯丙氨酸基团。在加入四丁基铵二氢磷酸盐（TBAHP）后于42−48 °C超声处理15分钟，化合物1在正丁醇中形成了超分子凝胶，而化合物2在相同条件下未发生凝胶化。变温1H NMR研究表明，二氢磷酸盐诱导化合物1发生构象变化，与杯[4]芳烃骨架的调控一致，从而暴露出额外的分子间相互作用位点，促进超分子凝胶组装。流变学测量表明……","rv":"该工作设计了两类杯[4]芳烃衍生物，发现二氢磷酸盐阴离子可诱导特定构象变化从而触发超分子凝胶化，为药物晶体生长提供模板环境。属于超分子化学与晶体生长领域，与有机分子晶体有一定关联（涉及晶体生长调控），但与生成模型、视觉生成无直接关系。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jpcc.6c06133","t":"Improving the Temperature Stability of MgZrNb2O8 through the Synergistic Effect of Ta5 + Substitution and High-Entropy Strategy","a":"High-entropy Mg(ZrHfTiSnGe)0.2(Nb1–xTax)2O8 (x = 0–1) microwave dielectric ceramics were successfully synthesized via a solid-state reaction method. The effects of Ta5+ substitution and high entropy on sintering behavior, crystal structure, and microwave dielectric properties were systematically investigated. XRD confirms that Hf4+, Ti4+, Sn4+, Ge4+, and Ta5+ successfully entered the crystal lattice, forming a single-phase solid solution with a wolframite structure (P2/c space group). SEM images show that grains grow well, the grain size is uniform, and there are few pores. HRTEM images show that the sample has both structural long-range order and local lattice distortion. The dielectric constant (εr) increases with Ta5+ substitution, which is primarily attributed to the higher ionic polarizability of Ta5+ and the cation “under-bonding” effect. The continuous decline in the quality factor (Q × f) value is closely related to the reductions in both relative density and lattice energy. This is further supported by the broadening of the Nb/Ta–O symmetric stretching vibration peak in Raman spectra, indicating enhanced phonon interactions. Most importantly, the temperature coefficient of resonant frequency (τf) improves to −10 ppm/°C, benefiting from the increase in bond energy and the weakening of [AO6] (A = Mg, Zr, Hf, Ti, Sn, and Ge) octahedral distortion.","au":["Yao Sun","Xiaokang Wu","Yuanming Lai","Haizhou Ran","Linqiao Zhang","Lin Xu","Qian Liu","Chongsheng Wu","Yuanxun Li","Li Yue"],"v":"The Journal of Physical Chemistry C","u":"https://doi.org/10.1021/acs.jpcc.6c06133","p":"2026-10-23","d":"2026-10-23","s":5.4,"tp":["csp"],"kw":["crystal structure","lattice energy","space group"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jpcc.6c06133","who":[],"tz":"通过Ta5+取代与高熵策略的协同效应提高MgZrNb2O8的温度稳定性","az":"通过固相反应法成功合成了高熵Mg(ZrHfTiSnGe)0.2(Nb1–xTax)2O8（x = 0–1）微波介质陶瓷。系统研究了Ta5+取代和高熵效应对方块行为、晶体结构和微波介质性能的影响。XRD证实Hf4+、Ti4+、Sn4+、Ge4+和Ta5+成功进入晶格，形成了具有钨铁矿结构（P2/c空间群）的单相固溶体。SEM图像显示晶粒生长良好，晶粒尺寸均匀，气孔较少。HRTEM图像显示样品同时具有结构长程有序性和局部晶格畸变。介电常数…","rv":"该工作针对MgZrNb2O8微波介质陶瓷，采用Ta5+取代结合高熵策略（引入Zr、Hf、Ti、Sn、Ge五种阳离子）改善温度稳定性。属于无机功能陶瓷/微波介质材料范畴，与有机分子晶体、生成模型、视觉生成均无直接关联，与相关数学也关系较弱。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.1021/acs.cgd.6c01015","t":"Multimodal Fusion-Based Prediction and Preparation of Cocrystal: A Case Study of Diosmetin","a":"Cocrystals offer promising approaches for the targeted regulation of raw material properties. Nevertheless, the accurate screening of cocrystal co-formers remains a critical bottleneck in the rational preparation of cocrystals. To address this challenge, a cocrystal prediction model based on multimodal fusion was constructed by integrating molecular descriptors, fingerprints, SMILES strings and molecular graphs to screen potential co-formers. The model incorporates a dynamic attention fusion mechanism and a tailored data-balancing strategy to address unimodal limitations and class imbalance, thereby enhancing classification performance under the present evaluation framework. It demonstrated strong classification performance and outperformed the evaluated unimodal models. Diosmetin was selected as the model compound, and systematic virtual screening identified promising co-formers, leading to the successful synthesis of diosmetin-4,4′-bipyridine and diosmetin-isonicotinamide cocrystals. Structural characterization revealed a 2:1 supramolecular network of diosmetin-4,4′-bipyridine stabilized by O−H···N hydrogen bonds. The two cocrystals showed lower moisture uptake than diosmetin under the tested high-humidity conditions of 40 °C/75% RH and 40 °C/95% RH. This study presents a multimodal fusion strategy for cocrystal prediction and highlights its potential in the rational design of solid forms.","au":["Yunxia Li","Di Xu","Xiaoxiao Liang","Zujin Yang","Shiyuan Liu","Yanbin Jiang"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01015","p":"2026-10-23","d":"2026-10-23","s":4.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01015","who":[],"tz":"基于多模态融合的共晶预测与制备：以Diosmetin为例","az":"共晶为靶向调控原料性质提供了有前景的途径。然而，共晶共晶体的准确筛选仍是共晶合理制备的关键瓶颈。为应对这一挑战，通过整合分子描述符、指纹、SMILES字符串和分子图，构建了一个基于多模态融合的共晶预测模型，用于筛选潜在共晶体。该模型 incorporates 动态注意力融合机制和定制的数据平衡策略，以解决单模态局限性和类别不平衡问题，从而在当前评估框架下提升分类性能。它展示了…","rv":"该工作以Diosmetin为案例，构建多模态融合（分子描述符、指纹、SMILES、分子图）共晶预测模型，采用动态注意力融合和数据平衡策略筛选共晶体。属于有机分子晶体/共晶设计领域，与生成模型有一定交叉（多模态分类），但与视觉生成、相关数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/jacs.6c10255","t":"Breaking Symmetry Cancellation: Heterovalent Substitution Unlocks Ultrastrong, Phase-Matchable Nonlinearity in Deep-Ultraviolet Tetrahedral Crystals","a":"Deep-ultraviolet (deep-UV) nonlinear optical (NLO) crystals demand a challenging integration of strong second-harmonic generation (SHG), sufficient birefringence for phase matching (PM), and a wide bandgap (λ < 200 nm). In tetrahedron-based materials, the hyperpolarizabilities of constituent tetrahedra usually nearly cancel due to structural symmetry, resulting in weak SHG and small birefringence─a classic example being α-SiO2. Breaking this symmetry-driven cancellation while retaining deep-UV transparency thus represents a key chemical design challenge. Here, we report a deep-UV transparent NLO crystal BeSO4 derived from α-SiO2 via stepwise heterovalent tetrahedral substitution. This crystal crystallizes in the noncentrosymmetric tetragonal space group, with alternating BeO4 and SO4 tetrahedra forming [Be3S3O18] six-membered rings. By effectively breaking the symmetry cancellation via alternating low-valence (Be2+) and high-valence (S6+) tetrahedra, BeSO4 achieves a deep-UV cutoff at 176 nm, an exceptional SHG response of 5.1 × KDP at 1064 nm─the strongest among all deep-UV sulfates and Be-containing deep-UV crystals, and a birefringence of 0.038 at 590 nm, almost seven times that of the isostructural BPO4. Unlike BPO4 and α-SiO2, BeSO4 exhibits SHG behavior consistent with phase-matchability, and under 532 nm excitation, it produces a detectable second-harmonic signal at 266 nm.","au":["Xia Zhang","Jia-Jun Zhang","Zhi Li","Xiangyu Hao","Xiwei Hu","Yi-Gang Chen","Miriding Mutailipu","Xian-Ming Zhang"],"v":"Journal of the American Chemical Society","u":"https://doi.org/10.1021/jacs.6c10255","p":"2026-10-23","d":"2026-10-23","s":2.7,"tp":["csp"],"kw":["space group"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/jacs.6c10255","who":[],"tz":"打破对称性抵消：异价取代在深紫外四面体晶体中解锁超强、可相位匹配的非线性","az":"深紫外（deep-UV）非线性光学（NLO）晶体需要同时具备强二次谐波产生（SHG）、足够的双折射以实现相位匹配（PM）以及宽带隙（λ < 200 nm）。在基于四面体的材料中，组成四面体的超极化率通常因结构对称性而近乎抵消，导致SHG弱、双折射小——α-SiO2即为经典例子。在保持深紫外透明度的同时打破这种对称性驱动的抵消，是关键的化学设计挑战。本文报道了一种深紫外透明NLO晶体BeSO4，它通过逐步异价四面体取代从α-SiO2衍生而来。该晶体……","rv":"该工作针对深紫外非线性光学晶体设计，通过异价四面体取代（Si→Be/S）打破α-SiO2中四面体超极化率的对称性抵消，获得BeSO4晶体，实现强SHG与可相位匹配双折射。属于无机分子晶体中的非线性光学材料设计，与生成模型、视觉生成无直接关联，与晶体结构对称性分析相关。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01241","t":"From Structurally Related Solvates to Divergent Anhydrous Polymorphs: Desolvation Pathways of Sotorasib","a":"Sotorasib is a covalent KRAS G12C inhibitor with multiple hydrogen-bonding sites and conformationally flexible groups, making it prone to solvate formation. In this work, eight sotorasib solvates were obtained and systematically characterized, and their crystal structures were determined by SCXRD. Among them, SMeOHα, SDCE, and SMIX are previously unreported solvates. Except for SMIX, the other seven solvates crystallize in the same orthorhombic space group with similar unit-cell parameters and a conserved host−host hydrogen-bonding motif, while differences in guest stoichiometry, local interactions, and lattice occupancy generate distinct packing environments. Upon guest removal, these related solvates exhibit divergent post-desolvation evolution, with lattice destabilization followed by thermal-history-dependent structural reorganization toward different anhydrous polymorphs. Under dynamic heating, DSC reveals Form II-related thermal evolution for SACN and SMeOHα, while HSM further identifies melt-mediated recrystallization for SMeOHα. Molecular dynamics simulations and solvent-vapor-induced transformation experiments further indicate lattice adaptability during guest removal and exchange. These results highlight the roles of lattice environment and thermal history in regulating post-desolvation evolution and polymorph formation.","au":["Ruoxi Huang","Yue Xu","Jia Tong","Jie Lu"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01241","p":"2026-10-22","d":"2026-10-22","s":5.0,"tp":["csp"],"kw":["space group","polymorph"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01241","who":[],"tz":"从结构相关的溶剂化物到分化的无溶剂多晶型：Sotorasib的脱溶剂路径","az":"Sotorasib是一种共价KRAS G12C抑制剂，具有多个氢键位点和构象柔性基团，容易形成溶剂化物。本工作中，获得了八个Sotorasib溶剂化物并进行了系统表征，其晶体结构通过单晶X射线衍射（SCXRD）确定。其中，SMeOHα、SDCE和SMIX为先前未报道的溶剂化物。除SMIX外，其余七个溶剂化物结晶于同一正交晶系空间群，具有相似的晶胞参数和保守的主-主氢键基序，而客体化学计量比、局部相互作用和晶格占据率的差异产生了不同的堆积环境。在去除客体后，这些相关的……","rv":"该工作系统表征了KRAS G12C抑制剂Sotorasib的八个溶剂化物晶体结构，并追踪其脱溶剂后向不同无溶剂多晶型的转变路径。属于有机分子晶体中的溶剂化物与多晶型研究，关注氢键基序保守性与堆积差异，与生成模型、视觉生成无直接关联。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01494","t":"DeepHartree: A Poisson-Coupled Neural Field for One-Shot Density Functional Theory","a":"Linear-combination-of-atomic-orbital (LCAO) density functional theory (DFT) incurs steep costs when it constructs Coulomb terms and iterates the self-consistent field (SCF) equations. Matrix-learning approaches can bypass parts of this workflow, but their outputs inherit the dimensions and conventions of a fixed orbital basis. We introduce DeepHartree, a Poisson-coupled neural field that connects continuous real-space prediction to LCAO electronic structure. An E(3)-equivariant network predicts the Hartree potential, and the Poisson equation converts this potential into electron density. Atom-centered Gaussian fields resolve the near-nuclear region, while a molecule-level correction enforces the electron count. Analytical Gaussian integrals and numerical quadrature connect the predicted fields to the Kohn–Sham matrix. One diagonalization provides estimates of frontier orbital energies and the occupied subspace, and yields the density matrix used to evaluate energy components and initialize SCF. Mean molecular weighted normalized mean absolute errors (wNMAEs) are 0.110% for QM9 and 0.199% for VQM24 on PySCF level-0 grids, increasing to 1.366% and 2.218%, respectively, on level-3 grids. Models trained on def2-SVP densities transfer without retraining to def2-TZVP and def2-QZVP, retaining total-energy accuracy and occupied-subspace agreement. The Hybrid method combines finite differences and first-order automatic differentiation with analytical Gaussian integrals and multilevel quadrature to accelerate field-to-matrix conversion.","au":["Jiankun Wu","Jinming Fan","Chao Qian","Shaodong Zhou"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01494","p":"2026-10-22","d":"2026-10-22","s":4.0,"tp":["mlip"],"kw":["density functional theory","equivariant"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01494","who":[],"tz":"DeepHartree：用于一次性密度泛函理论的Poisson耦合神经场","az":"线性组合原子轨道（LCAO）密度泛函理论（DFT）在构建库仑项和迭代自洽场（SCF）方程时计算代价高昂。矩阵学习方法可以绕过部分流程，但其输出继承了固定轨道基组的维度和约定。我们提出DeepHartree，一种Poisson耦合神经场，将连续实空间预测与LCAO电子结构联系起来。一个E(3)-等变网络预测Hartree势，Poisson方程将该势转换为电子密度。原子中心高斯场解析核附近区域，而分子级修正强制……（原文截断）","rv":"该方法用E(3)-等变神经网络直接预测Hartree势，再经Poisson方程反解电子密度，实现一次性绕过SCF迭代。核心对象是分子电子结构，与有机分子晶体、视觉生成关系较弱；与相关数学（Poisson方程、等变表示）有交叉，但本质是量子化学计算加速。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01031","t":"Voxelotor Polymorphs: Crystalline Diversity of a Highly Potent Sickle Cell Anaemia Drug","a":"The solid-state landscape of highly flexible organic molecules often presents profound challenges and opportunities in materials chemistry, critically dictating macroscopic, physicochemical, and biopharmaceutical properties. Herein, we report voxelotor, a BCS Class II drug historically developed for sickle cell disease, as a noteworthy model system to elucidate nucleation pathways and a non-classical structure-performance relationship, with bioavailability that is critically dependent on its solid form. We report the preferential crystallization, multigram scale-up, and comprehensive structural elucidation of seven distinct polymorphic forms (Forms I-VII), including four previously undiscovered solid phases. Single-crystal X-ray diffraction and computational lattice energy calculations, including Hirshfeld surface analysis, show that its rich polymorphic diversity is rooted in extreme torsional adaptability (variations in τ2 from -160.0° to +110.0°), which drives parallel displaced π···π stacking and hydrogen-bonded assemblies. Thermal and humidity stress profiling discloses a complex relationship between thermodynamic stability and kinetic trapping. Notably, we identified paradoxical stability behavior in which seemingly robust, high lattice energy metastable states (e.g., Forms III, IV, V, and VI) undergo temperature- and moisture-promoted structural transformation and solid-state conversion to Form I crystals, which exhibit greater stability under ambient conditions.","au":["Christy P. George","Akram A. Khan","Parth S. Shaligram","Nagabhushan Shet","Tabrez R. Shaikh","Rinu Pandya","Ganesh More","Ziya Tufail","Kumar Vanka","Ajay Kumar"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01031","p":"2026-10-22","d":"2026-10-22","s":3.2,"tp":["csp"],"kw":["lattice energy"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01031","who":[],"tz":"Voxelotor多晶型：一种高效镰状细胞贫血药物的晶体多样性","az":"高度柔性有机分子的固态景观在材料化学中常带来深刻挑战与机遇， critically 决定宏观、理化及生物制药性质。本文报告Voxelotor——一种BCS II类药物，历史上为镰状细胞病开发——作为阐明成核路径和非经典结构-性能关系的显著模型体系，其生物利用度 critically 依赖于其固相形态。我们报告了七种不同多晶型（I–VII型）的优先结晶、多克级放大和全面结构解析，其中包括四种此前未发现的……（原文截断）","rv":"直接研究有机药物Voxelotor的固态多晶型，报告了七种晶型的优先结晶、多克放大及结构解析，其中四种为新发现。属于典型的有机分子晶体/药物多晶型研究，与生成模型、视觉生成无直接关联，数学层面仅涉及晶体学对称性分析。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01588","t":"MARS: Machine-Learned Force Field Framework for Automated Conformational Sampling, Vibrational Spectroscopy, and Microsolvation","a":"We present MARS, an open-source Python package for automated conformational ensemble generation, infrared spectrum prediction, and explicit microsolvation of molecular systems. Built on JAX for GPU acceleration and automatic differentiation, MARS is carried out with machine-learned force fields (MLFFs), including SO3LR and MACE, with a four-phase conformational sampling workflow combining metadynamics, multitemperature molecular dynamics, and genetic algorithms. The package provides automated vibrational mode classification using Wilson B-matrix projections and functional group identification via graph-based pattern matching. We benchmark MARS on chemically diverse systems, including alkanes, halogenated aromatics, amino acids, peptides, drug-like molecules, phosphamides, host–guest complexes, and microsolvated biomolecular models. Semiempirical quantum-chemical methods have until now provided the practical state of the art for automated conformational sampling. Our benchmarks show that modern MLFFs can improve upon this paradigm by combining greater accuracy for high-level relative conformer energies with lower computational cost and more favorable scaling with molecular size. IR benchmarks against experimental gas-phase spectra additionally show performance comparable to quantum-chemical methods, with chemically interpretable mode assignments.","au":["Sergio Suárez-Dou","Miguel Gallegos","Florian N. Brünig","Alexandre Tkatchenko"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01588","p":"2026-10-21","d":"2026-10-21","s":5.9,"tp":["mlip"],"kw":["mace"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01588","who":["Alexandre Tkatchenko"],"tz":"MARS：用于自动构象采样、振动光谱和微溶剂化的机器学习力场框架","az":"我们提出MARS，一个开源Python包，用于分子系统的自动构象系综生成、红外光谱预测和显式微溶剂化。MARS基于JAX实现GPU加速和自动微分，采用机器学习力场（MLFFs），包括SO3LR和MACE，通过四阶段构象采样工作流结合元动力学、多温度分子动力学和遗传算法。该包提供基于Wilson B矩阵投影的自动振动模式分类和基于图模式匹配的功能团识别。我们在化学多样化的体系上对MARS进行了基准测试，包括烷烃……","rv":"MARS是基于JAX和机器学习力场（SO3LR、MACE）的开源Python工具包，实现有机分子构象采样、红外光谱预测和微溶剂化模拟，结合元动力学、多温度MD和遗传算法。属于计算化学/分子模拟工具，与有机分子晶体有间接关联（分子层面），与生成模型、视觉生成无直接关系。","tr":"high","tw":"作者：Alexandre Tkatchenko；期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01209","t":"Chameleonic π-Hole Behavior in Metal−Isocyanide Complexes: N ↔ C Composition-Controlled Migration","a":"Cocrystal architecture reflects the cumulative outcome of competing and cooperating noncovalent interactions (NCIs) within the lattice. Here we demonstrate that the electrophilic π-hole of a coordinated aryl isocyanide is chameleonic: its localization migrates between the nitrogen and carbon termini of the C≡N bond in direct response to crystal composition. X-ray diffraction analysis of trans-[PdI2(CNC6H4Cl-4)2] (1) and its iodine cocrystals 1·I2 and 1·2I2, complemented by the isostructural platinum(II) analogue 2·I2, reveals three distinct binding regimes: Pd-πAr assembly in the parent complex, Pd-π-(CN) assembly at 1:1 stoichiometry, and π-(CN)-hole···I(LP) contacts at 1:2 stoichiometry. Quantum chemical analysis (Molecular Electrostatic Potential, Quantum Theory of Atoms in Molecules, NCIplot, Energy Decomposition Analysis, Natural Bond Orbital) establishes that the short C≡N bond and the small electrostatic differential between the two termini generate a delocalized π-hole that adapts to spatial demands imposed by competing halogen bonds. Energy decomposition further reveals that the N ↔ C migration is accompanied by a fundamental change in the stabilizing forces, from dispersion- and correlation-dominated stacking to orbital- and electrostatic-driven halogen bonding. These findings establish stoichiometry-controlled π-hole directionality as a design principle for engineering cocrystals in which multiple NCI types coexist in spatially optimized arrangements.","au":["Mikhail A. Kinzhalov","Polina V. Komova","Rosa M. Gomila","Antonio Frontera","Vadim Yu Kukushkin","Nadezhda A. Bokach"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01209","p":"2026-10-21","d":"2026-10-21","s":3.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01209","who":[],"tz":"金属-异氰化物配合物中变色龙式π-hole行为：N↔C组成控制迁移","az":"共晶结构反映了晶格内竞争与合作非共价相互作用（NCIs）的累积结果。本文证明配位芳基异氰化物的亲电π-hole具有变色龙特性：其定位在C≡N键的氮端和碳端之间迁移，直接响应于晶体组成的变化。对trans-[PdI2(CNC6H4Cl-4)2]（1）及其碘共晶1·I2和1·2I2的X射线衍射分析，辅以同构铂(II)类似物2·I2，揭示了三种不同的结合模式：母体配合物中的Pd-πAr组装、1:1化学计量比下的Pd-π-(CN)组装，以及1:2化学计量比下的π-(CN)-hole···I(LP)接触。Q……","rv":"研究金属-异氰化物配合物共晶中π-hole的组成依赖性迁移，通过X射线衍射和量子化学分析揭示Pd-πAr、Pd-π-(CN)及π-hole···I(LP)三种非共价结合模式。与有机分子晶体关系较近（共晶结构、非共价相互作用分析），但与生成模型、视觉生成无关联。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1107/s2052252526008912","t":"The overlooked ZIF: reviving [Cu(imidazolato) 2 ] from 1960s literature","a":"Metal–organic frameworks (MOFs), and in particular zeolitic imidazolate frameworks (ZIFs), are amongst the most well studied materials in modern chemistry. MOFs emerged as an explicit subfield of chemistry in the late 1980s and 1990s. However, much foundational work was accomplished in earlier decades. Here, we detail the structural and gas-adsorption characterization of [Cu(im) 2 ] (im = imidazolate), a ZIF that was widely reported in the early 1960s. This compound exists as several polymorphs. We re-prepared the historic blue polymorph [Cu(im) 2 ]-B, which has a sodalite topology, confirmed its identity by single-crystal X-ray diffraction, and measured its gas-adsorption isotherms. We conclude that the true origin of ZIFs lies with a copper(II) framework discovered more than 60 years ago that has been overlooked by recent literature.","au":["Cara Bosman","Shane G. Telfer"],"v":"IUCrJ","u":"https://doi.org/10.1107/s2052252526008912","p":"2026-10-20","d":"2026-10-20","s":3.8,"tp":["csp"],"kw":["polymorph"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1107/s2052252526008912","who":[],"tz":"被忽视的ZIF：从1960年代文献中复兴[Cu(咪唑酸根)₂]","az":"金属有机框架（MOFs），尤其是沸石咪唑酯骨架材料（ZIFs），是现代化学中研究最深入的材料之一。MOFs在20世纪80年代末和90年代才作为一个明确的化学子领域出现，但许多基础性工作早在更早的几十年就已完成。本文详细报道了[Cu(im)₂]（im = 咪唑酸根）的结构与气体吸附表征，这是一种在1960年代初期被广泛报道的ZIF。该化合物存在多种多晶型。我们重新制备了历史上报道的蓝色多晶型[Cu(im)₂]-B，其具有sodalite拓扑结构，通过单晶X射线衍射确认了其身份，并测量了其气体吸附等温线。我们进一步……","rv":"本文重新制备并表征了1960年代文献中报道的ZIF材料[Cu(im)₂]的蓝色多晶型（sodalite拓扑），通过单晶X射线衍射确认结构并测量气体吸附等温线。属于配位化学与有机分子晶体范畴，与生成模型、视觉生成及相关数学关系很弱，本质是材料历史考古与结构表征工作。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1039/d6ce00683c","t":"The Effect of High Pressure on Nanoporous Molecular Crystals of Cofacial Porphyrin/Phthalocyanine Heterodimers","a":"High-pressure single-crystal X-ray diffraction was used to characterize two phthalocyanine nanoporous crystals (PNCs) based on cofacial heterodimers of tetraphenylporphyrin (TPPCo) and octa(2’,6’-di-iso-propylphenoxy)phthalocyanine [(dipPhO)8PcCo], with and without a 4,4’-bipyridine \"wall-tie\" ligand....","au":["Gemma Turner","Nikolaos-Angelos Stamos","Shannah Kerrigan","Rebecca Blake","James Ross Brookes","Aston M Summers","Stephanie Bird","Rosemary Young","Alan Riboldi-Tunnicliffe","Rachel Williamson"],"v":"CrystEngComm","u":"https://doi.org/10.1039/d6ce00683c","p":"2026-10-20","d":"2026-10-20","s":3.7,"tp":["csp"],"kw":["molecular crystals"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1039/d6ce00683c","who":[],"tz":"高压对共面卟啉/酞菁异二聚体纳米多孔分子晶体的影响","az":"利用高压单晶X射线衍射表征了两种基于四苯基卟啉（TPPCo）与八(2',6'-二异丙基苯氧基)酞菁[(dipPhO)8PcCo]共面异二聚体的酞菁纳米多孔晶体（PNCs），分别含有和不含有4,4'-联吡啶「墙链」配体。……（原文截断）","rv":"高压单晶XRD研究共面卟啉/酞菁异二聚体纳米多孔分子晶体。在高压下表征两种PNCs的结构变化，含与不含联吡啶墙链配体。与「有机分子晶体」直接相关，涉及分子堆积与多孔结构；与「生成模型」「视觉生成」「相关数学」关系弱。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.1021/acs.cgd.6c00813","t":"Insights into the Nature and Thermal Phase Behavior of Mechanochemically Prepared Multicomponent Solids of 2-Amino-5-nitropyridine with para -Substituted Benzoic Acids","a":"The thermal phase behavior of binary systems consisting of the supramolecular building block 2-amino-5-nitropyridine (ANP) with five systematically varied series of para-substituted aromatic acids (4XBA), viz, benzoic acid (BA), 4-fluorobenzoic acid (4FBA), 4-chlorobenzoic acid (4CBA), 4-bromobenzoic acid (4BBA), and 4-iodobenzoic acid (4IBA), was investigated separately. While single-crystal structures of 1:1 ANP-4FBA, 1:1 ANP-4CBA, and 1:1 ANP-4BBA in this series are known, their bulk thermodynamic stability and mechanochemical phase behavior have remained unmapped. The bulk binary mixtures of various compositions were prepared by an environmentally friendly mechanochemical neat grinding method. The thermal properties of the ground materials were thoroughly mapped using differential scanning calorimetry (DSC). The solid−liquid thermal binary phase diagrams were systematically constructed using DSC data and validated using Tammann plots and Predictor of Eutectic Mixture (PoEM) analysis. The phase diagram study of all the five systems revealed the distinct thermal phase behavior across the series. The ANP-4FBA system forms a stable congruently melting 1:1 cocrystal characterized by a “W-shaped” phase diagram with two eutectic valleys, while the ANP-BA, ANP-4CBA, and ANP-4BBA systems form an incongruent 1:1 cocrystal characterized by an asymmetrical liquidus curve terminating at a horizontal peritectic isothermal line in their phase diagrams.","au":["K. S. Prabhuswamy","S. Naveen","Y. N. Sudhakar","P. A. Suchetan"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00813","p":"2026-10-20","d":"2026-10-20","s":3.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00813","who":[],"tz":"机械化学制备的2-氨基-5-硝基吡啶与对位取代苯甲酸多组分固体的本征性质与热相行为研究","az":"研究了由超分子构建模块2-氨基-5-硝基吡啶(ANP)与五种系统变化的对位取代芳香酸(4XBA)——即苯甲酸(BA)、4-氟苯甲酸(4FBA)、4-氯苯甲酸(4CBA)、4-溴苯甲酸(4BBA)和4-碘苯甲酸(4IBA)——组成的二元体系的热相行为。虽然该系列中1:1 ANP-4FBA、1:1 ANP-4CBA和1:1 ANP-4BBA的单晶结构已知，但其体相热力学稳定性和机械化学相行为尚未被系统表征。各种组成的体相二元混合物通过环境友好的机械化学干法研磨制备……","rv":"本文研究2-氨基-5-硝基吡啶(ANP)与五种对位取代苯甲酸经机械化学研磨制备的二元多组分固体，系统考察其热相行为与体相热力学稳定性。属于有机分子晶体与超分子化学领域，关注晶体相图与相变，与生成模型、视觉生成及相关数学基本无关。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1039/d6ce00725b","t":"Dual-halogen engineering of chlorothienyl chalcone crystals for tunable noncentrosymmetric packing and enhanced terahertz nonlinear optical response","a":"Fluorine substitution optimizes crystal growth and polar packing in chlorothienyl chalcone crystals, leading to enhanced SHG response and broadband THz emission.","au":["Fanghao Xuan","Yukang Liang","Yanxi Deng","Luyao Jiang","Chuyi Liang","Yurong Ma"],"v":"CrystEngComm","u":"https://doi.org/10.1039/d6ce00725b","p":"2026-10-20","d":"2026-10-20","s":0.0,"tp":[],"kw":[],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1039/d6ce00725b","who":[],"tz":"氯噻吩查尔酮晶体的双卤素工程：可调非中心对称堆积与增强太赫兹非线性光学响应","az":"氟取代优化了氯噻吩查尔酮晶体的晶体生长和极性堆积，从而增强了二次谐波(SHG)响应和宽带太赫兹(THz)发射。","rv":"本文通过双卤素（氟/氯）工程调控氯噻吩查尔酮晶体的非中心对称堆积，优化晶体生长与极性排列，增强二次谐波响应和宽带太赫兹非线性光学发射。属于有机分子晶体与晶体工程领域，聚焦卤素取代对晶体光学性能的影响，与生成模型、视觉生成及相关数学关系很弱。","tr":"","tw":"","why":""}],"trends":{"vision-gen":{"2026-10-22":3,"2026-10-20":4,"2026-10-23":8,"2026-10-19":4,"2026-10-21":1},"gen-model":{"2026-10-24":1,"2026-10-20":4,"2026-10-21":4,"2026-10-27":1,"2026   if(s==='topic'){
    const order={}; TOPICS.forEach((t,i)=>order[t.id]=i);
    return list.sort((a,b)=>{
      const ia=order[a.tp[0]]==null?99:order[a.tp[0]], ib=order[b.tp[0]]==null?99:order[b.tp[0]];
      return ia-ib || b.s-a.s;
    });
  }
  return list.sort((a,b)=>{
    if(s==='date') return (b.p||b.d).localeCompare(a.p||a.d)||b.s-a.s;
    if(s==='venue') return (a.v||'~').localeCompare(b.v||'~')||b.s-a.s;
    return b.s-a.s;
  });
}

/* ---------------- trend ---------------- */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function lastDays(n){ const out=[]; for(let i=n-1;i>=0;i--){ const d=new Date(TODAY+'T00:00:00'); d.setDate(d.getDate()-i); out.push(ymd(d)); } return out; }
function renderTrend(){
  const days=lastDays(14);
  const rows=TOPICS.map(t=>{
    const ser=days.map(d=>(TREND[t.id]||{})[d]||0);
    const max=Math.max(1,...ser);
    const cur=ser.slice(7).reduce((a,b)=>a+b,0), prev=ser.slice(0,7).reduce((a,b)=>a+b,0);
    const dlabel=prev?`${cur>=prev?'+':''}${Math.round((cur-prev)/prev*100)}%`:(cur?'NEW':'–');
    const cls=!prev?(cur?'new':'flat'):(cur>=prev?'up':'down');
    const bars=ser.map((v,i)=>`<span class="bar${i>=7?' now':''}" style="height:${Math.max(2,v/max*26)}px" title="${days[i]} · ${v} 条"></span>`).join('');
    const on=state.topics.includes(t.id);
    return `<button class="trow${on?' on':''}" data-topic="${t.id}" style="--h:${t.hue}">
      <span class="tname">${esc(t.short)}</span>
      <span class="spark">${bars}</span>
      <span class="tnum">${cur}<i class="${cls}">${dlabel}</i></span>
    </button>`;
  }).join('');
  $('#trend').innerHTML=`<div class="trend-head">近 14 天各主题新增（前 7 天 vs 后 7 天，点一行可筛选）<button class="mini" id="toggleTrend">收起</button></div>
    <div class="trend-body" id="trendBody">${rows}</div>`;
  $('#trendBody').classList.toggle('hidden',!!state.trendHidden);
}
function toggleTrend(){ state.trendHidden=!state.trendHidden; touch(); $('#trendBody').classList.toggle('hidden',!!state.trendHidden); $('#toggleTrend').textContent=state.trendHidden?'展开':'收起'; }

/* ---------------- list ---------------- */
function chip(t){ return `<span class="chip" style="--h:${THUE[t]||210}">${esc(TNAME[t]||t)}</span>`; }
function card(it){
  const read=!!state.read[it.k], star=!!state.star[it.k], h=THUE[it.tp[0]]||210;

  const who=(it.who||[]).map(w=>`<button class="who" data-q="${esc(w)}" title="按作者搜索">👤 ${esc(w)}</button>`).join('');
  const open=openSet.has(it.k);

  return `<article class="card${read?' read':''}${star?' starred':''}${open?' open':''}" data-k="${esc(it.k)}" style="--h:${h}">
    <div class="chead">
      <button class="icon btn-read" title="标记已读 / 未读 (m)">${read?'✓':'○'}</button>
      <div class="ctitle"><a href="${esc(it.u||'#')}" target="_blank" rel="noopener" data-open="1">${hl(it.t)}</a>${it.tz?`<div class="zh">${esc(it.tz)}</div>`:''}</div>
      <span class="score" title="相关度 ${it.s}${it.tw?' · '+it.tw:''}">${it.s}${trustLab?`<span class="trust ${esc(it.tr)}">可信${trustLab}</span>`:''}</span>
      <button class="icon btn-star${star?' on':''}" title="收藏 (s)">${star?'★':'☆'}</button>
    </div>
    <div class="cmeta">${it.tp.map(chip).join('')}${kind}
      ${it.v?`<span class="venue">${esc(it.v)}</span>`:''}
      <span>${esc(it.p||it.d)}</span>${who}${srcs}</div>
    ${it.kw.length?`<div class="ckw">${it.kw.slice(0,6).map(k=>`<span>${esc(k)}</span>`).join('')}</div>`:''}
    ${comment?`<div class="cwhy">短评 ${esc(comment)}</div>`:''}
    ${it.az?`<div class="cabs zhabs"><strong>中文摘要：</strong>${esc(it.az)}</div>`:(it.a?'<div class="cabs zhabs">中文翻译待补齐</div>':'')}
    <div class="cabs"><strong>原文摘要：</strong>${esc(it.a)||'<i>（来源未提供摘要）</i>'}</div>
    <div class="cfoot">

      ${it.ax?`<a class="link" href="https://arxiv.org/pdf/${esc(it.ax)}" target="_blank" rel="noopener">PDF</a>`:''}
      ${it.doi?`<a class="link" href="https://doi.org/${esc(it.doi)}" target="_blank" rel="noopener">DOI</a>`:''}
      <span class="spacer"></span>
      <button class="link btn-copy">复制引用</button>
    </div>
    <div class="more${open?'':' hidden'}">
      <div class="mrow"><b>作者</b>${esc(it.au.join('; ')||'—')}</div>
      <div class="mrow"><b>全部命中</b>${esc(it.kw.join('、')||'—')}</div>
      <div class="mrow"><b>来源</b>${esc(it.src.map(s=>SRCNAME[s]||s).join(' / ')||'—')}</div>
      <textarea class="note" rows="2" placeholder="备注：为什么留它 / 和我的课题什么关系…">${esc(state.note[it.k]||'')}</textarea>
    </div>
  </article>`;
}
function renderList(){
  const list=$('#list');
  if(!view.length){
    const scope={today:'今天',week:'近 7 天',unread:'未读',star:'只看收藏',day:'这一天'}[state.view]||'当前视图';
    const hint=(state.q&&state.view!=='all')
      ? `<button class="tool" id="searchAll" style="margin-top:10px">在全部历史里搜「${esc(state.q)}」</button>`
      : '';
    list.innerHTML=`<div class="empty"><b>${esc(scope)}里没有符合条件的条目</b>

    const b=$('#searchAll'); if(b) b.onclick=()=>{ state.view='all'; state.limit=DEFAULTS.limit; touch(); renderAll(); };

  }

function renderCrumb(){

/* ---------------- actions ---------------- */
function renderOverview(){

function renderAll(){ compute(); renderViews(); renderFilters(); renderDates(); renderList(); renderTrend(); renderEvents(); }
function toggleRead(k){ state.read[k]=!state.read[k]; if(!state.read[k]) delete state.read[k]; touch(); renderAll(); }
function toggleStar(k){
  if(state.star[k]) delete state.star[k];
  else state.star[k]=true;
  applyKept();
  touch();
  renderAll();
}
function markAllRead(){ view.forEach(it=>state.read[it.k]=true); touch(); renderAll(); toast('已把当前 '+view.length+' 条标记为已读'); }
function clearFilters(){ state.topics=[]; state.sources=[]; state.q=''; state.limit=DEFAULTS.limit; $('#q').value=''; touch(); renderAll(); }
function copyText(text,okMsg){
  const done=()=>toast(okMsg||'已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,()=>fallback()); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择');} ta.remove(); }
}
function bibtex(it){
  const year=(it.p||it.d||'').slice(0,4);
  const first=(it.au[0]||'anon').split(/\s+/).slice(-1)[0].toLowerCase().replace(/[^a-z]/g,'');
  const key=(first||'ref')+year+(it.k||'').replace(/[^a-z0-9]/gi,'').slice(-4);
  const authors=it.au.join(' and ');
  const fields=[`title = {${it.t}}`,authors?`author = {${authors}}`:'',it.v?`journal = {${it.v}}`:'',
    year?`year = {${year}}`:'',it.doi?`doi = {${it.doi}}`:'',it.ax?`eprint = {${it.ax}}`:(it.u?`url = {${it.u}}`:'')].filter(Boolean);
  return `@article{${key},\n  ${fields.join(',\n  ')}\n}`;
}
function mdOf(list){
  const lines=[`# 科研雷达 · ${TODAY} · 导出 ${list.length} 条`,''];
  list.forEach(it=>{
    lines.push(`- **[${it.t}](${it.u})**`);
    const meta=[it.v,it.p,it.tp.map(t=>TNAME[t]||t).join('/'),`相关度 ${it.s}`].filter(Boolean).join(' · ');
    lines.push(`  ${meta}`);
    if(it.a) lines.push(`  > ${it.a}`);
  });
  return lines.join('\n')+'\n';
}
function download(name,text){
  const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function setTheme(t){ state.theme=t; touch(); document.documentElement.dataset.theme=t; toast('主题：'+({auto:'跟随系统',light:'浅色',dark:'深色'}[t])); }

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-topic],[data-source],[data-date],[data-open],.btn-read,.btn-star,.btn-more,.btn-copy');
  if(!t) return;
  if(t.dataset.q!==undefined&&t.classList.contains('who')){ state.q=t.dataset.q; $('#q').value=state.q; state.limit=DEFAULTS.limit; touch(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.view){ state.view=t.dataset.view; state.date=null; state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.topic){ const id=t.dataset.topic; const i=state.topics.indexOf(id);
    if(i>=0) state.topics.splice(i,1); else state.topics.push(id);
    state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.source){ const id=t.dataset.source; const i=state.sources.indexOf(id);
    if(i>=0) state.sources.splice(i,1); else state.sources.push(id);
    state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.date){ state.view='day'; state.date=t.dataset.date; state.limit=DEFAULTS.limit; touch(); renderAll();
    window.scrollTo({top:0,behavior:'smooth'}); return; }
  const cardEl=t.closest('.card'); if(!cardEl) return; const k=cardEl.dataset.k;
  if(t.classList.contains('btn-read')){ toggleRead(k); return; }
  if(t.classList.contains('btn-star')){ toggleStar(k); return; }
  if(t.classList.contains('btn-more')){
    if(openSet.has(k)) openSet.delete(k); else openSet.add(k);
    cardEl.classList.toggle('open'); t.textContent=openSet.has(k)?'收起':'详情'; return; }
  if(t.classList.contains('btn-copy')){ const it=ITEMS.find(x=>x.k===k); if(it) copyText(bibtex(it),'已复制 BibTeX'); return; }
  if(t.dataset.open){ state.read[k]=true; touch(); const dot=cardEl.querySelector('.btn-read'); if(dot) dot.textContent='✓'; cardEl.classList.add('read'); renderViews(); }
});
document.addEventListener('input',e=>{

    saveTimer=setTimeout(()=>{touch(); renderAll();},140); return; }

$('#helpHost').addEventListener('click',e=>{ if(e.target.closest('.help')===e.target||e.target.dataset.close!==undefined) toggleHelp(false); });
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') { if(e.key==='Escape') e.target.blur(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key==='?'){ e.preventDefault(); toggleHelp(); return; }
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); moveFocus(1); return; }
  if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); moveFocus(-1); return; }
  if(e.key==='Escape'){ toggleHelp(false); clearFilters(); return; }
  const el=document.querySelector('.card.focus'); if(!el){ if(['o','s','m','e'].includes(e.key)){ moveFocus(1);} else return; }
  const k=el&&el.dataset.k; if(!k) return;
  if(e.key==='o'){ const it=ITEMS.find(x=>x.k===k); if(it&&it.u){ state.read[k]=true; touch(); window.open(it.u,'_blank','noopener'); renderAll(); } }
  if(e.key==='s'){ toggleStar(k); }
  if(e.key==='m'){ toggleRead(k); }
  if(e.key==='e'){ if(openSet.has(k)) openSet.delete(k); else openSet.add(k);
    el.classList.toggle('open'); const b=el.querySelector('.btn-more'); if(b) b.textContent=openSet.has(k)?'收起':'详情'; }
});
function moveFocus(dir){
  const cards=$$('#list .card'); if(!cards.length) return;
  const cur=cards.findIndex(c=>c.classList.contains('focus'));
  focusIdx=cur<0?0:Math.max(0,Math.min(cards.length-1,cur+dir));
  cards.forEach(c=>c.classList.remove('focus'));
  const el=cards[focusIdx]; el.classList.add('focus'); el.scrollIntoView({block:'center',behavior:'smooth'});
}
function toggleHelp(force){
  const host=$('#helpHost');
  if(host.firstChild && force!==true){ host.innerHTML=''; return; }

    </div></div>`;
}
