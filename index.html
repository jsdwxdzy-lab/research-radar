-harmonic generation (SHG), sufficient birefringence for phase matching (PM), and a wide bandgap (λ < 200 nm). In tetrahedron-based materials, the hyperpolarizabilities of constituent tetrahedra usually nearly cancel due to structural symmetry, resulting in weak SHG and small birefringence─a classic example being α-SiO2. Breaking this symmetry-driven cancellation while retaining deep-UV transparency thus represents a key chemical design challenge. Here, we report a deep-UV transparent NLO crystal BeSO4 derived from α-SiO2 via stepwise heterovalent tetrahedral substitution. This crystal crystallizes in the noncentrosymmetric tetragonal space group, with alternating BeO4 and SO4 tetrahedra forming [Be3S3O18] six-membered rings. By effectively breaking the symmetry cancellation via alternating low-valence (Be2+) and high-valence (S6+) tetrahedra, BeSO4 achieves a deep-UV cutoff at 176 nm, an exceptional SHG response of 5.1 × KDP at 1064 nm─the strongest among all deep-UV sulfates and Be-containing deep-UV crystals, and a birefringence of 0.038 at 590 nm, almost seven times that of the isostructural BPO4. Unlike BPO4 and α-SiO2, BeSO4 exhibits SHG behavior consistent with phase-matchability, and under 532 nm excitation, it produces a detectable second-harmonic signal at 266 nm.","au":["Xia Zhang","Jia-Jun Zhang","Zhi Li","Xiangyu Hao","Xiwei Hu","Yi-Gang Chen","Miriding Mutailipu","Xian-Ming Zhang"],"v":"Journal of the American Chemical Society","u":"https://doi.org/10.1021/jacs.6c10255","p":"2026-10-23","d":"2026-10-23","s":2.7,"tp":["csp"],"kw":["space group"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/jacs.6c10255","who":[],"tz":"打破对称性抵消：异价取代在深紫外四面体晶体中解锁超强、可相位匹配的非线性","az":"深紫外（deep-UV）非线性光学（NLO）晶体要求将强二次谐波产生（SHG）、足以实现相位匹配（PM）的双折射以及宽带隙（λ < 200 nm）进行极具挑战性的整合。在基于四面体的材料中，组成四面体的超极化率通常因结构对称性而几乎相互抵消，导致 SHG 弱且双折射小——α-SiO2 即是一个经典例子。因此，在保持深紫外透明度的同时打破这种由对称性驱动的抵消，构成了一个关键的化学设计挑战。在此，我们报道了一种通过逐步异价四面体取代由 α-SiO2 衍生而来的深紫外透明 NLO 晶体 BeSO4。该晶体结晶于非中心对称四方空间群，其中交替排列的 BeO4 和 SO4 四面体形成 [Be3S3O18] 六元环。通过交替低价（Be2+）和高价（S6+）四面体有效打破对称性抵消，BeSO4 实现了 176 nm 的深紫外截止、1064 nm 处 5.1 × KDP 的卓越 SHG 响应——这是所有深紫外硫酸盐和含铍深紫外晶体中最强的——以及 590 nm 处 0.038 的双折射，几乎是同构 BPO4 的七倍。与 BPO4 和 α-SiO2 不同，BeSO4 表现出与相位匹配性一致的 SHG 行为，在 532 nm 激发下，它在 266 nm 处产生了可检测的二次谐波信号。","rv":"该文献研究无机深紫外非线性光学晶体 BeSO4，通过逐步异价四面体取代打破对称性抵消，实现强二次谐波与相位匹配。属于无机晶体材料设计，与「有机分子晶体」在晶体对称性与非线性光学层面有交叉，但与生成模型、视觉生成及相关数学关系很弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01241","t":"From Structurally Related Solvates to Divergent Anhydrous Polymorphs: Desolvation Pathways of Sotorasib","a":"Sotorasib is a covalent KRAS G12C inhibitor with multiple hydrogen-bonding sites and conformationally flexible groups, making it prone to solvate formation. In this work, eight sotorasib solvates were obtained and systematically characterized, and their crystal structures were determined by SCXRD. Among them, SMeOHα, SDCE, and SMIX are previously unreported solvates. Except for SMIX, the other seven solvates crystallize in the same orthorhombic space group with similar unit-cell parameters and a conserved host−host hydrogen-bonding motif, while differences in guest stoichiometry, local interactions, and lattice occupancy generate distinct packing environments. Upon guest removal, these related solvates exhibit divergent post-desolvation evolution, with lattice destabilization followed by thermal-history-dependent structural reorganization toward different anhydrous polymorphs. Under dynamic heating, DSC reveals Form II-related thermal evolution for SACN and SMeOHα, while HSM further identifies melt-mediated recrystallization for SMeOHα. Molecular dynamics simulations and solvent-vapor-induced transformation experiments further indicate lattice adaptability during guest removal and exchange. These results highlight the roles of lattice environment and thermal history in regulating post-desolvation evolution and polymorph formation.","au":["Ruoxi Huang","Yue Xu","Jia Tong","Jie Lu"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01241","p":"2026-10-22","d":"2026-10-22","s":5.0,"tp":["csp"],"kw":["space group","polymorph"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01241","who":[],"tz":"从结构相关溶剂化物到分歧无水晶型：Sotorasib 的脱溶剂路径","az":"Sotorasib 是一种共价 KRAS G12C 抑制剂，具有多个氢键位点和构象柔性基团，因此容易形成溶剂化物。本工作中，获得了八种 sotorasib 溶剂化物并进行了系统表征，其晶体结构通过单晶 X 射线衍射（SCXRD）确定。其中，SMeOHα、SDCE 和 SMIX 是此前未报道的溶剂化物。除 SMIX 外，其余七种溶剂化物结晶于同一正交晶系空间群，具有相似的晶胞参数和保守的宿主-宿主氢键基序，而客体化学计量比、局部相互作用和晶格占位率的差异产生了不同的堆积环境。在去除客体后，这些结构相关的溶剂化物表现出不同的脱溶剂后演化路径，晶格失稳后经历依赖于热历史的结构重组，趋向不同的无水晶型。在动态加热条件下，DSC 揭示了 SACN 和 SMeOHα 的 Form II 相关热演化，而 HSM 进一步识别出 SMeOHα 的熔融介导重结晶。分子动力学模拟和溶剂蒸气诱导转化实验进一步表明，在客体去除和交换过程中晶格具有适应性。这些结果突出了晶格环境和热历史在调控脱溶剂后演化和晶型形成中的作用。","rv":"研究对象为 sotorasib（KRAS G12C 抑制剂）的八种溶剂化物及其脱溶剂路径，属有机分子晶体与药物多晶型范畴。方法涵盖 SCXRD、DSC、HSM 及分子动力学模拟，核心发现是结构相近的溶剂化物脱溶剂后走向不同无水晶型，受晶格环境与热历史共同调控。与生成模型、视觉生成及相关数学关系很弱，是纯粹的晶体学/多晶型问题。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01494","t":"DeepHartree: A Poisson-Coupled Neural Field for One-Shot Density Functional Theory","a":"Linear-combination-of-atomic-orbital (LCAO) density functional theory (DFT) incurs steep costs when it constructs Coulomb terms and iterates the self-consistent field (SCF) equations. Matrix-learning approaches can bypass parts of this workflow, but their outputs inherit the dimensions and conventions of a fixed orbital basis. We introduce DeepHartree, a Poisson-coupled neural field that connects continuous real-space prediction to LCAO electronic structure. An E(3)-equivariant network predicts the Hartree potential, and the Poisson equation converts this potential into electron density. Atom-centered Gaussian fields resolve the near-nuclear region, while a molecule-level correction enforces the electron count. Analytical Gaussian integrals and numerical quadrature connect the predicted fields to the Kohn–Sham matrix. One diagonalization provides estimates of frontier orbital energies and the occupied subspace, and yields the density matrix used to evaluate energy components and initialize SCF. Mean molecular weighted normalized mean absolute errors (wNMAEs) are 0.110% for QM9 and 0.199% for VQM24 on PySCF level-0 grids, increasing to 1.366% and 2.218%, respectively, on level-3 grids. Models trained on def2-SVP densities transfer without retraining to def2-TZVP and def2-QZVP, retaining total-energy accuracy and occupied-subspace agreement. The Hybrid method combines finite differences and first-order automatic differentiation with analytical Gaussian integrals and multilevel quadrature to accelerate field-to-matrix conversion.","au":["Jiankun Wu","Jinming Fan","Chao Qian","Shaodong Zhou"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01494","p":"2026-10-22","d":"2026-10-22","s":4.0,"tp":["mlip"],"kw":["density functional theory","equivariant"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01494","who":[],"tz":"DeepHartree：面向单次密度泛函理论的泊松耦合神经场","az":"原子轨道线性组合（LCAO）密度泛函理论（DFT）在构建库仑项和迭代自洽场（SCF）方程时会产生高昂的计算成本。矩阵学习方法可以绕过该工作流的部分环节，但其输出继承了固定轨道基组的维度和约定。我们提出 DeepHartree，一种泊松耦合的神经场，将连续实空间预测与 LCAO 电子结构连接起来。一个 E(3)-等变网络预测哈特里势，泊松方程将该势转换为电子密度。以原子为中心的 Gaussian 场解析近核区域，而分子层面的校正则约束电子数。解析 Gaussian 积分和数值求积将预测的场与 Kohn–Sham 矩阵连接起来。一次对角化即可提供前沿轨道能量和占据子空间的估计，并生成用于评估能量分量和初始化 SCF 的密度矩阵。在 PySCF level-0 网格上，QM9 和 VQM24 的平均分子加权归一化平均绝对误差（wNMAE）分别为 0.110% 和 0.199%；在 level-3 网格上分别增至 1.366% 和 2.218%。在 def2-SVP 密度上训练的模型无需重新训练即可迁移至 def2-TZVP 和 def2-QZVP，保持总能精度和占据子空间一致性。Hybrid 方法将有限差分和一阶自动微分与解析 Gaussian 积分及多级求积相结合，以加速场到矩阵的转换。","rv":"该工作提出 DeepHartree，用 E(3)-等变网络在实空间预测哈特里势，经泊松方程反解电子密度，再经解析积分映射回 Kohn–Sham 矩阵，实现单次对角化即得前沿轨道与密度矩阵。方法核心是连续实空间神经场与 LCAO 电子结构的桥接，属于量子化学中神经网络代理模型，与有机分子晶体、视觉生成、相关数学关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01031","t":"Voxelotor Polymorphs: Crystalline Diversity of a Highly Potent Sickle Cell Anaemia Drug","a":"The solid-state landscape of highly flexible organic molecules often presents profound challenges and opportunities in materials chemistry, critically dictating macroscopic, physicochemical, and biopharmaceutical properties. Herein, we report voxelotor, a BCS Class II drug historically developed for sickle cell disease, as a noteworthy model system to elucidate nucleation pathways and a non-classical structure-performance relationship, with bioavailability that is critically dependent on its solid form. We report the preferential crystallization, multigram scale-up, and comprehensive structural elucidation of seven distinct polymorphic forms (Forms I-VII), including four previously undiscovered solid phases. Single-crystal X-ray diffraction and computational lattice energy calculations, including Hirshfeld surface analysis, show that its rich polymorphic diversity is rooted in extreme torsional adaptability (variations in τ2 from -160.0° to +110.0°), which drives parallel displaced π···π stacking and hydrogen-bonded assemblies. Thermal and humidity stress profiling discloses a complex relationship between thermodynamic stability and kinetic trapping. Notably, we identified paradoxical stability behavior in which seemingly robust, high lattice energy metastable states (e.g., Forms III, IV, V, and VI) undergo temperature- and moisture-promoted structural transformation and solid-state conversion to Form I crystals, which exhibit greater stability under ambient conditions.","au":["Christy P. George","Akram A. Khan","Parth S. Shaligram","Nagabhushan Shet","Tabrez R. Shaikh","Rinu Pandya","Ganesh More","Ziya Tufail","Kumar Vanka","Ajay Kumar"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01031","p":"2026-10-22","d":"2026-10-22","s":3.2,"tp":["csp"],"kw":["lattice energy"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01031","who":[],"tz":"Voxelotor 多晶型：一种高效镰状细胞贫血药物的晶体多样性","az":"高柔性有机分子的固态景观在材料化学中往往带来深刻的挑战与机遇，并关键性地决定其宏观、理化及生物制药性质。本文以 voxelotor（一种历史上用于治疗镰状细胞病的 BCS II 类药物）作为值得关注的模型体系，阐明其成核路径及非经典的构效关系，其生物利用度关键性地依赖于其固态形式。我们报道了七种不同多晶型（I 型至 VII 型）的优先结晶、多克级放大及全面结构解析，其中包括四种此前未被发现的固相。单晶 X 射线衍射与计算晶格能计算（包括 Hirshfeld 表面分析）表明，其丰富的多晶型多样性根源于极端的扭转适应性（τ2 在 -160.0° 至 +110.0° 之间变化），由此驱动平行位移 π···π 堆积和氢键组装体。热应力与湿度应力分析揭示了热力学稳定性与动力学捕获之间的复杂关系。值得注意的是，我们鉴定出一种悖论性稳定性行为：看似稳健的高晶格能亚稳态（如 III 型、IV 型、V 型和 VI 型）在温度和湿度促进下发生结构转变和固相转化，转变为 I 型晶体，而 I 型晶体在环境条件下表现出更高的稳定性。","rv":"以镰状细胞贫血药物 voxelotor 为对象，通过单晶 X 射线衍射、Hirshfeld 表面分析和晶格能计算，解析了七种多晶型结构并评估其热与湿度稳定性。核心发现是极端扭转自由度驱动平行位移 π 堆积与氢键组装，产生丰富多晶型及悖论性亚稳态转化。与「有机分子晶体」最为接近，涉及多晶型筛选与固相转化机制。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1021/acs.jctc.6c01588","t":"MARS: Machine-Learned Force Field Framework for Automated Conformational Sampling, Vibrational Spectroscopy, and Microsolvation","a":"We present MARS, an open-source Python package for automated conformational ensemble generation, infrared spectrum prediction, and explicit microsolvation of molecular systems. Built on JAX for GPU acceleration and automatic differentiation, MARS is carried out with machine-learned force fields (MLFFs), including SO3LR and MACE, with a four-phase conformational sampling workflow combining metadynamics, multitemperature molecular dynamics, and genetic algorithms. The package provides automated vibrational mode classification using Wilson B-matrix projections and functional group identification via graph-based pattern matching. We benchmark MARS on chemically diverse systems, including alkanes, halogenated aromatics, amino acids, peptides, drug-like molecules, phosphamides, host–guest complexes, and microsolvated biomolecular models. Semiempirical quantum-chemical methods have until now provided the practical state of the art for automated conformational sampling. Our benchmarks show that modern MLFFs can improve upon this paradigm by combining greater accuracy for high-level relative conformer energies with lower computational cost and more favorable scaling with molecular size. IR benchmarks against experimental gas-phase spectra additionally show performance comparable to quantum-chemical methods, with chemically interpretable mode assignments.","au":["Sergio Suárez-Dou","Miguel Gallegos","Florian N. Brünig","Alexandre Tkatchenko"],"v":"Journal of Chemical Theory and Computation","u":"https://doi.org/10.1021/acs.jctc.6c01588","p":"2026-10-21","d":"2026-10-21","s":5.9,"tp":["mlip"],"kw":["mace"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.jctc.6c01588","who":["Alexandre Tkatchenko"],"tz":"MARS：用于自动构象采样、振动光谱与微溶剂化的机器学习力场框架","az":"我们提出 MARS，一个用于分子体系自动构象系综生成、红外光谱预测和显式微溶剂化的开源 Python 包。MARS 基于 JAX 构建，支持 GPU 加速和自动微分，采用机器学习力场（MLFF），包括 SO3LR 和 MACE，并配备一个四阶段构象采样工作流，结合元动力学、多温度分子动力学和遗传算法。该包提供基于 Wilson B 矩阵投影的自动振动模式分类，以及基于图模式匹配的官能团识别。我们在化学多样性广泛的体系上对 MARS 进行了基准测试，包括烷烃、卤代芳烃、氨基酸、肽、类药分子、膦酰胺、主客体复合物和微溶剂化生物分子模型。半经验量子化学方法迄今为止一直是自动构象采样的实用最先进水平。我们的基准测试表明，现代 MLFF 能够在保持更高精度（针对高层级相对构象体能量）的同时，以更低的计算成本和更有利的分子尺寸标度关系超越这一范式。与实验气相光谱的红外基准测试还表明，其性能可与量子化学方法相当，且具有化学上可解释的模式归属。","rv":"MARS 是基于 JAX 的开源 Python 包，用 SO3LR 和 MACE 等机器学习力场执行四阶段构象采样（元动力学、多温度分子动力学、遗传算法），并自动完成振动模式分类与官能团识别。基准覆盖烷烃、氨基酸、药物分子等体系，表明现代 MLFF 在相对构象能精度与计算效率上优于半经验量子化学方法。与「有机分子晶体」最接近，属分子构象与光谱的计算化学工具；与生成模型、视觉生成关系弱。","tr":"high","tw":"作者：Alexandre Tkatchenko；期刊在重点名单","why":""},{"k":"doi:10.1021/acs.cgd.6c01209","t":"Chameleonic π-Hole Behavior in Metal−Isocyanide Complexes: N ↔ C Composition-Controlled Migration","a":"Cocrystal architecture reflects the cumulative outcome of competing and cooperating noncovalent interactions (NCIs) within the lattice. Here we demonstrate that the electrophilic π-hole of a coordinated aryl isocyanide is chameleonic: its localization migrates between the nitrogen and carbon termini of the C≡N bond in direct response to crystal composition. X-ray diffraction analysis of trans-[PdI2(CNC6H4Cl-4)2] (1) and its iodine cocrystals 1·I2 and 1·2I2, complemented by the isostructural platinum(II) analogue 2·I2, reveals three distinct binding regimes: Pd-πAr assembly in the parent complex, Pd-π-(CN) assembly at 1:1 stoichiometry, and π-(CN)-hole···I(LP) contacts at 1:2 stoichiometry. Quantum chemical analysis (Molecular Electrostatic Potential, Quantum Theory of Atoms in Molecules, NCIplot, Energy Decomposition Analysis, Natural Bond Orbital) establishes that the short C≡N bond and the small electrostatic differential between the two termini generate a delocalized π-hole that adapts to spatial demands imposed by competing halogen bonds. Energy decomposition further reveals that the N ↔ C migration is accompanied by a fundamental change in the stabilizing forces, from dispersion- and correlation-dominated stacking to orbital- and electrostatic-driven halogen bonding. These findings establish stoichiometry-controlled π-hole directionality as a design principle for engineering cocrystals in which multiple NCI types coexist in spatially optimized arrangements.","au":["Mikhail A. Kinzhalov","Polina V. Komova","Rosa M. Gomila","Antonio Frontera","Vadim Yu Kukushkin","Nadezhda A. Bokach"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c01209","p":"2026-10-21","d":"2026-10-21","s":3.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c01209","who":[],"tz":"金属-异氰化物配合物中变色龙式π-孔行为：N ↔ C 组成控制迁移","az":"共晶结构反映了晶格内竞争与合作的非共价相互作用（NCI）的累积结果。本文证明，配位的芳基异氰化物上的亲电π-孔具有变色龙特性：其定位在C≡N键的氮端和碳端之间迁移，直接响应晶体组成的变化。对反式-[PdI2(CNC6H4Cl-4)2]（1）及其碘共晶1·I2和1·2I2的X射线衍射分析，辅以同构的铂(II)类似物2·I2，揭示了三种不同的结合模式：母体配合物中的Pd-πAr组装、1:1化学计量比下的Pd-π-(CN)组装，以及1:2化学计量比下的π-(CN)-孔···I(LP)接触。量子化学分析（分子静电势、分子内原子量子理论、NCIplot、能量分解分析、自然键轨道）表明，短的C≡N键和两端之间微小的静电势差产生了一个离域π-孔，该π-孔能够适应竞争卤键所施加的空间需求。能量分解进一步揭示，N ↔ C迁移伴随着稳定力的根本变化，从色散和关联主导的堆积转变为轨道和静电驱动的卤键。这些发现确立了化学计量比控制的π-孔方向性作为设计原则，用于构建多种NCI类型在空间优化排列中共存的共晶体。","rv":"本文研究金属-异氰化物配合物中π-孔随晶体组成在C≡N键两端间的变色龙式迁移，结合X射线衍射与MESP、QTAIM、EDA、NBO等量子化学手段阐明迁移机制及稳定力转变。对象为含有机配体的配合物共晶体系，与「有机分子晶体」最为接近，核心是非共价相互作用的晶体工程，与生成模型、视觉生成关系较弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1107/s2052252526008912","t":"The overlooked ZIF: reviving [Cu(imidazolato) 2 ] from 1960s literature","a":"Metal–organic frameworks (MOFs), and in particular zeolitic imidazolate frameworks (ZIFs), are amongst the most well studied materials in modern chemistry. MOFs emerged as an explicit subfield of chemistry in the late 1980s and 1990s. However, much foundational work was accomplished in earlier decades. Here, we detail the structural and gas-adsorption characterization of [Cu(im) 2 ] (im = imidazolate), a ZIF that was widely reported in the early 1960s. This compound exists as several polymorphs. We re-prepared the historic blue polymorph [Cu(im) 2 ]-B, which has a sodalite topology, confirmed its identity by single-crystal X-ray diffraction, and measured its gas-adsorption isotherms. We conclude that the true origin of ZIFs lies with a copper(II) framework discovered more than 60 years ago that has been overlooked by recent literature.","au":["Cara Bosman","Shane G. Telfer"],"v":"IUCrJ","u":"https://doi.org/10.1107/s2052252526008912","p":"2026-10-20","d":"2026-10-20","s":3.8,"tp":["csp"],"kw":["polymorph"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1107/s2052252526008912","who":[],"tz":"被忽视的 ZIF：从 1960 年代文献中重新发现 [Cu(imidazolato)₂]","az":"金属有机框架（MOFs），尤其是沸石咪唑酯骨架材料（ZIFs），是现代化学中研究最为深入的材料之一。MOFs 在 20 世纪 80 年代末至 90 年代才作为一个明确的化学子领域出现。然而，大量基础性工作早在更早的几十年就已完成。本文详细报道了 [Cu(im)₂]（im = 咪唑酸根）的结构与气体吸附表征，该 ZIF 在 20 世纪 60 年代初曾被广泛报道。该化合物存在多种多晶型。我们重新合成了具有方钠石（sodalite）拓扑结构的经典蓝色多晶型 [Cu(im)₂]-B，通过单晶 X 射线衍射确认了其身份，并测量了其气体吸附等温线。我们得出结论：ZIFs 的真正起源是一个 60 多年前被发现、却被近年文献所忽视的铜(II)框架。","rv":"本文重新合成了 1960 年代报道的蓝色多晶型 [Cu(im)₂]-B，用单晶 X 射线衍射确认其方钠石拓扑结构并测量气体吸附等温线，旨在纠正 ZIF 起源被近年文献忽视的历史。属于配位聚合物与有机分子晶体的结构表征工作，与「有机分子晶体」最接近，与生成模型、视觉生成无直接关联。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1039/d6ce00683c","t":"The Effect of High Pressure on Nanoporous Molecular Crystals of Cofacial Porphyrin/Phthalocyanine Heterodimers","a":"High-pressure single-crystal X-ray diffraction was used to characterize two phthalocyanine nanoporous crystals (PNCs) based on cofacial heterodimers of tetraphenylporphyrin (TPPCo) and octa(2’,6’-di-iso-propylphenoxy)phthalocyanine [(dipPhO)8PcCo], with and without a 4,4’-bipyridine \"wall-tie\" ligand....","au":["Gemma Turner","Nikolaos-Angelos Stamos","Shannah Kerrigan","Rebecca Blake","James Ross Brookes","Aston M Summers","Stephanie Bird","Rosemary Young","Alan Riboldi-Tunnicliffe","Rachel Williamson"],"v":"CrystEngComm","u":"https://doi.org/10.1039/d6ce00683c","p":"2026-10-20","d":"2026-10-20","s":3.7,"tp":["csp"],"kw":["molecular crystals"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1039/d6ce00683c","who":[],"tz":"高压对共面卟啉/酞菁异二聚体纳米多孔分子晶体的影响","az":"高压单晶X射线衍射被用于表征两种酞菁纳米多孔晶体（PNC），它们基于四苯基卟啉（TPPCo）与八(2',6'-二异丙基苯氧基)酞菁[(dipPhO)8PcCo]的共面异二聚体，分别含和不含4,4'-联吡啶「wall-tie」配体。....","rv":"研究对象为卟啉/酞菁共面异二聚体组装的纳米多孔分子晶体，采用高压单晶X射线衍射表征含与不含4,4'-联吡啶「壁连」配体两种体系在高压下的结构变化。属于有机分子晶体范畴，与生成模型、视觉生成及数学无直接关联。","tr":"mid","tw":"期刊在关注名单；正式发表","why":""},{"k":"doi:10.1021/acs.cgd.6c00813","t":"Insights into the Nature and Thermal Phase Behavior of Mechanochemically Prepared Multicomponent Solids of 2-Amino-5-nitropyridine with para -Substituted Benzoic Acids","a":"The thermal phase behavior of binary systems consisting of the supramolecular building block 2-amino-5-nitropyridine (ANP) with five systematically varied series of para-substituted aromatic acids (4XBA), viz, benzoic acid (BA), 4-fluorobenzoic acid (4FBA), 4-chlorobenzoic acid (4CBA), 4-bromobenzoic acid (4BBA), and 4-iodobenzoic acid (4IBA), was investigated separately. While single-crystal structures of 1:1 ANP-4FBA, 1:1 ANP-4CBA, and 1:1 ANP-4BBA in this series are known, their bulk thermodynamic stability and mechanochemical phase behavior have remained unmapped. The bulk binary mixtures of various compositions were prepared by an environmentally friendly mechanochemical neat grinding method. The thermal properties of the ground materials were thoroughly mapped using differential scanning calorimetry (DSC). The solid−liquid thermal binary phase diagrams were systematically constructed using DSC data and validated using Tammann plots and Predictor of Eutectic Mixture (PoEM) analysis. The phase diagram study of all the five systems revealed the distinct thermal phase behavior across the series. The ANP-4FBA system forms a stable congruently melting 1:1 cocrystal characterized by a “W-shaped” phase diagram with two eutectic valleys, while the ANP-BA, ANP-4CBA, and ANP-4BBA systems form an incongruent 1:1 cocrystal characterized by an asymmetrical liquidus curve terminating at a horizontal peritectic isothermal line in their phase diagrams.","au":["K. S. Prabhuswamy","S. Naveen","Y. N. Sudhakar","P. A. Suchetan"],"v":"Crystal Growth & Design","u":"https://doi.org/10.1021/acs.cgd.6c00813","p":"2026-10-20","d":"2026-10-20","s":3.2,"tp":["csp"],"kw":["cocrystal"],"src":["crossref"],"kind":"paper","ax":"","doi":"10.1021/acs.cgd.6c00813","who":[],"tz":"2-氨基-5-硝基吡啶与对位取代苯甲酸机械化学制备多组分固体的性质及热相行为研究","az":"由超分子构建块2-氨基-5-硝基吡啶（ANP）与五个系统变化的对位取代芳香酸（4XBA）系列——即苯甲酸（BA）、4-氟苯甲酸（4FBA）、4-氯苯甲酸（4CBA）、4-溴苯甲酸（4BBA）和4-碘苯甲酸（4IBA）——组成的二元体系的热相行为被分别进行了研究。虽然该系列中1:1 ANP-4FBA、1:1 ANP-4CBA和1:1 ANP-4BBA的单晶结构已知，但其体相热力学稳定性和机械化学相行为尚未被表征。各种组成的体相二元混合物通过一种环境友好的机械化学纯研磨方法制备。研磨材料的热性质通过差示扫描量热法（DSC）进行了全面表征。固-液热二元相图利用DSC数据系统构建，并通过Tammann图和共晶混合物预测器（PoEM）分析进行验证。所有五个体系的相图研究揭示了该系列中不同的热相行为。ANP-4FBA体系形成稳定的同熔1:1共晶体，其特征是具有两个共晶谷的「W形」相图；而ANP-BA、ANP-4CBA和ANP-4BBA体系形成异熔1:1共晶体，其特征是相图中不对称的液相线终止于水平的包晶等温线。","rv":"以2-氨基-5-硝基吡啶与五种对位取代苯甲酸为对象，用机械化学纯研磨制备体相二元混合物，通过DSC系统构建固-液热二元相图，并用Tammann图和PoEM分析验证。揭示了同熔与异熔共晶体的不同相图特征。属于有机分子晶体领域，与生成模型、视觉生成及相关数学关系弱。","tr":"high","tw":"期刊在重点名单","why":""},{"k":"doi:10.1039/d6ce00725b","t":"Dual-halogen engineering of chlorothienyl chalcone crystals for tunable noncentrosymmetric packing and enhanced terahertz nonlinear optical response","a":"Fluorine substitution optimizes crystal growth and polar packing in chlorothienyl chalcone crystals, leading to enhanced SHG response and broadband THz emission.","au":["Fanghao Xuan","Yukang Liang","Yanxi Deng","Luyao Jiang","Chuyi Liang","Yurong Ma"],"v":"CrystEngComm","u":"https://doi.org/10.1039/d6ce00725b","p":"       : '';
    list.innerHTML=`<div class="empty"><b>${esc(scope)}里没有符合条件的条目</b>
      可切换到「近 7 天」或「全部」查看已有论文。每天 07:30 启动更新。${hint}</div>`;
    const b=$('#searchAll'); if(b) b.onclick=()=>{ state.view='all'; state.limit=DEFAULTS.limit; touch(); renderAll(); };
    renderCrumb(); return;
  }
  const shown=view.slice(0,state.limit);
  const byTopic=state.sort==='topic';
  let html='', last=null;
  shown.forEach(it=>{
    const g=byTopic?('tp:'+(it.tp[0]||'other')):it.d;
    if(g!==last){
      last=g;
      if(byTopic){
        const tid=it.tp[0]||'other', n=view.filter(x=>(x.tp[0]||'other')===tid).length;
        html+=`<div class="daybar"><span class="chip" style="--h:${THUE[tid]||210}">${esc(TNAME[tid]||'其他')}</span><span class="muted">${n} 条</span></div>`;
      }else{
        const n=view.filter(x=>x.d===it.d).length;
        html+=`<div class="daybar"><b>${it.d}</b><span class="wd">周${weekday(it.d)}</span><span class="muted">${n} 条</span>${it.d===TODAY?'<span class="chip kind">今天</span>':''}</div>`;
      }
    }
    html+=card(it);
  });
  if(view.length>shown.length) html+=`<button class="morebtn" id="more">继续加载（还有 ${view.length-shown.length} 条）</button>`;
  list.innerHTML=html;
  renderCrumb();
  const m=$('#more'); if(m) m.onclick=()=>{ state.limit+=120; touch(); renderList(); };
}
function renderCrumb(){
  const names={today:'今天',unread:'未读',star:'只看收藏',week:'近 7 天',all:'全部',day:(state.date||'')};
  const label=state.view==='day'?(state.date||''):names[state.view];
  const bits=[];
  if(state.topics.length) bits.push(state.topics.map(t=>TNAME[t]||t).join(' + '));
  if(state.sources.length) bits.push(state.sources.map(s=>SRCNAME[s]||s).join(' + '));
  if(state.q) bits.push('“'+state.q+'”');
  const unread=view.filter(x=>!state.read[x.k]).length;
  $('#crumb').innerHTML=`${esc(label)} <small>${view.length} 条${unread?` · 未读 ${unread}`:''}${bits.length?' · '+esc(bits.join(' · ')):''}</small>`;
}
function renderStats(){
  if(!view.length){ $('#stats').innerHTML=''; return; }
  const vc={}, kc={}, tc={};
  view.forEach(it=>{ if(it.v) vc[it.v]=(vc[it.v]||0)+1; it.kw.forEach(k=>kc[k]=(kc[k]||0)+1); it.tp.forEach(t=>tc[t]=(tc[t]||0)+1); });
  const top=(obj,n)=>Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,n);
  const kv=(label,arr,kind)=>`<div class="grp"><b>${label}</b>${arr.map(([k,n])=>
    `<button class="kv" data-q="${esc(k)}">${esc(k)}<i>${n}</i></button>`).join('')||'<span class="muted" style="font-size:11.5px">—</span>'}</div>`;
  $('#stats').innerHTML=`<h3>当前筛选的构成（点任意项可直接搜索）</h3>
    ${kv('主题', top(tc,6).map(([t,n])=>[TNAME[t]||t,n]),'t')}
    ${kv('期刊', top(vc,6),'v')}
    ${kv('高频命中词', top(kc,10),'k')}`;
}
function renderEvents(){
  const ev=EVENTS||[];
  renderStats();
  $('#events').innerHTML=`<h3>会议与活动（未来 120 天，日期以官网为准）</h3>`+
    (ev.length?ev.map(e=>`<a class="ev" href="${esc(e.u)}" target="_blank" rel="noopener">
      <b>${e.d.slice(5)}</b><span>${esc(e.n)}</span><em>${e.in} 天后</em></a>`).join('')
    :'<div class="muted">暂无</div>');
}

/* ---------------- actions ---------------- */
function renderOverview(){
  const host=$('#overview'); const o=(DATA.overview||'').trim();
  if(!o){ host.remove(); return; }
  host.innerHTML=`<div class="ovhead">今日点评 · 由配置的 agent 生成</div><p>${esc(o)}</p>`;
}
function renderAll(){ compute(); renderViews(); renderFilters(); renderDates(); renderList(); renderTrend(); renderEvents(); }
function toggleRead(k){ state.read[k]=!state.read[k]; if(!state.read[k]) delete state.read[k]; touch(); renderAll(); }
function toggleStar(k){
  if(state.star[k]) delete state.star[k];
  else state.star[k]=true;
  applyKept();
  touch();
  renderAll();
}
function markAllRead(){ view.forEach(it=>state.read[it.k]=true); touch(); renderAll(); toast('已把当前 '+view.length+' 条标记为已读'); }
function clearFilters(){ state.topics=[]; state.sources=[]; state.q=''; state.limit=DEFAULTS.limit; $('#q').value=''; touch(); renderAll(); }
function copyText(text,okMsg){
  const done=()=>toast(okMsg||'已复制');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done,()=>fallback()); }
  else fallback();
  function fallback(){ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择');} ta.remove(); }
}
function bibtex(it){
  const year=(it.p||it.d||'').slice(0,4);
  const first=(it.au[0]||'anon').split(/\s+/).slice(-1)[0].toLowerCase().replace(/[^a-z]/g,'');
  const key=(first||'ref')+year+(it.k||'').replace(/[^a-z0-9]/gi,'').slice(-4);
  const authors=it.au.join(' and ');
  const fields=[`title = {${it.t}}`,authors?`author = {${authors}}`:'',it.v?`journal = {${it.v}}`:'',
    year?`year = {${year}}`:'',it.doi?`doi = {${it.doi}}`:'',it.ax?`eprint = {${it.ax}}`:(it.u?`url = {${it.u}}`:'')].filter(Boolean);
  return `@article{${key},\n  ${fields.join(',\n  ')}\n}`;
}
function mdOf(list){
  const lines=[`# 科研雷达 · ${TODAY} · 导出 ${list.length} 条`,''];
  list.forEach(it=>{
    lines.push(`- **[${it.t}](${it.u})**`);
    const meta=[it.v,it.p,it.tp.map(t=>TNAME[t]||t).join('/'),`相关度 ${it.s}`].filter(Boolean).join(' · ');
    lines.push(`  ${meta}`);
    if(it.a) lines.push(`  > ${it.a}`);
  });
  return lines.join('\n')+'\n';
}
function download(name,text){
  const blob=new Blob([text],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function setTheme(t){ state.theme=t; touch(); document.documentElement.dataset.theme=t; toast('主题：'+({auto:'跟随系统',light:'浅色',dark:'深色'}[t])); }

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-topic],[data-source],[data-date],[data-open],.btn-read,.btn-star,.btn-more,.btn-copy');
  if(!t) return;
  if(t.dataset.q!==undefined&&t.classList.contains('who')){ state.q=t.dataset.q; $('#q').value=state.q; state.limit=DEFAULTS.limit; touch(); renderAll(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.view){ state.view=t.dataset.view; state.date=null; state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.topic){ const id=t.dataset.topic; const i=state.topics.indexOf(id);
    if(i>=0) state.topics.splice(i,1); else state.topics.push(id);
    state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.source){ const id=t.dataset.source; const i=state.sources.indexOf(id);
    if(i>=0) state.sources.splice(i,1); else state.sources.push(id);
    state.limit=DEFAULTS.limit; touch(); renderAll(); return; }
  if(t.dataset.date){ state.view='day'; state.date=t.dataset.date; state.limit=DEFAULTS.limit; touch(); renderAll();
    window.scrollTo({top:0,behavior:'smooth'}); return; }
  const cardEl=t.closest('.card'); if(!cardEl) return; const k=cardEl.dataset.k;
  if(t.classList.contains('btn-read')){ toggleRead(k); return; }
  if(t.classList.contains('btn-star')){ toggleStar(k); return; }
  if(t.classList.contains('btn-more')){
    if(openSet.has(k)) openSet.delete(k); else openSet.add(k);
    cardEl.classList.toggle('open'); t.textContent=openSet.has(k)?'收起':'详情'; return; }
  if(t.classList.contains('btn-copy')){ const it=ITEMS.find(x=>x.k===k); if(it) copyText(bibtex(it),'已复制 BibTeX'); return; }
  if(t.dataset.open){ state.read[k]=true; touch(); const dot=cardEl.querySelector('.btn-read'); if(dot) dot.textContent='✓'; cardEl.classList.add('read'); renderViews(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ state.q=e.target.value.trim(); state.limit=DEFAULTS.limit; clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{touch(); renderAll();},140); return; }
  if(e.target.classList.contains('note')){
    const k=e.target.closest('.card').dataset.k; const v=e.target.value;
    if(v) state.note[k]=v; else delete state.note[k]; touch(); }
});
$('#sort').addEventListener('change',e=>{ state.sort=e.target.value; touch(); compute(); renderList(); });
$('#btnReadAll').addEventListener('click',markAllRead);
$('#btnClear').addEventListener('click',clearFilters);
$('#btnExport').onclick=()=>{ if(!view.length){toast('当前没有可导出的条目');return;} download(`radar-${TODAY}.md`,mdOf(view)); toast('已导出 Markdown'); };
$('#btnTheme').onclick=()=>{ const order=['auto','light','dark']; setTheme(order[(order.indexOf(state.theme)+1)%3]); };
$('#btnHelp').onclick=()=>toggleHelp();
$('#helpHost').addEventListener('click',e=>{ if(e.target.closest('.help')===e.target||e.target.dataset.close!==undefined) toggleHelp(false); });
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea'||tag==='select') { if(e.key==='Escape') e.target.blur(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='/'){ e.preventDefault(); $('#q').focus(); return; }
  if(e.key==='?'){ e.preventDefault(); toggleHelp(); return; }
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); moveFocus(1); return; }
  if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); moveFocus(-1); return; }
  if(e.key==='Escape'){ toggleHelp(false); clearFilters(); return; }
  const el=document.querySelector('.card.focus'); if(!el){ if(['o','s','m','e'].includes(e.key)){ moveFocus(1);} else return; }
  const k=el&&el.dataset.k; if(!k) return;
  if(e.key==='o'){ const it=ITEMS.find(x=>x.k===k); if(it&&it.u){ state.read[k]=true; touch(); window.open(it.u,'_blank','noopener'); renderAll(); } }
  if(e.key==='s'){ toggleStar(k); }
  if(e.key==='m'){ toggleRead(k); }
  if(e.key==='e'){ if(openSet.has(k)) openSet.delete(k); else openSet.add(k);
    el.classList.toggle('open'); const b=el.querySelector('.btn-more'); if(b) b.textContent=openSet.has(k)?'收起':'详情'; }
});
function moveFocus(dir){
  const cards=$$('#list .card'); if(!cards.length) return;
  const cur=cards.findIndex(c=>c.classList.contains('focus'));
  focusIdx=cur<0?0:Math.max(0,Math.min(cards.length-1,cur+dir));
  cards.forEach(c=>c.classList.remove('focus'));
  const el=cards[focusIdx]; el.classList.add('focus'); el.scrollIntoView({block:'center',behavior:'smooth'});
}
function toggleHelp(force){
  const host=$('#helpHost');
  if(host.firstChild && force!==true){ host.innerHTML=''; return; }
  if(force===false){ host.innerHTML=''; return; }
  host.innerHTML=`<div class="help"><div class="box"><h4>快捷键</h4><table>
    <tr><td>j / ↓</td><td>下一条</td></tr>
    <tr><td>k / ↑</td><td>上一条</td></tr>
    <tr><td>o</td><td>打开原文（并标记已读）</td></tr>
    <tr><td>s</td><td>收藏，侧栏「只看收藏」只显示这些</td></tr>
    <tr><td>m</td><td>已读 / 未读</td></tr>
    <tr><td>e</td><td>展开详情与备注</td></tr>
    <tr><td>/</td><td>搜索</td></tr>
    <tr><td>Esc</td><td>关闭 / 清除筛选</td></tr></table>
    <p class="muted" style="font-size:12px;margin:10px 0 0">阅读状态、收藏、备注存在这台浏览器里，换浏览器不会同步。点星标会留下文章副本：超过 120 天或数据库清理之后，仍可在「只看收藏」和「全部」里看到。取消收藏后，过期文章不再保留。</p>
    </div></div>`;
}

/* ---------------- init ---------------- */
load();
applyKept();
if(state.view==='day'&&!state.date) state.view='today';
if(state.lastVisit){
  const fresh=ITEMS.filter(i=>i.d===TODAY&&!state.read[i.k]).length;
  if(fresh) setTimeout(()=>toast(`今天有 ${fresh} 条未读`),600);
}
state.lastVisit=Date.now(); save();
document.documentElement.dataset.theme=state.theme||'auto';
$('#q').value=state.q||'';
$('#sort').value=state.sort||'score';
$('#generated').textContent=`${DATA.generated} · ${ITEMS.length} 条 · ${DAYS.length} 天`;
renderOverview();
renderAll();
})();
</script>
</body>
</html>
